<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IAkids – Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#f3f4f6;
}

header{
  background:#0f172a;
  color:white;
  padding:18px 24px;
  font-size:20px;
  font-weight:700;
}

.container{
  padding:30px;
  max-width:1200px;
  margin:auto;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin-bottom:40px;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.card h3{
  margin:0;
  font-size:14px;
  color:#6b7280;
}

.value{
  font-size:28px;
  font-weight:800;
  margin-top:8px;
}

canvas{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}
</style>
</head>
<body>

<header>
IAkids – Admin Dashboard
</header>

<div class="container">

<div class="cards">
  <div class="card">
    <h3>Total Users</h3>
    <div class="value" id="total">0</div>
  </div>

  <div class="card">
    <h3>Free Active</h3>
    <div class="value" id="free">0</div>
  </div>

  <div class="card">
    <h3>Paying Active</h3>
    <div class="value" id="paying">0</div>
  </div>

  <div class="card">
    <h3>Cancelled</h3>
    <div class="value" id="cancelled">0</div>
  </div>

  <div class="card">
    <h3>MRR ($)</h3>
    <div class="value" id="mrr">0</div>
  </div>
</div>

<h2>New Users per Day</h2>
<canvas id="usersChart"></canvas>

</div>

<script>
/* ===== SAME CONNECTION AS WORKSPACE ===== */

const SUPABASE_URL = "https://bxnfzuglfwytiyaguwjj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9....";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ===== REQUIRE LOGIN ===== */

(async () => {

  const { data } = await sb.auth.getSession();

  if (!data.session){
    alert("Not logged in");
    return;
  }

  loadDashboard();

})();

/* ===== LOAD DATA ===== */

async function loadDashboard(){

  const { data, error } = await sb
    .from("subscriptions")
    .select("*");

  if(error){
    console.error(error);
    alert("Error loading subscriptions");
    return;
  }

  const total = data.length;
  const free = data.filter(u => u.plan === "free" && u.status === "active").length;
  const paying = data.filter(u => u.plan !== "free" && u.status === "active").length;
  const cancelled = data.filter(u => u.status === "cancelled").length;

  const MENSUAL_PRICE = 9.99;
  const mrr = paying * MENSUAL_PRICE;

  document.getElementById("total").textContent = total;
  document.getElementById("free").textContent = free;
  document.getElementById("paying").textContent = paying;
  document.getElementById("cancelled").textContent = cancelled;
  document.getElementById("mrr").textContent = mrr.toFixed(2);

  /* ===== USERS PER DAY ===== */

  const grouped = {};

  data.forEach(user => {
    const date = new Date(user.created_at)
      .toISOString()
      .split("T")[0];

    grouped[date] = (grouped[date] || 0) + 1;
  });

  const labels = Object.keys(grouped).sort();
  const values = labels.map(d => grouped[d]);

  new Chart(document.getElementById("usersChart"), {
    type:"line",
    data:{
      labels,
      datasets:[{
        label:"New Users",
        data:values,
        borderColor:"#3b82f6",
        tension:.3
      }]
    }
  });
}
</script>

</body>
</html>
