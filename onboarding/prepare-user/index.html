<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Prepare User</title>
</head>
<body>
  <h1>Prepare User – Debug</h1>
  <pre id="log"></pre>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bxnfzuglfwytiyaguwjj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4bmZ6dWdsZnd5dGl5YWd1d2pqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkyMjk0NjUsImV4cCI6MjA4NDgwNTQ2NX0.IcmVvbboKLkJLkE31_udEtvhPl66-kmZAvmPCT_lk5o";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const log = (msg) => {
  console.log(msg);
  document.getElementById("log").textContent += msg + "\n";
};

(async () => {
  log("Preparing user...");

  // 🔑 VERY IMPORTANT: read OAuth session from URL hash
  const { data: sessionData, error: sessionError } =
    await sb.auth.getSession();

  if (!sessionData.session) {
    log("No session yet, trying to set from URL...");

    const { data, error } = await sb.auth.setSession({
      access_token: new URLSearchParams(window.location.hash.substring(1)).get("access_token"),
      refresh_token: new URLSearchParams(window.location.hash.substring(1)).get("refresh_token"),
    });

    if (error) {
      log("❌ setSession failed: " + error.message);
      return;
    }

    log("✅ Session created from URL");
  } else {
    log("✅ Session already exists");
  }

  // 👤 Get user
  const { data: userData, error: userError } = await sb.auth.getUser();

  if (userError || !userData.user) {
    log("❌ No auth user");
    return;
  }

  const user = userData.user;
  log("✅ User ID: " + user.id);
  log("Email: " + user.email);

  // 🧪 Test insert
  const { error: insertError } = await sb
    .from("subscriptions")
    .insert({
      user_id: user.id,
      plan: "free",
      status: "active"
    });

  if (insertError) {
    log("❌ Insert failed: " + insertError.message);
    return;
  }

  log("✅ Subscription row created");

})();
</script>


</body>
</html>
