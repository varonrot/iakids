<!DOCTYPE html>

  <meta charset="UTF-8" />
  <title>Prepare User</title>
</head>
<body>
  <h1>Prepare User – Debug</h1>
  <pre id="log"></pre>
 
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bxnfzuglfwytiyaguwjj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4bmZ6dWdsZnd5dGl5YWd1d2pqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkyMjk0NjUsImV4cCI6MjA4NDgwNTQ2NX0.IcmVvbboKLkJLkE31_udEtvhPl66-kmZAvmPCT_lk5o";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const log = (msg) => {
  console.log(msg);
  document.getElementById("log").textContent += msg + "\n";
};

(async () => {
  log("Checking session...");

  // 1️⃣ Get session (OAuth already finished)
  const { data: sessionData, error: sessionError } =
    await sb.auth.getSession();

  if (sessionError || !sessionData.session) {
    log("❌ No session found");
    return;
  }

  log("✅ Session found");

  // 2️⃣ Get user
  const { data: userData, error: userError } =
    await sb.auth.getUser();

  if (userError || !userData.user) {
    log("❌ No auth user");
    return;
  }

  const user = userData.user;
  log("✅ User ID: " + user.id);
  log("Email: " + user.email);

  // 3️⃣ Test insert
  const { error: insertError } = await sb
    .from("subscriptions")
    .insert({
      user_id: user.id,
      plan: "free",
      status: "active"
    });

  if (insertError) {
    log("❌ Insert failed: " + insertError.message);
    return;
  }

  log("✅ Subscription row created");

  // window.location.href = "/onboarding/complete/";
})();
</script>

</body>
</html>
