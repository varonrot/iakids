<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:#f8fafc;
    }
    .box{text-align:center}
  </style>
</head>

<body>
  <div class="box">
    <h2>Finalizing child profile…</h2>
  </div>

<script>
const sb = supabase.createClient(
  "https://bxnfzuglfwytiyaguwjj.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4bmZ6dWdsZnd5dGl5YWd1d2pqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkyMjk0NjUsImV4cCI6MjA4NDgwNTQ2NX0.IcmVvbboKLkJLkE31_udEtvhPl66-kmZAvmPCT_lk5o"
);

(async () => {
  console.log("▶ COMPLETE START");

  /* 1️⃣ get authenticated user */
  const { data: userRes, error: userErr } = await sb.auth.getUser();
  if (userErr || !userRes?.user) {
    console.error("❌ no auth user", userErr);
    alert("No authenticated user");
    return;
  }

  const userId = userRes.user.id;
  console.log("✅ auth user:", userId);

  /* 2️⃣ read child data from SESSION STORAGE */
  const child_name = sessionStorage.getItem("child_name");
  const age = Number(sessionStorage.getItem("child_age"));
  const avatar_key = sessionStorage.getItem("child_avatar");

  const usage_goals = JSON.parse(
    sessionStorage.getItem("kid_usage") || "[]"
  );

  const learning_interests = JSON.parse(
    sessionStorage.getItem("learning_interests") || "[]"
  );

  const payload = {
    user_id: userId,
    child_name,
    age,
    avatar_key,
    usage_goals,
    learning_interests
  };

  console.log("📦 INSERT PAYLOAD:", payload);

/* 3️⃣ validate */
if (!child_name || !age) {
  console.log("ℹ️ No onboarding data, redirecting to workspace");
  window.location.replace("/workspace/");
  return;
}

  /* 4️⃣ INSERT */
  const { data, error } = await sb
    .from("kids_profiles")
    .insert(payload)
    .select();

  if (error) {
    console.error("❌ INSERT ERROR", error);
    alert(error.message);
    return;
  }

  console.log("✅ INSERTED:", data);

  /* 5️⃣ cleanup + redirect */
  sessionStorage.setItem("kid_profile_saved", "1");
  window.location.replace("/workspace/");

})();
</script>

</body>
</html>
