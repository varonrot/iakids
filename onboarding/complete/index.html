<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Complete setup</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background:#f6f7fb;
}
.card{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:18px;
  padding:28px;
  box-shadow:0 20px 50px rgba(0,0,0,.12);
}
h1{margin:0 0 16px}
label{display:block;margin-top:14px;font-size:14px}
input,select{
  width:100%;
  padding:10px 12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ddd;
}
button{
  margin-top:22px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#4f46e5;
  color:white;
  font-size:16px;
  cursor:pointer;
}
.status{
  margin-top:14px;
  font-size:14px;
  color:#6b7280;
}
</style>
</head>

<body>

<div class="card">
  <h1>Tell us about your child</h1>

  <label>
    Child name
    <input id="child_name" placeholder="Alex" />
  </label>

  <label>
    Age
    <input id="age" type="number" min="3" max="16" />
  </label>

  <label>
    Avatar
    <select id="avatar_key">
      <option value="robot">🤖 Robot</option>
      <option value="cat">🐱 Cat</option>
      <option value="fox">🦊 Fox</option>
    </select>
  </label>

  <button id="save">Complete setup</button>
  <div class="status" id="status"></div>
</div>

<script>
const SUPABASE_URL = "https://bxnfzuglfwytiyaguwjj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4bmZ6dWdsZnd5dGl5YWd1d2pqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkyMjk0NjUsImV4cCI6MjA4NDgwNTQ2NX0.IcmVvbboKLkJLkE31_udEtvhPl66-kmZAvmPCT_lk5o";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const statusEl = document.getElementById("status");

const setStatus = (t) => statusEl.textContent = t;

document.getElementById("save").onclick = async () => {
  setStatus("Saving profile…");

  const { data: userData } = await sb.auth.getUser();
  if (!userData?.user) {
    setStatus("Not logged in");
    return;
  }

  const child_name = document.getElementById("child_name").value.trim();
  const age = parseInt(document.getElementById("age").value);
  const avatar_key = document.getElementById("avatar_key").value;

  if (!child_name || !age) {
    setStatus("Please fill all fields");
    return;
  }

  const { error } = await sb.from("kids_profiles").insert({
    user_id: userData.user.id,
    child_name,
    age,
    avatar_key,
    usage_goals: { help: true },
    learning_interests: { general: true }
  });

  if (error) {
    console.error(error);
    setStatus("Failed to save");
    return;
  }

  setStatus("All set! Redirecting…");

  setTimeout(() => {
    window.location.href = "/app/";
  }, 1200);
};
</script>

</body>
</html>
