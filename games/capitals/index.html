<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>עיר בירה ומדינה | iakids</title>

<link rel="stylesheet" href="../game-style.css">

<style>.game-card{width:min(560px,calc(100vw - 28px))!important}.game-hud{gap:34px}.game-title{font-size:clamp(2.15rem,7vw,3.1rem)!important}#howto{max-width:420px}/* GAME */.memory-note{color:#d5e4fb;font-size:.95rem;font-weight:800;margin:0 auto 12px;text-align:center}#grid{display:grid;gap:11px;margin-top:12px}.mcard{cursor:pointer;height:82px;perspective:700px;touch-action:manipulation}.mcard .inner{height:100%;position:relative;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.2,.75,.25,1);width:100%}

.mcard.flipped .inner{transform:rotateY(180deg)}.face{-webkit-backface-visibility:hidden;align-items:center;backface-visibility:hidden;border-radius:16px;box-shadow:0 10px 22px rgba(0,0,0,.18);display:flex;font-weight:900;inset:0;justify-content:center;padding:6px;position:absolute;text-align:center}.face.front{background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.18),transparent 34%),linear-gradient(160deg,#3369db,#6840dc);border:1px solid rgba(149,195,255,.45);color:#fff;font-size:1.8rem}.face.back{background:linear-gradient(180deg,#1a4d89,#0e3568);border:1px solid rgba(116,186,255,.40);color:#fff;font-size:1rem;line-height:1.25;transform:rotateY(180deg)}.mcard.matched .face.back{background:linear-gradient(180deg,#2acb7a,#15965a);border-color:rgba(112,255,183,.75);color:#fff}.mcard.matched{cursor:default;filter:drop-shadow(0 0 11px rgba(54,220,136,.24))}/* END */#moves-line{color:#d7e3f7!important}

@media(max-width:600px){.game-hud{font-size:.88rem;gap:18px;padding:12px 10px!important}

  .mcard{height:76px}
  .face.back{font-size:.88rem}
}
</style>
</head>

<body class="theme-space">

<div class="game-hud">
  <span class="score">
    <span id="score-label">ניקוד</span>:
    <span id="score">0</span>
  </span>

  <span>
    <span id="pairs-label">זוגות</span>
    <span id="qnum">0</span>/<span id="qtotal">10</span>
  </span>

  <span>
    👣 <span id="moves">0</span>
  </span>
</div>

<div class="game-card" id="card">

  <div id="start-screen">
    <div class="hero-icon">🏛️🌍</div>

    <h1 class="game-title" id="title"></h1>

    <p id="howto"></p>

    <p class="section-label" id="rounds-label"></p>

    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline success" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>

    <p class="section-label" id="level-label"></p>

    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)"></button>
      <button class="game-btn" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div class="memory-note" id="memory-note"></div>
    <div id="grid"></div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="moves-line"></p>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>

<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);

const T_REGULAR = {
  title:{he:'עיר בירה ומדינה',en:'Country & Capital'},
  howto:{
    he:'מצאו זוגות: שם המדינה ועיר הבירה שלה. פחות מהלכים = יותר כוכבים!',
    en:'Match each country with its capital. Fewer moves = more stars!'
  },
  rounds:{he:'כמה זוגות למצוא?',en:'How many pairs?'},
  pairs:{he:'זוגות',en:'Pairs'},
  moves:{he:'מהלכים',en:'Moves'},
  newboard:{he:'לוח חדש! 🃏',en:'New board! 🃏'},
  level:{he:'בחרו רמת קושי',en:'Choose difficulty'},
  memory:{he:'הפכו שני קלפים ומצאו מדינה ועיר בירה שמתאימות זו לזו',en:'Flip two cards and match a country with its capital'}
};

const T_NIQQUD = {
  title:{he:'עִיר בִּירָה וּמְדִינָה',en:'Country & Capital'},
  howto:{
    he:'מִצְאוּ זוּגוֹת: שֵׁם הַמְּדִינָה וְעִיר הַבִּירָה שֶׁלָּהּ. פָּחוֹת מַהֲלָכִים = יוֹתֵר כּוֹכָבִים!',
    en:'Match each country with its capital. Fewer moves = more stars!'
  },
  rounds:{he:'כַּמָּה זוּגוֹת לִמְצֹא?',en:'How many pairs?'},
  pairs:{he:'זוּגוֹת',en:'Pairs'},
  moves:{he:'מַהֲלָכִים',en:'Moves'},
  newboard:{he:'לוּחַ חָדָשׁ! 🃏',en:'New board! 🃏'},
  level:{he:'בַּחֲרוּ רָמַת קֹשִׁי',en:'Choose difficulty'},
  memory:{he:'הִפְכוּ שְׁנֵי קְלָפִים וּמִצְאוּ מְדִינָה וְעִיר בִּירָה שֶׁמַּתְאִימוֹת זוֹ לָזוֹ',en:'Flip two cards and match a country with its capital'}
};

const PAIRS_REGULAR = [
  { country:'ישראל', capital:'ירושלים', tier:1 },
  { country:'ארה"ב', capital:'וושינגטון', tier:1 },
  { country:'צרפת', capital:'פריז', tier:1 },
  { country:'בריטניה', capital:'לונדון', tier:1 },
  { country:'איטליה', capital:'רומא', tier:1 },
  { country:'יפן', capital:'טוקיו', tier:1 },
  { country:'גרמניה', capital:'ברלין', tier:1 },
  { country:'רוסיה', capital:'מוסקבה', tier:1 },
  { country:'ספרד', capital:'מדריד', tier:2 },
  { country:'מצרים', capital:'קהיר', tier:2 },
  { country:'יוון', capital:'אתונה', tier:2 },
  { country:'סין', capital:'בייג\'ינג', tier:2 },
  { country:'הודו', capital:'ניו דלהי', tier:2 },
  { country:'ברזיל', capital:'ברזיליה', tier:2 },
  { country:'קנדה', capital:'אוטווה', tier:2 },
  { country:'אוסטרליה', capital:'קנברה', tier:3 },
  { country:'שווייץ', capital:'ברן', tier:3 },
  { country:'טורקיה', capital:'אנקרה', tier:3 },
  { country:'ניו זילנד', capital:'וולינגטון', tier:3 },
  { country:'דרום אפריקה', capital:'פרטוריה', tier:3 }
];

const PAIRS_NIQQUD = [
  { country:'יִשְׂרָאֵל', capital:'יְרוּשָׁלַיִם', tier:1 },
  { country:'אַרְצוֹת הַבְּרִית', capital:'וָשִׁינְגְטוֹן', tier:1 },
  { country:'צָרְפַת', capital:'פָּרִיז', tier:1 },
  { country:'בְּרִיטַנְיָה', capital:'לוֹנְדוֹן', tier:1 },
  { country:'אִיטַלְיָה', capital:'רוֹמָא', tier:1 },
  { country:'יַפָּן', capital:'טוֹקְיוֹ', tier:1 },
  { country:'גֶּרְמַנְיָה', capital:'בֶּרְלִין', tier:1 },
  { country:'רוּסְיָה', capital:'מוֹסְקְבָה', tier:1 },
  { country:'סְפָרַד', capital:'מַדְרִיד', tier:2 },
  { country:'מִצְרַיִם', capital:'קָהִיר', tier:2 },
  { country:'יָוָן', capital:'אַתּוּנָה', tier:2 },
  { country:'סִין', capital:'בֵּייג׳ִינְג', tier:2 },
  { country:'הוֹדּוּ', capital:'נְיוּ דֶּלְהִי', tier:2 },
  { country:'בְּרָזִיל', capital:'בְּרָזִילְיָה', tier:2 },
  { country:'קָנָדָה', capital:'אוֹטָוָה', tier:2 },
  { country:'אוֹסְטְרַלְיָה', capital:'קַנְבֶּרָה', tier:3 },
  { country:'שְׁוַיְץ', capital:'בֶּרְן', tier:3 },
  { country:'טוּרְקִיָּה', capital:'אַנְקָרָה', tier:3 },
  { country:'נְיוּ זִילַנְד', capital:'וֶלִינְגְטוֹן', tier:3 },
  { country:'דְּרוֹם אַפְרִיקָה', capital:'פְּרֶטוֹרְיָה', tier:3 }
];

let CHILD_AGE = null;
let USE_NIQQUD = false;
let T = T_REGULAR;
let PAIRS = PAIRS_REGULAR;

let game, diff, level = 1, TOTAL = 10;
let score = 0, pairsDone = 0, moves = 0, mistakes = 0;
let first = null, busy = false, boardLeft = 0, ending = false;

async function loadKidContext(){
  try{
    const kidId = localStorage.getItem('active_kid_id');
    if(!kidId) return;

    const client = await IAKidsActivity._getClient();

    const {data,error} = await client
      .from('kids_profiles')
      .select('id, age')
      .eq('id',kidId)
      .maybeSingle();

    if(error || !data){
      console.warn('[capitals] Kid profile was not loaded',error);
      return;
    }

    CHILD_AGE = Number(data.age);
    USE_NIQQUD = CHILD_AGE === 1 || CHILD_AGE === 2;

  }catch(error){
    console.warn('[capitals] loadKidContext error',error);
  }
}

function applyLanguage(){
  T = USE_NIQQUD ? T_NIQQUD : T_REGULAR;
  PAIRS = USE_NIQQUD ? PAIRS_NIQQUD : PAIRS_REGULAR;

  $('title').textContent = IAKidsLang.t(T.title);
  $('howto').textContent = IAKidsLang.t(T.howto);
  $('rounds-label').textContent = IAKidsLang.t(T.rounds);
  $('pairs-label').textContent = IAKidsLang.t(T.pairs);
  $('level-label').textContent = IAKidsLang.t(T.level);
  $('memory-note').textContent = IAKidsLang.t(T.memory);
  $('score-label').textContent = IAKidsLang.ui('score');
  $('best-label').textContent = IAKidsLang.ui('your_best');
  $('again-btn').textContent = IAKidsLang.ui('play_again');

  ['level_easy','level_medium','level_hard','level_random'].forEach((key,index)=>{
    document.querySelectorAll('#level-row .game-btn')[index].textContent = IAKidsLang.ui(key);
  });
}

IAKidsCoins.mount();

IAKidsHelp.mount({
  slug:'capitals',
  how:'הופכים שני קלפים בכל תור ומחפשים זוג מתאים: שם מדינה וקלף עם עיר הבירה שלה.',
  example:'הקלף <b>ישראל</b> מתאים לקלף <b>ירושלים</b> — זו עיר הבירה שלה!'
});

function setRounds(n,btn){
  TOTAL = n;

  document.querySelectorAll('#rounds-row .game-btn')
    .forEach(button=>button.classList.remove('success'));

  btn.classList.add('success');
}

const ready = (async()=>{
  await loadKidContext();
  applyLanguage();

  game = await IAKidsGame.init('capitals');

  const progress = await game.loadProgress();

  if(progress?.rounds){
    const btn =
      document.querySelector(`#rounds-row [onclick*="(${progress.rounds},"]`) ||
      $('rounds-row').children[1];

    setRounds(progress.rounds,btn);
  }

  if(progress?.lastLevel !== undefined){
    document
      .querySelector(`#level-row [data-lvl="${progress.lastLevel}"]`)
      ?.classList.add('success');
  }
})();

const show = id=>{
  ['start-screen','play-screen','end-screen']
    .forEach(screen=>$(screen).hidden = screen !== id);
};

async function start(selectedLevel){
  await ready;

  level = selectedLevel;
  diff = game.difficulty(selectedLevel || 1,3);

  score = 0;
  pairsDone = 0;
  moves = 0;
  mistakes = 0;
  first = null;
  busy = false;
  ending = false;

  $('score').textContent = '0';
  $('qnum').textContent = '0';
  $('moves').textContent = '0';
  $('qtotal').textContent = TOTAL;

  IAKidsActivity.configure({
    difficulty:selectedLevel || 1,
    questionsCount:TOTAL,
    metadata:{
      game_mode:'capitals',
      selected_level:selectedLevel,
      random_difficulty:selectedLevel === 0,
      child_age:CHILD_AGE,
      uses_niqqud:USE_NIQQUD
    }
  });

  await game.saveProgress({
    lastLevel:selectedLevel,
    rounds:TOTAL
  });

  show('play-screen');
  await deal();
}

function makeBoard(lvl){
  const nPairs =
    lvl === 1 ? 3 :
    lvl === 2 ? 5 : 6;

  const pool =
    lvl === 1
      ? PAIRS.filter(p=>p.tier === 1)
      : lvl === 2
        ? PAIRS.filter(p=>p.tier <= 2)
        : PAIRS.filter(p=>p.tier >= 2);

  const shuffled = [...pool];

  for(let i=shuffled.length-1;i>0;i--){
    const j = rnd(i+1);
    [shuffled[i],shuffled[j]] = [shuffled[j],shuffled[i]];
  }

  const pairs = shuffled.slice(0,nPairs);

  return {
    pairs,
    key:pairs.map(p=>p.country).sort().join('|')
  };
}

async function deal(){
  if(ending || pairsDone >= TOTAL){
    await end();
    return;
  }

  const lvl =
    level === 0
      ? 1 + rnd(3)
      : diff.level;

  const board =
    await game.newQuestion(
      ()=>makeBoard(lvl),
      item=>item.key
    );

  /*
   * Do not deal more pairs than are still needed.
   * This prevents a 5-pair game from accidentally ending with 6.
   */
  const remaining = TOTAL - pairsDone;
  const selectedPairs = board.pairs.slice(0,Math.min(board.pairs.length,remaining));

  const cards = [];

  for(const p of selectedPairs){
    cards.push({text:p.country,id:p.country});
    cards.push({text:p.capital,id:p.country});
  }

  for(let i=cards.length-1;i>0;i--){
    const j = rnd(i+1);
    [cards[i],cards[j]] = [cards[j],cards[i]];
  }

  boardLeft = selectedPairs.length;
  first = null;
  busy = false;

  const grid = $('grid');
  grid.innerHTML = '';
  grid.style.gridTemplateColumns =
    `repeat(${cards.length <= 6 ? 3 : 4},1fr)`;

  for(const card of cards){
    const el = document.createElement('div');

    el.className = 'mcard';
    el.dataset.id = card.id;

    el.innerHTML =
      `<div class="inner">` +
      `<div class="face front">❓</div>` +
      `<div class="face back">${card.text}</div>` +
      `</div>`;

    el.addEventListener('click',()=>flip(el));

    grid.appendChild(el);
  }
}

function flip(el){
  if(
    ending ||
    busy ||
    el.classList.contains('flipped') ||
    el.classList.contains('matched')
  ){
    return;
  }

  el.classList.add('flipped');

  if(!first){
    first = el;
    IAKidsActivity.questionStarted();
    return;
  }

  moves++;
  $('moves').textContent = moves;

  busy = true;

  const a = first;
  const b = el;
  first = null;

  setTimeout(async()=>{
    if(a.dataset.id === b.dataset.id){
      a.classList.add('matched');
      b.classList.add('matched');

      score += 10;
      pairsDone++;
      boardLeft--;

      $('score').textContent = score;
      $('qnum').textContent = pairsDone;

      diff.right();

      IAKidsActivity.correct();

      IAKidsFX.correct(b);
      await IAKidsCoins.right(b);

      busy = false;

      if(pairsDone >= TOTAL){
        await end();
        return;
      }

      if(boardLeft === 0){
        IAKidsFX.scorePop(
          IAKidsLang.t(T.newboard),
          $('grid')
        );

        setTimeout(()=>{
          deal();
        },850);
      }

    }else{
      mistakes++;

      diff.wrong();

      IAKidsActivity.wrong();

      IAKidsFX.wrong(b);
      await IAKidsCoins.wrong();

      setTimeout(()=>{
        a.classList.remove('flipped');
        b.classList.remove('flipped');
        busy = false;
      },650);
    }
  },420);
}

async function end(){
  if(ending) return;

  ending = true;
  busy = true;

  const maxScore = TOTAL * 10;

  await game.saveScore(score,{
    level,
    moves,
    pairs:pairsDone,
    mistakes
  });

  const top =
    (await game.getHighScores(1))[0];

  $('final-score').textContent = score;
  $('best').textContent = top?.score ?? score;
  $('moves-line').textContent =
    `${IAKidsLang.t(T.moves)}: ${moves}`;

  $('player-line').textContent =
    `${top?.player || IAKidsLang.ui('guest')} · ${
      new Date().toLocaleString(
        'he-IL',
        {
          dateStyle:'short',
          timeStyle:'short'
        }
      )
    }`;

  const moveRatio =
    moves /
    Math.max(1,pairsDone);

  $('stars').textContent =
    '⭐'.repeat(
      moveRatio <= 1.7
        ? 3
        : moveRatio <= 2.6
          ? 2
          : 1
    );

  const accuracy =
    pairsDone /
    Math.max(
      1,
      pairsDone + mistakes
    );

  await game.complete(
    score,
    {
      maxScore,

      performanceScore:
        Math.round(
          accuracy * 100
        ),

      metadata:{
        game_mode:'capitals',
        selected_level:level,
        random_difficulty:level === 0,
        total_pairs:TOTAL,
        matched_pairs:pairsDone,
        moves,
        mistakes,
        move_ratio:Number(moveRatio.toFixed(2)),
        child_age:CHILD_AGE,
        uses_niqqud:USE_NIQQUD
      }
    }
  );

  game.shareButton(
    score,
    $('share-slot')
  );

  show('end-screen');
}
</script>
</body>
</html>
