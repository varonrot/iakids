<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טיימר חללית — Pomodoro | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>
  #track-wrap { margin: 16px auto; max-width: 220px; }
  #track-wrap svg { width: 100%; display: block; border-radius: 16px; }
  .time-display { font-size: 3rem; font-weight: 900; color: var(--accent); margin: 8px 0; }
  .flight-controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  #landed { margin-top: 12px; }
  .history-box { margin-top: 24px; text-align: right; }
  .history-box h3 { margin-bottom: 6px; }
  #streakLine { font-size: 1.2rem; font-weight: 800; margin-bottom: 8px; }
  #sessionList { list-style: none; padding: 0; margin: 0; max-height: 160px; overflow-y: auto; }
  #sessionList li { padding: 6px 10px; border-radius: 10px; background: var(--accent-soft); margin-bottom: 6px; display: flex; justify-content: space-between; }
</style>
</head>
<body>

<div class="game-card" id="card">

  <div id="picker-screen">
    <div style="font-size:3.5rem">🚀</div>
    <h1 class="game-title">טיימר חללית לשיעורי בית</h1>
    <p>כמה זמן נלמד היום?</p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="dur-row">
      <button class="game-btn outline" onclick="pickDuration(10,this)">10 דק</button>
      <button class="game-btn outline" onclick="pickDuration(15,this)">15 דק</button>
      <button class="game-btn outline" onclick="pickDuration(25,this)">25 דק</button>
    </div>
    <button class="game-btn" id="startBtn" disabled onclick="startFlight()">🚀 המראה!</button>
  </div>

  <div id="flight-screen" hidden>
    <div id="track-wrap">
      <svg id="sky" viewBox="0 0 100 320" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1b2560"/>
            <stop offset="60%" stop-color="#5b6bc0"/>
            <stop offset="100%" stop-color="#ffcf8a"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="100" height="320" fill="url(#skyGrad)"/>
        <circle cx="20" cy="20" r="1.2" fill="#fff"/>
        <circle cx="75" cy="40" r="1" fill="#fff"/>
        <circle cx="55" cy="15" r="0.8" fill="#fff"/>
        <circle cx="85" cy="70" r="1.1" fill="#fff"/>
        <circle cx="30" cy="60" r="0.9" fill="#fff"/>
        <circle cx="15" cy="90" r="1" fill="#fff"/>
        <g id="moon" transform="translate(50,32)">
          <circle r="18" fill="#f4f1e6"/>
          <circle cx="-6" cy="-5" r="3" fill="#dcd7c4"/>
          <circle cx="5" cy="6" r="4" fill="#dcd7c4"/>
          <circle cx="7" cy="-8" r="2" fill="#dcd7c4"/>
        </g>
        <text id="rocket" x="50" y="300" font-size="20" text-anchor="middle">🚀</text>
      </svg>
    </div>
    <div class="time-display" id="timeDisplay">00:00</div>
    <div class="flight-controls" id="flightControls">
      <button class="game-btn secondary" id="pauseBtn" onclick="pauseResume()">⏸ השהה</button>
      <button class="game-btn danger" onclick="cancelFlight()">✖ בטל</button>
    </div>
    <div id="landed" hidden>
      <div style="font-size:2.5rem">🌕🎉</div>
      <p><b>נחתת על הירח בהצלחה!</b><br>+25 🪙</p>
      <button class="game-btn" onclick="backToPicker()">🚀 טיסה חדשה</button>
    </div>
  </div>

  <div class="history-box">
    <div id="streakLine">🔥 <span id="streakCount">0</span> ימים ברצף</div>
    <h3>הטיסות האחרונות</h3>
    <ul id="sessionList"></ul>
    <p id="noSessions" hidden style="color:var(--muted)">עוד לא טסת — בחר זמן ולחץ המראה! 🚀</p>
  </div>

</div>

<script src="../game-sdk.js"></script>
<script>
let game, sessions = [];
let durationMin = null, totalSeconds = 0, remaining = 0, endTime = null, running = false, tickId = null;

IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'pomodoro-rocket',
  how: 'בוחרים כמה זמן ללמוד (10, 15 או 25 דקות) ולוחצים המראה 🚀. חללית תטפס לאט לאט לכיוון הירח כל עוד הטיימר רץ. אפשר להשהות ולהמשיך בכל רגע. כשמגיעים לירח — מקבלים מטבעות וקונפטי!',
  example: 'בחרת <b>15 דק</b> ⏱️ ← אחרי 15 דקות למידה החללית נוחתת על הירח 🌕 ומקבלים <b>25 🪙</b>',
});

(async function init() {
  game = await IAKidsGame.init('pomodoro-rocket');
  const p = await game.loadProgress();
  sessions = p?.sessions || [];
  renderHistory();
})();

function pickDuration(min, btn) {
  durationMin = min;
  totalSeconds = min * 60;
  remaining = totalSeconds;
  document.querySelectorAll('#dur-row .game-btn').forEach(b => b.classList.remove('success'));
  btn.classList.add('success');
  document.getElementById('startBtn').disabled = false;
}

const show = id => {
  document.getElementById('picker-screen').hidden = id !== 'picker-screen';
  document.getElementById('flight-screen').hidden = id !== 'flight-screen';
};

function startFlight() {
  if (!durationMin) return;
  show('flight-screen');
  document.getElementById('landed').hidden = true;
  document.getElementById('flightControls').hidden = false;
  document.getElementById('pauseBtn').textContent = '⏸ השהה';
  endTime = Date.now() + remaining * 1000;
  running = true;
  tick();
  tickId = setInterval(tick, 250);
}

function tick() {
  remaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));
  const pct = 1 - remaining / totalSeconds;
  const y = 300 - pct * 250; // 300 (launch pad) -> 50 (near moon)
  document.getElementById('rocket').setAttribute('y', y.toFixed(1));
  const m = String(Math.floor(remaining / 60)).padStart(2, '0');
  const s = String(remaining % 60).padStart(2, '0');
  document.getElementById('timeDisplay').textContent = `${m}:${s}`;
  if (remaining <= 0) completeFlight();
}

function pauseResume() {
  if (running) {
    clearInterval(tickId);
    running = false;
    document.getElementById('pauseBtn').textContent = '▶️ המשך';
  } else {
    endTime = Date.now() + remaining * 1000;
    running = true;
    tickId = setInterval(tick, 250);
    document.getElementById('pauseBtn').textContent = '⏸ השהה';
  }
}

function cancelFlight() {
  clearInterval(tickId);
  running = false;
  show('picker-screen');
}

async function completeFlight() {
  clearInterval(tickId);
  running = false;
  document.getElementById('rocket').setAttribute('y', 50);
  document.getElementById('flightControls').hidden = true;
  document.getElementById('landed').hidden = false;
  IAKidsFX.celebrate();
  await IAKidsCoins.add(25);
  sessions.push({ date: new Date().toDateString(), duration: durationMin, ts: Date.now() });
  await game.saveProgress({ sessions });
  renderHistory();
}

function backToPicker() {
  durationMin = null;
  document.getElementById('startBtn').disabled = true;
  document.querySelectorAll('#dur-row .game-btn').forEach(b => b.classList.remove('success'));
  show('picker-screen');
}

function renderHistory() {
  // streak = consecutive days (including today or yesterday) with >=1 completed session
  const days = [...new Set(sessions.map(s => s.date))];
  let streak = 0;
  let cursor = new Date();
  if (!days.includes(cursor.toDateString())) cursor.setDate(cursor.getDate() - 1); // ok to still be "on streak" if not flown yet today
  while (days.includes(cursor.toDateString())) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  document.getElementById('streakCount').textContent = streak;

  const list = document.getElementById('sessionList');
  list.innerHTML = '';
  const recent = sessions.slice(-5).reverse();
  document.getElementById('noSessions').hidden = recent.length > 0;
  recent.forEach(s => {
    const li = document.createElement('li');
    const d = new Date(s.ts);
    li.innerHTML = `<span>🚀 ${s.duration} דק</span><span>${d.toLocaleDateString('he-IL')}</span>`;
    list.appendChild(li);
  });
}
</script>
</body>
</html>
