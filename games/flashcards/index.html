<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מחולל פלאשקארדס | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>
body { max-width: 560px; margin: 0 auto; align-items: stretch; }
.card-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.card-row input {
  flex: 1; font: inherit; font-size: 1rem; padding: 10px 12px;
  border: 2px solid var(--accent-soft); border-radius: 12px; background: var(--card);
}
.card-row button { background: var(--red); color: #fff; border: none; border-radius: 10px;
  width: 34px; height: 34px; font-size: 1rem; cursor: pointer; flex: none; }
#deck-name { width: 100%; font: inherit; font-size: 1.1rem; padding: 12px 14px;
  border: 2px solid var(--accent); border-radius: 12px; margin-bottom: 12px; }
.deck-item { display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--accent-soft); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; }
.deck-item .deck-info { text-align: right; }
.deck-item .deck-actions { display: flex; gap: 6px; }
.deck-item button { min-height: 40px; padding: 8px 14px; font-size: 1rem; margin: 0; }

#flash-wrap { perspective: 1000px; height: 220px; cursor: pointer; margin: 18px 0; }
#flash-inner { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
#flash-wrap.flipped #flash-inner { transform: rotateY(180deg); }
.flash-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; align-items: center; justify-content: center; text-align: center; border-radius: var(--radius);
  font-size: 1.6rem; font-weight: 800; padding: 16px; }
.flash-face.front { background: var(--accent); color: #fff; }
.flash-face.back { transform: rotateY(180deg); background: var(--card); border: 3px solid var(--accent); color: var(--text); }
.flash-hint { font-size: 0.9rem; color: var(--muted); margin-top: -8px; }
</style>
</head>
<body>

<div class="game-hud">
  <span class="score">ניקוד: <span id="score">0</span></span>
  <span>ידעתי <span id="learned-num">0</span>/<span id="learned-total">0</span></span>
</div>

<div class="game-card" id="card">

  <div id="home-screen">
    <div style="font-size:4rem">🗂️</div>
    <h1 class="game-title">מחולל פלאשקארדס</h1>
    <p>בונים חבילת כרטיסיות לשינון, ומתרגלים עד שיודעים הכל!</p>

    <h2 style="font-size:1.1rem">➕ חבילה חדשה</h2>
    <input id="deck-name" placeholder="שם החבילה (למשל: מבחן חשבון)">
    <div id="rows"></div>
    <button class="game-btn outline" onclick="addRow()">+ הוסף כרטיס</button>
    <button class="game-btn" onclick="saveDeck()">💾 שמור חבילה</button>

    <h2 style="font-size:1.1rem;margin-top:24px">📚 החבילות שלי</h2>
    <div id="decks-list"></div>
    <p id="no-decks" style="color:var(--muted)">עוד אין חבילות — הוסיפו כרטיסים למעלה!</p>
  </div>

  <div id="study-screen" hidden>
    <h1 class="game-title" id="study-title"></h1>
    <div id="flash-wrap" onclick="flipCard()">
      <div id="flash-inner">
        <div class="flash-face front" id="face-term"></div>
        <div class="flash-face back" id="face-def"></div>
      </div>
    </div>
    <p class="flash-hint" id="flip-hint">👆 הקישו על הכרטיס כדי לראות את התשובה</p>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="know-row" hidden>
      <button class="game-btn danger" onclick="markUnknown(this)">👎 לא ידעתי</button>
      <button class="game-btn success" onclick="markKnown(this)">👍 ידעתי</button>
    </div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p>השיא שלך: <b id="best"></b></p>
    <button class="game-btn" onclick="study(currentDeckIndex)">תרגל שוב 🔁</button>
    <button class="game-btn outline" onclick="location.reload()">לתפריט הראשי</button>
    <div id="share-slot"></div>
  </div>

</div>

<script src="../game-sdk.js"></script>
<script>
const $ = id => document.getElementById(id);
let game, decks = [], currentDeckIndex = -1;
let queue = [], total = 0, learned = new Set(), score = 0, currentCard = null, flipped = false, retries = 0;

IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'flashcards',
  how: 'כותבים מונח ותשובה בכל שורה ושומרים חבילה. במצב תרגול הופכים כל כרטיס בהקשה, בודקים אם ידעתם, ומסמנים "ידעתי" או "לא ידעתי". כרטיסים שלא ידעתם חוזרים שוב עד שתדעו את כולם!',
  example: 'מונח: <b>בירת צרפת</b> ← הקשה על הכרטיס ← תשובה: <b>פריז</b>',
});

const show = id => { for (const s of ['home-screen', 'study-screen', 'end-screen']) $(s).hidden = s !== id; };

function addRow(term = '', def = '') {
  const row = document.createElement('div');
  row.className = 'card-row';
  row.innerHTML = `<input class="term" placeholder="מונח / שאלה" value="${esc(term)}">
    <input class="def" placeholder="תשובה / הגדרה" value="${esc(def)}">
    <button type="button" onclick="this.parentElement.remove()">✕</button>`;
  $('rows').appendChild(row);
}
function esc(s) { return String(s).replace(/"/g, '&quot;'); }

async function saveDeck() {
  const name = $('deck-name').value.trim();
  const cards = [...document.querySelectorAll('.card-row')].map(r => ({
    term: r.querySelector('.term').value.trim(),
    def: r.querySelector('.def').value.trim(),
  })).filter(c => c.term && c.def);
  if (!name) return alert('תנו שם לחבילה');
  if (!cards.length) return alert('הוסיפו לפחות כרטיס אחד עם מונח ותשובה');
  decks.push({ name, cards });
  await game.saveProgress({ decks });
  $('deck-name').value = '';
  $('rows').innerHTML = '';
  addRow(); addRow(); addRow();
  renderDecks();
  IAKidsFX.correct($('card'));
}

function renderDecks() {
  const list = $('decks-list');
  list.innerHTML = '';
  decks.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'deck-item';
    el.innerHTML = `<div class="deck-info"><b>${d.name}</b><br><span style="color:var(--muted);font-size:.85rem">${d.cards.length} כרטיסים</span></div>
      <div class="deck-actions">
        <button class="game-btn" onclick="study(${i})">📖 תרגל</button>
        <button class="game-btn outline" onclick="deleteDeck(${i})">🗑️</button>
      </div>`;
    list.appendChild(el);
  });
  $('no-decks').hidden = decks.length > 0;
}

async function deleteDeck(i) {
  if (!confirm(`למחוק את "${decks[i].name}"?`)) return;
  decks.splice(i, 1);
  await game.saveProgress({ decks });
  renderDecks();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function study(i) {
  currentDeckIndex = i;
  const deck = decks[i];
  queue = shuffle(deck.cards.map(c => ({ ...c })));
  total = deck.cards.length;
  learned = new Set();
  score = 0;
  retries = 0;
  $('study-title').textContent = deck.name;
  $('score').textContent = 0;
  $('learned-total').textContent = total;
  $('learned-num').textContent = 0;
  show('study-screen');
  nextCard();
}

function nextCard() {
  if (!queue.length) return endSession();
  currentCard = queue.shift();
  flipped = false;
  $('flash-wrap').classList.remove('flipped');
  $('face-term').textContent = currentCard.term;
  $('face-def').textContent = currentCard.def;
  $('know-row').hidden = true;
  $('flip-hint').hidden = false;
}

function flipCard() {
  if (flipped) return;
  flipped = true;
  $('flash-wrap').classList.add('flipped');
  $('know-row').hidden = false;
  $('flip-hint').hidden = true;
}

function markKnown(btn) {
  if (!learned.has(currentCard.term)) {
    learned.add(currentCard.term);
    score += 10;
    $('score').textContent = score;
    $('learned-num').textContent = learned.size;
    IAKidsCoins.right(btn);
  }
  IAKidsFX.correct(btn);
  setTimeout(nextCard, 400);
}

function markUnknown(btn) {
  retries++;
  IAKidsFX.wrong(btn); // no coin penalty — flashcards is a no-wrong-answer tool
  queue.push(currentCard); // requeue to end of list, try again later this session
  setTimeout(nextCard, 400);
}

async function endSession() {
  await game.saveScore(score, { deck: decks[currentDeckIndex].name, cards: total });
  const top = (await game.getHighScores(1))[0];
  $('final-score').textContent = score;
  $('best').textContent = top?.score ?? score;
  $('player-line').textContent = `${top?.player || 'אורח'} · ${new Date().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}`;
  const ratio = retries / total; // fewer requeues (fewer "לא ידעתי") = more stars
  $('stars').textContent = '⭐'.repeat(ratio === 0 ? 3 : ratio <= 0.5 ? 2 : 1);
  $('share-slot').innerHTML = '';
  game.shareButton(score, $('share-slot'));
  show('end-screen');
  game.complete(score);
}

(async () => {
  game = await IAKidsGame.init('flashcards');
  const p = await game.loadProgress();
  decks = p?.decks || [];
  addRow(); addRow(); addRow();
  renderDecks();
  show('home-screen');
})();
</script>
</body>
</html>
