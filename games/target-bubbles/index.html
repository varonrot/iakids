<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קליעה למטרה | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>
#bubble-area { position: relative; height: 320px; margin-top: 8px; }
.bubble {
  position: absolute; width: 84px; height: 84px; border-radius: 50%;
  border: none; cursor: pointer; font-weight: 800; font-size: 1.05rem;
  color: #fff; background: radial-gradient(circle at 30% 30%, #7ec8ff, #2e86de);
  box-shadow: 0 4px 10px rgba(0,0,0,.2), inset 0 -6px 12px rgba(0,0,0,.15);
  animation: floaty var(--d, 4s) ease-in-out infinite alternate;
  transition: transform .3s, opacity .3s;
  -webkit-tap-highlight-color: transparent;
}
.bubble.popped { transform: scale(0); opacity: 0; pointer-events: none; }
.bubble.tried { opacity: .35; pointer-events: none; animation-play-state: paused; }
.bubble.reveal { background: radial-gradient(circle at 30% 30%, #8be78b, #27ae60); }
@keyframes floaty { from { margin-top: 0; margin-left: 0; } to { margin-top: -18px; margin-left: 10px; } }
#target-box { font-size: 2.4rem; font-weight: 900; color: var(--accent); }
</style>
</head>
<body>

<div class="game-hud">
  <span class="score"><span id="score-label"></span>: <span id="score">0</span></span>
  <span><span id="q-label"></span> <span id="qnum">1</span>/<span id="qtotal">10</span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div style="font-size:4rem">🎯</div>
    <h1 class="game-title" id="title"></h1>
    <p id="subtitle"></p>
    <p id="rounds-label"></p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr">
      <button class="game-btn secondary" onclick="start(1)" id="lvl1"></button>
      <button class="game-btn secondary" onclick="start(2)" id="lvl2"></button>
      <button class="game-btn secondary" onclick="start(3)" id="lvl3"></button>
      <button class="game-btn" onclick="start(0)" id="lvl0"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div id="target-line"><span id="target-label"></span></div>
    <div id="target-box"></div>
    <div id="bubble-area"></div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" onclick="location.reload()" id="again"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>
<script>
const T = IAKidsLang.t.bind(IAKidsLang), UI = IAKidsLang.ui.bind(IAKidsLang);
document.getElementById('title').textContent = T({he:'קליעה למטרה', en:'Target Bubbles', es:'Burbujas al blanco', de:'Zielblasen', pt:'Bolhas no alvo'});
document.getElementById('subtitle').textContent = T({he:'לחץ על הבועות שהתרגיל שלהן שווה למספר המטרה!', en:'Pop the bubbles that equal the target number!', es:'¡Explota las burbujas que igualan el número objetivo!', de:'Zerplatze die Blasen, die die Zielzahl ergeben!', pt:'Estoure as bolhas que dão o número alvo!'});
document.getElementById('rounds-label').textContent = T({he:'כמה סיבובים?', en:'How many rounds?', es:'¿Cuántas rondas?', de:'Wie viele Runden?', pt:'Quantas rodadas?'});
document.getElementById('target-label').textContent = T({he:'מצא את התרגילים ששווים ל:', en:'Find the expressions that equal:', es:'Encuentra las cuentas que igualan:', de:'Finde die Aufgaben, die ergeben:', pt:'Encontre as contas que dão:'});
document.getElementById('score-label').textContent = UI('score');
document.getElementById('q-label').textContent = UI('question');
document.getElementById('best-label').textContent = UI('your_best');
document.getElementById('again').textContent = UI('play_again');
document.getElementById('lvl1').textContent = UI('level_easy');
document.getElementById('lvl2').textContent = UI('level_medium');
document.getElementById('lvl3').textContent = UI('level_hard');
document.getElementById('lvl0').textContent = UI('level_random');

let game, score = 0, qnum = 0, cleared = 0, level = 1;
let TOTAL = 10, diff, timer, need = 0, found = 0, waveActive = false;
IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'target-bubbles',
  how: 'מופיע מספר מטרה ובועות עם תרגילים. לוחצים רק על הבועות שהתרגיל שלהן שווה למספר המטרה, לפני שהפצצה מתפוצצת! 💣',
  example: 'המטרה: <b>12</b> ← לוחצים על הבועה <span dir="ltr"><b>7 + 5</b></span>',
});

function setRounds(n, btn) {
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.remove('success'));
  btn.classList.add('success');
}

const show = id => {
  for (const s of ['start-screen', 'play-screen', 'end-screen'])
    document.getElementById(s).hidden = s !== id;
};

async function start(lvl) {
  game = await IAKidsGame.init('target-bubbles');
  level = lvl;
  diff = game.difficulty(lvl || 1, 3);
  timer = game.timer({ style: 'bomb', onTimeout: timeout });
  const p = await game.loadProgress();
  if (p?.rounds && !document.querySelector('#rounds-row .success')) TOTAL = p.rounds;
  await game.saveProgress({ lastLevel: lvl, rounds: TOTAL });
  document.getElementById('qtotal').textContent = TOTAL;
  show('play-screen');
  next();
}

const rnd = n => Math.floor(Math.random() * n);

// expressions that equal target — built directly, so they always exist
function correctExprs(lvl, target) {
  if (lvl === 2) {
    const out = [];
    for (let c = 2; c <= 9; c++)
      if (target % c === 0 && target / c >= 2 && target / c <= 9) out.push(`${c} × ${target / c}`);
    return out;
  }
  const out = new Set();
  for (let i = 0; i < 20 && out.size < 4; i++) {
    if (lvl === 3 && Math.random() < 0.4) { const b = 1 + rnd(20); out.add(`${target + b} − ${b}`); }
    else { const a = 1 + rnd(target - 1); out.add(`${a} + ${target - a}`); }
  }
  return [...out];
}

// random expression that does NOT equal target
function distractor(lvl, target, texts) {
  for (let i = 0; i < 80; i++) {
    let a, b, op, val;
    if (lvl === 1) { a = 1 + rnd(19); b = 1 + rnd(19); op = '+'; val = a + b; }
    else if (lvl === 2) { a = 2 + rnd(8); b = 2 + rnd(8); op = '×'; val = a * b; }
    else {
      op = ['+', '−', '×'][rnd(3)];
      if (op === '+') { a = 1 + rnd(40); b = 1 + rnd(40); val = a + b; }
      else if (op === '−') { a = 10 + rnd(50); b = 1 + rnd(a); val = a - b; }
      else { a = 2 + rnd(8); b = 2 + rnd(8); val = a * b; }
    }
    const text = `${a} ${op} ${b}`;
    if (val !== target && !texts.has(text)) return text;
  }
  return null;
}

function makeWave(lvl) {
  let target;
  if (lvl === 1) target = 5 + rnd(16);            // 5–20
  else if (lvl === 2) { const f = 2 + rnd(8), g = 2 + rnd(8); target = f * g; }
  else target = 10 + rnd(51);                     // 10–60
  const pool = correctExprs(lvl, target).sort(() => Math.random() - 0.5);
  const n = Math.min(1 + rnd(2), pool.length);    // 1–2 correct bubbles
  const texts = new Set(), bubbles = [];
  for (let i = 0; i < n; i++) { texts.add(pool[i]); bubbles.push({ text: pool[i], ok: true }); }
  while (bubbles.length < 6) {
    const t = distractor(lvl, target, texts);
    if (!t) break; // ponytail: near-impossible; a 5-bubble wave beats an infinite loop
    texts.add(t); bubbles.push({ text: t, ok: false });
  }
  bubbles.sort(() => Math.random() - 0.5);
  return { target, bubbles };
}

const SLOTS = [[4, 4], [37, 16], [68, 2], [6, 55], [40, 62], [70, 50]];

async function next() {
  if (qnum >= TOTAL) return end();
  qnum++;
  document.getElementById('qnum').textContent = qnum;
  const lvl = level === 0 ? 1 + rnd(3) : diff.level;
  const q = await game.newQuestion(() => makeWave(lvl),
    x => x.target + '|' + x.bubbles.map(b => b.text).sort().join(','));
  need = q.bubbles.filter(b => b.ok).length;
  found = 0;
  waveActive = true;
  document.getElementById('target-box').textContent = q.target;
  const area = document.getElementById('bubble-area');
  area.innerHTML = '';
  q.bubbles.forEach((b, i) => {
    const el = document.createElement('button');
    el.className = 'bubble';
    el.innerHTML = `<span dir="ltr">${b.text}</span>`;
    const [x, y] = SLOTS[i];
    el.style.left = (x + rnd(6)) + '%';
    el.style.top = (y + rnd(8)) + '%';
    el.style.setProperty('--d', (lvl === 3 ? 1.8 + Math.random() : 3 + Math.random() * 2).toFixed(2) + 's');
    el.dataset.ok = b.ok ? '1' : '';
    el.onclick = () => tap(el, b.ok);
    area.appendChild(el);
  });
  timer.start(IAKidsTimer.secondsFor(lvl, 12));
}

function tap(el, ok) {
  if (!waveActive || el.classList.contains('popped') || el.classList.contains('tried')) return;
  if (ok) {
    el.classList.add('popped');
    score += 10; found++;
    IAKidsFX.correct(el);
    IAKidsCoins.right(el);
    if (found >= need) {
      waveActive = false;
      timer.stop();
      cleared++;
      diff.right();
      setTimeout(next, 700);
    }
  } else {
    el.classList.add('tried');
    IAKidsFX.wrong(el);
    IAKidsCoins.wrong();
    diff.wrong();
  }
  document.getElementById('score').textContent = score;
}

function timeout() {
  if (!waveActive) return;
  waveActive = false;
  diff.wrong();
  IAKidsCoins.wrong();
  // reveal the correct bubbles briefly
  document.querySelectorAll('#bubble-area .bubble').forEach(el => {
    el.style.pointerEvents = 'none';
    if (el.dataset.ok) el.classList.add('reveal');
  });
  setTimeout(next, 1000);
}

async function end() {
  timer.stop();
  await game.saveScore(score, { level, cleared, total: TOTAL });
  const top = (await game.getHighScores(1))[0];
  document.getElementById('final-score').textContent = score;
  document.getElementById('best').textContent = top?.score ?? score;
  document.getElementById('player-line').textContent =
    `${top?.player || UI('guest')} · ${new Date().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}`;
  const acc = cleared / TOTAL;
  document.getElementById('stars').textContent = '⭐'.repeat(acc >= 0.9 ? 3 : acc >= 0.6 ? 2 : 1);
  game.shareButton(score, document.getElementById('share-slot'));
  show('end-screen');
  game.complete(score);
}
</script>
</body>
</html>
