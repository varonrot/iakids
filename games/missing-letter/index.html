<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>השלם את האות החסרה | iakids</title>
<link rel="stylesheet" href="../game-style.css">
</head>
<body>

<div class="game-hud">
  <span class="score"><span id="score-label"></span>: <span id="score">0</span></span>
  <span><span id="q-label"></span> <span id="qnum">1</span>/<span id="qtotal">10</span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div style="font-size:4rem">🅰️</div>
    <h1 class="game-title" id="title"></h1>
    <p id="instr"></p>
    <p id="rounds-label"></p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" data-r="5" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline" data-r="10" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" data-r="15" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-l="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-l="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-l="3" onclick="start(3)"></button>
      <button class="game-btn" data-l="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div style="font-size:3.5rem" id="emoji"></div>
    <div class="game-question" id="question"></div>
    <div class="answer-grid" id="answers"></div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>
<script>
const SLUG = 'missing-letter';
const T = {
  title: { he: 'השלם את האות החסרה', en: 'Complete the Missing Letter', es: 'Completa la letra que falta', de: 'Ergänze den fehlenden Buchstaben', pt: 'Complete a letra que falta' },
  instr: { he: 'אות אחת חסרה במילה — בחר את האות הנכונה שמשלימה אותה!', en: 'One letter is missing — pick the right one!', es: 'Falta una letra — ¡elige la correcta!', de: 'Ein Buchstabe fehlt — wähle den richtigen!', pt: 'Falta uma letra — escolha a certa!' },
  rounds: { he: 'כמה שאלות?', en: 'How many questions?', es: '¿Cuántas preguntas?', de: 'Wie viele Fragen?', pt: 'Quantas perguntas?' },
  question: { he: 'איזו אות חסרה?', en: 'Which letter is missing?', es: '¿Qué letra falta?', de: 'Welcher Buchstabe fehlt?', pt: 'Que letra falta?' },
};
document.getElementById('title').textContent = IAKidsLang.t(T.title);
document.getElementById('instr').textContent = IAKidsLang.t(T.instr);
document.getElementById('rounds-label').textContent = IAKidsLang.t(T.rounds);
document.getElementById('score-label').textContent = IAKidsLang.ui('score');
document.getElementById('q-label').textContent = IAKidsLang.ui('question');
document.getElementById('best-label').textContent = IAKidsLang.ui('your_best');
document.getElementById('again-btn').textContent = IAKidsLang.ui('play_again');
for (const [l, k] of [[1, 'level_easy'], [2, 'level_medium'], [3, 'level_hard'], [0, 'level_random']])
  document.querySelector(`#level-row [data-l="${l}"]`).textContent = IAKidsLang.ui(k);

IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: SLUG,
  how: 'במילה חסרה אות אחת, במקומה מופיע ◻. צריך לבחור מתוך 4 האותיות את זו שמתאימה ומשלימה את המילה נכון — לב לב לאותיות סופיות בסוף מילה (ם ן ץ ף ך)! לפני שהפצצה מתפוצצת 💣',
  example: '🪑 &nbsp; שולח<b>◻</b> ← האות החסרה היא <b>ן</b> (שולחן)',
});

// ---------- word bank (no lvl tag needed — level chooses blank position) ----------
const BANK = [
  { w: 'כלב', e: '🐕' }, { w: 'חתול', e: '🐈' }, { w: 'תפוח', e: '🍎' }, { w: 'ספר', e: '📖' },
  { w: 'כדור', e: '⚽' }, { w: 'פרח', e: '🌸' }, { w: 'דבש', e: '🍯' }, { w: 'ענן', e: '☁️' },
  { w: 'ירח', e: '🌙' }, { w: 'גשר', e: '🌉' }, { w: 'נמר', e: '🐅' }, { w: 'דבורה', e: '🐝' },
  { w: 'בננה', e: '🍌' }, { w: 'גזר', e: '🥕' }, { w: 'עגבנייה', e: '🍅' }, { w: 'תיק', e: '🎒' },
  { w: 'יום', e: '🌞' }, { w: 'חלום', e: '💭' }, { w: 'שלום', e: '👋' }, { w: 'עולם', e: '🌍' },
  { w: 'מקום', e: '📍' }, { w: 'שולחן', e: '🪑' }, { w: 'עיתון', e: '📰' }, { w: 'לימון', e: '🍋' },
  { w: 'כיוון', e: '🧭' }, { w: 'ארון', e: '🚪' }, { w: 'עץ', e: '🌳' }, { w: 'חץ', e: '🏹' },
  { w: 'מיץ', e: '🧃' }, { w: 'ארץ', e: '🗺️' }, { w: 'כף', e: '🥄' }, { w: 'תוף', e: '🥁' },
  { w: 'אלף', e: '🔢' }, { w: 'מלך', e: '👑' }, { w: 'חושך', e: '🌑' }, { w: 'דרך', e: '🛣️' },
];

const FINAL_MAP = { 'מ': 'ם', 'נ': 'ן', 'צ': 'ץ', 'פ': 'ף', 'כ': 'ך' };
const FINAL_SET = new Set(Object.values(FINAL_MAP));
const REGULAR = 'אבגדהוזחטיכלמנסעפצקרשת'.split('');
const SIMILAR = {
  'ב': ['כ', 'נ'], 'כ': ['ב', 'פ'], 'ד': ['ר'], 'ר': ['ד'], 'ג': ['נ', 'ז'], 'ז': ['ג', 'ר'],
  'ח': ['ה', 'כ'], 'ה': ['ח', 'ע'], 'ע': ['א', 'ה'], 'א': ['ע'], 'ט': ['ת'], 'ת': ['ט'],
  'ס': ['ש'], 'ש': ['ס'], 'צ': ['ק'], 'ק': ['צ', 'כ'], 'ו': ['ז'], 'נ': ['ג', 'ב'],
  'מ': ['נ'], 'פ': ['כ'], 'ל': ['ה'], 'י': ['ו'],
};
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);

function pickDistractors(correct) {
  const isFinal = FINAL_SET.has(correct);
  const set = new Set();
  if (isFinal) {
    const reg = Object.entries(FINAL_MAP).find(([r, f]) => f === correct);
    if (reg) set.add(reg[0]); // classic trap: regular form instead of final form
    for (const f of FINAL_SET) { if (f !== correct && set.size < 3) set.add(f); }
  }
  for (const n of (SIMILAR[correct] || [])) { if (n !== correct && set.size < 3) set.add(n); }
  while (set.size < 3) {
    const c = REGULAR[rnd(REGULAR.length)];
    if (c !== correct) set.add(c);
  }
  return shuffle([...set]).slice(0, 3);
}

function pickBlankIndex(word, lvl) {
  if (lvl === 3) return word.length - 1; // final letter
  if (lvl === 2) return Math.floor(word.length / 2); // middle
  return 0; // first letter
}

let game, score = 0, qnum = 0, level = 1, right = 0, TOTAL = 10, locked = false;
let diff, timer;

(async () => {
  game = await IAKidsGame.init(SLUG);
  const p = await game.loadProgress();
  const r = p?.rounds || TOTAL;
  setRounds(r, document.querySelector(`#rounds-row [data-r="${r}"]`));
  if (p?.lastLevel != null)
    document.querySelector(`#level-row [data-l="${p.lastLevel}"]`)?.classList.add('bounce-in');
})();

function setRounds(n, btn) {
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.remove('success'));
  btn?.classList.add('success');
}

const show = id => {
  for (const s of ['start-screen', 'play-screen', 'end-screen'])
    document.getElementById(s).hidden = s !== id;
};

async function start(lvl) {
  if (!game) game = await IAKidsGame.init(SLUG);
  level = lvl;
  diff = game.difficulty(lvl || 1, 3);
  timer = game.timer({ style: 'bomb', onTimeout: () => answer(false, null) });
  await game.saveProgress({ lastLevel: lvl, rounds: TOTAL });
  document.getElementById('qtotal').textContent = TOTAL;
  show('play-screen');
  next();
}

function makeQuestion(lvl) {
  let pool = BANK;
  if (lvl === 3) pool = BANK.filter(x => FINAL_SET.has(x.w[x.w.length - 1]));
  else if (lvl === 2) pool = BANK.filter(x => x.w.length >= 3);
  const item = pool[rnd(pool.length)];
  const idx = pickBlankIndex(item.w, lvl);
  const correct = item.w[idx];
  const display = item.w.slice(0, idx) + '◻' + item.w.slice(idx + 1);
  const opts = shuffle([correct, ...pickDistractors(correct)]);
  return { word: item.w, emoji: item.e, display, correct, opts };
}

async function next() {
  if (qnum >= TOTAL) return end();
  qnum++;
  locked = false;
  document.getElementById('qnum').textContent = qnum;
  const lvl = level === 0 ? 1 + rnd(3) : diff.level;
  const q = await game.newQuestion(() => makeQuestion(lvl), x => x.word + '|' + x.display);
  document.getElementById('emoji').textContent = q.emoji;
  document.getElementById('question').innerHTML =
    `<span style="font-size:2.4rem">${q.display}</span><div style="font-size:1rem;margin-top:8px;color:var(--muted)">${IAKidsLang.t(T.question)}</div>`;
  const grid = document.getElementById('answers');
  grid.innerHTML = '';
  for (const o of q.opts) {
    const btn = document.createElement('button');
    btn.className = 'game-btn';
    btn.textContent = o;
    btn.onclick = () => answer(o === q.correct, btn);
    grid.appendChild(btn);
  }
  timer.start(IAKidsTimer.secondsFor(lvl));
}

function answer(ok, btn) {
  if (locked) return;
  locked = true;
  timer.stop();
  if (ok) {
    score += 10; right++;
    diff.right();
    IAKidsFX.correct(btn);
    IAKidsCoins.right(btn);
  } else {
    diff.wrong();
    IAKidsFX.wrong(btn);
    IAKidsCoins.wrong();
  }
  document.getElementById('score').textContent = score;
  setTimeout(next, 600);
}

async function end() {
  await game.saveScore(score, { level, rounds: TOTAL, right });
  const top = (await game.getHighScores(1))[0];
  document.getElementById('final-score').textContent = score;
  document.getElementById('best').textContent = top?.score ?? score;
  document.getElementById('player-line').textContent =
    `${top?.player || IAKidsLang.ui('guest')} · ${new Date().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}`;
  document.getElementById('stars').textContent =
    '⭐'.repeat(Math.max(1, Math.round(right / TOTAL * 3)));
  game.shareButton(score, document.getElementById('share-slot'));
  show('end-screen');
  game.complete(score);
}
</script>
</body>
</html>
