<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דמו — אמת או שקר בחשבון | iakids</title>
<link rel="stylesheet" href="../game-style.css">
</head>
<body>

<div class="game-hud">
  <span class="score">ניקוד: <span id="score">0</span></span>
  <span>שאלה <span id="qnum">1</span>/<span id="qtotal">5</span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div style="font-size:4rem">🤖</div>
    <h1 class="game-title">אמת או שקר בחשבון</h1>
    <p>האם התרגיל נכון? ענה מהר!</p>
    <p>כמה שאלות?</p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr">
      <button class="game-btn secondary" onclick="start(1)">🙂 קל</button>
      <button class="game-btn secondary" onclick="start(2)">😎 בינוני</button>
      <button class="game-btn secondary" onclick="start(3)">🤓 קשה</button>
      <button class="game-btn" onclick="start(0)">🎲 אקראי</button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div class="game-question" id="question"></div>
    <div class="answer-grid">
      <button class="game-btn success" onclick="answer(true, this)">✓ אמת</button>
      <button class="game-btn danger" onclick="answer(false, this)">✗ שקר</button>
    </div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p>השיא שלך: <b id="best"></b></p>
    <button class="game-btn" onclick="location.reload()">שחק שוב 🔁</button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>
<script>
let game, score = 0, qnum = 0, current, level = 1;
let TOTAL = 5; // rounds — player picks on start screen
IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'demo',
  how: 'מופיע תרגיל חשבון — צריך להחליט מהר אם הוא נכון (אמת) או שגוי (שקר), לפני שהפצצה מתפוצצת! 💣',
  example: '<span dir="ltr"><b>5 × 4 = 20</b></span> ← ✓ אמת<br><span dir="ltr"><b>5 × 4 = 22</b></span> ← ✗ שקר',
});

function setRounds(n, btn) {
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.remove('success'));
  btn.classList.add('success');
}

const show = id => {
  for (const s of ['start-screen', 'play-screen', 'end-screen'])
    document.getElementById(s).hidden = s !== id;
};

let diff, timer;
async function start(lvl) {
  game = await IAKidsGame.init('demo');
  level = lvl;
  diff = game.difficulty(lvl || 1, 3); // adaptive: harder after right, easier after wrong
  timer = game.timer({ style: 'bomb', onTimeout: () => answer(null, null) }); // no answer = wrong
  const p = await game.loadProgress();
  if (p?.rounds && !document.querySelector('#rounds-row .success')) TOTAL = p.rounds;
  await game.saveProgress({ lastLevel: lvl, rounds: TOTAL });
  document.getElementById('qtotal').textContent = TOTAL;
  show('play-screen');
  next();
}

// level 1: addition to 20, 2: multiplication, 3: mixed to 100, 0: random per question
function makeQuestion(lvl) {
  if (lvl === 0) lvl = 1 + Math.floor(Math.random() * 3);
  const truth = Math.random() < 0.5;
  let a, b, op, val;
  if (lvl === 1) { a = 1 + rnd(19); b = 1 + rnd(20 - a); op = '+'; val = a + b; }
  else if (lvl === 2) { a = 2 + rnd(8); b = 2 + rnd(8); op = '×'; val = a * b; }
  else {
    op = ['+', '−', '×'][rnd(3)];
    a = 10 + rnd(80); b = 2 + rnd(a > 50 ? 40 : a - 1);
    val = op === '+' ? a + b : op === '−' ? a - b : (a = 3 + rnd(9), b = 3 + rnd(9), a * b);
  }
  const shown = truth ? val : val + (Math.random() < 0.5 ? 1 + rnd(3) : -(1 + rnd(3)));
  return { text: `${a} ${op} ${b} = ${shown}`, truth };
}
const rnd = n => Math.floor(Math.random() * n);

async function next() {
  if (qnum >= TOTAL) return end();
  qnum++;
  document.getElementById('qnum').textContent = qnum;
  const lvl = level === 0 ? 1 + rnd(3) : diff.level;
  const q = await game.newQuestion(() => makeQuestion(lvl), x => x.text); // no repeats
  current = q.truth;
  document.getElementById('question').textContent = q.text;
  timer.start(IAKidsTimer.secondsFor(lvl)); // 10s / 8s / 6s — harder = faster bomb
}

function answer(said, btn) {
  timer.stop();
  if (said === current) {
    score += 10;
    diff.right();
    IAKidsFX.correct(btn);
    IAKidsCoins.right(btn);
  } else {
    diff.wrong();
    IAKidsFX.wrong(btn);
    IAKidsCoins.wrong();
  }
  document.getElementById('score').textContent = score;
  setTimeout(next, 600);
}

async function end() {
  await game.saveScore(score, { level });
  const top = (await game.getHighScores(1))[0];
  document.getElementById('final-score').textContent = score;
  document.getElementById('best').textContent = top?.score ?? score;
  document.getElementById('player-line').textContent =
    `${top?.player || 'אורח'} · ${new Date().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}`;
  document.getElementById('stars').textContent =
    '⭐'.repeat(Math.max(1, Math.round(score / (TOTAL * 10) * 3)));
  game.shareButton(score, document.getElementById('share-slot'));
  show('end-screen');
  game.complete(score);
}
</script>
</body>
</html>
