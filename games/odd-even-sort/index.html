<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>זוגי או אי-זוגי | iakids</title>

<link rel="stylesheet" href="../game-style.css?v=55616175">

<style>.game-card{width:min(520px,calc(100vw - 28px))!important}.game-title{font-size:clamp(2.15rem,7vw,3.1rem)!important}/* PLAY */.play-note{color:#d5e4fb;font-size:.96rem;font-weight:800;margin:0 auto 12px;text-align:center}#tray{align-items:center;background:rgba(4,22,55,.5);border:1px solid rgba(116,177,255,.18);border-radius:22px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:160px;padding:12px}.chip{align-items:center;background:linear-gradient(180deg,#1c4e8d,#123b73);border:1px solid rgba(129,190,255,.35);border-radius:15px;box-shadow:0 9px 19px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.12);color:#fff;cursor:grab;display:inline-flex;font-size:1.55rem;font-weight:1000;justify-content:center;min-height:68px;min-width:112px;padding:8px 14px;position:relative;touch-action:none;user-select:none}.chip.dragging{box-shadow:0 18px 40px rgba(0,0,0,.36);cursor:grabbing;pointer-events:none;position:fixed;transform:scale(1.05);z-index:100}.bins{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-top:16px}.drop-zone{background:linear-gradient(180deg,rgba(18,69,124,.42),rgba(5,31,69,.60));border:2px dashed rgba(106,189,255,.45);border-radius:22px;min-height:175px;padding:12px 9px;transition:.2s ease}.drop-zone[data-parity="even"]{border-color:rgba(67,207,133,.67)}.drop-zone[data-parity="odd"]{border-color:rgba(158,111,255,.67)}.drop-zone.over{background:rgba(35,185,111,.18);border-color:#5dffad!important;transform:scale(1.015)}.drop-zone h3{color:#fff;font-size:1.2rem;font-weight:900;margin:0 0 10px;text-align:center}.bin-items{align-content:flex-start;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;min-height:72px}.bin-items span{background:linear-gradient(180deg,#27bc76,#16985b);border-radius:10px;color:#fff;font-size:1.05rem;font-weight:900;min-width:44px;padding:5px 10px;text-align:center}/* END */

@media(max-width:600px){

  .chip{min-width:calc(50% - 6px)}
  .drop-zone{min-height:145px}
}
</style>
</head>

<body class="theme-space">

<div class="game-hud">
  <span class="score">
    <span id="score-label">ניקוד</span>:
    <span id="score">0</span>
  </span>

  <span>
    <span id="q-label">מספר</span>
    <span id="qnum">1</span>/<span id="qtotal">10</span>
  </span>
</div>

<div class="game-card" id="card">

  <div id="start-screen">
    <div class="hero-icon">2️⃣➗</div>

    <h1 class="game-title" id="title"></h1>

    <p id="howto"></p>

    <p class="section-label" id="rounds-label"></p>

    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline success" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>

    <p class="section-label" id="level-label"></p>

    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)"></button>
      <button class="game-btn" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden">
    <div class="play-note" id="play-note"></div>

    <div id="tray"></div>

    <div class="bins">
      <div class="drop-zone" data-parity="even">
        <h3 id="even-label"></h3>
        <div class="bin-items"></div>
      </div>

      <div class="drop-zone" data-parity="odd">
        <h3 id="odd-label"></h3>
        <div class="bin-items"></div>
      </div>
    </div>
  </div>

  <div id="end-screen" class="end-screen" hidden">
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../nikud.js?v=961e2bed"></script>
<script src="../game-sdk.js?v=6a562bec"></script>

<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);

const T_REGULAR = {
  title:{he:'זוגי או אי-זוגי',en:'Odd or Even'},
  howto:{he:'גררו כל מספר לסל הנכון!',en:'Drag each number to the right bin!'},
  rounds:{he:'כמה מספרים למיין?',en:'How many numbers?'},
  level:{he:'בחרו רמת קושי',en:'Choose difficulty'},
  play:{he:'גררו כל מספר אל הסל המתאים',en:'Drag each number to the matching bin'},
  even:{he:'זוגי ➗2',en:'Even ➗2'},
  odd:{he:'אי-זוגי 🚫',en:'Odd 🚫'}
};

const T_NIQQUD = {
  title:{he:'זוּגִי אוֹ אִי־זוּגִי',en:'Odd or Even'},
  howto:{he:'גִּרְרוּ כָּל מִסְפָּר לַסַּל הַנָּכוֹן!',en:'Drag each number to the right bin!'},
  rounds:{he:'כַּמָּה מִסְפָּרִים לְמַיֵּן?',en:'How many numbers?'},
  level:{he:'בַּחֲרוּ רָמַת קֹשִׁי',en:'Choose difficulty'},
  play:{he:'גִּרְרוּ כָּל מִסְפָּר אֶל הַסַּל הַמַּתְאִים',en:'Drag each number to the matching bin'},
  even:{he:'זוּגִי ➗2',en:'Even ➗2'},
  odd:{he:'אִי־זוּגִי 🚫',en:'Odd 🚫'}
};

let CHILD_AGE = null;
let USE_NIQQUD = false;
let T = T_REGULAR;

let game, diff, level = 1, TOTAL = 10;
let score = 0, sorted = 0, mistakes = 0;
let drag = null, ending = false;

async function loadKidContext(){
  try{
    const kidId = localStorage.getItem('active_kid_id');
    if(!kidId) return;

    const client = await IAKidsActivity._getClient();

    const {data,error} = await client
      .from('kids_profiles')
      .select('id, age')
      .eq('id',kidId)
      .maybeSingle();

    if(error || !data){
      console.warn('[odd-even-sort] Kid profile was not loaded',error);
      return;
    }

    CHILD_AGE = Number(data.age);
    USE_NIQQUD = IAKidsNikud.enabled;   // the pill in the start screen, not a dead age test

  }catch(error){
    console.warn('[odd-even-sort] loadKidContext error',error);
  }
}

function applyLanguage(){
  T = USE_NIQQUD ? T_NIQQUD : T_REGULAR;

  $('title').textContent = IAKidsLang.t(T.title);
  $('howto').textContent = IAKidsLang.t(T.howto);
  $('rounds-label').textContent = IAKidsLang.t(T.rounds);
  $('level-label').textContent = IAKidsLang.t(T.level);
  $('play-note').textContent = IAKidsLang.t(T.play);
  $('even-label').textContent = IAKidsLang.t(T.even);
  $('odd-label').textContent = IAKidsLang.t(T.odd);
  $('score-label').textContent = IAKidsLang.ui('score');
  $('q-label').textContent = IAKidsLang.ui('question');
  $('best-label').textContent = IAKidsLang.ui('your_best');
  $('again-btn').textContent = IAKidsLang.ui('play_again');

  ['level_easy','level_medium','level_hard','level_random'].forEach((key,index)=>{
    document.querySelectorAll('#level-row .game-btn')[index].textContent =
      IAKidsLang.ui(key);
  });
}

IAKidsCoins.mount();

IAKidsHelp.mount({
  slug:'odd-even-sort',
  how:'גוררים כל מספר לסל המתאים: זוגי או אי-זוגי. מספר שמוין נכון נשאר בסל.',
  example:'<span dir="ltr"><b>8</b></span> ← זוגי · <span dir="ltr"><b>7</b></span> ← אי-זוגי'
});

function setRounds(n,btn){
  TOTAL = n;

  document.querySelectorAll('#rounds-row .game-btn')
    .forEach(button=>button.classList.remove('success'));

  btn.classList.add('success');
}

const ready = (async()=>{
  await loadKidContext();
  applyLanguage();

  game = await IAKidsGame.init('odd-even-sort');

  const progress = await game.loadProgress();

  if(progress?.rounds){
    const btn =
      document.querySelector(`#rounds-row [onclick*="(${progress.rounds},"]`) ||
      $('rounds-row').children[1];

    setRounds(progress.rounds,btn);
  }

  if(progress?.lastLevel !== undefined){
    document.querySelector(`#level-row [data-lvl="${progress.lastLevel}"]`)
      ?.classList.add('success');
  }
})();

const show = id=>{
  ['start-screen','play-screen','end-screen']
    .forEach(screen=>$(screen).hidden = screen !== id);
};

async function start(selectedLevel){
  await ready;

  level = selectedLevel;
  diff = game.difficulty(selectedLevel || 1,3);

  score = 0;
  sorted = 0;
  mistakes = 0;
  ending = false;
  drag = null;

  $('score').textContent = '0';
  $('qnum').textContent = '1';
  $('qtotal').textContent = TOTAL;

  document.querySelectorAll('.bin-items')
    .forEach(bin=>bin.innerHTML = '');

  IAKidsActivity.configure({
    difficulty:selectedLevel || 1,
    questionsCount:TOTAL,
    metadata:{
      game_mode:'odd-even-sort',
      selected_level:selectedLevel,
      random_difficulty:selectedLevel === 0,
      child_age:CHILD_AGE,
      uses_niqqud:USE_NIQQUD
    }
  });

  await game.saveProgress({
    lastLevel:selectedLevel,
    rounds:TOTAL
  });

  show('play-screen');
  await fillTray();
}

function makeItem(lvl){
  if(lvl === 0){
    lvl = 1 + rnd(3);
  }

  if(lvl <= 2){
    const n =
      1 +
      rnd(
        lvl === 1
          ? 20
          : 100
      );

    return {
      text:String(n),
      even:n % 2 === 0
    };
  }

  const a = 2 + rnd(9);
  const b = 2 + rnd(9);
  const multiply = Math.random() < .5;

  return {
    text:`${a} ${multiply ? '×' : '+'} ${b}`,
    even:
      (
        multiply
          ? a * b
          : a + b
      ) % 2 === 0
  };
}

async function fillTray(){
  const tray = $('tray');

  while(
    tray.querySelectorAll('.chip').length <
    Math.min(4,TOTAL - sorted)
  ){
    const lvl =
      level === 0
        ? 1 + rnd(3)
        : diff.level;

    const q =
      await game.newQuestion(
        ()=>makeItem(lvl),
        item=>item.text
      );

    const chip =
      document.createElement('div');

    chip.className = 'chip';

    chip.innerHTML =
      `<span dir="ltr">${q.text}</span>`;

    chip.dataset.even =
      q.even ? '1' : '0';

    makeDraggable(chip);

    tray.appendChild(chip);
  }
}

function makeDraggable(chip){
  chip.addEventListener('pointerdown',event=>{
    if(drag || ending) return;

    event.preventDefault();

    chip.setPointerCapture(
      event.pointerId
    );

    const rect =
      chip.getBoundingClientRect();

    drag = {
      chip,
      dx:event.clientX - rect.left,
      dy:event.clientY - rect.top
    };

    chip.style.width =
      `${rect.width}px`;

    chip.classList.add('dragging');

    IAKidsActivity.questionStarted();

    moveTo(event);
  });

  chip.addEventListener('pointermove',event=>{
    if(drag?.chip === chip){
      moveTo(event);
    }
  });

  chip.addEventListener('pointerup',event=>{
    if(drag?.chip === chip){
      dropChip(event);
    }
  });

  chip.addEventListener('pointercancel',()=>{
    if(drag?.chip === chip){
      settle(chip);
      drag = null;
      unmarkZones();
    }
  });
}

function moveTo(event){
  drag.chip.style.left =
    `${event.clientX - drag.dx}px`;

  drag.chip.style.top =
    `${event.clientY - drag.dy}px`;

  const zone =
    zoneAt(
      event.clientX,
      event.clientY
    );

  document.querySelectorAll('.drop-zone')
    .forEach(item=>
      item.classList.toggle(
        'over',
        item === zone
      )
    );
}

const zoneAt = (x,y)=>
  document.elementFromPoint(x,y)
    ?.closest('.drop-zone') || null;

const unmarkZones = ()=>
  document.querySelectorAll('.drop-zone')
    .forEach(item=>item.classList.remove('over'));

function settle(chip){
  chip.classList.remove('dragging');
  chip.style.left = '';
  chip.style.top = '';
  chip.style.width = '';
}

async function dropChip(event){
  const zone =
    zoneAt(
      event.clientX,
      event.clientY
    );

  unmarkZones();

  const chip = drag.chip;
  drag = null;

  settle(chip);

  if(!zone || ending) return;

  const correct =
    (
      zone.dataset.parity === 'even'
    ) === (
      chip.dataset.even === '1'
    );

  if(correct){
    score += 10;
    sorted++;

    $('score').textContent = score;
    $('qnum').textContent =
      Math.min(
        sorted + 1,
        TOTAL
      );

    diff.right();

    IAKidsActivity.correct();

    IAKidsFX.correct(zone);
    await IAKidsCoins.right(zone);

    const placed =
      document.createElement('span');

    placed.innerHTML =
      chip.innerHTML;

    zone.querySelector('.bin-items')
      .appendChild(placed);

    chip.remove();

    if(sorted >= TOTAL){
      await end();
      return;
    }

    await fillTray();

  }else{
    mistakes++;

    diff.wrong();

    IAKidsActivity.wrong();

    IAKidsFX.wrong(chip);

    await IAKidsCoins.wrong();
  }
}

async function end(){
  if(ending) return;

  ending = true;

  const maxScore =
    TOTAL * 10;

  const accuracy =
    TOTAL /
    Math.max(
      1,
      TOTAL + mistakes
    );

  await game.saveScore(
    score,
    {
      level,
      mistakes
    }
  );

  const top =
    (await game.getHighScores(1))[0];

  $('final-score').textContent =
    score;

  $('best').textContent =
    top?.score ?? score;

  $('player-line').textContent =
    `${top?.player || IAKidsLang.ui('guest')} · ${
      new Date().toLocaleString(
        'he-IL',
        {
          dateStyle:'short',
          timeStyle:'short'
        }
      )
    }`;

  $('stars').textContent =
    '⭐'.repeat(
      accuracy >= .9
        ? 3
        : accuracy >= .7
          ? 2
          : 1
    );

  await game.complete(
    score,
    {
      maxScore,

      performanceScore:
        Math.round(
          accuracy * 100
        ),

      metadata:{
        game_mode:'odd-even-sort',
        selected_level:level,
        random_difficulty:level === 0,
        total_items:TOTAL,
        sorted_items:sorted,
        mistakes,
        child_age:CHILD_AGE,
        uses_niqqud:USE_NIQQUD
      }
    }
  );

  game.shareButton(
    score,
    $('share-slot')
  );

  show('end-screen');
}
</script>
</body>
</html>
