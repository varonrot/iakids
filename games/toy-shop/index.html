<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧸 חנות צעצועים | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>
  .picked { outline: 4px solid var(--yellow); }
  #toy { font-size: 4.5rem; line-height: 1; margin: 6px 0; }
  #price { font-size: 2.2rem; font-weight: 900; color: var(--accent); }
  .money { font: inherit; font-weight: 800; border: none; cursor: pointer; margin: 4px;
           box-shadow: 0 3px 0 rgba(0,0,0,0.2); transition: transform 0.1s; }
  .money:active { transform: translateY(2px); }
  .coin { width: 58px; height: 58px; border-radius: 50%; font-size: 1.1rem;
          background: radial-gradient(circle at 35% 30%, #f3f4f6, #9ca3af); border: 3px solid #6b7280; }
  .coin.gold { background: radial-gradient(circle at 35% 30%, #fde68a, #d97706); border-color: #b45309; }
  .bill { width: 76px; height: 44px; border-radius: 8px; font-size: 1.1rem; color: #fff;
          background: linear-gradient(120deg, #4ade80, #15803d); border: 3px solid #14532d; }
  #tray { margin: 12px 0; min-height: 80px; }
  #tray .money { width: 48px; height: 48px; font-size: 0.95rem; }
  #tray .bill { width: 64px; height: 38px; }
  #sum-line { font-size: 1.3rem; font-weight: 800; }
  #hint-line { color: var(--purple); font-weight: 700; min-height: 1.4em; margin: 4px 0; }
</style>
</head>
<body>

<div class="game-hud">
  <span class="score"><span id="lbl-score"></span>: <span id="score">0</span></span>
  <span><span id="lbl-q"></span> <span dir="ltr"><span id="qnum">1</span>/<span id="qtotal">10</span></span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div style="font-size:4rem">🧸</div>
    <h1 class="game-title" id="title-line"></h1>
    <p id="intro-line"></p>
    <p id="rounds-line"></p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" data-n="5" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline" data-n="10" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" data-n="15" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)"></button>
      <button class="game-btn" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div id="toy"></div>
    <div id="price" dir="ltr"></div>
    <p id="hint-line"></p>
    <div id="bank"></div>
    <div id="tray" class="drop-zone"></div>
    <div id="sum-line"><span id="lbl-tray"></span>: <b dir="ltr"><span id="sum">0</span> ₪</b></div>
    <button class="game-btn success" id="confirm-btn" onclick="confirm_()"></button>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="lbl-best"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>
<script>
const t = d => IAKidsLang.t(d), ui = k => IAKidsLang.ui(k);
let game, diff, timer, score = 0, qnum = 0, current = null, level = 1, answering = false;
let TOTAL = 10, tray = [];
IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'toy-shop',
  how: 'גוררים מטבעות לקופה עד שמגיעים בדיוק למחיר של הצעצוע, ואז לוחצים "שלם".',
  example: 'צעצוע שעולה <span dir="ltr"><b>7 ₪</b></span> ← גוררים מטבע של 5 ומטבע של 2: <span dir="ltr"><b>5 + 2 = 7</b></span>',
});
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);

const DENOMS = [1, 2, 5, 10, 20];
const TOYS = ['🧸','🚗','⚽','🪁','🎨','🧩','🪀','🚂','🤖','🦖','🏀','🎸','🛴','🪆','🎯','✏️','📚','🛼','🚁','🥁'];

$('lbl-score').textContent = ui('score');
$('lbl-q').textContent = ui('question');
$('lbl-best').textContent = ui('your_best');
$('title-line').textContent = t({ he: 'חנות צעצועים', en: 'Toy Shop', es: 'Juguetería', de: 'Spielzeugladen', pt: 'Loja de brinquedos' });
$('intro-line').textContent = t({ he: 'שלמו על הצעצוע בסכום מדויק!', en: 'Pay the exact price for the toy!', es: '¡Paga el precio exacto!', de: 'Zahle den genauen Preis!', pt: 'Pague o preço exato!' });
$('rounds-line').textContent = t({ he: 'כמה שאלות?', en: 'How many questions?', es: '¿Cuántas preguntas?', de: 'Wie viele Fragen?', pt: 'Quantas perguntas?' });
$('lbl-tray').textContent = t({ he: 'בקופה', en: 'In the till', es: 'En la caja', de: 'In der Kasse', pt: 'No caixa' });
$('confirm-btn').textContent = t({ he: '✓ שלם', en: '✓ Pay', es: '✓ Pagar', de: '✓ Zahlen', pt: '✓ Pagar' });
$('again-btn').textContent = ui('play_again');
document.querySelector('[data-lvl="1"]').textContent = ui('level_easy');
document.querySelector('[data-lvl="2"]').textContent = ui('level_medium');
document.querySelector('[data-lvl="3"]').textContent = ui('level_hard');
document.querySelector('[data-lvl="0"]').textContent = ui('level_random');

function setRounds(n, btn) {
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.remove('success'));
  btn.classList.add('success');
}
const show = id => { for (const s of ['start-screen', 'play-screen', 'end-screen']) $(s).hidden = s !== id; };

const ready = (async () => {
  game = await IAKidsGame.init('toy-shop');
  const p = await game.loadProgress();
  if (p?.rounds) TOTAL = p.rounds;
  document.querySelector(`#rounds-row [data-n="${TOTAL}"]`)?.classList.add('success');
  if (p?.lastLevel != null) document.querySelector(`#level-row [data-lvl="${p.lastLevel}"]`)?.classList.add('picked');
})();

function moneyBtn(v, onClick) {
  const b = document.createElement('button');
  b.className = 'money ' + (v === 20 ? 'bill' : v >= 5 ? 'coin gold' : 'coin');
  b.innerHTML = `<span dir="ltr">${v} ₪</span>`;
  b.onclick = onClick;
  return b;
}

// bank of denominations (built once)
DENOMS.forEach(v => $('bank').appendChild(moneyBtn(v, function () {
  if (answering) return;
  tray.push(v);
  IAKidsFX._beep([[988, 0, 0.06]]);
  renderTray();
})));

function renderTray() {
  $('tray').innerHTML = '';
  tray.forEach((v, i) => $('tray').appendChild(moneyBtn(v, () => {
    if (answering) return;
    tray.splice(i, 1);
    IAKidsFX._beep([[300, 0, 0.06]]);
    renderTray();
  })));
  $('sum').textContent = tray.reduce((a, b) => a + b, 0);
}

// ponytail: ₪ denominations are canonical — greedy gives the true minimum coin count
const minCoins = p => DENOMS.slice().reverse().reduce((c, v) => (c.n += Math.floor(c.r / v), c.r %= v, c), { n: 0, r: p }).n;

async function start(lvl) {
  await ready;
  level = lvl;
  diff = game.difficulty(lvl || 1, 3);
  timer = game.timer({ style: 'bomb', onTimeout: () => judge(null) });
  await game.saveProgress({ lastLevel: lvl, rounds: TOTAL });
  $('qtotal').textContent = TOTAL;
  show('play-screen');
  next();
}

// level 1: up to 10₪ · 2: up to 50₪ · 3: exact sum with fewest coins
function makeQuestion(lvl) {
  const price = lvl === 1 ? 2 + rnd(9) : lvl === 2 ? 11 + rnd(40) : 13 + rnd(87);
  return { toy: TOYS[rnd(TOYS.length)], price, lvl };
}

async function next() {
  if (qnum >= TOTAL) return end();
  qnum++;
  answering = false;
  tray = [];
  renderTray();
  $('qnum').textContent = qnum;
  const lvl = level === 0 ? 1 + rnd(3) : diff.level;
  current = await game.newQuestion(() => makeQuestion(lvl), q => `${q.toy}|${q.price}`);
  $('toy').textContent = current.toy;
  $('price').textContent = `${current.price} ₪`;
  $('hint-line').textContent = current.lvl === 3
    ? t({ he: 'שלמו בכמה שפחות מטבעות ושטרות!', en: 'Pay with as few coins as possible!', es: '¡Paga con las menos monedas posible!', de: 'Zahle mit so wenig Münzen wie möglich!', pt: 'Pague com o mínimo de moedas!' })
    : '';
  timer.start(IAKidsTimer.secondsFor(current.lvl, 35, 16)); // generous — picking coins takes time
}

function confirm_() {
  if (answering) return;
  const sum = tray.reduce((a, b) => a + b, 0);
  const ok = sum === current.price && (current.lvl !== 3 || tray.length === minCoins(current.price));
  if (!ok && sum === current.price) // right sum, too many coins
    $('hint-line').textContent = t({ he: 'הסכום נכון — אבל אפשר בפחות מטבעות!', en: 'Right amount — but fewer coins is possible!', es: 'Cantidad correcta, ¡pero con menos monedas!', de: 'Richtiger Betrag — aber es geht mit weniger Münzen!', pt: 'Valor certo — mas dá com menos moedas!' });
  judge(ok);
}

function judge(ok) {
  if (answering) return;
  answering = true;
  timer.stop();
  const btn = $('confirm-btn');
  if (ok) {
    score += 10; diff.right();
    IAKidsFX.correct(btn); IAKidsCoins.right(btn);
  } else {
    diff.wrong();
    IAKidsFX.wrong(btn); IAKidsCoins.wrong();
  }
  $('score').textContent = score;
  setTimeout(next, 900);
}

async function end() {
  timer.stop();
  await game.saveScore(score, { level });
  const top = (await game.getHighScores(1))[0];
  $('final-score').textContent = score;
  $('best').textContent = top?.score ?? score;
  $('player-line').textContent =
    `${top?.player || ui('guest')} · ${new Date().toLocaleString(IAKidsLang.code === 'he' ? 'he-IL' : IAKidsLang.code, { dateStyle: 'short', timeStyle: 'short' })}`;
  $('stars').textContent = '⭐'.repeat(Math.max(1, Math.round(score / (TOTAL * 10) * 3)));
  game.shareButton(score, $('share-slot'));
  show('end-screen');
  game.complete(score);
}
</script>
</body>
</html>
