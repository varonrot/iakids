<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הקראת סיפור עם השלמת מילים | iakids</title>
<link rel="stylesheet" href="../game-style.css?v=0eea1d9b">
<style>
/* Shared dark space theme (body.theme-space in ../game-style.css). */
.howto{max-width:410px;margin:14px auto 20px;color:var(--space-muted)!important;font-weight:600;line-height:1.65}
</style>
</head>
<body class="theme-space">

<div class="game-hud">
  <span class="score"><span id="score-label"></span>: <span id="score">0</span></span>
  <span><span id="q-label"></span> <span id="qnum">1</span>/<span id="qtotal">10</span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div class="hero-icon">📖</div>
    <h1 class="game-title" id="title"></h1>
    <p id="instr" class="howto"></p>
    <p id="rounds-label" class="section-label"></p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" data-r="5" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline" data-r="10" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" data-r="15" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-l="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-l="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-l="3" onclick="start(3)"></button>
      <button class="game-btn" data-l="0" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div class="game-question" id="question" style="font-size:1.4rem;line-height:1.6"></div>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="answers"></div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="nikud.js?v=9497246c"></script>
<script src="../game-sdk.js?v=09f6afe2"></script>
<script>
const SLUG = 'story-fill';
const T = {
  title: { he: 'הקראת סיפור עם השלמת מילים', en: 'Story Fill-in', es: 'Completa la historia', de: 'Geschichte ergänzen', pt: 'Complete a história' },
  instr: { he: 'קראו את הסיפור ובחרו את המילה שמתאימה למקום הריק ◻', en: 'Read the story and pick the word that fits the blank', es: 'Lee la historia y elige la palabra correcta', de: 'Lies die Geschichte und wähle das passende Wort', pt: 'Leia a história e escolha a palavra certa' },
  rounds: { he: 'כמה שאלות?', en: 'How many questions?', es: '¿Cuántas preguntas?', de: 'Wie viele Fragen?', pt: 'Quantas perguntas?' },
};
document.getElementById('title').textContent = IAKidsLang.t(T.title);
document.getElementById('instr').textContent = IAKidsLang.t(T.instr);
document.getElementById('rounds-label').textContent = IAKidsLang.t(T.rounds);
document.getElementById('score-label').textContent = IAKidsLang.ui('score');
document.getElementById('q-label').textContent = IAKidsLang.ui('question');
document.getElementById('best-label').textContent = IAKidsLang.ui('your_best');
document.getElementById('again-btn').textContent = IAKidsLang.ui('play_again');
for (const [l, k] of [[1, 'level_easy'], [2, 'level_medium'], [3, 'level_hard'], [0, 'level_random']])
  document.querySelector(`#level-row [data-l="${l}"]`).textContent = IAKidsLang.ui(k);

let game, score = 0, qnum = 0, level = 1, right = 0, TOTAL = 10, locked = false, diff;
IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: SLUG,
  how: 'בסיפור חסרה מילה אחת, שמסומנת ב-◻. צריך לבחור מתוך 3 מילים את זו שהכי מתאימה להמשך הסיפור בהיגיון.',
  example: '<b>הילד הצמא שתה כוס ◻ קרים.</b><br>מים ✓ &nbsp; אבנים ✗ &nbsp; ספרים ✗',
});

// pool: level 1 = one sentence, 2 = short paragraph, 3 = paragraph, harder/less-obvious distractors
const POOL = [
  { level: 1, text: 'הילד הצמא שתה כוס ◻ קרים.', ans: 'מים', wrongs: ['כיסאות', 'ספרים'] },
  { level: 1, text: 'בחורף יורד ◻ לבן על ההרים.', ans: 'שלג', wrongs: ['תפוח', 'כיסא'] },
  { level: 1, text: 'הדייג זרק את החכה ל◻ וחיכה לדג.', ans: 'ים', wrongs: ['ארון', 'ספר'] },
  { level: 1, text: 'אמא אפתה עוגה ב◻ החם.', ans: 'תנור', wrongs: ['מקרר', 'כדור'] },
  { level: 1, text: 'הציפור בנתה ◻ על העץ הגבוה.', ans: 'קן', wrongs: ['שולחן', 'מכונית'] },
  { level: 1, text: 'הילדה ציירה ◻ צהוב בשמיים.', ans: 'בלון', wrongs: ['כלב', 'ספר'] },
  { level: 2, text: 'דני קם מוקדם בבוקר. הוא הלך אל ה◻ ושטף את הפנים במים קרים. אחר כך אכל ארוחת בוקר.', ans: 'כיור', wrongs: ['גינה', 'כדור'] },
  { level: 2, text: 'רותי אוהבת לקרוא. בכל ערב היא לוקחת ◻ מהמדף ונכנסת למיטה. היא קוראת עד שהיא נרדמת.', ans: 'ספר', wrongs: ['כדור', 'מקרר'] },
  { level: 2, text: 'בגן החיות ראינו אריה גדול. הוא ◻ חזק ומפחיד את כל בעלי החיים האחרים. כולם ברחו כשהוא התקרב.', ans: 'שאג', wrongs: ['לחש', 'ריקד'] },
  { level: 2, text: 'יוסי שיחק כדורגל עם חבריו בחצר. הוא בעט חזק וכל הילדים ◻ משמחה. גם המורה חייכה.', ans: 'צהלו', wrongs: ['רבו', 'ישנו'] },
  { level: 2, text: 'בקיץ החם מאוד רצינו לקרר את עצמנו. קנינו ◻ בטעם תות ואכלנו אותה בהנאה. היה ממש טעים.', ans: 'גלידה', wrongs: ['מגבת', 'כרית'] },
  { level: 2, text: 'בכיתה שלנו יש מורה נחמדה. היא מלמדת אותנו לקרוא ולכתוב, ובכל יום שישי היא מספרת לנו ◻ מעניין. כולנו אוהבים להקשיב.', ans: 'סיפור', wrongs: ['עיפרון', 'כיסא'] },
  { level: 3, text: 'השמש שקעה מאחורי ההרים, והשמיים הצטבעו באדום ובכתום. הציפורים חזרו ל◻ שלהן לפני רדת החושך. הכול נהיה שקט ורגוע.', ans: 'קן', wrongs: ['מדף', 'מחסן'] },
  { level: 3, text: 'עומר אימן במשך חודשים לקראת תחרות השחייה. ביום התחרות הוא קפץ למים ושחה במהירות ◻. הוא זכה במקום הראשון וכולם מחאו כפיים.', ans: 'רבה', wrongs: ['קטנה', 'ישנה'] },
  { level: 3, text: 'הסופרת ישבה שעות ארוכות מול המחשב. היא כתבה סיפור ◻ על ילדה שיודעת לדבר עם בעלי חיים. כשסיימה, היא חייכה בסיפוק.', ans: 'קסום', wrongs: ['משעמם', 'כבד'] },
  { level: 3, text: 'ביום הראשון של החופש הגדול התעוררנו מוקדם והתרגשנו מאוד. ארזנו תיק גדול והלכנו לטייל ב◻ הירוק ליד הבית. ראינו שם ציפורים וארנבים.', ans: 'יער', wrongs: ['מחסן', 'מסדרון'] },
  { level: 3, text: 'המדען בדק את המבחנה בזהירות רבה. הנוזל בפנים התחיל לבעבע ולשנות ◻ בהדרגה. הוא רשם את התוצאה במחברת המעבדה.', ans: 'צבע', wrongs: ['ריח', 'שם'] },
  { level: 3, text: 'הנגן עלה לבמה כשהאולם מלא בקהל דרוך. הוא נגע במיתרים והפיק מהגיטרה צליל ◻ שהילך קסם על כולם. הקהל מחא כפיים בסיום.', ans: 'נפלא', wrongs: ['מפחיד', 'עצוב'] },
  { level: 1, text: 'הכלב נבח על ה◻ שטיפס על הגדר.', ans: 'חתול', wrongs: ['שולחן', 'עיפרון'] },
  { level: 1, text: 'סבתא הכינה ◻ חם לארוחת הערב.', ans: 'מרק', wrongs: ['כדור', 'מעיל'] },
  { level: 1, text: 'הילדים בנו ◻ חול גדול בים.', ans: 'ארמון', wrongs: ['מטוס', 'תפוח'] },
  { level: 1, text: 'בבוקר ה◻ זורחת ומאירה את החדר.', ans: 'שמש', wrongs: ['מיטה', 'עוגה'] },
  { level: 1, text: 'אבא נהג ב◻ החדשה לעבודה.', ans: 'מכונית', wrongs: ['גלידה', 'שמלה'] },
  { level: 1, text: 'הדבורה עפה מפרח לפרח ואספה ◻ מתוק.', ans: 'צוף', wrongs: ['חול', 'ברזל'] },
  { level: 1, text: 'הילדה קראה ◻ מרתק לפני השינה.', ans: 'ספר', wrongs: ['מלפפון', 'בלון'] },
  { level: 1, text: 'הציפור פרשה ◻ ועפה לשמיים.', ans: 'כנפיים', wrongs: ['נעליים', 'משקפיים'] },
  { level: 1, text: 'התינוק ישן ב◻ הקטנה שלו.', ans: 'עריסה', wrongs: ['מקלחת', 'מכונית'] },
  { level: 1, text: 'הגנן השקה את ה◻ במים.', ans: 'פרחים', wrongs: ['ספרים', 'כיסאות'] },
  { level: 1, text: 'הרופא הקשיב ל◻ של הילד עם הסטטוסקופ.', ans: 'לב', wrongs: ['כובע', 'תיק'] },
  { level: 1, text: 'הדייג הפליג ב◻ קטנה אל האי.', ans: 'סירה', wrongs: ['מיטה', 'מחברת'] },
  { level: 2, text: 'נועה הלכה עם אבא לסופר. היא לקחה ◻ ודחפה אותה בין המדפים. בסוף שילמו בקופה וחזרו הביתה.', ans: 'עגלה', wrongs: ['מטרייה', 'שמיכה'] },
  { level: 2, text: 'בלילה ירד גשם חזק. בבוקר יצאנו החוצה וראינו ◻ צבעונית בשמיים. כולם עצרו להסתכל.', ans: 'קשת', wrongs: ['מכונית', 'עוגה'] },
  { level: 2, text: 'יובל אוהב לנגן. בכל יום הוא מתאמן על ה◻ שלו במשך שעה. אמא אומרת שהוא מנגן יפה מאוד.', ans: 'גיטרה', wrongs: ['מקרר', 'מברשת'] },
  { level: 2, text: 'בחצר בית הספר יש עץ גדול. בקיץ הילדים יושבים ב◻ שלו ונחים מהחום. ציפורים בונות בו קן.', ans: 'צל', wrongs: ['מטבח', 'ארון'] },
  { level: 2, text: 'סבא של דן הוא נגר. הוא בונה ◻ מעץ ומוכר אותם בשוק. הכיסאות שלו חזקים ויפים.', ans: 'רהיטים', wrongs: ['עוגות', 'שירים'] },
  { level: 2, text: 'בבוקר קר במיוחד יצאנו לבית הספר. לבשנו ◻ עבה וכפפות. בכיתה היה חם ונעים.', ans: 'מעיל', wrongs: ['סנדל', 'כובע ים'] },
  { level: 2, text: 'תמר קיבלה ◻ ליום ההולדת. היא פתחה את העטיפה בהתרגשות ומצאה בפנים משחק חדש. כל החברים שיחקו יחד.', ans: 'מתנה', wrongs: ['מכתב', 'קנס'] },
  { level: 2, text: 'הכיתה יצאה לטיול ביער. המדריך הראה לנו ◻ קטנות של חיות על האדמה הרטובה. ניחשנו איזו חיה עברה כאן.', ans: 'עקבות', wrongs: ['עוגיות', 'מנורות'] },
  { level: 2, text: 'בערב שבת כל המשפחה ישבה סביב השולחן. אמא הדליקה ◻ ואבא בירך על היין. אכלנו חלה טרייה.', ans: 'נרות', wrongs: ['אורות', 'תמונות'] },
  { level: 2, text: 'איתי מצא ◻ חום קטן בגינה. הוא הביא לו חלב וקרא לו נמר. עכשיו הם חברים טובים.', ans: 'גור חתולים', wrongs: ['אבן', 'ספר'] },
  { level: 3, text: 'הצוללת ירדה לאט אל מעמקי הים. דרך החלון העגול ראו החוקרים דגים זוהרים ו◻ ענקי ששט לידם בשקט. הם צילמו הכול למחקר.', ans: 'לווייתן', wrongs: ['ארנב', 'מקרר'] },
  { level: 3, text: 'הארכיאולוגית חפרה בזהירות באדמה. פתאום המברשת שלה נגעה במשהו קשה, והיא חשפה ◻ עתיק מלא במטבעות. כל הצוות הריע.', ans: 'כד', wrongs: ['פלאפון', 'אופניים'] },
  { level: 3, text: 'הכבאים הגיעו במהירות לבניין. הם פרשו ◻ ארוך ומשכו אותו מהמשאית עד לקומה השלישית. תוך דקות האש כובתה.', ans: 'צינור', wrongs: ['שטיח', 'סרט'] },
  { level: 3, text: 'האסטרונאוטית הביטה מחלון החללית. כדור הארץ נראה כמו ◻ כחול ויפה שצף בחלל השחור. היא צילמה תמונה למשפחה.', ans: 'כדור', wrongs: ['ריבוע', 'משולש'] },
  { level: 3, text: 'הבצורת נמשכה חודשים ארוכים. החקלאים הביטו בשמיים בתקווה, ולבסוף הגיע ה◻ הראשון והרווה את השדות היבשים.', ans: 'גשם', wrongs: ['שלט', 'קיץ'] },
  { level: 3, text: 'המנצח הרים את השרביט והתזמורת התחילה לנגן. הכינורות והחלילים נשמעו יחד ב◻ מושלמת, והקהל האזין בשקט.', ans: 'הרמוניה', wrongs: ['מהומה', 'תחרות'] },
  { level: 3, text: 'הצב הזקן חצה את הכביש לאט מאוד. הנהגים עצרו בסבלנות וחיכו, כי ידעו שלצב אין ◻ למהר. בסוף הגיע בשלום לצד השני.', ans: 'סיבה', wrongs: ['מטרייה', 'גלידה'] },
  { level: 3, text: 'בליל הסערה נותק ה◻ בכל השכונה. הדלקנו נרות ופנסים, סיפרנו סיפורים בחושך, ובבוקר הכול חזר לעבוד.', ans: 'חשמל', wrongs: ['שמיכה', 'עוגה'] },
];

(async () => {
  game = await IAKidsGame.init(SLUG);
  const p = await game.loadProgress();
  const r = p?.rounds || TOTAL;
  setRounds(r, document.querySelector(`#rounds-row [data-r="${r}"]`));
  if (p?.lastLevel != null)
    document.querySelector(`#level-row [data-l="${p.lastLevel}"]`)?.classList.add('bounce-in');
})();

function setRounds(n, btn) {
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.remove('success'));
  btn?.classList.add('success');
}

const show = id => {
  for (const s of ['start-screen', 'play-screen', 'end-screen'])
    document.getElementById(s).hidden = s !== id;
};

async function start(lvl) {
  if (!game) game = await IAKidsGame.init(SLUG);
  level = lvl;
  diff = game.difficulty(lvl || 1, 3);
  await game.saveProgress({ lastLevel: lvl, rounds: TOTAL });
  document.getElementById('qtotal').textContent = TOTAL;
  show('play-screen');
  next();
}

const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => a.sort(() => Math.random() - 0.5);
const poolForLevel = lvl => POOL.filter(x => x.level <= lvl);

function makeQuestion(lvl) {
  const pool = poolForLevel(lvl);
  return pool[rnd(pool.length)];
}

async function next() {
  if (qnum >= TOTAL) return end();
  qnum++;
  locked = false;
  document.getElementById('qnum').textContent = qnum;
  const lvl = level === 0 ? 1 + rnd(3) : diff.level;
  const q = await game.newQuestion(() => makeQuestion(lvl), x => x.text);
  document.getElementById('question').innerHTML = q.text.replace('◻', '<b style="color:var(--accent)">◻</b>');
  const grid = document.getElementById('answers');
  grid.innerHTML = '';
  for (const o of shuffle([q.ans, ...q.wrongs])) {
    const btn = document.createElement('button');
    btn.className = 'game-btn';
    btn.textContent = o;
    btn.onclick = () => answer(o === q.ans, btn);
    grid.appendChild(btn);
  }
}

function answer(ok, btn) {
  if (locked) return;
  locked = true;
  if (ok) {
    score += 10; right++;
    diff.right();
    IAKidsFX.correct(btn);
    IAKidsCoins.right(btn);
  } else {
    diff.wrong();
    IAKidsFX.wrong(btn);
    IAKidsCoins.wrong();
  }
  document.getElementById('score').textContent = score;
  setTimeout(next, 700);
}

async function end() {
  await game.saveScore(score, { level, rounds: TOTAL, right });
  const top = (await game.getHighScores(1))[0];
  document.getElementById('final-score').textContent = score;
  document.getElementById('best').textContent = top?.score ?? score;
  document.getElementById('player-line').textContent =
    `${top?.player || IAKidsLang.ui('guest')} · ${new Date().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}`;
  document.getElementById('stars').textContent =
    '⭐'.repeat(Math.max(1, Math.round(right / TOTAL * 3)));
  game.shareButton(score, document.getElementById('share-slot'));
  show('end-screen');
  game.complete(score);
}
</script>
</body>
</html>
