<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>זהה את היבשת | iakids</title>

<link rel="stylesheet" href="../game-style.css">

<style>
:root{
  --space-bg:#06142d;
  --space-panel:#0b2857;
  --space-panel-dark:#071d43;
  --space-line:rgba(119,176,255,.27);
  --space-text:#f7f9ff;
  --space-muted:#b8c7e3;
  --space-blue:#1693f1;
  --space-green:#1ea96b;
  --space-purple:#7653ff;
  --space-gold:#ffd15c;
}

html,body{min-height:100%}

body{
  margin:0 !important;
  min-height:100vh !important;
  padding:86px 18px 28px !important;
  overflow-x:hidden;
  color:var(--space-text) !important;
  font-family:"Heebo","Segoe UI",Arial,sans-serif !important;
  background:
    radial-gradient(circle at 12% 16%,rgba(26,139,255,.23),transparent 34%),
    radial-gradient(circle at 88% 10%,rgba(112,72,255,.25),transparent 35%),
    radial-gradient(circle at 50% 100%,rgba(12,184,203,.16),transparent 34%),
    linear-gradient(145deg,#050f25,#0a2148 52%,#07152e) !important;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.75) 0 1px,transparent 1.4px);
  background-size:56px 56px;
  opacity:.08;
}

*{box-sizing:border-box}

.game-card{
  width:min(620px,calc(100vw - 28px)) !important;
  min-height:690px;
  margin:0 auto !important;
  padding:0 !important;
  overflow:hidden;
  border:1px solid var(--space-line) !important;
  border-radius:28px !important;
  color:var(--space-text) !important;
  background:
    linear-gradient(180deg,rgba(17,58,111,.97),rgba(5,25,61,.98)) !important;
  box-shadow:
    0 28px 75px rgba(0,8,28,.48),
    inset 0 1px rgba(255,255,255,.08) !important;
}

.game-hud{
  position:fixed !important;
  top:0 !important;
  left:0 !important;
  right:0 !important;
  z-index:20;
  min-height:72px;
  padding:16px 24px !important;
  display:flex !important;
  align-items:center;
  justify-content:center !important;
  gap:42px;
  color:#fff !important;
  background:rgba(5,18,46,.88) !important;
  border-bottom:1px solid rgba(126,180,255,.18);
  backdrop-filter:blur(14px);
}

.game-hud .score{color:var(--space-gold) !important}

#start-screen,#play-screen,#end-screen{
  min-height:688px;
  padding:34px 30px 30px;
}

#start-screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.hero-icon{
  margin:6px 0 8px;
  font-size:5rem;
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.22));
}

.game-title{
  margin:0;
  font-size:clamp(2.15rem,7vw,3.1rem) !important;
  line-height:1.05;
  color:#fff !important;
  text-shadow:0 4px 12px rgba(0,0,0,.22);
}

#howto{
  max-width:420px;
  margin:14px auto 20px;
  color:var(--space-muted) !important;
  font-weight:600;
  line-height:1.65;
}

.section-label{
  margin:8px 0 10px;
  color:#fff;
  font-weight:900;
}

.answer-grid{
  width:100%;
  gap:12px !important;
}

.game-btn{
  min-height:54px;
  border-radius:15px !important;
  border:1px solid rgba(118,176,255,.34) !important;
  color:#fff !important;
  font-weight:900 !important;
  background:linear-gradient(180deg,#1c91db,#0877bd) !important;
  box-shadow:inset 0 1px rgba(255,255,255,.18),0 9px 20px rgba(0,0,0,.16) !important;
}

.game-btn:hover{transform:translateY(-2px)}
.game-btn.outline{background:linear-gradient(180deg,rgba(52,81,139,.72),rgba(21,49,99,.75)) !important}
.game-btn.success{background:linear-gradient(180deg,#37d182,#16ad64) !important;border-color:rgba(97,255,174,.6) !important}
#level-row{margin-top:16px}
#level-row .game-btn[data-lvl="0"]{background:linear-gradient(180deg,#8054ff,#6035dc) !important}

/* PLAY */
#play-screen{position:relative}

.game-question{
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:12px;
  padding:10px 16px;
  border-radius:16px;
  text-align:center;
  color:#fff !important;
  font-size:1.4rem !important;
  font-weight:900;
  background:rgba(4,22,55,.5);
  border:1px solid rgba(116,177,255,.18);
}

#mapWrap{
  max-width:500px;
  margin:8px auto;
  padding:12px;
  border-radius:24px;
  background:
    radial-gradient(circle at 50% 18%,rgba(90,180,255,.14),transparent 55%),
    rgba(4,22,55,.44);
  border:1px solid rgba(116,177,255,.18);
  box-shadow:0 16px 34px rgba(0,0,0,.17);
}

#worldmap{
  width:100%;
  height:auto;
  display:block;
  touch-action:manipulation;
}

.region{
  fill:#b7dfa8;
  stroke:#ffffff;
  stroke-width:4;
  cursor:pointer;
  transition:fill .2s,filter .2s,transform .16s;
  transform-box:fill-box;
  transform-origin:center;
}

.region:hover{
  fill:#a3d18f;
  filter:brightness(1.05);
}

.region.ocean{
  fill:#67bfe4;
  stroke-width:3;
}

.region.correct-flash{
  fill:#2bc875 !important;
  filter:drop-shadow(0 0 12px rgba(43,200,117,.5));
}

.region.wrong-flash{
  fill:#f05f68 !important;
}

.region-label{
  font-size:26px;
  font-weight:900;
  fill:#10223d;
  text-anchor:middle;
  pointer-events:none;
  opacity:0;
  transition:opacity .2s;
  paint-order:stroke;
  stroke:rgba(255,255,255,.75);
  stroke-width:4px;
}

.region-label.show{opacity:1}

/* END */
#end-screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.stars{
  min-height:78px;
  font-size:3.7rem !important;
  letter-spacing:4px;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.24));
}

.big-score{
  margin:8px 0;
  color:#fff !important;
  font-size:4rem !important;
  font-weight:1000;
}

#player-line,#end-screen p{color:#d7e3f7 !important}
#share-slot{margin-top:8px}
[hidden]{display:none !important}

@media(max-width:600px){
  body{padding:74px 10px 18px !important}

  .game-card{
    min-height:calc(100vh - 94px);
    border-radius:22px !important;
  }

  #start-screen,#play-screen,#end-screen{
    min-height:calc(100vh - 96px);
    padding:26px 14px 24px;
  }

  .game-hud{
    min-height:62px;
    padding:12px 14px !important;
    gap:24px;
  }

  #mapWrap{padding:7px}
  .region-label{font-size:22px}
}
</style>
</head>

<body>

<div class="game-hud">
  <span class="score">
    <span id="score-label">ניקוד</span>:
    <span id="score">0</span>
  </span>

  <span>
    <span id="q-label">שאלה</span>
    <span id="qnum">1</span>/<span id="qtotal">10</span>
  </span>
</div>

<div class="game-card" id="card">

  <div id="start-screen">
    <div class="hero-icon">🗺️🌍</div>

    <h1 class="game-title" id="title"></h1>

    <p id="howto"></p>

    <p class="section-label" id="rounds-label"></p>

    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline success" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>

    <p class="section-label" id="level-label"></p>

    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)"></button>
      <button class="game-btn" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div class="game-question" id="question"></div>

    <div id="mapWrap">
      <svg id="worldmap" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>

<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);

const T_REGULAR = {
  title:{he:'זהה את היבשת',en:'Identify the Continent'},
  howto:{he:'לחצו על היבשת הנכונה במפת העולם!',en:'Tap the correct continent on the world map!'},
  rounds:{he:'כמה שאלות?',en:'How many questions?'},
  level:{he:'בחרו רמת קושי',en:'Choose difficulty'},
  where:{he:'איפה נמצא/ת ',en:'Where is '}
};

const T_NIQQUD = {
  title:{he:'זַהוּ אֶת הַיַּבֶּשֶׁת',en:'Identify the Continent'},
  howto:{he:'לַחֲצוּ עַל הַיַּבֶּשֶׁת הַנְּכוֹנָה בְּמַפַּת הָעוֹלָם!',en:'Tap the correct continent on the world map!'},
  rounds:{he:'כַּמָּה שְׁאֵלוֹת?',en:'How many questions?'},
  level:{he:'בַּחֲרוּ רָמַת קֹשִׁי',en:'Choose difficulty'},
  where:{he:'אֵיפֹה נִמְצֵאת ',en:'Where is '}
};

const REGIONS_REGULAR = [
  {id:'namerica',name:'צפון אמריקה',minLevel:1,ocean:false,points:'120,80 260,90 290,180 230,260 150,320 90,300 50,220 60,140',label:[165,190]},
  {id:'asia',name:'אסיה',minLevel:1,ocean:false,points:'580,70 860,60 900,180 840,300 740,340 650,300 590,220 560,140',label:[720,190]},
  {id:'africa',name:'אפריקה',minLevel:1,ocean:false,points:'470,215 580,210 610,300 590,420 540,480 480,460 450,340',label:[520,340]},
  {id:'samerica',name:'דרום אמריקה',minLevel:2,ocean:false,points:'230,330 300,320 330,380 310,450 270,480 230,470 210,400',label:[265,400]},
  {id:'europe',name:'אירופה',minLevel:2,ocean:false,points:'460,90 560,80 580,150 540,210 470,200 440,140',label:[505,145]},
  {id:'australia',name:'אוסטרליה',minLevel:2,ocean:false,points:'760,410 880,400 900,450 860,485 780,480 750,450',label:[815,445]},
  {id:'antarctica',name:'אנטארקטיקה',minLevel:2,ocean:false,points:'20,520 980,520 980,590 20,590',label:[500,560]},
  {id:'pacific1',name:'האוקיינוס השקט',minLevel:3,ocean:true,group:'pacific',points:'0,70 150,70 150,450 0,450',label:[75,260]},
  {id:'pacific2',name:'האוקיינוס השקט',minLevel:3,ocean:true,group:'pacific',points:'850,70 1000,70 1000,450 850,450',label:[925,260]},
  {id:'atlantic',name:'האוקיינוס האטלנטי',minLevel:3,ocean:true,group:'atlantic',points:'260,70 450,70 450,450 260,450',label:[355,260]},
  {id:'indian',name:'האוקיינוס ההודי',minLevel:3,ocean:true,group:'indian',points:'560,300 850,300 850,450 560,450',label:[700,380]},
  {id:'arctic',name:'האוקיינוס הארקטי',minLevel:3,ocean:true,group:'arctic',points:'0,0 1000,0 1000,60 0,60',label:[500,32]}
];

const NIQQUD_NAMES = {
  namerica:'צְפוֹן אָמֶרִיקָה',
  asia:'אַסְיָה',
  africa:'אַפְרִיקָה',
  samerica:'דְּרוֹם אָמֶרִיקָה',
  europe:'אֵירוֹפָּה',
  australia:'אוֹסְטְרַלְיָה',
  antarctica:'אַנְטַרְקְטִיקָה',
  pacific1:'הָאוֹקְיָנוֹס הַשָּׁקֵט',
  pacific2:'הָאוֹקְיָנוֹס הַשָּׁקֵט',
  atlantic:'הָאוֹקְיָנוֹס הָאַטְלַנְטִי',
  indian:'הָאוֹקְיָנוֹס הַהוֹדִי',
  arctic:'הָאוֹקְיָנוֹס הָאַרְקְטִי'
};

let CHILD_AGE = null;
let USE_NIQQUD = false;
let T = T_REGULAR;

let game, diff, timer;
let score = 0, qnum = 0, level = 1, TOTAL = 10;
let locked = false, current, mistakes = 0, timeouts = 0, ending = false;

function regionName(region){
  if(IAKidsLang.code === 'he' && USE_NIQQUD){
    return NIQQUD_NAMES[region.id] || region.name;
  }
  return region.name;
}

async function loadKidContext(){
  try{
    const kidId = localStorage.getItem('active_kid_id');
    if(!kidId) return;

    const client = await IAKidsActivity._getClient();

    const {data,error} = await client
      .from('kids_profiles')
      .select('id, age')
      .eq('id',kidId)
      .maybeSingle();

    if(error || !data){
      console.warn('[continents] Kid profile was not loaded',error);
      return;
    }

    CHILD_AGE = Number(data.age);
    USE_NIQQUD = CHILD_AGE === 1 || CHILD_AGE === 2;

  }catch(error){
    console.warn('[continents] loadKidContext error',error);
  }
}

function applyLanguage(){
  T = USE_NIQQUD ? T_NIQQUD : T_REGULAR;

  $('title').textContent = IAKidsLang.t(T.title);
  $('howto').textContent = IAKidsLang.t(T.howto);
  $('rounds-label').textContent = IAKidsLang.t(T.rounds);
  $('level-label').textContent = IAKidsLang.t(T.level);
  $('score-label').textContent = IAKidsLang.ui('score');
  $('q-label').textContent = IAKidsLang.ui('question');
  $('best-label').textContent = IAKidsLang.ui('your_best');
  $('again-btn').textContent = IAKidsLang.ui('play_again');

  ['level_easy','level_medium','level_hard','level_random'].forEach((key,index)=>{
    document.querySelectorAll('#level-row .game-btn')[index].textContent =
      IAKidsLang.ui(key);
  });
}

IAKidsCoins.mount();

IAKidsHelp.mount({
  slug:'continents',
  how:'על המפה מופיעות יבשות ואוקיינוסים. בכל שאלה לוחצים על האזור הנכון.',
  example:'שואלים: "איפה אפריקה?" ← לוחצים על היבשה הגדולה שבמרכז-דרום המפה 🌍'
});

function buildMap(){
  const svg = $('worldmap');
  svg.innerHTML = '';

  const order = [
    ...REGIONS_REGULAR.filter(r=>r.ocean),
    ...REGIONS_REGULAR.filter(r=>!r.ocean)
  ];

  order.forEach(region=>{
    const poly = document.createElementNS(
      'http://www.w3.org/2000/svg',
      'polygon'
    );

    poly.setAttribute('points',region.points);
    poly.setAttribute(
      'class',
      'region' + (region.ocean ? ' ocean' : '')
    );

    poly.dataset.id = region.id;
    poly.dataset.group = region.group || region.id;

    poly.onclick = ()=>tapRegion(region,poly);

    svg.appendChild(poly);
  });

  order.forEach(region=>{
    const text = document.createElementNS(
      'http://www.w3.org/2000/svg',
      'text'
    );

    text.setAttribute('x',region.label[0]);
    text.setAttribute('y',region.label[1]);
    text.setAttribute('class','region-label');
    text.dataset.group = region.group || region.id;
    text.textContent = regionName(region);

    svg.appendChild(text);
  });
}

function setRounds(n,btn){
  TOTAL = n;

  document.querySelectorAll('#rounds-row .game-btn')
    .forEach(button=>button.classList.remove('success'));

  btn.classList.add('success');
}

const ready = (async()=>{
  await loadKidContext();
  applyLanguage();

  game = await IAKidsGame.init('continents');

  const progress = await game.loadProgress();

  if(progress?.rounds){
    const btn =
      document.querySelector(`#rounds-row [onclick*="(${progress.rounds},"]`) ||
      $('rounds-row').children[1];

    setRounds(progress.rounds,btn);
  }

  if(progress?.lastLevel !== undefined){
    document
      .querySelector(`#level-row [data-lvl="${progress.lastLevel}"]`)
      ?.classList.add('success');
  }
})();

const show = id=>{
  ['start-screen','play-screen','end-screen']
    .forEach(screen=>$(screen).hidden = screen !== id);
};

async function start(selectedLevel){
  await ready;

  level = selectedLevel;
  diff = game.difficulty(selectedLevel || 1,3);

  timer = game.timer({
    style:'bomb',
    onTimeout:()=>{
      if(!locked) handleTimeout();
    }
  });

  score = 0;
  qnum = 0;
  mistakes = 0;
  timeouts = 0;
  ending = false;
  locked = false;

  $('score').textContent = '0';
  $('qnum').textContent = '1';
  $('qtotal').textContent = TOTAL;

  IAKidsActivity.configure({
    difficulty:selectedLevel || 1,
    questionsCount:TOTAL,
    metadata:{
      game_mode:'continents',
      selected_level:selectedLevel,
      random_difficulty:selectedLevel === 0,
      child_age:CHILD_AGE,
      uses_niqqud:USE_NIQQUD
    }
  });

  await game.saveProgress({
    lastLevel:selectedLevel,
    rounds:TOTAL
  });

  buildMap();
  show('play-screen');

  await next();
}

async function next(){
  if(ending) return;

  if(qnum >= TOTAL){
    await end();
    return;
  }

  qnum++;
  $('qnum').textContent = qnum;

  const lvl =
    level === 0
      ? 1 + rnd(3)
      : diff.level;

  const pool =
    REGIONS_REGULAR.filter(
      region=>region.minLevel <= lvl
    );

  const q = await game.newQuestion(
    ()=>pool[rnd(pool.length)],
    region=>region.group || region.id
  );

  current = q;
  locked = false;

  IAKidsActivity.questionStarted();

  $('question').textContent =
    `${IAKidsLang.t(T.where)}${regionName(q)}?`;

  document.querySelectorAll('.region-label')
    .forEach(label=>label.classList.remove('show'));

  document.querySelectorAll('.region')
    .forEach(region=>region.classList.remove('correct-flash','wrong-flash'));

  timer.start(
    IAKidsTimer.secondsFor(
      lvl,
      12
    )
  );
}

function tapRegion(region,element){
  resolveTap(region,element);
}

async function resolveTap(region,element){
  if(locked || ending) return;

  locked = true;
  timer.stop();

  const expectedGroup =
    current.group || current.id;

  const selectedGroup =
    region
      ? region.group || region.id
      : null;

  const isCorrect =
    selectedGroup === expectedGroup;

  if(isCorrect){
    score += 10;
    diff.right();

    IAKidsActivity.correct();

    document.querySelectorAll(
      `.region[data-group="${expectedGroup}"]`
    ).forEach(p=>p.classList.add('correct-flash'));

    document.querySelectorAll(
      `.region-label[data-group="${expectedGroup}"]`
    ).forEach(label=>label.classList.add('show'));

    IAKidsFX.correct(element);
    await IAKidsCoins.right(element);

  }else{
    mistakes++;
    diff.wrong();

    IAKidsActivity.wrong();

    if(element){
      element.classList.add('wrong-flash');
      IAKidsFX.wrong(element);
    }

    await IAKidsCoins.wrong();

    setTimeout(()=>{
      document.querySelectorAll(
        `.region[data-group="${expectedGroup}"]`
      ).forEach(p=>p.classList.add('correct-flash'));

      document.querySelectorAll(
        `.region-label[data-group="${expectedGroup}"]`
      ).forEach(label=>label.classList.add('show'));
    },420);
  }

  $('score').textContent = score;

  setTimeout(async()=>{
    locked = false;
    await next();
  },950);
}

async function handleTimeout(){
  if(locked || ending) return;

  locked = true;
  timer.stop();
  timeouts++;

  diff.wrong();

  IAKidsActivity.skipped();

  await IAKidsCoins.wrong();

  const expectedGroup =
    current.group || current.id;

  document.querySelectorAll(
    `.region[data-group="${expectedGroup}"]`
  ).forEach(p=>p.classList.add('correct-flash'));

  document.querySelectorAll(
    `.region-label[data-group="${expectedGroup}"]`
  ).forEach(label=>label.classList.add('show'));

  setTimeout(async()=>{
    locked = false;
    await next();
  },900);
}

async function end(){
  if(ending) return;

  ending = true;
  locked = true;
  timer?.stop();

  const maxScore = TOTAL * 10;
  const correctAnswers = Math.round(score / 10);

  const accuracy =
    correctAnswers /
    Math.max(
      1,
      correctAnswers + mistakes + timeouts
    );

  await game.saveScore(
    score,
    {
      level,
      mistakes,
      timeouts
    }
  );

  const top =
    (await game.getHighScores(1))[0];

  $('final-score').textContent = score;
  $('best').textContent = top?.score ?? score;

  $('player-line').textContent =
    `${top?.player || IAKidsLang.ui('guest')} · ${
      new Date().toLocaleString(
        'he-IL',
        {
          dateStyle:'short',
          timeStyle:'short'
        }
      )
    }`;

  $('stars').textContent =
    '⭐'.repeat(
      accuracy >= .9
        ? 3
        : accuracy >= .7
          ? 2
          : 1
    );

  await game.complete(
    score,
    {
      maxScore,

      performanceScore:
        Math.round(
          accuracy * 100
        ),

      metadata:{
        game_mode:'continents',
        selected_level:level,
        random_difficulty:level === 0,
        total_rounds:TOTAL,
        mistakes,
        timeouts,
        correct_answers:correctAnswers,
        child_age:CHILD_AGE,
        uses_niqqud:USE_NIQQUD
      }
    }
  );

  game.shareButton(
    score,
    $('share-slot')
  );

  show('end-screen');
}
</script>
</body>
</html>
