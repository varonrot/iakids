<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>זהה את היבשת | iakids</title>

<link rel="stylesheet" href="../game-style.css?v=55616175">

<style>.game-card{width:min(620px,calc(100vw - 28px))!important}.game-title{font-size:clamp(2.15rem,7vw,3.1rem)!important}#howto{max-width:420px}/* PLAY */.game-question{align-items:center;background:rgba(4,22,55,.5);border:1px solid rgba(116,177,255,.18);border-radius:16px;display:flex;flex-wrap:wrap;gap:0 .35em;font-size:1.4rem!important;font-weight:900;justify-content:center;margin-bottom:12px;min-height:58px;padding:10px 16px;text-align:center}#mapWrap{background:radial-gradient(circle at 50% 18%,rgba(90,180,255,.14),transparent 55%),rgba(4,22,55,.44);border:1px solid rgba(116,177,255,.18);border-radius:24px;box-shadow:0 16px 34px rgba(0,0,0,.17);margin:8px auto;max-width:500px;padding:12px}#worldmap{display:block;height:auto;touch-action:manipulation;width:100%}.region{cursor:pointer;fill:#b7dfa8;stroke:#ffffff;stroke-width:4;transform-box:fill-box;transform-origin:center;transition:fill .2s,filter .2s,transform .16s}.region:hover{fill:#a3d18f;filter:brightness(1.05)}.region.ocean{fill:#67bfe4;stroke-width:3}.region.correct-flash{fill:#2bc875!important;filter:drop-shadow(0 0 12px rgba(43,200,117,.5))}.region.wrong-flash{fill:#f05f68!important}.region-label{fill:#10223d;font-size:26px;font-weight:900;opacity:0;paint-order:stroke;pointer-events:none;stroke:rgba(255,255,255,.75);stroke-width:4px;text-anchor:middle;transition:opacity .2s}

.region-label.show{opacity:1}/* END */

@media(max-width:600px){#start-screen,#play-screen,#end-screen{padding:26px 14px 24px}

  #mapWrap{padding:7px}
  .region-label{font-size:22px}
}
</style>
</head>

<body class="theme-space">

<div class="game-hud">
  <span class="score">
    <span id="score-label">ניקוד</span>:
    <span id="score">0</span>
  </span>

  <span>
    <span id="q-label">שאלה</span>
    <span id="qnum">1</span>/<span id="qtotal">10</span>
  </span>
</div>

<div class="game-card" id="card">

  <div id="start-screen">
    <div class="hero-icon">🗺️🌍</div>

    <h1 class="game-title" id="title"></h1>

    <p id="howto"></p>

    <p class="section-label" id="rounds-label"></p>

    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline success" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>

    <p class="section-label" id="level-label"></p>

    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)"></button>
      <button class="game-btn" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div class="game-question" id="question"></div>

    <div id="mapWrap">
      <svg id="worldmap" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../nikud.js?v=961e2bed"></script>
<script src="../game-sdk.js?v=6a562bec"></script>

<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);

const T_REGULAR = {
  title:{he:'זהה את היבשת',en:'Identify the Continent'},
  howto:{he:'לחצו על היבשת הנכונה במפת העולם!',en:'Tap the correct continent on the world map!'},
  rounds:{he:'כמה שאלות?',en:'How many questions?'},
  level:{he:'בחרו רמת קושי',en:'Choose difficulty'},
  where:{he:'איפה נמצא/ת ',en:'Where is '}
};

const T_NIQQUD = {
  title:{he:'זַהוּ אֶת הַיַּבֶּשֶׁת',en:'Identify the Continent'},
  howto:{he:'לַחֲצוּ עַל הַיַּבֶּשֶׁת הַנְּכוֹנָה בְּמַפַּת הָעוֹלָם!',en:'Tap the correct continent on the world map!'},
  rounds:{he:'כַּמָּה שְׁאֵלוֹת?',en:'How many questions?'},
  level:{he:'בַּחֲרוּ רָמַת קֹשִׁי',en:'Choose difficulty'},
  where:{he:'אֵיפֹה נִמְצֵאת ',en:'Where is '}
};

const REGIONS_REGULAR = [
  {id:'namerica',name:'צפון אמריקה',minLevel:1,ocean:false,points:'120,80 260,90 290,180 230,260 150,320 90,300 50,220 60,140',label:[165,190]},
  {id:'asia',name:'אסיה',minLevel:1,ocean:false,points:'580,70 860,60 900,180 840,300 740,340 650,300 590,220 560,140',label:[720,190]},
  {id:'africa',name:'אפריקה',minLevel:1,ocean:false,points:'470,215 580,210 610,300 590,420 540,480 480,460 450,340',label:[520,340]},
  {id:'samerica',name:'דרום אמריקה',minLevel:2,ocean:false,points:'230,330 300,320 330,380 310,450 270,480 230,470 210,400',label:[265,400]},
  {id:'europe',name:'אירופה',minLevel:2,ocean:false,points:'460,90 560,80 580,150 540,210 470,200 440,140',label:[505,145]},
  {id:'australia',name:'אוסטרליה',minLevel:2,ocean:false,points:'760,410 880,400 900,450 860,485 780,480 750,450',label:[815,445]},
  {id:'antarctica',name:'אנטארקטיקה',minLevel:2,ocean:false,points:'20,520 980,520 980,590 20,590',label:[500,560]},
  {id:'pacific1',name:'האוקיינוס השקט',minLevel:3,ocean:true,group:'pacific',points:'0,70 150,70 150,450 0,450',label:[75,260]},
  {id:'pacific2',name:'האוקיינוס השקט',minLevel:3,ocean:true,group:'pacific',points:'850,70 1000,70 1000,450 850,450',label:[925,260]},
  {id:'atlantic',name:'האוקיינוס האטלנטי',minLevel:3,ocean:true,group:'atlantic',points:'260,70 450,70 450,450 260,450',label:[355,260]},
  {id:'indian',name:'האוקיינוס ההודי',minLevel:3,ocean:true,group:'indian',points:'560,300 850,300 850,450 560,450',label:[700,380]},
  {id:'arctic',name:'האוקיינוס הארקטי',minLevel:3,ocean:true,group:'arctic',points:'0,0 1000,0 1000,60 0,60',label:[500,32]}
];

const NIQQUD_NAMES = {
  namerica:'צְפוֹן אָמֶרִיקָה',
  asia:'אַסְיָה',
  africa:'אַפְרִיקָה',
  samerica:'דְּרוֹם אָמֶרִיקָה',
  europe:'אֵירוֹפָּה',
  australia:'אוֹסְטְרַלְיָה',
  antarctica:'אַנְטַרְקְטִיקָה',
  pacific1:'הָאוֹקְיָנוֹס הַשָּׁקֵט',
  pacific2:'הָאוֹקְיָנוֹס הַשָּׁקֵט',
  atlantic:'הָאוֹקְיָנוֹס הָאַטְלַנְטִי',
  indian:'הָאוֹקְיָנוֹס הַהוֹדִי',
  arctic:'הָאוֹקְיָנוֹס הָאַרְקְטִי'
};

let CHILD_AGE = null;
let USE_NIQQUD = false;
let T = T_REGULAR;

let game, diff, timer;
let score = 0, qnum = 0, level = 1, TOTAL = 10;
let locked = false, current, mistakes = 0, timeouts = 0, ending = false;

function regionName(region){
  if(IAKidsLang.code === 'he' && USE_NIQQUD){
    return NIQQUD_NAMES[region.id] || region.name;
  }
  return region.name;
}

async function loadKidContext(){
  try{
    const kidId = localStorage.getItem('active_kid_id');
    if(!kidId) return;

    const client = await IAKidsActivity._getClient();

    const {data,error} = await client
      .from('kids_profiles')
      .select('id, age')
      .eq('id',kidId)
      .maybeSingle();

    if(error || !data){
      console.warn('[continents] Kid profile was not loaded',error);
      return;
    }

    CHILD_AGE = Number(data.age);
    USE_NIQQUD = IAKidsNikud.enabled;   // the pill in the start screen, not a dead age test

  }catch(error){
    console.warn('[continents] loadKidContext error',error);
  }
}

function applyLanguage(){
  T = USE_NIQQUD ? T_NIQQUD : T_REGULAR;

  $('title').textContent = IAKidsLang.t(T.title);
  $('howto').textContent = IAKidsLang.t(T.howto);
  $('rounds-label').textContent = IAKidsLang.t(T.rounds);
  $('level-label').textContent = IAKidsLang.t(T.level);
  $('score-label').textContent = IAKidsLang.ui('score');
  $('q-label').textContent = IAKidsLang.ui('question');
  $('best-label').textContent = IAKidsLang.ui('your_best');
  $('again-btn').textContent = IAKidsLang.ui('play_again');

  ['level_easy','level_medium','level_hard','level_random'].forEach((key,index)=>{
    document.querySelectorAll('#level-row .game-btn')[index].textContent =
      IAKidsLang.ui(key);
  });
}

IAKidsCoins.mount();

IAKidsHelp.mount({
  slug:'continents',
  how:'על המפה מופיעות יבשות ואוקיינוסים. בכל שאלה לוחצים על האזור הנכון.',
  example:'שואלים: "איפה אפריקה?" ← לוחצים על היבשה הגדולה שבמרכז-דרום המפה 🌍'
});

function buildMap(){
  const svg = $('worldmap');
  svg.innerHTML = '';

  const order = [
    ...REGIONS_REGULAR.filter(r=>r.ocean),
    ...REGIONS_REGULAR.filter(r=>!r.ocean)
  ];

  order.forEach(region=>{
    const poly = document.createElementNS(
      'http://www.w3.org/2000/svg',
      'polygon'
    );

    poly.setAttribute('points',region.points);
    poly.setAttribute(
      'class',
      'region' + (region.ocean ? ' ocean' : '')
    );

    poly.dataset.id = region.id;
    poly.dataset.group = region.group || region.id;

    poly.onclick = ()=>tapRegion(region,poly);

    svg.appendChild(poly);
  });

  order.forEach(region=>{
    const text = document.createElementNS(
      'http://www.w3.org/2000/svg',
      'text'
    );

    text.setAttribute('x',region.label[0]);
    text.setAttribute('y',region.label[1]);
    text.setAttribute('class','region-label');
    text.dataset.group = region.group || region.id;
    text.textContent = regionName(region);

    svg.appendChild(text);
  });
}

function setRounds(n,btn){
  TOTAL = n;

  document.querySelectorAll('#rounds-row .game-btn')
    .forEach(button=>button.classList.remove('success'));

  btn.classList.add('success');
}

const ready = (async()=>{
  await loadKidContext();
  applyLanguage();

  game = await IAKidsGame.init('continents');

  const progress = await game.loadProgress();

  if(progress?.rounds){
    const btn =
      document.querySelector(`#rounds-row [onclick*="(${progress.rounds},"]`) ||
      $('rounds-row').children[1];

    setRounds(progress.rounds,btn);
  }

  if(progress?.lastLevel !== undefined){
    document
      .querySelector(`#level-row [data-lvl="${progress.lastLevel}"]`)
      ?.classList.add('success');
  }
})();

const show = id=>{
  ['start-screen','play-screen','end-screen']
    .forEach(screen=>$(screen).hidden = screen !== id);
};

async function start(selectedLevel){
  await ready;

  level = selectedLevel;
  diff = game.difficulty(selectedLevel || 1,3);

  timer = game.timer({
    style:'bomb',
    onTimeout:()=>{
      if(!locked) handleTimeout();
    }
  });

  score = 0;
  qnum = 0;
  mistakes = 0;
  timeouts = 0;
  ending = false;
  locked = false;

  $('score').textContent = '0';
  $('qnum').textContent = '1';
  $('qtotal').textContent = TOTAL;

  IAKidsActivity.configure({
    difficulty:selectedLevel || 1,
    questionsCount:TOTAL,
    metadata:{
      game_mode:'continents',
      selected_level:selectedLevel,
      random_difficulty:selectedLevel === 0,
      child_age:CHILD_AGE,
      uses_niqqud:USE_NIQQUD
    }
  });

  await game.saveProgress({
    lastLevel:selectedLevel,
    rounds:TOTAL
  });

  buildMap();
  show('play-screen');

  await next();
}

async function next(){
  if(ending) return;

  if(qnum >= TOTAL){
    await end();
    return;
  }

  qnum++;
  $('qnum').textContent = qnum;

  const lvl =
    level === 0
      ? 1 + rnd(3)
      : diff.level;

  const pool =
    REGIONS_REGULAR.filter(
      region=>region.minLevel <= lvl
    );

  const q = await game.newQuestion(
    ()=>pool[rnd(pool.length)],
    region=>region.group || region.id
  );

  current = q;
  locked = false;

  IAKidsActivity.questionStarted();

  $('question').textContent =
    `${IAKidsLang.t(T.where)}${regionName(q)}?`;

  document.querySelectorAll('.region-label')
    .forEach(label=>label.classList.remove('show'));

  document.querySelectorAll('.region')
    .forEach(region=>region.classList.remove('correct-flash','wrong-flash'));

  timer.start(
    IAKidsTimer.secondsFor(
      lvl,
      12
    )
  );
}

function tapRegion(region,element){
  resolveTap(region,element);
}

async function resolveTap(region,element){
  if(locked || ending) return;

  locked = true;
  timer.stop();

  const expectedGroup =
    current.group || current.id;

  const selectedGroup =
    region
      ? region.group || region.id
      : null;

  const isCorrect =
    selectedGroup === expectedGroup;

  if(isCorrect){
    score += 10;
    diff.right();

    IAKidsActivity.correct();

    document.querySelectorAll(
      `.region[data-group="${expectedGroup}"]`
    ).forEach(p=>p.classList.add('correct-flash'));

    document.querySelectorAll(
      `.region-label[data-group="${expectedGroup}"]`
    ).forEach(label=>label.classList.add('show'));

    IAKidsFX.correct(element);
    await IAKidsCoins.right(element);

  }else{
    mistakes++;
    diff.wrong();

    IAKidsActivity.wrong();

    if(element){
      element.classList.add('wrong-flash');
      IAKidsFX.wrong(element);
    }

    await IAKidsCoins.wrong();

    setTimeout(()=>{
      document.querySelectorAll(
        `.region[data-group="${expectedGroup}"]`
      ).forEach(p=>p.classList.add('correct-flash'));

      document.querySelectorAll(
        `.region-label[data-group="${expectedGroup}"]`
      ).forEach(label=>label.classList.add('show'));
    },420);
  }

  $('score').textContent = score;

  setTimeout(async()=>{
    locked = false;
    await next();
  },950);
}

async function handleTimeout(){
  if(locked || ending) return;

  locked = true;
  timer.stop();
  timeouts++;

  diff.wrong();

  IAKidsActivity.skipped();

  await IAKidsCoins.wrong();

  const expectedGroup =
    current.group || current.id;

  document.querySelectorAll(
    `.region[data-group="${expectedGroup}"]`
  ).forEach(p=>p.classList.add('correct-flash'));

  document.querySelectorAll(
    `.region-label[data-group="${expectedGroup}"]`
  ).forEach(label=>label.classList.add('show'));

  setTimeout(async()=>{
    locked = false;
    await next();
  },900);
}

async function end(){
  if(ending) return;

  ending = true;
  locked = true;
  timer?.stop();

  const maxScore = TOTAL * 10;
  const correctAnswers = Math.round(score / 10);

  const accuracy =
    correctAnswers /
    Math.max(
      1,
      correctAnswers + mistakes + timeouts
    );

  await game.saveScore(
    score,
    {
      level,
      mistakes,
      timeouts
    }
  );

  const top =
    (await game.getHighScores(1))[0];

  $('final-score').textContent = score;
  $('best').textContent = top?.score ?? score;

  $('player-line').textContent =
    `${top?.player || IAKidsLang.ui('guest')} · ${
      new Date().toLocaleString(
        'he-IL',
        {
          dateStyle:'short',
          timeStyle:'short'
        }
      )
    }`;

  $('stars').textContent =
    '⭐'.repeat(
      accuracy >= .9
        ? 3
        : accuracy >= .7
          ? 2
          : 1
    );

  await game.complete(
    score,
    {
      maxScore,

      performanceScore:
        Math.round(
          accuracy * 100
        ),

      metadata:{
        game_mode:'continents',
        selected_level:level,
        random_difficulty:level === 0,
        total_rounds:TOTAL,
        mistakes,
        timeouts,
        correct_answers:correctAnswers,
        child_age:CHILD_AGE,
        uses_niqqud:USE_NIQQUD
      }
    }
  );

  game.shareButton(
    score,
    $('share-slot')
  );

  show('end-screen');
}
</script>
</body>
</html>
