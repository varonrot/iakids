<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling Bee | iakids</title>

<link rel="stylesheet" href="../game-style.css?v=0eea1d9b">

<style>.game-card{width:min(560px,calc(100vw - 28px))!important}.game-title{font-size:clamp(2.2rem,7vw,3.2rem)!important}#subtitle{color:var(--space-muted)!important;font-weight:600;line-height:1.65;margin:14px auto 20px;max-width:420px}.game-btn.secondary{background:linear-gradient(180deg,rgba(52,81,139,.72),rgba(21,49,99,.75))!important}
#level-row [data-lvl="0"]{background:linear-gradient(180deg,#8054ff,#6035dc)!important}

/* PLAY */
#play-screen{text-align:center}.prompt-line{color:#fff;font-size:1.1rem;font-weight:900;margin:0 0 10px}.word-display{align-items:center;background:rgba(4,22,55,.5);border:1px solid rgba(116,177,255,.18);border-radius:22px;color:#dce9ff;direction:ltr;display:flex;font-size:2.25rem;font-weight:1000;justify-content:center;letter-spacing:10px;margin:12px 0 8px;min-height:82px;padding:12px 14px}.word-display .filled{color:#70caff;text-shadow:0 0 14px rgba(112,202,255,.25)}.hint-line{color:#b8c7e3;font-size:1rem;font-weight:700;min-height:30px}.tool-row{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:12px}.keyboard{align-items:center;direction:ltr;display:flex;flex-direction:column;gap:7px;margin-top:16px}.kbd-row{display:flex;gap:5px;justify-content:center;width:100%}.kbd-btn{flex:1 1 0;font-size:1rem!important;margin:0!important;max-width:48px;min-height:44px!important;min-width:30px;padding:7px 3px!important}.kbd-btn:disabled{cursor:default;opacity:.6}/* END */

@media(max-width:600px){.word-display{font-size:1.85rem;letter-spacing:7px;min-height:72px}

  .kbd-row{gap:3px}.kbd-btn{font-size:.92rem!important;min-width:26px;padding:6px 2px!important}
}
</style>
</head>

<body class="theme-space">

<div class="game-hud">
  <span class="score">
    <span id="score-label">ניקוד</span>:
    <span id="score">0</span>
  </span>

  <span>
    <span id="q-label">שאלה</span>
    <span id="qnum">1</span>/<span id="qtotal">10</span>
  </span>
</div>

<div class="game-card" id="card">

  <div id="start-screen">
    <div class="hero-icon">🐝</div>

    <h1 class="game-title" id="title"></h1>

    <p id="subtitle"></p>

    <p class="section-label" id="rounds-label"></p>

    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline success" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>

    <p class="section-label" id="level-label"></p>

    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)"></button>
      <button class="game-btn" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <p class="prompt-line" id="prompt-line"></p>

    <div class="word-display" id="word-display"></div>

    <div class="hint-line" id="hint-line"></div>

    <div class="tool-row">
      <button class="game-btn secondary" id="replay-btn" onclick="replay()"></button>
      <button class="game-btn outline" id="backspace-btn" onclick="backspace()"></button>
    </div>

    <div class="keyboard" id="keyboard"></div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="nikud.js?v=7e27494b"></script>
<script src="../game-sdk.js?v=4b8fc616"></script>

<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);

const WORD_BANK = {
  1:['cat','dog','sun','hat','bed','cup','pen','box','run','red','big','six','ten','top','bus','egg','ant','arm','ear','eye',
     'bag','bat','bug','cap','car','cow','cry','cut','dad','day','dig','dot','fan','fly','fox','fun','gap','hen','hit','hop','hot','ice','jam','jog','key','kid','leg','lip','log','map','mom','mud','net','nut','pan','pet','pig','pot','rat','rug','sad','sit','sky','toy','van','web','wet','yes','zip','zoo'
  ],
  2:['frog','lion','milk','book','fish','star','moon','cake','rain','wind','apple','chair','table','mouse','water','happy','green','black','white','house','bread','plant','tiger','zebra','snake',
     'bird','boat','ball','baby','blue','bear','bell','cold','corn','duck','door','drum','farm','fire','flag','gold','goat','hand','home','jump','king','kite','lamp','leaf','nose','park','pink','ring','road','rock','ship','shoe','snow','song','tree','wolf','yard','beach','bench','candy','clock','cloud','dance','dress','earth','field','fruit','grape','heart','horse','juice','light','lunch','money','music','night','ocean','paper','party','pizza','queen','river','sheep','shirt','smile','stone','sugar','sweet','teeth','train','truck','watch','plate'
  ],
  3:['rabbit','coffee','kitten','dinner','summer','bottle','hammer','yellow','letter','butter','cotton','puppy','balloon','mirror','arrow','giraffe','umbrella','spaghetti','broccoli',
     'animal','banana','basket','bridge','button','camera','candle','carrot','castle','cheese','circle','cookie','doctor','dragon','flower','forest','friend','garden','guitar','island','jacket','jungle','ladder','magnet','market','monkey','mother','number','orange','parrot','pencil','picnic','pillow','planet','pocket','purple','rocket','school','silver','spider','square','sister','teacher','tomato','turtle','window','winter','zipper','elephant','butterfly','chocolate','dinosaur','kangaroo','sandwich','birthday','computer','hospital','mountain','notebook','airplane'
  ]
};

const T_REGULAR = {
  title:{he:'Spelling Bee',en:'Spelling Bee'},
  subtitle:{he:'תשמעו מילה באנגלית — ותקלידו אותה נכון!',en:'Hear an English word and spell it correctly!'},
  rounds:{he:'כמה שאלות?',en:'How many questions?'},
  level:{he:'בחרו רמת קושי',en:'Choose difficulty'},
  prompt:{he:'הקלידו את המילה ששמעתם:',en:'Type the word you heard:'},
  replay:{he:'🔊 שוב',en:'🔊 Replay'},
  backspace:{he:'⌫ מחק',en:'⌫ Delete'},
  noVoice:{he:'אין קול זמין — רמז: האות הראשונה היא',en:'No voice available — hint: first letter is'},
  correctWord:{he:'המילה הנכונה:',en:'Correct word:'}
};

const T_NIQQUD = {
  title:{he:'Spelling Bee',en:'Spelling Bee'},
  subtitle:{he:'תִּשְׁמְעוּ מִלָּה בְּאַנְגְּלִית — וְתַקְלִידוּ אוֹתָהּ נָכוֹן!',en:'Hear an English word and spell it correctly!'},
  rounds:{he:'כַּמָּה שְׁאֵלוֹת?',en:'How many questions?'},
  level:{he:'בַּחֲרוּ רָמַת קֹשִׁי',en:'Choose difficulty'},
  prompt:{he:'הַקְלִידוּ אֶת הַמִּלָּה שֶׁשְּׁמַעְתֶּם:',en:'Type the word you heard:'},
  replay:{he:'🔊 שׁוּב',en:'🔊 Replay'},
  backspace:{he:'⌫ מָחַק',en:'⌫ Delete'},
  noVoice:{he:'אֵין קוֹל זָמִין — רֶמֶז: הָאוֹת הָרִאשׁוֹנָה הִיא',en:'No voice available — hint: first letter is'},
  correctWord:{he:'הַמִּלָּה הַנְּכוֹנָה:',en:'Correct word:'}
};

let CHILD_AGE = null;
let USE_NIQQUD = false;
let T = T_REGULAR;

let game, score = 0, qnum = 0, level = 1, diff;
let TOTAL = 10;
let currentWord = '', guess = '';
let locked = false, ending = false;
let correctCount = 0, mistakes = 0, replayCount = 0;

async function loadKidContext(){
  try{
    const kidId = localStorage.getItem('active_kid_id');
    if(!kidId) return;

    const client = await IAKidsActivity._getClient();

    const {data,error} = await client
      .from('kids_profiles')
      .select('id, age')
      .eq('id',kidId)
      .maybeSingle();

    if(!error && data){
      CHILD_AGE = Number(data.age);
      USE_NIQQUD = IAKidsNikud.enabled;   // the pill in the start screen, not a dead age test
    }
  }catch(e){
    console.warn('[spelling-bee] loadKidContext',e);
  }
}

function applyLanguage(){
  T = USE_NIQQUD ? T_NIQQUD : T_REGULAR;

  $('title').textContent = IAKidsLang.t(T.title);
  $('subtitle').textContent = IAKidsLang.t(T.subtitle);
  $('rounds-label').textContent = IAKidsLang.t(T.rounds);
  $('level-label').textContent = IAKidsLang.t(T.level);
  $('prompt-line').textContent = IAKidsLang.t(T.prompt);
  $('replay-btn').textContent = IAKidsLang.t(T.replay);
  $('backspace-btn').textContent = IAKidsLang.t(T.backspace);

  $('score-label').textContent = IAKidsLang.ui('score');
  $('q-label').textContent = IAKidsLang.ui('question');
  $('best-label').textContent = IAKidsLang.ui('your_best');
  $('again-btn').textContent = IAKidsLang.ui('play_again');

  ['level_easy','level_medium','level_hard','level_random'].forEach((key,index)=>{
    document.querySelectorAll('#level-row .game-btn')[index].textContent =
      IAKidsLang.ui(key);
  });
}

IAKidsCoins.mount();

IAKidsHelp.mount({
  slug:'spelling-bee',
  how:'תשמעו מילה באנגלית — לחצו על 🔊 כדי לשמוע שוב, ואז הקלידו את האותיות הנכונות במקלדת שעל המסך או במקלדת שלכם.',
  example:'<span dir="ltr"><b>🔊 "cat"</b></span> → מקלידים <span dir="ltr"><b>c-a-t</b></span> ✓'
});

const show = id=>{
  ['start-screen','play-screen','end-screen']
    .forEach(s=>$(s).hidden=s!==id);
};

function setRounds(n,btn){
  TOTAL=n;

  document.querySelectorAll('#rounds-row .game-btn')
    .forEach(b=>b.classList.remove('success'));

  btn?.classList.add('success');
}

function markRounds(n){
  document.querySelectorAll('#rounds-row .game-btn')
    .forEach(b=>b.classList.toggle('success',+b.textContent===n));

  TOTAL=n;
}

function markLevel(lvl){
  document.querySelectorAll('#level-row .game-btn')
    .forEach(b=>b.classList.remove('success'));

  const idx=lvl===0 ? 3 : lvl-1;
  const btn=document.querySelectorAll('#level-row .game-btn')[idx];

  if(btn) btn.classList.add('success');
}

(function buildKeyboard(){
  const rows=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
  const kb=$('keyboard');

  rows.forEach(row=>{
    const div=document.createElement('div');
    div.className='kbd-row';

    for(const ch of row){
      const b=document.createElement('button');
      b.className='game-btn outline kbd-btn';
      b.textContent=ch;
      b.onclick=()=>tapLetter(ch);
      div.appendChild(b);
    }

    kb.appendChild(div);
  });
})();

const ready=(async()=>{
  await loadKidContext();
  applyLanguage();

  game=await IAKidsGame.init('spelling-bee');

  const p=await game.loadProgress();

  if(p){
    if(p.rounds) markRounds(p.rounds);
    if(p.lastLevel!=null) markLevel(p.lastLevel);
  }
})();

function speak(word){
  if(!('speechSynthesis' in window)) return false;

  try{
    speechSynthesis.cancel();

    const u=new SpeechSynthesisUtterance(word);
    u.lang='en-US';
    speechSynthesis.speak(u);

    return true;
  }catch(e){
    return false;
  }
}

function replay(){
  if(!currentWord || ending) return;
  replayCount++;
  speak(currentWord);
}

async function start(lvl){
  await ready;

  level=lvl;
  diff=game.difficulty(lvl||1,3);

  score=0;
  qnum=0;
  correctCount=0;
  mistakes=0;
  replayCount=0;
  locked=false;
  ending=false;

  $('score').textContent='0';
  $('qtotal').textContent=TOTAL;

  IAKidsActivity.configure({
    difficulty:lvl||1,
    questionsCount:TOTAL,
    metadata:{
      game_mode:'spelling_bee',
      game_slug:'spelling-bee',
      selected_level:lvl,
      random_difficulty:lvl===0,
      child_age:CHILD_AGE,
      uses_niqqud:USE_NIQQUD,
      language_subject:'english',
      input_mode:'keyboard',
      audio_mode:'speechSynthesis'
    }
  });

  await game.saveProgress({
    lastLevel:lvl,
    rounds:TOTAL
  });

  show('play-screen');

  document.addEventListener('keydown',onKeydown);

  await next();
}

function onKeydown(e){
  if($('play-screen').hidden || locked || ending) return;

  if(/^[a-zA-Z]$/.test(e.key)){
    tapLetter(e.key.toUpperCase());
  }else if(e.key==='Backspace'){
    backspace();
    e.preventDefault();
  }
}

function renderGuess(){
  const chars=[];

  for(let i=0;i<currentWord.length;i++){
    chars.push(
      i<guess.length
        ? `<span class="filled">${guess[i]}</span>`
        : '_'
    );
  }

  $('word-display').innerHTML=chars.join(' ');
}

function setKeyboardEnabled(enabled){
  document.querySelectorAll('.kbd-btn')
    .forEach(b=>b.disabled=!enabled);

  $('backspace-btn').disabled=!enabled;
}

function tapLetter(ch){
  if(locked || ending) return;
  if(guess.length>=currentWord.length) return;

  guess+=ch.toLowerCase();

  renderGuess();

  if(guess.length===currentWord.length){
    locked=true;
    setKeyboardEnabled(false);
    setTimeout(checkAnswer,250);
  }
}

function backspace(){
  if(locked || ending) return;

  guess=guess.slice(0,-1);
  renderGuess();
}

async function next(){
  if(ending) return;

  if(qnum>=TOTAL){
    await end();
    return;
  }

  qnum++;
  locked=false;
  setKeyboardEnabled(true);

  $('qnum').textContent=qnum;

  const lvl=level===0 ? 1+rnd(3) : diff.level;

  const q=await game.newQuestion(
    ()=>({word:WORD_BANK[lvl][rnd(WORD_BANK[lvl].length)]}),
    x=>x.word
  );

  currentWord=q.word;
  guess='';

  IAKidsActivity.questionStarted();

  renderGuess();

  const spoke=speak(currentWord);

  $('hint-line').textContent=
    spoke
      ? ''
      : `${IAKidsLang.t(T.noVoice)} "${currentWord[0].toUpperCase()}"`;
}

async function checkAnswer(){
  const el=$('word-display');
  const ok=guess===currentWord;

  if(ok){
    score+=10;
    correctCount++;

    diff.right();
    IAKidsActivity.correct();

    IAKidsFX.correct(el);
    await IAKidsCoins.right(el);

  }else{
    mistakes++;

    diff.wrong();
    IAKidsActivity.wrong();

    IAKidsFX.wrong(el);
    await IAKidsCoins.wrong();

    $('hint-line').textContent=
      `${IAKidsLang.t(T.correctWord)} ${currentWord}`;
  }

  $('score').textContent=score;

  setTimeout(async()=>{
    await next();
  },ok ? 700 : 1100);
}

async function end(){
  if(ending) return;

  ending=true;
  locked=true;

  document.removeEventListener('keydown',onKeydown);
  setKeyboardEnabled(false);

  const maxScore=TOTAL*10;

  const accuracy=
    correctCount /
    Math.max(1,correctCount+mistakes);

  await game.saveScore(
    score,
    {
      level,
      correct:correctCount,
      total:TOTAL,
      mistakes,
      replays:replayCount
    }
  );

  const top=(await game.getHighScores(1))[0];

  $('final-score').textContent=score;
  $('best').textContent=top?.score??score;

  $('player-line').textContent=
    `${top?.player || IAKidsLang.ui('guest')} · ${
      new Date().toLocaleString(
        'he-IL',
        {dateStyle:'short',timeStyle:'short'}
      )
    }`;

  $('stars').textContent=
    '⭐'.repeat(
      accuracy>=.9 ? 3 :
      accuracy>=.7 ? 2 : 1
    );

  await game.complete(
    score,
    {
      maxScore,
      performanceScore:Math.round(accuracy*100),
      metadata:{
        game_mode:'spelling_bee',
        game_slug:'spelling-bee',
        selected_level:level,
        random_difficulty:level===0,
        total_rounds:TOTAL,
        correct_answers:correctCount,
        mistakes,
        replays:replayCount,
        child_age:CHILD_AGE,
        uses_niqqud:USE_NIQQUD,
        language_subject:'english',
        input_mode:'keyboard',
        audio_mode:'speechSynthesis'
      }
    }
  );

  game.shareButton(score,$('share-slot'));
  show('end-screen');
}
</script>
</body>
</html>
