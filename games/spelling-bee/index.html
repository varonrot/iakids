<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling Bee | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>
  .word-display { font-size: 2.4rem; letter-spacing: 10px; font-weight: 800; margin: 18px 0 8px; direction: ltr; min-height: 2.6rem; }
  .word-display .filled { color: var(--accent); }
  .hint-line { color: var(--muted); font-size: 1rem; min-height: 1.3rem; }
  .keyboard { direction: ltr; display: flex; flex-direction: column; gap: 6px; margin-top: 14px; align-items: center; }
  .kbd-row { display: flex; justify-content: center; gap: 4px; }
  .kbd-btn { font-size: 1.05rem; padding: 8px 4px; min-height: 42px; min-width: 30px; margin: 2px; }
  .kbd-tools { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
</style>
</head>
<body>

<div class="game-hud">
  <span class="score">ניקוד: <span id="score">0</span></span>
  <span>שאלה <span id="qnum">1</span>/<span id="qtotal">10</span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div style="font-size:4rem">🐝</div>
    <h1 class="game-title">Spelling Bee</h1>
    <p>תשמעו מילה באנגלית — ותקלידו אותה נכון!</p>
    <p>כמה שאלות?</p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline success" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" onclick="start(1)">🙂 קל</button>
      <button class="game-btn secondary" onclick="start(2)">😎 בינוני</button>
      <button class="game-btn secondary" onclick="start(3)">🤓 קשה</button>
      <button class="game-btn" onclick="start(0)">🎲 אקראי</button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <p>הקלד/י את המילה ששמעת:</p>
    <div class="word-display" id="word-display"></div>
    <div class="hint-line" id="hint-line"></div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr">
      <button class="game-btn secondary" onclick="replay()">🔊 שוב</button>
      <button class="game-btn outline" onclick="backspace()">⌫ מחק</button>
    </div>
    <div class="keyboard" id="keyboard"></div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p>השיא שלך: <b id="best"></b></p>
    <button class="game-btn" onclick="location.reload()">שחק שוב 🔁</button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>
<script>
let game, score = 0, qnum = 0, level = 1, diff, timer;
let TOTAL = 10;
let currentWord = '', guess = '';
const rnd = n => Math.floor(Math.random() * n);

const WORD_BANK = {
  1: ['cat','dog','sun','hat','bed','cup','pen','box','run','red','big','six','ten','top','bus','egg','ant','arm','ear','eye'],
  2: ['frog','lion','milk','book','fish','star','moon','cake','rain','wind','apple','chair','table','mouse','water','happy','green','black','white','house','bread','plant','tiger','zebra','snake'],
  3: ['rabbit','coffee','kitten','dinner','summer','bottle','hammer','yellow','letter','butter','cotton','puppy','balloon','mirror','arrow','giraffe','umbrella','spaghetti','broccoli'],
};

IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'spelling-bee',
  how: 'תשמעו מילה באנגלית — לחצו על 🔊 כדי לשמוע שוב, ואז הקלידו את האותיות הנכונות במקלדת שעל המסך (או במקלדת שלכם).',
  example: '<span dir="ltr"><b>🔊 "cat"</b></span> → מקלידים <span dir="ltr"><b>c-a-t</b></span> ✓',
});

const show = id => {
  for (const s of ['start-screen', 'play-screen', 'end-screen'])
    document.getElementById(s).hidden = s !== id;
};

function setRounds(n, btn) {
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.remove('success'));
  btn.classList.add('success');
}
function markRounds(n) {
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.toggle('success', +b.textContent === n));
  TOTAL = n;
}
function markLevel(lvl) {
  document.querySelectorAll('#level-row .game-btn').forEach(b => b.classList.remove('outline'));
  const idx = lvl === 0 ? 3 : lvl - 1;
  const btn = document.querySelectorAll('#level-row .game-btn')[idx];
  if (btn) btn.classList.add('outline');
}

// build on-screen QWERTY keyboard
(function buildKeyboard() {
  const rows = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
  const kb = document.getElementById('keyboard');
  rows.forEach(row => {
    const div = document.createElement('div');
    div.className = 'kbd-row';
    for (const ch of row) {
      const b = document.createElement('button');
      b.className = 'game-btn outline kbd-btn';
      b.textContent = ch;
      b.onclick = () => tapLetter(ch);
      div.appendChild(b);
    }
    kb.appendChild(div);
  });
})();

(async function boot() {
  game = await IAKidsGame.init('spelling-bee');
  const p = await game.loadProgress();
  if (p) {
    if (p.rounds) markRounds(p.rounds);
    if (p.lastLevel != null) markLevel(p.lastLevel);
  }
})();

function speak(word) {
  if (!('speechSynthesis' in window)) return false;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US';
    speechSynthesis.speak(u);
    return true;
  } catch (e) { return false; }
}
function replay() { speak(currentWord); }

async function start(lvl) {
  level = lvl;
  diff = game.difficulty(lvl || 1, 3);
  await game.saveProgress({ lastLevel: lvl, rounds: TOTAL });
  document.getElementById('qtotal').textContent = TOTAL;
  show('play-screen');
  document.addEventListener('keydown', onKeydown);
  next();
}

function onKeydown(e) {
  if (document.getElementById('play-screen').hidden) return;
  if (/^[a-zA-Z]$/.test(e.key)) tapLetter(e.key.toUpperCase());
  else if (e.key === 'Backspace') backspace();
}

function renderGuess() {
  const chars = [];
  for (let i = 0; i < currentWord.length; i++) {
    chars.push(i < guess.length ? `<span class="filled">${guess[i]}</span>` : '_');
  }
  document.getElementById('word-display').innerHTML = chars.join(' ');
}

function tapLetter(ch) {
  if (guess.length >= currentWord.length) return;
  guess += ch.toLowerCase();
  renderGuess();
  if (guess.length === currentWord.length) setTimeout(checkAnswer, 250);
}
function backspace() {
  guess = guess.slice(0, -1);
  renderGuess();
}

async function next() {
  if (qnum >= TOTAL) return end();
  qnum++;
  document.getElementById('qnum').textContent = qnum;
  const lvl = level === 0 ? 1 + rnd(3) : diff.level;
  const q = await game.newQuestion(() => ({ word: WORD_BANK[lvl][rnd(WORD_BANK[lvl].length)] }), x => x.word);
  currentWord = q.word;
  guess = '';
  renderGuess();
  const spoke = speak(currentWord);
  document.getElementById('hint-line').textContent = spoke ? '' : `אין קול זמין — רמז: האות הראשונה היא "${currentWord[0].toUpperCase()}"`;
}

function checkAnswer() {
  const el = document.getElementById('word-display');
  if (guess === currentWord) {
    score += 10;
    diff.right();
    IAKidsFX.correct(el);
    IAKidsCoins.right(el);
  } else {
    diff.wrong();
    IAKidsFX.wrong(el);
    IAKidsCoins.wrong();
    document.getElementById('hint-line').textContent = `המילה הנכונה: ${currentWord}`;
  }
  document.getElementById('score').textContent = score;
  setTimeout(next, 900);
}

async function end() {
  document.removeEventListener('keydown', onKeydown);
  await game.saveScore(score, { level });
  const top = (await game.getHighScores(1))[0];
  document.getElementById('final-score').textContent = score;
  document.getElementById('best').textContent = top?.score ?? score;
  document.getElementById('player-line').textContent =
    `${top?.player || 'אורח'} · ${new Date().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}`;
  document.getElementById('stars').textContent =
    '⭐'.repeat(Math.max(1, Math.round(score / (TOTAL * 10) * 3)));
  game.shareButton(score, document.getElementById('share-slot'));
  show('end-screen');
  game.complete(score);
}
</script>
</body>
</html>
