<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משלימים ל-10/100 | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>
#chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
.chip {
  min-height: 64px; font-size: 1.5rem; font-weight: 800; border-radius: 16px;
  border: 3px solid var(--blue); background: var(--card); color: var(--blue);
  cursor: pointer; transition: transform .25s, opacity .25s;
  -webkit-tap-highlight-color: transparent;
}
.chip.sel { background: var(--blue); color: #fff; transform: scale(1.08); }
.chip.gone { transform: scale(0); opacity: 0; pointer-events: none; }
#target-box { font-size: 2rem; font-weight: 900; color: var(--accent); }
</style>
</head>
<body>

<div class="game-hud">
  <span class="score"><span id="score-label"></span>: <span id="score">0</span></span>
  <span><span id="q-label"></span> <span id="qnum">1</span>/<span id="qtotal">5</span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div style="font-size:4rem">🔗</div>
    <h1 class="game-title" id="title"></h1>
    <p id="subtitle"></p>
    <p id="rounds-label"></p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr">
      <button class="game-btn secondary" onclick="start(1)" id="lvl1"></button>
      <button class="game-btn secondary" onclick="start(2)" id="lvl2"></button>
      <button class="game-btn secondary" onclick="start(3)" id="lvl3"></button>
      <button class="game-btn" onclick="start(0)" id="lvl0"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div id="target-box"><span id="target-label"></span> <b id="target"></b></div>
    <div id="chips"></div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" onclick="location.reload()" id="again"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>
<script>
const T = IAKidsLang.t.bind(IAKidsLang), UI = IAKidsLang.ui.bind(IAKidsLang);
document.getElementById('title').textContent = T({he:'משלימים ל-10/100', en:'Make Ten / Hundred', es:'Suma 10 / 100', de:'Mach 10 / 100', pt:'Faça 10 / 100'});
document.getElementById('subtitle').textContent = T({he:'לחץ על שני מספרים שסכומם היעד — והם ייעלמו! נקה את כל הלוח לפני שהפצצה מתפוצצת 💣', en:'Tap two numbers that add up to the target — they vanish! Clear the board before the bomb 💣', es:'¡Toca dos números que sumen el objetivo y desaparecen! Limpia el tablero antes de la bomba 💣', de:'Tippe zwei Zahlen, die zusammen das Ziel ergeben! Räume das Brett vor der Bombe 💣', pt:'Toque em dois números que somem o alvo — eles somem! Limpe o tabuleiro antes da bomba 💣'});
document.getElementById('rounds-label').textContent = T({he:'כמה לוחות?', en:'How many boards?', es:'¿Cuántos tableros?', de:'Wie viele Bretter?', pt:'Quantos tabuleiros?'});
document.getElementById('target-label').textContent = T({he:'משלימים ל:', en:'Make:', es:'Suma:', de:'Ziel:', pt:'Alvo:'});
document.getElementById('score-label').textContent = UI('score');
document.getElementById('q-label').textContent = UI('question');
document.getElementById('best-label').textContent = UI('your_best');
document.getElementById('again').textContent = UI('play_again');
document.getElementById('lvl1').textContent = UI('level_easy') + ' · 10';
document.getElementById('lvl2').textContent = UI('level_medium') + ' · 20';
document.getElementById('lvl3').textContent = UI('level_hard') + ' · 100';
document.getElementById('lvl0').textContent = UI('level_random');

let game, score = 0, qnum = 0, cleared = 0, level = 1;
let TOTAL = 5, diff, timer, target = 10, pairsLeft = 0, selEl = null, locked = false, roundActive = false;
const PAIRS = 4;
IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'make-ten',
  how: 'לוחצים על שני מספרים שביחד שווים בדיוק את היעד — והם נעלמים! מנקים את כל הלוח לפני שהפצצה מתפוצצת! 💣',
  example: 'היעד 10: לוחצים על <b>7</b> ואז על <b>3</b>, כי <span dir="ltr"><b>7 + 3 = 10</b></span>',
});

function setRounds(n, btn) {
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.remove('success'));
  btn.classList.add('success');
}

const show = id => {
  for (const s of ['start-screen', 'play-screen', 'end-screen'])
    document.getElementById(s).hidden = s !== id;
};

const rnd = n => Math.floor(Math.random() * n);
const TARGETS = { 1: 10, 2: 20, 3: 100 };

function makeBoard(lvl) {
  const t = TARGETS[lvl];
  const values = [];
  for (let i = 0; i < PAIRS; i++) {
    // level 3: multiples of 5 so the sums stay kid-friendly
    const x = lvl === 3 ? 5 * (1 + rnd(19)) : 1 + rnd(t - 1);
    values.push(x, t - x);
  }
  values.sort(() => Math.random() - 0.5);
  return { target: t, values };
}

async function start(lvl) {
  game = await IAKidsGame.init('make-ten');
  level = lvl;
  diff = game.difficulty(lvl || 1, 3);
  timer = game.timer({ style: 'bomb', onTimeout: timeout });
  const p = await game.loadProgress();
  if (p?.rounds && !document.querySelector('#rounds-row .success')) TOTAL = p.rounds;
  await game.saveProgress({ lastLevel: lvl, rounds: TOTAL });
  document.getElementById('qtotal').textContent = TOTAL;
  show('play-screen');
  next();
}

async function next() {
  if (qnum >= TOTAL) return end();
  qnum++;
  document.getElementById('qnum').textContent = qnum;
  const lvl = level === 0 ? 1 + rnd(3) : diff.level;
  const q = await game.newQuestion(() => makeBoard(lvl),
    x => x.target + ':' + [...x.values].sort((a, b) => a - b).join(','));
  target = q.target;
  pairsLeft = PAIRS;
  selEl = null; locked = false; roundActive = true;
  document.getElementById('target').textContent = target;
  const grid = document.getElementById('chips');
  grid.innerHTML = '';
  q.values.forEach(v => {
    const el = document.createElement('button');
    el.className = 'chip';
    el.textContent = v;
    el.dataset.v = v;
    el.onclick = () => tap(el);
    grid.appendChild(el);
  });
  timer.start(IAKidsTimer.secondsFor(diff.level, 20));
}

function tap(el) {
  if (!roundActive || locked || el.classList.contains('gone')) return;
  if (el === selEl) { el.classList.remove('sel'); selEl = null; return; } // tap again = deselect
  if (!selEl) { selEl = el; el.classList.add('sel'); return; }
  const a = selEl, b = el;
  if (+a.dataset.v + +b.dataset.v === target) {
    a.classList.remove('sel');
    a.classList.add('gone'); b.classList.add('gone');
    score += 10; pairsLeft--;
    IAKidsFX.correct(b);
    IAKidsCoins.right(b);
    selEl = null;
    if (pairsLeft === 0) {
      roundActive = false;
      timer.stop();
      cleared++;
      diff.right();
      setTimeout(next, 700);
    }
  } else {
    locked = true;
    IAKidsFX.wrong(a); IAKidsFX.wrong(b);
    IAKidsCoins.wrong();
    diff.wrong();
    setTimeout(() => { a.classList.remove('sel'); selEl = null; locked = false; }, 500);
  }
  document.getElementById('score').textContent = score;
}

function timeout() {
  if (!roundActive) return;
  roundActive = false;
  diff.wrong();
  IAKidsCoins.wrong();
  setTimeout(next, 900);
}

async function end() {
  timer.stop();
  await game.saveScore(score, { level, cleared, total: TOTAL });
  const top = (await game.getHighScores(1))[0];
  document.getElementById('final-score').textContent = score;
  document.getElementById('best').textContent = top?.score ?? score;
  document.getElementById('player-line').textContent =
    `${top?.player || UI('guest')} · ${new Date().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}`;
  const acc = cleared / TOTAL;
  document.getElementById('stars').textContent = '⭐'.repeat(acc >= 0.9 ? 3 : acc >= 0.6 ? 2 : 1);
  game.shareButton(score, document.getElementById('share-slot'));
  show('end-screen');
  game.complete(score);
}
</script>
</body>
</html>
