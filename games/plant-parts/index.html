<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>חלקים של צמח | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>
  #plantWrap { max-width: 340px; margin: 8px auto; }
  #plantsvg { width: 100%; height: auto; display: block; touch-action: manipulation; }
  .part { cursor: pointer; transition: filter .2s, opacity .2s; }
  .part:hover { filter: brightness(1.08); }
  .part.correct-flash { filter: drop-shadow(0 0 0 var(--green)); }
  .part.correct-flash * { fill: var(--green) !important; }
  .part.wrong-flash * { fill: var(--red) !important; }
  .part.ask-highlight * { fill: var(--yellow) !important; }
  #mcq-diagram { pointer-events: none; opacity: .95; }
</style>

<style id="iakids-premium-overrides">
:root{
  --space-bg:#06142d; --space-panel:#0b2857; --space-panel-dark:#071d43;
  --space-line:rgba(119,176,255,.27); --space-text:#f7f9ff;
  --space-muted:#b8c7e3; --space-gold:#ffd15c;
}
html,body{min-height:100%}
body{
  margin:0!important; min-height:100vh!important; padding:86px 18px 28px!important;
  overflow-x:hidden; color:var(--space-text)!important;
  font-family:"Heebo","Segoe UI",Arial,sans-serif!important;
  background:
    radial-gradient(circle at 12% 16%,rgba(26,139,255,.23),transparent 34%),
    radial-gradient(circle at 88% 10%,rgba(112,72,255,.25),transparent 35%),
    radial-gradient(circle at 50% 100%,rgba(12,184,203,.16),transparent 34%),
    linear-gradient(145deg,#050f25,#0a2148 52%,#07152e)!important;
}
body:before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image:radial-gradient(circle,rgba(255,255,255,.75) 0 1px,transparent 1.4px);
  background-size:56px 56px; opacity:.08;
}
*{box-sizing:border-box}
.game-card{
  width:min(500px,calc(100vw - 28px))!important; min-height:690px;
  margin:0 auto!important; padding:0!important; overflow:hidden;
  border:1px solid var(--space-line)!important; border-radius:28px!important;
  color:var(--space-text)!important;
  background:linear-gradient(180deg,rgba(17,58,111,.97),rgba(5,25,61,.98))!important;
  box-shadow:0 28px 75px rgba(0,8,28,.48),inset 0 1px rgba(255,255,255,.08)!important;
}
.game-hud{
  position:fixed!important; top:0!important; left:0!important; right:0!important; z-index:20;
  min-height:72px; padding:16px 24px!important; display:flex!important;
  align-items:center; justify-content:center!important; gap:42px;
  color:#fff!important; background:rgba(5,18,46,.88)!important;
  border-bottom:1px solid rgba(126,180,255,.18); backdrop-filter:blur(14px);
}
.game-hud .score{color:var(--space-gold)!important}
#start-screen,#play-screen,#end-screen{min-height:688px;padding:34px 30px 30px}
#start-screen{display:flex;flex-direction:column;align-items:center;text-align:center}
.game-title{
  margin:0; font-size:clamp(2.15rem,7vw,3.2rem)!important; line-height:1.05;
  color:#fff!important; text-shadow:0 4px 12px rgba(0,0,0,.22)
}
#start-screen>div:first-child{font-size:5rem!important;margin:6px 0 8px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.22))}
#start-screen p{color:var(--space-muted)!important;font-weight:600;line-height:1.65}
.answer-grid{width:100%;gap:12px!important}
.game-btn{
  min-height:54px;border-radius:15px!important;border:1px solid rgba(118,176,255,.34)!important;
  color:#fff!important;font-weight:900!important;
  background:linear-gradient(180deg,#1c91db,#0877bd)!important;
  box-shadow:inset 0 1px rgba(255,255,255,.18),0 9px 20px rgba(0,0,0,.16)!important;
}
.game-btn.outline{background:linear-gradient(180deg,rgba(52,81,139,.72),rgba(21,49,99,.75))!important}
.game-btn.success{background:linear-gradient(180deg,#37d182,#16ad64)!important}
#play-screen{position:relative}
.game-question{
  min-height:54px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;
  padding:9px 15px;border-radius:16px;text-align:center;color:#fff!important;
  font-size:1.35rem!important;font-weight:900;
  background:rgba(4,22,55,.5);border:1px solid rgba(116,177,255,.18)
}
#plantWrap{
  max-width:340px;margin:8px auto;padding:10px;border-radius:22px;
  background:rgba(226,245,255,.96);border:1px solid rgba(125,190,255,.35);
  box-shadow:0 16px 34px rgba(0,0,0,.20)
}
#plantsvg{width:100%;height:auto;display:block;touch-action:manipulation}
.part{cursor:pointer;transition:filter .2s,opacity .2s,transform .15s;transform-box:fill-box;transform-origin:center}
.part:hover{filter:brightness(1.08);transform:scale(1.025)}
.part.correct-flash{filter:drop-shadow(0 0 10px #36dc88)}
.part.correct-flash *{fill:#36c979!important}
.part.wrong-flash *{fill:#ff606e!important}
.part.ask-highlight{filter:drop-shadow(0 0 12px #ffd15c)}
.part.ask-highlight *{fill:#ffd15c!important}
#mcq-mode #plantWrap{max-width:210px}
#mcq-diagram{pointer-events:none;opacity:.96;width:100%;height:auto;display:block}
#mcq-answers{margin-top:12px}
#mcq-answers .game-btn{min-height:64px;padding:10px 14px;line-height:1.45;font-size:.98rem!important}
#end-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.stars{min-height:78px;font-size:3.7rem!important;letter-spacing:4px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.24))}
.big-score{margin:8px 0;color:#fff!important;font-size:4rem!important;font-weight:1000}
#player-line,#end-screen p{color:#d7e3f7!important}
[hidden]{display:none!important}
@media(max-width:600px){
  body{padding:74px 10px 18px!important}
  .game-card{min-height:calc(100vh - 94px);border-radius:22px!important}
  #start-screen,#play-screen,#end-screen{min-height:calc(100vh - 96px);padding:26px 16px 24px}
  .game-hud{min-height:62px;padding:12px 14px!important;gap:24px}
  #plantWrap{max-width:300px}
}
</style>

</head>
<body>

<div class="game-hud">
  <span class="score"><span id="score-label">ניקוד</span>: <span id="score">0</span></span>
  <span><span id="q-label">שאלה</span> <span id="qnum">1</span>/<span id="qtotal">10</span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div style="font-size:4rem">🌷</div>
    <h1 class="game-title" id="title">חלקים של צמח</h1>
    <p id="howto">לחצו על החלק הנכון בצמח! ברמה קשה — בחרו את התפקיד הנכון של כל חלק.</p>
    <p id="rounds-label">כמה שאלות?</p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline success" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)">🙂 קל</button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)">😎 בינוני</button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)">🤓 קשה</button>
      <button class="game-btn" data-lvl="0" onclick="start(0)">🎲 אקראי</button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div class="game-question" id="question" style="font-size:1.4rem"></div>
    <div id="tap-mode">
      <div id="plantWrap"><svg id="plantsvg" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </div>
    <div id="mcq-mode" hidden>
      <div id="plantWrap"><svg id="mcq-diagram" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg" style="max-width:180px;margin:0 auto;display:block"></svg></div>
      <div class="answer-grid" id="mcq-answers" style="grid-template-columns:1fr"></div>
    </div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label">השיא שלך</span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()">שחק שוב 🔁</button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>
<script>
let game, score = 0, qnum = 0, level = 1, TOTAL = 10, locked = false, current, mode;
let CHILD_AGE = null, USE_NIQQUD = false, mistakes = 0, timeouts = 0, ending = false;

const T_REGULAR = {
  title:'חלקים של צמח',
  howto:'לחצו על החלק הנכון בצמח! ברמה קשה — בחרו את התפקיד הנכון של כל חלק.',
  rounds:'כמה שאלות?'
};
const T_NIQQUD = {
  title:'חֲלָקִים שֶׁל צֶמַח',
  howto:'לַחֲצוּ עַל הַחֵלֶק הַנָּכוֹן בַּצֶּמַח! בָּרָמָה הַקָּשָׁה — בַּחֲרוּ אֶת הַתַּפְקִיד הַנָּכוֹן שֶׁל כָּל חֵלֶק.',
  rounds:'כַּמָּה שְׁאֵלוֹת?'
};

async function loadKidContext(){
  try{
    const kidId = localStorage.getItem('active_kid_id');
    if(!kidId) return;
    const client = await IAKidsActivity._getClient();
    const {data,error} = await client.from('kids_profiles').select('id, age').eq('id',kidId).maybeSingle();
    if(error || !data) return;
    CHILD_AGE = Number(data.age);
    USE_NIQQUD = CHILD_AGE === 1 || CHILD_AGE === 2;
  }catch(error){
    console.warn('[plant-parts] loadKidContext error', error);
  }
}

function applyKidText(){
  const t = USE_NIQQUD ? T_NIQQUD : T_REGULAR;
  document.getElementById('title').textContent = t.title;
  document.getElementById('howto').textContent = t.howto;
  document.getElementById('rounds-label').textContent = t.rounds;
  document.getElementById('score-label').textContent = IAKidsLang.ui('score');
  document.getElementById('q-label').textContent = IAKidsLang.ui('question');
  document.getElementById('best-label').textContent = IAKidsLang.ui('your_best');
  document.getElementById('again-btn').textContent = IAKidsLang.ui('play_again');
}

IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'plant-parts',
  how: 'לצמח יש כמה חלקים: שורש, גבעול, עלה ופרח (וגם פרי וזרע). ברמה קלה ובינונית לוחצים על החלק שנשאלים עליו בציור. ברמה קשה בוחרים מה כל חלק עושה בשביל הצמח.',
  example: 'שואלים: "לחצו על השורש" ← לוחצים על החלק שבתוך האדמה, בתחתית הצמח 🌱',
});

// ponytail: verified plant-biology facts (root=water/anchor, stem=support/transport,
// leaf=photosynthesis, flower=seeds/pollination, fruit=protects+spreads seeds, seed=embryo)
const PARTS = [
  { id: 'root', name: 'שורש', minLevel: 1, fn: 'סופג מים ומינרלים מהאדמה ומעגן את הצמח בקרקע' },
  { id: 'stem', name: 'גבעול', minLevel: 1, fn: 'תומך בצמח ומעביר מים וחומרי מזון בין השורש לעלים ולפרח' },
  { id: 'leaf', name: 'עלה', minLevel: 1, fn: 'מייצר מזון לצמח מאור השמש (פוטוסינתזה)' },
  { id: 'flower', name: 'פרח', minLevel: 1, fn: 'מייצר זרעים ומושך חרקים שמאביקים את הצמח' },
  { id: 'fruit', name: 'פרי', minLevel: 2, fn: 'עוטף ומגן על הזרעים ועוזר להפיץ אותם' },
  { id: 'seed', name: 'זרע', minLevel: 2, fn: 'מכיל צמח קטן שממנו יכול לצמוח צמח חדש' },
];

function drawPlant(svg, opts = {}) {
  const NS = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  const el = (tag, attrs) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  };
  const group = (id, visual) => {
    const g = el('g', { class: 'part', 'data-id': id });
    visual.forEach(v => g.appendChild(v));
    svg.appendChild(g);
    return g;
  };
  // ground
  svg.appendChild(el('rect', { x: 0, y: 480, width: 400, height: 120, fill: '#c9a06a' }));
  svg.appendChild(el('rect', { x: 0, y: 470, width: 400, height: 12, fill: '#8bc76a' }));
  // root
  const rootPaths = [
    el('path', { d: 'M200,480 Q160,520 130,560', stroke: '#a0743a', 'stroke-width': 8, fill: 'none', 'stroke-linecap': 'round' }),
    el('path', { d: 'M200,480 Q240,520 270,560', stroke: '#a0743a', 'stroke-width': 8, fill: 'none', 'stroke-linecap': 'round' }),
    el('path', { d: 'M200,480 L200,560', stroke: '#a0743a', 'stroke-width': 8, fill: 'none', 'stroke-linecap': 'round' }),
    el('rect', { x: 120, y: 480, width: 160, height: 100, fill: 'transparent' }), // generous hit area
  ];
  const g_root = group('root', rootPaths);
  // stem
  const stemPaths = [
    el('rect', { x: 190, y: 230, width: 20, height: 250, fill: '#3f9142', rx: 8 }),
    el('rect', { x: 165, y: 230, width: 70, height: 250, fill: 'transparent' }),
  ];
  const g_stem = group('stem', stemPaths);
  // leaves
  const leafPaths = [
    el('ellipse', { cx: 130, cy: 350, rx: 70, ry: 34, fill: '#4caf50', transform: 'rotate(-20 130 350)' }),
    el('ellipse', { cx: 270, cy: 400, rx: 70, ry: 34, fill: '#4caf50', transform: 'rotate(20 270 400)' }),
  ];
  const g_leaf = group('leaf', leafPaths);
  // flower
  const petals = [];
  for (let i = 0; i < 6; i++) {
    const ang = i * 60;
    petals.push(el('ellipse', { cx: 200, cy: 110, rx: 32, ry: 55, fill: '#ff6fa5', transform: `rotate(${ang} 200 160)` }));
  }
  petals.push(el('circle', { cx: 200, cy: 160, r: 30, fill: '#ffd23f' }));
  const g_flower = group('flower', petals);
  // fruit (level 2+)
  const g_fruit = group('fruit', [
    el('circle', { cx: 285, cy: 340, r: 30, fill: '#e63946' }),
    el('path', { d: 'M285,310 q8,-14 18,-10', stroke: '#3f9142', 'stroke-width': 5, fill: 'none' }),
  ]);
  // seed (level 2+)
  const g_seed = group('seed', [
    el('ellipse', { cx: 110, cy: 540, rx: 22, ry: 15, fill: '#8b5a2b' }),
    el('rect', { x: 80, y: 515, width: 60, height: 50, fill: 'transparent' }),
  ]);

  const groups = { root: g_root, stem: g_stem, leaf: g_leaf, flower: g_flower, fruit: g_fruit, seed: g_seed };
  if (opts.minLevel < 2) { g_fruit.remove(); g_seed.remove(); delete groups.fruit; delete groups.seed; }
  return groups;
}

function setRounds(n, btn) {
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.remove('success'));
  btn.classList.add('success');
}

const show = id => {
  for (const s of ['start-screen', 'play-screen', 'end-screen'])
    document.getElementById(s).hidden = s !== id;
};

let diff, timer;
async function start(lvl) {
  await loadKidContext();
  applyKidText();

  game = await IAKidsGame.init('plant-parts');
  level = lvl;
  diff = game.difficulty(lvl || 1, 3);
  timer = game.timer({ style: 'bomb', onTimeout: () => { if (!locked) handleTimeout(); } });

  score = 0;
  qnum = 0;
  mistakes = 0;
  timeouts = 0;
  ending = false;
  locked = false;

  const p = await game.loadProgress();
  if (p?.rounds && !document.querySelector('#rounds-row .success')) TOTAL = p.rounds;

  IAKidsActivity.configure({
    difficulty: lvl || 1,
    questionsCount: TOTAL,
    metadata: {
      game_mode: 'plant-parts',
      selected_level: lvl,
      random_difficulty: lvl === 0,
      child_age: CHILD_AGE,
      uses_niqqud: USE_NIQQUD,
      timer_enabled: true
    }
  });

  await game.saveProgress({ lastLevel: lvl, rounds: TOTAL });

  document.getElementById('score').textContent = '0';
  document.getElementById('qnum').textContent = '1';
  document.getElementById('qtotal').textContent = TOTAL;
  show('play-screen');
  await next();
}

const rnd = n => Math.floor(Math.random() * n);
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

async function next() {
  if (qnum >= TOTAL) return end();
  qnum++;
  document.getElementById('qnum').textContent = qnum;
  const lvl = level === 0 ? 1 + rnd(3) : diff.level;
  mode = lvl >= 3 ? 'mcq' : 'tap';
  const pool = PARTS.filter(p => p.minLevel <= lvl);
  const q = await game.newQuestion(() => ({ part: pool[rnd(pool.length)], mode }), x => x.mode + ':' + x.part.id);
  current = q.part;
  IAKidsActivity.questionStarted();

  document.getElementById('tap-mode').hidden = mode !== 'tap';
  document.getElementById('mcq-mode').hidden = mode !== 'mcq';

  if (mode === 'tap') {
    document.getElementById('question').textContent = USE_NIQQUD ? `לַחֲצוּ עַל הַ${({root:'שֹׁרֶשׁ',stem:'גִּבְעוֹל',leaf:'עָלֶה',flower:'פֶּרַח',fruit:'פְּרִי',seed:'זֶרַע'})[current.id]}` : `לחצו על ה${current.name}`;
    const svg = document.getElementById('plantsvg');
    const groups = drawPlant(svg, { minLevel: lvl });
    Object.values(groups).forEach(g => g.onclick = () => resolveTap(g.dataset.id === current.id, g));
  } else {
    document.getElementById('question').textContent = USE_NIQQUD ? `מָה הַתַּפְקִיד שֶׁל הַ${({root:'שֹׁרֶשׁ',stem:'גִּבְעוֹל',leaf:'עָלֶה',flower:'פֶּרַח',fruit:'פְּרִי',seed:'זֶרַע'})[current.id]}?` : `מה התפקיד של ה${current.name}?`;
    const svg = document.getElementById('mcq-diagram');
    const groups = drawPlant(svg, { minLevel: 2 });
    Object.values(groups).forEach(g => g.classList.remove('ask-highlight'));
    groups[current.id]?.classList.add('ask-highlight');
    const wrong = shuffle(PARTS.filter(p => p.id !== current.id)).slice(0, 3);
    const choices = shuffle([current, ...wrong]);
    const box = document.getElementById('mcq-answers');
    box.innerHTML = '';
    choices.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'game-btn outline';
      btn.style.fontSize = '1.05rem';
      btn.textContent = c.fn;
      btn.onclick = () => resolveTap(c.id === current.id, btn);
      box.appendChild(btn);
    });
  }
  timer.start(IAKidsTimer.secondsFor(lvl, mode === 'mcq' ? 14 : 12));
}

function resolveTap(isCorrect, el) {
  if (locked) return;
  locked = true;
  timer.stop();
  if (isCorrect) {
    score += 10;
    diff.right();
    IAKidsActivity.correct();
    IAKidsFX.correct(el);
    IAKidsCoins.right(el);
    if (mode === 'tap') el.classList.add('correct-flash');
    else el.classList.add('correct');
  } else {
    mistakes++;
    diff.wrong();
    IAKidsActivity.wrong();
    IAKidsFX.wrong(el);
    IAKidsCoins.wrong();
    if (mode === 'tap') { el.classList.add('wrong-flash'); setTimeout(() => document.querySelector(`#plantsvg [data-id="${current.id}"]`)?.classList.add('correct-flash'), 400); }
  }
  document.getElementById('score').textContent = score;
  setTimeout(() => { locked = false; next(); }, 1000);
}

function handleTimeout() {
  locked = true;
  timer.stop();
  timeouts++;
  diff.wrong();
  IAKidsActivity.skipped();
  IAKidsCoins.wrong();
  document.getElementById('score').textContent = score;
  setTimeout(() => { locked = false; next(); }, 700);
}

async function end() {
  if (ending) return;
  ending = true;
  locked = true;
  timer?.stop();

  const maxScore = TOTAL * 10;
  const successfulAnswers = Math.round(score / 10);
  const performance = TOTAL ? Math.round((successfulAnswers / TOTAL) * 100) : 0;

  await game.saveScore(score, { level, mistakes, timeouts });

  const top = (await game.getHighScores(1))[0];
  document.getElementById('final-score').textContent = score;
  document.getElementById('best').textContent = top?.score ?? score;
  document.getElementById('player-line').textContent =
    `${top?.player || IAKidsLang.ui('guest')} · ${new Date().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}`;
  document.getElementById('stars').textContent =
    '⭐'.repeat(performance >= 90 ? 3 : performance >= 70 ? 2 : 1);

  await game.complete(score, {
    maxScore,
    performanceScore: performance,
    metadata: {
      game_mode: 'plant-parts',
      selected_level: level,
      random_difficulty: level === 0,
      total_rounds: TOTAL,
      mistakes,
      timeouts,
      correct_answers: successfulAnswers,
      child_age: CHILD_AGE,
      uses_niqqud: USE_NIQQUD,
      timer_enabled: true
    }
  });

  game.shareButton(score, document.getElementById('share-slot'));
  show('end-screen');
}
</script>
</body>
</html>
