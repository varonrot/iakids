<link rel="stylesheet" href="../game-style.css">

<style>.game-card{width:min(560px,calc(100vw - 28px))!important}.game-title{font-size:clamp(2.15rem,7vw,3.15rem)!important}/* PLAY */.play-note{color:#d5e4fb;font-size:.96rem;font-weight:800;margin:0 auto 12px;text-align:center}#tray{align-items:center;background:rgba(4,22,55,.5);border:1px solid rgba(116,177,255,.18);border-radius:22px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:150px;padding:12px}.chip{align-items:center;background:linear-gradient(180deg,#1c4e8d,#123b73);border:1px solid rgba(129,190,255,.35);border-radius:15px;box-shadow:0 9px 19px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.12);color:#fff;cursor:grab;display:inline-flex;font-size:.98rem;font-weight:900;justify-content:center;min-height:56px;min-width:130px;padding:8px 12px;position:relative;text-align:center;touch-action:none;user-select:none;white-space:normal}.chip.dragging{box-shadow:0 18px 40px rgba(0,0,0,.36);cursor:grabbing;pointer-events:none;position:fixed;transform:scale(1.05);z-index:100}.bins{display:grid;gap:11px;grid-template-columns:1fr 1fr;margin-top:16px}.drop-zone{background:linear-gradient(180deg,rgba(18,69,124,.42),rgba(5,31,69,.60));border:2px dashed rgba(106,189,255,.42);border-radius:20px;min-height:150px;padding:11px 8px;transition:.2s ease}.drop-zone.over{background:rgba(35,185,111,.18);border-color:#5dffad!important;transform:scale(1.015)}.drop-zone h3{font-size:1.06rem;font-weight:900;margin:0 0 9px;text-align:center}.bin-items{align-content:flex-start;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:65px}.bin-items span{border-radius:10px;font-size:.82rem;font-weight:800;line-height:1.25;padding:5px 8px}

.bin-summer{border-color:rgba(255,209,92,.66) !important}
.bin-summer h3{color:#ffe08b}
.bin-summer .bin-items span{background:#d6a31b;color:#fff}

.bin-winter{border-color:rgba(59,166,255,.72) !important}
.bin-winter h3{color:#79c9ff}
.bin-winter .bin-items span{background:#168fd5;color:#fff}

.bin-spring{border-color:rgba(161,106,255,.72) !important}
.bin-spring h3{color:#c5a0ff}
.bin-spring .bin-items span{background:#8155da;color:#fff}

.bin-autumn{border-color:rgba(255,142,68,.72) !important}
.bin-autumn h3{color:#ffb175}
.bin-autumn .bin-items span{background:#d97835;color:#fff}/* END */

@media(max-width:600px){

  .chip{min-width:calc(50% - 6px)}
  .bins{grid-template-columns:1fr 1fr}
  .drop-zone{min-height:135px}
}
</style>
</head>

<body class="theme-space">

<div class="game-hud">
  <span class="score">
    <span id="score-label">ניקוד</span>:
    <span id="score">0</span>
  </span>

  <span>
    <span id="q-label">פריט</span>
    <span id="qnum">1</span>/<span id="qtotal">10</span>
  </span>
</div>

<div class="game-card" id="card">

  <div id="start-screen">
    <div class="hero-icon">🍂🌸☀️❄️</div>

    <h1 class="game-title" id="title"></h1>

    <p id="howto"></p>

    <p class="section-label" id="rounds-label"></p>

    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline success" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>

    <p class="section-label" id="level-label"></p>

    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)"></button>
      <button class="game-btn" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div class="play-note" id="play-note"></div>
    <div id="tray"></div>
    <div class="bins" id="bins"></div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

async function loadKidContext(){
  try{
    const kidId = localStorage.getItem('active_kid_id');
    if(!kidId) return;

    const client = await IAKidsActivity._getClient();

    const {data,error} = await client
      .from('kids_profiles')
      .select('id, age')
      .eq('id',kidId)
      .maybeSingle();

    if(error || !data){
      console.warn('[seasons] Kid profile was not loaded',error);
      return;
    }

    CHILD_AGE = Number(data.age);
    USE_NIQQUD = CHILD_AGE === 1 || CHILD_AGE === 2;

  }catch(error){
    console.warn('[seasons] loadKidContext error',error);
  }
}

  BINS = USE_NIQQUD ? BINS_NIQQUD : BINS_REGULAR;
  BANK = USE_NIQQUD ? BANK_NIQQUD : BANK_REGULAR;

  $('title').textContent = IAKidsLang.t(T.title);
  $('howto').textContent = IAKidsLang.t(T.howto);
  $('rounds-label').textContent = IAKidsLang.t(T.rounds);
  $('level-label').textContent = IAKidsLang.t(T.level);
  $('play-note').textContent = IAKidsLang.t(T.play);
  $('score-label').textContent = IAKidsLang.ui('score');
  $('q-label').textContent = IAKidsLang.ui('question');
  $('best-label').textContent = IAKidsLang.ui('your_best');
  $('again-btn').textContent = IAKidsLang.ui('play_again');

  ['level_easy','level_medium','level_hard','level_random'].forEach((key,index)=>{
    document.querySelectorAll('#level-row .game-btn')[index].textContent =
      IAKidsLang.ui(key);
  });
}

function setRounds(n,btn){
  TOTAL = n;

  document.querySelectorAll('#rounds-row .game-btn')
    .forEach(button=>button.classList.remove('success'));

  btn.classList.add('success');
}

const ready = (async()=>{
  await loadKidContext();
  applyLanguage();

  game = await IAKidsGame.init('seasons');

  const progress = await game.loadProgress();

  if(progress?.rounds){
    const btn =
      document.querySelector(`#rounds-row [onclick*="(${progress.rounds},"]`) ||
      $('rounds-row').children[1];

    setRounds(progress.rounds,btn);
  }

  if(progress?.lastLevel !== undefined){
    document
      .querySelector(`#level-row [data-lvl="${progress.lastLevel}"]`)
      ?.classList.add('success');
  }
})();

function renderBins(){
  $('bins').innerHTML =
    Object.entries(BINS)
      .map(([cat,bin])=>`
        <div class="drop-zone ${bin.cls}" data-cat="${cat}">
          <h3>${bin.emoji} ${IAKidsLang.t(bin.label)}</h3>
          <div class="bin-items"></div>
        </div>
      `)
      .join('');
}

async function start(selectedLevel){
  await ready;

  level = selectedLevel;
  maxTier =
    selectedLevel === 0
      ? 1 + rnd(3)
      : selectedLevel;

  diff = game.difficulty(
    selectedLevel || 1,
    3
  );

  score = 0;
  sorted = 0;
  mistakes = 0;
  ending = false;
  drag = null;

  $('score').textContent = '0';
  $('qnum').textContent = '1';
  $('qtotal').textContent = TOTAL;

  IAKidsActivity.configure({
    difficulty:selectedLevel || 1,
    questionsCount:TOTAL,
    metadata:{
      game_mode:'seasons',
      selected_level:selectedLevel,
      random_difficulty:selectedLevel === 0,
      child_age:CHILD_AGE,
      uses_niqqud:USE_NIQQUD,
      max_tier:maxTier
    }
  });

  await game.saveProgress({
    lastLevel:selectedLevel,
    rounds:TOTAL
  });

  renderBins();
  show('play-screen');

  await fillTray();
}

async function fillTray(){
  const tray = $('tray');

  const tier =
    level === 0
      ? 1 + rnd(3)
      : maxTier;

  const pool =
    BANK.filter(
      item=>item.tier <= tier
    );

  while(
    tray.querySelectorAll('.chip').length <
    Math.min(4,TOTAL - sorted)
  ){
    const q = await game.newQuestion(
      ()=>pool[rnd(pool.length)],
      item=>item.text
    );

    const chip =
      document.createElement('div');

    chip.className = 'chip';
    chip.textContent = q.text;
    chip.dataset.cat = q.cat;

    makeDraggable(chip);

    tray.appendChild(chip);
  }
}

function makeDraggable(chip){
  chip.addEventListener('pointerdown',event=>{
    if(drag || ending) return;

    event.preventDefault();

    chip.setPointerCapture(
      event.pointerId
    );

    const rect =
      chip.getBoundingClientRect();

    drag = {
      chip,
      dx:event.clientX - rect.left,
      dy:event.clientY - rect.top
    };

    chip.style.width =
      `${rect.width}px`;

    chip.classList.add('dragging');

    IAKidsActivity.questionStarted();

    moveTo(event);
  });

  chip.addEventListener('pointermove',event=>{
    if(drag?.chip === chip){
      moveTo(event);
    }
  });

  chip.addEventListener('pointerup',event=>{
    if(drag?.chip === chip){
      dropChip(event);
    }
  });

  chip.addEventListener('pointercancel',()=>{
    if(drag?.chip === chip){
      settle(chip);
      drag = null;
      unmarkZones();
    }
  });
}

function moveTo(event){
  drag.chip.style.left =
    `${event.clientX - drag.dx}px`;

  drag.chip.style.top =
    `${event.clientY - drag.dy}px`;

  const zone =
    zoneAt(
      event.clientX,
      event.clientY
    );

  document.querySelectorAll('.drop-zone')
    .forEach(item=>
      item.classList.toggle(
        'over',
        item === zone
      )
    );
}

const zoneAt = (x,y)=>
  document.elementFromPoint(x,y)
    ?.closest('.drop-zone') || null;

const unmarkZones = ()=>
  document.querySelectorAll('.drop-zone')
    .forEach(item=>item.classList.remove('over'));

function settle(chip){
  chip.classList.remove('dragging');
  chip.style.left = '';
  chip.style.top = '';
  chip.style.width = '';
}

async function dropChip(event){
  const zone =
    zoneAt(
      event.clientX,
      event.clientY
    );

  unmarkZones();

  const chip = drag.chip;
  drag = null;

  settle(chip);

  if(!zone || ending) return;

  const correct =
    zone.dataset.cat ===
    chip.dataset.cat;

  if(correct){
    score += 10;
    sorted++;

    $('score').textContent = score;
    $('qnum').textContent =
      Math.min(
        sorted + 1,
        TOTAL
      );

    diff.right();

    IAKidsActivity.correct();

    IAKidsFX.correct(zone);
    await IAKidsCoins.right(zone);

    const placed =
      document.createElement('span');

    placed.textContent =
      chip.textContent;

    zone.querySelector('.bin-items')
      .appendChild(placed);

    chip.remove();

    if(sorted >= TOTAL){
      await end();
      return;
    }

    await fillTray();

  }else{
    mistakes++;

    diff.wrong();

    IAKidsActivity.wrong();

    IAKidsFX.wrong(chip);

    await IAKidsCoins.wrong();
  }
}

async function end(){
  if(ending) return;

  ending = true;

  const maxScore =
    TOTAL * 10;

  const accuracy =
    TOTAL /
    Math.max(
      1,
      TOTAL + mistakes
    );

  await game.saveScore(
    score,
    {
      level,
      mistakes
    }
  );

  const top =
    (await game.getHighScores(1))[0];

  $('final-score').textContent =
    score;

  $('best').textContent =
    top?.score ?? score;

  $('player-line').textContent =
    `${top?.player || IAKidsLang.ui('guest')} · ${
      new Date().toLocaleString(
        'he-IL',
        {
          dateStyle:'short',
          timeStyle:'short'
        }
      )
    }`;

  $('stars').textContent =
    '⭐'.repeat(
      accuracy >= .9
        ? 3
        : accuracy >= .7
          ? 2
          : 1
    );

  await game.complete(
    score,
    {
      maxScore,

      performanceScore:
        Math.round(
          accuracy * 100
        ),

      metadata:{
        game_mode:'seasons',
        selected_level:level,
        random_difficulty:level === 0,
        total_items:TOTAL,
        sorted_items:sorted,
        mistakes,
        child_age:CHILD_AGE,
        uses_niqqud:USE_NIQQUD,
        max_tier:maxTier
      }
    }
  );

  game.shareButton(
    score,
    $('share-slot')
  );

  show('end-screen');
}
</script>
