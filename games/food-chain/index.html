<!DOCTYPE html>
<html dir="rtl" lang="he">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>שרשרת המזון | iakids</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="../game-style.css"
  >


  <style>

    /* =====================================================
       FOOD CHAIN — IAKIDS GAMES
    ===================================================== */

    :root{
      --food-bg:#06142c;
      --food-panel:#10264d;
      --food-panel-2:#0a1c3b;

      --food-blue:#36b9ff;
      --food-green:#38d47d;
      --food-purple:#7654ff;
      --food-gold:#ffc940;

      --food-text:#f7f9ff;
      --food-muted:#b7c7e3;

      --food-line:
        rgba(126,177,255,.25);

      --food-shadow:
        0 26px 70px
        rgba(0,5,25,.52);
    }


    *{
      box-sizing:border-box;
    }


    html,
    body,
    button,
    input,
    textarea,
    select{
      font-family:
        "Heebo",
        Arial,
        sans-serif !important;
    }


    html,
    body{
      min-height:100%;
    }


   body{
  margin:0 !important;
  min-height:100vh !important;

  padding:
    92px
    20px
    34px !important;

  display:grid !important;
  place-items:center !important;

  color:var(--food-text) !important;

  background:
    radial-gradient(
      circle at 16% 15%,
      rgba(36,143,255,.25),
      transparent 34%
    ),
    radial-gradient(
      circle at 86% 12%,
      rgba(125,74,255,.22),
      transparent 32%
    ),
    radial-gradient(
      circle at 50% 110%,
      rgba(29,211,139,.20),
      transparent 38%
    ),
    linear-gradient(
      145deg,
      #050e22,
      #0a2147 52%,
      #07152e
    ) !important;

  overflow-x:hidden;
}

.food-game-shell{
  width:min(820px,100%);
  margin:0 auto;

  position:relative;
  left:0;
  right:0;

  transform:translate(-12px,-18px);
}


    body::before{
      content:"";

      position:fixed;
      inset:0;

      z-index:-2;

      pointer-events:none;

      background:
        radial-gradient(
          circle,
          rgba(255,255,255,.75) 0 1px,
          transparent 1.5px
        );

      background-size:
        72px 72px;

      opacity:.15;
    }


    body::after{
      content:"";

      position:fixed;

      right:0;
      bottom:-180px;
      left:0;

      height:420px;

      z-index:-1;

      pointer-events:none;

      background:
        radial-gradient(
          ellipse at center,
          rgba(30,210,133,.17),
          transparent 68%
        );
    }


    [hidden]{
      display:none !important;
    }


    /* =====================================================
       TOP NAVIGATION
    ===================================================== */

    .food-game-nav{
      position:fixed;

      top:16px;
      right:18px;
      left:18px;

      z-index:1000;

      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:12px;

      pointer-events:none;
    }


    .food-nav-group{
      display:flex;
      align-items:center;

      gap:10px;

      pointer-events:auto;
    }


    .food-nav-button{
      min-height:48px;

      padding:
        0
        17px;

      display:grid;
      place-items:center;

      gap:8px;

      border:
        1px solid
        rgba(131,182,255,.28);

      border-radius:16px;

      color:#fff;

      background:
        linear-gradient(
          145deg,
          rgba(27,44,84,.97),
          rgba(10,23,52,.98)
        );

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.09),

        0 10px 26px
        rgba(0,0,0,.33);

      text-decoration:none;

      font-size:14px;
      font-weight:900;

      transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    }


    .food-nav-button:hover{
      transform:
        translateY(-2px);

      border-color:
        rgba(94,202,255,.68);

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.12),

        0 15px 32px
        rgba(0,0,0,.42),

        0 0 19px
        rgba(44,157,255,.16);
    }


    .food-nav-button:active{
      transform:
        scale(.97);
    }


    .food-nav-button span{
      font-size:20px;
      line-height:1;
    }


    .food-nav-workspace{
      background:
        linear-gradient(
          145deg,
          #7655ff,
          #4c31bb
        );
    }


    /* =====================================================
       GAME SHELL
    ===================================================== */

    .food-game-shell{
      width:
        min(
          820px,
          100%
        );

      margin:auto;
    }


    /* =====================================================
       HUD
    ===================================================== */

    .game-hud{
      position:fixed !important;

      top:16px !important;
      left:50% !important;

      transform:
        translateX(-50%) !important;

      z-index:1001 !important;

      min-width:330px !important;
      min-height:50px !important;

      padding:
        7px
        20px !important;

      display:flex !important;

      align-items:center !important;
      justify-content:center !important;

      gap:30px !important;

      border:
        1px solid
        rgba(126,180,255,.30) !important;

      border-radius:17px !important;

      color:#fff !important;

      background:
        linear-gradient(
          145deg,
          rgba(28,45,86,.98),
          rgba(10,23,51,.98)
        ) !important;

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.09),

        0 10px 28px
        rgba(0,0,0,.35) !important;

      font-size:15px !important;
      font-weight:900 !important;
    }


    .game-hud .score{
      color:
        var(--food-gold) !important;
    }


    .game-hud #score{
      color:#fff !important;

      font-size:19px;
    }


    .game-hud #qnum,
    .game-hud #qtotal{
      color:
        #64dcff !important;
    }


    /* =====================================================
       MAIN CARD
    ===================================================== */

    .game-card{
      position:relative !important;

      width:100% !important;
      min-height:570px !important;

      margin:0 auto !important;

      padding:
        38px
        42px
        40px !important;

      overflow:hidden !important;

      border:
        1px solid
        rgba(126,179,255,.30) !important;

      border-radius:32px !important;

      color:
        var(--food-text) !important;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(54,151,255,.22),
          transparent 43%
        ),
        linear-gradient(
          145deg,
          rgba(20,43,85,.98),
          rgba(7,22,50,.99)
        ) !important;

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.09),

        inset 0 0 0 1px
        rgba(62,123,214,.05),

        var(--food-shadow),

        0 0 52px
        rgba(40,137,255,.11) !important;

      backdrop-filter:
        blur(16px);

      -webkit-backdrop-filter:
        blur(16px);
    }


    .game-card::before{
      content:"";

      position:absolute;
      inset:10px;

      pointer-events:none;

      border:
        1px solid
        rgba(126,180,255,.13);

      border-radius:24px;
    }


    .game-card::after{
      content:"";

      position:absolute;

      right:10%;
      bottom:-105px;
      left:10%;

      height:175px;

      pointer-events:none;

      border-radius:50%;

      background:
        rgba(47,215,137,.13);

      filter:
        blur(48px);
    }


    #start-screen,
    #play-screen,
    #end-screen{
      position:relative;

      z-index:3;
    }


    /* =====================================================
       START SCREEN
    ===================================================== */

    #start-screen{
      text-align:center;
    }


    .food-main-emoji{
      margin-top:2px;

      font-size:5.4rem;

      line-height:1;

      filter:
        drop-shadow(
          0 13px 18px
          rgba(0,0,0,.31)
        );

      animation:
        foodFoxFloat
        2.8s
        ease-in-out
        infinite;
    }


    @keyframes foodFoxFloat{

      0%,
      100%{
        transform:
          translateY(0);
      }

      50%{
        transform:
          translateY(-8px);
      }

    }


    .game-title{
      margin:
        9px
        0
        10px !important;

      color:#fff !important;

      font-size:
        clamp(
          36px,
          5vw,
          53px
        ) !important;

      line-height:1.05 !important;

      font-weight:900 !important;

      text-shadow:
        0 4px 17px
        rgba(0,0,0,.40),

        0 0 25px
        rgba(72,183,255,.20);
    }


    .food-game-description{
      max-width:650px;

      margin:
        0
        auto
        20px !important;

      color:
        var(--food-muted) !important;

      font-size:16px !important;
      line-height:1.75 !important;
      font-weight:600;
    }


    .food-section-label{
      margin:
        22px
        0
        9px !important;

      color:#fff !important;

      font-size:18px !important;
      line-height:1.3;

      font-weight:900 !important;
    }


    /* =====================================================
       ANSWER GRIDS
    ===================================================== */

    .answer-grid{
      position:relative;

      z-index:3;

      gap:12px !important;

      margin-top:14px !important;
    }


    .food-rounds-grid{
      display:grid !important;

      grid-template-columns:
        repeat(
          3,
          minmax(0,1fr)
        ) !important;
    }


    .food-level-grid{
      display:grid !important;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        ) !important;
    }


    .game-btn{
      min-height:58px !important;

      padding:
        10px
        15px !important;

      border:
        1px solid
        rgba(255,255,255,.20) !important;

      border-radius:17px !important;

      color:#fff !important;

      background:
        linear-gradient(
          145deg,
          #7654ff,
          #4d32bd
        ) !important;

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.20),

        inset 0 -9px 16px
        rgba(0,0,0,.16),

        0 9px 21px
        rgba(25,9,91,.34) !important;

      font-size:16px !important;
      line-height:1.25;
      font-weight:900 !important;

      cursor:pointer;

      transition:
        transform .18s ease,
        filter .18s ease,
        box-shadow .18s ease;
    }


    .game-btn:hover{
      transform:
        translateY(-3px);

      filter:
        brightness(1.09)
        saturate(1.08);

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.25),

        inset 0 -9px 16px
        rgba(0,0,0,.14),

        0 15px 28px
        rgba(25,9,91,.44) !important;
    }


    .game-btn:active{
      transform:
        scale(.96);
    }


    .game-btn.outline{
      color:
        #dce8ff !important;

      border-color:
        rgba(123,168,243,.30) !important;

      background:
        linear-gradient(
          145deg,
          rgba(40,62,109,.95),
          rgba(19,35,71,.97)
        ) !important;

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.09),

        0 8px 20px
        rgba(0,8,30,.25) !important;
    }


    .game-btn.outline.success{
      color:#fff !important;

      border-color:
        rgba(91,240,160,.67) !important;

      background:
        linear-gradient(
          145deg,
          #35cc7d,
          #158d55
        ) !important;

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.22),

        0 0 21px
        rgba(51,216,130,.23),

        0 10px 22px
        rgba(0,60,32,.28) !important;
    }


    .game-btn.secondary{
      background:
        linear-gradient(
          145deg,
          #1789d5,
          #0d5598
        ) !important;

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.18),

        inset 0 -9px 16px
        rgba(0,0,0,.15),

        0 9px 21px
        rgba(3,45,96,.35) !important;
    }


    /* =====================================================
       PLAY SCREEN
    ===================================================== */

    #play-screen{
      min-height:480px;
    }


    .game-question{
      width:fit-content;
      max-width:100%;

      margin:
        0
        auto
        9px !important;

      padding:
        13px
        19px;

      border:
        1px solid
        rgba(109,184,255,.25);

      border-radius:17px;

      color:#fff !important;

      background:
        rgba(35,77,136,.42);

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.07);

      font-size:1.4rem !important;
      line-height:1.5;

      font-weight:900 !important;
      text-align:center;
    }


    #hint{
      min-height:31px;

      margin:
        7px
        0
        13px;

      color:
        #7fe2ff !important;

      font-size:15px;
      font-weight:800;

      text-align:center;
    }


    /* =====================================================
       CHAIN AREA
    ===================================================== */

    #chain{
      min-height:120px;

      margin:
        16px
        0;

      padding:
        16px
        12px;

      display:flex;
      flex-wrap:wrap;

      gap:10px;

      align-items:center;
      justify-content:center;

      border:
        1px dashed
        rgba(92,223,157,.40);

      border-radius:22px;

      background:
        linear-gradient(
          145deg,
          rgba(25,109,84,.24),
          rgba(16,72,64,.15)
        );
    }


    #chain:empty::before{
      content:
        "השרשרת שתבנו תופיע כאן";

      color:
        rgba(196,219,234,.50);

      font-size:13px;
      font-weight:700;
    }


    #chain .link{
      min-width:96px;

      padding:
        10px
        12px;

      display:flex;
      flex-direction:column;

      align-items:center;
      justify-content:center;

      gap:3px;

      border:
        1px solid
        rgba(109,239,173,.37);

      border-radius:17px;

      color:#fff;

      background:
        linear-gradient(
          145deg,
          rgba(39,171,111,.86),
          rgba(17,101,75,.90)
        );

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.14),

        0 8px 18px
        rgba(0,30,18,.25);

      font-size:1rem;
      font-weight:900;

      animation:
        chainLinkEnter
        .32s
        ease
        both;
    }


    @keyframes chainLinkEnter{

      from{
        opacity:0;

        transform:
          translateY(9px)
          scale(.84);
      }

      to{
        opacity:1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    #chain .link .emoji{
      font-size:2.1rem;
      line-height:1;
    }


    #chain .arrow{
      color:
        #65f0aa;

      font-size:2rem;
      line-height:1;

      font-weight:900;

      text-shadow:
        0 0 13px
        rgba(67,237,153,.50);
    }


    /* =====================================================
       CHIPS
    ===================================================== */

    #chips{
      display:flex;

      flex-wrap:wrap;

      gap:16px;

      justify-content:center;

      margin:
        22px
        0
        4px;
    }


    .chip{
      min-width:112px;
      min-height:112px;

      padding:
        13px
        13px;

      display:flex;

      flex-direction:column;

      align-items:center;
      justify-content:center;

      gap:6px;

      border:
        1px solid
        rgba(122,191,255,.36);

      border-radius:22px;

      color:
        #f7f9ff;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(87,173,255,.23),
          transparent 59%
        ),
        linear-gradient(
          145deg,
          rgba(38,67,121,.98),
          rgba(17,39,80,.98)
        );

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.10),

        0 11px 23px
        rgba(0,8,31,.30);

      font-size:1rem;
      line-height:1.2;

      font-weight:900;

      cursor:pointer;

      transition:
        transform .18s ease,
        opacity .3s,
        border-color .18s ease,
        box-shadow .18s ease,
        filter .18s ease;
    }


    .chip:hover{
      transform:
        translateY(-5px)
        scale(1.035);

      border-color:
        rgba(96,222,255,.75);

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.14),

        0 16px 30px
        rgba(0,8,31,.40),

        0 0 19px
        rgba(57,180,255,.17);
    }


    .chip:active{
      transform:
        scale(.94);
    }


    .chip .emoji{
      font-size:2.9rem;

      line-height:1;

      filter:
        drop-shadow(
          0 5px 6px
          rgba(0,0,0,.22)
        );
    }


    .chip.used{
      opacity:.18;

      pointer-events:none;

      filter:
        grayscale(.65);
    }


    /* =====================================================
       END SCREEN
    ===================================================== */

    .end-screen{
      min-height:470px;

      display:flex;
      flex-direction:column;

      align-items:center;
      justify-content:center;

      text-align:center;
    }


    .end-screen .stars{
      min-height:65px;

      font-size:4rem;
      line-height:1;

      filter:
        drop-shadow(
          0 8px 13px
          rgba(255,191,42,.30)
        );
    }


    .end-screen .big-score{
      margin:
        17px
        0
        9px;

      color:#fff;

      font-size:4.4rem;
      line-height:1;

      font-weight:900;

      text-shadow:
        0 0 22px
        rgba(75,184,255,.36);
    }


    .end-screen p{
      margin:
        7px
        0;

      color:
        var(--food-muted);

      font-size:16px;
    }


    .end-screen #best{
      color:
        var(--food-gold);
    }


    .end-screen .game-btn{
      min-width:210px;

      margin-top:18px;
    }


    #share-slot{
      margin-top:15px;
    }


    /* =====================================================
       TABLET
    ===================================================== */

    @media(max-width:900px){

      body{
        padding-right:14px !important;
        padding-left:14px !important;
      }


      .game-card{
        min-height:540px !important;

        padding:
          34px
          26px
          35px !important;
      }


      .food-nav-button{
        padding:
          0
          13px;

        font-size:13px;
      }

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media(max-width:680px){

      body{
        padding:
          112px
          10px
          18px !important;

        align-items:flex-start !important;
      }


      .food-game-nav{
        top:8px;
        right:8px;
        left:8px;

        align-items:stretch;
      }


      .food-nav-group{
        width:100%;

        display:grid;

        grid-template-columns:
          repeat(
            2,
            minmax(0,1fr)
          );

        gap:7px;
      }


      .food-nav-button{
        min-height:42px;

        padding:
          0
          8px;

        border-radius:13px;

        font-size:11px;
      }


      .food-nav-button span{
        font-size:17px;
      }


      .game-hud{
        position:fixed !important;

        top:57px !important;

        width:
          calc(100% - 16px) !important;

        min-width:0 !important;
        min-height:43px !important;

        padding:
          5px
          10px !important;

        gap:20px !important;

        border-radius:14px !important;

        font-size:12px !important;
      }


      .game-hud #score{
        font-size:15px;
      }


      .game-card{
        min-height:0 !important;

        padding:
          26px
          14px
          29px !important;

        border-radius:25px !important;
      }


      .game-card::before{
        inset:7px;

        border-radius:19px;
      }


      .food-main-emoji{
        font-size:4.4rem;
      }


      .game-title{
        font-size:34px !important;
      }


      .food-game-description{
        font-size:14px !important;
        line-height:1.65 !important;
      }


      .food-section-label{
        font-size:16px !important;
      }


      .food-level-grid{
        grid-template-columns:
          1fr !important;
      }


      .game-btn{
        min-height:51px !important;

        font-size:14px !important;
      }


      .game-question{
        padding:
          11px
          10px;

        font-size:1.05rem !important;
      }


      #hint{
        font-size:13px;
      }


      #chain{
        min-height:105px;

        padding:
          11px
          6px;
      }


      #chain .link{
        min-width:73px;

        padding:
          8px
          7px;

        font-size:.85rem;
      }


      #chain .link .emoji{
        font-size:1.7rem;
      }


      #chain .arrow{
        font-size:1.4rem;
      }


      #chips{
        gap:9px;

        margin-top:15px;
      }


      .chip{
        min-width:86px;
        min-height:92px;

        flex:
          1
          1
          86px;

        border-radius:18px;

        font-size:.88rem;
      }


      .chip .emoji{
        font-size:2.3rem;
      }


      .end-screen{
        min-height:400px;
      }


      .end-screen .stars{
        font-size:3rem;
      }


      .end-screen .big-score{
        font-size:3.6rem;
      }

    }


    @media(max-width:390px){

      .food-rounds-grid{
        gap:7px !important;
      }


      .game-btn{
        padding:
          8px
          7px !important;
      }


      .chip{
        min-width:78px;

        flex-basis:78px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       NAVIGATION
  ====================================================== -->

  <nav
    class="food-game-nav"
    aria-label="ניווט במשחק"
  >

    <div class="food-nav-group">

      <a
        class="food-nav-button food-nav-workspace"
        href="/he/games/workspace/"
      >
        <span>🏰</span>
        חזרה למפת המשחקים
      </a>


      <a
        class="food-nav-button"
        href="/games/"
      >
        <span>🎮</span>
        כל המשחקים
      </a>

    </div>

  </nav>


  <!-- =====================================================
       GAME
  ====================================================== -->

  <main class="food-game-shell">


    <div class="game-hud">

      <span class="score">
        ⭐ ניקוד:
        <span id="score">0</span>
      </span>


      <span>
        🎯 שאלה
        <span id="qnum">1</span>
        /
        <span id="qtotal">10</span>
      </span>

    </div>


    <div
      class="game-card"
      id="card"
    >


      <!-- =================================================
           START SCREEN
      ================================================== -->

      <div id="start-screen">


        <div class="food-main-emoji">
          🦊
        </div>


        <h1 class="game-title">
          שרשרת המזון
        </h1>


        <p class="food-game-description">
          מי אוכל את מי?
          לחצו על היצורים לפי הסדר הנכון —
          מהיצרן ועד הטורף!
        </p>


        <p class="food-section-label">
          כמה שאלות?
        </p>


        <div
          class="answer-grid food-rounds-grid"
          id="rounds-row"
        >

          <button
            class="game-btn outline"
            onclick="setRounds(5,this)"
          >
            5 שאלות
          </button>


          <button
            class="game-btn outline success"
            onclick="setRounds(10,this)"
          >
            10 שאלות
          </button>


          <button
            class="game-btn outline"
            onclick="setRounds(15,this)"
          >
            15 שאלות
          </button>

        </div>


        <p class="food-section-label">
          בחרו רמת קושי
        </p>


        <div class="answer-grid food-level-grid">

          <button
            class="game-btn secondary"
            onclick="start(1)"
          >
            🙂 קל
          </button>


          <button
            class="game-btn secondary"
            onclick="start(2)"
          >
            😎 בינוני
          </button>


          <button
            class="game-btn secondary"
            onclick="start(3)"
          >
            🤓 קשה
          </button>


          <button
            class="game-btn"
            onclick="start(0)"
          >
            🎲 אקראי
          </button>

        </div>

      </div>


      <!-- =================================================
           PLAY SCREEN
      ================================================== -->

      <div
        id="play-screen"
        hidden
      >

        <div
          class="game-question"
          id="question"
        ></div>


        <div id="hint"></div>


        <div id="chain"></div>


        <div id="chips"></div>

      </div>


      <!-- =================================================
           END SCREEN
      ================================================== -->

      <div
        id="end-screen"
        class="end-screen"
        hidden
      >

        <div
          class="stars"
          id="stars"
        ></div>


        <div
          class="big-score"
          id="final-score"
        ></div>


        <p id="player-line"></p>


        <p>
          השיא שלך:
          <b id="best"></b>
        </p>


        <button
          class="game-btn"
          onclick="location.reload()"
        >
          שחק שוב 🔁
        </button>


        <div id="share-slot"></div>

      </div>


    </div>

  </main>


  <script src="../game-sdk.js"></script>


  <script>

    let game,
        score = 0,
        qnum = 0,
        level = 1,
        TOTAL = 10;


    let current,
        chainStep,
        locked = false;


    IAKidsCoins.mount();


    IAKidsHelp.mount({

      slug:
        'food-chain',

      how:
        'כל שרשרת מזון מתחילה בצמח (יצרן), ואז חיה שאוכלת אותו, ואז חיה שאוכלת את החיה הזו. לחצו על היצורים המפוזרים לפי הסדר הנכון — ממי שנאכל ראשון ועד הטורף האחרון!',

      example:
        '🌾 חיטה ← 🐭 עכבר ← 🦉 ינשוף<br>(הינשוף אוכל את העכבר, שאוכל את החיטה)',

    });


    // ponytail: verified real food chains,
    // 3-4 links each,
    // producer → consumer(s) → top predator

    const CHAINS = [

      {
        level:1,

        links:[
          {n:'עשב',e:'🌱'},
          {n:'ארנב',e:'🐰'},
          {n:'שועל',e:'🦊'}
        ]
      },


      {
        level:1,

        links:[
          {n:'עשב',e:'🌱'},
          {n:'פרה',e:'🐄'},
          {n:'אדם',e:'🧑'}
        ]
      },


      {
        level:1,

        links:[
          {n:'עלים',e:'🍃'},
          {n:'זחל',e:'🐛'},
          {n:'ציפור',e:'🐦'}
        ]
      },


      {
        level:1,

        links:[
          {n:'אצות',e:'🌿'},
          {n:'דג קטן',e:'🐟'},
          {n:'דג גדול',e:'🐠'}
        ]
      },


      {
        level:2,

        links:[
          {n:'חיטה',e:'🌾'},
          {n:'עכבר',e:'🐭'},
          {n:'ינשוף',e:'🦉'}
        ]
      },


      {
        level:2,

        links:[
          {n:'פרח',e:'🌸'},
          {n:'דבורה',e:'🐝'},
          {n:'ציפור',e:'🐦'},
          {n:'נחש',e:'🐍'}
        ]
      },


      {
        level:2,

        links:[
          {n:'עשב',e:'🌱'},
          {n:'ארבה',e:'🦗'},
          {n:'צפרדע',e:'🐸'},
          {n:'נחש',e:'🐍'}
        ]
      },


      {
        level:2,

        links:[
          {n:'פלנקטון',e:'🦠'},
          {n:'דג קטן',e:'🐟'},
          {n:'כריש',e:'🦈'}
        ]
      },


      {
        level:3,

        links:[
          {n:'עשב',e:'🌱'},
          {n:'ארנב',e:'🐰'},
          {n:'נחש',e:'🐍'},
          {n:'נשר',e:'🦅'}
        ]
      },


      {
        level:3,

        links:[
          {n:'עלים',e:'🍃'},
          {n:'חרגול',e:'🦗'},
          {n:'צפרדע',e:'🐸'},
          {n:'חסידה',e:'🦩'}
        ]
      },


      {
        level:3,

        links:[
          {n:'עשב ים',e:'🌿'},
          {n:'צב ים',e:'🐢'},
          {n:'כריש',e:'🦈'}
        ]
      },


      {
        level:3,

        links:[
          {n:'תירס',e:'🌽'},
          {n:'עכבר',e:'🐭'},
          {n:'נחש',e:'🐍'},
          {n:'שועל',e:'🦊'}
        ]
      }

    ];


    function setRounds(
      n,
      btn
    ){

      TOTAL = n;


      document
        .querySelectorAll(
          '#rounds-row .game-btn'
        )
        .forEach(
          b =>
            b.classList.remove(
              'success'
            )
        );


      btn.classList.add(
        'success'
      );

    }


    const show =
      id => {

        for(
          const s
          of [
            'start-screen',
            'play-screen',
            'end-screen'
          ]
        ){

          document
            .getElementById(s)
            .hidden =
              s !== id;

        }

      };


    let diff,
        timer;


    async function start(
      lvl
    ){

      game =
        await IAKidsGame.init(
          'food-chain'
        );


      level = lvl;


      diff =
        game.difficulty(
          lvl || 1,
          3
        );


      timer =
        game.timer({

          style:
            'bomb',

          onTimeout:
            () => {

              if(!locked){
                failStep();
              }

            }

        });


      const p =
        await game.loadProgress();


      if(
        p?.rounds &&
        !document.querySelector(
          '#rounds-row .success'
        )
      ){

        TOTAL =
          p.rounds;

      }


      await game.saveProgress({

        lastLevel:
          lvl,

        rounds:
          TOTAL

      });


      document
        .getElementById(
          'qtotal'
        )
        .textContent =
          TOTAL;


      show(
        'play-screen'
      );


      next();

    }


    const rnd =
      n =>
        Math.floor(
          Math.random() * n
        );


    function shuffle(
      arr
    ){

      const a =
        arr.slice();


      for(
        let i =
          a.length - 1;

        i > 0;

        i--
      ){

        const j =
          rnd(
            i + 1
          );


        [
          a[i],
          a[j]
        ] = [
          a[j],
          a[i]
        ];

      }


      return a;

    }


    async function next(){

      if(
        qnum >= TOTAL
      ){

        return end();

      }


      qnum++;


      document
        .getElementById(
          'qnum'
        )
        .textContent =
          qnum;


      const lvl =
        level === 0
          ? 1 + rnd(3)
          : diff.level;


      const pool =
        CHAINS.filter(
          c =>
            c.level === lvl
        );


      const q =
        await game.newQuestion(

          () =>
            pool[
              rnd(
                pool.length
              )
            ],

          c =>
            c.links
              .map(
                l => l.n
              )
              .join('>')

        );


      current = q;


      chainStep = 0;


      document
        .getElementById(
          'question'
        )
        .textContent =
          `סדרו את שרשרת המזון: מי אוכל את מי? (${q.links.length} חוליות)`;


      document
        .getElementById(
          'hint'
        )
        .textContent =
          'לחצו קודם על היצרן (הצמח)';


      renderChain();


      renderChips();


      timer.start(

        IAKidsTimer.secondsFor(
          lvl,
          14
        )

      );

    }


    function renderChain(){

      const chainEl =
        document.getElementById(
          'chain'
        );


      chainEl.innerHTML =
        '';


      current.links
        .slice(
          0,
          chainStep
        )
        .forEach(
          (
            l,
            i
          ) => {

            if(
              i > 0
            ){

              const a =
                document.createElement(
                  'span'
                );


              a.className =
                'arrow';


              a.textContent =
                '←';


              chainEl.appendChild(
                a
              );

            }


            const d =
              document.createElement(
                'div'
              );


            d.className =
              'link';


            d.innerHTML =
              `<span class="emoji">${l.e}</span>${l.n}`;


            chainEl.appendChild(
              d
            );

          }
        );

    }


    function renderChips(){

      const chipsEl =
        document.getElementById(
          'chips'
        );


      chipsEl.innerHTML =
        '';


      const scattered =
        shuffle(
          current.links
        );


      scattered.forEach(
        l => {

          const c =
            document.createElement(
              'div'
            );


          c.className =
            'chip';


          c.innerHTML =
            `<span class="emoji">${l.e}</span>${l.n}`;


          c.onclick =
            () =>
              tapChip(
                l,
                c
              );


          chipsEl.appendChild(
            c
          );

        }
      );

    }


    function tapChip(
      l,
      el
    ){

      if(
        locked
      ){
        return;
      }


      const expected =
        current.links[
          chainStep
        ];


      if(
        l.n === expected.n
      ){

        locked = true;


        el.classList.add(
          'used'
        );


        IAKidsFX.correct(
          el
        );


        chainStep++;


        renderChain();


        if(
          chainStep >=
          current.links.length
        ){

          timer.stop();


          score += 10;


          diff.right();


          IAKidsCoins.right(
            el
          );


          document
            .getElementById(
              'score'
            )
            .textContent =
              score;


          document
            .getElementById(
              'hint'
            )
            .textContent =
              '✔ מעולה! שרשרת שלמה';


          setTimeout(
            () => {

              locked = false;

              next();

            },
            900
          );

        }

        else{

          document
            .getElementById(
              'hint'
            )
            .textContent =
              `עכשיו לחצו על מי שאוכל את ה${expected.n}`;


          setTimeout(
            () => {

              locked = false;

            },
            250
          );

        }

      }

      else{

        IAKidsFX.wrong(
          el
        );


        IAKidsCoins.wrong();


        diff.wrong();

      }

    }


    function failStep(){

      timer.stop();


      locked = true;


      diff.wrong();


      IAKidsCoins.wrong();


      document
        .getElementById(
          'hint'
        )
        .textContent =
          '⏰ נגמר הזמן!';


      setTimeout(
        () => {

          locked = false;

          next();

        },
        900
      );

    }


    async function end(){

      await game.saveScore(
        score,
        {
          level
        }
      );


      const top =
        (
          await game.getHighScores(
            1
          )
        )[0];


      document
        .getElementById(
          'final-score'
        )
        .textContent =
          score;


      document
        .getElementById(
          'best'
        )
        .textContent =
          top?.score ??
          score;


      document
        .getElementById(
          'player-line'
        )
        .textContent =

          `${

            top?.player ||
            'אורח'

          } · ${

            new Date()
              .toLocaleString(
                'he-IL',
                {
                  dateStyle:
                    'short',

                  timeStyle:
                    'short'
                }
              )

          }`;


      document
        .getElementById(
          'stars'
        )
        .textContent =

          '⭐'.repeat(

            Math.max(

              1,

              Math.round(

                score /
                (
                  TOTAL * 10
                ) *
                3

              )

            )

          );


      game.shareButton(

        score,

        document.getElementById(
          'share-slot'
        )

      );


      show(
        'end-screen'
      );


      game.complete(
        score
      );

    }

  </script>

</body>

</html>
