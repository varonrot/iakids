<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>שרשרת המזון | iakids</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="../game-style.css"
  >

  <style>
    :root{
      --bg-dark:#06142d;
      --panel:#0d254c;
      --panel-2:#091a37;
      --line:rgba(119,176,255,.27);
      --text:#f7f9ff;
      --muted:#b8c7e3;
      --blue:#27a9ef;
      --green:#2bc875;
      --purple:#7550f7;
      --gold:#ffc83d;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body,
    button,
    input,
    textarea,
    select{
      font-family:"Heebo", Arial, sans-serif !important;
    }

    html,
    body{
      min-height:100%;
    }

    body{
      margin:0 !important;
      min-height:100vh !important;
      padding:88px 20px 30px !important;

      display:grid !important;
      place-items:center !important;

      color:var(--text) !important;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(27,137,255,.22),
          transparent 34%
        ),
        radial-gradient(
          circle at 87% 10%,
          rgba(119,73,255,.22),
          transparent 33%
        ),
        radial-gradient(
          circle at 50% 108%,
          rgba(20,215,150,.22),
          transparent 38%
        ),
        linear-gradient(
          145deg,
          #050f25,
          #0a2148 52%,
          #07152e
        ) !important;

      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:-1;
      pointer-events:none;

      background-image:
        radial-gradient(
          circle,
          rgba(255,255,255,.7) 0 1px,
          transparent 1.4px
        );

      background-size:72px 72px;
      opacity:.14;
    }

    [hidden]{
      display:none !important;
    }

    /* =============================
       כפתור חזרה יחיד
    ============================= */

.workspace-back{
  position:fixed;

  top:14px;

  /* משאירים מקום לכפתור העזרה של המשחק */
  right:82px;

  z-index:900;

  min-height:48px;
  padding:0 18px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;

  border:1px solid rgba(160,191,255,.34);
  border-radius:16px;

  color:#fff;
  text-decoration:none;

  background:
    linear-gradient(
      145deg,
      #7956ff,
      #4e31bf
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    0 11px 28px rgba(0,0,0,.32);

  font-size:14px;
  font-weight:900;

  transition:
    transform .18s ease,
    filter .18s ease,
    box-shadow .18s ease;
}

    .workspace-back:hover{
      transform:translateY(-2px);
      filter:brightness(1.08);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        0 15px 34px rgba(0,0,0,.4);
    }

    .workspace-back:active{
      transform:scale(.97);
    }

    .workspace-back span{
      font-size:20px;
      line-height:1;
    }

    /* =============================
       מעטפת המשחק
    ============================= */

    .food-game-shell{
      width:min(720px,100%);
      margin:0 auto;
    }

    .game-card{
      position:relative !important;

      width:100% !important;
      min-height:600px !important;

      margin:0 auto !important;
      padding:0 38px 38px !important;

      overflow:hidden !important;

      border:1px solid var(--line) !important;
      border-radius:32px !important;

      color:var(--text) !important;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(48,145,255,.22),
          transparent 40%
        ),
        linear-gradient(
          145deg,
          rgba(19,43,86,.98),
          rgba(7,21,48,.99)
        ) !important;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 30px 75px rgba(0,5,25,.5),
        0 0 48px rgba(45,138,255,.1) !important;

      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
    }

    .game-card::before{
      content:"";
      position:absolute;
      inset:10px;
      pointer-events:none;

      border:1px solid rgba(126,180,255,.13);
      border-radius:24px;
    }

    .game-card::after{
      content:"";
      position:absolute;
      right:12%;
      bottom:-105px;
      left:12%;
      height:170px;

      pointer-events:none;
      border-radius:50%;

      background:rgba(42,215,141,.13);
      filter:blur(45px);
    }

    /* =============================
       HUD בתוך הכרטיס
    ============================= */

    .game-hud{
      position:relative !important;
      inset:auto !important;
      transform:none !important;
      z-index:5 !important;

      width:calc(100% + 76px) !important;
      min-width:0 !important;
      min-height:58px !important;

      margin:
        0
        -38px
        24px !important;

      padding:8px 20px !important;

      display:flex !important;
      align-items:center !important;
      justify-content:center !important;
      gap:34px !important;

      border:0 !important;
      border-bottom:1px solid rgba(126,180,255,.24) !important;
      border-radius:0 !important;

      color:#fff !important;

      background:
        linear-gradient(
          145deg,
          rgba(27,45,87,.98),
          rgba(9,22,50,.98)
        ) !important;

      box-shadow:
        inset 0 -1px 0 rgba(255,255,255,.03),
        0 9px 23px rgba(0,0,0,.18) !important;

      font-size:15px !important;
      font-weight:900 !important;
    }

    .game-hud .score{
      color:var(--gold) !important;
    }

    .game-hud #score{
      color:#fff !important;
      font-size:18px;
    }

    .game-hud #qnum,
    .game-hud #qtotal{
      color:#69deff !important;
    }

    #start-screen,
    #play-screen,
    #end-screen{
      position:relative;
      z-index:3;
    }

    /* =============================
       מסך פתיחה
    ============================= */

    #start-screen{
      text-align:center;
    }

    .food-main-emoji{
      margin-top:6px;
      font-size:5.2rem;
      line-height:1;

      filter:
        drop-shadow(
          0 12px 17px rgba(0,0,0,.3)
        );

      animation:
        foxFloat
        2.8s
        ease-in-out
        infinite;
    }

    @keyframes foxFloat{
      0%,
      100%{
        transform:translateY(0);
      }

      50%{
        transform:translateY(-7px);
      }
    }

    .game-title{
      margin:13px 0 10px !important;

      color:#fff !important;

      font-size:
        clamp(
          38px,
          5vw,
          54px
        ) !important;

      line-height:1.05 !important;
      font-weight:900 !important;

      text-shadow:
        0 4px 16px rgba(0,0,0,.38),
        0 0 23px rgba(68,180,255,.18);
    }

    .game-description{
      max-width:600px;
      margin:0 auto 20px !important;

      color:var(--muted) !important;

      font-size:16px !important;
      line-height:1.7 !important;
      font-weight:600;
    }

    .section-label{
      margin:21px 0 9px !important;

      color:#fff !important;

      font-size:18px !important;
      font-weight:900 !important;
    }

    /* =============================
       כפתורי בחירה
    ============================= */

    .answer-grid{
      display:grid !important;
      gap:12px !important;
      margin-top:13px !important;
    }

    .rounds-grid{
      grid-template-columns:repeat(3,minmax(0,1fr)) !important;
    }

    .levels-grid{
      grid-template-columns:repeat(2,minmax(0,1fr)) !important;
    }

    .game-btn{
      min-height:58px !important;
      padding:10px 15px !important;

      border:1px solid rgba(255,255,255,.19) !important;
      border-radius:17px !important;

      color:#fff !important;

      background:
        linear-gradient(
          145deg,
          #7653ff,
          #4e32bd
        ) !important;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.2),
        inset 0 -8px 15px rgba(0,0,0,.14),
        0 9px 21px rgba(26,9,91,.32) !important;

      font-size:16px !important;
      font-weight:900 !important;

      cursor:pointer;

      transition:
        transform .18s ease,
        filter .18s ease,
        box-shadow .18s ease;
    }

    .game-btn:hover{
      transform:translateY(-3px);
      filter:brightness(1.08);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.23),
        inset 0 -8px 15px rgba(0,0,0,.13),
        0 14px 27px rgba(26,9,91,.42) !important;
    }

    .game-btn:active{
      transform:scale(.96);
    }

    .game-btn.outline{
      color:#dce8ff !important;

      border-color:rgba(124,170,244,.3) !important;

      background:
        linear-gradient(
          145deg,
          rgba(40,62,110,.96),
          rgba(19,35,71,.98)
        ) !important;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 8px 20px rgba(0,8,30,.24) !important;
    }

    .game-btn.outline.success{
      color:#fff !important;

      border-color:rgba(92,239,161,.65) !important;

      background:
        linear-gradient(
          145deg,
          #35cd7e,
          #178f57
        ) !important;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        0 0 20px rgba(47,216,129,.22),
        0 10px 22px rgba(0,58,32,.27) !important;
    }

    .game-btn.secondary{
      background:
        linear-gradient(
          145deg,
          #178bd7,
          #0d579b
        ) !important;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 -8px 15px rgba(0,0,0,.14),
        0 9px 21px rgba(3,45,96,.34) !important;
    }

    /* =============================
       מסך משחק
    ============================= */

    #play-screen{
      min-height:470px;
      padding-top:7px;
    }

    .game-question{
      width:fit-content;
      max-width:100%;

      margin:0 auto 9px !important;
      padding:13px 18px;

      border:1px solid rgba(109,184,255,.25);
      border-radius:17px;

      color:#fff !important;

      background:rgba(35,77,136,.42);

      font-size:1.4rem !important;
      line-height:1.5;
      font-weight:900 !important;
      text-align:center;
    }

    #hint{
      min-height:31px;
      margin:7px 0 13px;

      color:#7fe2ff !important;

      font-size:15px;
      font-weight:800;
      text-align:center;
    }

    #chain{
      min-height:120px;
      margin:16px 0;
      padding:16px 12px;

      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
      gap:10px;

      border:1px dashed rgba(92,223,157,.4);
      border-radius:22px;

      background:
        linear-gradient(
          145deg,
          rgba(25,109,84,.24),
          rgba(16,72,64,.15)
        );
    }

    #chain:empty::before{
      content:"השרשרת שתבנו תופיע כאן";

      color:rgba(196,219,234,.5);

      font-size:13px;
      font-weight:700;
    }

    #chain .link{
      min-width:96px;
      padding:10px 12px;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:3px;

      border:1px solid rgba(109,239,173,.37);
      border-radius:17px;

      color:#fff;

      background:
        linear-gradient(
          145deg,
          rgba(39,171,111,.86),
          rgba(17,101,75,.9)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.14),
        0 8px 18px rgba(0,30,18,.25);

      font-size:1rem;
      font-weight:900;
    }

    #chain .link .emoji{
      font-size:2.1rem;
      line-height:1;
    }

    #chain .arrow{
      color:#65f0aa;

      font-size:2rem;
      font-weight:900;

      text-shadow:
        0 0 13px rgba(67,237,153,.5);
    }

    #chips{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:16px;

      margin:22px 0 4px;
    }

    .chip{
      min-width:112px;
      min-height:112px;
      padding:13px;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;

      border:1px solid rgba(122,191,255,.36);
      border-radius:22px;

      color:#f7f9ff;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(87,173,255,.23),
          transparent 59%
        ),
        linear-gradient(
          145deg,
          rgba(38,67,121,.98),
          rgba(17,39,80,.98)
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.1),
        0 11px 23px rgba(0,8,31,.3);

      font-size:1rem;
      font-weight:900;

      cursor:pointer;

      transition:
        transform .18s ease,
        opacity .3s,
        border-color .18s ease,
        box-shadow .18s ease;
    }

    .chip:hover{
      transform:
        translateY(-5px)
        scale(1.035);

      border-color:rgba(96,222,255,.75);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.14),
        0 16px 30px rgba(0,8,31,.4),
        0 0 19px rgba(57,180,255,.17);
    }

    .chip:active{
      transform:scale(.94);
    }

    .chip .emoji{
      font-size:2.9rem;
      line-height:1;

      filter:
        drop-shadow(
          0 5px 6px rgba(0,0,0,.22)
        );
    }

    .chip.used{
      opacity:.18;
      pointer-events:none;
      filter:grayscale(.65);
    }

    /* =============================
       מסך סיום
    ============================= */

    .end-screen{
      min-height:470px;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;

      text-align:center;
    }

    .end-screen .stars{
      min-height:65px;

      font-size:4rem;
      line-height:1;

      filter:
        drop-shadow(
          0 8px 13px rgba(255,191,42,.3)
        );
    }

    .end-screen .big-score{
      margin:17px 0 9px;

      color:#fff;

      font-size:4.4rem;
      line-height:1;
      font-weight:900;

      text-shadow:
        0 0 22px rgba(75,184,255,.36);
    }

    .end-screen p{
      margin:7px 0;

      color:var(--muted);

      font-size:16px;
    }

    .end-screen #best{
      color:var(--gold);
    }

    .end-screen .game-btn{
      min-width:210px;
      margin-top:18px;
    }

    #share-slot{
      margin-top:15px;
    }

    /* =============================
       מובייל
    ============================= */

    @media(max-width:680px){
      body{
        padding:
          75px
          10px
          16px !important;

        align-items:start !important;
      }

.workspace-back{
  top:9px;
  right:62px;

  min-height:43px;
  padding:0 11px;

  border-radius:13px;

  font-size:11px;
}

      .workspace-back span{
        font-size:17px;
      }

      .game-card{
        min-height:0 !important;
        padding:0 14px 28px !important;
        border-radius:25px !important;
      }

      .game-card::before{
        inset:7px;
        border-radius:19px;
      }

      .game-hud{
        width:calc(100% + 28px) !important;
        min-height:52px !important;

        margin:
          0
          -14px
          20px !important;

        padding:6px 10px !important;
        gap:20px !important;

        font-size:12px !important;
      }

      .game-hud #score{
        font-size:15px;
      }

      .food-main-emoji{
        font-size:4.2rem;
      }

      .game-title{
        font-size:34px !important;
      }

      .game-description{
        font-size:14px !important;
      }

      .section-label{
        font-size:16px !important;
      }

      .levels-grid{
        grid-template-columns:1fr !important;
      }

      .game-btn{
        min-height:51px !important;
        font-size:14px !important;
      }

      .game-question{
        padding:11px 10px;
        font-size:1.05rem !important;
      }

      #hint{
        font-size:13px;
      }

      #chain{
        min-height:105px;
        padding:11px 6px;
      }

      #chain .link{
        min-width:73px;
        padding:8px 7px;
        font-size:.85rem;
      }

      #chain .link .emoji{
        font-size:1.7rem;
      }

      #chain .arrow{
        font-size:1.4rem;
      }

      #chips{
        gap:9px;
        margin-top:15px;
      }

      .chip{
        min-width:86px;
        min-height:92px;

        flex:
          1
          1
          86px;

        border-radius:18px;
        font-size:.88rem;
      }

      .chip .emoji{
        font-size:2.3rem;
      }
    }
  </style>
</head>

<body>

  <a
    class="workspace-back"
    href="/he/games/workspace/"
  >
    <span>🏰</span>
    חזרה למפת המשחקים
  </a>

  <main class="food-game-shell">

    <div
      class="game-card"
      id="card"
    >

      <div class="game-hud">

        <span class="score">
          ⭐ ניקוד:
          <span id="score">0</span>
        </span>

        <span>
          🎯 שאלה
          <span id="qnum">1</span>
          /
          <span id="qtotal">10</span>
        </span>

      </div>

      <div id="start-screen">

        <div class="food-main-emoji">
          🦊
        </div>

        <h1 class="game-title">
          שרשרת המזון
        </h1>

        <p class="game-description">
          מי אוכל את מי?
          לחצו על היצורים לפי הסדר הנכון —
          מהיצרן ועד הטורף!
        </p>

        <p class="section-label">
          כמה שאלות?
        </p>

        <div
          class="answer-grid rounds-grid"
          id="rounds-row"
        >

          <button
            class="game-btn outline"
            onclick="setRounds(5,this)"
          >
            5 שאלות
          </button>

          <button
            class="game-btn outline success"
            onclick="setRounds(10,this)"
          >
            10 שאלות
          </button>

          <button
            class="game-btn outline"
            onclick="setRounds(15,this)"
          >
            15 שאלות
          </button>

        </div>

        <p class="section-label">
          בחרו רמת קושי
        </p>

        <div class="answer-grid levels-grid">

          <button
            class="game-btn secondary"
            onclick="start(1)"
          >
            🙂 קל
          </button>

          <button
            class="game-btn secondary"
            onclick="start(2)"
          >
            😎 בינוני
          </button>

          <button
            class="game-btn secondary"
            onclick="start(3)"
          >
            🤓 קשה
          </button>

          <button
            class="game-btn"
            onclick="start(0)"
          >
            🎲 אקראי
          </button>

        </div>

      </div>

      <div
        id="play-screen"
        hidden
      >

        <div
          class="game-question"
          id="question"
        ></div>

        <div id="hint"></div>

        <div id="chain"></div>

        <div id="chips"></div>

      </div>

      <div
        id="end-screen"
        class="end-screen"
        hidden
      >

        <div
          class="stars"
          id="stars"
        ></div>

        <div
          class="big-score"
          id="final-score"
        ></div>

        <p id="player-line"></p>

        <p>
          השיא שלך:
          <b id="best"></b>
        </p>

        <button
          class="game-btn"
          onclick="location.reload()"
        >
          שחק שוב 🔁
        </button>

        <div id="share-slot"></div>

      </div>

    </div>

  </main>

<!--  <script src="../game-sdk.js"></script>-->
  <script src="../game-sdk.js?v=20260804-2"></script>

  <script>
    let game, score = 0, qnum = 0, level = 1, TOTAL = 10;
    let current, chainStep, locked = false;

    IAKidsCoins.mount();

    IAKidsHelp.mount({
      slug: 'food-chain',
      how: 'כל שרשרת מזון מתחילה בצמח (יצרן), ואז חיה שאוכלת אותו, ואז חיה שאוכלת את החיה הזו. לחצו על היצורים המפוזרים לפי הסדר הנכון — ממי שנאכל ראשון ועד הטורף האחרון!',
      example: '🌾 חיטה ← 🐭 עכבר ← 🦉 ינשוף<br>(הינשוף אוכל את העכבר, שאוכל את החיטה)',
    });

    const CHAINS = [
      { level: 1, links: [{n:'עשב', e:'🌱'}, {n:'ארנב', e:'🐰'}, {n:'שועל', e:'🦊'}] },
      { level: 1, links: [{n:'עשב', e:'🌱'}, {n:'פרה', e:'🐄'}, {n:'אדם', e:'🧑'}] },
      { level: 1, links: [{n:'עלים', e:'🍃'}, {n:'זחל', e:'🐛'}, {n:'ציפור', e:'🐦'}] },
      { level: 1, links: [{n:'אצות', e:'🌿'}, {n:'דג קטן', e:'🐟'}, {n:'דג גדול', e:'🐠'}] },
      { level: 2, links: [{n:'חיטה', e:'🌾'}, {n:'עכבר', e:'🐭'}, {n:'ינשוף', e:'🦉'}] },
      { level: 2, links: [{n:'פרח', e:'🌸'}, {n:'דבורה', e:'🐝'}, {n:'ציפור', e:'🐦'}, {n:'נחש', e:'🐍'}] },
      { level: 2, links: [{n:'עשב', e:'🌱'}, {n:'ארבה', e:'🦗'}, {n:'צפרדע', e:'🐸'}, {n:'נחש', e:'🐍'}] },
      { level: 2, links: [{n:'פלנקטון', e:'🦠'}, {n:'דג קטן', e:'🐟'}, {n:'כריש', e:'🦈'}] },
      { level: 3, links: [{n:'עשב', e:'🌱'}, {n:'ארנב', e:'🐰'}, {n:'נחש', e:'🐍'}, {n:'נשר', e:'🦅'}] },
      { level: 3, links: [{n:'עלים', e:'🍃'}, {n:'חרגול', e:'🦗'}, {n:'צפרדע', e:'🐸'}, {n:'חסידה', e:'🦩'}] },
      { level: 3, links: [{n:'עשב ים', e:'🌿'}, {n:'צב ים', e:'🐢'}, {n:'כריש', e:'🦈'}] },
      { level: 3, links: [{n:'תירס', e:'🌽'}, {n:'עכבר', e:'🐭'}, {n:'נחש', e:'🐍'}, {n:'שועל', e:'🦊'}] },
    ];

    function setRounds(n, btn) {
      TOTAL = n;

      document
        .querySelectorAll('#rounds-row .game-btn')
        .forEach(
          b => b.classList.remove('success')
        );

      btn.classList.add('success');
    }

    const show = id => {
      for (
        const s of [
          'start-screen',
          'play-screen',
          'end-screen'
        ]
      ) {
        document.getElementById(s).hidden =
          s !== id;
      }
    };

    let diff, timer;

    async function start(lvl) {
game = await IAKidsGame.init(
  'food-chain'
);

level = lvl;

diff = game.difficulty(
  lvl || 1,
  3
);

IAKidsActivity.configure({
  difficulty:
    lvl,

  questionsCount:
    TOTAL,

  metadata: {
    selected_level:
      lvl,

    random_difficulty:
      lvl === 0
  }
});

      timer =
        game.timer({
          style: 'bomb',

          onTimeout: () => {
            if (!locked) {
              failStep();
            }
          }
        });

      const p =
        await game.loadProgress();

      if (
        p?.rounds &&
        !document.querySelector(
          '#rounds-row .success'
        )
      ) {
        TOTAL = p.rounds;
      }

      await game.saveProgress({
        lastLevel: lvl,
        rounds: TOTAL
      });

      document
        .getElementById('qtotal')
        .textContent = TOTAL;

      show('play-screen');

      next();
    }

    const rnd =
      n => Math.floor(
        Math.random() * n
      );

    function shuffle(arr) {
      const a = arr.slice();

      for (
        let i = a.length - 1;
        i > 0;
        i--
      ) {
        const j = rnd(i + 1);

        [
          a[i],
          a[j]
        ] = [
          a[j],
          a[i]
        ];
      }

      return a;
    }

    async function next() {
      if (qnum >= TOTAL) {
        return end();
      }

      qnum++;

      document
        .getElementById('qnum')
        .textContent = qnum;
IAKidsActivity.questionStarted();
      const lvl =
        level === 0
          ? 1 + rnd(3)
          : diff.level;

      const pool =
        CHAINS.filter(
          c => c.level === lvl
        );

      const q =
        await game.newQuestion(
          () =>
            pool[
              rnd(pool.length)
            ],

          c =>
            c.links
              .map(l => l.n)
              .join('>')
        );

      current = q;
      chainStep = 0;

      document
        .getElementById('question')
        .textContent =
          `סדרו את שרשרת המזון: מי אוכל את מי? (${q.links.length} חוליות)`;

      document
        .getElementById('hint')
        .textContent =
          'לחצו קודם על היצרן (הצמח)';

      renderChain();
      renderChips();

      timer.start(
        IAKidsTimer.secondsFor(
          lvl,
          14
        )
      );
    }

    function renderChain() {
      const chainEl =
        document.getElementById(
          'chain'
        );

      chainEl.innerHTML = '';

      current.links
        .slice(0, chainStep)
        .forEach((l, i) => {
          if (i > 0) {
            const a =
              document.createElement(
                'span'
              );

            a.className = 'arrow';
            a.textContent = '←';

            chainEl.appendChild(a);
          }

          const d =
            document.createElement(
              'div'
            );

          d.className = 'link';

          d.innerHTML =
            `<span class="emoji">${l.e}</span>${l.n}`;

          chainEl.appendChild(d);
        });
    }

    function renderChips() {
      const chipsEl =
        document.getElementById(
          'chips'
        );

      chipsEl.innerHTML = '';

      const scattered =
        shuffle(current.links);

      scattered.forEach(l => {
        const c =
          document.createElement(
            'div'
          );

        c.className = 'chip';

        c.innerHTML =
          `<span class="emoji">${l.e}</span>${l.n}`;

        c.onclick =
          () => tapChip(l, c);

        chipsEl.appendChild(c);
      });
    }

    function tapChip(l, el) {
      if (locked) {
        return;
      }

      const expected =
        current.links[
          chainStep
        ];

      if (l.n === expected.n) {
        locked = true;

        el.classList.add(
          'used'
        );

        IAKidsFX.correct(el);

        chainStep++;

        renderChain();

if (chainStep >= current.links.length) {
  timer.stop();

  IAKidsActivity.correct();

  score += 10;

          diff.right();

          IAKidsCoins.right(el);

          document
            .getElementById('score')
            .textContent = score;

          document
            .getElementById('hint')
            .textContent =
              '✔ מעולה! שרשרת שלמה';

          setTimeout(() => {
            locked = false;
            next();
          }, 900);
        } else {
          document
            .getElementById('hint')
            .textContent =
              `עכשיו לחצו על מי שאוכל את ה${expected.n}`;

          setTimeout(() => {
            locked = false;
          }, 250);
        }
} else {
  IAKidsActivity.wrong();

  IAKidsFX.wrong(el);
        IAKidsCoins.wrong();
        diff.wrong();
      }
    }

    function failStep() {
timer.stop();

IAKidsActivity.skipped();

locked = true;

      diff.wrong();
      IAKidsCoins.wrong();

      document
        .getElementById('hint')
        .textContent =
          '⏰ נגמר הזמן!';

      setTimeout(() => {
        locked = false;
        next();
      }, 900);
    }

    async function end() {
      await game.saveScore(
        score,
        { level }
      );

      const top =
        (
          await game.getHighScores(1)
        )[0];

      document
        .getElementById(
          'final-score'
        )
        .textContent = score;

      document
        .getElementById('best')
        .textContent =
          top?.score ?? score;

      document
        .getElementById(
          'player-line'
        )
        .textContent =
          `${top?.player || 'אורח'} · ${
            new Date().toLocaleString(
              'he-IL',
              {
                dateStyle:'short',
                timeStyle:'short'
              }
            )
          }`;

      document
        .getElementById('stars')
        .textContent =
          '⭐'.repeat(
            Math.max(
              1,
              Math.round(
                score /
                (TOTAL * 10) *
                3
              )
            )
          );

      game.shareButton(
        score,
        document.getElementById(
          'share-slot'
        )
      );

      show('end-screen');

      game.complete(score, {
  maxScore:
    TOTAL * 10,

  metadata: {
    selected_level:
      level,

    total_rounds:
      TOTAL,

    chains_completed:
      score / 10
  }
});
    }
  </script>

</body>
