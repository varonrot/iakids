<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פירמידת חיבור | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>#pyramid{align-items:center;display:flex;flex-direction:column;gap:8px;margin:14px 0}
.prow{display:flex;gap:8px;justify-content:center}.cell{align-items:center;background:var(--card);border:3px dashed var(--muted);border-radius:12px;cursor:pointer;display:flex;font-size:1.3rem;font-weight:800;height:60px;justify-content:center;width:72px}
.cell.given{background:var(--accent-soft);border:3px solid var(--accent);cursor:default}
.cell.locked{background:var(--green);border-color:var(--green);color:#fff;cursor:default}.cell.selected{background:#eff6ff;border:3px solid var(--blue)}#keypad{display:grid;gap:8px;grid-template-columns:repeat(3,1fr);margin:0 auto;max-width:280px}#keypad .game-btn{font-size:1.5rem;margin:0;padding:10px}#confirm-btn{margin-top:10px;max-width:280px;width:100%}
@media (max-width:400px){.cell{font-size:1.1rem;height:54px;width:60px}}
</style>

<style id="iakids-premium-overrides">.game-card{width:min(520px,calc(100vw - 28px))!important}.game-title{font-size:clamp(2.15rem,7vw,3.1rem)!important}#start-screen>div:first-child{filter:drop-shadow(0 12px 18px rgba(0,0,0,.22));font-size:5rem!important;margin:6px 0 8px}#howto{max-width:420px}#rounds-label{color:#fff!important;font-weight:900;margin:8px 0 10px}#pyramid{align-items:center;display:flex;flex-direction:column;gap:9px;margin:10px 0 18px}
.prow{display:flex;gap:9px;justify-content:center}.cell{align-items:center;background:linear-gradient(180deg,#123b73,#0b2b59);border:2px dashed rgba(145,194,255,.55);border-radius:14px;color:#fff;cursor:pointer;display:flex;font-size:1.35rem;font-weight:1000;height:62px;justify-content:center;transition:.15s ease;width:74px}.cell.given{background:linear-gradient(180deg,#1b5e9b,#124679);border:2px solid rgba(116,192,255,.72);cursor:default}.cell.locked{background:linear-gradient(180deg,#37d182,#16ad64);border-color:rgba(97,255,174,.7);color:#fff;cursor:default}.cell.selected{background:linear-gradient(180deg,#1e68aa,#154c80);border:2px solid #69c8ff;box-shadow:0 0 0 3px rgba(67,180,255,.13),0 10px 20px rgba(0,0,0,.18)}
.cell.wrong{background:linear-gradient(180deg,#ef6672,#cc3d4c)!important;border-color:#ff95a1!important}#keypad{display:grid;gap:9px;grid-template-columns:repeat(3,1fr);margin:0 auto;max-width:300px}#keypad .game-btn{font-size:1.45rem;margin:0;min-height:56px;padding:10px}#confirm-btn{display:block;margin:12px auto 0;max-width:300px;width:100%}
@media(max-width:600px){.cell{font-size:1.1rem;height:54px;width:62px}
}
</style>

</head>
<body class="theme-space">

<div class="game-hud">
  <span class="score"><span id="score-label">ניקוד</span>: <span id="score">0</span></span>
  <span><span id="q-label">פירמידה</span> <span id="qnum">1</span>/<span id="qtotal">5</span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div style="font-size:4rem">🔺</div>
    <h1 class="game-title" id="title"></h1>
    <p id="howto"></p>
    <p id="rounds-label"></p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(3,this)">3</button>
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline" onclick="setRounds(8,this)">8</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" data-lvl="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-lvl="2" data-lvl="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-lvl="3" data-lvl="3" onclick="start(3)"></button>
      <button class="game-btn" data-lvl="0" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div id="pyramid"></div>
    <div id="keypad"></div>
    <button class="game-btn success" id="confirm-btn" onclick="confirmPyramid()"></button>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>
<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);

const T_REGULAR = {
  title:{he:'פירמידת חיבור',en:'Addition Pyramid'},
  howto:{he:'כל לבנה = סכום שתי הלבנים שמתחתיה. מלאו את החסרות!',en:'Each brick = the sum of the two below it. Fill in the blanks!'},
  rounds:{he:'כמה פירמידות?',en:'How many pyramids?'},
  confirm:{he:'בדוק ✔',en:'Check ✔'},
  pyramid:{he:'פירמידה',en:'Pyramid'}
};

const T_NIQQUD = {
  title:{he:'פִּירָמִידַת חִבּוּר',en:'Addition Pyramid'},
  howto:{he:'כָּל לְבֵנָה = סְכוּם שְׁתֵּי הַלְּבֵנִים שֶׁמִּתַּחְתֶּיהָ. מַלְּאוּ אֶת הַחֲסֵרוֹת!',en:'Each brick = the sum of the two below it. Fill in the blanks!'},
  rounds:{he:'כַּמָּה פִּירָמִידוֹת?',en:'How many pyramids?'},
  confirm:{he:'בִּדְקוּ ✔',en:'Check ✔'},
  pyramid:{he:'פִּירָמִידָה',en:'Pyramid'}
};

let CHILD_AGE = null;
let USE_NIQQUD = false;
let T = T_REGULAR;

let game, diff, level = 1, TOTAL = 5, score = 0, qnum = 0, mistakes = 0;
let cur = null, selected = null, resolving = false, ending = false;
let totalCorrectCells = 0, totalBlankCells = 0;

async function loadKidContext(){
  try{
    const kidId = localStorage.getItem('active_kid_id');
    if(!kidId) return;

    const client = await IAKidsActivity._getClient();
    const {data,error} = await client
      .from('kids_profiles')
      .select('id, age')
      .eq('id',kidId)
      .maybeSingle();

    if(error || !data){
      console.warn('[addition-pyramid] Kid profile was not loaded', error);
      return;
    }

    CHILD_AGE = Number(data.age);
    USE_NIQQUD = CHILD_AGE === 1 || CHILD_AGE === 2;
  }catch(error){
    console.warn('[addition-pyramid] loadKidContext error', error);
  }
}

function applyLanguage(){
  T = USE_NIQQUD ? T_NIQQUD : T_REGULAR;

  $('title').textContent = IAKidsLang.t(T.title);
  $('howto').textContent = IAKidsLang.t(T.howto);
  $('rounds-label').textContent = IAKidsLang.t(T.rounds);
  $('confirm-btn').textContent = IAKidsLang.t(T.confirm);
  $('q-label').textContent = IAKidsLang.t(T.pyramid);
  $('score-label').textContent = IAKidsLang.ui('score');
  $('best-label').textContent = IAKidsLang.ui('your_best');
  $('again-btn').textContent = IAKidsLang.ui('play_again');

  ['level_easy','level_medium','level_hard','level_random'].forEach((key,index)=>{
    document.querySelectorAll('#level-row .game-btn')[index].textContent = IAKidsLang.ui(key);
  });
}

IAKidsCoins.mount();
IAKidsHelp.mount({
  slug:'addition-pyramid',
  how:'כל לבנה בפירמידה היא סכום שתי הלבנים שמתחתיה. לוחצים על לבנה ריקה, מקלידים את המספר החסר ולוחצים "בדוק".',
  example:'<span dir="ltr"><b>2 + 3 = 5</b></span> ← הלבנה מעל היא הסכום'
});

function setRounds(n,btn){
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b=>b.classList.remove('success'));
  btn?.classList.add('success');
}

const ready = (async()=>{
  await loadKidContext();
  applyLanguage();

  game = await IAKidsGame.init('addition-pyramid');

  const p = await game.loadProgress();

  if(p?.rounds){
    const btn = document.querySelector(`#rounds-row [onclick*="(${p.rounds},"]`) || $('rounds-row').children[1];
    setRounds(p.rounds,btn);
  }

  if(p?.lastLevel != null){
    document.querySelector(`#level-row [data-lvl="${p.lastLevel}"]`)?.classList.add('success');
  }
})();

const show = id=>{
  ['start-screen','play-screen','end-screen'].forEach(s=>$(s).hidden=s!==id);
};

async function start(lvl){
  await ready;

  level = lvl;
  diff = game.difficulty(lvl || 1,3);

  score = 0;
  qnum = 0;
  mistakes = 0;
  cur = null;
  selected = null;
  resolving = false;
  ending = false;
  totalCorrectCells = 0;
  totalBlankCells = 0;

  $('score').textContent = '0';
  $('qnum').textContent = '1';
  $('qtotal').textContent = TOTAL;

  IAKidsActivity.configure({
    difficulty:lvl || 1,
    questionsCount:TOTAL,
    metadata:{
      game_mode:'addition-pyramid',
      selected_level:lvl,
      random_difficulty:lvl === 0,
      child_age:CHILD_AGE,
      uses_niqqud:USE_NIQQUD,
      timer_enabled:false
    }
  });

  await game.saveProgress({lastLevel:lvl,rounds:TOTAL});

  buildKeypad();
  show('play-screen');
  await next();
}

function makePyramid(lvl){
  if(lvl === 0) lvl = 1 + rnd(3);

  const S = lvl === 1 ? 3 : 4;
  const maxBase = lvl === 1 ? 4 : lvl === 2 ? 9 : 12;

  let rows;

  for(let tries=0;tries<60;tries++){
    const base = Array.from({length:S},()=>1+rnd(maxBase));
    rows = [base];

    for(let r=1;r<S;r++){
      rows.push(
        rows[r-1].slice(1).map((v,i)=>v+rows[r-1][i])
      );
    }

    if(lvl !== 1 || rows[S-1][0] <= 10) break;
  }

  const given = new Set(rows[0].map((_,i)=>`0,${i}`));

  if(lvl === 3){
    const j = rnd(S);
    given.delete(`0,${j}`);
    given.add(`1,${j === 0 ? 0 : j-1}`);
  }

  return {
    rows,
    given:[...given],
    key:`${lvl}:${rows[0].join(',')}:${[...given].join(';')}`
  };
}

async function next(){
  if(ending) return;

  if(qnum >= TOTAL){
    await end();
    return;
  }

  qnum++;
  $('qnum').textContent = qnum;

  const lvl = level === 0 ? 1 + rnd(3) : diff.level;

  cur = await game.newQuestion(
    ()=>makePyramid(lvl),
    p=>p.key
  );

  IAKidsActivity.questionStarted();

  const given = new Set(cur.given);
  const S = cur.rows.length;
  const pyr = $('pyramid');

  pyr.innerHTML = '';
  selected = null;

  let blanksThisRound = 0;

  for(let r=S-1;r>=0;r--){
    const rowEl = document.createElement('div');
    rowEl.className = 'prow';
    rowEl.dir = 'ltr';

    for(let i=0;i<cur.rows[r].length;i++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dir = 'ltr';
      cell.dataset.expected = cur.rows[r][i];

      if(given.has(`${r},${i}`)){
        cell.classList.add('given');
        cell.textContent = cur.rows[r][i];
      }else{
        blanksThisRound++;
        cell.addEventListener('click',()=>select(cell));
      }

      rowEl.appendChild(cell);
    }

    pyr.appendChild(rowEl);
  }

  totalBlankCells += blanksThisRound;
  resolving = false;
  selectNextBlank();
}

const blanks = ()=>[
  ...document.querySelectorAll('#pyramid .cell:not(.given):not(.locked)')
];

function select(cell){
  if(cell.classList.contains('given') || cell.classList.contains('locked')) return;

  selected?.classList.remove('selected');
  selected = cell;
  cell.classList.add('selected');
}

function selectNextBlank(){
  selected?.classList.remove('selected');
  selected = null;

  const empty = blanks().find(c=>!c.textContent) || blanks()[0];

  if(empty) select(empty);
}

function buildKeypad(){
  const pad = $('keypad');

  if(pad.childElementCount) return;

  for(const k of ['1','2','3','4','5','6','7','8','9','⌫','0','✔']){
    const b = document.createElement('button');
    b.className = 'game-btn' + (k === '⌫' ? ' danger' : k === '✔' ? ' success' : ' outline');
    b.textContent = k;
    b.addEventListener('click',()=>key(k));
    pad.appendChild(b);
  }
}

function key(k){
  if(resolving || ending) return;

  if(k === '✔'){
    confirmPyramid();
    return;
  }

  if(!selected) return;

  if(k === '⌫'){
    selected.textContent = selected.textContent.slice(0,-1);
  }else if(selected.textContent.length < 3){
    selected.textContent += k;
  }
}

document.addEventListener('keydown',e=>{
  if($('play-screen').hidden || resolving || ending) return;

  if(/^[0-9]$/.test(e.key)){
    key(e.key);
  }else if(e.key === 'Backspace'){
    key('⌫');
    e.preventDefault();
  }else if(e.key === 'Enter'){
    confirmPyramid();
  }
});

async function confirmPyramid(){
  if(resolving || ending) return;

  const filled = blanks().filter(c=>c.textContent !== '');
  if(!filled.length) return;

  const btn = $('confirm-btn');

  let newlyLocked = 0;
  let anyWrong = false;

  for(const cell of filled){
    if(+cell.textContent === +cell.dataset.expected){
      cell.classList.remove('selected');
      cell.classList.add('locked');
      newlyLocked++;
      totalCorrectCells++;
      score += 10;
    }else{
      anyWrong = true;
      cell.classList.add('wrong');

      setTimeout(()=>{
        cell.classList.remove('wrong');
        cell.textContent = '';
      },600);
    }
  }

  $('score').textContent = score;

  if(anyWrong){
    mistakes++;
    diff.wrong();

    IAKidsActivity.wrong();

    IAKidsFX.wrong(btn);
    await IAKidsCoins.wrong();
  }else if(newlyLocked > 0){
    IAKidsFX.correct(btn);
  }

  if(blanks().length === 0){
    resolving = true;
    diff.right();

    IAKidsActivity.correct();

    await IAKidsCoins.right(btn);

    setTimeout(async()=>{
      await next();
    },850);
  }else{
    setTimeout(
      selectNextBlank,
      anyWrong ? 650 : 0
    );
  }
}

async function end(){
  if(ending) return;

  ending = true;
  resolving = true;

  const maxScore = totalBlankCells * 10;

  const accuracy =
    totalBlankCells
      ? totalCorrectCells / Math.max(1,totalCorrectCells + mistakes)
      : 0;

  await game.saveScore(score,{
    level,
    mistakes,
    completed_pyramids:TOTAL,
    correct_cells:totalCorrectCells,
    total_blank_cells:totalBlankCells
  });

  const top = (await game.getHighScores(1))[0];

  $('final-score').textContent = score;
  $('best').textContent = top?.score ?? score;

  $('player-line').textContent =
    `${top?.player || IAKidsLang.ui('guest')} · ${
      new Date().toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'})
    }`;

  $('stars').textContent =
    '⭐'.repeat(
      mistakes === 0
        ? 3
        : mistakes <= Math.ceil(TOTAL/2)
          ? 2
          : 1
    );

  await game.complete(
    score,
    {
      maxScore,
      performanceScore:Math.round(accuracy*100),
      metadata:{
        game_mode:'addition-pyramid',
        selected_level:level,
        random_difficulty:level === 0,
        total_rounds:TOTAL,
        completed_pyramids:TOTAL,
        mistakes,
        correct_cells:totalCorrectCells,
        total_blank_cells:totalBlankCells,
        child_age:CHILD_AGE,
        uses_niqqud:USE_NIQQUD,
        timer_enabled:false
      }
    }
  );

  game.shareButton(score,$('share-slot'));
  show('end-screen');
}
</script>
</body>
</html>
