<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ציר המספרים — קפיצות הצפרדע | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>
  #axis-wrap { width: 100%; overflow: hidden; }
  #axis { width: 100%; height: auto; display: block; }
  #axis text { font-family: inherit; }
  .tick-label { font-size: 13px; font-weight: 700; fill: var(--muted); }
  .tick-label.start { fill: var(--accent); font-size: 15px; }
  .hop-row { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; }
  .hop-row .game-btn { flex: 1; font-size: 1.15rem; }
  .exercise { font-size: 2rem; font-weight: 800; margin: 10px 0 4px; }
  .level-picked { outline: 4px solid var(--yellow); }
</style>
</head>
<body>

<div class="game-hud">
  <span class="score"><span data-ui="score">ניקוד</span>: <span id="score">0</span></span>
  <span><span data-ui="question">שאלה</span> <span dir="ltr"><span id="qnum">1</span>/<span id="qtotal">10</span></span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div style="font-size:4rem">🐸</div>
    <h1 class="game-title" id="t-title">ציר המספרים</h1>
    <p id="t-desc">הקפץ את הצפרדע קדימה ואחורה עד לתוצאת התרגיל!</p>
    <p id="t-rounds">כמה שאלות?</p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" data-r="5" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline" data-r="10" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" data-r="15" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-l="1" data-ui="level_easy" onclick="start(1)">🙂 קל</button>
      <button class="game-btn secondary" data-l="2" data-ui="level_medium" onclick="start(2)">😎 בינוני</button>
      <button class="game-btn secondary" data-l="3" data-ui="level_hard" onclick="start(3)">🤓 קשה</button>
      <button class="game-btn" data-l="0" data-ui="level_random" onclick="start(0)">🎲 אקראי</button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div class="exercise"><span dir="ltr" id="exercise"></span></div>
    <div id="axis-wrap">
      <svg id="axis" viewBox="0 0 640 130" aria-hidden="true"></svg>
    </div>
    <div class="hop-row" dir="ltr">
      <button class="game-btn secondary" id="btn-back" onclick="hop(-1)">⬅ אחורה</button>
      <button class="game-btn secondary" id="btn-fwd" onclick="hop(1)">קדימה ➡</button>
    </div>
    <button class="game-btn success" id="btn-check" style="width:100%" onclick="check()">בדוק ✓</button>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span data-ui="your_best">השיא שלך</span>: <b id="best"></b></p>
    <button class="game-btn" data-ui="play_again" onclick="location.reload()">שחק שוב 🔁</button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>
<script>
const SLUG = 'number-line-jumps';
let game, diff, score = 0, qnum = 0, level = 1, TOTAL = 10;
let cur = null, pos = 0, locked = false;
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'number-line-jumps',
  how: 'עוזרים לצפרדע לקפוץ על ציר המספרים: לוחצים "קדימה" או "אחורה" לפי התרגיל, ובסוף "בדוק".',
  example: 'מתחילים ב-5, התרגיל <span dir="ltr"><b>5 + 3</b></span> ← קופצים 3 קדימה ונוחתים על <b>8</b>',
});

// UI strings (he/en/es/de/pt) — shared keys via data-ui, game-specific below
const T = {
  title: { he: 'ציר המספרים', en: 'Number Line Jumps', es: 'Saltos en la recta', de: 'Zahlenstrahl-Sprünge', pt: 'Saltos na reta' },
  desc:  { he: 'הקפץ את הצפרדע קדימה ואחורה עד לתוצאת התרגיל!', en: 'Hop the frog forward and back to the answer!', es: '¡Salta con la rana hasta el resultado!', de: 'Hüpfe mit dem Frosch zum Ergebnis!', pt: 'Pule com o sapo até o resultado!' },
  rounds:{ he: 'כמה שאלות?', en: 'How many questions?', es: '¿Cuántas preguntas?', de: 'Wie viele Fragen?', pt: 'Quantas perguntas?' },
  back:  { he: '⬅ אחורה', en: '⬅ Back', es: '⬅ Atrás', de: '⬅ Zurück', pt: '⬅ Voltar' },
  fwd:   { he: 'קדימה ➡', en: 'Forward ➡', es: 'Adelante ➡', de: 'Vorwärts ➡', pt: 'Avançar ➡' },
  check: { he: 'בדוק ✓', en: 'Check ✓', es: 'Comprobar ✓', de: 'Prüfen ✓', pt: 'Verificar ✓' },
};
document.querySelectorAll('[data-ui]').forEach(el => {
  const k = el.dataset.ui;
  el.textContent = IAKidsLang.ui(k);
});
$('t-title').textContent = IAKidsLang.t(T.title);
document.title = IAKidsLang.t(T.title) + ' | iakids';
$('t-desc').textContent = IAKidsLang.t(T.desc);
$('t-rounds').textContent = IAKidsLang.t(T.rounds);
$('btn-back').textContent = IAKidsLang.t(T.back);
$('btn-fwd').textContent = IAKidsLang.t(T.fwd);
$('btn-check').textContent = IAKidsLang.t(T.check);

function setRounds(n, btn) {
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.remove('success'));
  btn.classList.add('success');
}

// preselect last rounds + level from saved progress
(async () => {
  game = await IAKidsGame.init(SLUG);
  const p = await game.loadProgress();
  if (p?.rounds) setRounds(p.rounds, document.querySelector(`#rounds-row [data-r="${p.rounds}"]`) || $('rounds-row').children[1]);
  if (p?.lastLevel != null) document.querySelector(`#level-row [data-l="${p.lastLevel}"]`)?.classList.add('level-picked');
})();

const show = id => {
  for (const s of ['start-screen', 'play-screen', 'end-screen']) $(s).hidden = s !== id;
};

async function start(lvl) {
  game = game || await IAKidsGame.init(SLUG);
  level = lvl;
  diff = game.difficulty(lvl || 1, 3);
  if (!document.querySelector('#rounds-row .success')) setRounds(TOTAL, $('rounds-row').children[1]);
  await game.saveProgress({ lastLevel: lvl, rounds: TOTAL });
  $('qtotal').textContent = TOTAL;
  show('play-screen');
  next();
}

/* levels: 1 = 0..20 forward only (X+a) · 2 = forward+back (X+a−b, stays 0..20) · 3 = negatives (−10..10) */
function makeQuestion(lvl) {
  if (lvl === 1) {
    const x = rnd(14), a = 1 + rnd(7);
    return { text: `${x} + ${a}`, x, ans: x + a, min: 0, max: 20 };
  }
  if (lvl === 2) {
    const x = 3 + rnd(10), a = 1 + rnd(7), b = 1 + rnd(Math.min(7, x + a));
    return { text: `${x} + ${a} − ${b}`, x, ans: x + a - b, min: 0, max: 20 };
  }
  // level 3 — negatives; retry until every stop stays on the line
  while (true) {
    const x = -6 + rnd(13), s1 = rnd(2) ? 1 : -1, s2 = rnd(2) ? 1 : -1;
    const a = 1 + rnd(6), b = 1 + rnd(6);
    const mid = x + s1 * a, ans = mid + s2 * b;
    if (mid < -10 || mid > 10 || ans < -10 || ans > 10) continue;
    return { text: `${x} ${s1 > 0 ? '+' : '−'} ${a} ${s2 > 0 ? '+' : '−'} ${b}`, x, ans, min: -10, max: 10 };
  }
}

async function next() {
  if (qnum >= TOTAL) return end();
  qnum++;
  locked = false;
  $('qnum').textContent = qnum;
  const lvl = level === 0 ? 1 + rnd(3) : diff.level;
  cur = await game.newQuestion(() => makeQuestion(lvl), q => q.text);
  pos = cur.x;
  $('exercise').textContent = cur.text + ' = ?';
  drawAxis();
}

/* ---- SVG number line ---- */
const PAD = 28, W = 640, LINE_Y = 84;
let step = 1, frogEl = null, frogX = 0;
const xOf = n => PAD + (n - cur.min) * step;

function drawAxis() {
  step = (W - 2 * PAD) / (cur.max - cur.min);
  let s = `<line x1="${PAD - 12}" y1="${LINE_Y}" x2="${W - PAD + 12}" y2="${LINE_Y}" stroke="#1f2937" stroke-width="3"/>`;
  s += `<polygon points="${W - PAD + 12},${LINE_Y} ${W - PAD + 2},${LINE_Y - 6} ${W - PAD + 2},${LINE_Y + 6}" fill="#1f2937"/>`;
  for (let n = cur.min; n <= cur.max; n++) {
    const x = xOf(n);
    s += `<line x1="${x}" y1="${LINE_Y - 6}" x2="${x}" y2="${LINE_Y + 6}" stroke="#1f2937" stroke-width="2"/>`;
    s += `<text x="${x}" y="112" text-anchor="middle" class="tick-label${n === cur.x ? ' start' : ''}">${n}</text>`;
  }
  s += `<text id="ans-flash" text-anchor="middle" font-size="22" font-weight="800" y="30" visibility="hidden"></text>`;
  s += `<text id="frog" text-anchor="middle" font-size="30" x="${xOf(cur.x)}" y="${LINE_Y - 8}">🐸</text>`;
  $('axis').innerHTML = s;
  frogEl = $('frog');
  frogX = xOf(cur.x);
}

let anim = null;
function hop(dir) {
  if (locked) return;
  const to = pos + dir;
  if (to < cur.min || to > cur.max) { IAKidsFX._beep([[160, 0, 0.12]]); return; }
  pos = to;
  const from = frogX, target = xOf(pos), t0 = performance.now(), DUR = 170;
  cancelAnimationFrame(anim);
  const tick = now => {
    const t = Math.min(1, (now - t0) / DUR);
    frogX = from + (target - from) * t;
    frogEl.setAttribute('x', frogX);
    frogEl.setAttribute('y', LINE_Y - 8 - 26 * Math.sin(Math.PI * t));
    if (t < 1) anim = requestAnimationFrame(tick);
  };
  anim = requestAnimationFrame(tick);
  IAKidsFX._beep([[dir > 0 ? 620 : 440, 0, 0.06]]);
}

function check() {
  if (locked) return;
  locked = true;
  const btn = $('btn-check');
  if (pos === cur.ans) {
    score += 10;
    diff.right();
    IAKidsFX.correct(btn);
    IAKidsCoins.right(btn);
  } else {
    diff.wrong();
    IAKidsFX.wrong(btn);
    IAKidsCoins.wrong();
    const f = $('ans-flash'); // show where the frog should have landed
    f.setAttribute('x', xOf(cur.ans));
    f.setAttribute('fill', 'var(--red)');
    f.textContent = '⬇ ' + cur.ans;
    f.setAttribute('visibility', 'visible');
  }
  $('score').textContent = score;
  setTimeout(next, 1100);
}

async function end() {
  await game.saveScore(score, { level });
  const top = (await game.getHighScores(1))[0];
  $('final-score').textContent = score;
  $('best').textContent = top?.score ?? score;
  $('player-line').textContent =
    `${top?.player || IAKidsLang.ui('guest')} · ${new Date().toLocaleString(IAKidsLang.code === 'he' ? 'he-IL' : IAKidsLang.code, { dateStyle: 'short', timeStyle: 'short' })}`;
  $('stars').textContent = '⭐'.repeat(Math.max(1, Math.round(score / (TOTAL * 10) * 3)));
  game.shareButton(score, $('share-slot'));
  show('end-screen');
  game.complete(score);
}
</script>
</body>
</html>
