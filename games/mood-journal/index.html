<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יומן מצב רוח ולמידה | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>
  .mood-grid, .diff-grid { display: grid; gap: 10px; margin: 10px 0; }
  .mood-grid { grid-template-columns: repeat(5, 1fr); }
  .diff-grid { grid-template-columns: repeat(3, 1fr); }
  .pick-btn { font-size: 1.8rem; padding: 10px 4px; border-radius: 16px; border: 3px solid #e5e7eb; background: #fff; cursor: pointer; }
  .pick-btn.small { font-size: 1.1rem; }
  .pick-btn.selected { border-color: var(--accent); background: var(--accent-soft); }
  textarea#note { width: 100%; min-height: 60px; font: inherit; border-radius: 14px; border: 2px solid #e5e7eb; padding: 10px; margin-top: 8px; box-sizing: border-box; }
  .week-strip { display: flex; justify-content: space-between; gap: 6px; margin-top: 20px; }
  .day-box { flex: 1; text-align: center; }
  .day-box .wd { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
  .day-box .bar { height: 46px; border-radius: 10px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; font-size: 1.1rem; background: #e5e7eb; }
  .already { color: var(--green); font-weight: 700; margin-top: 6px; }
</style>
</head>
<body>

<div class="game-card" id="card">
  <div style="font-size:3.2rem">😊</div>
  <h1 class="game-title">יומן מצב רוח ולמידה</h1>
  <p id="dateLine"></p>

  <p><b>איך אני מרגיש/ה היום?</b></p>
  <div class="mood-grid" id="moodGrid">
    <button class="pick-btn" data-mood="😄" onclick="pickMood(this)">😄</button>
    <button class="pick-btn" data-mood="🙂" onclick="pickMood(this)">🙂</button>
    <button class="pick-btn" data-mood="😐" onclick="pickMood(this)">😐</button>
    <button class="pick-btn" data-mood="😕" onclick="pickMood(this)">😕</button>
    <button class="pick-btn" data-mood="😢" onclick="pickMood(this)">😢</button>
  </div>

  <p><b>איך הייתה הלמידה היום?</b></p>
  <div class="diff-grid" id="diffGrid">
    <button class="pick-btn small" data-diff="קל" onclick="pickDiff(this)">🙂 קל</button>
    <button class="pick-btn small" data-diff="בינוני" onclick="pickDiff(this)">😎 בינוני</button>
    <button class="pick-btn small" data-diff="קשה" onclick="pickDiff(this)">🤓 קשה</button>
  </div>

  <textarea id="note" placeholder="רוצים לספר עוד משהו? (לא חובה)"></textarea>

  <button class="game-btn" onclick="saveEntry()">💾 שמור יומן להיום</button>
  <p class="already" id="alreadyMsg" hidden>✓ כבר שמרת יומן היום — אפשר לעדכן בכל רגע</p>

  <div class="week-strip" id="weekStrip"></div>
</div>

<script src="../game-sdk.js"></script>
<script>
let game, entries = {}, selectedMood = null, selectedDiff = null, wasLoggedToday = false;

const MOOD_COLOR = { '😄': 'var(--green)', '🙂': '#86efac', '😐': 'var(--yellow)', '😕': '#fb923c', '😢': 'var(--red)' };

IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'mood-journal',
  how: 'כל יום בוחרים אימוג׳י שמתאר איך מרגישים, ומסמנים אם הלמידה הייתה קלה, בינונית או קשה. אפשר גם לכתוב משפט קצר. שומרים פעם ביום ומקבלים מטבעות 🪙!',
  example: 'בחרתי 😄 ו-"קל", כתבתי "היה כיף היום!" ולחצתי שמור — קיבלתי מטבעות ונוסף פס צבעוני ליומן השבועי.',
});

function pickMood(btn) {
  document.querySelectorAll('#moodGrid .pick-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedMood = btn.dataset.mood;
}
function pickDiff(btn) {
  document.querySelectorAll('#diffGrid .pick-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedDiff = btn.dataset.diff;
}

function todayKey() { return new Date().toDateString(); }

function renderWeek() {
  const strip = document.getElementById('weekStrip');
  strip.innerHTML = '';
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = d.toDateString();
    const entry = entries[key];
    const box = document.createElement('div');
    box.className = 'day-box';
    const wd = new Intl.DateTimeFormat('he-IL', { weekday: 'short' }).format(d);
    box.innerHTML = `<div class="wd">${wd}</div>
      <div class="bar" style="background:${entry ? MOOD_COLOR[entry.mood] || '#e5e7eb' : '#e5e7eb'}">${entry ? entry.mood : ''}</div>`;
    strip.appendChild(box);
  }
}

async function init() {
  game = await IAKidsGame.init('mood-journal');
  const p = await game.loadProgress();
  entries = p?.entries || {};
  document.getElementById('dateLine').textContent =
    'היום: ' + new Date().toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });

  const today = entries[todayKey()];
  wasLoggedToday = !!today;
  if (today) {
    document.querySelector(`#moodGrid [data-mood="${today.mood}"]`)?.classList.add('selected');
    document.querySelector(`#diffGrid [data-diff="${today.difficulty}"]`)?.classList.add('selected');
    document.getElementById('note').value = today.note || '';
    selectedMood = today.mood;
    selectedDiff = today.difficulty;
    document.getElementById('alreadyMsg').hidden = false;
  }
  renderWeek();
}

async function saveEntry() {
  if (!selectedMood || !selectedDiff) { alert('בחרו אימוג׳י ורמת קושי לפני השמירה 🙂'); return; }
  const key = todayKey();
  const isFirstToday = !entries[key];
  entries[key] = { mood: selectedMood, difficulty: selectedDiff, note: document.getElementById('note').value.trim(), ts: Date.now() };
  await game.saveProgress({ entries });
  renderWeek();
  document.getElementById('alreadyMsg').hidden = false;

  if (isFirstToday) {
    const daysLogged = Object.keys(entries).length;
    await game.saveScore(daysLogged, { mood: selectedMood, difficulty: selectedDiff });
    game.complete(daysLogged); // +25 daily bonus, confetti, postMessage
  } else {
    IAKidsFX.correct();
  }
}

init();
</script>
</body>
</html>
