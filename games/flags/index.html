<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דגלי מדינות | iakids</title>

<link rel="stylesheet" href="../game-style.css">

<style>
:root{
  --space-bg:#06142d;
  --space-panel:#0b2857;
  --space-panel-dark:#071d43;
  --space-line:rgba(119,176,255,.27);
  --space-text:#f7f9ff;
  --space-muted:#b8c7e3;
  --space-blue:#1693f1;
  --space-green:#1ea96b;
  --space-purple:#7653ff;
  --space-gold:#ffd15c;
}

html,body{min-height:100%}

body{
  margin:0 !important;
  min-height:100vh !important;
  padding:86px 18px 28px !important;
  overflow-x:hidden;
  color:var(--space-text) !important;
  font-family:"Heebo","Segoe UI",Arial,sans-serif !important;
  background:
    radial-gradient(circle at 12% 16%,rgba(26,139,255,.23),transparent 34%),
    radial-gradient(circle at 88% 10%,rgba(112,72,255,.25),transparent 35%),
    radial-gradient(circle at 50% 100%,rgba(12,184,203,.16),transparent 34%),
    linear-gradient(145deg,#050f25,#0a2148 52%,#07152e) !important;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.75) 0 1px,transparent 1.4px);
  background-size:56px 56px;
  opacity:.08;
}

*{box-sizing:border-box}

.game-card{
  width:min(520px,calc(100vw - 28px)) !important;
  min-height:690px;
  margin:0 auto !important;
  padding:0 !important;
  overflow:hidden;
  border:1px solid var(--space-line) !important;
  border-radius:28px !important;
  color:var(--space-text) !important;
  background:
    linear-gradient(180deg,rgba(17,58,111,.97),rgba(5,25,61,.98)) !important;
  box-shadow:
    0 28px 75px rgba(0,8,28,.48),
    inset 0 1px rgba(255,255,255,.08) !important;
}

.game-hud{
  position:fixed !important;
  top:0 !important;
  left:0 !important;
  right:0 !important;
  z-index:20;
  min-height:72px;
  padding:16px 24px !important;
  display:flex !important;
  align-items:center;
  justify-content:center !important;
  gap:42px;
  color:#fff !important;
  background:rgba(5,18,46,.88) !important;
  border-bottom:1px solid rgba(126,180,255,.18);
  backdrop-filter:blur(14px);
}

.game-hud .score{color:var(--space-gold) !important}

#start-screen,#play-screen,#end-screen{
  min-height:688px;
  padding:34px 30px 30px;
}

#start-screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.hero-icon{
  margin:6px 0 8px;
  font-size:5rem;
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.22));
}

.game-title{
  margin:0;
  font-size:clamp(2.15rem,7vw,3.15rem) !important;
  line-height:1.05;
  color:#fff !important;
  text-shadow:0 4px 12px rgba(0,0,0,.22);
}

#howto{
  max-width:390px;
  margin:14px auto 20px;
  color:var(--space-muted) !important;
  font-weight:600;
  line-height:1.65;
}

.section-label{
  margin:8px 0 10px;
  color:#fff;
  font-weight:900;
}

.answer-grid{
  width:100%;
  gap:12px !important;
}

.game-btn{
  min-height:54px;
  border-radius:15px !important;
  border:1px solid rgba(118,176,255,.34) !important;
  color:#fff !important;
  font-weight:900 !important;
  background:linear-gradient(180deg,#1c91db,#0877bd) !important;
  box-shadow:inset 0 1px rgba(255,255,255,.18),0 9px 20px rgba(0,0,0,.16) !important;
}

.game-btn:hover{transform:translateY(-2px)}
.game-btn.outline{background:linear-gradient(180deg,rgba(52,81,139,.72),rgba(21,49,99,.75)) !important}
.game-btn.success{background:linear-gradient(180deg,#37d182,#16ad64) !important;border-color:rgba(97,255,174,.6) !important}
#level-row{margin-top:16px}
#level-row .game-btn[data-lvl="0"]{background:linear-gradient(180deg,#8054ff,#6035dc) !important}

/* PLAY */
#play-screen{position:relative}

.flag-wrap{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:250px;
  margin:6px 0 18px;
  padding:22px;
  border-radius:24px;
  background:
    radial-gradient(circle at 50% 20%,rgba(77,169,255,.16),transparent 52%),
    rgba(4,22,55,.48);
  border:1px solid rgba(116,177,255,.18);
}

.flag-wrap svg{
  width:260px;
  max-width:84vw;
  height:auto;
  border-radius:10px;
  box-shadow:
    0 18px 36px rgba(0,0,0,.28),
    0 0 0 1px rgba(255,255,255,.15);
}

#choices{
  grid-template-columns:1fr 1fr;
}

#choices .game-btn{
  min-height:64px;
  font-size:1.08rem !important;
  line-height:1.25;
}

#choices .game-btn:disabled{
  opacity:.74;
  cursor:default;
}

/* END */
#end-screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.stars{
  min-height:78px;
  font-size:3.7rem !important;
  letter-spacing:4px;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.24));
}

.big-score{
  margin:8px 0;
  color:#fff !important;
  font-size:4rem !important;
  font-weight:1000;
}

#player-line,#end-screen p{color:#d7e3f7 !important}
#share-slot{margin-top:8px}
[hidden]{display:none !important}

@media(max-width:600px){
  body{padding:74px 10px 18px !important}

  .game-card{
    min-height:calc(100vh - 94px);
    border-radius:22px !important;
  }

  #start-screen,#play-screen,#end-screen{
    min-height:calc(100vh - 96px);
    padding:26px 16px 24px;
  }

  .game-hud{
    min-height:62px;
    padding:12px 14px !important;
    gap:24px;
  }

  .flag-wrap{
    min-height:210px;
    padding:16px;
  }

  .flag-wrap svg{width:230px}

  #choices{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="game-hud">
  <span class="score">
    <span id="score-label">ניקוד</span>:
    <span id="score">0</span>
  </span>

  <span>
    <span id="q-label">שאלה</span>
    <span id="qnum">1</span>/<span id="qtotal">10</span>
  </span>
</div>

<div class="game-card" id="card">

  <div id="start-screen">
    <div class="hero-icon">🚩🌍</div>

    <h1 class="game-title" id="title"></h1>

    <p id="howto"></p>

    <p class="section-label" id="rounds-label"></p>

    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline success" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>

    <p class="section-label" id="level-label"></p>

    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)"></button>
      <button class="game-btn" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div class="flag-wrap" id="flag-wrap"></div>
    <div class="answer-grid" id="choices"></div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>

<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => {
  const copy = [...a];
  for(let i=copy.length-1;i>0;i--){
    const j = rnd(i+1);
    [copy[i],copy[j]] = [copy[j],copy[i]];
  }
  return copy;
};

const stripesH = colors =>
  colors.map((c,i)=>
    `<rect y="${(i*40/colors.length).toFixed(2)}" width="60" height="${(40/colors.length+.4).toFixed(2)}" fill="${c}"/>`
  ).join('');

const stripesV = colors =>
  colors.map((c,i)=>
    `<rect x="${(i*60/colors.length).toFixed(2)}" width="${(60/colors.length+.4).toFixed(2)}" height="40" fill="${c}"/>`
  ).join('');

const star = (cx,cy,rO,rI,n=5,rot=-90)=>{
  const points=[];
  for(let i=0;i<n*2;i++){
    const r=i%2===0?rO:rI;
    const a=(rot+i*180/n)*Math.PI/180;
    points.push(`${(cx+r*Math.cos(a)).toFixed(2)},${(cy+r*Math.sin(a)).toFixed(2)}`);
  }
  return points.join(' ');
};

const FLAGS_REGULAR = {
  IL:{name:{he:'ישראל',en:'Israel'},tier:1,svg:`
    <rect width="60" height="40" fill="#fff"/>
    <rect y="5" width="60" height="4" fill="#0038b8"/>
    <rect y="31" width="60" height="4" fill="#0038b8"/>
    <polygon points="30,13 36,24 24,24" fill="none" stroke="#0038b8" stroke-width="1.4"/>
    <polygon points="30,27 36,16 24,16" fill="none" stroke="#0038b8" stroke-width="1.4"/>`},

  US:{name:{he:'ארה"ב',en:'USA'},tier:1,svg:`
    <rect width="60" height="40" fill="#fff"/>
    ${Array.from({length:7},(_,i)=>`<rect y="${(i*2*40/13).toFixed(2)}" width="60" height="${(40/13+.3).toFixed(2)}" fill="#B22234"/>`).join('')}
    <rect width="26" height="22" fill="#3C3B6E"/>
    ${[[5,4],[10,4],[15,4],[20,4],[7,8],[12,8],[17,8],[22,8],[5,12],[10,12],[15,12],[20,12],[7,16],[12,16],[17,16],[22,16]]
      .map(([x,y])=>`<circle cx="${x}" cy="${y}" r="0.9" fill="#fff"/>`).join('')}`},

  FR:{name:{he:'צרפת',en:'France'},tier:1,svg:stripesV(['#0055A4','#fff','#EF4135'])},

  GB:{name:{he:'בריטניה',en:'UK'},tier:1,svg:`
    <rect width="60" height="40" fill="#00247D"/>
    <line x1="0" y1="0" x2="60" y2="40" stroke="#fff" stroke-width="8"/>
    <line x1="60" y1="0" x2="0" y2="40" stroke="#fff" stroke-width="8"/>
    <line x1="0" y1="0" x2="60" y2="40" stroke="#CF142B" stroke-width="3"/>
    <line x1="60" y1="0" x2="0" y2="40" stroke="#CF142B" stroke-width="3"/>
    <rect x="24" width="12" height="40" fill="#fff"/>
    <rect y="14" width="60" height="12" fill="#fff"/>
    <rect x="27" width="6" height="40" fill="#CF142B"/>
    <rect y="17" width="60" height="6" fill="#CF142B"/>`},

  JP:{name:{he:'יפן',en:'Japan'},tier:1,svg:`
    <rect width="60" height="40" fill="#fff"/>
    <circle cx="30" cy="20" r="8" fill="#BC002D"/>`},

  IT:{name:{he:'איטליה',en:'Italy'},tier:2,svg:stripesV(['#008C45','#fff','#CD212A'])},
  DE:{name:{he:'גרמניה',en:'Germany'},tier:2,svg:stripesH(['#000000','#DD0000','#FFCE00'])},
  ES:{name:{he:'ספרד',en:'Spain'},tier:2,svg:`<rect width="60" height="40" fill="#AA151B"/><rect y="10" width="60" height="20" fill="#F1BF00"/>`},
  RU:{name:{he:'רוסיה',en:'Russia'},tier:2,svg:stripesH(['#fff','#0039A6','#D52B1E'])},

  CA:{name:{he:'קנדה',en:'Canada'},tier:2,svg:`
    <rect width="15" height="40" fill="#FF0000"/>
    <rect x="15" width="30" height="40" fill="#fff"/>
    <rect x="45" width="15" height="40" fill="#FF0000"/>
    <polygon points="30,10 32,17 38,15 34,21 39,24 32,24 33,31 30,26 27,31 28,24 21,24 26,21 22,15 28,17" fill="#FF0000"/>`},

  EG:{name:{he:'מצרים',en:'Egypt'},tier:3,svg:`${stripesH(['#CE1126','#fff','#000'])}<circle cx="30" cy="20" r="4" fill="#C09300"/>`},

  CN:{name:{he:'סין',en:'China'},tier:3,svg:`
    <rect width="60" height="40" fill="#DE2910"/>
    <polygon points="${star(10,8,4,1.6)}" fill="#FFDE00"/>
    <polygon points="${star(18,4,1.3,.5)}" fill="#FFDE00"/>
    <polygon points="${star(20,8.5,1.3,.5)}" fill="#FFDE00"/>
    <polygon points="${star(19.5,13,1.3,.5)}" fill="#FFDE00"/>
    <polygon points="${star(16,16,1.3,.5)}" fill="#FFDE00"/>`},

  GR:{name:{he:'יוון',en:'Greece'},tier:3,svg:`
    ${stripesH(['#0D5EAF','#fff','#0D5EAF','#fff','#0D5EAF','#fff','#0D5EAF','#fff','#0D5EAF'])}
    <rect width="24" height="17.8" fill="#0D5EAF"/>
    <rect x="9" width="6" height="17.8" fill="#fff"/>
    <rect y="6" width="24" height="5.8" fill="#fff"/>`},

  SE:{name:{he:'שוודיה',en:'Sweden'},tier:3,svg:`
    <rect width="60" height="40" fill="#006AA7"/>
    <rect x="18" width="7" height="40" fill="#FECC02"/>
    <rect y="17" width="60" height="7" fill="#FECC02"/>`},

  BR:{name:{he:'ברזיל',en:'Brazil'},tier:3,svg:`
    <rect width="60" height="40" fill="#009739"/>
    <polygon points="30,6 52,20 30,34 8,20" fill="#FEDD00"/>
    <circle cx="30" cy="20" r="7.5" fill="#002776"/>`}
};

const NIQQUD_NAMES = {
  IL:'יִשְׂרָאֵל',
  US:'אַרְצוֹת הַבְּרִית',
  FR:'צָרְפַת',
  GB:'בְּרִיטַנְיָה',
  JP:'יַפָּן',
  IT:'אִיטַלְיָה',
  DE:'גֶּרְמַנְיָה',
  ES:'סְפָרַד',
  RU:'רוּסְיָה',
  CA:'קָנָדָה',
  EG:'מִצְרַיִם',
  CN:'סִין',
  GR:'יָוָן',
  SE:'שְׁוֶדְיָה',
  BR:'בְּרָזִיל'
};

const T_REGULAR = {
  title:{he:'דגלי מדינות',en:'Country Flags'},
  howto:{he:'ראו דגל ובחרו את שם המדינה הנכון!',en:'See a flag and pick the right country!'},
  rounds:{he:'כמה שאלות?',en:'How many questions?'},
  level:{he:'בחרו רמת קושי',en:'Choose difficulty'}
};

const T_NIQQUD = {
  title:{he:'דִּגְלֵי מְדִינוֹת',en:'Country Flags'},
  howto:{he:'רְאוּ דֶּגֶל וּבַחֲרוּ אֶת שֵׁם הַמְּדִינָה הַנָּכוֹן!',en:'See a flag and pick the right country!'},
  rounds:{he:'כַּמָּה שְׁאֵלוֹת?',en:'How many questions?'},
  level:{he:'בַּחֲרוּ רָמַת קֹשִׁי',en:'Choose difficulty'}
};

let CHILD_AGE = null;
let USE_NIQQUD = false;
let T = T_REGULAR;

let game, diff, timer;
let level = 1, TOTAL = 10, score = 0, qnum = 0, current;
let mistakes = 0, timeouts = 0, ending = false, locked = false;

function countryName(code){
  if(IAKidsLang.code === 'he' && USE_NIQQUD){
    return NIQQUD_NAMES[code] || FLAGS_REGULAR[code].name.he;
  }
  return IAKidsLang.t(FLAGS_REGULAR[code].name);
}

async function loadKidContext(){
  try{
    const kidId = localStorage.getItem('active_kid_id');
    if(!kidId) return;

    const client = await IAKidsActivity._getClient();

    const {data,error} = await client
      .from('kids_profiles')
      .select('id, age')
      .eq('id',kidId)
      .maybeSingle();

    if(error || !data){
      console.warn('[flags] Kid profile was not loaded',error);
      return;
    }

    CHILD_AGE = Number(data.age);
    USE_NIQQUD = CHILD_AGE === 1 || CHILD_AGE === 2;

  }catch(error){
    console.warn('[flags] loadKidContext error',error);
  }
}

function applyLanguage(){
  T = USE_NIQQUD ? T_NIQQUD : T_REGULAR;

  $('title').textContent = IAKidsLang.t(T.title);
  $('howto').textContent = IAKidsLang.t(T.howto);
  $('rounds-label').textContent = IAKidsLang.t(T.rounds);
  $('level-label').textContent = IAKidsLang.t(T.level);
  $('score-label').textContent = IAKidsLang.ui('score');
  $('q-label').textContent = IAKidsLang.ui('question');
  $('best-label').textContent = IAKidsLang.ui('your_best');
  $('again-btn').textContent = IAKidsLang.ui('play_again');

  ['level_easy','level_medium','level_hard','level_random'].forEach((key,index)=>{
    document.querySelectorAll('#level-row .game-btn')[index].textContent =
      IAKidsLang.ui(key);
  });
}

IAKidsCoins.mount();

IAKidsHelp.mount({
  slug:'flags',
  how:'בכל שאלה מופיע דגל של מדינה. צריך לבחור את שם המדינה הנכון מתוך ארבע אפשרויות.',
  example:'דגל לבן עם עיגול אדום באמצע ← <b>יפן</b>'
});

function setRounds(n,btn){
  TOTAL = n;

  document.querySelectorAll('#rounds-row .game-btn')
    .forEach(button=>button.classList.remove('success'));

  btn.classList.add('success');
}

const ready = (async()=>{
  await loadKidContext();
  applyLanguage();

  game = await IAKidsGame.init('flags');

  const progress = await game.loadProgress();

  if(progress?.rounds){
    const btn =
      document.querySelector(`#rounds-row [onclick*="(${progress.rounds},"]`) ||
      $('rounds-row').children[1];

    setRounds(progress.rounds,btn);
  }

  if(progress?.lastLevel !== undefined){
    document
      .querySelector(`#level-row [data-lvl="${progress.lastLevel}"]`)
      ?.classList.add('success');
  }
})();

const show = id=>{
  ['start-screen','play-screen','end-screen']
    .forEach(screen=>$(screen).hidden = screen !== id);
};

async function start(selectedLevel){
  await ready;

  level = selectedLevel;
  diff = game.difficulty(selectedLevel || 1,3);

  timer = game.timer({
    style:'bomb',
    onTimeout:()=>handleTimeout()
  });

  score = 0;
  qnum = 0;
  mistakes = 0;
  timeouts = 0;
  ending = false;
  locked = false;

  $('score').textContent = '0';
  $('qnum').textContent = '1';
  $('qtotal').textContent = TOTAL;

  IAKidsActivity.configure({
    difficulty:selectedLevel || 1,
    questionsCount:TOTAL,
    metadata:{
      game_mode:'flags',
      selected_level:selectedLevel,
      random_difficulty:selectedLevel === 0,
      child_age:CHILD_AGE,
      uses_niqqud:USE_NIQQUD
    }
  });

  await game.saveProgress({
    lastLevel:selectedLevel,
    rounds:TOTAL
  });

  show('play-screen');
  await next();
}

const CODES = Object.keys(FLAGS_REGULAR);

function makeQuestion(lvl){
  const pool = CODES.filter(code=>FLAGS_REGULAR[code].tier === lvl);
  const code = pool[rnd(pool.length)];
  return {code};
}

async function next(){
  if(ending) return;

  if(qnum >= TOTAL){
    await end();
    return;
  }

  qnum++;
  $('qnum').textContent = qnum;

  const lvl =
    level === 0
      ? 1 + rnd(3)
      : diff.level;

  const q = await game.newQuestion(
    ()=>makeQuestion(lvl),
    item=>item.code
  );

  current = q.code;
  locked = false;

  IAKidsActivity.questionStarted();

  $('flag-wrap').innerHTML =
    `<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">${FLAGS_REGULAR[q.code].svg}</svg>`;

  const wrong =
    shuffle(
      CODES.filter(code=>code !== q.code)
    ).slice(0,3);

  const options =
    shuffle([q.code,...wrong]);

  const box = $('choices');
  box.innerHTML = '';

  for(const code of options){
    const button = document.createElement('button');
    button.className = 'game-btn outline';
    button.textContent = countryName(code);
    button.onclick = ()=>answer(code,button);
    box.appendChild(button);
  }

  timer.start(
    IAKidsTimer.secondsFor(lvl)
  );
}

async function answer(said,button){
  if(locked || ending) return;

  locked = true;
  timer.stop();

  document.querySelectorAll('#choices .game-btn')
    .forEach(btn=>btn.disabled = true);

  if(said === current){
    score += 10;
    diff.right();

    IAKidsActivity.correct();

    IAKidsFX.correct(button);
    await IAKidsCoins.right(button);

  }else{
    mistakes++;
    diff.wrong();

    IAKidsActivity.wrong();

    IAKidsFX.wrong(button);
    await IAKidsCoins.wrong();
  }

  $('score').textContent = score;

  setTimeout(async()=>{
    locked = false;
    await next();
  },650);
}

async function handleTimeout(){
  if(locked || ending) return;

  locked = true;
  timer.stop();
  timeouts++;

  diff.wrong();

  IAKidsActivity.skipped();

  await IAKidsCoins.wrong();

  document.querySelectorAll('#choices .game-btn')
    .forEach(btn=>btn.disabled = true);

  setTimeout(async()=>{
    locked = false;
    await next();
  },650);
}

async function end(){
  if(ending) return;

  ending = true;
  locked = true;
  timer?.stop();

  const maxScore = TOTAL * 10;
  const correctAnswers = Math.round(score / 10);

  const accuracy =
    correctAnswers /
    Math.max(
      1,
      correctAnswers + mistakes + timeouts
    );

  await game.saveScore(
    score,
    {
      level,
      mistakes,
      timeouts
    }
  );

  const top =
    (await game.getHighScores(1))[0];

  $('final-score').textContent = score;
  $('best').textContent = top?.score ?? score;

  $('player-line').textContent =
    `${top?.player || IAKidsLang.ui('guest')} · ${
      new Date().toLocaleString(
        'he-IL',
        {
          dateStyle:'short',
          timeStyle:'short'
        }
      )
    }`;

  $('stars').textContent =
    '⭐'.repeat(
      accuracy >= .9
        ? 3
        : accuracy >= .7
          ? 2
          : 1
    );

  await game.complete(
    score,
    {
      maxScore,

      performanceScore:
        Math.round(
          accuracy * 100
        ),

      metadata:{
        game_mode:'flags',
        selected_level:level,
        random_difficulty:level === 0,
        total_rounds:TOTAL,
        mistakes,
        timeouts,
        correct_answers:correctAnswers,
        child_age:CHILD_AGE,
        uses_niqqud:USE_NIQQUD
      }
    }
  );

  game.shareButton(
    score,
    $('share-slot')
  );

  show('end-screen');
}
</script>
</body>
