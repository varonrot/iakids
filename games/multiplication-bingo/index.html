<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בינגו לוח הכפל | iakids</title>

<link rel="stylesheet" href="../game-style.css">

<style>
:root{
  --space-bg:#06142d;
  --space-panel:#0b2857;
  --space-panel-dark:#071d43;
  --space-line:rgba(119,176,255,.27);
  --space-text:#f7f9ff;
  --space-muted:#b8c7e3;
  --space-blue:#1693f1;
  --space-green:#1ea96b;
  --space-purple:#7653ff;
  --space-gold:#ffd15c;
}

html,body{min-height:100%}

body{
  margin:0 !important;
  min-height:100vh !important;
  padding:86px 18px 28px !important;
  overflow-x:hidden;
  color:var(--space-text) !important;
  font-family:"Heebo","Segoe UI",Arial,sans-serif !important;
  background:
    radial-gradient(circle at 12% 16%,rgba(26,139,255,.23),transparent 34%),
    radial-gradient(circle at 88% 10%,rgba(112,72,255,.25),transparent 35%),
    radial-gradient(circle at 50% 100%,rgba(12,184,203,.16),transparent 34%),
    linear-gradient(145deg,#050f25,#0a2148 52%,#07152e) !important;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background-image:radial-gradient(circle,rgba(255,255,255,.75) 0 1px,transparent 1.4px);
  background-size:56px 56px;
  opacity:.08;
}

*{box-sizing:border-box}

.game-card{
  width:min(540px,calc(100vw - 28px)) !important;
  min-height:690px;
  margin:0 auto !important;
  padding:0 !important;
  overflow:hidden;
  border:1px solid var(--space-line) !important;
  border-radius:28px !important;
  color:var(--space-text) !important;
  background:linear-gradient(180deg,rgba(17,58,111,.97),rgba(5,25,61,.98)) !important;
  box-shadow:0 28px 75px rgba(0,8,28,.48),inset 0 1px rgba(255,255,255,.08) !important;
}

.game-hud{
  position:fixed !important;
  top:0 !important;
  left:0 !important;
  right:0 !important;
  z-index:20;
  min-height:72px;
  padding:16px 24px !important;
  display:flex !important;
  align-items:center;
  justify-content:center !important;
  gap:42px;
  color:#fff !important;
  background:rgba(5,18,46,.88) !important;
  border-bottom:1px solid rgba(126,180,255,.18);
  backdrop-filter:blur(14px);
}

.game-hud .score{color:var(--space-gold) !important}

#start-screen,#play-screen,#end-screen{
  min-height:688px;
  padding:34px 30px 30px;
}

#start-screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.hero-icon{
  margin:6px 0 8px;
  font-size:5rem;
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.22));
}

.game-title{
  margin:0;
  font-size:clamp(2.1rem,7vw,3rem) !important;
  line-height:1.05;
  color:#fff !important;
  text-shadow:0 4px 12px rgba(0,0,0,.22);
}

#subtitle{
  max-width:420px;
  margin:14px auto 20px;
  color:var(--space-muted) !important;
  font-weight:600;
  line-height:1.65;
}

.section-label{
  margin:8px 0 10px;
  color:#fff;
  font-weight:900;
}

.answer-grid{
  width:100%;
  gap:12px !important;
}

.game-btn{
  min-height:54px;
  border-radius:15px !important;
  border:1px solid rgba(118,176,255,.34) !important;
  color:#fff !important;
  font-weight:900 !important;
  background:linear-gradient(180deg,#1c91db,#0877bd) !important;
  box-shadow:inset 0 1px rgba(255,255,255,.18),0 9px 20px rgba(0,0,0,.16) !important;
}

.game-btn:hover{transform:translateY(-2px)}
.game-btn.outline{background:linear-gradient(180deg,rgba(52,81,139,.72),rgba(21,49,99,.75)) !important}
.game-btn.success{background:linear-gradient(180deg,#37d182,#16ad64) !important;border-color:rgba(97,255,174,.6) !important}
#level-row{margin-top:16px}
#level-row .game-btn[data-lvl="0"]{background:linear-gradient(180deg,#8054ff,#6035dc) !important}

/* PLAY */
#play-screen{position:relative}

#exercise{
  min-height:100px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:8px 0 16px;
  padding:14px 18px;
  border-radius:22px;
  color:#fff;
  font-size:clamp(2rem,7vw,3.4rem);
  font-weight:1000;
  text-align:center;
  background:
    radial-gradient(circle at 50% 20%,rgba(66,169,255,.15),transparent 50%),
    rgba(4,22,55,.48);
  border:1px solid rgba(116,177,255,.18);
}

#board{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:12px;
}

#board .cell{
  min-height:72px;
  padding:6px;
  border-radius:15px;
  border:1px solid rgba(125,188,255,.42);
  color:#fff;
  font-size:1.35rem;
  font-weight:1000;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  background:linear-gradient(180deg,#1b4d89,#10376c);
  box-shadow:0 8px 18px rgba(0,0,0,.16),inset 0 1px rgba(255,255,255,.10);
  transition:transform .15s,background .2s,border-color .2s;
}

#board .cell:hover{
  transform:translateY(-2px);
}

#board .cell.marked{
  background:linear-gradient(180deg,#37d182,#16ad64);
  border-color:rgba(97,255,174,.7);
  color:#fff;
  cursor:default;
}

#board .cell.flash{
  background:linear-gradient(180deg,#ffd45f,#e5a91b);
  color:#10223d;
  border-color:#ffe28b;
}

#board .cell:disabled{
  cursor:default;
}

/* END */
#end-screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.stars{
  min-height:78px;
  font-size:3.7rem !important;
  letter-spacing:4px;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.24));
}

.big-score{
  margin:8px 0;
  color:#fff !important;
  font-size:4rem !important;
  font-weight:1000;
}

#player-line,#end-screen p{color:#d7e3f7 !important}
#share-slot{margin-top:8px}
[hidden]{display:none !important}

@media(max-width:600px){
  body{padding:74px 10px 18px !important}

  .game-card{
    min-height:calc(100vh - 94px);
    border-radius:22px !important;
  }

  #start-screen,#play-screen,#end-screen{
    min-height:calc(100vh - 96px);
    padding:26px 15px 24px;
  }

  .game-hud{
    min-height:62px;
    padding:12px 14px !important;
    gap:24px;
  }

  #board{gap:7px}
  #board .cell{min-height:62px;font-size:1.15rem}
}
</style>
</head>

<body>

<div class="game-hud">
  <span class="score">
    <span id="score-label"></span>:
    <span id="score">0</span>
  </span>

  <span>
    <span id="q-label"></span>
    <span id="qnum">1</span>/<span id="qtotal">10</span>
  </span>
</div>

<div class="game-card" id="card">

  <div id="start-screen">
    <div class="hero-icon">🎱✖️</div>

    <h1 class="game-title" id="title"></h1>

    <p id="subtitle"></p>

    <p class="section-label" id="rounds-label"></p>

    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline success" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>

    <p class="section-label" id="level-label"></p>

    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)" id="lvl1"></button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)" id="lvl2"></button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)" id="lvl3"></button>
      <button class="game-btn" data-lvl="0" onclick="start(0)" id="lvl0"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div id="exercise"></div>
    <div id="board"></div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" onclick="location.reload()" id="again"></button>
    <div id="share-slot"></div>
  </div>

</div>

<script src="../game-sdk.js"></script>

<script>
const T = IAKidsLang.t.bind(IAKidsLang);
const UI = IAKidsLang.ui.bind(IAKidsLang);
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);

const TXT_REGULAR = {
  title:{he:'בינגו לוח הכפל',en:'Multiplication Bingo',es:'Bingo de multiplicar',de:'Einmaleins-Bingo',pt:'Bingo de multiplicação'},
  subtitle:{he:'תרגיל מוגרל — סמנו את התוצאה בלוח. שורה או טור מלא = בינגו! 🎉',en:'An exercise is drawn — tap its answer on the board. Full row or column = Bingo! 🎉',es:'Sale una cuenta — toca su resultado. ¡Fila o columna llena = Bingo! 🎉',de:'Eine Aufgabe wird gezogen — tippe das Ergebnis. Volle Reihe = Bingo! 🎉',pt:'Sai uma conta — toque no resultado. Linha ou coluna cheia = Bingo! 🎉'},
  rounds:{he:'כמה הגרלות?',en:'How many draws?',es:'¿Cuántos sorteos?',de:'Wie viele Ziehungen?',pt:'Quantos sorteios?'},
  level:{he:'בחרו רמת קושי',en:'Choose difficulty'},
  bingo:{he:'🎉 בינגו! +20',en:'🎉 Bingo! +20',es:'🎉 ¡Bingo! +20',de:'🎉 Bingo! +20',pt:'🎉 Bingo! +20'}
};

const TXT_NIQQUD = {
  title:{he:'בִּינְגּוֹ לוּחַ הַכֶּפֶל',en:'Multiplication Bingo',es:'Bingo de multiplicar',de:'Einmaleins-Bingo',pt:'Bingo de multiplicação'},
  subtitle:{he:'תַּרְגִּיל מֻגְרָל — סַמְּנוּ אֶת הַתּוֹצָאָה בַּלּוּחַ. שׁוּרָה אוֹ טוּר מָלֵא = בִּינְגּוֹ! 🎉',en:'An exercise is drawn — tap its answer on the board. Full row or column = Bingo! 🎉',es:'Sale una cuenta — toca su resultado. ¡Fila o columna llena = Bingo! 🎉',de:'Eine Aufgabe wird gezogen — tippe das Ergebnis. Volle Reihe = Bingo! 🎉',pt:'Sai uma conta — toque no resultado. Linha ou coluna cheia = Bingo! 🎉'},
  rounds:{he:'כַּמָּה הַגְרָלוֹת?',en:'How many draws?',es:'¿Cuántos sorteos?',de:'Wie viele Ziehungen?',pt:'Quantos sorteios?'},
  level:{he:'בַּחֲרוּ רָמַת קֹשִׁי',en:'Choose difficulty'},
  bingo:{he:'🎉 בִּינְגּוֹ! +20',en:'🎉 Bingo! +20',es:'🎉 ¡Bingo! +20',de:'🎉 Bingo! +20',pt:'🎉 Bingo! +20'}
};

let CHILD_AGE = null;
let USE_NIQQUD = false;
let TXT = TXT_REGULAR;

let game, score = 0, qnum = 0, correct = 0, level = 1, locked = false;
let TOTAL = 10, diff, timer, cells = [], current = null;
let mistakes = 0, timeouts = 0, ending = false;
const awarded = new Set();

const RANGE = {
  1:[1,6],
  2:[2,9],
  3:[3,12]
};

async function loadKidContext(){
  try{
    const kidId = localStorage.getItem('active_kid_id');
    if(!kidId) return;

    const client = await IAKidsActivity._getClient();

    const {data,error} = await client
      .from('kids_profiles')
      .select('id, age')
      .eq('id',kidId)
      .maybeSingle();

    if(error || !data){
      console.warn('[multiplication-bingo] Kid profile was not loaded',error);
      return;
    }

    CHILD_AGE = Number(data.age);
    USE_NIQQUD = CHILD_AGE === 1 || CHILD_AGE === 2;

  }catch(error){
    console.warn('[multiplication-bingo] loadKidContext error',error);
  }
}

function applyLanguage(){
  TXT = USE_NIQQUD ? TXT_NIQQUD : TXT_REGULAR;

  $('title').textContent = T(TXT.title);
  $('subtitle').textContent = T(TXT.subtitle);
  $('rounds-label').textContent = T(TXT.rounds);
  $('level-label').textContent = T(TXT.level);
  $('score-label').textContent = UI('score');
  $('q-label').textContent = UI('question');
  $('best-label').textContent = UI('your_best');
  $('again').textContent = UI('play_again');
  $('lvl1').textContent = UI('level_easy');
  $('lvl2').textContent = UI('level_medium');
  $('lvl3').textContent = UI('level_hard');
  $('lvl0').textContent = UI('level_random');
}

IAKidsCoins.mount();

IAKidsHelp.mount({
  slug:'multiplication-bingo',
  how:'מגרילים תרגיל כפל — מסמנים את התוצאה שלו בלוח הבינגו לפני שהזמן נגמר. שורה או טור מלא = בינגו!',
  example:'יצא <span dir="ltr"><b>3 × 4</b></span> ← לוחצים על המשבצת <b>12</b> בלוח'
});

function setRounds(n,btn){
  TOTAL = n;

  document.querySelectorAll('#rounds-row .game-btn')
    .forEach(button=>button.classList.remove('success'));

  btn.classList.add('success');
}

const ready = (async()=>{
  await loadKidContext();
  applyLanguage();

  game = await IAKidsGame.init('multiplication-bingo');

  const progress = await game.loadProgress();

  if(progress?.rounds){
    const btn =
      document.querySelector(`#rounds-row [onclick*="(${progress.rounds},"]`) ||
      $('rounds-row').children[1];

    setRounds(progress.rounds,btn);
  }

  if(progress?.lastLevel !== undefined){
    document
      .querySelector(`#level-row [data-lvl="${progress.lastLevel}"]`)
      ?.classList.add('success');
  }
})();

const show = id=>{
  ['start-screen','play-screen','end-screen']
    .forEach(screen=>$(screen).hidden = screen !== id);
};

function buildBoard(lvl){
  const [lo,hi] = RANGE[lvl];

  const seen = new Set();
  cells = [];

  /*
   * Need 16 distinct answers.
   * For level 1 the range 1..6 cannot produce 16 unique products.
   * We therefore slightly expand the factor range only for board generation,
   * while keeping the difficulty character of the level.
   */
  const boardHi =
    lvl === 1 ? 8 : hi;

  let guard = 0;

  while(cells.length < 16 && guard < 2000){
    guard++;

    const a =
      lo + rnd(boardHi - lo + 1);

    const b =
      lo + rnd(boardHi - lo + 1);

    const value =
      a * b;

    if(seen.has(value)){
      continue;
    }

    seen.add(value);

    cells.push({
      a,
      b,
      val:value,
      marked:false
    });
  }

  const board = $('board');
  board.innerHTML = '';

  cells.forEach((cell,index)=>{
    const button =
      document.createElement('button');

    button.className = 'cell';
    button.textContent = cell.val;
    button.onclick = ()=>tap(index);

    cell.el = button;

    board.appendChild(button);
  });
}

async function start(selectedLevel){
  await ready;

  level = selectedLevel;

  const boardLevel =
    selectedLevel === 0
      ? 1 + rnd(3)
      : selectedLevel;

  diff = game.difficulty(selectedLevel || 1,3);

  timer = game.timer({
    style:'bomb',
    onTimeout:()=>{
      if(!locked) handleTimeout();
    }
  });

  score = 0;
  qnum = 0;
  correct = 0;
  mistakes = 0;
  timeouts = 0;
  locked = false;
  ending = false;
  current = null;
  awarded.clear();

  $('score').textContent = '0';
  $('qnum').textContent = '1';
  $('qtotal').textContent = TOTAL;

  IAKidsActivity.configure({
    difficulty:selectedLevel || 1,
    questionsCount:TOTAL,
    metadata:{
      game_mode:'multiplication-bingo',
      selected_level:selectedLevel,
      random_difficulty:selectedLevel === 0,
      child_age:CHILD_AGE,
      uses_niqqud:USE_NIQQUD,
      timer_enabled:true,
      board_size:16,
      board_level:boardLevel
    }
  });

  await game.saveProgress({
    lastLevel:selectedLevel,
    rounds:TOTAL
  });

  buildBoard(boardLevel);

  show('play-screen');
  await next();
}

async function next(){
  if(ending) return;

  if(qnum >= TOTAL){
    await end();
    return;
  }

  const open =
    cells.filter(cell=>!cell.marked);

  if(!open.length){
    await end();
    return;
  }

  qnum++;
  locked = false;

  $('qnum').textContent = qnum;

  current =
    await game.newQuestion(
      ()=>open[rnd(open.length)],
      cell=>`${cell.a}×${cell.b}`
    );

  IAKidsActivity.questionStarted();

  $('exercise').innerHTML =
    `<span dir="ltr">${current.a} × ${current.b} = ?</span>`;

  timer.start(
    IAKidsTimer.secondsFor(
      diff.level,
      15
    )
  );
}

function tap(index){
  const cell = cells[index];

  if(
    locked ||
    ending ||
    cell.marked
  ){
    return;
  }

  resolve(
    cell.val === current.val,
    cell
  );
}

async function resolve(isRight,cell){
  if(locked || ending) return;

  locked = true;
  timer.stop();

  if(isRight){
    cell.marked = true;
    cell.el.classList.add('marked');

    score += 10;
    correct++;

    diff.right();

    IAKidsActivity.correct();

    IAKidsFX.correct(cell.el);
    await IAKidsCoins.right(cell.el);

    await checkBingo();

  }else{
    mistakes++;

    diff.wrong();

    IAKidsActivity.wrong();

    const target =
      cell
        ? cell.el
        : $('exercise');

    IAKidsFX.wrong(target);
    await IAKidsCoins.wrong();

    const hit =
      cells.find(
        item=>item.val === current.val
      );

    if(hit?.el){
      hit.el.classList.add('flash');

      setTimeout(()=>{
        hit.el.classList.remove('flash');
      },700);
    }
  }

  $('score').textContent = score;

  setTimeout(async()=>{
    await next();
  },isRight ? 550 : 900);
}

async function handleTimeout(){
  if(locked || ending) return;

  locked = true;
  timer.stop();
  timeouts++;

  diff.wrong();

  IAKidsActivity.skipped();

  await IAKidsCoins.wrong();

  const hit =
    cells.find(
      item=>item.val === current.val
    );

  if(hit?.el){
    hit.el.classList.add('flash');

    setTimeout(()=>{
      hit.el.classList.remove('flash');
    },700);
  }

  setTimeout(async()=>{
    await next();
  },900);
}

async function checkBingo(){
  for(let i=0;i<4;i++){
    const lines = {
      [`r${i}`]:
        [0,1,2,3].map(
          j=>cells[i*4+j]
        ),

      [`c${i}`]:
        [0,1,2,3].map(
          j=>cells[j*4+i]
        )
    };

    for(const [key,line] of Object.entries(lines)){
      if(
        !awarded.has(key) &&
        line.every(cell=>cell.marked)
      ){
        awarded.add(key);

        score += 20;

        await IAKidsCoins.add(20);

        IAKidsFX.scorePop(
          T(TXT.bingo),
          line[0].el
        );

        IAKidsFX._beep([
          [659,0,.1],
          [784,.1,.1],
          [1047,.2,.3]
        ]);
      }
    }
  }
}

async function end(){
  if(ending) return;

  ending = true;
  locked = true;
  timer?.stop();

  const baseMaxScore =
    TOTAL * 10;

  /*
   * Bingo bonuses are part of the visible score.
   * Include bonuses actually earned in max_score so score never exceeds max_score.
   */
  const maxScore =
    baseMaxScore +
    awarded.size * 20;

  const accuracy =
    correct /
    Math.max(
      1,
      correct + mistakes + timeouts
    );

  await game.saveScore(
    score,
    {
      level,
      correct,
      total:TOTAL,
      bingos:awarded.size,
      mistakes,
      timeouts
    }
  );

  const top =
    (await game.getHighScores(1))[0];

  $('final-score').textContent = score;

  $('best').textContent =
    top?.score ?? score;

  $('player-line').textContent =
    `${top?.player || UI('guest')} · ${
      new Date().toLocaleString(
        'he-IL',
        {
          dateStyle:'short',
          timeStyle:'short'
        }
      )
    }`;

  $('stars').textContent =
    '⭐'.repeat(
      accuracy >= .9
        ? 3
        : accuracy >= .6
          ? 2
          : 1
    );

  await game.complete(
    score,
    {
      maxScore,

      performanceScore:
        Math.round(
          accuracy * 100
        ),

      metadata:{
        game_mode:'multiplication-bingo',
        selected_level:level,
        random_difficulty:level === 0,
        total_rounds:TOTAL,
        correct_answers:correct,
        mistakes,
        timeouts,
        bingos:awarded.size,
        bingo_bonus:awarded.size * 20,
        base_max_score:baseMaxScore,
        child_age:CHILD_AGE,
        uses_niqqud:USE_NIQQUD,
        timer_enabled:true,
        board_size:16
      }
    }
  );

  game.shareButton(
    score,
    $('share-slot')
  );

  show('end-screen');
}
</script>
</body>
</html>
