<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Word Match | iakids</title>

<link rel="stylesheet" href="../game-style.css">

<style>
:root{
  --space-bg:#06142d;
  --space-panel:#0b2857;
  --space-panel-dark:#071d43;
  --space-line:rgba(119,176,255,.27);
  --space-text:#f7f9ff;
  --space-muted:#b8c7e3;
  --space-gold:#ffd15c;
}

html,body{min-height:100%}

body{
  margin:0!important;
  min-height:100vh!important;
  padding:86px 18px 28px!important;
  overflow-x:hidden;
  color:var(--space-text)!important;
  font-family:"Heebo","Segoe UI",Arial,sans-serif!important;
  background:
    radial-gradient(circle at 12% 16%,rgba(26,139,255,.23),transparent 34%),
    radial-gradient(circle at 88% 10%,rgba(112,72,255,.25),transparent 35%),
    radial-gradient(circle at 50% 100%,rgba(12,184,203,.16),transparent 34%),
    linear-gradient(145deg,#050f25,#0a2148 52%,#07152e)!important;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background-image:radial-gradient(circle,rgba(255,255,255,.75) 0 1px,transparent 1.4px);
  background-size:56px 56px;
  opacity:.08;
}

*{box-sizing:border-box}

.game-card{
  width:min(540px,calc(100vw - 28px))!important;
  min-height:690px;
  margin:0 auto!important;
  padding:0!important;
  overflow:hidden;
  border:1px solid var(--space-line)!important;
  border-radius:28px!important;
  color:var(--space-text)!important;
  background:linear-gradient(180deg,rgba(17,58,111,.97),rgba(5,25,61,.98))!important;
  box-shadow:0 28px 75px rgba(0,8,28,.48),inset 0 1px rgba(255,255,255,.08)!important;
}

.game-hud{
  position:fixed!important;
  top:0!important;
  left:0!important;
  right:0!important;
  z-index:20;
  min-height:72px;
  padding:16px 24px!important;
  display:flex!important;
  align-items:center;
  justify-content:center!important;
  gap:42px;
  color:#fff!important;
  background:rgba(5,18,46,.88)!important;
  border-bottom:1px solid rgba(126,180,255,.18);
  backdrop-filter:blur(14px);
}

.game-hud .score{color:var(--space-gold)!important}

#start-screen,#play-screen,#end-screen{
  min-height:688px;
  padding:34px 30px 30px;
}

#start-screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.hero-icon{
  margin:6px 0 8px;
  font-size:5rem;
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.22));
}

.game-title{
  margin:0;
  font-size:clamp(2.15rem,7vw,3.1rem)!important;
  line-height:1.05;
  color:#fff!important;
  text-shadow:0 4px 12px rgba(0,0,0,.22);
}

#instr{
  max-width:420px;
  margin:14px auto 20px;
  color:var(--space-muted)!important;
  font-weight:600;
  line-height:1.65;
}

.section-label{
  margin:8px 0 10px;
  color:#fff;
  font-weight:900;
}

.answer-grid{
  width:100%;
  gap:12px!important;
}

.game-btn{
  min-height:54px;
  border-radius:15px!important;
  border:1px solid rgba(118,176,255,.34)!important;
  color:#fff!important;
  font-weight:900!important;
  background:linear-gradient(180deg,#1c91db,#0877bd)!important;
  box-shadow:inset 0 1px rgba(255,255,255,.18),0 9px 20px rgba(0,0,0,.16)!important;
}

.game-btn.outline,.game-btn.secondary{
  background:linear-gradient(180deg,rgba(52,81,139,.72),rgba(21,49,99,.75))!important;
}

.game-btn.success{
  background:linear-gradient(180deg,#37d182,#16ad64)!important;
  border-color:rgba(97,255,174,.6)!important;
}

#level-row{margin-top:16px}
#level-row .game-btn[data-l="0"]{
  background:linear-gradient(180deg,#8054ff,#6035dc)!important;
}

/* PLAY */
#play-screen{
  text-align:center;
}

#cue{
  min-height:185px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:8px 0 18px;
  border-radius:26px;
  font-size:7rem!important;
  background:
    radial-gradient(circle at 50% 30%,rgba(64,169,255,.16),transparent 55%),
    rgba(4,22,55,.48);
  border:1px solid rgba(116,177,255,.18);
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.16));
}

#answers{
  grid-template-columns:1fr 1fr!important;
}

#answers .game-btn{
  min-height:70px;
  font-size:1.25rem!important;
}

#answers .game-btn.correct{
  background:linear-gradient(180deg,#37d182,#16ad64)!important;
}

#answers .game-btn:disabled{
  opacity:.74;
  cursor:default;
}

/* END */
#end-screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.stars{
  min-height:78px;
  font-size:3.7rem!important;
  letter-spacing:4px;
}

.big-score{
  margin:8px 0;
  color:#fff!important;
  font-size:4rem!important;
  font-weight:1000;
}

#player-line,#end-screen p{color:#d7e3f7!important}
[hidden]{display:none!important}

@media(max-width:600px){
  body{padding:74px 10px 18px!important}

  .game-card{
    min-height:calc(100vh - 94px);
    border-radius:22px!important;
  }

  #start-screen,#play-screen,#end-screen{
    min-height:calc(100vh - 96px);
    padding:26px 15px 24px;
  }

  .game-hud{
    min-height:62px;
    padding:12px 14px!important;
    gap:24px;
  }

  #cue{
    min-height:155px;
    font-size:6rem!important;
  }

  #answers .game-btn{
    min-height:64px;
    font-size:1.15rem!important;
  }
}
</style>
</head>

<body>

<div class="game-hud">
  <span class="score">
    <span id="score-label"></span>:
    <span id="score">0</span>
  </span>

  <span>
    <span id="q-label"></span>
    <span id="qnum">1</span>/<span id="qtotal">10</span>
  </span>
</div>

<div class="game-card" id="card">

  <div id="start-screen">
    <div class="hero-icon">🔤</div>

    <h1 class="game-title" id="title"></h1>

    <p id="instr"></p>

    <p class="section-label" id="rounds-label"></p>

    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" data-r="5" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline success" data-r="10" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" data-r="15" onclick="setRounds(15,this)">15</button>
    </div>

    <p class="section-label" id="level-label"></p>

    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-l="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-l="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-l="3" onclick="start(3)"></button>
      <button class="game-btn" data-l="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div id="cue"></div>
    <div class="answer-grid" id="answers"></div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>

<script>
const SLUG='english-word-match';
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);

const T_REGULAR={
  title:{he:'התאמת מילים באנגלית',en:'English Word Match',es:'Emparejar palabras en inglés',de:'Englische Wörter zuordnen',pt:'Combinar palavras em inglês'},
  instr:{he:'איזו מילה באנגלית מתאימה לתמונה? בחרו נכון!',en:'Which English word matches the picture? Choose wisely!',es:'¿Qué palabra en inglés corresponde a la imagen?',de:'Welches englische Wort passt zum Bild?',pt:'Qual palavra em inglês combina com a imagem?'},
  rounds:{he:'כמה שאלות?',en:'How many questions?',es:'¿Cuántas preguntas?',de:'Wie viele Fragen?',pt:'Quantas perguntas?'},
  level:{he:'בחרו רמת קושי',en:'Choose difficulty'}
};

const T_NIQQUD={
  title:{he:'הַתְאָמַת מִלִּים בְּאַנְגְּלִית',en:'English Word Match',es:'Emparejar palabras en inglés',de:'Englische Wörter zuordnen',pt:'Combinar palavras em inglês'},
  instr:{he:'אֵיזוֹ מִלָּה בְּאַנְגְּלִית מַתְאִימָה לַתְּמוּנָה? בַּחֲרוּ נָכוֹן!',en:'Which English word matches the picture? Choose wisely!',es:'¿Qué palabra en inglés corresponde a la imagen?',de:'Welches englische Wort passt zum Bild?',pt:'Qual palavra em inglês combina com a imagem?'},
  rounds:{he:'כַּמָּה שְׁאֵלוֹת?',en:'How many questions?',es:'¿Cuántas preguntas?',de:'Wie viele Fragen?',pt:'Quantas perguntas?'},
  level:{he:'בַּחֲרוּ רָמַת קֹשִׁי',en:'Choose difficulty'}
};

let CHILD_AGE=null;
let USE_NIQQUD=false;
let T=T_REGULAR;

let game,score=0,qnum=0,level=1,right=0,TOTAL=10,locked=false;
let diff,timer,currentAnswer='',ending=false,mistakes=0,timeouts=0;

const BANK={
  1:[
    {word:'Cat',emoji:'🐱'},{word:'Dog',emoji:'🐶'},{word:'Sun',emoji:'☀️'},
    {word:'Ball',emoji:'⚽'},{word:'Book',emoji:'📖'},{word:'Cup',emoji:'☕'},
    {word:'Star',emoji:'⭐'},{word:'Tree',emoji:'🌳'},{word:'Fish',emoji:'🐟'},
    {word:'Egg',emoji:'🥚'},{word:'Car',emoji:'🚗'},{word:'Hat',emoji:'🎩'}
  ],
  2:[
    {word:'Chair',emoji:'🪑'},{word:'Bed',emoji:'🛏️'},{word:'Spoon',emoji:'🥄'},
    {word:'Fork',emoji:'🍴'},{word:'Clock',emoji:'🕐'},{word:'Key',emoji:'🔑'},
    {word:'Phone',emoji:'📱'},{word:'Shoe',emoji:'👟'},{word:'Bag',emoji:'🎒'},
    {word:'Umbrella',emoji:'☂️'},{word:'Box',emoji:'📦'},{word:'Door',emoji:'🚪'}
  ],
  3:[
    {word:'Moon',emoji:'🌙'},{word:'Rain',emoji:'🌧️'},{word:'Snow',emoji:'❄️'},
    {word:'Cloud',emoji:'☁️'},{word:'Fire',emoji:'🔥'},{word:'Ice',emoji:'🧊'},
    {word:'Money',emoji:'💰'},{word:'Music',emoji:'🎵'},{word:'Heart',emoji:'❤️'},
    {word:'King',emoji:'👑'},{word:'Robot',emoji:'🤖'},{word:'Ghost',emoji:'👻'},
    {word:'Rainbow',emoji:'🌈'},{word:'Queen',emoji:'👸'}
  ]
};

async function loadKidContext(){
  try{
    const kidId=localStorage.getItem('active_kid_id');
    if(!kidId) return;

    const client=await IAKidsActivity._getClient();

    const {data,error}=await client
      .from('kids_profiles')
      .select('id, age')
      .eq('id',kidId)
      .maybeSingle();

    if(!error && data){
      CHILD_AGE=Number(data.age);
      USE_NIQQUD=CHILD_AGE===1 || CHILD_AGE===2;
    }
  }catch(e){
    console.warn('[english-word-match] loadKidContext',e);
  }
}

function applyLanguage(){
  T=USE_NIQQUD ? T_NIQQUD : T_REGULAR;

  $('title').textContent=IAKidsLang.t(T.title);
  $('instr').textContent=IAKidsLang.t(T.instr);
  $('rounds-label').textContent=IAKidsLang.t(T.rounds);
  $('level-label').textContent=IAKidsLang.t(T.level);

  $('score-label').textContent=IAKidsLang.ui('score');
  $('q-label').textContent=IAKidsLang.ui('question');
  $('best-label').textContent=IAKidsLang.ui('your_best');
  $('again-btn').textContent=IAKidsLang.ui('play_again');

  for(const [lvl,key] of [
    [1,'level_easy'],
    [2,'level_medium'],
    [3,'level_hard'],
    [0,'level_random']
  ]){
    document.querySelector(`#level-row [data-l="${lvl}"]`).textContent=
      IAKidsLang.ui(key);
  }
}

IAKidsCoins.mount();

IAKidsHelp.mount({
  slug:SLUG,
  how:'מופיע אימוג׳י — צריך לבחור מתוך 4 מילים באנגלית את המילה הנכונה שמתארת אותו לפני שהזמן נגמר.',
  example:'🐱 ← <span dir="ltr"><b>Cat</b></span>'
});

function setRounds(n,btn){
  TOTAL=n;

  document.querySelectorAll('#rounds-row .game-btn')
    .forEach(b=>b.classList.remove('success'));

  btn?.classList.add('success');
}

const ready=(async()=>{
  await loadKidContext();
  applyLanguage();

  game=await IAKidsGame.init(SLUG);

  const p=await game.loadProgress();
  const r=p?.rounds || TOTAL;

  setRounds(
    r,
    document.querySelector(`#rounds-row [data-r="${r}"]`) || $('rounds-row').children[1]
  );

  if(p?.lastLevel!=null){
    document.querySelector(`#level-row [data-l="${p.lastLevel}"]`)?.classList.add('success');
  }
})();

const show=id=>{
  ['start-screen','play-screen','end-screen']
    .forEach(s=>$(s).hidden=s!==id);
};

function shuffle(arr){
  const a=[...arr];

  for(let i=a.length-1;i>0;i--){
    const j=rnd(i+1);
    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}

function pick(a){
  return a[rnd(a.length)];
}

function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;

    speechSynthesis.cancel();

    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';
    speechSynthesis.speak(u);
  }catch(e){}
}

function makeQuestion(lvl){
  const pool=BANK[lvl];
  const correct=pick(pool);

  const others=shuffle(
    pool.filter(w=>w.word!==correct.word)
  );

  const options=shuffle([
    correct.word,
    ...others.slice(0,3).map(w=>w.word)
  ]);

  return {
    emoji:correct.emoji,
    answer:correct.word,
    options
  };
}

async function start(lvl){
  await ready;

  level=lvl;
  diff=game.difficulty(lvl||1,3);

  timer=game.timer({
    style:'bomb',
    onTimeout:()=>{
      if(!locked) handleTimeout();
    }
  });

  score=0;
  qnum=0;
  right=0;
  mistakes=0;
  timeouts=0;
  ending=false;
  locked=false;
  currentAnswer='';

  $('score').textContent='0';
  $('qnum').textContent='1';
  $('qtotal').textContent=TOTAL;

  IAKidsActivity.configure({
    difficulty:lvl||1,
    questionsCount:TOTAL,
    metadata:{
      game_mode:'english_word_match',
      game_slug:SLUG,
      selected_level:lvl,
      random_difficulty:lvl===0,
      child_age:CHILD_AGE,
      uses_niqqud:USE_NIQQUD,
      language_subject:'english',
      cue_type:'emoji',
      timer_enabled:true,
      tts_feedback:true
    }
  });

  await game.saveProgress({
    lastLevel:lvl,
    rounds:TOTAL
  });

  show('play-screen');
  await next();
}

async function next(){
  if(ending) return;

  if(qnum>=TOTAL){
    await end();
    return;
  }

  qnum++;
  locked=false;

  $('qnum').textContent=qnum;

  const lvl=level===0 ? 1+rnd(3) : diff.level;

  const q=await game.newQuestion(
    ()=>makeQuestion(lvl),
    x=>`${x.emoji}|${x.answer}`
  );

  currentAnswer=q.answer;

  IAKidsActivity.questionStarted();

  $('cue').textContent=q.emoji;

  const grid=$('answers');
  grid.innerHTML='';

  for(const option of q.options){
    const btn=document.createElement('button');
    btn.className='game-btn';
    btn.innerHTML=`<span dir="ltr">${option}</span>`;
    btn.onclick=()=>answer(option,btn);
    grid.appendChild(btn);
  }

  timer.start(
    IAKidsTimer.secondsFor(lvl)
  );
}

async function answer(selected,btn){
  if(locked || ending) return;

  locked=true;
  timer.stop();

  document.querySelectorAll('#answers .game-btn')
    .forEach(b=>b.disabled=true);

  const ok=selected===currentAnswer;

  if(ok){
    score+=10;
    right++;

    diff.right();
    IAKidsActivity.correct();

    IAKidsFX.correct(btn);
    await IAKidsCoins.right(btn);

    speak(currentAnswer);

  }else{
    mistakes++;

    diff.wrong();
    IAKidsActivity.wrong();

    if(btn) IAKidsFX.wrong(btn);
    await IAKidsCoins.wrong();

    [...$('answers').children].forEach(b=>{
      if(b.textContent.trim()===currentAnswer){
        b.classList.add('correct');
      }
    });
  }

  $('score').textContent=score;

  setTimeout(async()=>{
    await next();
  },ok ? 650 : 950);
}

async function handleTimeout(){
  if(locked || ending) return;

  locked=true;
  timer.stop();
  timeouts++;

  document.querySelectorAll('#answers .game-btn')
    .forEach(b=>b.disabled=true);

  diff.wrong();
  IAKidsActivity.skipped();

  await IAKidsCoins.wrong();

  [...$('answers').children].forEach(b=>{
    if(b.textContent.trim()===currentAnswer){
      b.classList.add('correct');
    }
  });

  setTimeout(async()=>{
    await next();
  },900);
}

async function end(){
  if(ending) return;

  ending=true;
  locked=true;
  timer?.stop();

  const maxScore=TOTAL*10;

  const accuracy=
    right /
    Math.max(
      1,
      right+mistakes+timeouts
    );

  await game.saveScore(
    score,
    {
      level,
      rounds:TOTAL,
      right,
      mistakes,
      timeouts
    }
  );

  const top=(await game.getHighScores(1))[0];

  $('final-score').textContent=score;
  $('best').textContent=top?.score??score;

  $('player-line').textContent=
    `${top?.player || IAKidsLang.ui('guest')} · ${
      new Date().toLocaleString(
        'he-IL',
        {dateStyle:'short',timeStyle:'short'}
      )
    }`;

  $('stars').textContent=
    '⭐'.repeat(
      accuracy>=.9 ? 3 :
      accuracy>=.7 ? 2 : 1
    );

  await game.complete(
    score,
    {
      maxScore,
      performanceScore:Math.round(accuracy*100),
      metadata:{
        game_mode:'english_word_match',
        game_slug:SLUG,
        selected_level:level,
        random_difficulty:level===0,
        total_rounds:TOTAL,
        correct_answers:right,
        mistakes,
        timeouts,
        child_age:CHILD_AGE,
        uses_niqqud:USE_NIQQUD,
        language_subject:'english',
        cue_type:'emoji',
        timer_enabled:true,
        tts_feedback:true
      }
    }
  );

  game.shareButton(score,$('share-slot'));
  show('end-screen');
}
</script>
</body>
</html>
