<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מרוץ החשבון | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>
:root{--ink:#071b48;--shadow:0 16px 38px rgba(7,35,85,.24)}
*{box-sizing:border-box}html,body,button{font-family:"Segoe UI",Arial,sans-serif}html,body{margin:0;min-height:100%}body{min-height:100vh;overflow-x:hidden;color:var(--ink);background:linear-gradient(#38b7ff 0 41%,#7dd83d 41% 57%,#343b49 57% 100%)}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 12% 15%,#fff 0 6%,transparent 6.5%),radial-gradient(ellipse at 35% 10%,#fff 0 8%,transparent 8.5%),radial-gradient(ellipse at 77% 14%,#fff 0 7%,transparent 7.5%),radial-gradient(ellipse at 92% 8%,#fff 0 5%,transparent 5.5%);opacity:.92}[hidden]{display:none!important}
.back{position:fixed;top:14px;right:14px;z-index:100;min-height:46px;padding:0 16px;display:flex;align-items:center;gap:8px;border-radius:15px;color:#fff;text-decoration:none;font-weight:900;background:linear-gradient(145deg,#7b56ff,#4b30ba);box-shadow:0 10px 25px rgba(45,22,120,.35)}
.hud{position:fixed;top:12px;left:12px;z-index:100;display:flex;gap:10px}.hud-pill{min-height:48px;padding:0 17px;display:flex;align-items:center;gap:8px;border-radius:17px;color:#fff;background:rgba(5,31,79,.92);border:1px solid rgba(255,255,255,.25);font-weight:900}
.shell{width:min(1500px,100%);min-height:100vh;margin:auto;padding:80px 22px 22px;display:grid;place-items:center}.card{width:100%;border-radius:30px;overflow:hidden;border:1px solid rgba(255,255,255,.42);box-shadow:0 28px 75px rgba(0,35,95,.3);background:rgba(255,255,255,.12)}
.start,.end{max-width:760px;margin:auto;padding:36px;text-align:center;border-radius:30px;background:rgba(255,255,255,.96);box-shadow:var(--shadow)}.start .hero{font-size:74px}.start h1{font-size:clamp(38px,5vw,64px);margin:8px 0 4px}.start p{margin:0 0 22px;color:#48618c;font-size:17px;font-weight:700}.label{margin:18px 0 9px;font-weight:1000;font-size:18px}.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{min-height:66px;border:0;border-radius:18px;color:#fff;cursor:pointer;font-size:17px;font-weight:1000;background:linear-gradient(145deg,#1aa5f3,#1363c4)}.choice.selected{background:linear-gradient(145deg,#65d832,#2f9c17)}.start-btn{width:100%;min-height:72px;margin-top:20px;border:0;border-radius:20px;color:#4b2b00;cursor:pointer;font-size:24px;font-weight:1000;background:linear-gradient(#ffe267,#ffb318)}
.game{min-height:760px;position:relative;overflow:hidden;background:linear-gradient(#43bcff 0 34%,#79d944 34% 50%,#2e3642 50% 100%)}.sky-title{position:absolute;top:18px;left:50%;transform:translateX(-50%);min-width:320px;padding:11px 25px;text-align:center;color:#fff;font-size:28px;font-weight:1000;border-radius:18px;background:linear-gradient(#8b55ff,#5b2bd0)}.question-card{position:absolute;top:83px;left:50%;transform:translateX(-50%);width:min(720px,85%);min-height:130px;display:grid;place-items:center;padding:15px;border-radius:26px;background:#fff;box-shadow:var(--shadow);font-size:clamp(42px,6vw,78px);font-weight:1000;direction:ltr}.answers{position:absolute;top:235px;left:50%;transform:translateX(-50%);width:min(940px,92%);display:grid;grid-template-columns:repeat(4,1fr);gap:18px;direction:ltr}.answer{min-height:116px;border:4px solid transparent;border-radius:23px;background:#fff;color:#071b48;cursor:pointer;font-size:clamp(34px,4vw,58px);font-weight:1000;box-shadow:0 12px 25px rgba(10,60,145,.23)}.answer.correct{border-color:#61d52d;background:#efffe8}.answer.wrong{border-color:#f0554d;background:#fff0ef;animation:shake .35s}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.track{position:absolute;inset:390px 0 0;padding:20px 30px 24px;background:repeating-linear-gradient(90deg,transparent 0 82px,rgba(255,255,255,.13) 82px 86px),linear-gradient(#363e49,#202731);border-top:14px solid #d92f28}.track:before{content:"";position:absolute;top:-14px;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,#fff 0 42px,#e73c34 42px 84px)}.finish{position:absolute;top:0;bottom:0;right:7%;width:48px;background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/24px 24px}.lane{height:78px;position:relative;border-bottom:2px dashed rgba(255,255,255,.38)}.car{position:absolute;left:2%;top:8px;width:92px;height:60px;display:grid;place-items:center;border-radius:22px 22px 15px 15px;color:#fff;font-size:32px;font-weight:1000;transition:left .65s cubic-bezier(.2,.75,.25,1.2),transform .2s;box-shadow:0 10px 16px rgba(0,0,0,.32);border:2px solid rgba(255,255,255,.35)}.car:before,.car:after{content:"";position:absolute;bottom:-8px;width:20px;height:20px;border-radius:50%;background:#111;border:3px solid #555}.car:before{left:12px}.car:after{right:12px}.player{background:linear-gradient(#6ee332,#2c9f16)}.bot1{background:linear-gradient(#a45cff,#6326c6)}.bot2{background:linear-gradient(#ff8a24,#e34217)}.bot3{background:linear-gradient(#30a7ff,#1263d3)}.boost{transform:scale(1.08)}.lane-name{position:absolute;left:106px;top:27px;color:#fff;font-size:13px;font-weight:900}.feedback{position:absolute;left:22px;bottom:18px;z-index:7;min-width:300px;min-height:78px;display:flex;align-items:center;gap:13px;padding:12px 16px;border-radius:22px;color:#fff;background:rgba(20,18,78,.92);font-size:20px;font-weight:900}.feedback span{font-size:45px}.race-progress{position:absolute;right:22px;bottom:18px;width:min(390px,35%);padding:13px;border-radius:20px;color:#fff;background:rgba(6,26,61,.9);font-weight:900}.progress-bar{height:15px;margin-top:8px;overflow:hidden;border-radius:99px;background:#071a36}.progress-bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,#71e632,#ffe54b);transition:width .5s}
.end .trophy{font-size:86px}.end h2{font-size:48px;margin:5px}.place{font-size:28px;font-weight:1000;color:#6b3ad5}.results{margin:22px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.result{padding:14px 8px;border-radius:16px;background:#edf5ff;font-weight:800}.result strong{display:block;font-size:25px}.end button{width:100%;min-height:64px;border:0;border-radius:18px;color:#fff;cursor:pointer;font-size:20px;font-weight:1000;background:linear-gradient(145deg,#7653ff,#4d31bc)}
@media(max-width:780px){.shell{padding:72px 8px 8px}.hud{top:62px;left:8px}.hud-pill{min-height:40px;padding:0 10px;font-size:12px}.game{min-height:720px}.sky-title{min-width:230px;font-size:20px}.question-card{top:76px;min-height:102px;font-size:42px}.answers{top:194px;grid-template-columns:repeat(2,1fr);gap:10px}.answer{min-height:75px;font-size:34px}.track{inset:370px 0 0;padding:13px 8px 120px}.lane{height:65px}.car{width:68px;height:48px;font-size:23px}.lane-name{left:78px;top:21px;font-size:11px}.feedback{left:10px;right:10px;bottom:68px;min-width:0;font-size:15px}.race-progress{right:10px;bottom:10px;width:calc(100% - 20px)}.results{grid-template-columns:1fr}}
</style>
</head>
<body>
<a class="back" href="/he/games/workspace/">🏰 חזרה למפה</a>
<div class="hud"><div class="hud-pill">⭐ <span id="score">0</span></div><div class="hud-pill">🎯 <span id="roundText">0 / 10</span></div></div>
<main class="shell"><section class="card">
<div id="startScreen" class="start"><div class="hero">🏎️</div><h1>מרוץ החשבון</h1><p>ענו נכון ומהר כדי להגיע ראשונים לקו הסיום!</p><div class="label">בחרו כיתה</div><div class="choice-grid" id="gradeChoices"><button class="choice selected" data-grade="1">כיתה א׳</button><button class="choice" data-grade="2">כיתה ב׳</button></div><div class="label">בחרו רמת קושי</div><div class="choice-grid" id="levelChoices"><button class="choice selected" data-level="1">🙂 קל</button><button class="choice" data-level="2">😎 בינוני</button><button class="choice" data-level="3">🤓 קשה</button><button class="choice" data-level="0">🎲 אקראי</button></div><button class="start-btn" id="startBtn">התחל מרוץ! 🏁</button></div>
<div id="gameScreen" class="game" hidden><div class="sky-title">פתרו את התרגיל!</div><div id="question" class="question-card">12 + 8 = ?</div><div id="answers" class="answers"></div><div class="track"><div class="finish"></div><div class="lane"><div id="carPlayer" class="car player">1</div><div class="lane-name">אתם</div></div><div class="lane"><div id="carBot1" class="car bot1">2</div><div class="lane-name">סילון</div></div><div class="lane"><div id="carBot2" class="car bot2">3</div><div class="lane-name">ברק</div></div><div class="lane"><div id="carBot3" class="car bot3">4</div><div class="lane-name">טורבו</div></div></div><div class="feedback"><span id="feedbackRobot">🤖</span><div id="feedbackText">בהצלחה! ענו נכון ומהר.</div></div><div class="race-progress"><div>ההתקדמות שלך</div><div class="progress-bar"><i id="playerProgress"></i></div></div></div>
<div id="endScreen" class="end" hidden><div class="trophy" id="endEmoji">🏆</div><h2>המרוץ הסתיים!</h2><div class="place" id="placeText">מקום ראשון!</div><div class="results"><div class="result"><strong id="endScore">0</strong>נקודות</div><div class="result"><strong id="endAccuracy">0%</strong>דיוק</div><div class="result"><strong id="endTime">0</strong>שניות</div></div><button onclick="location.reload()">שחק שוב 🔁</button><div id="shareSlot"></div></div>
</section></main>
<script src="../game-sdk.js"></script>
<script>
const TOTAL=10;let selectedGrade=1,selectedLevel=1,game=null,round=0,scoreValue=0,correct=0,currentQuestion=null,questionStartedAt=0,raceStartedAt=0,locked=false;const positions={player:2,bot1:2,bot2:2,bot3:2};const botProfiles={bot1:{accuracy:.78,speed:.83},bot2:{accuracy:.72,speed:.74},bot3:{accuracy:.84,speed:.66}};
IAKidsCoins.mount();IAKidsHelp.mount({slug:'math-race',how:'בכל סיבוב מופיע תרגיל וארבע תשובות. תשובה נכונה מזיזה את המכונית קדימה. תשובה מהירה מעניקה התקדמות גדולה יותר.',example:'<b>12 + 8 = 20</b> — לחצו על 20 והמכונית תזנק קדימה!'});
function selectButtons(containerId,dataKey,onSelect){const host=document.getElementById(containerId);host.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{host.querySelectorAll('button').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');onSelect(Number(btn.dataset[dataKey]))}))}selectButtons('gradeChoices','grade',v=>selectedGrade=v);selectButtons('levelChoices','level',v=>selectedLevel=v);startBtn.addEventListener('click',startRace);
async function startRace(){game=await IAKidsGame.init('math-race');IAKidsActivity.configure({difficulty:selectedLevel||1,questionsCount:TOTAL,metadata:{grade:selectedGrade,selected_level:selectedLevel,random_difficulty:selectedLevel===0,game_mode:'car_race'}});raceStartedAt=Date.now();startScreen.hidden=true;gameScreen.hidden=false;nextQuestion()}
function levelForRound(){return selectedLevel===0?1+Math.floor(Math.random()*3):selectedLevel}
function makeQuestion(){const level=levelForRound();let a,b,answer,text;if(selectedGrade===1){if(level===1){a=rand(1,10);b=rand(1,10);answer=a+b;text=`${a} + ${b} = ?`}else if(level===2){if(Math.random()<.5){a=rand(5,20);b=rand(1,a);answer=a-b;text=`${a} − ${b} = ?`}else{a=rand(5,15);b=rand(1,20-a);answer=a+b;text=`${a} + ${b} = ?`}}else{if(Math.random()<.5){answer=rand(4,20);a=rand(1,answer-1);text=`${a} + ? = ${answer}`}else{a=rand(8,20);answer=rand(1,a-1);text=`${a} − ? = ${answer}`}}}else{if(level===1){a=rand(10,50);b=rand(1,20);answer=a+b;text=`${a} + ${b} = ?`}else if(level===2){if(Math.random()<.5){a=rand(25,99);b=rand(5,a-1);answer=a-b;text=`${a} − ${b} = ?`}else{a=rand(10,70);b=rand(5,99-a);answer=a+b;text=`${a} + ${b} = ?`}}else{const mode=Math.floor(Math.random()*3);if(mode===0){a=rand(2,10);b=rand(2,5);answer=a*b;text=`${a} × ${b} = ?`}else if(mode===1){answer=rand(10,90);a=rand(1,answer-1);text=`${a} + ? = ${answer}`}else{a=rand(30,99);answer=rand(5,a-5);text=`${a} − ? = ${answer}`}}}return{text,answer,options:makeOptions(answer)}}
function makeOptions(answer){const set=new Set([answer]),spread=answer<=20?4:Math.max(6,Math.round(answer*.12));while(set.size<4){const candidate=answer+rand(-spread,spread);if(candidate<0||candidate===answer)continue;set.add(candidate)}return shuffle([...set])}
function nextQuestion(){if(round>=TOTAL)return finishRace();round++;locked=false;currentQuestion=makeQuestion();questionStartedAt=Date.now();roundText.textContent=`${round} / ${TOTAL}`;question.textContent=currentQuestion.text;feedbackText.textContent='בחרו את התשובה הנכונה!';feedbackRobot.textContent='🤖';IAKidsActivity.questionStarted();answers.innerHTML='';currentQuestion.options.forEach(value=>{const btn=document.createElement('button');btn.className='answer';btn.textContent=value;btn.onclick=()=>answerQuestion(value,btn);answers.appendChild(btn)})}
function answerQuestion(value,button){if(locked)return;locked=true;const elapsed=Date.now()-questionStartedAt;answers.querySelectorAll('button').forEach(b=>b.disabled=true);if(value===currentQuestion.answer){correct++;scoreValue+=10;button.classList.add('correct');IAKidsActivity.correct();IAKidsFX.correct(button);IAKidsCoins.right(button);const boost=elapsed<2500?10:elapsed<4500?8:6;moveCar('player',boost);feedbackText.textContent=elapsed<2500?'מהיר ומדויק! זינוק ענק!':'נכון! המכונית מתקדמת.';feedbackRobot.textContent='✅'}else{button.classList.add('wrong');IAKidsActivity.wrong();IAKidsFX.wrong(button);IAKidsCoins.wrong();const correctButton=[...answers.children].find(b=>Number(b.textContent)===currentQuestion.answer);if(correctButton)correctButton.classList.add('correct');feedbackText.textContent=`כמעט! התשובה היא ${currentQuestion.answer}.`;feedbackRobot.textContent='💡'}score.textContent=scoreValue;moveBots(elapsed);setTimeout(nextQuestion,1100)}
function moveBots(playerTime){Object.entries(botProfiles).forEach(([key,p])=>{const levelFactor=(selectedLevel||2)*.035,correctChance=Math.min(.96,p.accuracy+levelFactor),speedFactor=p.speed+Math.max(0,(5500-playerTime)/18000),move=Math.random()<correctChance?5+Math.round(speedFactor*5):1;moveCar(key,move)})}
function moveCar(key,amount){positions[key]=Math.min(91,positions[key]+amount);const el={player:carPlayer,bot1:carBot1,bot2:carBot2,bot3:carBot3}[key];el.style.left=positions[key]+'%';el.classList.add('boost');setTimeout(()=>el.classList.remove('boost'),260);if(key==='player')playerProgress.style.width=Math.min(100,(positions.player/91)*100)+'%'}
async function finishRace(){const duration=Math.round((Date.now()-raceStartedAt)/1000),ranking=Object.entries(positions).sort((a,b)=>b[1]-a[1]).map(x=>x[0]),place=ranking.indexOf('player')+1,accuracy=Math.round((correct/TOTAL)*100);gameScreen.hidden=true;endScreen.hidden=false;endScore.textContent=scoreValue;endAccuracy.textContent=accuracy+'%';endTime.textContent=duration;placeText.textContent=place===1?'מקום ראשון! 🥇':`מקום ${place}`;endEmoji.textContent=place===1?'🏆':place===2?'🥈':place===3?'🥉':'🏁';await game.saveScore(scoreValue,{grade:selectedGrade,level:selectedLevel,place});game.shareButton(scoreValue,shareSlot);await game.complete(scoreValue,{maxScore:TOTAL*10,performanceScore:accuracy,metadata:{grade:selectedGrade,selected_level:selectedLevel,total_rounds:TOTAL,correct_answers:correct,final_place:place,race_positions:positions,duration_seconds_client:duration}})}
function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
</script>
</body>
</html>
