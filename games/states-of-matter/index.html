<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מצבי צבירה | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>.chip{align-items:center;background:var(--accent-soft);border:3px solid var(--accent);border-radius:16px;cursor:grab;display:inline-flex;flex-direction:column;justify-content:center;margin:6px;min-height:76px;min-width:72px;padding:6px 8px;text-align:center;touch-action:none}
.chip .e{font-size:2rem;line-height:1.1}
.chip .n{font-size:0.8rem;font-weight:700}.chip.dragging{box-shadow:var(--shadow);cursor:grabbing;pointer-events:none;position:fixed;z-index:30}#tray{align-items:center;display:flex;flex-wrap:wrap;justify-content:center;min-height:96px}.bins{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr;margin-top:12px}.drop-zone h3{font-size:1rem;margin:0 0 6px}.bin-items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:34px}.bin-items span{background:var(--green);border-radius:10px;color:#fff;font-size:1.3rem;font-weight:700;padding:4px 8px}
</style>

<style>.game-card{width:min(520px,calc(100vw - 28px))!important}.game-title{font-size:clamp(2.15rem,7vw,3.2rem)!important}#howto{max-width:390px}#rounds-label{color:#fff;font-weight:900;margin:8px 0 10px}#tray{align-content:center;background:rgba(4,22,55,.5);border:1px solid rgba(116,177,255,.18);border-radius:22px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:210px;padding:14px 10px}.chip{align-items:center;background:linear-gradient(180deg,#1c4e8d,#123b73);border:1px solid rgba(129,190,255,.35);border-radius:15px;box-shadow:0 9px 19px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.12);color:#fff;cursor:grab;display:inline-flex;flex-direction:column;justify-content:center;margin:0;min-height:84px;min-width:108px;padding:9px 12px;position:relative;touch-action:none;user-select:none}
.chip .e{font-size:2rem;line-height:1.1}.chip .n{font-size:.88rem;font-weight:900;margin-top:4px;text-align:center}.chip.dragging{box-shadow:0 18px 40px rgba(0,0,0,.36);cursor:grabbing;pointer-events:none;position:fixed;transform:scale(1.05);z-index:100}.bins{display:grid;gap:10px;grid-template-columns:repeat(3,1fr);margin-top:16px}.drop-zone{background:linear-gradient(180deg,rgba(18,69,124,.48),rgba(5,31,69,.64));border:2px dashed rgba(106,189,255,.56);border-radius:20px;min-height:170px;padding:12px 8px;transition:.2s ease}.drop-zone.over{background:rgba(35,185,111,.18);border-color:#5dffad;transform:scale(1.015)}.drop-zone h3{color:#fff;font-size:1rem;margin:0 0 10px;text-align:center}.bin-items{align-content:flex-start;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:70px}.bin-items span{background:linear-gradient(180deg,#26bd76,#15995b);border-radius:10px;color:#fff;font-size:1.25rem;font-weight:900;padding:7px 9px}
@media(max-width:600px){#start-screen,#play-screen,#end-screen{padding:26px 16px 24px}.chip{min-width:calc(50% - 6px)}
  .bins{grid-template-columns:1fr}.drop-zone{min-height:118px}
}
</style>
</head>
<body class="theme-space">

<div class="game-hud">
  <span class="score"><span id="score-label">ניקוד</span>: <span id="score">0</span></span>
  <span><span id="q-label">פריט</span> <span id="qnum">1</span>/<span id="qtotal">10</span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div style="font-size:4rem">🧊💧💨</div>
    <h1 class="game-title" id="title"></h1>
    <p id="howto"></p>
    <p id="rounds-label"></p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)"></button>
      <button class="game-btn" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div id="tray"></div>
    <div class="bins">
      <div class="drop-zone" data-state="solid"><h3>🧊 מוצק</h3><div class="bin-items"></div></div>
      <div class="drop-zone" data-state="liquid"><h3>💧 נוזל</h3><div class="bin-items"></div></div>
      <div class="drop-zone" data-state="gas"><h3>💨 גז</h3><div class="bin-items"></div></div>
    </div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>

<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);

const T_REGULAR = {
  title:{he:'מצבי צבירה',en:'States of Matter'},
  howto:{he:'גררו כל חומר לתיבה הנכונה: מוצק, נוזל או גז.',en:'Drag each substance to solid, liquid or gas!'},
  rounds:{he:'כמה חומרים למיין?',en:'How many substances?'}
};
const T_NIQQUD = {
  title:{he:'מַצְּבֵי צְבִירָה',en:'States of Matter'},
  howto:{he:'גִּרְרוּ כָּל חֹמֶר לַתֵּבָה הַנְּכוֹנָה: מוּצָק, נוֹזֵל אוֹ גַּז.',en:'Drag each substance to solid, liquid or gas!'},
  rounds:{he:'כַּמָּה חֳמָרִים לְמַיֵּן?',en:'How many substances?'}
};

const BANK_REGULAR = [
  {e:'🧊',n:'קרח',state:'solid',tier:1},{e:'🪨',n:'אבן',state:'solid',tier:1},
  {e:'🔩',n:'ברזל',state:'solid',tier:1},{e:'🪵',n:'בול עץ',state:'solid',tier:1},
  {e:'🪑',n:'כיסא',state:'solid',tier:1},{e:'📖',n:'ספר',state:'solid',tier:1},
  {e:'❄️',n:'שלג',state:'solid',tier:1},{e:'🪙',n:'מטבע',state:'solid',tier:1},
  {e:'💧',n:'מים',state:'liquid',tier:1},{e:'🥛',n:'חלב',state:'liquid',tier:1},
  {e:'🧃',n:'מיץ',state:'liquid',tier:1},{e:'🛢️',n:'שמן',state:'liquid',tier:1},
  {e:'☕',n:'תה',state:'liquid',tier:1},{e:'🌬️',n:'אוויר',state:'gas',tier:1},
  {e:'♨️',n:'אדים',state:'gas',tier:1},{e:'💨',n:'עשן',state:'gas',tier:1},
  {e:'🍯',n:'דבש',state:'liquid',tier:2},{e:'🏖️',n:'חול',state:'solid',tier:2},
  {e:'🔥',n:'קרח שמחממים',state:'liquid',tier:3},{e:'🧊',n:'מים שמקפיאים',state:'solid',tier:3},
  {e:'♨️',n:'מים שמרתיחים',state:'gas',tier:3},{e:'☁️',n:'אדים שמתקררים',state:'liquid',tier:3},
  {e:'🧱',n:'לבנה',state:'solid',tier:1},{e:'🥄',n:'כפית',state:'solid',tier:1},
  {e:'🔑',n:'מפתח',state:'solid',tier:1},{e:'🍎',n:'תפוח',state:'solid',tier:1},
  {e:'🥕',n:'גזר',state:'solid',tier:1},{e:'🧸',n:'דובי',state:'solid',tier:1},
  {e:'💎',n:'יהלום',state:'solid',tier:1},{e:'🦴',n:'עצם',state:'solid',tier:1},
  {e:'🍬',n:'סוכרייה',state:'solid',tier:1},{e:'⚽',n:'כדור',state:'solid',tier:1},
  {e:'🍫',n:'שוקולד',state:'solid',tier:1},{e:'🧂',n:'מלח',state:'solid',tier:2},
  {e:'🍚',n:'אורז',state:'solid',tier:2},{e:'🌾',n:'קמח',state:'solid',tier:2},
  {e:'🧴',n:'שמפו',state:'liquid',tier:1},{e:'☕',n:'קפה',state:'liquid',tier:1},
  {e:'🌊',n:'מי ים',state:'liquid',tier:1},{e:'🥣',n:'מרק',state:'liquid',tier:1},
  {e:'🍋',n:'מיץ לימון',state:'liquid',tier:1},{e:'🚿',n:'מים מהמקלחת',state:'liquid',tier:1},
  {e:'🌧️',n:'טיפות גשם',state:'liquid',tier:1},{e:'🫧',n:'סבון נוזלי',state:'liquid',tier:1},
  {e:'🩸',n:'דם',state:'liquid',tier:2},{e:'💦',n:'זיעה',state:'liquid',tier:2},
  {e:'🧴',n:'שמן שיזוף',state:'liquid',tier:2},
  {e:'💨',n:'רוח',state:'gas',tier:1},{e:'🫁',n:'אוויר בריאות',state:'gas',tier:1},
  {e:'🎈',n:'אוויר בבלון',state:'gas',tier:1},{e:'🚗',n:'עשן ממכונית',state:'gas',tier:1},
  {e:'🎈',n:'הליום בבלון',state:'gas',tier:2},{e:'🧴',n:'ריח בושם באוויר',state:'gas',tier:2},
  {e:'🥤',n:'בועות בסודה',state:'gas',tier:2},
  {e:'🍫',n:'שוקולד שנמס בשמש',state:'liquid',tier:3},{e:'🕯️',n:'שעווה של נר דולק',state:'liquid',tier:3},
  {e:'🧈',n:'חמאה במחבת חמה',state:'liquid',tier:3},{e:'🌨️',n:'ברד',state:'solid',tier:3},
  {e:'🧊',n:'מיץ במקפיא',state:'solid',tier:3},{e:'☀️',n:'שלג ביום חם',state:'liquid',tier:3},
  {e:'🫖',n:'אדים מקומקום',state:'gas',tier:3},
];
const BANK_NIQQUD = BANK_REGULAR.map(x => ({...x}));
Object.assign(BANK_NIQQUD[0],{n:'קֶרַח'});Object.assign(BANK_NIQQUD[1],{n:'אֶבֶן'});
Object.assign(BANK_NIQQUD[2],{n:'בַּרְזֶל'});Object.assign(BANK_NIQQUD[3],{n:'בּוּל עֵץ'});
Object.assign(BANK_NIQQUD[4],{n:'כִּסֵּא'});Object.assign(BANK_NIQQUD[5],{n:'סֵפֶר'});
Object.assign(BANK_NIQQUD[6],{n:'שֶׁלֶג'});Object.assign(BANK_NIQQUD[7],{n:'מַטְבֵּעַ'});
Object.assign(BANK_NIQQUD[8],{n:'מַיִם'});Object.assign(BANK_NIQQUD[9],{n:'חָלָב'});
Object.assign(BANK_NIQQUD[10],{n:'מִיץ'});Object.assign(BANK_NIQQUD[11],{n:'שֶׁמֶן'});
Object.assign(BANK_NIQQUD[12],{n:'תֵּה'});Object.assign(BANK_NIQQUD[13],{n:'אֲוִיר'});
Object.assign(BANK_NIQQUD[14],{n:'אֵדִים'});Object.assign(BANK_NIQQUD[15],{n:'עָשָׁן'});
Object.assign(BANK_NIQQUD[16],{n:'דְּבַשׁ'});Object.assign(BANK_NIQQUD[17],{n:'חוֹל'});
Object.assign(BANK_NIQQUD[18],{n:'קֶרַח שֶׁמְּחַמְּמִים'});Object.assign(BANK_NIQQUD[19],{n:'מַיִם שֶׁמַּקְפִּיאִים'});
Object.assign(BANK_NIQQUD[20],{n:'מַיִם שֶׁמַּרְתִּיחִים'});Object.assign(BANK_NIQQUD[21],{n:'אֵדִים שֶׁמִּתְקָרְרִים'});

let CHILD_AGE=null, USE_NIQQUD=false, T=T_REGULAR, BANK=BANK_REGULAR;
let game,diff,level=1,TOTAL=10,score=0,sorted=0,mistakes=0,ending=false,drag=null;

async function loadKidContext(){
  try{
    const kidId=localStorage.getItem('active_kid_id');
    if(!kidId) return;
    const client=await IAKidsActivity._getClient();
    const {data,error}=await client.from('kids_profiles').select('id, age').eq('id',kidId).maybeSingle();
    if(error||!data) return;
    CHILD_AGE=Number(data.age);
    USE_NIQQUD=CHILD_AGE===1||CHILD_AGE===2;
  }catch(error){console.warn('[states-of-matter] kid context error',error);}
}

function applyLanguage(){
  T=USE_NIQQUD?T_NIQQUD:T_REGULAR;
  BANK=USE_NIQQUD?BANK_NIQQUD:BANK_REGULAR;
  $('title').textContent=IAKidsLang.t(T.title);
  $('howto').textContent=IAKidsLang.t(T.howto);
  $('rounds-label').textContent=IAKidsLang.t(T.rounds);
  $('score-label').textContent=IAKidsLang.ui('score');
  $('best-label').textContent=IAKidsLang.ui('your_best');
  $('again-btn').textContent=IAKidsLang.ui('play_again');
  document.querySelector('[data-state="solid"] h3').textContent=USE_NIQQUD?'🧊 מוּצָק':'🧊 מוצק';
  document.querySelector('[data-state="liquid"] h3').textContent=USE_NIQQUD?'💧 נוֹזֵל':'💧 נוזל';
  document.querySelector('[data-state="gas"] h3').textContent=USE_NIQQUD?'💨 גַּז':'💨 גז';
  ['level_easy','level_medium','level_hard','level_random'].forEach((k,i)=>
    document.querySelectorAll('#level-row .game-btn')[i].textContent=IAKidsLang.ui(k));
}

IAKidsCoins.mount();
IAKidsHelp.mount({
  slug:'states-of-matter',
  how:'לכל חומר יש מצב צבירה: מוצק, נוזל או גז. גררו כל פריט לתיבה המתאימה.',
  example:'🧊 קרח ← מוצק · 💧 מים ← נוזל · ♨️ אדים ← גז'
});

function setRounds(n,btn){
  TOTAL=n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b=>b.classList.remove('success'));
  btn.classList.add('success');
}

const ready=(async()=>{
  await loadKidContext();
  applyLanguage();
  game=await IAKidsGame.init('states-of-matter');
  const p=await game.loadProgress();
  if(p?.rounds) setRounds(p.rounds,document.querySelector(`#rounds-row [onclick*="(${p.rounds},"]`)||$('rounds-row').children[1]);
  if(p?.lastLevel!=null) document.querySelector(`#level-row [data-lvl="${p.lastLevel}"]`)?.classList.add('success');
})();

const show=id=>['start-screen','play-screen','end-screen'].forEach(s=>$(s).hidden=s!==id);

async function start(lvl){
  await ready;
  level=lvl; diff=game.difficulty(lvl||1,3); score=0; sorted=0; mistakes=0; ending=false;
  $('score').textContent='0'; $('qnum').textContent='1'; $('qtotal').textContent=TOTAL;
  document.querySelectorAll('.bin-items').forEach(x=>x.innerHTML='');
  IAKidsActivity.configure({
    difficulty:lvl||1,questionsCount:TOTAL,
    metadata:{game_mode:'states-of-matter',selected_level:lvl,random_difficulty:lvl===0,child_age:CHILD_AGE,uses_niqqud:USE_NIQQUD}
  });
  await game.saveProgress({lastLevel:lvl,rounds:TOTAL});
  show('play-screen');
  await fillTray();
}

function makeItem(lvl){
  if(lvl===0) lvl=1+rnd(3);
  const pool=BANK.filter(x=>x.tier<=lvl),x=pool[rnd(pool.length)];
  return {text:x.e+'|'+x.n,state:x.state};
}

async function fillTray(){
  const tray=$('tray');
  while(tray.querySelectorAll('.chip').length<Math.min(4,TOTAL-sorted)){
    const lvl=level===0?1+rnd(3):diff.level;
    const q=await game.newQuestion(()=>makeItem(lvl),x=>x.text);
    const [e,n]=q.text.split('|');
    const chip=document.createElement('div');
    chip.className='chip';chip.innerHTML=`<span class="e">${e}</span><span class="n">${n}</span>`;
    chip.dataset.state=q.state;makeDraggable(chip);tray.appendChild(chip);
  }
}

function makeDraggable(chip){
  chip.addEventListener('pointerdown',e=>{
    if(drag||ending)return;e.preventDefault();chip.setPointerCapture(e.pointerId);
    const r=chip.getBoundingClientRect();drag={chip,dx:e.clientX-r.left,dy:e.clientY-r.top};
    chip.style.width=r.width+'px';chip.classList.add('dragging');moveTo(e);
  });
  chip.addEventListener('pointermove',e=>{if(drag?.chip===chip)moveTo(e)});
  chip.addEventListener('pointerup',e=>{if(drag?.chip===chip)dropChip(e)});
  chip.addEventListener('pointercancel',()=>{if(drag?.chip===chip){settle(chip);drag=null;unmarkZones()}});
}
function moveTo(e){
  drag.chip.style.left=(e.clientX-drag.dx)+'px';drag.chip.style.top=(e.clientY-drag.dy)+'px';
  const z=zoneAt(e.clientX,e.clientY);
  document.querySelectorAll('.drop-zone').forEach(zn=>zn.classList.toggle('over',zn===z));
}
const zoneAt=(x,y)=>document.elementFromPoint(x,y)?.closest('.drop-zone')||null;
const unmarkZones=()=>document.querySelectorAll('.drop-zone').forEach(z=>z.classList.remove('over'));
function settle(chip){chip.classList.remove('dragging');chip.style.left=chip.style.top=chip.style.width='';}

async function dropChip(e){
  const z=zoneAt(e.clientX,e.clientY);unmarkZones();
  const chip=drag.chip;drag=null;settle(chip);if(!z||ending)return;
  const correct=z.dataset.state===chip.dataset.state;
  if(correct){
    score+=10;sorted++;$('score').textContent=score;$('qnum').textContent=Math.min(sorted+1,TOTAL);
    diff.right();IAKidsActivity.correct();IAKidsFX.correct(z);await IAKidsCoins.right(z);
    const s=document.createElement('span');s.textContent=chip.querySelector('.e').textContent;
    z.querySelector('.bin-items').appendChild(s);chip.remove();
    if(sorted>=TOTAL){await end();return}
    await fillTray();
  }else{
    mistakes++;diff.wrong();IAKidsActivity.wrong();IAKidsFX.wrong(chip);await IAKidsCoins.wrong();
  }
}

async function end(){
  if(ending)return;ending=true;
  const maxScore=TOTAL*10;
  await game.saveScore(score,{level,mistakes});
  const top=(await game.getHighScores(1))[0];
  $('final-score').textContent=score;$('best').textContent=top?.score??score;
  $('player-line').textContent=`${top?.player||IAKidsLang.ui('guest')} · ${new Date().toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'})}`;
  const accuracy=TOTAL/(TOTAL+mistakes);
  $('stars').textContent='⭐'.repeat(accuracy>=.9?3:accuracy>=.7?2:1);
  await game.complete(score,{
    maxScore,
    performanceScore:Math.round(accuracy*100),
    metadata:{
      game_mode:'states-of-matter',selected_level:level,random_difficulty:level===0,
      total_rounds:TOTAL,mistakes,sorted_items:sorted,child_age:CHILD_AGE,uses_niqqud:USE_NIQQUD
    }
  });
  game.shareButton(score,$('share-slot'));
  show('end-screen');
}
</script>

</body>
</html>
