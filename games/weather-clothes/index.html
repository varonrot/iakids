<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מזג אוויר ולבוש | iakids</title>

<link rel="stylesheet" href="../game-style.css?v=0eea1d9b">

<style>.game-card{width:min(470px,calc(100vw - 28px))!important}.game-title{font-size:clamp(2.15rem,7vw,3.2rem)!important}#howto{max-width:360px}/* PLAY */.play-heading{align-items:center;display:flex;gap:14px;justify-content:center;margin-bottom:12px}#weather-display{filter:drop-shadow(0 10px 14px rgba(0,0,0,.2));font-size:4.5rem;line-height:1;margin:0;text-align:center}#weather-label{color:#fff;font-size:1.45rem;font-weight:900;text-align:center}#progress-note{background:rgba(5,22,54,.5);border:1px solid rgba(120,181,255,.2);border-radius:999px;color:#d9e8ff;font-weight:800;margin:0 auto 18px;max-width:100%;padding:7px 14px;width:max-content}.wardrobe-title{color:#fff;font-size:1rem;margin:0 0 8px;text-align:center}#tray{align-content:center;background:rgba(4,22,55,.5);border:1px solid rgba(116,177,255,.18);border-radius:22px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:180px;padding:14px 10px}.chip{align-items:center;background:linear-gradient(180deg,#1c4e8d,#123b73);border:1px solid rgba(129,190,255,.35);border-radius:15px;box-shadow:0 9px 19px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.12);color:#fff;cursor:grab;display:inline-flex;font-size:1rem;font-weight:900;justify-content:center;margin:0;min-height:56px;min-width:122px;padding:9px 14px;position:relative;touch-action:none;user-select:none;white-space:nowrap}.chip.dragging{box-shadow:0 18px 40px rgba(0,0,0,.36);cursor:grabbing;pointer-events:none;position:fixed;transform:scale(1.05);z-index:100}#suitcase{background:linear-gradient(180deg,rgba(18,69,124,.48),rgba(5,31,69,.64));border:2px dashed rgba(106,189,255,.56);border-radius:22px;margin-top:18px;min-height:142px;padding:14px;transition:.2s ease}#suitcase.over{background:rgba(35,185,111,.18);border-color:#5dffad;transform:scale(1.015)}#suitcase h3{font-size:1.2rem;margin:0 0 10px;text-align:center}#suitcase-items{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:48px}#suitcase-items span{background:linear-gradient(180deg,#26bd76,#15995b);border-radius:11px;color:#fff;font-size:.95rem;font-weight:900;padding:7px 12px}/* END */

@media(max-width:600px){#start-screen,#play-screen,#end-screen{padding:26px 18px 24px}.chip{font-size:.92rem;min-width:calc(50% - 6px)}#tray{min-height:210px}
}
</style>
</head>

<body class="theme-space">

<div class="game-hud">
  <span class="score">
    <span id="score-label">ניקוד</span>:
    <span id="score">0</span>
  </span>

  <span>
    <span id="q-label">שאלה</span>
    <span id="qnum">1</span>/<span id="qtotal">10</span>
  </span>
</div>

<div class="game-card" id="card">

  <div id="start-screen">
    <div class="hero-icon">🧳🌦️</div>

    <h1 class="game-title" id="title"></h1>

    <p id="howto"></p>

    <p class="section-label" id="rounds-label"></p>

    <div
      class="answer-grid"
      style="grid-template-columns:repeat(3,1fr)"
      id="rounds-row"
    >
      <button
        class="game-btn outline"
        onclick="setRounds(5,this)"
      >5</button>

      <button
        class="game-btn outline success"
        onclick="setRounds(10,this)"
      >10</button>

      <button
        class="game-btn outline"
        onclick="setRounds(15,this)"
      >15</button>
    </div>

    <p class="section-label">בחרו רמת קושי</p>

    <div
      class="answer-grid"
      style="grid-template-columns:1fr 1fr"
      id="level-row"
    >
      <button
        class="game-btn secondary"
        data-lvl="1"
        onclick="start(1)"
      ></button>

      <button
        class="game-btn secondary"
        data-lvl="2"
        onclick="start(2)"
      ></button>

      <button
        class="game-btn secondary"
        data-lvl="3"
        onclick="start(3)"
      ></button>

      <button
        class="game-btn"
        data-lvl="0"
        onclick="start(0)"
      ></button>
    </div>
  </div>

  <div id="play-screen" hidden>

    <div class="play-heading">
      <div id="weather-display"></div>
      <div id="weather-label"></div>
    </div>

    <div id="progress-note"></div>

    <h3 class="wardrobe-title">גררו בגדים מתאימים למזוודה</h3>

    <div id="tray"></div>

    <div class="drop-zone" id="suitcase">
      <h3>🧳 <span id="suitcase-label">המזוודה</span></h3>
      <div id="suitcase-items"></div>
    </div>

  </div>

  <div id="end-screen" class="end-screen" hidden>

    <div class="stars" id="stars"></div>

    <div class="big-score" id="final-score"></div>

    <p id="player-line"></p>

    <p>
      <span id="best-label"></span>:
      <b id="best"></b>
    </p>

    <button
      class="game-btn"
      id="again-btn"
      onclick="location.reload()"
    ></button>

    <div id="share-slot"></div>

  </div>

</div>

<script src="nikud.js?v=132761cf"></script>
<script src="../game-sdk.js?v=09f6afe2"></script>

<script>
const $ =
  id =>
    document.getElementById(id);

const rnd =
  n =>
    Math.floor(
      Math.random() * n
    );

const T_REGULAR = {
  title: {
    he: 'מזג אוויר ולבוש',
    en: 'Weather & Clothes'
  },

  howto: {
    he: 'ראו מה מזג האוויר וגררו למזוודה בגדים שמתאימים לו.',
    en: 'See the weather and drag matching clothes into the suitcase.'
  },

  rounds: {
    he: 'כמה סבבים?',
    en: 'How many rounds?'
  },

  suitcase: {
    he: 'המזוודה',
    en: 'The suitcase'
  }
};

const T_NIQQUD = {
  title: {
    he: 'מֶזֶג אֲוִיר וּלְבוּשׁ',
    en: 'Weather & Clothes'
  },

  howto: {
    he: 'רְאוּ מָה מֶזֶג הָאֲוִיר וְגִרְרוּ לַמִּזְוָדָה בְּגָדִים שֶׁמַּתְאִימִים לוֹ.',
    en: 'See the weather and drag matching clothes into the suitcase.'
  },

  rounds: {
    he: 'כַּמָּה סְבָבִים?',
    en: 'How many rounds?'
  },

  suitcase: {
    he: 'הַמִּזְוָדָה',
    en: 'The suitcase'
  }
};

const WEATHER_REGULAR = {
  hot: {
    emoji: '☀️',
    label: 'קיץ חם',
    temp: [27,36]
  },

  cold: {
    emoji: '❄️',
    label: 'חורף קר',
    temp: [2,13]
  },

  mild: {
    emoji: '🍂',
    label: 'סתיו נעים',
    temp: [16,23]
  },

  rainy: {
    emoji: '🌧️',
    label: 'יום גשום',
    temp: null
  }
};

const WEATHER_NIQQUD = {
  hot: {
    emoji: '☀️',
    label: 'קַיִץ חַם',
    temp: [27,36]
  },

  cold: {
    emoji: '❄️',
    label: 'חוֹרֶף קַר',
    temp: [2,13]
  },

  mild: {
    emoji: '🍂',
    label: 'סְתָיו נָעִים',
    temp: [16,23]
  },

  rainy: {
    emoji: '🌧️',
    label: 'יוֹם גָּשׁוּם',
    temp: null
  }
};

const BANK_REGULAR = [
  { text:'👕 חולצת קיץ', w:['hot'] },
  { text:'🩳 מכנסיים קצרים', w:['hot'] },
  { text:'👒 כובע שמש', w:['hot'] },
  { text:'🕶️ משקפי שמש', w:['hot'] },
  { text:'👡 סנדלים', w:['hot'] },
  { text:'🩱 בגד ים', w:['hot'] },

  { text:'🧥 מעיל חורף כבד', w:['cold'] },
  { text:'🧶 כובע צמר', w:['cold'] },
  { text:'🧣 צעיף', w:['cold'] },
  { text:'🧤 כפפות', w:['cold'] },
  { text:'👢 מגפיים חמים', w:['cold','rainy'] },
  { text:'🧶 סוודר', w:['cold','mild'] },

  { text:'👖 מכנסיים ארוכים', w:['cold','mild','rainy'] },
  { text:'🌂 מעיל גשם', w:['rainy'] },
  { text:'☂️ מטרייה', w:['rainy'] },
  { text:'🥾 מגפי גומי', w:['rainy'] },

  { text:'🧥 ג׳קט קליל', w:['mild'] },
  { text:'👔 חולצה עם שרוול ארוך', w:['mild','cold'] }
];

const BANK_NIQQUD = [
  { text:'👕 חֻלְצַת קַיִץ', w:['hot'] },
  { text:'🩳 מִכְנָסַיִם קְצָרִים', w:['hot'] },
  { text:'👒 כּוֹבַע שֶׁמֶשׁ', w:['hot'] },
  { text:'🕶️ מִשְׁקְפֵי שֶׁמֶשׁ', w:['hot'] },
  { text:'👡 סַנְדָּלִים', w:['hot'] },
  { text:'🩱 בֶּגֶד יָם', w:['hot'] },

  { text:'🧥 מְעִיל חוֹרֶף כָּבֵד', w:['cold'] },
  { text:'🧶 כּוֹבַע צֶמֶר', w:['cold'] },
  { text:'🧣 צָעִיף', w:['cold'] },
  { text:'🧤 כְּפָפוֹת', w:['cold'] },
  { text:'👢 מַגָּפַיִם חַמִּים', w:['cold','rainy'] },
  { text:'🧶 סְוֶדֶר', w:['cold','mild'] },

  { text:'👖 מִכְנָסַיִם אֲרֻכִּים', w:['cold','mild','rainy'] },
  { text:'🌂 מְעִיל גֶּשֶׁם', w:['rainy'] },
  { text:'☂️ מִטְרִיָּה', w:['rainy'] },
  { text:'🥾 מַגְּפֵי גּוּמִי', w:['rainy'] },

  { text:'🧥 ז׳ָקֶט קַל', w:['mild'] },
  { text:'👔 חֻלְצָה עִם שַׁרְווּל אָרֹךְ', w:['mild','cold'] }
];

const POOL = {
  1:['hot','cold'],
  2:['hot','cold','mild','rainy'],
  3:['hot','mild','cold']
};

const MIN_CORRECT = 2;

let CHILD_AGE = null;
let USE_NIQQUD = false;

let T = T_REGULAR;
let WEATHER = WEATHER_REGULAR;
let BANK = BANK_REGULAR;

let game;
let diff;
let level = 1;
let TOTAL = 10;
let score = 0;
let qnum = 0;
let mistakes = 0;

let currentType;
let correctCount = 0;
let advancing = false;
let ending = false;

async function loadKidContext() {
  try {
    const kidId =
      localStorage.getItem(
        'active_kid_id'
      );

    if (!kidId) return;

    const client =
      await IAKidsActivity._getClient();

    const {
      data,
      error
    } =
      await client
        .from('kids_profiles')
        .select('id, age')
        .eq('id',kidId)
        .maybeSingle();

    if (error || !data) {
      console.warn(
        '[weather-clothes] Kid profile was not loaded',
        error
      );

      return;
    }

    CHILD_AGE =
      Number(data.age);

    USE_NIQQUD = IAKidsNikud.enabled;   // the pill in the start screen, not a dead age test

  } catch(error) {
    console.warn(
      '[weather-clothes] loadKidContext error',
      error
    );
  }
}

function applyLanguage() {
  T =
    USE_NIQQUD
      ? T_NIQQUD
      : T_REGULAR;

  WEATHER =
    USE_NIQQUD
      ? WEATHER_NIQQUD
      : WEATHER_REGULAR;

  BANK =
    USE_NIQQUD
      ? BANK_NIQQUD
      : BANK_REGULAR;

  $('title').textContent =
    IAKidsLang.t(T.title);

  $('howto').textContent =
    IAKidsLang.t(T.howto);

  $('rounds-label').textContent =
    IAKidsLang.t(T.rounds);

  $('score-label').textContent =
    IAKidsLang.ui('score');

  $('q-label').textContent =
    IAKidsLang.ui('question');

  $('best-label').textContent =
    IAKidsLang.ui('your_best');

  $('again-btn').textContent =
    IAKidsLang.ui('play_again');

  $('suitcase-label').textContent =
    IAKidsLang.t(T.suitcase);

  [
    'level_easy',
    'level_medium',
    'level_hard',
    'level_random'
  ].forEach(
    (key,index) => {
      document
        .querySelectorAll(
          '#level-row .game-btn'
        )[index]
        .textContent =
          IAKidsLang.ui(key);
    }
  );
}

IAKidsCoins.mount();

IAKidsHelp.mount({
  slug:'weather-clothes',

  how:
    'רואים את מזג האוויר וגוררים למזוודה בגדים שמתאימים. צריך למצוא שני בגדים מתאימים כדי לעבור לסבב הבא.',

  example:
    '☀️ קיץ חם ← <b>👕 חולצת קיץ</b> ו־<b>🩳 מכנסיים קצרים</b>.'
});

function setRounds(n,button) {
  TOTAL = n;

  document
    .querySelectorAll(
      '#rounds-row .game-btn'
    )
    .forEach(
      item =>
        item.classList.remove(
          'success'
        )
    );

  button.classList.add(
    'success'
  );
}

const ready =
  (async () => {
    await loadKidContext();

    applyLanguage();

    game =
      await IAKidsGame.init(
        'weather-clothes'
      );

    const progress =
      await game.loadProgress();

    if (progress?.rounds) {
      const button =
        document.querySelector(
          `#rounds-row [onclick*="(${progress.rounds},"]`
        ) ||
        $('rounds-row').children[1];

      setRounds(
        progress.rounds,
        button
      );
    }

    if (
      progress?.lastLevel !==
      undefined
    ) {
      document
        .querySelector(
          `#level-row [data-lvl="${progress.lastLevel}"]`
        )
        ?.classList.add(
          'success'
        );
    }
  })();

const show =
  id => {
    [
      'start-screen',
      'play-screen',
      'end-screen'
    ].forEach(
      screen =>
        $(screen).hidden =
          screen !== id
    );
  };

async function start(selectedLevel) {
  await ready;

  level =
    selectedLevel;

  diff =
    game.difficulty(
      selectedLevel || 1,
      3
    );

  score = 0;
  qnum = 0;
  mistakes = 0;
  ending = false;

  $('score').textContent =
    '0';

  $('qnum').textContent =
    '1';

  $('qtotal').textContent =
    TOTAL;

  IAKidsActivity.configure({
    difficulty:
      selectedLevel || 1,

    questionsCount:
      TOTAL,

    metadata: {
      game_mode:
        'weather-clothes',

      selected_level:
        selectedLevel,

      random_difficulty:
        selectedLevel === 0,

      child_age:
        CHILD_AGE,

      uses_niqqud:
        USE_NIQQUD,

      required_correct_clothes:
        MIN_CORRECT
    }
  });

  await game.saveProgress({
    lastLevel:
      selectedLevel,

    rounds:
      TOTAL
  });

  show('play-screen');

  await next();
}

function pickTemp(type) {
  const [minimum,maximum] =
    WEATHER[type].temp;

  return (
    minimum +
    rnd(
      maximum -
      minimum +
      1
    )
  );
}

async function next() {
  advancing = false;

  if (qnum >= TOTAL) {
    await end();
    return;
  }

  qnum += 1;

  $('qnum').textContent =
    qnum;

  const currentLevel =
    level === 0
      ? 1 + rnd(3)
      : diff.level;

  const pool =
    POOL[currentLevel];

  const question =
    await game.newQuestion(
      () => {
        const type =
          pool[
            rnd(pool.length)
          ];

        return {
          type,

          showTemp:
            currentLevel === 3,

          temp:
            currentLevel === 3
              ? pickTemp(type)
              : null
        };
      },

      item =>
        `${item.type}-${item.temp}`
    );

  currentType =
    question.type;

  correctCount = 0;

  IAKidsActivity.questionStarted();

  if (question.showTemp) {
    $('weather-display').textContent =
      '🌡️';

    $('weather-label').innerHTML =
      `<span dir="ltr">${question.temp}°C</span>`;
  } else {
    $('weather-display').textContent =
      WEATHER[
        question.type
      ].emoji;

    $('weather-label').textContent =
      WEATHER[
        question.type
      ].label;
  }

  updateProgress();

  $('suitcase-items').innerHTML =
    '';

  fillWardrobe(
    question.type
  );
}

function updateProgress() {
  const regular =
    `${correctCount}/${MIN_CORRECT} בגדים נכונים`;

  const niqqud =
    `${correctCount}/${MIN_CORRECT} בְּגָדִים נְכוֹנִים`;

  $('progress-note').textContent =
    USE_NIQQUD
      ? niqqud
      : regular;
}

function shuffled(items) {
  return [...items].sort(
    () =>
      Math.random() - .5
  );
}

function fillWardrobe(type) {
  const correct =
    shuffled(
      BANK.filter(
        item =>
          item.w.includes(type)
      )
    ).slice(0,4);

  const wrong =
    shuffled(
      BANK.filter(
        item =>
          !item.w.includes(type)
      )
    ).slice(0,3);

  const items =
    shuffled([
      ...correct,
      ...wrong
    ]);

  const tray =
    $('tray');

  tray.innerHTML =
    '';

  items.forEach(
    item => {
      const chip =
        document.createElement(
          'div'
        );

      chip.className =
        'chip';

      chip.textContent =
        item.text;

      chip.dataset.ok =
        item.w.includes(type)
          ? '1'
          : '0';

      makeDraggable(chip);

      tray.appendChild(chip);
    }
  );
}

/* Pointer Events drag: desktop + touch */
let drag = null;

function makeDraggable(chip) {
  chip.addEventListener(
    'pointerdown',
    event => {
      if (drag || advancing) {
        return;
      }

      event.preventDefault();

      chip.setPointerCapture(
        event.pointerId
      );

      const rect =
        chip.getBoundingClientRect();

      drag = {
        chip,

        dx:
          event.clientX -
          rect.left,

        dy:
          event.clientY -
          rect.top
      };

      chip.style.width =
        `${rect.width}px`;

      chip.classList.add(
        'dragging'
      );

      moveTo(event);
    }
  );

  chip.addEventListener(
    'pointermove',
    event => {
      if (
        drag?.chip === chip
      ) {
        moveTo(event);
      }
    }
  );

  chip.addEventListener(
    'pointerup',
    event => {
      if (
        drag?.chip === chip
      ) {
        dropChip(event);
      }
    }
  );

  chip.addEventListener(
    'pointercancel',
    () => {
      if (
        drag?.chip === chip
      ) {
        settle(chip);
        drag = null;
        unmarkZones();
      }
    }
  );
}

function moveTo(event) {
  drag.chip.style.left =
    `${
      event.clientX -
      drag.dx
    }px`;

  drag.chip.style.top =
    `${
      event.clientY -
      drag.dy
    }px`;

  const zone =
    zoneAt(
      event.clientX,
      event.clientY
    );

  document
    .querySelectorAll(
      '.drop-zone'
    )
    .forEach(
      item =>
        item.classList.toggle(
          'over',
          item === zone
        )
    );
}

const zoneAt =
  (x,y) =>
    document
      .elementFromPoint(x,y)
      ?.closest(
        '.drop-zone'
      ) ||
    null;

const unmarkZones =
  () =>
    document
      .querySelectorAll(
        '.drop-zone'
      )
      .forEach(
        item =>
          item.classList.remove(
            'over'
          )
      );

function settle(chip) {
  chip.classList.remove(
    'dragging'
  );

  chip.style.left =
    '';

  chip.style.top =
    '';

  chip.style.width =
    '';
}

async function dropChip(event) {
  const zone =
    zoneAt(
      event.clientX,
      event.clientY
    );

  unmarkZones();

  const chip =
    drag.chip;

  drag = null;

  settle(chip);

  if (
    !zone ||
    zone.id !== 'suitcase' ||
    advancing
  ) {
    return;
  }

  if (
    chip.dataset.ok === '1'
  ) {
    score += 10;
    correctCount += 1;

    $('score').textContent =
      score;

    updateProgress();

    diff.right();

    IAKidsFX.correct(zone);

    await IAKidsCoins.right(
      zone
    );

    const selected =
      document.createElement(
        'span'
      );

    selected.textContent =
      chip.textContent;

    $('suitcase-items')
      .appendChild(
        selected
      );

    chip.remove();

    if (
      correctCount >=
      MIN_CORRECT
    ) {
      advancing = true;

      /*
       * כל סבב נחשב כשאלה אחת.
       * לכן מסמנים correct פעם אחת בלבד,
       * ולא פעם אחת לכל פריט לבוש.
       */
      IAKidsActivity.correct();

      if (
        qnum >= TOTAL
      ) {
        setTimeout(
          () => {
            end();
          },
          520
        );

        return;
      }

      setTimeout(
        () => {
          next();
        },
        650
      );
    }

  } else {
    mistakes += 1;

    diff.wrong();

    IAKidsActivity.wrong();

    IAKidsFX.wrong(chip);

    await IAKidsCoins.wrong();
  }
}

async function end() {
  if (ending) return;

  ending = true;
  advancing = true;

  const maxScore =
    TOTAL *
    MIN_CORRECT *
    10;

  await game.saveScore(
    score,
    {
      level,
      mistakes
    }
  );

  const top =
    (
      await game.getHighScores(1)
    )[0];

  $('final-score').textContent =
    score;

  $('best').textContent =
    top?.score ?? score;

  $('player-line').textContent =
    `${
      top?.player ||
      IAKidsLang.ui('guest')
    } · ${
      new Date()
        .toLocaleString(
          'he-IL',
          {
            dateStyle:'short',
            timeStyle:'short'
          }
        )
    }`;

  const accuracy =
    TOTAL /
    (
      TOTAL +
      mistakes
    );

  $('stars').textContent =
    '⭐'.repeat(
      accuracy >= .85
        ? 3
        : accuracy >= .6
          ? 2
          : 1
    );

  /*
   * קודם סוגרים את הסשן בטבלה,
   * ורק לאחר שהשמירה הצליחה מציגים סיום.
   */
  await game.complete(
    score,
    {
      maxScore,

      performanceScore:
        Math.round(
          accuracy * 100
        ),

      metadata: {
        game_mode:
          'weather-clothes',

        selected_level:
          level,

        random_difficulty:
          level === 0,

        total_rounds:
          TOTAL,

        mistakes,

        correct_rounds:
          TOTAL,

        required_correct_clothes:
          MIN_CORRECT,

        child_age:
          CHILD_AGE,

        uses_niqqud:
          USE_NIQQUD
      }
    }
  );

  game.shareButton(
    score,
    $('share-slot')
  );

  show('end-screen');
}
</script>
