<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מזג אוויר ולבוש | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:56px;padding:8px 12px;margin:6px;background:var(--accent-soft);border:3px solid var(--accent);border-radius:16px;font-size:1.15rem;font-weight:700;cursor:grab;touch-action:none;white-space:nowrap}
.chip.dragging{position:fixed;z-index:30;pointer-events:none;cursor:grabbing;box-shadow:var(--shadow)}
#tray{min-height:90px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
#weather-display{font-size:3.2rem;text-align:center;margin:6px 0}
#weather-label{font-size:1.2rem;font-weight:800;text-align:center;color:var(--text);margin-bottom:6px}
#progress-note{text-align:center;color:var(--muted);font-weight:700;margin-bottom:6px}
#suitcase{min-height:100px;margin-top:10px}
#suitcase h3{margin:0 0 6px;font-size:1.15rem;text-align:center}
#suitcase-items{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:34px}
#suitcase-items span{background:var(--green);color:#fff;border-radius:10px;padding:6px 12px;font-weight:700;font-size:1rem}
</style>
</head>
<body>

<div class="game-hud">
  <span class="score"><span id="score-label">ניקוד</span>: <span id="score">0</span></span>
  <span><span id="q-label">שאלה</span> <span id="qnum">1</span>/<span id="qtotal">10</span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div style="font-size:4rem">🧳</div>
    <h1 class="game-title" id="title"></h1>
    <p id="howto"></p>
    <p id="rounds-label"></p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)"></button>
      <button class="game-btn" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div id="weather-display"></div>
    <div id="weather-label"></div>
    <div id="progress-note"></div>
    <div id="tray"></div>
    <div class="drop-zone" id="suitcase">
      <h3>🧳 <span id="suitcase-label">המזוודה</span></h3>
      <div id="suitcase-items"></div>
    </div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>
<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);

const T = {
  title:  { he: 'מזג אוויר ולבוש', en: 'Weather & Clothes' },
  howto:  { he: 'תראו איזה מזג אוויר יש, וגררו מהארון למזוודה בגדים שמתאימים!', en: 'See the weather, drag matching clothes into the suitcase!' },
  rounds: { he: 'כמה תנאי מזג אוויר?', en: 'How many weather rounds?' },
  suitcase: { he: 'המזוודה', en: 'The suitcase' },
};

// weather categories: emoji+label shown normally; hard level shows a temperature number instead
const WEATHER = {
  hot:   { emoji: '☀️', label: 'קיץ חם',    temp: [27, 36] },
  cold:  { emoji: '❄️', label: 'חורף קר',   temp: [2, 13] },
  mild:  { emoji: '🍂', label: 'סתיו נעים', temp: [16, 23] },
  rainy: { emoji: '🌧️', label: 'יום גשום',  temp: null },
};

// clothing bank — each item tagged with the weather types it suits (several can be valid per weather)
const BANK = [
  { text: '👕 חולצת קיץ',        w: ['hot'] },
  { text: '🩳 מכנסיים קצרים',    w: ['hot'] },
  { text: '👒 כובע שמש',         w: ['hot'] },
  { text: '🕶️ משקפי שמש',       w: ['hot'] },
  { text: '👡 סנדלים',           w: ['hot'] },
  { text: '🩱 בגד ים',           w: ['hot'] },
  { text: '🧥 מעיל חורף כבד',    w: ['cold'] },
  { text: '🧶 כובע צמר',         w: ['cold'] },
  { text: '🧣 צעיף',             w: ['cold'] },
  { text: '🧤 כפפות',            w: ['cold'] },
  { text: '👢 מגפיים חמים',      w: ['cold', 'rainy'] },
  { text: '🧶 סוודר',            w: ['cold', 'mild'] },
  { text: '👖 מכנסיים ארוכים',   w: ['cold', 'mild', 'rainy'] },
  { text: '🌂 מעיל גשם',         w: ['rainy'] },
  { text: '☂️ מטריה',            w: ['rainy'] },
  { text: '🥾 מגפי גומי',        w: ['rainy'] },
  { text: '🧥 ג׳קט קליל',        w: ['mild'] },
  { text: '👔 חולצה שרוול ארוך', w: ['mild', 'cold'] },
];

const POOL = { 1: ['hot', 'cold'], 2: ['hot', 'cold', 'mild', 'rainy'], 3: ['hot', 'mild', 'cold'] };
const MIN_CORRECT = 2;

IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'weather-clothes',
  how: 'רואים איזה מזג אוויר יש היום, וגוררים מהארון למזוודה בגדים שמתאימים למזג האוויר הזה. צריך למצוא לפחות 2 בגדים נכונים כדי לעבור למזג אוויר הבא!',
  example: '☀️ קיץ חם ← <b>👕 חולצת קיץ</b>, <b>🩳 מכנסיים קצרים</b> (לא 🧥 מעיל חורף!)',
});
$('title').textContent = IAKidsLang.t(T.title);
$('howto').textContent = IAKidsLang.t(T.howto);
$('rounds-label').textContent = IAKidsLang.t(T.rounds);
$('score-label').textContent = IAKidsLang.ui('score');
$('best-label').textContent = IAKidsLang.ui('your_best');
$('again-btn').textContent = IAKidsLang.ui('play_again');
$('suitcase-label').textContent = IAKidsLang.t(T.suitcase);
['level_easy', 'level_medium', 'level_hard', 'level_random'].forEach((k, i) =>
  document.querySelectorAll('#level-row .game-btn')[i].textContent = IAKidsLang.ui(k));

let game, diff, level = 1, TOTAL = 10, score = 0, qnum = 0, mistakes = 0;
let currentType, correctCount, advancing = false;

function setRounds(n, btn) {
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.remove('success'));
  btn.classList.add('success');
}

const ready = IAKidsGame.init('weather-clothes').then(async g => {
  game = g;
  const p = await g.loadProgress();
  if (p?.rounds) setRounds(p.rounds, document.querySelector(`#rounds-row [onclick*="(${p.rounds},"]`) || $('rounds-row').children[1]);
  if (p?.lastLevel != null) document.querySelector(`#level-row [data-lvl="${p.lastLevel}"]`)?.classList.add('success');
});

const show = id => {
  for (const s of ['start-screen', 'play-screen', 'end-screen']) $(s).hidden = s !== id;
};

async function start(lvl) {
  await ready;
  level = lvl;
  diff = game.difficulty(lvl || 1, 3);
  await game.saveProgress({ lastLevel: lvl, rounds: TOTAL });
  $('qtotal').textContent = TOTAL;
  show('play-screen');
  await next();
}

function pickTemp(type) {
  const [lo, hi] = WEATHER[type].temp;
  return lo + rnd(hi - lo + 1);
}

async function next() {
  advancing = false;
  if (qnum >= TOTAL) return end();
  qnum++;
  $('qnum').textContent = qnum;
  const lvl = level === 0 ? 1 + rnd(3) : diff.level;
  const pool = POOL[lvl];
  const q = await game.newQuestion(() => {
    const type = pool[rnd(pool.length)];
    return { type, showTemp: lvl === 3, temp: lvl === 3 ? pickTemp(type) : null };
  }, x => x.type + '-' + x.temp);
  currentType = q.type;
  correctCount = 0;
  if (q.showTemp) {
    $('weather-display').textContent = '🌡️';
    $('weather-label').innerHTML = `<span dir="ltr">${q.temp}°C</span>`;
  } else {
    $('weather-display').textContent = WEATHER[q.type].emoji;
    $('weather-label').textContent = WEATHER[q.type].label;
  }
  $('progress-note').textContent = `${correctCount}/${MIN_CORRECT} בגדים נכונים`;
  $('suitcase-items').innerHTML = '';
  fillWardrobe(q.type);
}

function fillWardrobe(type) {
  const correct = BANK.filter(i => i.w.includes(type)).sort(() => Math.random() - 0.5).slice(0, 4);
  const wrong = BANK.filter(i => !i.w.includes(type)).sort(() => Math.random() - 0.5).slice(0, 3);
  const items = correct.concat(wrong).sort(() => Math.random() - 0.5);
  const tray = $('tray');
  tray.innerHTML = '';
  items.forEach(item => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = item.text;
    chip.dataset.ok = item.w.includes(type) ? '1' : '0';
    makeDraggable(chip);
    tray.appendChild(chip);
  });
}

/* ---- Pointer Events drag (works on touch — setPointerCapture, not HTML5 DnD) ---- */
let drag = null;
function makeDraggable(chip) {
  chip.addEventListener('pointerdown', e => {
    if (drag) return;
    e.preventDefault();
    chip.setPointerCapture(e.pointerId);
    const r = chip.getBoundingClientRect();
    drag = { chip, dx: e.clientX - r.left, dy: e.clientY - r.top };
    chip.style.width = r.width + 'px';
    chip.classList.add('dragging');
    moveTo(e);
  });
  chip.addEventListener('pointermove', e => { if (drag?.chip === chip) moveTo(e); });
  chip.addEventListener('pointerup', e => { if (drag?.chip === chip) dropChip(e); });
  chip.addEventListener('pointercancel', () => {
    if (drag?.chip === chip) { settle(chip); drag = null; unmarkZones(); }
  });
}
function moveTo(e) {
  drag.chip.style.left = (e.clientX - drag.dx) + 'px';
  drag.chip.style.top = (e.clientY - drag.dy) + 'px';
  const z = zoneAt(e.clientX, e.clientY);
  document.querySelectorAll('.drop-zone').forEach(zn => zn.classList.toggle('over', zn === z));
}
const zoneAt = (x, y) => document.elementFromPoint(x, y)?.closest('.drop-zone') || null;
const unmarkZones = () => document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('over'));
function settle(chip) {
  chip.classList.remove('dragging');
  chip.style.left = chip.style.top = chip.style.width = '';
}

async function dropChip(e) {
  const z = zoneAt(e.clientX, e.clientY);
  unmarkZones();
  const chip = drag.chip;
  drag = null;
  settle(chip);
  if (!z || z.id !== 'suitcase' || advancing) return;
  if (chip.dataset.ok === '1') {
    score += 10;
    correctCount++;
    $('score').textContent = score;
    $('progress-note').textContent = `${correctCount}/${MIN_CORRECT} בגדים נכונים`;
    diff.right();
    IAKidsFX.correct(z);
    IAKidsCoins.right(z);
    const s = document.createElement('span');
    s.textContent = chip.textContent;
    $('suitcase-items').appendChild(s);
    chip.remove();
    if (correctCount >= MIN_CORRECT) {
      advancing = true;
      if (qnum >= TOTAL) return setTimeout(end, 500);
      setTimeout(next, 600);
    }
  } else {
    mistakes++;
    diff.wrong();
    IAKidsFX.wrong(chip);
    IAKidsCoins.wrong();
  }
}

async function end() {
  await game.saveScore(score, { level, mistakes });
  const top = (await game.getHighScores(1))[0];
  $('final-score').textContent = score;
  $('best').textContent = top?.score ?? score;
  $('player-line').textContent = `${top?.player || IAKidsLang.ui('guest')} · ${new Date().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}`;
  const acc = TOTAL / (TOTAL + mistakes);
  $('stars').textContent = '⭐'.repeat(acc >= 0.85 ? 3 : acc >= 0.6 ? 2 : 1);
  game.shareButton(score, $('share-slot'));
  show('end-screen');
  game.complete(score);
}
</script>
</body>
</html>
