<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טורף או צמחוני | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>
.chip{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:74px;min-height:74px;padding:6px 10px;margin:6px;background:var(--accent-soft);border:3px solid var(--accent);border-radius:16px;cursor:grab;touch-action:none}
.chip .emoji{font-size:2rem}
.chip .name{font-size:.8rem;font-weight:700}
.chip.dragging{position:fixed;z-index:30;pointer-events:none;cursor:grabbing;box-shadow:var(--shadow)}
#tray{min-height:100px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.bins{display:grid;gap:10px;margin-top:12px}
.bins.n2{grid-template-columns:1fr 1fr}
.bins.n3{grid-template-columns:1fr 1fr 1fr}
.drop-zone h3{margin:0 0 6px;font-size:1.05rem}
.bin-items{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:34px}
.bin-items span{font-size:1.4rem}
</style>
</head>
<body>

<div class="game-hud">
  <span class="score"><span id="score-label">ניקוד</span>: <span id="score">0</span></span>
  <span><span id="q-label">חיה</span> <span id="qnum">1</span>/<span id="qtotal">10</span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div style="font-size:4rem">🦁</div>
    <h1 class="game-title" id="title"></h1>
    <p id="howto"></p>
    <p id="rounds-label"></p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)"></button>
      <button class="game-btn" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div id="tray"></div>
    <div class="bins" id="bins"></div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>
<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);

// verified diet classification. tier = difficulty. diet: carn (meat only) / herb (plants only) / omni (both — hard level only)
const ANIMALS = [
  // tier 1 — obvious
  { name: 'אריה', emoji: '🦁', diet: 'carn', tier: 1 },
  { name: 'נמר', emoji: '🐅', diet: 'carn', tier: 1 },
  { name: 'זאב', emoji: '🐺', diet: 'carn', tier: 1 },
  { name: 'כריש', emoji: '🦈', diet: 'carn', tier: 1 },
  { name: 'פרה', emoji: '🐄', diet: 'herb', tier: 1 },
  { name: 'סוס', emoji: '🐴', diet: 'herb', tier: 1 },
  { name: 'פיל', emoji: '🐘', diet: 'herb', tier: 1 },
  { name: 'ארנב', emoji: '🐇', diet: 'herb', tier: 1 },
  { name: 'כבשה', emoji: '🐑', diet: 'herb', tier: 1 },
  // tier 2 — medium
  { name: 'דוב קוטב', emoji: '🐻‍❄️', diet: 'carn', tier: 2 },
  { name: 'נשר', emoji: '🦅', diet: 'carn', tier: 2 },
  { name: 'תנין', emoji: '🐊', diet: 'carn', tier: 2 },
  { name: 'נחש', emoji: '🐍', diet: 'carn', tier: 2 },
  { name: 'ג\'ירפה', emoji: '🦒', diet: 'herb', tier: 2 },
  { name: 'איילה', emoji: '🦌', diet: 'herb', tier: 2 },
  { name: 'זברה', emoji: '🦓', diet: 'herb', tier: 2 },
  { name: 'גורילה', emoji: '🦍', diet: 'herb', tier: 2 },
  { name: 'קואלה', emoji: '🐨', diet: 'herb', tier: 2 },
  // tier 3 — hard: trickier + true omnivores (need the 3rd bin)
  { name: 'ינשוף', emoji: '🦉', diet: 'carn', tier: 3 },
  { name: 'עכביש', emoji: '🕷️', diet: 'carn', tier: 3 },
  { name: 'קנגורו', emoji: '🦘', diet: 'herb', tier: 3 },
  { name: 'דוב חום', emoji: '🐻', diet: 'omni', tier: 3 },
  { name: 'שימפנזה', emoji: '🐵', diet: 'omni', tier: 3 },
  { name: 'חזיר', emoji: '🐷', diet: 'omni', tier: 3 },
  { name: 'שועל', emoji: '🦊', diet: 'omni', tier: 3 },
  { name: 'תרנגולת', emoji: '🐔', diet: 'omni', tier: 3 },
  { name: 'רקון', emoji: '🦝', diet: 'omni', tier: 3 },
];

const BIN_LABEL = {
  carn: { he: 'טורף 🥩', en: 'Carnivore 🥩' },
  herb: { he: 'צמחוני 🥕', en: 'Herbivore 🥕' },
  omni: { he: 'אוכל-כל 🍽️', en: 'Omnivore 🍽️' },
};
const T = {
  title:  { he: 'טורף או צמחוני', en: 'Carnivore or Herbivore' },
  howto:  { he: 'גרור כל חיה לתיבה הנכונה, לפי מה שהיא אוכלת!', en: 'Drag each animal to the bin matching its diet!' },
  rounds: { he: 'כמה חיות למיין?', en: 'How many animals?' },
};
IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'carnivore-herbivore',
  how: 'לכל חיה יש תזונה משלה. גוררים אותה לתיבה הנכונה: טורף אוכל בעלי חיים אחרים, צמחוני אוכל רק צמחים. ברמה הקשה יש גם תיבת אוכל-כל, לחיות שאוכלות גם וגם.',
  example: '<span>🦁</span> אריה אוכל בשר ← <b>טורף</b> · <span>🐄</span> פרה אוכלת עשב ← <b>צמחוני</b>',
});
$('title').textContent = IAKidsLang.t(T.title);
$('howto').textContent = IAKidsLang.t(T.howto);
$('rounds-label').textContent = IAKidsLang.t(T.rounds);
$('score-label').textContent = IAKidsLang.ui('score');
$('best-label').textContent = IAKidsLang.ui('your_best');
$('again-btn').textContent = IAKidsLang.ui('play_again');
['level_easy', 'level_medium', 'level_hard', 'level_random'].forEach((k, i) =>
  document.querySelectorAll('#level-row .game-btn')[i].textContent = IAKidsLang.ui(k));

let game, diff, level = 1, TOTAL = 10, score = 0, sorted = 0, mistakes = 0, numBins = 2;

function setRounds(n, btn) {
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.remove('success'));
  btn.classList.add('success');
}

const ready = IAKidsGame.init('carnivore-herbivore').then(async g => {
  game = g;
  const p = await g.loadProgress();
  if (p?.rounds) setRounds(p.rounds, document.querySelector(`#rounds-row [onclick*="(${p.rounds},"]`) || $('rounds-row').children[1]);
  if (p?.lastLevel != null) document.querySelector(`#level-row [data-lvl="${p.lastLevel}"]`)?.classList.add('success');
});

const show = id => { for (const s of ['start-screen', 'play-screen', 'end-screen']) $(s).hidden = s !== id; };

async function start(lvl) {
  await ready;
  level = lvl;
  diff = game.difficulty(lvl || 1, 3);
  await game.saveProgress({ lastLevel: lvl, rounds: TOTAL });
  $('qtotal').textContent = TOTAL;

  // hard level (or 🎲 random, which can roll hard questions) needs the 3rd omnivore bin
  numBins = (level === 3 || level === 0) ? 3 : 2;
  const diets = numBins === 3 ? ['carn', 'herb', 'omni'] : ['carn', 'herb'];
  const binsEl = $('bins');
  binsEl.className = 'bins n' + numBins;
  binsEl.innerHTML = diets.map(d => `<div class="drop-zone" data-diet="${d}"><h3>${IAKidsLang.t(BIN_LABEL[d])}</h3><div class="bin-items"></div></div>`).join('');

  show('play-screen');
  await fillTray();
}

function pickAnimal(lvl) {
  let pool = ANIMALS.filter(a => a.tier === lvl);
  if (numBins === 2) pool = pool.filter(a => a.diet !== 'omni');
  return pool[rnd(pool.length)];
}

async function fillTray() {
  const tray = $('tray');
  while (tray.querySelectorAll('.chip').length < Math.min(4, TOTAL - sorted)) {
    const lvl = level === 0 ? 1 + rnd(3) : diff.level;
    const a = await game.newQuestion(() => pickAnimal(lvl), x => x.name);
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `<span class="emoji">${a.emoji}</span><span class="name">${a.name}</span>`;
    chip.dataset.diet = a.diet;
    makeDraggable(chip);
    tray.appendChild(chip);
  }
}

/* ---- Pointer Events drag (touch-friendly — same pattern as odd-even-sort) ---- */
let drag = null;
function makeDraggable(chip) {
  chip.addEventListener('pointerdown', e => {
    if (drag) return;
    e.preventDefault();
    chip.setPointerCapture(e.pointerId);
    const r = chip.getBoundingClientRect();
    drag = { chip, dx: e.clientX - r.left, dy: e.clientY - r.top };
    chip.style.width = r.width + 'px';
    chip.classList.add('dragging');
    moveTo(e);
  });
  chip.addEventListener('pointermove', e => { if (drag?.chip === chip) moveTo(e); });
  chip.addEventListener('pointerup', e => { if (drag?.chip === chip) dropChip(e); });
  chip.addEventListener('pointercancel', () => {
    if (drag?.chip === chip) { settle(chip); drag = null; unmarkZones(); }
  });
}
function moveTo(e) {
  drag.chip.style.left = (e.clientX - drag.dx) + 'px';
  drag.chip.style.top = (e.clientY - drag.dy) + 'px';
  const z = zoneAt(e.clientX, e.clientY);
  document.querySelectorAll('.drop-zone').forEach(zn => zn.classList.toggle('over', zn === z));
}
const zoneAt = (x, y) => document.elementFromPoint(x, y)?.closest('.drop-zone') || null;
const unmarkZones = () => document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('over'));
function settle(chip) {
  chip.classList.remove('dragging');
  chip.style.left = chip.style.top = chip.style.width = '';
}

async function dropChip(e) {
  const z = zoneAt(e.clientX, e.clientY);
  unmarkZones();
  const chip = drag.chip;
  drag = null;
  settle(chip);
  if (!z) return;
  const correct = z.dataset.diet === chip.dataset.diet;
  if (correct) {
    score += 10;
    sorted++;
    $('score').textContent = score;
    $('qnum').textContent = Math.min(sorted + 1, TOTAL);
    diff.right();
    IAKidsFX.correct(z);
    IAKidsCoins.right(z);
    const s = document.createElement('span');
    s.textContent = chip.querySelector('.emoji').textContent;
    z.querySelector('.bin-items').appendChild(s);
    chip.remove();
    if (sorted >= TOTAL) return end();
    await fillTray();
  } else {
    mistakes++;
    diff.wrong();
    IAKidsFX.wrong(chip);
    IAKidsCoins.wrong();
  }
}

async function end() {
  await game.saveScore(score, { level, mistakes });
  const top = (await game.getHighScores(1))[0];
  $('final-score').textContent = score;
  $('best').textContent = top?.score ?? score;
  $('player-line').textContent = `${top?.player || IAKidsLang.ui('guest')} · ${new Date().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}`;
  const acc = TOTAL / (TOTAL + mistakes);
  $('stars').textContent = '⭐'.repeat(acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : 1);
  game.shareButton(score, $('share-slot'));
  show('end-screen');
  game.complete(score);
}
</script>
</body>
</html>
