<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הפכים באנגלית | iakids</title>
<link rel="stylesheet" href="../game-style.css?v=0eea1d9b">
<style>
/* Shared dark space theme (body.theme-space in ../game-style.css); only this game's own widgets are styled here, tuned for the dark card. */
#board{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:12px}
.opp-col{display:flex;flex-direction:column;gap:10px}
.opp-card{color:#fff;background:linear-gradient(180deg,rgba(52,81,139,.95),rgba(21,49,99,.98));border:2px solid rgba(118,176,255,.5);border-radius:14px;padding:14px 8px;text-align:center;font-size:1.2rem;font-weight:800;cursor:pointer;touch-action:manipulation;transition:transform .15s}
.opp-card.selected{background:var(--space-gold);color:#102a4f;border-color:var(--space-gold);transform:scale(1.05)}
.opp-card.matched{background:linear-gradient(180deg,#37d182,#16ad64);border-color:rgba(97,255,174,.6);color:#fff;cursor:default;opacity:.8}
.opp-card.shake{animation:shake .4s}
</style>
</head>
<body class="theme-space">

<div class="game-hud">
  <span class="score"><span id="score-label">ניקוד</span>: <span id="score">0</span></span>
  <span><span id="pairs-label">זוגות</span> <span id="qnum">0</span>/<span id="qtotal">10</span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div class="hero-icon">↔️</div>
    <h1 class="game-title" id="title"></h1>
    <p id="howto"></p>
    <p class="section-label" id="rounds-label"></p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)"></button>
      <button class="game-btn" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div id="board"></div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="nikud.js?v=1e08edb4"></script>
<script src="../game-sdk.js?v=4b8fc616"></script>
<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);

const T = {
  title: { he: 'הפכים', en: 'Opposites' },
  howto: { he: 'טור מילים מימין וטור הפכים משמאל. לוחצים על מילה בכל טור כדי לבדוק אם הן זוג הפכים!', en: 'A word column and an opposites column. Tap one word in each column to check if they are opposites!' },
  rounds: { he: 'כמה זוגות למצוא?', en: 'How many pairs?' },
  newboard: { he: 'לוח חדש! ↔️', en: 'New board! ↔️' },
};
IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'opposites-en',
  how: 'לוחצים על מילה בטור הימני ואז על ההפך שלה בטור השמאלי (או להפך). זוג נכון ננעל בירוק, טעות מהבהבת באדום.',
  example: '<span dir="ltr"><b>Big</b></span> ← ↔️ → <span dir="ltr"><b>Small</b></span> — זה זוג הפכים!',
});
$('title').textContent = IAKidsLang.t(T.title);
$('howto').textContent = IAKidsLang.t(T.howto);
$('rounds-label').textContent = IAKidsLang.t(T.rounds);
$('score-label').textContent = IAKidsLang.ui('score');
$('pairs-label').textContent = IAKidsLang.ui('question') === 'שאלה' ? 'זוגות' : 'Pairs';
$('best-label').textContent = IAKidsLang.ui('your_best');
$('again-btn').textContent = IAKidsLang.ui('play_again');
['level_easy','level_medium','level_hard','level_random'].forEach((k,i) =>
  document.querySelectorAll('#level-row .game-btn')[i].textContent = IAKidsLang.ui(k));

// ---- content bank: verified English opposite pairs, all 42 words unique across the bank ----
const EASY = [ // sizes / basic physical adjectives
  ['Big', 'Small'], ['Tall', 'Short'], ['Heavy', 'Light'], ['Full', 'Empty'],
  ['Wide', 'Narrow'], ['Thick', 'Thin'], ['High', 'Low'],
  ['Near', 'Far'], ['Up', 'Down'], ['In', 'Out'], ['Left', 'Right'],
  ['Top', 'Bottom'], ['Front', 'Back'], ['Deep', 'Shallow'], ['Long', 'Brief'],
  ['Day', 'Night'], ['Black', 'White'], ['Boy', 'Girl'], ['Young', 'Elderly'],
];
const MEDIUM = [ // general descriptive adjectives
  ['Fast', 'Slow'], ['Hot', 'Cold'], ['Happy', 'Sad'], ['Old', 'New'],
  ['Clean', 'Dirty'], ['Easy', 'Hard'], ['Strong', 'Weak'],
  ['Wet', 'Dry'], ['Loud', 'Quiet'], ['Sweet', 'Sour'], ['Rich', 'Poor'],
  ['Early', 'Late'], ['Brave', 'Scared'], ['Kind', 'Mean'], ['Safe', 'Dangerous'],
  ['Cheap', 'Expensive'], ['True', 'False'], ['Same', 'Different'], ['Wild', 'Tame'],
  ['Smooth', 'Rough'], ['Tight', 'Loose'], ['Awake', 'Asleep'], ['Healthy', 'Sick'],
  ['Polite', 'Rude'], ['Bright', 'Dim'], ['Warm', 'Cool'], ['Soft', 'Firm'],
];
const HARD = [ // action verbs
  ['Open', 'Close'], ['Push', 'Pull'], ['Buy', 'Sell'], ['Give', 'Take'],
  ['Start', 'Stop'], ['Win', 'Lose'], ['Come', 'Go'],
  ['Laugh', 'Cry'], ['Sit', 'Stand'], ['Enter', 'Exit'], ['Arrive', 'Leave'],
  ['Remember', 'Forget'], ['Build', 'Destroy'], ['Catch', 'Throw'], ['Lend', 'Borrow'],
  ['Rise', 'Fall'], ['Ask', 'Answer'], ['Float', 'Sink'], ['Lock', 'Unlock'],
  ['Tie', 'Untie'], ['Pass', 'Fail'], ['Send', 'Receive'], ['Wake', 'Sleep'],
  ['Attack', 'Defend'], ['Accept', 'Refuse'], ['Appear', 'Disappear'], ['Increase', 'Decrease'],
];

function makeBoard(lvl) {
  const pool = lvl === 1 ? EASY : lvl === 2 ? MEDIUM : HARD;
  const nPairs = Math.min(pool.length, lvl === 1 ? 4 : lvl === 2 ? 5 : 6);
  const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, nPairs);
  return { pairs: shuffled, key: shuffled.map(p => p[0]).sort().join('|') + '#' + lvl };
}

let game, diff, level = 1, TOTAL = 10;
let score = 0, pairsDone = 0, boardLeft = 0, busy = false;
let selLeft = null, selRight = null;

function setRounds(n, btn) {
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.remove('success'));
  btn.classList.add('success');
}

const ready = IAKidsGame.init('opposites-en').then(async g => {
  game = g;
  const p = await g.loadProgress();
  if (p?.rounds) setRounds(p.rounds, document.querySelector(`#rounds-row [onclick*="(${p.rounds},"]`) || $('rounds-row').children[1]);
  if (p?.lastLevel != null) document.querySelector(`#level-row [data-lvl="${p.lastLevel}"]`)?.classList.add('success');
});

const show = id => { for (const s of ['start-screen', 'play-screen', 'end-screen']) $(s).hidden = s !== id; };

async function start(lvl) {
  await ready;
  level = lvl;
  diff = game.difficulty(lvl || 1, 3);
  await game.saveProgress({ lastLevel: lvl, rounds: TOTAL });
  $('qtotal').textContent = TOTAL;
  show('play-screen');
  await deal();
}

async function deal() {
  const lvl = level === 0 ? 1 + rnd(3) : diff.level;
  const board = await game.newQuestion(() => makeBoard(lvl), b => b.key);
  boardLeft = board.pairs.length;
  selLeft = null; selRight = null; busy = false;
  const lefts = board.pairs.map((p, i) => ({ word: p[0], pid: i }));
  const rights = board.pairs.map((p, i) => ({ word: p[1], pid: i }));
  for (const arr of [lefts, rights]) {
    for (let i = arr.length - 1; i > 0; i--) { const j = rnd(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  }
  const b = $('board');
  b.innerHTML = '';
  const colR = document.createElement('div'); colR.className = 'opp-col';
  const colL = document.createElement('div'); colL.className = 'opp-col';
  for (const item of rights) colR.appendChild(makeCard(item, 'right'));
  for (const item of lefts) colL.appendChild(makeCard(item, 'left'));
  b.appendChild(colR); b.appendChild(colL); // RTL: right column first visually
}

function makeCard(item, side) {
  const el = document.createElement('div');
  el.className = 'opp-card';
  el.dataset.pid = item.pid;
  el.dataset.side = side;
  el.innerHTML = `<span dir="ltr">${item.word}</span>`;
  el.addEventListener('click', () => tap(el));
  return el;
}

function tap(el) {
  if (busy || el.classList.contains('matched')) return;
  const side = el.dataset.side;
  const cur = side === 'left' ? selLeft : selRight;
  if (cur === el) { el.classList.remove('selected'); if (side === 'left') selLeft = null; else selRight = null; return; }
  if (cur) cur.classList.remove('selected');
  el.classList.add('selected');
  if (side === 'left') selLeft = el; else selRight = el;

  if (selLeft && selRight) {
    busy = true;
    const a = selLeft, b = selRight;
    if (a.dataset.pid === b.dataset.pid) {
      a.classList.add('matched'); b.classList.add('matched');
      a.classList.remove('selected'); b.classList.remove('selected');
      score += 10;
      pairsDone++;
      boardLeft--;
      $('score').textContent = score;
      $('qnum').textContent = pairsDone;
      diff.right();
      IAKidsFX.correct(b);
      IAKidsCoins.right(b);
      selLeft = null; selRight = null; busy = false;
      if (boardLeft === 0) {
        if (pairsDone >= TOTAL) return end();
        IAKidsFX.scorePop(IAKidsLang.t(T.newboard), $('board'));
        setTimeout(deal, 900);
      }
    } else {
      diff.wrong();
      IAKidsFX.wrong(b);
      IAKidsCoins.wrong();
      a.classList.add('shake'); b.classList.add('shake');
      setTimeout(() => {
        a.classList.remove('selected', 'shake'); b.classList.remove('selected', 'shake');
        selLeft = null; selRight = null; busy = false;
      }, 650);
    }
  }
}

async function end() {
  await game.saveScore(score, { level, pairs: pairsDone });
  const top = (await game.getHighScores(1))[0];
  $('final-score').textContent = score;
  $('best').textContent = top?.score ?? score;
  $('player-line').textContent = `${top?.player || IAKidsLang.ui('guest')} · ${new Date().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}`;
  $('stars').textContent = '⭐'.repeat(Math.max(1, Math.round(score / (TOTAL * 10) * 3)));
  game.shareButton(score, $('share-slot'));
  show('end-screen');
  game.complete(score);
}
</script>
</body>
</html>
