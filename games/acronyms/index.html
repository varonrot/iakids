<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ראשי תיבות | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>
:root{--space-bg:#06142d;--space-line:rgba(119,176,255,.27);--space-text:#f7f9ff;--space-muted:#b8c7e3;--space-gold:#ffd15c}
html,body{min-height:100%}
body{margin:0!important;min-height:100vh!important;padding:86px 18px 28px!important;overflow-x:hidden;color:var(--space-text)!important;font-family:"Heebo","Segoe UI",Arial,sans-serif!important;background:radial-gradient(circle at 12% 16%,rgba(26,139,255,.23),transparent 34%),radial-gradient(circle at 88% 10%,rgba(112,72,255,.25),transparent 35%),radial-gradient(circle at 50% 100%,rgba(12,184,203,.16),transparent 34%),linear-gradient(145deg,#050f25,#0a2148 52%,#07152e)!important}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.75) 0 1px,transparent 1.4px);background-size:56px 56px;opacity:.08}
*{box-sizing:border-box}
.game-card{width:min(500px,calc(100vw - 28px))!important;min-height:690px;margin:0 auto!important;padding:0!important;overflow:hidden;border:1px solid var(--space-line)!important;border-radius:28px!important;color:var(--space-text)!important;background:linear-gradient(180deg,rgba(17,58,111,.97),rgba(5,25,61,.98))!important;box-shadow:0 28px 75px rgba(0,8,28,.48),inset 0 1px rgba(255,255,255,.08)!important}
.game-hud{position:fixed!important;top:0!important;left:0!important;right:0!important;z-index:20;min-height:72px;padding:16px 24px!important;display:flex!important;align-items:center;justify-content:center!important;gap:42px;color:#fff!important;background:rgba(5,18,46,.88)!important;border-bottom:1px solid rgba(126,180,255,.18);backdrop-filter:blur(14px)}
.game-hud .score{color:var(--space-gold)!important}
#start-screen,#play-screen,#end-screen{min-height:688px;padding:34px 30px 30px}
#start-screen,#play-screen{display:flex;flex-direction:column;align-items:center;text-align:center}
.game-title{margin:0;font-size:clamp(2.1rem,7vw,3rem)!important;line-height:1.05;color:#fff!important;text-shadow:0 4px 12px rgba(0,0,0,.22)}
#start-screen p{max-width:410px;margin:10px auto;color:var(--space-muted)!important;font-weight:600;line-height:1.6}
.answer-grid{width:100%;gap:12px!important}
.game-btn{min-height:54px;border-radius:15px!important;border:1px solid rgba(118,176,255,.34)!important;color:#fff!important;font-weight:900!important;background:linear-gradient(180deg,#1c91db,#0877bd)!important;box-shadow:inset 0 1px rgba(255,255,255,.18),0 9px 20px rgba(0,0,0,.16)!important}
.game-btn.outline{background:linear-gradient(180deg,rgba(52,81,139,.72),rgba(21,49,99,.75))!important}
.game-btn.success{background:linear-gradient(180deg,#37d182,#16ad64)!important}
#level-row .game-btn:last-child{background:linear-gradient(180deg,#8054ff,#6035dc)!important}
.game-question{min-height:0;margin:10px 0 20px;color:#fff!important;font-size:clamp(1.3rem,5vw,1.8rem)!important;font-weight:800}
#question div{color:var(--space-muted)!important}
#answers .game-btn:disabled{opacity:.72;cursor:default}
#end-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.stars{min-height:78px;font-size:3.7rem!important}
.big-score{margin:8px 0;color:#fff!important;font-size:4rem!important;font-weight:1000}
#player-line,#end-screen p{color:#d7e3f7!important}
[hidden]{display:none!important}
@media(max-width:600px){body{padding:74px 10px 18px!important}.game-card{min-height:calc(100vh - 94px);border-radius:22px!important}#start-screen,#play-screen,#end-screen{min-height:calc(100vh - 96px);padding:26px 15px 24px}.game-hud{min-height:62px;padding:12px 14px!important;gap:24px}}
</style>
</head>
<body>

<div class="game-hud">
  <span class="score">ניקוד: <span id="score">0</span></span>
  <span>שאלה <span id="qnum">1</span>/<span id="qtotal">10</span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div style="font-size:4rem">🔡</div>
    <h1 class="game-title">ראשי תיבות</h1>
    <p>מה הפירוש הנכון של ראשי התיבות?</p>
    <p>כמה שאלות?</p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline success" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr">
      <button class="game-btn secondary" onclick="start(1)">🙂 קל</button>
      <button class="game-btn secondary" onclick="start(2)">😎 בינוני</button>
      <button class="game-btn secondary" onclick="start(3)">🤓 קשה</button>
      <button class="game-btn" onclick="start(0)">🎲 אקראי</button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div class="game-question" id="question" dir="rtl"></div>
    <div class="answer-grid" id="answers" style="grid-template-columns:1fr"></div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p>השיא שלך: <b id="best"></b></p>
    <button class="game-btn" onclick="location.reload()">שחק שוב 🔁</button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>
<script>
// ---- content bank: real, verified Hebrew acronyms ----
const BANK = [
  { acr: 'צה"ל', full: 'צבא הגנה לישראל', lvl: 1 },
  { acr: 'ת"א', full: 'תל אביב', lvl: 1 },
  { acr: 'ביה"ס', full: 'בית הספר', lvl: 1 },
  { acr: 'ביה"ח', full: 'בית החולים', lvl: 1 },
  { acr: 'מד"א', full: 'מגן דוד אדום', lvl: 1 },
  { acr: "רח'", full: 'רחוב', lvl: 1 },
  { acr: 'ד"ר', full: 'דוקטור', lvl: 1 },
  { acr: "גב'", full: 'גברת', lvl: 1 },
  { acr: 'או"ם', full: 'האומות המאוחדות', lvl: 1 },
  { acr: 'ארה"ב', full: 'ארצות הברית', lvl: 1 },
  { acr: "וכו'", full: 'וכולי', lvl: 1 },
  { acr: 'מנכ"ל', full: 'מנהל כללי', lvl: 2 },
  { acr: 'רה"מ', full: 'ראש הממשלה', lvl: 2 },
  { acr: 'יו"ר', full: 'יושב ראש', lvl: 2 },
  { acr: 'עו"ד', full: 'עורך דין', lvl: 2 },
  { acr: 'חו"ל', full: 'חוץ לארץ', lvl: 2 },
  { acr: 'תנ"ך', full: 'תורה נביאים כתובים', lvl: 2 },
  { acr: 'סה"כ', full: 'סך הכל', lvl: 2 },
  { acr: 'ע"י', full: 'על ידי', lvl: 2 },
  { acr: 'עפ"י', full: 'על פי', lvl: 2 },
  { acr: 'בע"מ', full: 'בערבון מוגבל', lvl: 2 },
  { acr: 'ת"ד', full: 'תא דואר', lvl: 2 },
  { acr: "שד'", full: 'שדרות', lvl: 2 },
  { acr: 'אח"כ', full: 'אחר כך', lvl: 2 },
  { acr: 'כנ"ל', full: 'כנזכר לעיל', lvl: 2 },
  { acr: 'בד"כ', full: 'בדרך כלל', lvl: 2 },
  { acr: 'עו"ס', full: 'עובד סוציאלי', lvl: 2 },
  { acr: 'ש"ח', full: 'שקל חדש', lvl: 1 },
  { acr: 'ק"ג', full: 'קילוגרם', lvl: 1 },
  { acr: 'ק"מ', full: 'קילומטר', lvl: 1 },
  { acr: 'ס"מ', full: 'סנטימטר', lvl: 1 },
  { acr: 'ב"ש', full: 'באר שבע', lvl: 1 },
  { acr: 'בי"ס', full: 'בית ספר', lvl: 1 },
  { acr: 'ד"ש', full: 'דרישת שלום', lvl: 1 },
  { acr: "מס'", full: 'מספר', lvl: 1 },
  { acr: "עמ'", full: 'עמוד', lvl: 1 },
  { acr: 'ת"ז', full: 'תעודת זהות', lvl: 2 },
  { acr: 'ח"כ', full: 'חבר כנסת', lvl: 2 },
  { acr: 'ביהמ"ש', full: 'בית המשפט', lvl: 2 },
  { acr: 'ביה"כ', full: 'בית הכנסת', lvl: 2 },
  { acr: 'פ"ת', full: 'פתח תקווה', lvl: 2 },
  { acr: 'ראשל"צ', full: 'ראשון לציון', lvl: 2 },
  { acr: 'מ"ר', full: 'מטר רבוע', lvl: 2 },
  { acr: 'מג"ב', full: 'משמר הגבול', lvl: 2 },
  { acr: 'רו"ח', full: 'רואה חשבון', lvl: 2 },
  { acr: 'דו"ח', full: 'דין וחשבון', lvl: 2 },
  { acr: 'בע"פ', full: 'בעל פה', lvl: 2 },
  { acr: 'ב"ה', full: 'ברוך השם', lvl: 2 },
  { acr: 'בע"ה', full: 'בעזרת השם', lvl: 2 },
  { acr: 'הנ"ל', full: 'הנזכר לעיל', lvl: 3 },
  { acr: 'לפנה"ס', full: 'לפני הספירה', lvl: 3 },
  { acr: 'צ"ל', full: 'צריך להיות', lvl: 3 },
  { acr: 'מו"ל', full: 'מוציא לאור', lvl: 3 },
  { acr: 'מו"מ', full: 'משא ומתן', lvl: 3 },
  { acr: 'סמנכ"ל', full: 'סגן מנהל כללי', lvl: 3 },
  { acr: 'מלכ"ר', full: 'מוסד ללא כוונת רווח', lvl: 3 },
  { acr: 'רמב"ם', full: 'רבי משה בן מימון', lvl: 3 },
  { acr: 'רש"י', full: 'רבי שלמה יצחקי', lvl: 3 },
  { acr: 'בס"ד', full: 'בסייעתא דשמיא', lvl: 3 },
];

const rnd = n => Math.floor(Math.random() * n);
const pick = arr => arr[rnd(arr.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const HEB = 'אבגדהוזחטיכלמנסעפצקרשת'.split('');
const stripPunct = s => s.replace(/["'׳״]/g, '').split('');
const fmt = letters => letters.length === 1 ? letters[0] + "'" : letters.slice(0, -1).join('') + '"' + letters[letters.length - 1];
function swapDecoy(letters) {
  if (letters.length < 2) return substDecoy(letters);
  const a = letters.slice(), i = rnd(a.length), j = (i + 1) % a.length;
  [a[i], a[j]] = [a[j], a[i]];
  return a;
}
function substDecoy(letters) {
  const a = letters.slice(), i = rnd(a.length);
  let r; do { r = pick(HEB); } while (r === a[i]);
  a[i] = r;
  return a;
}

// direction=0: show acr -> pick full meaning. direction=1 (hard/build): show full -> pick acronym.
function makeQuestion(lvl) {
  const buildMode = lvl === 3;
  if (!buildMode) {
    const pool = BANK.filter(b => b.lvl === (lvl === 2 ? 2 : 1));
    const item = pick(pool);
    const distractors = shuffle(BANK.filter(b => b !== item)).slice(0, 2).map(b => b.full);
    const options = shuffle([item.full, ...distractors]);
    return { mode: 'acr2full', acr: item.acr, correct: item.full, options };
  }
  const item = pick(BANK);
  const letters = stripPunct(item.acr);
  const correctFmt = item.acr;
  let d1, d2, tries = 0;
  do {
    d1 = fmt(swapDecoy(letters));
    d2 = fmt(substDecoy(letters));
    tries++;
  } while ((d1 === correctFmt || d2 === correctFmt || d1 === d2) && tries < 15);
  const options = shuffle([correctFmt, d1, d2]);
  return { mode: 'full2acr', full: item.full, correct: correctFmt, options };
}

let game, score = 0, qnum = 0, current, level = 1, TOTAL = 10, diff, timer;
IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'acronyms',
  how: 'ראשי תיבות זה קיצור של כמה מילים לאות אחת מכל מילה. למשל "צבא הגנה לישראל" מתקצר ל"צה"ל". תבחרו את הפירוש הנכון לפני שהפצצה מתפוצצת! 💣',
  example: '<b>צה"ל</b> ← צבא הגנה לישראל',
});

function setRounds(n, btn) {
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.remove('success'));
  btn.classList.add('success');
}

const show = id => {
  for (const s of ['start-screen', 'play-screen', 'end-screen'])
    document.getElementById(s).hidden = s !== id;
};

async function start(lvl) {
  game = await IAKidsGame.init('acronyms');
  level = lvl;
  diff = game.difficulty(lvl || 1, 3);
  timer = game.timer({ style: 'bomb', onTimeout: () => answer(null, null) });
  const p = await game.loadProgress();
  if (p?.rounds && !document.querySelector('#rounds-row .success')) TOTAL = p.rounds;
  await game.saveProgress({ lastLevel: lvl, rounds: TOTAL });
  document.getElementById('qtotal').textContent = TOTAL;
  show('play-screen');
  next();
}

async function next() {
  if (qnum >= TOTAL) return end();
  qnum++;
  document.getElementById('qnum').textContent = qnum;
  const lvl = level === 0 ? 1 + rnd(3) : diff.level;
  const q = await game.newQuestion(() => makeQuestion(lvl), x => x.mode + '|' + (x.acr || x.full));
  current = q;
  const qEl = document.getElementById('question');
  qEl.innerHTML = q.mode === 'acr2full'
    ? `<span dir="rtl">${q.acr}</span><div style="font-size:1rem;color:var(--muted);margin-top:8px">מה הפירוש?</div>`
    : `<span style="font-size:1.5rem">${q.full}</span><div style="font-size:1rem;color:var(--muted);margin-top:8px">מה ראשי התיבות?</div>`;
  const answers = document.getElementById('answers');
  answers.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'game-btn outline';
    btn.dir = 'rtl';
    btn.textContent = opt;
    btn.onclick = () => answer(opt, btn);
    answers.appendChild(btn);
  });
  timer.start(IAKidsTimer.secondsFor(lvl));
}

function answer(said, btn) {
  timer.stop();
  document.querySelectorAll('#answers .game-btn').forEach(b => b.disabled = true);
  if (said === current.correct) {
    score += 10;
    diff.right();
    IAKidsFX.correct(btn);
    IAKidsCoins.right(btn);
  } else {
    diff.wrong();
    if (btn) IAKidsFX.wrong(btn);
    IAKidsCoins.wrong();
  }
  document.getElementById('score').textContent = score;
  setTimeout(next, 700);
}

async function end() {
  await game.saveScore(score, { level });
  const top = (await game.getHighScores(1))[0];
  document.getElementById('final-score').textContent = score;
  document.getElementById('best').textContent = top?.score ?? score;
  document.getElementById('player-line').textContent =
    `${top?.player || 'אורח'} · ${new Date().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}`;
  document.getElementById('stars').textContent =
    '⭐'.repeat(Math.max(1, Math.round(score / (TOTAL * 10) * 3)));
  game.shareButton(score, document.getElementById('share-slot'));
  show('end-screen');
  game.complete(score);
}
</script>
</body>
</html>
