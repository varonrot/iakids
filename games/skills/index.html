<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אילו כישורים חושבים מפתחים משחקי iakids</title>
<style>
  :root {
    --bg-0: #fff8f2;
    --bg-1: #fdefe2;
    --card: #ffffff;
    --text-1: #241f1a;
    --text-2: #786f64;
    --text-3: #a89c8d;
    --line: #ece1d4;
    --accent: #ff6a2a;
    --ring: #f1e6d8;

    --s-math: #2a78d6;   --s-math-dark: #3987e5;
    --s-heb:  #eb6834;   --s-heb-dark:  #d95926;
    --s-eng:  #1baf7a;   --s-eng-dark:  #199e70;
    --s-sci:  #eda100;   --s-sci-dark:  #c98500;
    --s-log:  #e87ba4;   --s-log-dark:  #d55181;
    --s-hw:   #008300;   --s-hw-dark:   #008300;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --bg-0: #1a1613; --bg-1: #201a15; --card: #24201b;
      --text-1: #f5efe8; --text-2: #b9ada0; --text-3: #83786b;
      --line: #362e26; --accent: #ff7d47; --ring: #322a22;
      --s-math: var(--s-math-dark); --s-heb: var(--s-heb-dark); --s-eng: var(--s-eng-dark);
      --s-sci: var(--s-sci-dark); --s-log: var(--s-log-dark); --s-hw: var(--s-hw-dark);
    }
  }
  :root[data-theme="dark"] {
    --bg-0: #1a1613; --bg-1: #201a15; --card: #24201b;
    --text-1: #f5efe8; --text-2: #b9ada0; --text-3: #83786b;
    --line: #362e26; --accent: #ff7d47; --ring: #322a22;
    --s-math: var(--s-math-dark); --s-heb: var(--s-heb-dark); --s-eng: var(--s-eng-dark);
    --s-sci: var(--s-sci-dark); --s-log: var(--s-log-dark); --s-hw: var(--s-hw-dark);
  }
  :root[data-theme="light"] {
    --bg-0: #fff8f2; --bg-1: #fdefe2; --card: #ffffff;
    --text-1: #241f1a; --text-2: #786f64; --text-3: #a89c8d;
    --line: #ece1d4; --accent: #ff6a2a; --ring: #f1e6d8;
    --s-math: #2a78d6; --s-heb: #eb6834; --s-eng: #1baf7a;
    --s-sci: #eda100; --s-log: #e87ba4; --s-hw: #008300;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: linear-gradient(175deg, var(--bg-0) 0%, var(--bg-1) 100%);
    color: var(--text-1);
    font-family: 'Heebo', 'Segoe UI', system-ui, sans-serif;
    direction: inherit; /* follows <html dir>, which IAKidsLang.init() sets dynamically */
    padding: 28px 18px 60px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  .back-link {
    display: inline-block;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-2);
    text-decoration: none;
    margin-bottom: 16px;
  }
  .back-link:hover { color: var(--accent); }

  header { margin-bottom: 30px; }
  .eyebrow {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: clamp(1.6rem, 4vw, 2.3rem);
    font-weight: 800;
    margin: 0 0 8px;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--text-2);
    font-size: 1rem;
    max-width: 62ch;
    line-height: 1.6;
    margin: 0;
  }
  .note {
    margin-top: 14px;
    font-size: 0.82rem;
    color: var(--text-3);
    border-right: 3px solid var(--line);
    padding-right: 12px;
    line-height: 1.6;
    max-width: 68ch;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 34px;
  }
  @media (max-width: 860px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 16px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    margin-bottom: 6px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .card h2 { font-size: 0.98rem; font-weight: 800; margin: 0; }
  .card .n { margin-inline-start: auto; font-size: 0.72rem; color: var(--text-3); font-variant-numeric: tabular-nums; }

  .top-skills {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
    justify-content: center;
  }
  .chip {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--text-1);
    background: var(--ring);
    padding: 3px 9px;
    border-radius: 999px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.86rem;
  }
  .table-wrap {
    overflow-x: auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  th, td {
    padding: 10px 12px;
    text-align: center;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  th:first-child, td:first-child { text-align: right; position: sticky; right: 0; background: var(--card); }
  thead th {
    font-size: 0.72rem;
    color: var(--text-2);
    font-weight: 700;
    border-bottom: 1px solid var(--line);
    letter-spacing: 0.02em;
  }
  tbody tr:not(:last-child) td { border-bottom: 1px solid var(--line); }
  tbody td:first-child { font-weight: 700; }
  .cell-val { display: inline-flex; align-items: center; gap: 6px; }
  .bar { width: 34px; height: 5px; border-radius: 3px; background: var(--ring); overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 3px; }

  h2.section-title {
    font-size: 1.05rem;
    font-weight: 800;
    margin: 0 0 12px;
  }
  section + section { margin-top: 30px; }

  .fact-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
  }
  .fact-card .fact-emoji { font-size: 1.6rem; margin-bottom: 6px; }
  .fact-card p { font-size: 0.88rem; line-height: 1.6; margin: 0 0 10px; }
  .fact-card a {
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .fact-card a:hover { text-decoration: underline; }
  @media (max-width: 560px) { #factsGrid { grid-template-columns: 1fr !important; } }

  .cat-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .cat-filter button {
    font: inherit;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text-2);
    cursor: pointer;
  }
  .cat-filter button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #allGamesTable th[data-sort] { cursor: pointer; user-select: none; }
  #allGamesTable th[data-sort]:hover { color: var(--accent); }
  #allGamesTable th[data-sort].sorted::after { content: ' ▾'; }
  #allGamesTable th[data-sort].sorted.asc::after { content: ' ▴'; }
  #allGamesTable tbody tr { cursor: pointer; }
  #allGamesTable tbody tr:hover td { background: var(--ring); }
  #allGamesTable .gname { display: flex; align-items: center; gap: 6px; white-space: nowrap; }

  #gameModalOverlay {
    position: fixed; inset: 0; background: rgba(20, 15, 10, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 200;
  }
  #gameModalOverlay[hidden] { display: none; }
  #gameModal {
    background: var(--card); border-radius: 20px; padding: 22px;
    max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto;
    position: relative; text-align: center;
  }
  #gameModalClose {
    position: absolute; top: 10px; inset-inline-end: 10px;
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: var(--ring); font-size: 1rem; cursor: pointer;
  }
  #gameModalRadar { max-width: 280px; margin: 0 auto; }
  #gameModalLegend { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0 14px; }
  #gameModalLegend .leg-chip {
    display: flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 700;
    background: var(--ring); border-radius: 999px; padding: 5px 10px;
  }
  #gameModalLegend .leg-chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  #gameModalLegend .leg-chip button { border: none; background: none; cursor: pointer; font-size: 0.85rem; color: var(--text-2); padding: 0; }
  .compare-add { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .compare-add select {
    font: inherit; font-size: 0.85rem; padding: 6px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text-1); max-width: 220px;
  }
  #gameModalCards { display: flex; flex-direction: column; gap: 10px; }
  .modal-game-card {
    background: var(--ring); border-radius: 14px; padding: 12px 14px; text-align: start;
  }
  .modal-game-card .mg-head { display: flex; align-items: center; gap: 8px; font-weight: 800; margin-bottom: 6px; }
  .modal-game-card .mg-head .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .modal-game-card .play-link {
    display: inline-block; margin-top: 8px; font-size: 0.82rem; font-weight: 700;
    color: var(--accent); text-decoration: none;
  }
  .modal-game-card .play-link:hover { text-decoration: underline; }

  .game-picker { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .game-picker label { font-weight: 700; font-size: 0.9rem; }
  .game-picker select {
    font: inherit;
    font-size: 0.95rem;
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text-1);
    max-width: 100%;
  }
  .game-detail {
    display: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
  }
  .game-detail.active { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  .game-detail .radar-col { flex: 0 0 220px; }
  .game-detail .info-col { flex: 1 1 260px; min-width: 220px; }
  .game-detail h3 { margin: 0 0 4px; font-size: 1.15rem; font-weight: 800; }
  .game-detail .cat-line { color: var(--text-2); font-size: 0.85rem; margin-bottom: 12px; }
  .game-detail .top-skills { justify-content: flex-start; }
  .game-detail .play-link {
    display: inline-block;
    margin-top: 14px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .game-detail .play-link:hover { text-decoration: underline; }

  footer { margin-top: 30px; font-size: 0.78rem; color: var(--text-3); line-height: 1.7; max-width: 70ch; }

  .trust-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 760px) { .trust-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .trust-grid { grid-template-columns: 1fr; } }
  .trust-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
  }
  .trust-card .trust-emoji { font-size: 1.8rem; margin-bottom: 6px; }
  .trust-card h3 { font-size: 0.95rem; font-weight: 800; margin: 0 0 4px; }
  .trust-card p { font-size: 0.82rem; color: var(--text-2); margin: 0; line-height: 1.5; }

  .method-box {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 20px;
  }
  .method-box ol { margin: 10px 0 0; padding-inline-start: 20px; }
  .method-box li { margin-bottom: 8px; font-size: 0.9rem; line-height: 1.6; }
  .method-box code { background: var(--ring); padding: 1px 6px; border-radius: 6px; font-size: 0.85em; }

  .commitment {
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 10%, transparent), transparent);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
  }
  .commitment .trust-emoji { font-size: 2rem; }
  .commitment p { max-width: 60ch; margin: 8px auto 0; color: var(--text-2); line-height: 1.7; font-size: 0.92rem; }
  .safe-links { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .safe-links a { font-size: 0.82rem; font-weight: 700; color: var(--accent); text-decoration: none; }
  .safe-links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
    <a class="back-link" href="../" id="tBackLink"></a>
    <div id="langSwitcherSlot"></div>
  </div>
  <header>
    <span class="eyebrow" id="tEyebrow"></span>
    <h1 id="tH1"></h1>
    <p class="sub" id="tSub"></p>
    <p class="note" id="tNote"></p>
    <a class="game-btn" href="../brain-test/" id="tCta" style="display:inline-block;text-decoration:none;margin-top:10px"></a>
  </header>

  <section>
    <h2 class="section-title" id="tTrustTitle"></h2>
    <div class="trust-grid" id="trustGrid"></div>
  </section>

  <section>
    <h2 class="section-title" id="tMethodTitle"></h2>
    <div class="method-box">
      <p style="margin:0;color:var(--text-2);font-size:0.9rem" id="tMethodIntro"></p>
      <ol id="tMethodList"></ol>
    </div>
  </section>

  <section>
    <h2 class="section-title" id="tFactsTitle"></h2>
    <div class="grid" id="factsGrid" style="grid-template-columns:repeat(2,1fr)"></div>
    <p class="note" id="tFactsCaution" style="margin-top:14px;max-width:none"></p>
  </section>

  <section>
    <div class="grid" id="radarGrid"></div>
  </section>

  <section>
    <h2 class="section-title" id="tDataTableTitle"></h2>
    <div class="table-wrap">
      <table id="dataTable"></table>
    </div>
  </section>

  <section>
    <h2 class="section-title" id="tPickerTitle"></h2>
    <div class="game-picker">
      <label for="gameSelect" id="tPickerLabel"></label>
      <select id="gameSelect">
        <option value="" id="tPickerPlaceholder"></option>
      </select>
    </div>
  </section>

  <div id="gameModalOverlay" hidden>
    <div id="gameModal">
      <button id="gameModalClose" aria-label="close">✕</button>
      <div id="gameModalRadar"></div>
      <div id="gameModalLegend"></div>
      <div class="compare-add">
        <label for="compareSelect" id="tCompareAddLabel"></label>
        <select id="compareSelect"><option value="" id="tCompareAddPlaceholder"></option></select>
      </div>
      <div id="gameModalCards"></div>
    </div>
  </div>

  <section>
    <h2 class="section-title" id="tCompareTitle"></h2>
    <p class="sub" id="tCompareSub" style="margin-bottom:14px"></p>
    <div class="cat-filter" id="catFilter"></div>
    <div class="table-wrap">
      <table id="allGamesTable"></table>
    </div>
  </section>

  <footer id="legendFooter"></footer>
</div>

<script src="../game-sdk.js"></script>
<script>
// data + scoring + radar rendering all live in IAKidsSkills (game-sdk.js) —
// single source of truth shared with games/brain-test/.
IAKidsLang.mountSwitcher(document.getElementById('langSwitcherSlot'));

document.getElementById('tBackLink').textContent = IAKidsLang.t({
  he: '← לכל המשחקים', en: '← All games', es: '← Todos los juegos', de: '← Alle Spiele', pt: '← Todos os jogos' });
document.getElementById('tDataTableTitle').textContent = IAKidsLang.t({
  he: 'טבלת הציונים המלאה — לפי קטגוריה', en: 'Full score table — by category',
  es: 'Tabla de puntuaciones completa — por categoría', de: 'Vollständige Punktetabelle — nach Kategorie', pt: 'Tabela completa de pontuações — por categoria' });
document.getElementById('tPickerTitle').textContent = IAKidsLang.t({
  he: '🔍 בדקו משחק ספציפי', en: '🔍 Look up a specific game', es: '🔍 Consulten un juego específico', de: '🔍 Ein bestimmtes Spiel ansehen', pt: '🔍 Consulte um jogo específico' });
document.getElementById('tPickerLabel').textContent = IAKidsLang.t({
  he: 'בחרו משחק:', en: 'Choose a game:', es: 'Elijan un juego:', de: 'Spiel wählen:', pt: 'Escolha um jogo:' });
document.getElementById('tPickerPlaceholder').textContent = IAKidsLang.t({
  he: '— בחרו —', en: '— Choose —', es: '— Elegir —', de: '— Auswählen —', pt: '— Escolher —' });
document.getElementById('tCompareTitle').textContent = IAKidsLang.t({
  he: '🔬 השוואה מלאה — כל 100 המשחקים', en: '🔬 Full comparison — all 100 games',
  es: '🔬 Comparación completa — los 100 juegos', de: '🔬 Vollständiger Vergleich — alle 100 Spiele', pt: '🔬 Comparação completa — todos os 100 jogos' });
document.getElementById('tCompareSub').textContent = IAKidsLang.t({
  he: 'השוואה בין קטגוריות ובין משחקים בודדים לפי כל אחד מ-8 כישורי החשיבה. סננו לפי קטגוריה, או לחצו על כותרת עמודה למיון. לחיצה על שורה מציגה את הרדאר המלא שלה למעלה.',
  en: 'Compare categories and individual games across all 8 thinking skills. Filter by category, or click a column header to sort. Clicking a row shows its full radar above.',
  es: 'Comparen categorías y juegos individuales en las 8 habilidades de pensamiento. Filtren por categoría o hagan clic en un encabezado de columna para ordenar. Al hacer clic en una fila se muestra su radar completo arriba.',
  de: 'Vergleicht Kategorien und einzelne Spiele über alle 8 Denkfähigkeiten. Filtert nach Kategorie oder klickt auf eine Spaltenüberschrift zum Sortieren. Ein Klick auf eine Zeile zeigt ihr vollständiges Radar oben.',
  pt: 'Compare categorias e jogos individuais nas 8 habilidades de pensamento. Filtre por categoria ou clique em um cabeçalho de coluna para ordenar. Clicar em uma linha mostra seu radar completo acima.' });

// ---- header ----
document.getElementById('tEyebrow').textContent = IAKidsLang.t({
  he: 'מדריך להורים', en: 'A guide for parents', es: 'Guía para padres', de: 'Ein Leitfaden für Eltern', pt: 'Um guia para os pais' });
document.getElementById('tH1').textContent = IAKidsLang.t({
  he: 'אילו כישורי חשיבה כל קטגוריית משחקים מפתחת',
  en: 'Which thinking skills each game category builds',
  es: 'Qué habilidades de pensamiento desarrolla cada categoría de juegos',
  de: 'Welche Denkfähigkeiten jede Spielkategorie fördert',
  pt: 'Quais habilidades de pensamento cada categoria de jogos desenvolve' });
document.getElementById('tSub').textContent = IAKidsLang.t({
  he: '100 המשחקים של iakids מחולקים ל-6 קטגוריות. הרדאר של כל קטגוריה מראה עד כמה היא מתרגלת כל אחד מ-8 כישורי חשיבה מרכזיים אצל ילדים — כדי שתדעו למה לכוון לפי הצורך של הילד שלכם.',
  en: 'iakids\' 100 games are split into 6 categories. Each category\'s radar shows how much it practices each of 8 core thinking skills in children — so you know where to aim based on what your child needs.',
  es: 'Los 100 juegos de iakids se dividen en 6 categorías. El radar de cada categoría muestra cuánto practica cada una de las 8 habilidades de pensamiento centrales en los niños, para que sepas hacia dónde apuntar según lo que tu hijo/a necesita.',
  de: 'Die 100 Spiele von iakids sind in 6 Kategorien unterteilt. Das Radar jeder Kategorie zeigt, wie stark sie jede der 8 zentralen Denkfähigkeiten bei Kindern trainiert — damit ihr wisst, worauf ihr je nach Bedarf eures Kindes zielen solltet.',
  pt: 'Os 100 jogos do iakids estão divididos em 6 categorias. O radar de cada categoria mostra o quanto ela treina cada uma das 8 habilidades de pensamento essenciais nas crianças — para você saber para onde direcionar conforme a necessidade do seu filho/a.' });
document.getElementById('tNote').innerHTML = IAKidsLang.t({
  he: '⚠️ הציונים (0–5) הם הערכה חינוכית שלנו לפי מבנה המשחקים, לא מדידה קלינית או נוירולוגית. תיוגי "אזור מוחי" הם כינויים מוכרים ומיועדים להמחשה בלבד.',

// ---- game modal: click a game anywhere -> radar dialog, compare up to 3 ----
const COMPARE_COLORS = ['var(--s-math)', 'var(--s-heb)', 'var(--s-eng)']; // 3-slot dataviz-validated all-pairs palette
const COMPARE_MAX = 3;
let compareSlugs = [];
const modalOverlay = document.getElementById('gameModalOverlay');
const modalEl = document.getElementById('gameModal');
const compareSelect = document.getElementById('compareSelect');

document.getElementById('tCompareAddLabel').textContent = IAKidsLang.t({
  he: '➕ השוו עם:', en: '➕ Compare with:', es: '➕ Comparar con:', de: '➕ Vergleichen mit:', pt: '➕ Comparar com:' });
const T_COMPARE_PLACEHOLDER = IAKidsLang.t({
  he: '— בחרו משחק —', en: '— Choose a game —', es: '— Elegir un juego —', de: '— Spiel wählen —', pt: '— Escolher um jogo —' });
document.getElementById('tCompareAddPlaceholder').textContent = T_COMPARE_PLACEHOLDER;

function multiRadarSVG(entries) {
  // entries: [{scores, color}], up to 3. Reuses IAKidsSkills geometry, draws all series on one chart.
  const size = 260, cx = size / 2, cy = size / 2, r = size * 0.36, max = 5;
  const pt = (i, v) => {
    const angle = (Math.PI * 2 * i) / SKILLS.length - Math.PI / 2;
    const rad = (v / max) * r;
    return [cx + rad * Math.cos(angle), cy + rad * Math.sin(angle)];
  };
  const rings = [1, 2, 3, 4, 5].map(lvl => {
    const pts = SKILLS.map((_, i) => pt(i, lvl).join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="var(--line)" stroke-width="${lvl === 5 ? 1.4 : 1}" opacity="${lvl === 5 ? 0.9 : 0.5}"/>`;
  }).join('');
  const spokes = SKILLS.map((_, i) => {
    const [x, y] = pt(i, max);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1" opacity="0.6"/>`;
  }).join('');
  const labels = SKILLS.map((s, i) => {
    const angle = (Math.PI * 2 * i) / SKILLS.length - Math.PI / 2;
    const lx = cx + (r + 22) * Math.cos(angle), ly = cy + (r + 22) * Math.sin(angle);
    const anchor = Math.cos(angle) > 0.3 ? 'start' : Math.cos(angle) < -0.3 ? 'end' : 'middle';
    return `<text x="${lx}" y="${ly}" font-size="8.5" fill="var(--text-3)" text-anchor="${anchor}" dominant-baseline="middle">${IAKidsLang.t(s.label)}</text>`;
  }).join('');
  const series = entries.map(({ scores, color }) => {
    const pts = SKILLS.map((s, i) => pt(i, scores[s.key] || 0));
    const dots = pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3" fill="${color}"/>`).join('');
    return `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="${color}" fill-opacity="0.16" stroke="${color}" stroke-width="2.2"/>${dots}`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="100%">${rings}${spokes}${series}${labels}</svg>`;
}

function renderModal() {
  const entries = compareSlugs.map((slug, i) => {
    const g = GAMES.find(x => x.slug === slug);
    return { g, meta: CAT_META[g.cat], scores: gameScores(g), color: COMPARE_COLORS[i] };
  });

  document.getElementById('gameModalRadar').innerHTML = multiRadarSVG(entries);
  document.getElementById('gameModalLegend').innerHTML = entries.map((e, i) => `
    <span class="leg-chip"><span class="dot" style="background:${e.color}"></span>${e.g.emoji} ${e.g.name}
      ${entries.length > 1 ? `<button data-remove="${e.g.slug}">✕</button>` : ''}
    </span>`).join('');
  document.getElementById('gameModalCards').innerHTML = entries.map(e => `
    <div class="modal-game-card">
      <div class="mg-head"><span class="dot" style="background:${e.color}"></span>${e.g.emoji} ${e.g.name}
        <span style="font-weight:400;color:var(--text-2);font-size:0.8rem">· ${e.meta.name}</span></div>
      <div class="top-skills" style="justify-content:flex-start">
        ${Object.entries(e.scores).sort((a, b) => b[1] - a[1]).slice(0, 3)
          .map(([k, v]) => `<span class="chip">${IAKidsLang.t(SKILLS.find(s => s.key === k).label)} ${v}/5</span>`).join('')}
      </div>
      <a class="play-link" href="../${e.g.slug}/">▶️ ${IAKidsLang.ui('start') || 'שחקו'}</a>
    </div>`).join('');

  compareSelect.innerHTML = `<option value="">${T_COMPARE_PLACEHOLDER}</option>` +
    GAMES.filter(g => !compareSlugs.includes(g.slug))
      .map(g => `<option value="${g.slug}">${g.emoji} ${g.name} (${CAT_META[g.cat].name})</option>`).join('');
  compareSelect.parentElement.style.display = compareSlugs.length >= COMPARE_MAX ? 'none' : '';

  document.querySelectorAll('#gameModalLegend button[data-remove]').forEach(b => b.onclick = () => {
    compareSlugs = compareSlugs.filter(s => s !== b.dataset.remove);
    renderModal();
  });
}

function openGameModal(slug) {
  compareSlugs = [slug];
  renderModal();
  modalOverlay.hidden = false;
}
function closeGameModal() { modalOverlay.hidden = true; }

document.getElementById('gameModalClose').onclick = closeGameModal;
modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeGameModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modalOverlay.hidden) closeGameModal(); });
compareSelect.addEventListener('change', () => {
  if (compareSelect.value && compareSlugs.length < COMPARE_MAX) {
    compareSlugs.push(compareSelect.value);
    renderModal();
  }
});

select.addEventListener('change', () => { if (select.value) openGameModal(select.value); });
const preselect = new URLSearchParams(location.search).get('game');
if (preselect && GAMES.some(g => g.slug === preselect)) {
  select.value = preselect;
  openGameModal(preselect);
}

// full 100-game comparison table: filter by category, sort by any column,
// click a row to open its radar in the "בדקו משחק ספציפי" section above.
const T_ALL = IAKidsLang.t({ he: 'הכל', en: 'All', es: 'Todos', de: 'Alle', pt: 'Todos' });
const T_GAME = IAKidsLang.t({ he: 'משחק', en: 'Game', es: 'Juego', de: 'Spiel', pt: 'Jogo' });

let filterCat = 'all';
let sortKey = 'cat';
let sortDir = 'asc';

const allGamesRows = GAMES.map(g => ({ g, meta: CAT_META[g.cat], scores: gameScores(g) }));

document.getElementById('catFilter').innerHTML =
  [['all', T_ALL, null], ...Object.entries(CAT_META).map(([k, m]) => [k, m.name, m.color])]
    .map(([key, label, color]) => `<button data-cat="${key}" class="${key === filterCat ? 'active' : ''}"
      style="${color ? `border-color:${color}` : ''}">${label}</button>`).join('');
document.getElementById('catFilter').addEventListener('click', e => {
  const btn = e.target.closest('button[data-cat]');
  if (!btn) return;
  filterCat = btn.dataset.cat;
  document.querySelectorAll('#catFilter button').forEach(b => b.classList.toggle('active', b === btn));
  renderAllGamesTable();
});

function renderAllGamesTable() {
  const rows = allGamesRows
    .filter(r => filterCat === 'all' || r.g.cat === filterCat)
    .sort((a, b) => {
      let av, bv;
      if (sortKey === 'name') { av = a.g.name; bv = b.g.name; }
      else if (sortKey === 'cat') { av = a.meta.name; bv = b.meta.name; }
      else { av = a.scores[sortKey]; bv = b.scores[sortKey]; }
      const cmp = typeof av === 'string' ? av.localeCompare(bv) : av - bv;
      return sortDir === 'asc' ? cmp : -cmp;
    });

  const headCell = (key, label) =>
    `<th data-sort="${key}" class="${sortKey === key ? 'sorted ' + sortDir : ''}">${label}</th>`;
  const thead = `<thead><tr>
    ${headCell('name', T_GAME)}${headCell('cat', T_CATEGORY)}
    ${SKILLS.map(s => headCell(s.key, IAKidsLang.t(s.label))).join('')}
  </tr></thead>`;

  const tbody = `<tbody>${rows.map(({ g, meta, scores }) => `
    <tr data-slug="${g.slug}">
      <td><span class="gname">${g.emoji} ${g.name}</span></td>
      <td><span class="dot" style="background:${meta.color};display:inline-block;margin-inline-end:5px"></span>${meta.name}</td>
      ${SKILLS.map(s => `<td>${scores[s.key]}</td>`).join('')}
    </tr>`).join('')}</tbody>`;

  document.getElementById('allGamesTable').innerHTML = thead + tbody;

  document.querySelectorAll('#allGamesTable th[data-sort]').forEach(th => th.onclick = () => {
    const key = th.dataset.sort;
    sortDir = sortKey === key ? (sortDir === 'asc' ? 'desc' : 'asc') : (key === 'name' || key === 'cat' ? 'asc' : 'desc');
    sortKey = key;
    renderAllGamesTable();
  });
  document.querySelectorAll('#allGamesTable tbody tr').forEach(tr => tr.onclick = () => {
    select.value = tr.dataset.slug;
    openGameModal(tr.dataset.slug);
  });
}
renderAllGamesTable();
