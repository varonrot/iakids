<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אמת או שקר בחשבון | iakids</title>
<link rel="stylesheet" href="../game-style.css">
</head>
<body>

<div class="game-hud">
  <span class="score"><span id="score-label"></span>: <span id="score">0</span></span>
  <span><span id="q-label"></span> <span id="qnum">1</span>/<span id="qtotal">10</span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div style="font-size:4rem">✅❌</div>
    <h1 class="game-title" id="title"></h1>
    <p id="subtitle"></p>
    <p id="rounds-label"></p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr">
      <button class="game-btn secondary" onclick="start(1)" id="lvl1"></button>
      <button class="game-btn secondary" onclick="start(2)" id="lvl2"></button>
      <button class="game-btn secondary" onclick="start(3)" id="lvl3"></button>
      <button class="game-btn" onclick="start(0)" id="lvl0"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div class="game-question" id="question"></div>
    <div class="answer-grid">
      <button class="game-btn success" onclick="answer(true, this)" id="btn-true"></button>
      <button class="game-btn danger" onclick="answer(false, this)" id="btn-false"></button>
    </div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" onclick="location.reload()" id="again"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>
<script>
const T = IAKidsLang.t.bind(IAKidsLang), UI = IAKidsLang.ui.bind(IAKidsLang);
document.getElementById('title').textContent = T({he:'אמת או שקר בחשבון', en:'True or False Math', es:'Verdadero o falso', de:'Wahr oder falsch', pt:'Verdadeiro ou falso'});
document.getElementById('subtitle').textContent = T({he:'האם התרגיל נכון? ענה מהר לפני שהפצצה מתפוצצת! 💣', en:'Is the equation right? Answer before the bomb! 💣', es:'¿Es correcta la cuenta? ¡Responde antes de la bomba! 💣', de:'Stimmt die Rechnung? Antworte vor der Bombe! 💣', pt:'A conta está certa? Responda antes da bomba! 💣'});
document.getElementById('rounds-label').textContent = T({he:'כמה שאלות?', en:'How many questions?', es:'¿Cuántas preguntas?', de:'Wie viele Fragen?', pt:'Quantas perguntas?'});
document.getElementById('score-label').textContent = UI('score');
document.getElementById('q-label').textContent = UI('question');
document.getElementById('best-label').textContent = UI('your_best');
document.getElementById('again').textContent = UI('play_again');
document.getElementById('lvl1').textContent = UI('level_easy');
document.getElementById('lvl2').textContent = UI('level_medium');
document.getElementById('lvl3').textContent = UI('level_hard');
document.getElementById('lvl0').textContent = UI('level_random');
document.getElementById('btn-true').textContent = '✓ ' + T({he:'אמת', en:'True', es:'Verdadero', de:'Wahr', pt:'Verdadeiro'});
document.getElementById('btn-false').textContent = '✗ ' + T({he:'שקר', en:'False', es:'Falso', de:'Falsch', pt:'Falso'});

let game, score = 0, qnum = 0, correct = 0, current, level = 1, answered = false;
let TOTAL = 10, diff, timer;
IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'true-false-math',
  how: 'מופיע תרגיל חשבון — מחליטים מהר אם הוא נכון (אמת) או שגוי (שקר), לפני שהפצצה מתפוצצת! 💣',
  example: '<span dir="ltr"><b>5 × 4 = 20</b></span> ← ✓ אמת<br><span dir="ltr"><b>5 × 4 = 22</b></span> ← ✗ שקר',
});

function setRounds(n, btn) {
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.remove('success'));
  btn.classList.add('success');
}

const show = id => {
  for (const s of ['start-screen', 'play-screen', 'end-screen'])
    document.getElementById(s).hidden = s !== id;
};

async function start(lvl) {
  game = await IAKidsGame.init('true-false-math');
  level = lvl;
  diff = game.difficulty(lvl || 1, 3);
  timer = game.timer({ style: 'bomb', onTimeout: () => answer(null, null) });
  const p = await game.loadProgress();
  if (p?.rounds && !document.querySelector('#rounds-row .success')) TOTAL = p.rounds;
  await game.saveProgress({ lastLevel: lvl, rounds: TOTAL });
  document.getElementById('qtotal').textContent = TOTAL;
  show('play-screen');
  next();
}

const rnd = n => Math.floor(Math.random() * n);

// level 1: +/− to 20 · level 2: × to 10×10 · level 3: all 4 ops to 100
function makeQuestion(lvl) {
  let a, b, op, val;
  if (lvl === 1) {
    if (Math.random() < 0.5) { a = 1 + rnd(19); b = 1 + rnd(20 - a); op = '+'; val = a + b; }
    else { a = 2 + rnd(19); b = 1 + rnd(a); op = '−'; val = a - b; }
  } else if (lvl === 2) {
    a = 2 + rnd(9); b = 2 + rnd(9); op = '×'; val = a * b;
  } else {
    op = ['+', '−', '×', '÷'][rnd(4)];
    if (op === '+') { a = 10 + rnd(80); b = 1 + rnd(100 - a); val = a + b; }
    else if (op === '−') { a = 20 + rnd(80); b = 1 + rnd(a); val = a - b; }
    else if (op === '×') { a = 3 + rnd(8); b = 3 + rnd(8); val = a * b; }
    else { val = 2 + rnd(9); b = 2 + rnd(9); a = b * val; }
  }
  const truth = Math.random() < 0.5;
  let shown = val;
  if (!truth) {
    do { shown = val + (Math.random() < 0.5 ? 1 + rnd(3) : -(1 + rnd(3))); } while (shown < 0 || shown === val);
  }
  return { text: `${a} ${op} ${b} = ${shown}`, truth };
}

async function next() {
  if (qnum >= TOTAL) return end();
  qnum++;
  answered = false;
  document.getElementById('qnum').textContent = qnum;
  const lvl = level === 0 ? 1 + rnd(3) : diff.level;
  const q = await game.newQuestion(() => makeQuestion(lvl), x => x.text);
  current = q.truth;
  document.getElementById('question').innerHTML = `<span dir="ltr">${q.text}</span>`;
  timer.start(IAKidsTimer.secondsFor(lvl));
}

function answer(said, btn) {
  if (answered) return; // ponytail: flag beats disabling both buttons
  answered = true;
  timer.stop();
  if (said === current) {
    score += 10; correct++;
    diff.right();
    IAKidsFX.correct(btn);
    IAKidsCoins.right(btn);
  } else {
    diff.wrong();
    IAKidsFX.wrong(btn);
    IAKidsCoins.wrong();
  }
  document.getElementById('score').textContent = score;
  setTimeout(next, 600);
}

async function end() {
  await game.saveScore(score, { level, correct, total: TOTAL });
  const top = (await game.getHighScores(1))[0];
  document.getElementById('final-score').textContent = score;
  document.getElementById('best').textContent = top?.score ?? score;
  document.getElementById('player-line').textContent =
    `${top?.player || UI('guest')} · ${new Date().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}`;
  const acc = correct / TOTAL;
  document.getElementById('stars').textContent = '⭐'.repeat(acc >= 0.9 ? 3 : acc >= 0.6 ? 2 : 1);
  game.shareButton(score, document.getElementById('share-slot'));
  show('end-screen');
  game.complete(score);
}
</script>
</body>
</html>
