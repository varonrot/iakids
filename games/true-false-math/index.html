<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אמת או שקר בחשבון | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>
:root{--space-bg:#06142d;--space-line:rgba(119,176,255,.27);--space-text:#f7f9ff;--space-muted:#b8c7e3;--space-gold:#ffd15c}
html,body{min-height:100%}
body{margin:0!important;min-height:100vh!important;padding:86px 18px 28px!important;overflow-x:hidden;color:var(--space-text)!important;font-family:"Heebo","Segoe UI",Arial,sans-serif!important;background:radial-gradient(circle at 12% 16%,rgba(26,139,255,.23),transparent 34%),radial-gradient(circle at 88% 10%,rgba(112,72,255,.25),transparent 35%),radial-gradient(circle at 50% 100%,rgba(12,184,203,.16),transparent 34%),linear-gradient(145deg,#050f25,#0a2148 52%,#07152e)!important}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.75) 0 1px,transparent 1.4px);background-size:56px 56px;opacity:.08}
*{box-sizing:border-box}
.game-card{width:min(500px,calc(100vw - 28px))!important;min-height:690px;margin:0 auto!important;padding:0!important;overflow:hidden;border:1px solid var(--space-line)!important;border-radius:28px!important;color:var(--space-text)!important;background:linear-gradient(180deg,rgba(17,58,111,.97),rgba(5,25,61,.98))!important;box-shadow:0 28px 75px rgba(0,8,28,.48),inset 0 1px rgba(255,255,255,.08)!important}
.game-hud{position:fixed!important;top:0!important;left:0!important;right:0!important;z-index:20;min-height:72px;padding:16px 24px!important;display:flex!important;align-items:center;justify-content:center!important;gap:42px;color:#fff!important;background:rgba(5,18,46,.88)!important;border-bottom:1px solid rgba(126,180,255,.18);backdrop-filter:blur(14px)}
.game-hud .score{color:var(--space-gold)!important}
#start-screen,#play-screen,#end-screen{min-height:688px;padding:34px 30px 30px}
#start-screen{display:flex;flex-direction:column;align-items:center;text-align:center}
.hero-icon{margin:6px 0 8px;font-size:5rem;filter:drop-shadow(0 12px 18px rgba(0,0,0,.22))}
.game-title{margin:0;font-size:clamp(2.1rem,7vw,3rem)!important;line-height:1.05;color:#fff!important;text-shadow:0 4px 12px rgba(0,0,0,.22)}
#subtitle{max-width:410px;margin:14px auto 20px;color:var(--space-muted)!important;font-weight:600;line-height:1.65}
.section-label{margin:8px 0 10px;color:#fff;font-weight:900}.answer-grid{width:100%;gap:12px!important}
.game-btn{min-height:54px;border-radius:15px!important;border:1px solid rgba(118,176,255,.34)!important;color:#fff!important;font-weight:900!important;background:linear-gradient(180deg,#1c91db,#0877bd)!important;box-shadow:inset 0 1px rgba(255,255,255,.18),0 9px 20px rgba(0,0,0,.16)!important}
.game-btn.outline{background:linear-gradient(180deg,rgba(52,81,139,.72),rgba(21,49,99,.75))!important}.game-btn.success{background:linear-gradient(180deg,#37d182,#16ad64)!important}.game-btn.danger{background:linear-gradient(180deg,#ef6672,#cc3d4c)!important}#level-row{margin-top:16px}#level-row .game-btn[data-lvl="0"]{background:linear-gradient(180deg,#8054ff,#6035dc)!important}
.game-question{min-height:180px;display:flex;align-items:center;justify-content:center;margin:22px 0 28px;padding:20px;border-radius:24px;color:#fff!important;font-size:clamp(2.2rem,8vw,4.4rem)!important;font-weight:1000;text-align:center;background:radial-gradient(circle at 50% 20%,rgba(66,169,255,.15),transparent 50%),rgba(4,22,55,.48);border:1px solid rgba(116,177,255,.18)}
#play-screen .answer-grid{grid-template-columns:1fr 1fr}#btn-true,#btn-false{min-height:84px;font-size:1.35rem!important}#btn-true:disabled,#btn-false:disabled{opacity:.72;cursor:default}
#end-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.stars{min-height:78px;font-size:3.7rem!important}.big-score{margin:8px 0;color:#fff!important;font-size:4rem!important;font-weight:1000}#player-line,#end-screen p{color:#d7e3f7!important}[hidden]{display:none!important}
@media(max-width:600px){body{padding:74px 10px 18px!important}.game-card{min-height:calc(100vh - 94px);border-radius:22px!important}#start-screen,#play-screen,#end-screen{min-height:calc(100vh - 96px);padding:26px 15px 24px}.game-hud{min-height:62px;padding:12px 14px!important;gap:24px}.game-question{min-height:155px;margin:18px 0 22px}#btn-true,#btn-false{min-height:74px;font-size:1.18rem!important}}
</style>
</head>
<body>
<div class="game-hud"><span class="score"><span id="score-label"></span>: <span id="score">0</span></span><span><span id="q-label"></span> <span id="qnum">1</span>/<span id="qtotal">10</span></span></div>
<div class="game-card" id="card">
<div id="start-screen"><div class="hero-icon">✅❌</div><h1 class="game-title" id="title"></h1><p id="subtitle"></p><p class="section-label" id="rounds-label"></p><div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row"><button class="game-btn outline" onclick="setRounds(5,this)">5</button><button class="game-btn outline success" onclick="setRounds(10,this)">10</button><button class="game-btn outline" onclick="setRounds(15,this)">15</button></div><p class="section-label" id="level-label"></p><div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row"><button class="game-btn secondary" data-lvl="1" onclick="start(1)" id="lvl1"></button><button class="game-btn secondary" data-lvl="2" onclick="start(2)" id="lvl2"></button><button class="game-btn secondary" data-lvl="3" onclick="start(3)" id="lvl3"></button><button class="game-btn" data-lvl="0" onclick="start(0)" id="lvl0"></button></div></div>
<div id="play-screen" hidden><div class="game-question" id="question"></div><div class="answer-grid"><button class="game-btn success" onclick="answer(true,this)" id="btn-true"></button><button class="game-btn danger" onclick="answer(false,this)" id="btn-false"></button></div></div>
<div id="end-screen" class="end-screen" hidden><div class="stars" id="stars"></div><div class="big-score" id="final-score"></div><p id="player-line"></p><p><span id="best-label"></span>: <b id="best"></b></p><button class="game-btn" onclick="location.reload()" id="again"></button><div id="share-slot"></div></div>
</div>
<script src="../game-sdk.js"></script>
<script>
const T=IAKidsLang.t.bind(IAKidsLang),UI=IAKidsLang.ui.bind(IAKidsLang),$=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n);
const TXT_REGULAR={title:{he:'אמת או שקר בחשבון',en:'True or False Math',es:'Verdadero o falso',de:'Wahr oder falsch',pt:'Verdadeiro ou falso'},subtitle:{he:'האם התרגיל נכון? ענו מהר לפני שהפצצה מתפוצצת! 💣',en:'Is the equation right? Answer before the bomb! 💣',es:'¿Es correcta la cuenta? ¡Responde antes de la bomba! 💣',de:'Stimmt die Rechnung? Antworte vor der Bombe! 💣',pt:'A conta está certa? Responda antes da bomba! 💣'},rounds:{he:'כמה שאלות?',en:'How many questions?',es:'¿Cuántas preguntas?',de:'Wie viele Fragen?',pt:'Quantas perguntas?'},level:{he:'בחרו רמת קושי',en:'Choose difficulty'},truth:{he:'אמת',en:'True',es:'Verdadero',de:'Wahr',pt:'Verdadeiro'},falsehood:{he:'שקר',en:'False',es:'Falso',de:'Falsch',pt:'Falso'}};
const TXT_NIQQUD={title:{he:'אֱמֶת אוֹ שֶׁקֶר בְּחֶשְׁבּוֹן',en:'True or False Math'},subtitle:{he:'הַאִם הַתַּרְגִּיל נָכוֹן? עֲנוּ מַהֵר לִפְנֵי שֶׁהַפְּצָצָה מִתְפּוֹצֶצֶת! 💣',en:'Is the equation right? Answer before the bomb! 💣'},rounds:{he:'כַּמָּה שְׁאֵלוֹת?',en:'How many questions?'},level:{he:'בַּחֲרוּ רָמַת קֹשִׁי',en:'Choose difficulty'},truth:{he:'אֱמֶת',en:'True'},falsehood:{he:'שֶׁקֶר',en:'False'}};
let CHILD_AGE=null,USE_NIQQUD=false,TXT=TXT_REGULAR;let game,score=0,qnum=0,correct=0,current,level=1,answered=false,TOTAL=10,diff,timer,mistakes=0,timeouts=0,ending=false;
async function loadKidContext(){try{const kidId=localStorage.getItem('active_kid_id');if(!kidId)return;const client=await IAKidsActivity._getClient();const{data,error}=await client.from('kids_profiles').select('id, age').eq('id',kidId).maybeSingle();if(error||!data)return;CHILD_AGE=Number(data.age);USE_NIQQUD=CHILD_AGE===1||CHILD_AGE===2}catch(e){console.warn('[true-false-math] kid context',e)}}
function applyLanguage(){TXT=USE_NIQQUD?TXT_NIQQUD:TXT_REGULAR;$('title').textContent=T(TXT.title);$('subtitle').textContent=T(TXT.subtitle);$('rounds-label').textContent=T(TXT.rounds);$('level-label').textContent=T(TXT.level);$('score-label').textContent=UI('score');$('q-label').textContent=UI('question');$('best-label').textContent=UI('your_best');$('again').textContent=UI('play_again');$('lvl1').textContent=UI('level_easy');$('lvl2').textContent=UI('level_medium');$('lvl3').textContent=UI('level_hard');$('lvl0').textContent=UI('level_random');$('btn-true').textContent='✓ '+T(TXT.truth);$('btn-false').textContent='✗ '+T(TXT.falsehood)}
IAKidsCoins.mount();IAKidsHelp.mount({slug:'true-false-math',how:'מופיע תרגיל חשבון — מחליטים אם הוא נכון או שגוי לפני שהזמן נגמר.',example:'<span dir="ltr"><b>5 × 4 = 20</b></span> ← ✓ אמת<br><span dir="ltr"><b>5 × 4 = 22</b></span> ← ✗ שקר'});
function setRounds(n,btn){TOTAL=n;document.querySelectorAll('#rounds-row .game-btn').forEach(b=>b.classList.remove('success'));btn.classList.add('success')}
const ready=(async()=>{await loadKidContext();applyLanguage();game=await IAKidsGame.init('true-false-math');const p=await game.loadProgress();if(p?.rounds){const btn=document.querySelector(`#rounds-row [onclick*="(${p.rounds},"]`)||$('rounds-row').children[1];setRounds(p.rounds,btn)}if(p?.lastLevel!==undefined)document.querySelector(`#level-row [data-lvl="${p.lastLevel}"]`)?.classList.add('success')})();
const show=id=>['start-screen','play-screen','end-screen'].forEach(s=>$(s).hidden=s!==id);
async function start(selectedLevel){await ready;level=selectedLevel;diff=game.difficulty(selectedLevel||1,3);timer=game.timer({style:'bomb',onTimeout:()=>{if(!answered)handleTimeout()}});score=0;qnum=0;correct=0;mistakes=0;timeouts=0;ending=false;answered=false;$('score').textContent='0';$('qnum').textContent='1';$('qtotal').textContent=TOTAL;IAKidsActivity.configure({difficulty:selectedLevel||1,questionsCount:TOTAL,metadata:{game_mode:'true-false-math',selected_level:selectedLevel,random_difficulty:selectedLevel===0,child_age:CHILD_AGE,uses_niqqud:USE_NIQQUD,timer_enabled:true}});await game.saveProgress({lastLevel:selectedLevel,rounds:TOTAL});show('play-screen');await next()}
function makeQuestion(lvl){let a,b,op,val;if(lvl===1){if(Math.random()<.5){a=1+rnd(19);b=1+rnd(20-a);op='+';val=a+b}else{a=2+rnd(19);b=1+rnd(a);op='−';val=a-b}}else if(lvl===2){a=2+rnd(9);b=2+rnd(9);op='×';val=a*b}else{op=['+','−','×','÷'][rnd(4)];if(op==='+'){a=10+rnd(80);b=1+rnd(100-a);val=a+b}else if(op==='−'){a=20+rnd(80);b=1+rnd(a);val=a-b}else if(op==='×'){a=3+rnd(8);b=3+rnd(8);val=a*b}else{val=2+rnd(9);b=2+rnd(9);a=b*val}}const truth=Math.random()<.5;let shown=val;if(!truth){do{shown=val+(Math.random()<.5?1+rnd(3):-(1+rnd(3)))}while(shown<0||shown===val)}return{text:`${a} ${op} ${b} = ${shown}`,truth}}
async function next(){if(ending)return;if(qnum>=TOTAL){await end();return}qnum++;answered=false;$('qnum').textContent=qnum;$('btn-true').disabled=false;$('btn-false').disabled=false;const lvl=level===0?1+rnd(3):diff.level;const q=await game.newQuestion(()=>makeQuestion(lvl),x=>x.text);current=q.truth;IAKidsActivity.questionStarted();$('question').innerHTML=`<span dir="ltr">${q.text}</span>`;timer.start(IAKidsTimer.secondsFor(lvl))}
async function answer(said,btn){if(answered||ending)return;answered=true;timer.stop();$('btn-true').disabled=true;$('btn-false').disabled=true;if(said===current){score+=10;correct++;diff.right();IAKidsActivity.correct();IAKidsFX.correct(btn);await IAKidsCoins.right(btn)}else{mistakes++;diff.wrong();IAKidsActivity.wrong();if(btn)IAKidsFX.wrong(btn);await IAKidsCoins.wrong()}$('score').textContent=score;setTimeout(()=>next(),550)}
async function handleTimeout(){if(answered||ending)return;answered=true;timer.stop();timeouts++;$('btn-true').disabled=true;$('btn-false').disabled=true;diff.wrong();IAKidsActivity.skipped();await IAKidsCoins.wrong();setTimeout(()=>next(),550)}
async function end(){if(ending)return;ending=true;timer?.stop();const maxScore=TOTAL*10;const accuracy=correct/Math.max(1,correct+mistakes+timeouts);await game.saveScore(score,{level,correct,total:TOTAL,mistakes,timeouts});const top=(await game.getHighScores(1))[0];$('final-score').textContent=score;$('best').textContent=top?.score??score;$('player-line').textContent=`${top?.player||UI('guest')} · ${new Date().toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'})}`;$('stars').textContent='⭐'.repeat(accuracy>=.9?3:accuracy>=.6?2:1);await game.complete(score,{maxScore,performanceScore:Math.round(accuracy*100),metadata:{game_mode:'true-false-math',selected_level:level,random_difficulty:level===0,total_rounds:TOTAL,correct_answers:correct,mistakes,timeouts,child_age:CHILD_AGE,uses_niqqud:USE_NIQQUD,timer_enabled:true}});game.shareButton(score,$('share-slot'));show('end-screen')}
</script>
</body>
</html>
