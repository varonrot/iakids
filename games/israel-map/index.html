<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מפת ישראל | iakids</title>

<link rel="stylesheet" href="../game-style.css">

<style>
:root{
  --space-bg:#06142d;
  --space-panel:#0b2857;
  --space-panel-dark:#071d43;
  --space-line:rgba(119,176,255,.27);
  --space-text:#f7f9ff;
  --space-muted:#b8c7e3;
  --space-blue:#1693f1;
  --space-green:#1ea96b;
  --space-purple:#7653ff;
  --space-gold:#ffd15c;
}

html,body{min-height:100%}

body{
  margin:0 !important;
  min-height:100vh !important;
  padding:86px 18px 28px !important;
  overflow-x:hidden;
  color:var(--space-text) !important;
  font-family:"Heebo","Segoe UI",Arial,sans-serif !important;
  background:
    radial-gradient(circle at 12% 16%,rgba(26,139,255,.23),transparent 34%),
    radial-gradient(circle at 88% 10%,rgba(112,72,255,.25),transparent 35%),
    radial-gradient(circle at 50% 100%,rgba(12,184,203,.16),transparent 34%),
    linear-gradient(145deg,#050f25,#0a2148 52%,#07152e) !important;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.75) 0 1px,transparent 1.4px);
  background-size:56px 56px;
  opacity:.08;
}

*{box-sizing:border-box}

.game-card{
  width:min(520px,calc(100vw - 28px)) !important;
  min-height:690px;
  margin:0 auto !important;
  padding:0 !important;
  overflow:hidden;
  border:1px solid var(--space-line) !important;
  border-radius:28px !important;
  color:var(--space-text) !important;
  background:
    linear-gradient(180deg,rgba(17,58,111,.97),rgba(5,25,61,.98)) !important;
  box-shadow:
    0 28px 75px rgba(0,8,28,.48),
    inset 0 1px rgba(255,255,255,.08) !important;
}

.game-hud{
  position:fixed !important;
  top:0 !important;
  left:0 !important;
  right:0 !important;
  z-index:20;
  min-height:72px;
  padding:16px 24px !important;
  display:flex !important;
  align-items:center;
  justify-content:center !important;
  gap:42px;
  color:#fff !important;
  background:rgba(5,18,46,.88) !important;
  border-bottom:1px solid rgba(126,180,255,.18);
  backdrop-filter:blur(14px);
}

.game-hud .score{color:var(--space-gold) !important}

#start-screen,#play-screen,#end-screen{
  min-height:688px;
  padding:34px 30px 30px;
}

#start-screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.hero-icon{
  margin:6px 0 8px;
  font-size:5rem;
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.22));
}

.game-title{
  margin:0;
  font-size:clamp(2.15rem,7vw,3.15rem) !important;
  line-height:1.05;
  color:#fff !important;
  text-shadow:0 4px 12px rgba(0,0,0,.22);
}

#howto{
  max-width:410px;
  margin:14px auto 20px;
  color:var(--space-muted) !important;
  font-weight:600;
  line-height:1.65;
}

.section-label{
  margin:8px 0 10px;
  color:#fff;
  font-weight:900;
}

.answer-grid{
  width:100%;
  gap:12px !important;
}

.game-btn{
  min-height:54px;
  border-radius:15px !important;
  border:1px solid rgba(118,176,255,.34) !important;
  color:#fff !important;
  font-weight:900 !important;
  background:linear-gradient(180deg,#1c91db,#0877bd) !important;
  box-shadow:inset 0 1px rgba(255,255,255,.18),0 9px 20px rgba(0,0,0,.16) !important;
}

.game-btn:hover{transform:translateY(-2px)}
.game-btn.outline{background:linear-gradient(180deg,rgba(52,81,139,.72),rgba(21,49,99,.75)) !important}
.game-btn.success{background:linear-gradient(180deg,#37d182,#16ad64) !important;border-color:rgba(97,255,174,.6) !important}
#level-row{margin-top:16px}
#level-row .game-btn[data-lvl="0"]{background:linear-gradient(180deg,#8054ff,#6035dc) !important}

/* PLAY */
#play-screen{position:relative}

.play-note{
  margin:0 auto 12px;
  text-align:center;
  color:#d5e4fb;
  font-size:.96rem;
  font-weight:800;
}

#tray{
  min-height:104px;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
  padding:12px;
  border-radius:20px;
  background:rgba(4,22,55,.5);
  border:1px solid rgba(116,177,255,.18);
}

.chip{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:112px;
  min-height:54px;
  padding:8px 14px;
  border:1px solid rgba(129,190,255,.35);
  border-radius:15px;
  color:#fff;
  font-size:1rem;
  font-weight:900;
  cursor:grab;
  touch-action:none;
  user-select:none;
  white-space:nowrap;
  background:linear-gradient(180deg,#1c4e8d,#123b73);
  box-shadow:0 9px 19px rgba(0,0,0,.18),inset 0 1px rgba(255,255,255,.12);
}

.chip.dragging{
  position:fixed;
  z-index:100;
  pointer-events:none;
  cursor:grabbing;
  transform:scale(1.05);
  box-shadow:0 18px 40px rgba(0,0,0,.36);
}

#map-wrap{
  max-width:330px;
  margin:8px auto;
  position:relative;
  padding:14px 8px;
  border-radius:24px;
  background:
    radial-gradient(circle at 50% 15%,rgba(113,199,255,.16),transparent 55%),
    rgba(4,22,55,.46);
  border:1px solid rgba(116,177,255,.18);
}

#map-wrap svg{
  width:100%;
  height:auto;
  display:block;
  filter:drop-shadow(0 12px 20px rgba(0,0,0,.18));
}

.map-land{
  fill:#d9ecc9;
  stroke:#8fbf6b;
  stroke-width:1.2;
}

.map-point{
  fill:rgba(24,146,241,.16);
  stroke:#2cb2ff;
  stroke-width:1.5;
  stroke-dasharray:2 1;
  transition:fill .2s,stroke .2s,transform .2s;
  transform-box:fill-box;
  transform-origin:center;
}

.map-point.over{
  fill:rgba(56,210,131,.38);
  stroke:#5dffad;
  transform:scale(1.12);
}

.map-point.solved{
  fill:#2bc875;
  stroke:#2bc875;
  stroke-dasharray:none;
}

.map-pin{
  font-size:6px;
  pointer-events:none;
  text-anchor:middle;
  dominant-baseline:middle;
}

.map-label{
  font-size:5px;
  font-weight:900;
  fill:#fff;
  pointer-events:none;
  text-anchor:middle;
  dominant-baseline:middle;
  paint-order:stroke;
  stroke:rgba(0,0,0,.28);
  stroke-width:.7px;
}

/* END */
#end-screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.stars{
  min-height:78px;
  font-size:3.7rem !important;
  letter-spacing:4px;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.24));
}

.big-score{
  margin:8px 0;
  color:#fff !important;
  font-size:4rem !important;
  font-weight:1000;
}

#player-line,#end-screen p{color:#d7e3f7 !important}
#share-slot{margin-top:8px}
[hidden]{display:none !important}

@media(max-width:600px){
  body{padding:74px 10px 18px !important}

  .game-card{
    min-height:calc(100vh - 94px);
    border-radius:22px !important;
  }

  #start-screen,#play-screen,#end-screen{
    min-height:calc(100vh - 96px);
    padding:26px 15px 24px;
  }

  .game-hud{
    min-height:62px;
    padding:12px 14px !important;
    gap:24px;
  }

  .chip{
    min-width:calc(50% - 6px);
  }

  #map-wrap{max-width:300px}
}
</style>
</head>

<body>

<div class="game-hud">
  <span class="score">
    <span id="score-label">ניקוד</span>:
    <span id="score">0</span>
  </span>

  <span>
    <span id="q-label">מיקום</span>
    <span id="qnum">1</span>/<span id="qtotal">10</span>
  </span>
</div>

<div class="game-card" id="card">

  <div id="start-screen">
    <div class="hero-icon">🗺️🇮🇱</div>

    <h1 class="game-title" id="title"></h1>

    <p id="howto"></p>

    <p class="section-label" id="rounds-label"></p>

    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline success" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>

    <p class="section-label" id="level-label"></p>

    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)"></button>
      <button class="game-btn" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div class="play-note" id="play-note"></div>
    <div id="tray"></div>
    <div id="map-wrap"></div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>

<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);

const T_REGULAR = {
  title:{he:'מפת ישראל',en:'Map of Israel'},
  howto:{
    he:'גררו כל שם למקום הנכון שלו על המפה — הנקודות רחבות, אין צורך לדייק!',
    en:'Drag each name to its spot on the map — the target zones are generous!'
  },
  rounds:{he:'כמה מקומות?',en:'How many places?'},
  level:{he:'בחרו רמת קושי',en:'Choose difficulty'},
  play:{he:'גררו כל שם אל הנקודה המתאימה במפה',en:'Drag each name to the matching point on the map'}
};

const T_NIQQUD = {
  title:{he:'מַפַּת יִשְׂרָאֵל',en:'Map of Israel'},
  howto:{
    he:'גִּרְרוּ כָּל שֵׁם לַמָּקוֹם הַנָּכוֹן שֶׁלּוֹ עַל הַמַּפָּה — הַנְּקֻדּוֹת רְחָבוֹת, אֵין צֹרֶךְ לְדַיֵּק!',
    en:'Drag each name to its spot on the map — the target zones are generous!'
  },
  rounds:{he:'כַּמָּה מְקוֹמוֹת?',en:'How many places?'},
  level:{he:'בַּחֲרוּ רָמַת קֹשִׁי',en:'Choose difficulty'},
  play:{he:'גִּרְרוּ כָּל שֵׁם אֶל הַנְּקֻדָּה הַמַּתְאִימָה בַּמַּפָּה',en:'Drag each name to the matching point on the map'}
};

const CITIES_REGULAR = {
  haifa:{name:'חיפה',cx:18,cy:14},
  telaviv:{name:'תל אביב',cx:17,cy:42},
  jerusalem:{name:'ירושלים',cx:34,cy:48},
  beersheva:{name:'באר שבע',cx:30,cy:88},
  eilat:{name:'אילת',cx:39,cy:150},
  kinneret:{name:'כנרת',cx:52,cy:20},
  deadsea:{name:'ים המלח',cx:50,cy:68},
  negev:{name:'נגב',cx:34,cy:115},
  galilee:{name:'גליל',cx:32,cy:10}
};

const CITIES_NIQQUD = {
  haifa:{name:'חֵיפָה',cx:18,cy:14},
  telaviv:{name:'תֵּל אָבִיב',cx:17,cy:42},
  jerusalem:{name:'יְרוּשָׁלַיִם',cx:34,cy:48},
  beersheva:{name:'בְּאֵר שֶׁבַע',cx:30,cy:88},
  eilat:{name:'אֵילַת',cx:39,cy:150},
  kinneret:{name:'כִּנֶּרֶת',cx:52,cy:20},
  deadsea:{name:'יָם הַמֶּלַח',cx:50,cy:68},
  negev:{name:'נֶגֶב',cx:34,cy:115},
  galilee:{name:'גָּלִיל',cx:32,cy:10}
};

const POOL = {
  1:['haifa','telaviv','jerusalem'],
  2:['haifa','telaviv','jerusalem','beersheva','eilat'],
  3:['haifa','telaviv','jerusalem','beersheva','eilat','kinneret','deadsea','negev','galilee']
};

const ISRAEL_PATH =
  'M30,4 L46,3 L60,16 L50,26 L53,36 L59,46 L57,62 L53,78 L49,98 L45,120 L42,140 L40,157 L37,140 L33,118 L28,98 L23,78 L18,60 L15,45 L13,32 L15,15 L20,8 Z';

let CHILD_AGE = null;
let USE_NIQQUD = false;
let T = T_REGULAR;
let CITIES = CITIES_REGULAR;

let game, diff, level = 1, TOTAL = 10;
let score = 0, placed = 0, mistakes = 0;
let activeIds = POOL[1], drag = null, ending = false;

async function loadKidContext(){
  try{
    const kidId = localStorage.getItem('active_kid_id');
    if(!kidId) return;

    const client = await IAKidsActivity._getClient();

    const {data,error} = await client
      .from('kids_profiles')
      .select('id, age')
      .eq('id',kidId)
      .maybeSingle();

    if(error || !data){
      console.warn('[israel-map] Kid profile was not loaded',error);
      return;
    }

    CHILD_AGE = Number(data.age);
    USE_NIQQUD = CHILD_AGE === 1 || CHILD_AGE === 2;

  }catch(error){
    console.warn('[israel-map] loadKidContext error',error);
  }
}

function applyLanguage(){
  T = USE_NIQQUD ? T_NIQQUD : T_REGULAR;
  CITIES = USE_NIQQUD ? CITIES_NIQQUD : CITIES_REGULAR;

  $('title').textContent = IAKidsLang.t(T.title);
  $('howto').textContent = IAKidsLang.t(T.howto);
  $('rounds-label').textContent = IAKidsLang.t(T.rounds);
  $('level-label').textContent = IAKidsLang.t(T.level);
  $('play-note').textContent = IAKidsLang.t(T.play);
  $('score-label').textContent = IAKidsLang.ui('score');
  $('q-label').textContent = IAKidsLang.ui('question');
  $('best-label').textContent = IAKidsLang.ui('your_best');
  $('again-btn').textContent = IAKidsLang.ui('play_again');

  ['level_easy','level_medium','level_hard','level_random'].forEach((key,index)=>{
    document.querySelectorAll('#level-row .game-btn')[index].textContent =
      IAKidsLang.ui(key);
  });
}

IAKidsCoins.mount();

IAKidsHelp.mount({
  slug:'israel-map',
  how:'על המפה מסומנות נקודות. גוררים כל שם של עיר או אזור לנקודה שלו על המפה.',
  example:'גוררים את השבב <b>חיפה</b> אל הנקודה שבצפון, ליד החוף 🌊'
});

function setRounds(n,btn){
  TOTAL = n;

  document.querySelectorAll('#rounds-row .game-btn')
    .forEach(button=>button.classList.remove('success'));

  btn.classList.add('success');
}

const ready = (async()=>{
  await loadKidContext();
  applyLanguage();

  game = await IAKidsGame.init('israel-map');

  const progress = await game.loadProgress();

  if(progress?.rounds){
    const btn =
      document.querySelector(`#rounds-row [onclick*="(${progress.rounds},"]`) ||
      $('rounds-row').children[1];

    setRounds(progress.rounds,btn);
  }

  if(progress?.lastLevel !== undefined){
    document
      .querySelector(`#level-row [data-lvl="${progress.lastLevel}"]`)
      ?.classList.add('success');
  }
})();

const show = id=>{
  ['start-screen','play-screen','end-screen']
    .forEach(screen=>$(screen).hidden = screen !== id);
};

function renderMap(){
  const points = activeIds.map(id=>{
    const c = CITIES[id];

    return `
      <circle
        class="drop-zone map-point"
        data-city="${id}"
        cx="${c.cx}"
        cy="${c.cy}"
        r="6.5"
      ></circle>
      <text
        class="map-pin"
        x="${c.cx}"
        y="${c.cy}"
      >📍</text>
    `;
  }).join('');

  $('map-wrap').innerHTML = `
    <svg viewBox="0 0 100 160" preserveAspectRatio="xMidYMid meet">
      <path class="map-land" d="${ISRAEL_PATH}"></path>
      ${points}
    </svg>
  `;
}

async function start(selectedLevel){
  await ready;

  level = selectedLevel;

  const tier =
    selectedLevel === 0
      ? 1 + rnd(3)
      : selectedLevel;

  activeIds = POOL[tier];

  diff = game.difficulty(
    selectedLevel || 1,
    3
  );

  score = 0;
  placed = 0;
  mistakes = 0;
  ending = false;
  drag = null;

  $('score').textContent = '0';
  $('qnum').textContent = '1';
  $('qtotal').textContent = TOTAL;

  IAKidsActivity.configure({
    difficulty:selectedLevel || 1,
    questionsCount:TOTAL,
    metadata:{
      game_mode:'israel-map',
      selected_level:selectedLevel,
      random_difficulty:selectedLevel === 0,
      child_age:CHILD_AGE,
      uses_niqqud:USE_NIQQUD,
      map_tier:tier
    }
  });

  await game.saveProgress({
    lastLevel:selectedLevel,
    rounds:TOTAL
  });

  renderMap();
  show('play-screen');

  await fillTray();
}

async function fillTray(){
  const tray = $('tray');

  while(
    tray.querySelectorAll('.chip').length <
    Math.min(3,TOTAL - placed)
  ){
    const id = await game.newQuestion(
      ()=>activeIds[rnd(activeIds.length)],
      item=>item
    );

    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = CITIES[id].name;
    chip.dataset.city = id;

    makeDraggable(chip);

    tray.appendChild(chip);
  }
}

function makeDraggable(chip){
  chip.addEventListener('pointerdown',event=>{
    if(drag || ending) return;

    event.preventDefault();

    chip.setPointerCapture(
      event.pointerId
    );

    const rect =
      chip.getBoundingClientRect();

    drag = {
      chip,
      dx:event.clientX - rect.left,
      dy:event.clientY - rect.top
    };

    chip.style.width =
      `${rect.width}px`;

    chip.classList.add(
      'dragging'
    );

    IAKidsActivity.questionStarted();

    moveTo(event);
  });

  chip.addEventListener('pointermove',event=>{
    if(drag?.chip === chip){
      moveTo(event);
    }
  });

  chip.addEventListener('pointerup',event=>{
    if(drag?.chip === chip){
      dropChip(event);
    }
  });

  chip.addEventListener('pointercancel',()=>{
    if(drag?.chip === chip){
      settle(chip);
      drag = null;
      unmarkZones();
    }
  });
}

function moveTo(event){
  drag.chip.style.left =
    `${event.clientX - drag.dx}px`;

  drag.chip.style.top =
    `${event.clientY - drag.dy}px`;

  const zone =
    zoneAt(
      event.clientX,
      event.clientY
    );

  document.querySelectorAll('.drop-zone')
    .forEach(item=>
      item.classList.toggle(
        'over',
        item === zone
      )
    );
}

const zoneAt = (x,y)=>
  document.elementFromPoint(x,y)
    ?.closest('.drop-zone') || null;

const unmarkZones = ()=>
  document.querySelectorAll('.drop-zone')
    .forEach(item=>item.classList.remove('over'));

function settle(chip){
  chip.classList.remove('dragging');
  chip.style.left = '';
  chip.style.top = '';
  chip.style.width = '';
}

async function dropChip(event){
  const zone =
    zoneAt(
      event.clientX,
      event.clientY
    );

  unmarkZones();

  const chip = drag.chip;
  drag = null;

  settle(chip);

  if(!zone || ending) return;

  const correct =
    zone.dataset.city ===
    chip.dataset.city;

  if(correct){
    score += 10;
    placed++;

    $('score').textContent = score;
    $('qnum').textContent =
      Math.min(
        placed + 1,
        TOTAL
      );

    diff.right();

    IAKidsActivity.correct();

    IAKidsFX.correct(zone);
    await IAKidsCoins.right(zone);

    if(!zone.classList.contains('solved')){
      zone.classList.add('solved');

      const svg =
        zone.closest('svg');

      const label =
        document.createElementNS(
          'http://www.w3.org/2000/svg',
          'text'
        );

      label.setAttribute(
        'class',
        'map-label'
      );

      label.setAttribute(
        'x',
        zone.getAttribute('cx')
      );

      label.setAttribute(
        'y',
        parseFloat(
          zone.getAttribute('cy')
        ) + 10
      );

      label.textContent =
        CITIES[
          zone.dataset.city
        ].name;

      svg.appendChild(label);
    }

    chip.remove();

    if(placed >= TOTAL){
      await end();
      return;
    }

    await fillTray();

  }else{
    mistakes++;

    diff.wrong();

    IAKidsActivity.wrong();

    IAKidsFX.wrong(chip);

    await IAKidsCoins.wrong();
  }
}

async function end(){
  if(ending) return;

  ending = true;

  const maxScore =
    TOTAL * 10;

  const accuracy =
    TOTAL /
    Math.max(
      1,
      TOTAL + mistakes
    );

  await game.saveScore(
    score,
    {
      level,
      mistakes
    }
  );

  const top =
    (await game.getHighScores(1))[0];

  $('final-score').textContent =
    score;

  $('best').textContent =
    top?.score ?? score;

  $('player-line').textContent =
    `${top?.player || IAKidsLang.ui('guest')} · ${
      new Date().toLocaleString(
        'he-IL',
        {
          dateStyle:'short',
          timeStyle:'short'
        }
      )
    }`;

  $('stars').textContent =
    '⭐'.repeat(
      accuracy >= .85
        ? 3
        : accuracy >= .6
          ? 2
          : 1
    );

  await game.complete(
    score,
    {
      maxScore,

      performanceScore:
        Math.round(
          accuracy * 100
        ),

      metadata:{
        game_mode:'israel-map',
        selected_level:level,
        random_difficulty:level === 0,
        total_locations:TOTAL,
        placed_locations:placed,
        mistakes,
        child_age:CHILD_AGE,
        uses_niqqud:USE_NIQQUD,
        active_locations:activeIds
      }
    }
  );

  game.shareButton(
    score,
    $('share-slot')
  );

  show('end-screen');
}
</script>
