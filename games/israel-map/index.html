<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מפת ישראל | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:52px;padding:8px 14px;margin:6px;background:var(--accent-soft);border:3px solid var(--accent);border-radius:16px;font-size:1.15rem;font-weight:800;cursor:grab;touch-action:none;white-space:nowrap}
.chip.dragging{position:fixed;z-index:30;pointer-events:none;cursor:grabbing;box-shadow:var(--shadow)}
#tray{min-height:80px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
#map-wrap{max-width:320px;margin:8px auto;position:relative}
#map-wrap svg{width:100%;height:auto;display:block}
.map-land{fill:#d9ecc9;stroke:#8fbf6b;stroke-width:1}
.map-point{fill:rgba(255,106,42,.18);stroke:var(--accent);stroke-width:1.4;stroke-dasharray:2 1;transition:fill .2s}
.map-point.over{fill:rgba(255,106,42,.55)}
.map-point.solved{fill:var(--green);stroke:var(--green);stroke-dasharray:none}
.map-pin{font-size:6px;pointer-events:none;text-anchor:middle;dominant-baseline:middle}
.map-label{font-size:5px;font-weight:800;fill:#fff;pointer-events:none;text-anchor:middle;dominant-baseline:middle}
</style>
</head>
<body>

<div class="game-hud">
  <span class="score"><span id="score-label">ניקוד</span>: <span id="score">0</span></span>
  <span><span id="q-label">מיקום</span> <span id="qnum">1</span>/<span id="qtotal">10</span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div style="font-size:4rem">🗺️</div>
    <h1 class="game-title" id="title"></h1>
    <p id="howto"></p>
    <p id="rounds-label"></p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)"></button>
      <button class="game-btn" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div id="tray"></div>
    <div id="map-wrap"></div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>
<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);

const T = {
  title:  { he: 'מפת ישראל', en: 'Map of Israel' },
  howto:  { he: 'גררו כל שם למקום הנכון שלו על המפה — הנקודות רחבות, אין צורך לדייק!', en: 'Drag each name to its spot on the map — the target zones are generous!' },
  rounds: { he: 'כמה מקומות?', en: 'How many places?' },
};

// approximate positions on a simplified north-up outline (viewBox 0 0 100 160)
const CITIES = {
  haifa:      { name: 'חיפה',      cx: 18, cy: 14 },
  telaviv:    { name: 'תל אביב',   cx: 17, cy: 42 },
  jerusalem:  { name: 'ירושלים',   cx: 34, cy: 48 },
  beersheva:  { name: 'באר שבע',   cx: 30, cy: 88 },
  eilat:      { name: 'אילת',      cx: 39, cy: 150 },
  kinneret:   { name: 'כנרת',      cx: 52, cy: 20 },
  deadsea:    { name: 'ים המלח',   cx: 50, cy: 68 },
  negev:      { name: 'נגב',       cx: 34, cy: 115 },
  galilee:    { name: 'גליל',      cx: 32, cy: 10 },
};
const POOL = {
  1: ['haifa', 'telaviv', 'jerusalem'],
  2: ['haifa', 'telaviv', 'jerusalem', 'beersheva', 'eilat'],
  3: ['haifa', 'telaviv', 'jerusalem', 'beersheva', 'eilat', 'kinneret', 'deadsea', 'negev', 'galilee'],
};
const ISRAEL_PATH = 'M30,4 L46,3 L60,16 L50,26 L53,36 L59,46 L57,62 L53,78 L49,98 L45,120 L42,140 L40,157 L37,140 L33,118 L28,98 L23,78 L18,60 L15,45 L13,32 L15,15 L20,8 Z';

IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'israel-map',
  how: 'על המפה מסומנות נקודות עגולות. גוררים כל שם של עיר או אזור לנקודה שלו על המפה. אפשר לטעות במעט — הנקודות רחבות!',
  example: 'גוררים את השבב <b>חיפה</b> אל הנקודה שבצפון, ליד החוף 🌊',
});
$('title').textContent = IAKidsLang.t(T.title);
$('howto').textContent = IAKidsLang.t(T.howto);
$('rounds-label').textContent = IAKidsLang.t(T.rounds);
$('score-label').textContent = IAKidsLang.ui('score');
$('best-label').textContent = IAKidsLang.ui('your_best');
$('again-btn').textContent = IAKidsLang.ui('play_again');
['level_easy', 'level_medium', 'level_hard', 'level_random'].forEach((k, i) =>
  document.querySelectorAll('#level-row .game-btn')[i].textContent = IAKidsLang.ui(k));

let game, diff, level = 1, TOTAL = 10, score = 0, placed = 0, mistakes = 0, activeIds = POOL[1];

function setRounds(n, btn) {
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.remove('success'));
  btn.classList.add('success');
}

const ready = IAKidsGame.init('israel-map').then(async g => {
  game = g;
  const p = await g.loadProgress();
  if (p?.rounds) setRounds(p.rounds, document.querySelector(`#rounds-row [onclick*="(${p.rounds},"]`) || $('rounds-row').children[1]);
  if (p?.lastLevel != null) document.querySelector(`#level-row [data-lvl="${p.lastLevel}"]`)?.classList.add('success');
});

const show = id => {
  for (const s of ['start-screen', 'play-screen', 'end-screen']) $(s).hidden = s !== id;
};

function renderMap() {
  const points = activeIds.map(id => {
    const c = CITIES[id];
    return `<circle class="drop-zone map-point" data-city="${id}" cx="${c.cx}" cy="${c.cy}" r="6.5"></circle>
            <text class="map-pin" x="${c.cx}" y="${c.cy}">📍</text>`;
  }).join('');
  $('map-wrap').innerHTML = `
    <svg viewBox="0 0 100 160" preserveAspectRatio="xMidYMid meet">
      <path class="map-land" d="${ISRAEL_PATH}"></path>
      ${points}
    </svg>`;
}

async function start(lvl) {
  await ready;
  level = lvl;
  const tier = lvl === 0 ? 1 + rnd(3) : lvl;
  activeIds = POOL[tier];
  diff = game.difficulty(lvl || 1, 3);
  await game.saveProgress({ lastLevel: lvl, rounds: TOTAL });
  $('qtotal').textContent = TOTAL;
  renderMap();
  show('play-screen');
  await fillTray();
}

async function fillTray() {
  const tray = $('tray');
  while (tray.querySelectorAll('.chip').length < Math.min(3, TOTAL - placed)) {
    const id = await game.newQuestion(() => activeIds[rnd(activeIds.length)], x => x);
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = CITIES[id].name;
    chip.dataset.city = id;
    makeDraggable(chip);
    tray.appendChild(chip);
  }
}

/* ---- Pointer Events drag (works on touch — setPointerCapture, not HTML5 DnD) ---- */
let drag = null;
function makeDraggable(chip) {
  chip.addEventListener('pointerdown', e => {
    if (drag) return;
    e.preventDefault();
    chip.setPointerCapture(e.pointerId);
    const r = chip.getBoundingClientRect();
    drag = { chip, dx: e.clientX - r.left, dy: e.clientY - r.top };
    chip.style.width = r.width + 'px';
    chip.classList.add('dragging');
    moveTo(e);
  });
  chip.addEventListener('pointermove', e => { if (drag?.chip === chip) moveTo(e); });
  chip.addEventListener('pointerup', e => { if (drag?.chip === chip) dropChip(e); });
  chip.addEventListener('pointercancel', () => {
    if (drag?.chip === chip) { settle(chip); drag = null; unmarkZones(); }
  });
}
function moveTo(e) {
  drag.chip.style.left = (e.clientX - drag.dx) + 'px';
  drag.chip.style.top = (e.clientY - drag.dy) + 'px';
  const z = zoneAt(e.clientX, e.clientY);
  document.querySelectorAll('.drop-zone').forEach(zn => zn.classList.toggle('over', zn === z));
}
const zoneAt = (x, y) => document.elementFromPoint(x, y)?.closest('.drop-zone') || null;
const unmarkZones = () => document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('over'));
function settle(chip) {
  chip.classList.remove('dragging');
  chip.style.left = chip.style.top = chip.style.width = '';
}

async function dropChip(e) {
  const z = zoneAt(e.clientX, e.clientY);
  unmarkZones();
  const chip = drag.chip;
  drag = null;
  settle(chip);
  if (!z) return;
  const correct = z.dataset.city === chip.dataset.city;
  if (correct) {
    score += 10;
    placed++;
    $('score').textContent = score;
    $('qnum').textContent = Math.min(placed + 1, TOTAL);
    diff.right();
    IAKidsFX.correct(z);
    IAKidsCoins.right(z);
    if (!z.classList.contains('solved')) {
      z.classList.add('solved');
      const svg = z.closest('svg');
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('class', 'map-label');
      label.setAttribute('x', z.getAttribute('cx'));
      label.setAttribute('y', parseFloat(z.getAttribute('cy')) + 10);
      label.textContent = CITIES[z.dataset.city].name;
      svg.appendChild(label);
    }
    chip.remove();
    if (placed >= TOTAL) return end();
    await fillTray();
  } else {
    mistakes++;
    diff.wrong();
    IAKidsFX.wrong(chip);
    IAKidsCoins.wrong();
  }
}

async function end() {
  await game.saveScore(score, { level, mistakes });
  const top = (await game.getHighScores(1))[0];
  $('final-score').textContent = score;
  $('best').textContent = top?.score ?? score;
  $('player-line').textContent = `${top?.player || IAKidsLang.ui('guest')} · ${new Date().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}`;
  const acc = TOTAL / (TOTAL + mistakes);
  $('stars').textContent = '⭐'.repeat(acc >= 0.85 ? 3 : acc >= 0.6 ? 2 : 1);
  game.shareButton(score, $('share-slot'));
  show('end-screen');
  game.complete(score);
}
</script>
</body>
</html>
