<style>
/* ==================================================
   SOLAR SYSTEM — ORIGINAL GAME LOGIC + PREMIUM SHELL
================================================== */

:root{
  --space-bg:#06142d;
  --space-panel:#0b2857;
  --space-panel-dark:#071d43;
  --space-line:rgba(130,191,255,.28);
  --space-text:#f7f9ff;
  --space-muted:#bfd1ec;
  --space-blue:#44c8ff;
  --space-green:#4fe39b;
  --space-purple:#7653ff;
}

html,
body,
button{
  font-family:"Heebo","Segoe UI",Arial,sans-serif !important;
}

*{
  box-sizing:border-box;
}

body{
  margin:0 !important;
  min-height:100vh !important;
  padding:88px 18px 30px !important;

  display:flex !important;
  flex-direction:column !important;
  align-items:center !important;
  justify-content:center !important;

  color:var(--space-text) !important;

  background:

    radial-gradient(circle at 88% 10%,rgba(117,72,255,.25),transparent 35%),
    radial-gradient(circle at 50% 108%,rgba(17,211,151,.16),transparent 38%),
    linear-gradient(145deg,#050f25,#0a2148 52%,#07152e) !important;

  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;

  background-image:
    radial-gradient(circle,rgba(255,255,255,.78) 0 1px,transparent 1.4px);

  background-size:66px 66px;
  opacity:.15;
}

/* חזרה למפה */

.workspace-back{
  position:fixed;
  top:14px;
  right:82px;
  z-index:900;

  min-height:48px;
  padding:0 18px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;

  color:#fff;
  text-decoration:none;
  font-size:14px;
  font-weight:900;

  border:1px solid rgba(160,191,255,.34);
  border-radius:16px;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),

}

/* HUD */

.game-hud{
  position:relative !important;
  inset:auto !important;
  transform:none !important;
  z-index:10 !important;

  min-width:0 !important;
  min-height:58px !important;

  padding:8px 20px !important;

  align-items:center !important;
  justify-content:center !important;

  color:#fff !important;

  border:1px solid rgba(126,180,255,.24) !important;
  border-bottom:0 !important;
  border-radius:26px 26px 0 0 !important;

  background:
    linear-gradient(145deg,rgba(27,45,87,.98),rgba(9,22,50,.98)) !important;

  box-shadow:
    inset 0 -1px 0 rgba(255,255,255,.03),
    0 9px 23px rgba(0,0,0,.18) !important;

  font-size:15px !important;
  font-weight:900 !important;
}

.game-hud .score{
  color:#ffc83d !important;
}

.game-hud #score{
  color:#fff !important;
  font-size:18px;
}

.game-hud #qnum,
.game-hud #qtotal{
  color:#69deff !important;
}

/* Main card */

.game-card{
  position:relative !important;

  width:min(760px,100%) !important;
  min-height:650px !important;

  margin:0 auto !important;
  padding:28px 38px 38px !important;

    inset 0 1px 0 rgba(255,255,255,.08),

}

.game-card::before{
  content:"";
  position:absolute;
  inset:10px;
  pointer-events:none;

  border:1px solid rgba(126,180,255,.13);
  border-radius:24px;
}

#start-screen,
#play-screen,
#end-screen{
  position:relative;
  z-index:3;
}

#start-screen{
  text-align:center;
}

.start-emoji{
  margin-top:2px;
  font-size:5rem;
  line-height:1;

  filter:drop-shadow(0 13px 18px rgba(0,0,0,.35));
  animation:planetFloat 3s ease-in-out infinite;
}

@keyframes planetFloat{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-7px) rotate(2deg)}
}

.game-title{
  margin:13px 0 10px !important;

  color:#fff !important;

  font-size:clamp(38px,5vw,54px) !important;
  line-height:1.08 !important;
  font-weight:900 !important;

  text-shadow:

}

#howto{

#rounds-label{

.answer-grid{

#rounds-row{

}

#level-row{

.game-btn{

  border:1px solid rgba(255,255,255,.19) !important;

.game-btn:disabled{

.slot.over{

.slot .rank{

.slot .p{

.slot .n{

  line-height:1.15;
  font-weight:800;
  text-align:center;

#trivia-mode{

.game-question{

  font-size:1.4rem !important;
  line-height:1.55;
  font-weight:900 !important;
  text-align:center;

/* End */

.end-screen{

  flex-direction:column;

.end-screen .stars{

.end-screen .big-score{

/* חלונית עזרה */

[role="dialog"] [class*="example"],
[class*="help"] [class*="example"]{

<script>
const $ = id =>
  document.getElementById(id);

const rnd = n =>
  Math.floor(Math.random() * n);

/* ==================================================
   GRADE + NIQQUD
================================================== */

function numberValue(value){
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function gradeFromObject(raw){
  if (!raw) return null;

  try{
    const value =
      typeof raw === 'string'
        ? JSON.parse(raw)
        : raw;

    return (
      numberValue(value?.grade) ??
      numberValue(value?.age) ??
      numberValue(value?.class_grade) ??
      numberValue(value?.school_grade)
    );
  }catch{
    return null;
  }
}

function getChildGrade(){
  const directKeys = [
    'active_kid_grade',
    'iakids_active_kid_grade',
    'selected_kid_grade',
    'kid_grade',
    'grade',
    'active_kid_age',
    'kid_age',
    'age'
  ];

  for (const key of directKeys){
    const grade =
      numberValue(
        localStorage.getItem(key)
      );

    if (grade !== null){
      return grade;
    }
  }

  const objectKeys = [
    'active_kid',
    'iakids_active_kid',
    'selected_kid',
    'kid_profile',
    'active_kid_profile'
  ];

  for (const key of objectKeys){
    const grade =
      gradeFromObject(
        localStorage.getItem(key)
      );

    if (grade !== null){
      return grade;
    }
  }

  return null;
}

const CHILD_AGE =
  getChildGrade();

const USE_NIQQUD =
  CHILD_AGE === 1 ||
  CHILD_AGE === 2;

================================================== */

function setRounds(n,button){
  TOTAL = n;

  document
    .querySelectorAll(
      '#rounds-row .game-btn'
    )
    .forEach(btn => {
      btn.classList.remove(
        'success'
      );
    });

  button?.classList.add(
    'success'
  );

  $('qtotal').textContent =
    String(TOTAL);
}

function show(id){
  for (
    const screenId of [
      'start-screen',
      'play-screen',
      'end-screen'
    ]
  ){
    $(screenId).hidden =
      screenId !== id;
  }
}

function showMode(id){
  $('order-mode').style.display =
    id === 'order-mode'
      ? 'block'
      : 'none';

  $('trivia-mode').style.display =
    id === 'trivia-mode'
      ? 'block'
      : 'none';
}

function resetState(){
  score = 0;
  qnum = 0;
  mistakes = 0;

  placed.clear();

  $('score').textContent = '0';
  $('qnum').textContent = '1';
  $('qtotal').textContent =
    String(TOTAL);

  $('tray').innerHTML = '';
  $('slots').innerHTML = '';
}

/* ==================================================
   START — SESSION ONLY AFTER CLICK
================================================== */

async function startGame(selectedLevel){
  if (starting) return;

  starting = true;

  document
    .querySelectorAll(
      '#level-row .game-btn'
    )
    .forEach(button => {
      button.disabled = true;
    });

  try{
    game =
      await IAKidsGame.init(
        'solar-system'
      );

    level =
      selectedLevel;

    boardSize =
      selectedLevel === 1
        ? 4
        : 8;

    resetState();

    diff =
      game.difficulty(
        selectedLevel || 1,
        3
      );

    IAKidsActivity.configure({
      difficulty:selectedLevel,
      questionsCount:TOTAL,

      metadata:{
        selected_level:
          selectedLevel,

        random_difficulty:
          selectedLevel === 0,

        game_mode:
          'solar-system',

        board_size:
          boardSize,

        child_age:
          CHILD_AGE,

        uses_niqqud:
          USE_NIQQUD
      }
    });

    await game.saveProgress({
      lastLevel:selectedLevel,
      rounds:TOTAL
    });

    renderSlots();

    show('play-screen');

    await nextQuestion();

  }catch(error){
    console.error(
      'solar-system start failed:',
      error
    );

    alert(
      'המשחק לא הצליח להתחיל. בדוק את ה-Console.'
    );

  }finally{
    starting = false;

    document
      .querySelectorAll(
        '#level-row .game-btn'
      )
      .forEach(button => {
        button.disabled = false;
      });
  }
}

/* ==================================================
   BOARD
================================================== */

function renderSlots(){
  placed.clear();

  const row =
    $('slots');

  row.innerHTML =
    '<span class="sun-marker">☀️</span>';

  for (
    let rank = 1;
    rank <= boardSize;
    rank++
  ){
    const slot =
      document.createElement(
        'div'
      );

    slot.className = 'slot';
    slot.dataset.rank =
      String(rank);

    slot.innerHTML =
      `<span class="rank">${rank}</span>`;

    row.appendChild(slot);
  }
}

/* ==================================================
   QUESTION FLOW
================================================== */

async function nextQuestion(){
  if (qnum >= TOTAL){
    await endGame();
    return;
  }

  qnum++;

  $('qnum').textContent =
    String(qnum);

  IAKidsActivity.questionStarted();

  const effectiveLevel =
    level === 0
      ? diff.level
      : level;

  if (effectiveLevel >= 3){
    showMode('trivia-mode');
    await showTrivia();
  }else{
    showMode('order-mode');
    await showOrderItem();
  }
}

/* ==================================================
   TRIVIA
================================================== */

async function showTrivia(){
  let question = null;

  try{
    question =
      await game.newQuestion(
        () =>
          TRIVIA[
            rnd(TRIVIA.length)
          ],

        item =>
          `trivia:${qnum}:${item.ans}`
      );
  }catch(error){
    console.warn(
      'Trivia newQuestion fallback:',
      error
    );
  }

  if (!question){
    question =
      TRIVIA[
        rnd(TRIVIA.length)
      ];
  }

  $('trivia-q').textContent =
    question.q;

  const box =
    $('trivia-opts');

  box.innerHTML = '';

  let answered = false;

  const options =
    [...question.opts]
      .sort(
        () =>
          Math.random() - .5
      );

  options.forEach(key => {
    const button =
      document.createElement(
        'button'
      );

    button.className =
      'game-btn secondary';

    button.textContent =
      byKey(key).n;

    button.onclick = () => {
      if (answered) return;

      answered = true;

      answerTrivia(
        key === question.ans,
        button
      );
    };

    box.appendChild(button);
  });
}

function answerTrivia(correct,button){
  if (correct){
    score += 10;

    diff?.right();

    IAKidsActivity.correct();

    IAKidsFX.correct(button);
    IAKidsCoins.right(button);
  }else{
    mistakes++;

    diff?.wrong();

    IAKidsActivity.wrong();

    IAKidsFX.wrong(button);
    IAKidsCoins.wrong();
  }

  $('score').textContent =
    String(score);

  setTimeout(
    () => nextQuestion(),
    700
  );
}

/* ==================================================
   ORDER MODE
================================================== */

async function showOrderItem(){
  if (
    placed.size >=
    boardSize
  ){
    renderSlots();
  }

  const tray =
    $('tray');

  tray.innerHTML = '';

  const pool =
    PLANETS.filter(
      planet =>
        planet.rank <= boardSize &&
        !placed.has(planet.rank)
    );

  /*
    לעולם לא משאירים את הילד בלי כרטיס.
  */
  if (!pool.length){
    renderSlots();
    return showOrderItem();
  }

  let question = null;

  try{
    question =
      await game.newQuestion(
        () =>
          pool[
            rnd(pool.length)
          ],

        planet =>
          `order:${qnum}:${planet.key}`
      );
  }catch(error){
    console.warn(
      'Order newQuestion fallback:',
      error
    );
  }

  if (!question){
    question =
      pool[
        rnd(pool.length)
      ];
  }

  const chip =
    document.createElement(
      'div'
    );

  chip.className = 'chip';

  chip.innerHTML =
    `<span class="p" ` +
    `style="width:${question.d}px;` +
    `height:${question.d}px;` +
    `background:${question.c}"></span>` +
    `<span class="n">${question.n}</span>`;

  chip.dataset.rank =
    String(question.rank);

  makeDraggable(chip);

  tray.appendChild(chip);
}

/* ==================================================
   ORIGINAL POINTER DRAG
================================================== */

let drag = null;

function makeDraggable(chip){
  chip.addEventListener(
    'pointerdown',
    event => {
      if (drag) return;

      event.preventDefault();

      chip.setPointerCapture(
        event.pointerId
      );

      const rect =
        chip.getBoundingClientRect();

      drag = {
        chip,
        dx:
          event.clientX -
          rect.left,

        dy:
          event.clientY -
          rect.top
      };

      chip.style.width =
        `${rect.width}px`;

      chip.classList.add(
        'dragging'
      );

      moveTo(event);
    }
  );

  chip.addEventListener(
    'pointermove',
    event => {
      if (drag?.chip === chip){
        moveTo(event);
      }
    }
  );

  chip.addEventListener(
    'pointerup',
    event => {
      if (drag?.chip === chip){
        dropChip(event);
      }
    }
  );

  chip.addEventListener(
    'pointercancel',
    () => {
      if (drag?.chip !== chip){
        return;
      }

      settle(chip);
      drag = null;
      unmarkZones();
    }
  );
}

function moveTo(event){
  if (!drag) return;

  drag.chip.style.left =
    `${
      event.clientX -
      drag.dx
    }px`;

  drag.chip.style.top =
    `${
      event.clientY -
      drag.dy
    }px`;

  const zone =
    zoneAt(
      event.clientX,
      event.clientY
    );

  document
    .querySelectorAll('.slot')
    .forEach(candidate => {
      candidate.classList.toggle(
        'over',
        candidate === zone
      );
    });
}

function zoneAt(x,y){
  return (
    document
      .elementFromPoint(x,y)
      ?.closest('.slot') ||
    null
  );
}

function unmarkZones(){
  document
    .querySelectorAll('.slot')
    .forEach(zone => {
      zone.classList.remove(
        'over'
      );
    });
}

function settle(chip){
  chip.classList.remove(
    'dragging'
  );

  chip.style.left = '';
  chip.style.top = '';
  chip.style.width = '';
}

async function dropChip(event){
  const zone =
    zoneAt(
      event.clientX,
      event.clientY
    );

  unmarkZones();

  const chip =
    drag.chip;

  drag = null;

  settle(chip);

  if (
    !zone ||
    zone.children.length > 1
  ){
    return;
  }

  const correct =
    String(zone.dataset.rank) ===
    String(chip.dataset.rank);

  if (correct){
    score += 10;

    $('score').textContent =
      String(score);

    diff?.right();

    IAKidsActivity.correct();

    IAKidsFX.correct(zone);
    IAKidsCoins.right(zone);

    zone.innerHTML =
      `<span class="rank">` +
      `${zone.dataset.rank}` +
      `</span>` +
      chip.innerHTML;

    placed.add(
      Number(chip.dataset.rank)
    );

    chip.remove();

    setTimeout(
      () => nextQuestion(),
      400
    );

  }else{
    mistakes++;

    diff?.wrong();

    IAKidsActivity.wrong();

    IAKidsFX.wrong(chip);
    IAKidsCoins.wrong();
  }
}

/* ==================================================
   END + DATABASE
================================================== */

async function endGame(){
  const maxScore =
    TOTAL * 10;

  /*
    קודם סוגרים את ה-session בטבלה.
    כך leaderboard או share לא יכולים לבטל פרוגרס.
  */
  try{
    await game.complete(
      score,
      {
        maxScore,

        metadata:{
          selected_level:
            level,

          random_difficulty:
            level === 0,

          total_rounds:
            TOTAL,

          mistakes,

          board_size:
            boardSize,

          game_mode:
            'solar-system',

          child_age:
            CHILD_AGE,

          uses_niqqud:
            USE_NIQQUD
        }
      }
    );

    console.log(
      'Solar-system session completed',
      {
        score,
        maxScore,
        level,
        mistakes,
        totalRounds:TOTAL
      }
    );

  }catch(error){
    console.error(
      'solar-system complete failed:',
      error
    );

    alert(
      'המשחק הסתיים, אבל שמירת הפרוגרס נכשלה. בדוק את ה-Console.'
    );

    return;
  }

  try{
    await game.saveScore(
      score,
      {
        level,
        mistakes,
        rounds:TOTAL,
        board_size:boardSize
      }
    );

    const topScores =
      await game.getHighScores(1);

    const top =
      topScores?.[0];

    $('final-score').textContent =
      String(score);

    $('best').textContent =
      String(top?.score ?? score);

    $('player-line').textContent =
      `${
        top?.player ||
        IAKidsLang.ui('guest')
      } · ${
        new Date()
          .toLocaleString(
            'he-IL',
            {
              dateStyle:'short',
              timeStyle:'short'
            }
          )
      }`;

    const attempts =
      TOTAL + mistakes;

    const accuracy =
      attempts > 0
        ? TOTAL / attempts
        : 0;

    $('stars').textContent =
      '⭐'.repeat(
        accuracy >= .9
          ? 3
          : accuracy >= .7
            ? 2
            : 1
      );

    show('end-screen');

    game.shareButton(
      score,
      $('share-slot')
    );

  }catch(error){
    console.error(
      'solar-system end screen failed:',
      error
    );

    $('final-score').textContent =
      String(score);

    $('best').textContent =
      String(score);

    show('end-screen');
  }
}
