<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit &amp; Veggie Sorting | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:76px;min-height:64px;padding:6px 14px;margin:6px;background:var(--accent-soft);border:3px solid var(--accent);border-radius:16px;font-size:1.2rem;font-weight:800;cursor:grab;touch-action:none}
.chip.dragging{position:fixed;z-index:30;pointer-events:none;cursor:grabbing;box-shadow:var(--shadow)}
#tray{min-height:90px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.drop-zone h3{margin:0 0 6px;font-size:1.1rem}
.bin-items{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:34px}
.bin-items span{background:var(--green);color:#fff;border-radius:10px;padding:4px 10px;font-weight:700;font-size:0.95rem}
</style>
</head>
<body>

<div class="game-hud">
  <span class="score"><span id="score-label">ניקוד</span>: <span id="score">0</span></span>
  <span><span id="q-label">פריט</span> <span id="qnum">1</span>/<span id="qtotal">10</span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div style="font-size:4rem">🍎</div>
    <h1 class="game-title" id="title"></h1>
    <p id="howto"></p>
    <p id="rounds-label"></p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)"></button>
      <button class="game-btn" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div id="tray"></div>
    <div class="bins">
      <div class="drop-zone" data-cat="fruit"><h3 id="fruit-label" dir="ltr">🍓 Fruits</h3><div class="bin-items"></div></div>
      <div class="drop-zone" data-cat="veggie"><h3 id="veggie-label" dir="ltr">🥕 Vegetables</h3><div class="bin-items"></div></div>
    </div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>
<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const T = {
  title:  { he: 'מיון פירות וירקות', en: 'Fruit & Veggie Sorting' },
  howto:  { he: 'גרור כל פריט לסל הנכון: פירות או ירקות!', en: 'Drag each item to the right bin: Fruits or Vegetables!' },
  rounds: { he: 'כמה פריטים למיין?', en: 'How many items?' },
};
// Easy = familiar produce, Medium = less familiar, Hard uses the same bank but shows text only (no emoji)
const FAMILIAR = new Set(['apple','banana','orange','carrot','tomato','potato','strawberry','cucumber','grape','onion']);
const BANK = [
  { name: 'apple', emoji: '🍎', cat: 'fruit' }, { name: 'banana', emoji: '🍌', cat: 'fruit' },
  { name: 'orange', emoji: '🍊', cat: 'fruit' }, { name: 'grape', emoji: '🍇', cat: 'fruit' },
  { name: 'strawberry', emoji: '🍓', cat: 'fruit' }, { name: 'watermelon', emoji: '🍉', cat: 'fruit' },
  { name: 'pineapple', emoji: '🍍', cat: 'fruit' }, { name: 'peach', emoji: '🍑', cat: 'fruit' },
  { name: 'cherry', emoji: '🍒', cat: 'fruit' }, { name: 'mango', emoji: '🥭', cat: 'fruit' },
  { name: 'pear', emoji: '🍐', cat: 'fruit' }, { name: 'kiwi', emoji: '🥝', cat: 'fruit' },
  { name: 'lemon', emoji: '🍋', cat: 'fruit' }, { name: 'coconut', emoji: '🥥', cat: 'fruit' },
  { name: 'avocado', emoji: '🥑', cat: 'fruit' }, { name: 'blueberry', emoji: '🫐', cat: 'fruit' },
  { name: 'carrot', emoji: '🥕', cat: 'veggie' }, { name: 'potato', emoji: '🥔', cat: 'veggie' },
  { name: 'tomato', emoji: '🍅', cat: 'veggie' }, { name: 'cucumber', emoji: '🥒', cat: 'veggie' },
  { name: 'onion', emoji: '🧅', cat: 'veggie' }, { name: 'garlic', emoji: '🧄', cat: 'veggie' },
  { name: 'broccoli', emoji: '🥦', cat: 'veggie' }, { name: 'corn', emoji: '🌽', cat: 'veggie' },
  { name: 'pepper', emoji: '🫑', cat: 'veggie' }, { name: 'eggplant', emoji: '🍆', cat: 'veggie' },
  { name: 'mushroom', emoji: '🍄', cat: 'veggie' }, { name: 'lettuce', emoji: '🥬', cat: 'veggie' },
  { name: 'pumpkin', emoji: '🎃', cat: 'veggie' }, { name: 'beans', emoji: '🫘', cat: 'veggie' },
];
IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'fruit-veggie-sort',
  how: 'גוררים כל פריט (אימוג׳י + שם באנגלית) לסל הנכון: Fruits לפירות, Vegetables לירקות.',
  example: '<span dir="ltr"><b>🍎 Apple</b></span> ← Fruits · <span dir="ltr"><b>🥕 Carrot</b></span> ← Vegetables',
});
$('title').textContent = IAKidsLang.t(T.title);
$('howto').textContent = IAKidsLang.t(T.howto);
$('rounds-label').textContent = IAKidsLang.t(T.rounds);
$('score-label').textContent = IAKidsLang.ui('score');
$('q-label').textContent = IAKidsLang.ui('question');
$('best-label').textContent = IAKidsLang.ui('your_best');
$('again-btn').textContent = IAKidsLang.ui('play_again');
['level_easy','level_medium','level_hard','level_random'].forEach((k,i) =>
  document.querySelectorAll('#level-row .game-btn')[i].textContent = IAKidsLang.ui(k));

let game, diff, level = 1, TOTAL = 10, score = 0, sorted = 0, mistakes = 0;

function setRounds(n, btn) {
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.remove('success'));
  btn.classList.add('success');
}

const ready = IAKidsGame.init('fruit-veggie-sort').then(async g => {
  game = g;
  const p = await g.loadProgress();
  if (p?.rounds) setRounds(p.rounds, document.querySelector(`#rounds-row [onclick*="(${p.rounds},"]`) || $('rounds-row').children[1]);
  if (p?.lastLevel != null) document.querySelector(`#level-row [data-lvl="${p.lastLevel}"]`)?.classList.add('success');
});

const show = id => {
  for (const s of ['start-screen', 'play-screen', 'end-screen']) $(s).hidden = s !== id;
};

async function start(lvl) {
  await ready;
  level = lvl;
  diff = game.difficulty(lvl || 1, 3);
  await game.saveProgress({ lastLevel: lvl, rounds: TOTAL });
  $('qtotal').textContent = TOTAL;
  show('play-screen');
  await fillTray();
}

// level 1: familiar produce (with emoji) · 2: less-familiar produce (with emoji) · 3: any item, word only (no emoji)
function makeItem(lvl) {
  if (lvl === 0) lvl = 1 + rnd(3);
  const pool = lvl === 1 ? BANK.filter(b => FAMILIAR.has(b.name))
             : lvl === 2 ? BANK.filter(b => !FAMILIAR.has(b.name))
             : BANK;
  const it = pool[rnd(pool.length)];
  return { name: it.name, emoji: it.emoji, cat: it.cat, showEmoji: lvl !== 3 };
}

async function fillTray() {
  const tray = $('tray');
  while (tray.querySelectorAll('.chip').length < Math.min(4, TOTAL - sorted)) {
    const lvl = level === 0 ? 1 + rnd(3) : diff.level;
    const q = await game.newQuestion(() => makeItem(lvl), x => x.name);
    const chip = document.createElement('div');
    chip.className = 'chip';
    const label = q.showEmoji ? `${q.emoji} ${cap(q.name)}` : cap(q.name);
    chip.innerHTML = `<span dir="ltr">${label}</span>`;
    chip.dataset.cat = q.cat;
    makeDraggable(chip);
    tray.appendChild(chip);
  }
}
const cap = s => s[0].toUpperCase() + s.slice(1);

/* ---- Pointer Events drag (works on touch — setPointerCapture, not HTML5 DnD) ---- */
let drag = null;
function makeDraggable(chip) {
  chip.addEventListener('pointerdown', e => {
    if (drag) return;
    e.preventDefault();
    chip.setPointerCapture(e.pointerId);
    const r = chip.getBoundingClientRect();
    drag = { chip, dx: e.clientX - r.left, dy: e.clientY - r.top };
    chip.style.width = r.width + 'px';
    chip.classList.add('dragging');
    moveTo(e);
  });
  chip.addEventListener('pointermove', e => { if (drag?.chip === chip) moveTo(e); });
  chip.addEventListener('pointerup', e => { if (drag?.chip === chip) dropChip(e); });
  chip.addEventListener('pointercancel', () => {
    if (drag?.chip === chip) { settle(chip); drag = null; unmarkZones(); }
  });
}
function moveTo(e) {
  drag.chip.style.left = (e.clientX - drag.dx) + 'px';
  drag.chip.style.top = (e.clientY - drag.dy) + 'px';
  const z = zoneAt(e.clientX, e.clientY);
  document.querySelectorAll('.drop-zone').forEach(zn => zn.classList.toggle('over', zn === z));
}
const zoneAt = (x, y) => document.elementFromPoint(x, y)?.closest('.drop-zone') || null;
const unmarkZones = () => document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('over'));
function settle(chip) {
  chip.classList.remove('dragging');
  chip.style.left = chip.style.top = chip.style.width = '';
}

async function dropChip(e) {
  const z = zoneAt(e.clientX, e.clientY);
  unmarkZones();
  const chip = drag.chip;
  drag = null;
  settle(chip);
  if (!z) return;
  const correct = z.dataset.cat === chip.dataset.cat;
  if (correct) {
    score += 10;
    sorted++;
    $('score').textContent = score;
    $('qnum').textContent = Math.min(sorted + 1, TOTAL);
    diff.right();
    IAKidsFX.correct(z);
    IAKidsCoins.right(z);
    const s = document.createElement('span');
    s.innerHTML = chip.innerHTML;
    z.querySelector('.bin-items').appendChild(s);
    chip.remove();
    if (sorted >= TOTAL) return end();
    await fillTray();
  } else {
    mistakes++;
    diff.wrong();
    IAKidsFX.wrong(chip);
    IAKidsCoins.wrong();
  }
}

async function end() {
  await game.saveScore(score, { level, mistakes });
  const top = (await game.getHighScores(1))[0];
  $('final-score').textContent = score;
  $('best').textContent = top?.score ?? score;
  $('player-line').textContent = `${top?.player || IAKidsLang.ui('guest')} · ${new Date().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}`;
  const acc = TOTAL / (TOTAL + mistakes);
  $('stars').textContent = '⭐'.repeat(acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : 1);
  game.shareButton(score, $('share-slot'));
  show('end-screen');
  game.complete(score);
}
</script>
</body>
</html>
