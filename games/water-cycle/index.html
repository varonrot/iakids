<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מחזור המים בטבע | iakids</title>
<link rel="stylesheet" href="../game-style.css">
<style>
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:110px;min-height:56px;padding:8px 14px;margin:6px;background:var(--accent-soft);border:3px solid var(--accent);border-radius:16px;font-size:1.15rem;font-weight:800;cursor:grab;touch-action:none}
.chip.dragging{position:fixed;z-index:30;pointer-events:none;cursor:grabbing;box-shadow:var(--shadow)}
#tray,#seq-tray{min-height:76px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
#illustration{position:relative;width:100%;max-width:440px;margin:8px auto;aspect-ratio:300/180;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
#illustration svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hotspot{position:absolute;border:3px dashed rgba(59,130,246,.55);border-radius:14px;transition:background .2s,border-color .2s;display:flex;align-items:center;justify-content:center;text-align:center}
.hotspot.over{border-color:var(--accent);background:rgba(255,106,42,.25)}
.hotspot.filled{border-style:solid;border-color:var(--green);background:rgba(34,197,94,.35)}
.hotspot span{background:#fff;border-radius:10px;padding:3px 8px;font-weight:800;font-size:0.95rem;box-shadow:var(--shadow)}
#seq-slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.slot{min-width:110px;min-height:60px;border:3px dashed var(--muted);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;transition:background .2s,border-color .2s}
.slot.over{border-color:var(--accent);background:var(--accent-soft)}
.slot .rank{font-size:0.7rem;font-weight:800;color:var(--muted)}
.slot .n{font-size:1rem;font-weight:800}
#trivia-mode,#sequence-mode{display:none}
#seq-title{font-weight:700;margin-top:10px}
</style>
</head>
<body>

<div class="game-hud">
  <span class="score"><span id="score-label">ניקוד</span>: <span id="score">0</span></span>
  <span><span id="q-label">שאלה</span> <span id="qnum">1</span>/<span id="qtotal">10</span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div style="font-size:4rem">💧☁️🌧️</div>
    <h1 class="game-title" id="title"></h1>
    <p id="howto"></p>
    <p id="rounds-label"></p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)"></button>
      <button class="game-btn" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div id="order-mode">
      <div id="illustration">
        <svg viewBox="0 0 300 180" aria-hidden="true">
          <rect x="0" y="0" width="300" height="180" fill="#cfe8fa"/>
          <rect x="0" y="120" width="300" height="60" fill="#5b9bd5"/>
          <path d="M40,112 C30,125 55,132 45,145 C38,155 20,158 12,180 L0,180 L0,110 Z" fill="#c9a876"/>
          <path d="M42,115 C32,128 52,134 42,148 C34,158 22,162 14,180" stroke="#3b82f6" stroke-width="5" fill="none"/>
          <circle cx="252" cy="34" r="22" fill="#facc15"/>
          <g fill="#ffffff" stroke="#cbd5e1">
            <ellipse cx="80" cy="46" rx="30" ry="18"/>
            <ellipse cx="55" cy="52" rx="20" ry="14"/>
            <ellipse cx="105" cy="52" rx="22" ry="14"/>
          </g>
          <g stroke="#3b82f6" stroke-width="3" stroke-linecap="round">
            <line x1="60" y1="78" x2="52" y2="98"/>
            <line x1="78" y1="78" x2="70" y2="102"/>
            <line x1="96" y1="78" x2="88" y2="98"/>
          </g>
        </svg>
        <div class="hotspot" data-stage="condensation" style="left:14%;top:10%;width:40%;height:28%"><span></span></div>
        <div class="hotspot" data-stage="precipitation" style="left:14%;top:40%;width:38%;height:24%"><span></span></div>
        <div class="hotspot" data-stage="runoff" style="left:0%;top:66%;width:26%;height:30%"><span></span></div>
        <div class="hotspot" data-stage="evaporation" style="left:52%;top:64%;width:46%;height:32%"><span></span></div>
      </div>
      <div id="tray"></div>
    </div>
    <div id="trivia-mode">
      <div class="game-question" id="trivia-q"></div>
      <div class="answer-grid" id="trivia-opts"></div>
    </div>
    <div id="sequence-mode">
      <p id="seq-title"></p>
      <div id="seq-slots"></div>
      <div id="seq-tray"></div>
    </div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label"></span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()"></button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../game-sdk.js"></script>
<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const T = {
  title:   { he: 'מחזור המים בטבע', en: 'The Water Cycle' },
  howto:   { he: 'גרור כל שלב למקום הנכון באיור!', en: 'Drag each stage to its place on the picture!' },
  rounds:  { he: 'כמה שאלות?', en: 'How many questions?' },
  seqTitle:{ he: 'עכשיו סדרו את השלבים לפי הסדר הנכון בזמן!', en: 'Now put the stages in the correct order!' },
};
IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'water-cycle',
  how: 'מים בטבע עוברים מסע אינסופי: השמש מחממת את הים והמים <b>מתאדים</b> (אידוי) ועולים לשמיים. שם הם מתקררים ונהפכים לטיפות שיוצרות ענן (<b>עיבוי</b>). כשהענן מתמלא, יורד גשם (<b>משקעים</b>). הגשם זורם בנחלים בחזרה לים (<b>הזרמה</b>) — והמסע מתחיל מחדש! גוררים כל שלב למקום שלו באיור, ואז מסדרים את השלבים לפי סדר הזמן הנכון.',
  example: '💧☀️ אידוי ← ☁️ עיבוי ← 🌧️ משקעים ← 🌊 הזרמה ← (וחוזר חלילה)',
});
$('title').textContent = IAKidsLang.t(T.title);
$('howto').textContent = IAKidsLang.t(T.howto);
$('rounds-label').textContent = IAKidsLang.t(T.rounds);
$('score-label').textContent = IAKidsLang.ui('score');
$('best-label').textContent = IAKidsLang.ui('your_best');
$('again-btn').textContent = IAKidsLang.ui('play_again');
$('seq-title').textContent = IAKidsLang.t(T.seqTitle);
['level_easy','level_medium','level_hard','level_random'].forEach((k,i) =>
  document.querySelectorAll('#level-row .game-btn')[i].textContent = IAKidsLang.ui(k));

/* Verified scientific order: evaporation -> condensation -> precipitation -> runoff/collection */
const STAGES = [
  { id:'evaporation',   n:'אידוי',    e:'💧☀️', rank:1, why:'השמש מחממת את המים בים והם הופכים לאדים שעולים לשמיים' },
  { id:'condensation',  n:'עיבוי',    e:'☁️',   rank:2, why:'האדים בשמיים מתקררים והופכים לטיפות מים קטנות שיוצרות ענן' },
  { id:'precipitation', n:'משקעים',   e:'🌧️',   rank:3, why:'הענן מתמלא בטיפות כבדות שנופלות כגשם או שלג' },
  { id:'runoff',        n:'הזרמה',    e:'🌊',   rank:4, why:'הגשם שנופל זורם בנחלים ובנהרות בחזרה לים' },
];

let game, diff, level = 1, TOTAL = 10, score = 0, qnum = 0, mistakes = 0, stageCount = 3;
const placed = new Set();

function setRounds(n, btn) {
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.remove('success'));
  btn.classList.add('success');
}

const ready = IAKidsGame.init('water-cycle').then(async g => {
  game = g;
  const p = await g.loadProgress();
  if (p?.rounds) setRounds(p.rounds, document.querySelector(`#rounds-row [onclick*="(${p.rounds},"]`) || $('rounds-row').children[1]);
  if (p?.lastLevel != null) document.querySelector(`#level-row [data-lvl="${p.lastLevel}"]`)?.classList.add('success');
});

const show = id => {
  for (const s of ['start-screen', 'play-screen', 'end-screen']) $(s).hidden = s !== id;
};
const showMode = id => {
  for (const s of ['order-mode', 'trivia-mode', 'sequence-mode']) $(s).style.display = s === id ? 'block' : 'none';
};

async function start(lvl) {
  await ready;
  level = lvl;
  stageCount = lvl === 1 ? 3 : 4; // easy: evap/cond/precip · medium+/random/hard board: + runoff
  diff = game.difficulty(lvl || 1, 3);
  await game.saveProgress({ lastLevel: lvl, rounds: TOTAL });
  $('qtotal').textContent = TOTAL;
  document.querySelectorAll('.hotspot').forEach(h => {
    h.hidden = STAGES.find(s => s.id === h.dataset.stage).rank > stageCount;
  });
  placed.clear();
  document.querySelectorAll('.hotspot').forEach(h => { h.classList.remove('filled'); h.querySelector('span').textContent = ''; });
  show('play-screen');
  next();
}

async function next() {
  if (qnum >= TOTAL) return startSequenceStep();
  qnum++;
  $('qnum').textContent = qnum;
  const effLvl = level === 0 ? diff.level : level;
  if (effLvl >= 3) { showMode('trivia-mode'); await showTrivia(); }
  else { showMode('order-mode'); await showOrderItem(); }
}

async function showTrivia() {
  const t = await game.newQuestion(() => STAGES[rnd(stageCount)], s => 'trivia:' + s.id);
  $('trivia-q').textContent = t.why + ' — ' + IAKidsLang.t({ he:'איך קוראים לשלב הזה?', en:'What is this stage called?' });
  const box = $('trivia-opts');
  box.innerHTML = '';
  let answered = false; // guard: ignore a double-tap on the same question (SDK's 700ms next() delay leaves buttons live)
  const opts = STAGES.slice(0, stageCount).sort(() => Math.random() - 0.5);
  opts.forEach(s => {
    const b = document.createElement('button');
    b.className = 'game-btn secondary';
    b.textContent = `${s.e} ${s.n}`;
    b.onclick = () => { if (answered) return; answered = true; answerTrivia(s.id === t.id, b); };
    box.appendChild(b);
  });
}
function answerTrivia(correct, btn) {
  if (correct) { score += 10; diff.right(); IAKidsFX.correct(btn); IAKidsCoins.right(btn); }
  else { mistakes++; diff.wrong(); IAKidsFX.wrong(btn); IAKidsCoins.wrong(); }
  $('score').textContent = score;
  setTimeout(next, 700);
}

async function showOrderItem() {
  if (placed.size >= stageCount) { // board full — reset for a fresh round of labeling
    placed.clear();
    document.querySelectorAll('.hotspot').forEach(h => { h.classList.remove('filled'); h.querySelector('span').textContent = ''; });
  }
  const tray = $('tray');
  tray.innerHTML = '';
  const s = await game.newQuestion(
    () => {
      const pool = STAGES.slice(0, stageCount).filter(x => !placed.has(x.id));
      return pool[rnd(pool.length)];
    },
    x => 'order:' + x.id
  );
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.innerHTML = `<span>${s.e}</span><span>${s.n}</span>`;
  chip.dataset.stage = s.id;
  chip.dataset.name = s.n;
  makeDraggable(chip, '.hotspot', dropOnHotspot);
  tray.appendChild(chip);
}

async function startSequenceStep() {
  showMode('sequence-mode');
  const slots = $('seq-slots');
  slots.innerHTML = '';
  for (let r = 1; r <= stageCount; r++) {
    const s = document.createElement('div');
    s.className = 'slot';
    s.dataset.rank = r;
    s.innerHTML = `<span class="rank">${r}</span>`;
    slots.appendChild(s);
  }
  seqPlaced.clear();
  await seqNextItem();
}

const seqPlaced = new Set();
async function seqNextItem() {
  if (seqPlaced.size >= stageCount) return end();
  const tray = $('seq-tray');
  tray.innerHTML = '';
  const pool = STAGES.slice(0, stageCount).filter(x => !seqPlaced.has(x.id));
  const s = pool[rnd(pool.length)];
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.innerHTML = `<span>${s.e}</span><span>${s.n}</span>`;
  chip.dataset.rank = s.rank;
  chip.dataset.stage = s.id;
  makeDraggable(chip, '.slot', dropOnSlot);
  tray.appendChild(chip);
}

/* ---- Pointer Events drag (works on touch — setPointerCapture, not HTML5 DnD) ---- */
let drag = null;
function makeDraggable(chip, zoneSelector, onDrop) {
  chip.addEventListener('pointerdown', e => {
    if (drag) return;
    e.preventDefault();
    chip.setPointerCapture(e.pointerId);
    const r = chip.getBoundingClientRect();
    drag = { chip, dx: e.clientX - r.left, dy: e.clientY - r.top, zoneSelector, onDrop };
    chip.style.width = r.width + 'px';
    chip.classList.add('dragging');
    moveTo(e);
  });
  chip.addEventListener('pointermove', e => { if (drag?.chip === chip) moveTo(e); });
  chip.addEventListener('pointerup', e => { if (drag?.chip === chip) finishDrag(e); });
  chip.addEventListener('pointercancel', () => {
    if (drag?.chip === chip) { settle(chip); unmarkZones(drag.zoneSelector); drag = null; }
  });
}
function moveTo(e) {
  drag.chip.style.left = (e.clientX - drag.dx) + 'px';
  drag.chip.style.top = (e.clientY - drag.dy) + 'px';
  const z = zoneAt(e.clientX, e.clientY, drag.zoneSelector);
  document.querySelectorAll(drag.zoneSelector).forEach(zn => zn.classList.toggle('over', zn === z));
}
const zoneAt = (x, y, sel) => document.elementFromPoint(x, y)?.closest(sel) || null;
const unmarkZones = sel => document.querySelectorAll(sel).forEach(z => z.classList.remove('over'));
function settle(chip) {
  chip.classList.remove('dragging');
  chip.style.left = chip.style.top = chip.style.width = '';
}
function finishDrag(e) {
  const { chip, zoneSelector, onDrop } = drag;
  const z = zoneAt(e.clientX, e.clientY, zoneSelector);
  unmarkZones(zoneSelector);
  drag = null;
  settle(chip);
  onDrop(chip, z);
}

function dropOnHotspot(chip, z) {
  if (!z || z.classList.contains('filled')) return;
  const correct = z.dataset.stage === chip.dataset.stage;
  if (correct) {
    score += 10;
    $('score').textContent = score;
    diff.right();
    IAKidsFX.correct(z);
    IAKidsCoins.right(z);
    z.classList.add('filled');
    z.querySelector('span').textContent = chip.dataset.name;
    placed.add(chip.dataset.stage);
    chip.remove();
    setTimeout(next, 500);
  } else {
    mistakes++;
    diff.wrong();
    IAKidsFX.wrong(chip);
    IAKidsCoins.wrong();
  }
}

function dropOnSlot(chip, z) {
  if (!z || z.children.length > 1) return;
  const correct = String(z.dataset.rank) === chip.dataset.rank;
  if (correct) {
    score += 10;
    $('score').textContent = score;
    IAKidsFX.correct(z);
    IAKidsCoins.right(z);
    z.innerHTML = `<span class="rank">${z.dataset.rank}</span><span class="n">${chip.innerHTML}</span>`;
    seqPlaced.add(chip.dataset.stage);
    chip.remove();
    setTimeout(seqNextItem, 400);
  } else {
    mistakes++;
    IAKidsFX.wrong(chip);
    IAKidsCoins.wrong();
  }
}

async function end() {
  await game.saveScore(score, { level, mistakes });
  const top = (await game.getHighScores(1))[0];
  $('final-score').textContent = score;
  $('best').textContent = top?.score ?? score;
  $('player-line').textContent = `${top?.player || IAKidsLang.ui('guest')} · ${new Date().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}`;
  const acc = TOTAL / (TOTAL + mistakes);
  $('stars').textContent = '⭐'.repeat(acc >= 0.9 ? 3 : acc >= 0.7 ? 2 : 1);
  game.shareButton(score, $('share-slot'));
  show('end-screen');
  game.complete(score);
}
</script>
</body>
</html>
