<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);

/* ==================================================
   GRADE / AGE AND NIQQUD
================================================== */

function readNumber(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function readGradeObject(raw) {
  if (!raw) return null;

  try {
    const value =
      typeof raw === 'string'
        ? JSON.parse(raw)
        : raw;

    return (
      readNumber(value?.grade) ??
      readNumber(value?.age) ??
      readNumber(value?.class_grade) ??
      readNumber(value?.school_grade)
    );
  } catch {
    return null;
  }
}

function getChildGrade() {
  const directKeys = [
    'active_kid_grade',
    'iakids_active_kid_grade',
    'selected_kid_grade',
    'kid_grade',
    'grade',
    'active_kid_age',
    'kid_age',
    'age'
  ];

  for (const key of directKeys) {
    const value =
      readNumber(
        localStorage.getItem(key)
      );

    if (value !== null) {
      return value;
    }
  }

  const objectKeys = [
    'active_kid',
    'iakids_active_kid',
    'selected_kid',
    'kid_profile',
    'active_kid_profile'
  ];

  for (const key of objectKeys) {
    const value =
      readGradeObject(
        localStorage.getItem(key)
      );

    if (value !== null) {
      return value;
    }
  }

  return null;
}

const CHILD_GRADE = getChildGrade();
const USE_NIQQUD =
  CHILD_GRADE === 1 ||
  CHILD_GRADE === 2;

/* ==================================================
   TEXT
================================================== */

const T_REGULAR = {
  title: {
    he: 'מחזור המים בטבע',
    en: 'The Water Cycle'
  },
  howto: {
    he: 'גרור כל שלב למקום הנכון באיור!',
    en: 'Drag each stage to its place on the picture!'
  },
  rounds: {
    he: 'כמה שאלות?',
    en: 'How many questions?'
  },
  seqTitle: {
    he: 'עכשיו סדרו את השלבים לפי הסדר הנכון בזמן!',
    en: 'Now put the stages in the correct order!'
  },
  trivia: {
    he: 'איך קוראים לשלב הזה?',
    en: 'What is this stage called?'
  }
};

const T_NIQQUD = {
  title: {
    he: 'מַחְזוֹר הַמַּיִם בַּטֶּבַע',
    en: 'The Water Cycle'
  },
  howto: {
    he: 'גִּרְרוּ כָּל שָׁלָב לַמָּקוֹם הַנָּכוֹן בָּאִיּוּר!',
    en: 'Drag each stage to its place on the picture!'
  },
  rounds: {
    he: 'כַּמָּה שְׁאֵלוֹת?',
    en: 'How many questions?'
  },
  seqTitle: {
    he: 'עַכְשָׁו סַדְּרוּ אֶת הַשְּׁלָבִים לְפִי הַסֵּדֶר הַנָּכוֹן בַּזְּמַן!',
    en: 'Now put the stages in the correct order!'
  },
  trivia: {
    he: 'אֵיךְ קוֹרְאִים לַשָּׁלָב הַזֶּה?',
    en: 'What is this stage called?'
  }
};

const T =
  USE_NIQQUD
    ? T_NIQQUD
    : T_REGULAR;

/* ==================================================
   ORIGINAL GAME STAGES
================================================== */

const STAGES_REGULAR = [
  {
    id:'evaporation',
    n:'אידוי',
    e:'💧☀️',
    rank:1,
    why:'השמש מחממת את המים בים והם הופכים לאדים שעולים לשמיים'
  },
  {

    rank:2,
    why:'האדים בשמיים מתקררים והופכים לטיפות מים קטנות שיוצרות ענן'
  },
  {

];

const STAGES_NIQQUD = [
  {
    id:'evaporation',
    n:'אִדּוּי',
    e:'💧☀️',
    rank:1,
    why:'הַשֶּׁמֶשׁ מְחַמֶּמֶת אֶת הַמַּיִם בַּיָּם וְהֵם הוֹפְכִים לְאֵדִים שֶׁעוֹלִים לַשָּׁמַיִם'
  },
  {
    id:'condensation',
    n:'עִבּוּי',

  },

];

const STAGES =

================================================== */

  how:
    'מים בטבע עוברים מסע אינסופי: השמש מחממת את הים והמים <b>מתאדים</b> (אידוי) ועולים לשמיים. שם הם מתקררים ונהפכים לטיפות שיוצרות ענן (<b>עיבוי</b>). כשהענן מתמלא, יורד גשם (<b>משקעים</b>). הגשם זורם בנחלים בחזרה לים (<b>הזרמה</b>) — והמסע מתחיל מחדש! גוררים כל שלב למקום שלו באיור, ואז מסדרים את השלבים לפי סדר הזמן הנכון.',
  example:
    '💧☀️ אידוי ← ☁️ עיבוי ← 🌧️ משקעים ← 🌊 הזרמה ← (וחוזר חלילה)'
};

const HELP_NIQQUD = {
  how:
    'מַיִם בַּטֶּבַע עוֹבְרִים מַסָּע אֵין־סוֹפִי: הַשֶּׁמֶשׁ מְחַמֶּמֶת אֶת הַיָּם וְהַמַּיִם <b>מִתְאַדִּים</b> וְעוֹלִים לַשָּׁמַיִם. שָׁם הֵם מִתְקָרְרִים וְהוֹפְכִים לְטִפּוֹת שֶׁיּוֹצְרוֹת עָנָן (<b>עִבּוּי</b>). כְּשֶׁהֶעָנָן מִתְמַלֵּא יוֹרֵד גֶּשֶׁם (<b>מִשְׁקָעִים</b>). הַגֶּשֶׁם זוֹרֵם בַּנְּחָלִים בַּחֲזָרָה לַיָּם (<b>הַזְרָמָה</b>) — וְהַמַּסָּע מַתְחִיל מֵחָדָשׁ.',
  example:
    '💧☀️ אִדּוּי ← ☁️ עִבּוּי ← 🌧️ מִשְׁקָעִים ← 🌊 הַזְרָמָה ← וְחוֹזֵר חֲלִילָה'
};

const HELP_TEXT =
  USE_NIQQUD
    ? HELP_NIQQUD
    : HELP_REGULAR;

IAKidsCoins.mount();

IAKidsHelp.mount({
  slug:'water-cycle',
  how:HELP_TEXT.how,
  example:HELP_TEXT.example
});

/* תיקון צבע הדוגמה בחלונית העזרה */
function fixHelpExampleColor() {
  document
    .querySelectorAll('body *')
    .forEach(element => {
      const text =
        (element.textContent || '').trim();

      if (
        text.includes('אידוי') ||
        text.includes('אִדּוּי')
      ) {
        const dialog =
          element.closest('[role="dialog"]');

        if (dialog) {
          element.style.color = '#102a4f';
          element.style.textShadow = 'none';

          element
            .querySelectorAll('*')
            .forEach(child => {
              child.style.color = '#102a4f';
              child.style.textShadow = 'none';
            });
        }
      }
    });
}

new MutationObserver(
  fixHelpExampleColor
).observe(
  document.body,
  {
    childList:true,
    subtree:true
  }
);

/* ==================================================
   INITIAL UI
================================================== */

$('title').textContent =
  IAKidsLang.t(T.title);

$('howto').textContent =
  IAKidsLang.t(T.howto);

$('rounds-label').textContent =
  IAKidsLang.t(T.rounds);

$('score-label').textContent =
  USE_NIQQUD
    ? 'נִקּוּד'
    : IAKidsLang.ui('score');

$('q-label').textContent =
  USE_NIQQUD
    ? 'שְׁאֵלָה'
    : 'שאלה';

$('best-label').textContent =
  IAKidsLang.ui('your_best');

$('again-btn').textContent =
  IAKidsLang.ui('play_again');

$('seq-title').textContent =
  IAKidsLang.t(T.seqTitle);

$('back-text').textContent =
  USE_NIQQUD
    ? 'חֲזָרָה לְמַפַּת הַמִּשְׂחָקִים'
    : 'חזרה למפת המשחקים';

['level_easy','level_medium','level_hard','level_random']
  .forEach((key,index) => {
    const regular =
      IAKidsLang.ui(key);

    const niqqud = [
      'קַל',
      'בֵּינוֹנִי',
      'קָשֶׁה',
      'אַקְרָאִי'
    ][index];

    document
      .querySelectorAll(

      )[index]

  });

/* ==================================================
   ORIGINAL GAME STATE
================================================== */

let game = null;
let diff = null;

let level = 1;
let TOTAL = 10;
let score = 0;
let qnum = 0;
let mistakes = 0;
let stageCount = 3;
let starting = false;

const placed = new Set();
const seqPlaced = new Set();

function setRounds(n, btn) {
  TOTAL = n;

  document
    .querySelectorAll(
      '#rounds-row .game-btn'
    )
    .forEach(button => {
      button.classList.remove(
        'success'
      );
    });

  btn?.classList.add('success');

  $('qtotal').textContent =
    String(TOTAL);
}

const show = id => {
  for (
    const screen of [
      'start-screen',
      'play-screen',
      'end-screen'
    ]
  ) {
    $(screen).hidden =
      screen !== id;
  }
};

const showMode = id => {
  for (
    const mode of [
      'order-mode',
      'trivia-mode',
      'sequence-mode'
    ]
  ) {
    $(mode).style.display =
      mode === id
        ? 'block'
        : 'none';
  }
};

/* ==================================================
   START — SESSION IS CREATED ONLY ON CLICK
================================================== */

async function start(lvl) {
  if (starting) return;

  starting = true;

  try {
    game =
      await IAKidsGame.init(
        'water-cycle'
      );

    level = lvl;

    stageCount =
      lvl === 1
        ? 3
        : 4;

    score = 0;
    qnum = 0;
    mistakes = 0;

    placed.clear();
    seqPlaced.clear();

    $('score').textContent = '0';
    $('qnum').textContent = '1';
    $('qtotal').textContent =
      String(TOTAL);

    diff =
      game.difficulty(
        lvl || 1,
        3
      );

    IAKidsActivity.configure({
      difficulty:lvl,
      questionsCount:TOTAL,

      metadata:{
        selected_level:lvl,
        random_difficulty:
          lvl === 0,
        game_mode:'water-cycle',
        child_grade:CHILD_GRADE,
        uses_niqqud:USE_NIQQUD
      }
    });

    await game.saveProgress({
      lastLevel:lvl,
      rounds:TOTAL
    });

    document
      .querySelectorAll('.hotspot')
      .forEach(hotspot => {
        hotspot.hidden =
          STAGES.find(
            stage =>
              stage.id ===
              hotspot.dataset.stage
          ).rank > stageCount;
      });

    placed.clear();

    document
      .querySelectorAll('.hotspot')
      .forEach(hotspot => {
        hotspot.classList.remove(
          'filled'
        );

        hotspot
          .querySelector('span')
          .textContent = '';
      });

    show('play-screen');

    next();

  } catch (error) {
    console.error(
      'water-cycle start failed:',
      error
    );

    alert(
      'המשחק לא הצליח להתחיל. בדוק את ה-Console.'
    );

  } finally {
    starting = false;
  }
}

/* ==================================================
   ORIGINAL QUESTION FLOW
================================================== */

async function next() {
  if (qnum >= TOTAL) {
    return startSequenceStep();
  }

  qnum++;

  $('qnum').textContent =
    qnum;

  IAKidsActivity.questionStarted();

  const effLvl =
    level === 0
      ? diff.level
      : level;

  if (effLvl >= 3) {
    showMode('trivia-mode');
    await showTrivia();
  } else {
    showMode('order-mode');
    await showOrderItem();
  }
}

async function showTrivia() {
  const t =
    await game.newQuestion(
      () =>
        STAGES[
          rnd(stageCount)
        ],
      stage =>
        'trivia:' + stage.id
    );

  $('trivia-q').textContent =
    t.why +
    ' — ' +
    IAKidsLang.t(T.trivia);

  const box =
    $('trivia-opts');

  box.innerHTML = '';

  let answered = false;

  const opts =
    STAGES
      .slice(0,stageCount)
      .sort(
        () =>
          Math.random() - .5
      );

  opts.forEach(stage => {
    const button =
      document.createElement(
        'button'
      );

    button.className =
      'game-btn secondary';

    button.textContent =
      `${stage.e} ${stage.n}`;

    button.onclick = () => {
      if (answered) return;

      answered = true;

      answerTrivia(
        stage.id === t.id,
        button
      );
    };

    box.appendChild(button);
  });
}

function answerTrivia(correct, btn) {
  if (correct) {
    score += 10;
    diff.right();

    IAKidsActivity.correct();

    IAKidsFX.correct(btn);
    IAKidsCoins.right(btn);
  } else {
    mistakes++;
    diff.wrong();

    IAKidsActivity.wrong();

    IAKidsFX.wrong(btn);
    IAKidsCoins.wrong();
  }

  $('score').textContent =
    score;

  setTimeout(next,700);
}

/*
  פונקציית המשחק המקורית:
  לא שיניתי את יצירת הכרטיס או את pool.
*/
async function showOrderItem() {
  if (placed.size >= stageCount) {
    placed.clear();

    document
      .querySelectorAll('.hotspot')
      .forEach(hotspot => {
        hotspot.classList.remove(
          'filled'
        );

        hotspot
          .querySelector('span')
          .textContent = '';
      });
  }

  const tray = $('tray');

  tray.innerHTML = '';

  const stage =
    await game.newQuestion(
      () => {
        const pool =
          STAGES
            .slice(0,stageCount)
            .filter(
              item =>
                !placed.has(item.id)
            );

        return pool[
          rnd(pool.length)
        ];
      },
      item =>
        'order:' + item.id
    );

  const chip =
    document.createElement(
      'div'
    );

  chip.className = 'chip';

  chip.innerHTML =
    `<span>${stage.e}</span>` +
    `<span>${stage.n}</span>`;

  chip.dataset.stage =
    stage.id;

  chip.dataset.name =
    stage.n;

  makeDraggable(
    chip,
    '.hotspot',
    dropOnHotspot
  );

  tray.appendChild(chip);
}

/* ==================================================
   ORIGINAL FINAL SEQUENCE
================================================== */

async function startSequenceStep() {
  showMode('sequence-mode');

  const slots =
    $('seq-slots');

  slots.innerHTML = '';

  for (
    let rank = 1;
    rank <= stageCount;
    rank++
  ) {
    const slot =
      document.createElement(
        'div'
      );

    slot.className = 'slot';
    slot.dataset.rank = rank;

    slot.innerHTML =
      `<span class="rank">${rank}</span>`;

    slots.appendChild(slot);
  }

  seqPlaced.clear();

  await seqNextItem();
}

async function seqNextItem() {
  if (
    seqPlaced.size >=
    stageCount
  ) {
    return end();
  }

  const tray =
    $('seq-tray');

  tray.innerHTML = '';

  const pool =
    STAGES
      .slice(0,stageCount)
      .filter(
        stage =>
          !seqPlaced.has(stage.id)
      );

  const stage =
    pool[
      rnd(pool.length)
    ];

  const chip =
    document.createElement(
      'div'
    );

  chip.className = 'chip';

  chip.innerHTML =
    `<span>${stage.e}</span>` +
    `<span>${stage.n}</span>`;

  chip.dataset.rank =
    stage.rank;

  chip.dataset.stage =
    stage.id;

  makeDraggable(
    chip,
    '.slot',
    dropOnSlot
  );

  tray.appendChild(chip);
}

/* ==================================================
   POINTER EVENTS DRAG — EXACT ORIGINAL LOGIC
================================================== */

let drag = null;

function makeDraggable(chip, zoneSelector, onDrop) {
  chip.addEventListener('pointerdown', e => {
    if (drag) return;

    e.preventDefault();

    chip.setPointerCapture(
      e.pointerId
    );

    const r =
      chip.getBoundingClientRect();

    drag = {
      chip,
      dx:e.clientX - r.left,
      dy:e.clientY - r.top,
      zoneSelector,
      onDrop
    };

    chip.style.width =
      r.width + 'px';

    chip.classList.add(
      'dragging'
    );

    moveTo(e);
  });

  chip.addEventListener('pointermove', e => {
    if (drag?.chip === chip) {
      moveTo(e);
    }
  });

  chip.addEventListener('pointerup', e => {
    if (drag?.chip === chip) {
      finishDrag(e);
    }
  });

  chip.addEventListener('pointercancel', () => {
    if (drag?.chip === chip) {
      settle(chip);
      unmarkZones(
        drag.zoneSelector
      );
      drag = null;
    }
  });
}

function moveTo(e) {
  drag.chip.style.left =
    (e.clientX - drag.dx) + 'px';

  drag.chip.style.top =
    (e.clientY - drag.dy) + 'px';

  const zone =
    zoneAt(
      e.clientX,
      e.clientY,
      drag.zoneSelector
    );

  document
    .querySelectorAll(
      drag.zoneSelector
    )
    .forEach(candidate => {
      candidate.classList.toggle(
        'over',
        candidate === zone
      );
    });
}

const zoneAt = (x, y, selector) =>
  document
    .elementFromPoint(x,y)
    ?.closest(selector) ||
  null;

const unmarkZones = selector =>
  document
    .querySelectorAll(selector)
    .forEach(zone => {
      zone.classList.remove('over');
    });

function settle(chip) {
  chip.classList.remove(
    'dragging'
  );

  chip.style.left = '';
  chip.style.top = '';
  chip.style.width = '';
}

function finishDrag(e) {
  const {
    chip,
    zoneSelector,
    onDrop
  } = drag;

  const zone =
    zoneAt(
      e.clientX,
      e.clientY,
      zoneSelector
    );

  unmarkZones(zoneSelector);

  drag = null;

  settle(chip);

  onDrop(chip,zone);
}

/* ==================================================
   ORIGINAL DROP LOGIC + ACTIVITY REPORTING
================================================== */

function dropOnHotspot(chip, zone) {
  if (
    !zone ||
    zone.classList.contains(
      'filled'
    )
  ) {
    return;
  }

  const correct =
    zone.dataset.stage ===
    chip.dataset.stage;

  if (correct) {
    score += 10;

    $('score').textContent =
      score;

    diff.right();

    IAKidsActivity.correct();

    IAKidsFX.correct(zone);
    IAKidsCoins.right(zone);

    zone.classList.add(
      'filled'
    );

    zone
      .querySelector('span')
      .textContent =
        chip.dataset.name;

    placed.add(
      chip.dataset.stage
    );

    chip.remove();

    setTimeout(next,500);
  } else {
    mistakes++;

    diff.wrong();

    IAKidsActivity.wrong();

    IAKidsFX.wrong(chip);
    IAKidsCoins.wrong();
  }
}

function dropOnSlot(chip, zone) {
  if (
    !zone ||
    zone.children.length > 1
  ) {
    return;
  }

  const correct =
    String(zone.dataset.rank) ===
    chip.dataset.rank;

  if (correct) {
    /*
      שלב הסידור הוא בונוס.
      לא מדווחים עליו כשאלה נוספת,
      כדי questions_count יישאר TOTAL.
    */
    score += 10;

    $('score').textContent =
      score;

    IAKidsFX.correct(zone);
    IAKidsCoins.right(zone);

    zone.innerHTML =
      `<span class="rank">` +
      `${zone.dataset.rank}` +
      `</span>` +
      `<span class="n">` +
      `${chip.innerHTML}` +
      `</span>`;

    seqPlaced.add(
      chip.dataset.stage
    );

    chip.remove();

    setTimeout(
      seqNextItem,
      400
    );
  } else {
    mistakes++;

    IAKidsFX.wrong(chip);
    IAKidsCoins.wrong();
  }
}

/* ==================================================
   END + DATABASE
================================================== */

async function end() {
  const maxScore =
    (TOTAL + stageCount) * 10;

  /*
    קודם סוגרים את session בטבלה.
    כך כשל ב-leaderboard לא מבטל את הפרוגרס.
  */
  try {
    await game.complete(
      score,
      {
        maxScore,

        metadata:{
          selected_level:level,
          random_difficulty:
            level === 0,
          total_rounds:TOTAL,
          mistakes,
          stage_count:stageCount,
          sequence_completed:true,
          game_mode:'water-cycle',
          child_grade:CHILD_GRADE,
          uses_niqqud:USE_NIQQUD
        }
      }
    );
  } catch (error) {
    console.error(
      'water-cycle complete failed:',
      error
    );

    alert(
      'המשחק הסתיים, אבל שמירת הפרוגרס נכשלה. בדוק את ה-Console.'
    );

    return;
  }

  try {
    await game.saveScore(
      score,
      {
        level,
        mistakes,
        rounds:TOTAL,
        stage_count:stageCount
      }
    );

    const top =
      (
        await game.getHighScores(1)
      )[0];

    $('final-score').textContent =
      score;

    $('best').textContent =
      top?.score ?? score;

    $('player-line').textContent =
      `${
        top?.player ||
        IAKidsLang.ui('guest')
      } · ${
        new Date()
          .toLocaleString(
            'he-IL',
            {
              dateStyle:'short',
              timeStyle:'short'
            }
          )
      }`;

    const accuracy =
      TOTAL /
      (TOTAL + mistakes);

    $('stars').textContent =
      '⭐'.repeat(
        accuracy >= .9
          ? 3
          : accuracy >= .7
            ? 2
            : 1
      );

    game.shareButton(
      score,
      $('share-slot')
    );

    show('end-screen');

  } catch (error) {
    console.error(
      'water-cycle end screen failed:',
      error
    );

    $('final-score').textContent =
      score;

    $('best').textContent =
      score;

    show('end-screen');
  }
}
