================================================== */

}

body::before{

/* חזרה למפה */

/* HUD */

.game-hud .score{

.game-hud #qnum,

/* Main card */

.game-card{

.game-card::before{

<body>

<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);

/* ==================================================
   GRADE + NIQQUD
================================================== */

function numberFrom(value){
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function readGradeFromObject(value){
  if (!value) return null;

  try{
    const data =
      typeof value === 'string'
        ? JSON.parse(value)
        : value;

    return (
      numberFrom(data?.grade) ??
      numberFrom(data?.age) ??
      numberFrom(data?.class_grade) ??
      numberFrom(data?.school_grade)
    );
  }catch{
    return null;
  }
}

function getChildGrade(){
  const directKeys = [
    'active_kid_grade',
    'iakids_active_kid_grade',
    'selected_kid_grade',
    'kid_grade',
    'grade',
    'active_kid_age',
    'kid_age'
  ];

  for (const key of directKeys){
    const grade = numberFrom(localStorage.getItem(key));
    if (grade !== null) return grade;
  }

  const objectKeys = [
    'active_kid',
    'iakids_active_kid',
    'selected_kid',
    'kid_profile',
    'active_kid_profile'
  ];

  for (const key of objectKeys){
    const grade =
      readGradeFromObject(
        localStorage.getItem(key)
      );

    if (grade !== null) return grade;
  }

  return null;
}

const CHILD_GRADE = getChildGrade();
const USE_NIQQUD =
  CHILD_GRADE === 1 ||
  CHILD_GRADE === 2;

/* ==================================================
   TEXT
================================================== */

const TEXT = {
  regular:{
    title:'מחזור המים בטבע',
    howto:'גרור כל שלב למקום הנכון באיור!',
    rounds:'כמה שאלות?',
    seqTitle:'עכשיו סדרו את השלבים לפי הסדר הנכון בזמן!',
    triviaSuffix:'איך קוראים לשלב הזה?',
    score:'ניקוד',
    question:'שאלה',
    back:'חזרה למפת המשחקים',
    levels:['קל','בינוני','קשה','אקראי']
  },

  niqqud:{
    title:'מַחְזוֹר הַמַּיִם בַּטֶּבַע',
    howto:'גִּרְרוּ כָּל שָׁלָב לַמָּקוֹם הַנָּכוֹן בָּאִיּוּר!',
    rounds:'כַּמָּה שְׁאֵלוֹת?',
    seqTitle:'עַכְשָׁו סַדְּרוּ אֶת הַשְּׁלָבִים לְפִי הַסֵּדֶר הַנָּכוֹן!',
    triviaSuffix:'אֵיךְ קוֹרְאִים לַשָּׁלָב הַזֶּה?',
    score:'נִקּוּד',
    question:'שְׁאֵלָה',
    back:'חֲזָרָה לְמַפַּת הַמִּשְׂחָקִים',
    levels:['קַל','בֵּינוֹנִי','קָשֶׁה','אַקְרָאִי']
  }
};

const UI_TEXT =
  USE_NIQQUD
    ? TEXT.niqqud
    : TEXT.regular;

/* ==================================================
   STAGES
================================================== */

const STAGES_REGULAR = [
  {
    id:'evaporation',
    n:'אידוי',
    e:'💧☀️',
    rank:1,
    why:'השמש מחממת את המים בים והם הופכים לאדים שעולים לשמיים'
  },
  {
    id:'condensation',
    n:'עיבוי',
    e:'☁️',
    rank:2,
    why:'האדים בשמיים מתקררים והופכים לטיפות מים קטנות שיוצרות ענן'
  },
  {
    id:'precipitation',
    n:'משקעים',
    e:'🌧️',
    rank:3,
    why:'הענן מתמלא בטיפות כבדות שנופלות כגשם או שלג'
  },
  {
    id:'runoff',
    n:'הזרמה',
    e:'🌊',
    rank:4,
    why:'הגשם שנופל זורם בנחלים ובנהרות בחזרה לים'
  }
];

const STAGES_NIQQUD = [
  {
    id:'evaporation',
    n:'אִדּוּי',

function fixHelpExampleColors(){
  document
    .querySelectorAll('body *')
    .forEach(el => {
      const text =
        (el.textContent || '').trim();

      if (
        text.includes('אידוי') ||
        text.includes('אִדּוּי')
      ){
        const style =
          getComputedStyle(el);

        const bg =
          style.backgroundColor;

        if (
          bg.includes('255') ||
          el.closest('[role="dialog"]')
        ){
          el.style.color = '#102a4f';
          el.style.textShadow = 'none';

          el.querySelectorAll('*')
            .forEach(child => {
              child.style.color = '#102a4f';
              child.style.textShadow = 'none';
            });
        }
      }
    });
}

function show(id){

      'start-screen',
      'play-screen',

    ]

function showMode(id){

      'sequence-mode'
    ]
  ){

      modeId === id

function getActiveStages(){
  return STAGES.slice(0,stageCount);
}

function getActiveStageIds(){
  return new Set(
    getActiveStages()
      .map(stage => stage.id)
  );
}

function clearBoard(){
  placed.clear();

  document
    .querySelectorAll('.hotspot')
    .forEach(hotspot => {
      hotspot.classList.remove('filled');

      const label =
        hotspot.querySelector('span');

      if (label){

      }

}

function prepareBoard(){
  const activeIds =
    getActiveStageIds();

  document
    .querySelectorAll('.hotspot')
    .forEach(hotspot => {
      hotspot.hidden =
        !activeIds.has(
          hotspot.dataset.stage
        );
    });

  clearBoard();
}

function resetGameState(){
  score = 0;
  qnum = 0;
  mistakes = 0;

  placed.clear();
  seqPlaced.clear();

  $('score').textContent = '0';
  $('qnum').textContent = '1';

/* ==================================================
   START
================================================== */

async function startGame(selectedLevel){
  if (starting) return;

  starting = true;

  document
    .querySelectorAll(
      '#level-row .game-btn'
    )
    .forEach(button => {
      button.disabled = true;
    });

  try{
    /*
      Session נוצר רק לאחר לחיצה על רמה.
      כך רענון רגיל לא יוצר session interrupted.
    */
    game =
      await IAKidsGame.init(
        'water-cycle'
      );

    level = selectedLevel;

    /*
      קל: שלושה שלבים.
      בינוני/קשה/אקראי: ארבעה שלבים.
    */
    stageCount =
      selectedLevel === 1
        ? 3
        : 4;

    resetGameState();

    diff =
      game.difficulty(
        selectedLevel || 1,
        3
      );

    IAKidsActivity.configure({
      difficulty:selectedLevel,
      questionsCount:TOTAL,

      metadata:{
        selected_level:
          selectedLevel,

        random_difficulty:
          selectedLevel === 0,

        game_mode:
          'water-cycle',

        child_grade:
          CHILD_GRADE,

        uses_niqqud:
          USE_NIQQUD
      }
    });

    timer =
      game.timer({
        style:'bomb',

        onTimeout:() => {
          if (!game) return;

          timer?.stop();

          IAKidsActivity.skipped();

          mistakes++;

          diff?.wrong();
          IAKidsCoins.wrong();

          setTimeout(
            () => nextQuestion(),
            500
          );
        }
      });

    await game.saveProgress({
      lastLevel:selectedLevel,
      rounds:TOTAL
    });

    prepareBoard();

    show('play-screen');

    await nextQuestion();

  }catch(error){
    console.error(
      'water-cycle start failed:',
      error
    );

    alert(
      'המשחק לא הצליח להתחיל. בדוק את ה-Console.'
    );

  }finally{
    starting = false;

    document
      .querySelectorAll(
        '#level-row .game-btn'
      )
      .forEach(button => {
        button.disabled = false;
      });
  }
}

/* ==================================================
   QUESTIONS
================================================== */

async function nextQuestion(){
  if (qnum >= TOTAL){
    await startSequenceStep();
    return;
  }

  qnum++;

  $('qnum').textContent =
    String(qnum);

  IAKidsActivity.questionStarted();

  const effectiveLevel =
    level === 0
      ? diff.level
      : level;

  timer.start(
    IAKidsTimer.secondsFor(
      effectiveLevel,
      18
    )
  );

  if (effectiveLevel >= 3){
    showMode('trivia-mode');
    await showTrivia();
  }else{
    showMode('order-mode');
    await showOrderItem();
  }
}

/* ==================================================
   TRIVIA
================================================== */

async function showTrivia(){
  const activeStages =
    getActiveStages();

  const question =
    await game.newQuestion(
      () =>
        activeStages[
          rnd(activeStages.length)
        ],

      stage =>
        `trivia:${stage.id}:${qnum}`
    );

  $('trivia-q').textContent =
    `${question.why} — ${UI_TEXT.triviaSuffix}`;

  const box =
    $('trivia-opts');

  box.innerHTML = '';

  let answered = false;

  const options =
    [...activeStages]
      .sort(() => Math.random() - .5);

  options.forEach(stage => {
    const button =
      document.createElement(
        'button'
      );

    button.className =
      'game-btn secondary';

    button.textContent =
      `${stage.e} ${stage.n}`;

    button.onclick = () => {
      if (answered) return;

      answered = true;

      answerTrivia(
        stage.id === question.id,
        button
      );
    };

    box.appendChild(button);
  });
}

function answerTrivia(correct,button){
  timer?.stop();

  if (correct){
    score += 10;

    diff?.right();

    IAKidsActivity.correct();

    IAKidsFX.correct(button);
    IAKidsCoins.right(button);
  }else{
    mistakes++;

    diff?.wrong();

    IAKidsActivity.wrong();

    IAKidsFX.wrong(button);
    IAKidsCoins.wrong();
  }

  $('score').textContent =
    String(score);

  setTimeout(
    () => nextQuestion(),
    700
  );
}

/* ==================================================
   DRAG TO PICTURE
================================================== */

async function showOrderItem(){
  const activeStages =
    getActiveStages();

  /*
    כאשר כל הלוח התמלא, פותחים סיבוב חדש.
  */
  if (
    placed.size >=
    activeStages.length
  ){
    clearBoard();
  }

  let pool =
    activeStages.filter(
      stage =>
        !placed.has(stage.id)
    );

  /*
    הגנה מפני מצב ריק:
    לעולם לא משאירים את הילד בלי כרטיס לגרירה.
  */
  if (!pool.length){
    clearBoard();
    pool = [...activeStages];
  }

  const tray =
    $('tray');

  tray.innerHTML = '';

  const stage =
    await game.newQuestion(
      () =>
        pool[
          rnd(pool.length)
        ],

      item =>
        `order:${item.id}:${qnum}`
    );

  if (!stage){
    console.error(
      'No stage returned',
      {
        pool,
        qnum,
        stageCount
      }
    );

    setTimeout(
      () => showOrderItem(),
      150
    );

    return;
  }

  const chip =
    document.createElement(
      'div'
    );

  chip.className = 'chip';

  chip.innerHTML =
    `<span>${stage.e}</span>` +
    `<span>${stage.n}</span>`;

  chip.dataset.stage =
    stage.id;

  chip.dataset.name =
    stage.n;

  makeDraggable(
    chip,
    '.hotspot:not([hidden])',
    dropOnHotspot
  );

  tray.appendChild(chip);
}

function dropOnHotspot(chip,zone){
  if (
    !zone ||
    zone.hidden ||
    zone.classList.contains('filled')
  ){
    return;
  }

  const correct =
    zone.dataset.stage ===
    chip.dataset.stage;

  if (correct){
    timer?.stop();

    score += 10;

    $('score').textContent =
      String(score);

    diff?.right();

    IAKidsActivity.correct();

    IAKidsFX.correct(zone);
    IAKidsCoins.right(zone);

    zone.classList.add('filled');

    zone
      .querySelector('span')
      .textContent =
        chip.dataset.name;

    placed.add(
      chip.dataset.stage
    );

    chip.remove();

    setTimeout(
      () => nextQuestion(),
      500
    );

  }else{
    mistakes++;

    diff?.wrong();

    IAKidsActivity.wrong();

    IAKidsFX.wrong(chip);
    IAKidsCoins.wrong();
  }
}

/* ==================================================
   FINAL SEQUENCE — BONUS
================================================== */

async function startSequenceStep(){
  timer?.stop();

  showMode('sequence-mode');

  const slots =
    $('seq-slots');

  slots.innerHTML = '';

  for (
    let rank = 1;
    rank <= stageCount;
    rank++
  ){
    const slot =
      document.createElement(
        'div'
      );

    slot.className = 'slot';
    slot.dataset.rank =
      String(rank);

    slot.innerHTML =
      `<span class="rank">${rank}</span>`;

    slots.appendChild(slot);
  }

  seqPlaced.clear();

  await seqNextItem();
}

async function seqNextItem(){
  const activeStages =
    getActiveStages();

  if (
    seqPlaced.size >=
    activeStages.length
  ){
    await endGame();
    return;
  }

  const tray =
    $('seq-tray');

  tray.innerHTML = '';

  const pool =
    activeStages.filter(
      stage =>
        !seqPlaced.has(stage.id)
    );

  if (!pool.length){
    await endGame();
    return;
  }

  const stage =
    pool[
      rnd(pool.length)
    ];

  const chip =
    document.createElement(
      'div'
    );

  chip.className = 'chip';

  chip.innerHTML =
    `<span>${stage.e}</span>` +
    `<span>${stage.n}</span>`;

  chip.dataset.rank =
    String(stage.rank);

  chip.dataset.stage =
    stage.id;

  makeDraggable(
    chip,
    '.slot',
    dropOnSlot
  );

  tray.appendChild(chip);
}

function dropOnSlot(chip,zone){
  if (
    !zone ||
    zone.querySelector('.n')
  ){
    return;
  }

  const correct =
    String(zone.dataset.rank) ===
    String(chip.dataset.rank);

  if (correct){
    /*
      שלב הסדר הוא בונוס.
      הוא מוסיף ניקוד, אבל לא מגדיל
      את questions_count בטבלה.
    */
    score += 10;

    $('score').textContent =
      String(score);

    IAKidsFX.correct(zone);
    IAKidsCoins.right(zone);

    zone.innerHTML =
      `<span class="rank">` +
      `${zone.dataset.rank}` +
      `</span>` +
      `<span class="n">` +
      `${chip.innerHTML}` +
      `</span>`;

    seqPlaced.add(
      chip.dataset.stage
    );

    chip.remove();

    setTimeout(
      () => seqNextItem(),
      400
    );

  }else{
    mistakes++;

    IAKidsFX.wrong(chip);
    IAKidsCoins.wrong();
  }
}

/* ==================================================
   POINTER DRAG
================================================== */

let drag = null;

function makeDraggable(
  chip,
  zoneSelector,
  onDrop
){
  chip.addEventListener(
    'pointerdown',
    event => {
      if (drag) return;

      event.preventDefault();

      chip.setPointerCapture(
        event.pointerId
      );

      const rect =
        chip.getBoundingClientRect();

      drag = {
        chip,
        dx:event.clientX - rect.left,
        dy:event.clientY - rect.top,
        zoneSelector,
        onDrop
      };

      chip.style.width =
        `${rect.width}px`;

      chip.classList.add(
        'dragging'
      );

      moveTo(event);
    }
  );

  chip.addEventListener(
    'pointermove',
    event => {
      if (drag?.chip === chip){
        moveTo(event);
      }
    }
  );

  chip.addEventListener(
    'pointerup',
    event => {
      if (drag?.chip === chip){
        finishDrag(event);
      }
    }
  );

  chip.addEventListener(
    'pointercancel',
    () => {
      if (drag?.chip !== chip){
        return;
      }

      const selector =
        drag.zoneSelector;

      settle(chip);
      unmarkZones(selector);

      drag = null;
    }
  );
}

function moveTo(event){
  if (!drag) return;

  drag.chip.style.left =
    `${event.clientX - drag.dx}px`;

  drag.chip.style.top =
    `${event.clientY - drag.dy}px`;

  const zone =
    zoneAt(
      event.clientX,
      event.clientY,
      drag.zoneSelector
    );

  document
    .querySelectorAll(
      drag.zoneSelector
    )
    .forEach(candidate => {
      candidate.classList.toggle(
        'over',
        candidate === zone
      );
    });
}

function zoneAt(x,y,selector){
  return (
    document
      .elementFromPoint(x,y)
      ?.closest(selector) ||
    null
  );
}

function unmarkZones(selector){
  document
    .querySelectorAll(selector)
    .forEach(zone => {
      zone.classList.remove('over');
    });
}

function settle(chip){
  chip.classList.remove(
    'dragging'
  );

  chip.style.left = '';
  chip.style.top = '';
  chip.style.width = '';
}

function finishDrag(event){
  if (!drag) return;

  const {
    chip,
    zoneSelector,
    onDrop
  } = drag;

  const zone =
    zoneAt(
      event.clientX,
      event.clientY,
      zoneSelector
    );

  unmarkZones(zoneSelector);

  drag = null;

  settle(chip);

  onDrop(chip,zone);
}

async function endGame(){
  timer?.stop();

  const maxScore =
    (TOTAL + stageCount) * 10;

  /*
    קודם סוגרים את ה-session.
    כך גם אם leaderboard או share ייכשלו,
    הפרוגרס כבר נשמר.
  */
  try{
    await game.complete(
      score,
      {
        maxScore,

        metadata:{
          selected_level:
            level,

          random_difficulty:
            level === 0,

          total_rounds:
            TOTAL,

          mistakes,

          stage_count:
            stageCount,

          sequence_completed:
            true,

          game_mode:
            'water-cycle',

          child_grade:
            CHILD_GRADE,

          uses_niqqud:
            USE_NIQQUD
        }
      }
    );

    console.log(
      'Water-cycle session completed',
      {
        score,
        maxScore,
        level,
        mistakes,
        totalRounds:TOTAL
      }
    );

  }catch(error){
    console.error(
      'game.complete failed:',
      error
    );

    alert(
      'שמירת תוצאת המשחק נכשלה. בדוק את ה-Console.'
    );

    return;
  }

  /*
    leaderboard ומסך סיום:
    כשל כאן לא מבטל את שמירת הפרוגרס.
  */
  try{
    await game.saveScore(
      score,
      {
        level,
        mistakes,
        rounds:TOTAL,
        stage_count:stageCount
      }
    );

    const topScores =
      await game.getHighScores(1);

    const top =
      topScores?.[0];

    $('final-score').textContent =
      String(score);

    $('best').textContent =
      String(top?.score ?? score);

    $('player-line').textContent =
      `${
        top?.player ||
        IAKidsLang.ui('guest')
      } · ${
        new Date()
          .toLocaleString(
            'he-IL',
            {
              dateStyle:'short',
              timeStyle:'short'
            }
          )
      }`;

    const trackedAttempts =
      TOTAL + mistakes;

    const accuracy =
      trackedAttempts > 0
        ? TOTAL / trackedAttempts
        : 0;

    $('stars').textContent =
      '⭐'.repeat(
        accuracy >= .9
          ? 3
          : accuracy >= .7
            ? 2
            : 1
      );

    show('end-screen');

    game.shareButton(
      score,
      $('share-slot')
    );

  }catch(error){
    console.error(
      'End-screen rendering failed:',
      error
    );

    $('final-score').textContent =
      String(score);

    $('best').textContent =
      String(score);

    show('end-screen');
  }
}
</script>
</body>
</html>
