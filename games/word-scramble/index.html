<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סדר את המילה | iakids</title>
<link rel="stylesheet" href="../game-style.css?v=55616175">
<style>
/* Shared dark space theme (body.theme-space in ../game-style.css); only this game's own widgets are styled here, tuned for the dark card. */
.howto{max-width:410px;margin:14px auto 20px;color:var(--space-muted)!important;font-weight:600;line-height:1.65}
  .tile-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 18px 0; }
  .tile, .slot {
    width: 54px; height: 58px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.9rem; font-weight: 800; border-radius: 12px;
  }
  .tile {
    color:#fff;background:linear-gradient(180deg,#1c91db,#0877bd);border:1px solid rgba(118,176,255,.45);box-shadow:inset 0 1px rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.25);
    box-shadow: 0 4px 0 rgba(0,0,0,0.15); cursor: grab; touch-action: none;
    user-select: none; transition: transform 0.15s;
  }
  .tile.dragging { cursor: grabbing; opacity: 0.9; }
  .tile.placed {background:linear-gradient(180deg,#37d182,#16ad64);border-color:rgba(97,255,174,.6);color:#fff; box-shadow: none; cursor: default; }
  .slots-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 16px 0; }
  .slot {
    color:#fff;border:3px dashed rgba(184,199,227,.55);background:rgba(4,22,55,.35);border-radius:12px; min-height: 58px;
  }
  .slot.over{border-color:#69c8ff;background:rgba(32,150,221,.22)}
  .slot.filled { border-style: solid; border-color: var(--green); }
  @keyframes shakeTile { 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-8px);} 40%,80%{transform:translateX(8px);} }
  .tile.shake { animation: shakeTile 0.35s; }
</style>
</head>
<body class="theme-space">

<div class="game-hud">
  <span class="score">ניקוד: <span id="score">0</span></span>
  <span><span id="qlabel">שאלה</span> <span id="qnum">1</span>/<span id="qtotal">10</span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div class="hero-icon">🔤</div>
    <h1 class="game-title">סדר את המילה</h1>
    <p class="howto">האותיות התבלבלו! גרור כל אות למקום הנכון ובנה את המילה.</p>
    <p class="section-label">כמה סיבובים?</p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" onclick="start(1)" id="lvl-1">🙂 קל</button>
      <button class="game-btn secondary" onclick="start(2)" id="lvl-2">😎 בינוני</button>
      <button class="game-btn secondary" onclick="start(3)" id="lvl-3">🤓 קשה</button>
      <button class="game-btn" data-lvl="0" onclick="start(0)">🎲 אקראי</button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div class="slots-row" id="slots"></div>
    <div class="tile-row" id="bank"></div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p>השיא שלך: <b id="best"></b></p>
    <button class="game-btn" onclick="location.reload()">שחק שוב 🔁</button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="nikud.js?v=08d418e2"></script>
<script src="../game-sdk.js?v=a73264ee"></script>
<script>
// word bank by level — words verified for correct standard Hebrew spelling;
// sofit letters (ם ן ץ ף ך) only ever appear where they belong: at the word's end.
const WORDS = {
  1: ['בית', 'ילד', 'כלב', 'ספר', 'שיר', 'עיר', 'אור', 'דלת', 'חלב', 'דבש',
       'ברז', 'נמר', 'לחם', 'חול', 'מלח', 'זהב', 'כסף', 'עגל', 'שור', 'דבק', 'חבל', 'סוס', 'פרח', 'נהר', 'שדה', 'ענן', 'שקל', 'חדר', 'תיק', 'כוס', 'מים', 'עוף', 'פיל', 'דוב', 'זאב', 'גדר', 'בגד', 'שוק', 'גשם', 'שמש', 'ירח', 'לבן', 'ערב', 'קיץ', 'אבא', 'אמא', 'סבא', 'גזר', 'בצל', 'שום', 'נעל'
  ],
  2: ['שולחן', 'כיסא', 'תפוח', 'ילדים', 'חלון', 'מטבח', 'תפוז', 'כדור', 'מספר', 'שמיים', 'גלידה',
       'מחברת', 'מכונית', 'ארנב', 'תרנגול', 'חמור', 'חלום', 'צלחת', 'מזלג', 'סכין', 'מפית', 'שעון', 'מנורה', 'ספסל', 'מקרר', 'ארון', 'מיטה', 'כרית', 'שמיכה', 'מגבת', 'סבון', 'כובע', 'מעיל', 'חולצה', 'חצאית', 'מטרייה', 'רכבת', 'מטוס', 'ספינה', 'גלגל', 'סנדל', 'אבטיח', 'בננות', 'תותים', 'ענבים', 'אפרסק', 'שזיפים', 'חמניות', 'כרובית', 'חצילים', 'פלפלים', 'תפוזים', 'מחשבון', 'מדרגות', 'מרפסת', 'גינה', 'מקלדת', 'עכבר', 'מצלמה'
  ],
  3: ['מספריים', 'תלמידים', 'מחשבים', 'עיפרון', 'בלונים', 'תפוחים', 'פרפרים', 'צעצועים', 'מדבקות', 'כרטיסים',
       'טלוויזיה', 'משקפיים', 'מכנסיים', 'אמבטיה', 'שירותים', 'חנוכייה', 'סופגנייה', 'דובדבנים', 'ברוקולי', 'עגבניות', 'מלפפונים', 'קישואים', 'לימונים', 'אופניים', 'אוטובוס', 'טלפונים', 'מזוודות', 'עגבנייה', 'מסעדות', 'ספרייה', 'מגלשות', 'נדנדות', 'שוקולד', 'ארטיקים'
  ],
};

let game, score = 0, qnum = 0, level = 1, TOTAL = 10, diff, sessionRight = 0, sessionWrong = 0;
let placed = 0, wordLen = 0;

IAKidsCoins.mount();
IAKidsHelp.mount({
  slug: 'word-scramble',
  how: 'האותיות של מילה התבלבלו! גרור כל אות מהמאגר למקום הריק המתאים כדי לבנות את המילה הנכונה, אות אחרי אות.',
  example: 'אותיות מבולבלות: <b dir="rtl">ת ל ד י</b> ← גורר לסדר הנכון ← <b dir="rtl">יל ד ת</b>... כלומר: <b dir="rtl">ילדת</b> שגוי, הנכון הוא <b dir="rtl">ילד</b> 🙂',
});

document.getElementById('qlabel').textContent = IAKidsLang.ui('question');

function setRounds(n, btn) {
  TOTAL = n;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b => b.classList.remove('success'));
  btn.classList.add('success');
}

const show = id => {
  for (const s of ['start-screen', 'play-screen', 'end-screen'])
    document.getElementById(s).hidden = s !== id;
};

async function start(lvl) {
  game = await IAKidsGame.init('word-scramble');
  level = lvl;
  diff = game.difficulty(lvl || 1, 3);
  await game.saveProgress({ lastLevel: lvl, rounds: TOTAL });
  document.getElementById('qtotal').textContent = TOTAL;
  show('play-screen');
  next();
}

function pickWord(lvl) {
  const pool = WORDS[lvl] || WORDS[1];
  return pool[Math.floor(Math.random() * pool.length)];
}

function scramble(word) {
  const letters = [...word].map((c, i) => ({ c, i }));
  let arr;
  do {
    arr = letters.map(t => ({ ...t, r: Math.random() })).sort((a, b) => a.r - b.r);
  } while (letters.length > 1 && arr.every((t, i) => t.i === i));
  return arr;
}

async function next() {
  if (qnum >= TOTAL) return end();
  qnum++;
  document.getElementById('qnum').textContent = qnum;
  const lvl = level === 0 ? 1 + Math.floor(Math.random() * 3) : diff.level;
  // newQuestion needs an object payload (a bare string fails the bank's
  // JSON-shape check) — wrap/unwrap right here, nothing else changes.
  const q = await game.newQuestion(() => ({ w: pickWord(lvl) }), q => q.w);
  buildRound(q.w);
}

function buildRound(word) {
  placed = 0;
  wordLen = word.length;
  const slotsEl = document.getElementById('slots');
  const bankEl = document.getElementById('bank');
  slotsEl.innerHTML = '';
  bankEl.innerHTML = '';

  for (let i = 0; i < wordLen; i++) {
    const slot = document.createElement('div');
    slot.className = 'slot drop-zone';
    slot.dataset.idx = i;
    slotsEl.appendChild(slot);
  }

  const scrambled = scramble(word);
  scrambled.forEach(({ c, i }) => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.textContent = c;
    tile.dataset.correctIdx = i;
    bankEl.appendChild(tile);
    attachDrag(tile);
  });
}

function attachDrag(tile) {
  tile.addEventListener('pointerdown', e => {
    if (tile.classList.contains('placed')) return;
    tile.setPointerCapture(e.pointerId);
    const rect = tile.getBoundingClientRect();
    const offX = e.clientX - rect.left, offY = e.clientY - rect.top;
    tile.classList.add('dragging');
    tile.style.position = 'fixed';
    tile.style.width = rect.width + 'px';
    tile.style.height = rect.height + 'px';
    tile.style.left = rect.left + 'px';
    tile.style.top = rect.top + 'px';
    tile.style.zIndex = 200;
    tile.style.pointerEvents = 'none';

    const move = ev => {
      tile.style.left = (ev.clientX - offX) + 'px';
      tile.style.top = (ev.clientY - offY) + 'px';
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('over'));
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const zone = under && under.closest('.slot');
      if (zone && !zone.classList.contains('filled')) zone.classList.add('over');
    };

    const up = ev => {
      tile.releasePointerCapture(e.pointerId);
      tile.removeEventListener('pointermove', move);
      tile.removeEventListener('pointerup', up);
      tile.classList.remove('dragging');
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('over'));

      // hit-test BEFORE restoring pointer-events/position — the tile is still
      // sitting fixed under the pointer, so elementFromPoint would hit itself otherwise
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const zone = under && under.closest('.slot');

      tile.style.pointerEvents = '';
      // clear the temp free-floating positioning either way — return to normal flow first
      tile.style.position = '';
      tile.style.left = '';
      tile.style.top = '';
      tile.style.width = '';
      tile.style.height = '';
      tile.style.zIndex = '';

      if (!zone) return; // released off any slot — no penalty, just snaps back

      if (zone.classList.contains('filled')) {
        wrongDrop(tile);
        return;
      }

      if (Number(zone.dataset.idx) === Number(tile.dataset.correctIdx)) {
        zone.classList.add('filled');
        zone.appendChild(tile);
        tile.classList.add('placed');
        IAKidsFX.correct(tile);
        IAKidsCoins.right(tile);
        diff.right();
        score += 10;
        sessionRight++;
        document.getElementById('score').textContent = score;
        placed++;
        if (placed >= wordLen) setTimeout(next, 700);
      } else {
        wrongDrop(tile);
      }
    };

    tile.addEventListener('pointermove', move);
    tile.addEventListener('pointerup', up);
  });
}

function wrongDrop(tile) {
  IAKidsFX.wrong(tile);
  IAKidsCoins.wrong();
  diff.wrong();
  sessionWrong++;
  tile.classList.add('shake');
  setTimeout(() => tile.classList.remove('shake'), 400);
}

async function end() {
  await game.saveScore(score, { level });
  const top = (await game.getHighScores(1))[0];
  document.getElementById('final-score').textContent = score;
  document.getElementById('best').textContent = top?.score ?? score;
  document.getElementById('player-line').textContent =
    `${top?.player || IAKidsLang.ui('guest')} · ${new Date().toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' })}`;
  const acc = sessionRight / Math.max(1, sessionRight + sessionWrong);
  document.getElementById('stars').textContent = '⭐'.repeat(acc >= 0.85 ? 3 : acc >= 0.6 ? 2 : 1);
  game.shareButton(score, document.getElementById('share-slot'));
  show('end-screen');
  game.complete(score);
}

// restore last-picked rounds count (default 10), mark the matching button
(async () => {
  const tmp = await IAKidsGame.init('word-scramble');
  const p = await tmp.loadProgress();
  if (p?.rounds) TOTAL = p.rounds;
  const btn = [...document.querySelectorAll('#rounds-row .game-btn')].find(b => Number(b.textContent) === TOTAL);
  (btn || document.querySelectorAll('#rounds-row .game-btn')[1]).classList.add('success');
})();
</script>
</body>
</html>
