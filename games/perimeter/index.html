<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>חישוב היקפים | iakids</title>
<link rel="stylesheet" href="../game-style.css?v=55616175">
<style>.shape-wrap{display:flex;justify-content:center;margin:6px 0}.shape-wrap svg{height:auto;width:min(74vw,300px)}.q-text{font-size:1.25rem;font-weight:800;margin:8px 0}
</style>

<style id="iakids-premium-overrides">.game-card{width:min(560px,calc(100vw - 28px))!important}#start-screen>div:first-child{filter:drop-shadow(0 12px 18px rgba(0,0,0,.22));font-size:5rem!important;margin:6px 0 8px}.game-title{font-size:clamp(2.15rem,7vw,3.1rem)!important}#subtitle{color:var(--space-muted)!important;font-weight:600;line-height:1.65;margin:14px auto 20px;max-width:420px}#rounds-q,#level-label{color:#fff!important;font-weight:900;margin:8px 0 10px}.q-text{align-items:center;background:rgba(4,22,55,.5);border:1px solid rgba(116,177,255,.18);border-radius:17px;color:#fff!important;display:flex;font-size:1.25rem!important;font-weight:900!important;justify-content:center;margin:0 0 10px!important;min-height:58px;padding:10px 14px}.shape-wrap{background:rgba(4,22,55,.46);border:1px solid rgba(116,177,255,.18);border-radius:22px;display:flex;justify-content:center;margin:8px 0 16px!important;padding:12px 8px}.shape-wrap svg{filter:drop-shadow(0 12px 20px rgba(0,0,0,.16));height:auto;width:min(74vw,320px)!important}
#answers{grid-template-columns:1fr 1fr!important}#answers .game-btn{font-size:1.2rem!important;min-height:66px}
#answers .game-btn.correct{background:linear-gradient(180deg,#37d182,#16ad64)!important}#answers .game-btn:disabled{opacity:.74}
@media(max-width:600px){
  .shape-wrap svg{width:min(84vw,300px)!important}
}
</style>

</head>
<body class="theme-space">

<div class="game-hud">
  <span class="score"><span id="score-label">ניקוד</span>: <span id="score">0</span></span>
  <span><span id="q-label">שאלה</span> <span dir="ltr"><span id="qnum">1</span>/<span id="qtotal">10</span></span></span>
</div>

<div class="game-card" id="card">
  <div id="start-screen">
    <div style="font-size:4rem">📐</div>
    <h1 class="game-title" id="title">חישוב היקפים</h1>
    <p id="subtitle">חבר את כל הצלעות ומצא את ההיקף!</p>
    <p id="rounds-q">כמה שאלות?</p>
    <div class="answer-grid" style="grid-template-columns:repeat(3,1fr)" id="rounds-row">
      <button class="game-btn outline" onclick="setRounds(5,this)">5</button>
      <button class="game-btn outline" onclick="setRounds(10,this)">10</button>
      <button class="game-btn outline" onclick="setRounds(15,this)">15</button>
    </div>
    <p id="level-label"></p><div class="answer-grid" style="grid-template-columns:1fr 1fr" id="level-row">
      <button class="game-btn secondary" data-lvl="1" onclick="start(1)"></button>
      <button class="game-btn secondary" data-lvl="2" onclick="start(2)"></button>
      <button class="game-btn secondary" data-lvl="3" onclick="start(3)"></button>
      <button class="game-btn" data-lvl="0" onclick="start(0)"></button>
    </div>
  </div>

  <div id="play-screen" hidden>
    <div class="q-text" id="q-text"></div>
    <div class="shape-wrap" id="shape"></div>
    <div class="answer-grid" style="grid-template-columns:1fr 1fr" id="answers"></div>
  </div>

  <div id="end-screen" class="end-screen" hidden>
    <div class="stars" id="stars"></div>
    <div class="big-score" id="final-score"></div>
    <p id="player-line"></p>
    <p><span id="best-label">השיא שלך</span>: <b id="best"></b></p>
    <button class="game-btn" id="again-btn" onclick="location.reload()">שחק שוב 🔁</button>
    <div id="share-slot"></div>
  </div>
</div>

<script src="../nikud.js?v=961e2bed"></script>
<script src="../game-sdk.js?v=6a562bec"></script>
<script>
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);

const T_REGULAR = {
  title:{he:'חישוב היקפים',en:'Perimeter Quest',es:'Perímetros',de:'Umfang rechnen',pt:'Perímetros'},
  subtitle:{he:'חברו את כל הצלעות ומצאו את ההיקף!',en:'Add up all the sides to find the perimeter!',es:'¡Suma todos los lados y halla el perímetro!',de:'Addiere alle Seiten für den Umfang!',pt:'Some todos os lados e ache o perímetro!'},
  rounds_q:{he:'כמה שאלות?',en:'How many questions?',es:'¿Cuántas preguntas?',de:'Wie viele Fragen?',pt:'Quantas perguntas?'},
  level:{he:'בחרו רמת קושי',en:'Choose difficulty'},
  ask_perim:{he:'מה היקף הצורה? (ס״מ)',en:'What is the perimeter? (cm)',es:'¿Cuál es el perímetro? (cm)',de:'Wie groß ist der Umfang? (cm)',pt:'Qual é o perímetro? (cm)'},
  ask_side:{he:'ההיקף הוא {p} ס״מ. מה אורך הצלע החסרה?',en:'The perimeter is {p} cm. Find the missing side!',es:'El perímetro es {p} cm. ¿Cuánto mide el lado que falta?',de:'Der Umfang ist {p} cm. Wie lang ist die fehlende Seite?',pt:'O perímetro é {p} cm. Qual é o lado que falta?'},
  equal_sides:{he:'כל הצלעות שוות',en:'All sides are equal',es:'Todos los lados son iguales',de:'Alle Seiten sind gleich',pt:'Todos os lados são iguais'}
};

const T_NIQQUD = {
  title:{he:'חִשּׁוּב הֶקֵּפִים',en:'Perimeter Quest',es:'Perímetros',de:'Umfang rechnen',pt:'Perímetros'},
  subtitle:{he:'חַבְּרוּ אֶת כָּל הַצְּלָעוֹת וּמִצְאוּ אֶת הַהֶקֵּף!',en:'Add up all the sides to find the perimeter!',es:'¡Suma todos los lados y halla el perímetro!',de:'Addiere alle Seiten für den Umfang!',pt:'Some todos os lados e ache o perímetro!'},
  rounds_q:{he:'כַּמָּה שְׁאֵלוֹת?',en:'How many questions?',es:'¿Cuántas preguntas?',de:'Wie viele Fragen?',pt:'Quantas perguntas?'},
  level:{he:'בַּחֲרוּ רָמַת קֹשִׁי',en:'Choose difficulty'},
  ask_perim:{he:'מָה הֶקֵּף הַצּוּרָה? (ס״מ)',en:'What is the perimeter? (cm)',es:'¿Cuál es el perímetro? (cm)',de:'Wie groß ist der Umfang? (cm)',pt:'Qual é o perímetro? (cm)'},
  ask_side:{he:'הַהֶקֵּף הוּא {p} ס״מ. מָה אֹרֶךְ הַצֵּלָע הַחֲסֵרָה?',en:'The perimeter is {p} cm. Find the missing side!',es:'El perímetro es {p} cm. ¿Cuánto mide el lado que falta?',de:'Der Umfang ist {p} cm. Wie lang ist die fehlende Seite?',pt:'O perímetro é {p} cm. Qual é o lado que falta?'},
  equal_sides:{he:'כָּל הַצְּלָעוֹת שָׁווֹת',en:'All sides are equal',es:'Todos los lados son iguales',de:'Alle Seiten sind gleich',pt:'Todos os lados são iguais'}
};

let CHILD_AGE = null;
let USE_NIQQUD = false;
let T = T_REGULAR;

let game, diff, timer;
let score = 0, qnum = 0, correctCount = 0, level = 1, current;
let TOTAL = 10, roundsPicked = false, locked = false, ending = false;
let mistakes = 0, timeouts = 0;

async function loadKidContext(){
  try{
    const kidId = localStorage.getItem('active_kid_id');
    if(!kidId) return;

    const client = await IAKidsActivity._getClient();
    const {data,error} = await client
      .from('kids_profiles')
      .select('id, age')
      .eq('id',kidId)
      .maybeSingle();

    if(error || !data){
      console.warn('[perimeter] Kid profile was not loaded',error);
      return;
    }

    CHILD_AGE = Number(data.age);
    USE_NIQQUD = CHILD_AGE === 1 || CHILD_AGE === 2;
  }catch(error){
    console.warn('[perimeter] loadKidContext error',error);
  }
}

function applyLanguage(){
  T = USE_NIQQUD ? T_NIQQUD : T_REGULAR;

  $('title').textContent = IAKidsLang.t(T.title);
  $('subtitle').textContent = IAKidsLang.t(T.subtitle);
  $('rounds-q').textContent = IAKidsLang.t(T.rounds_q);
  $('level-label').textContent = IAKidsLang.t(T.level);
  $('score-label').textContent = IAKidsLang.ui('score');
  $('q-label').textContent = IAKidsLang.ui('question');
  $('best-label').textContent = IAKidsLang.ui('your_best');
  $('again-btn').textContent = IAKidsLang.ui('play_again');

  for(const [key,lvl] of [
    ['level_easy',1],
    ['level_medium',2],
    ['level_hard',3],
    ['level_random',0]
  ]){
    document.querySelector(`#level-row [data-lvl="${lvl}"]`).textContent =
      IAKidsLang.ui(key);
  }
}

IAKidsCoins.mount();
IAKidsHelp.mount({
  slug:'perimeter',
  how:'מחברים את כל הצלעות של הצורה כדי למצוא את ההיקף, ובוחרים את התשובה הנכונה מתוך 4 אפשרויות.',
  example:'ריבוע שכל צלע שלו 4: <span dir="ltr"><b>4 + 4 + 4 + 4 = 16</b></span> ← ההיקף הוא 16'
});

const show = id=>{
  ['start-screen','play-screen','end-screen'].forEach(s=>$(s).hidden=s!==id);
};

function setRounds(n,btn){
  TOTAL = n;
  roundsPicked = true;
  document.querySelectorAll('#rounds-row .game-btn').forEach(b=>b.classList.remove('success'));
  btn?.classList.add('success');
}

const ready = (async()=>{
  await loadKidContext();
  applyLanguage();

  // "חבר את כל הצלעות" is an order here; everywhere else חבר is a friend.
  IAKidsNikud.local({ 'חבר': 'חַבֵּר' });
  game = await IAKidsGame.init('perimeter');
  const p = await game.loadProgress();

  if(p?.rounds && !roundsPicked){
    setRounds(
      p.rounds,
      document.querySelector(`#rounds-row [onclick*="(${p.rounds},"]`) || $('rounds-row').children[1]
    );
  }

  if(p?.lastLevel != null){
    document.querySelector(`#level-row [data-lvl="${p.lastLevel}"]`)?.classList.add('success');
  }
})();

const lbl = (x,y,txt)=>
  `<text x="${x}" y="${y}" font-size="18" font-weight="800" fill="#d7e3f7" text-anchor="middle" dominant-baseline="central" direction="ltr">${txt}</text>`;

function rectSVG(w,h,hide){
  const sc=Math.min(190/w,110/h),W=w*sc,H=h*sc;
  const x=(300-W)/2,y=(170-H)/2+8;

  return `<svg viewBox="0 0 300 186">
    <rect x="${x}" y="${y}" width="${W}" height="${H}" fill="#173f75" stroke="#48b6ff" stroke-width="4" rx="3"/>
    ${lbl(x+W/2,y-14,w)}${hide?'':lbl(x+W/2,y+H+15,w)}
    ${lbl(x+W+15,y+H/2,hide==='h'?'?':h)}${hide?'':lbl(x-15,y+H/2,h)}
  </svg>`;
}

function triSVG(a,b,c,hide){
  const cx=(a*a+b*b-c*c)/(2*a);
  const cy=Math.sqrt(Math.max(.5,b*b-cx*cx));
  const sc=Math.min(200/a,110/cy);
  const x0=(300-a*sc)/2,y0=150;
  const A=[x0,y0],B=[x0+a*sc,y0],C=[x0+cx*sc,y0-cy*sc];

  return `<svg viewBox="0 0 300 186">
    <polygon points="${A}, ${B}, ${C}" fill="#173f75" stroke="#6c8cff" stroke-width="4"/>
    ${lbl((A[0]+B[0])/2,y0+17,a)}
    ${lbl((A[0]+C[0])/2-16,(A[1]+C[1])/2-6,b)}
    ${lbl((B[0]+C[0])/2+16,(B[1]+C[1])/2-6,hide==='c'?'?':c)}
  </svg>`;
}

function pentSVG(s){
  const R=78,C=[150,96],pts=[];

  for(let i=0;i<5;i++){
    const a=(i*72-90)*Math.PI/180;
    pts.push([C[0]+R*Math.cos(a),C[1]+R*Math.sin(a)]);
  }

  let out=`<svg viewBox="0 0 300 200"><polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="#173f75" stroke="#38cf83" stroke-width="4"/>`;

  for(let i=0;i<5;i++){
    const q=pts[(i+1)%5],p=pts[i];
    const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;
    const dx=mx-C[0],dy=my-C[1],len=Math.hypot(dx,dy);
    out += lbl(mx+dx/len*18,my+dy/len*16,s);
  }

  return out + `<text x="150" y="100" font-size="13" font-weight="700" fill="#d7e3f7" text-anchor="middle">${IAKidsLang.t(T.equal_sides)}</text></svg>`;
}

function makeTriangleSides(){
  while(true){
    const a=5+rnd(6),b=3+rnd(7),c=3+rnd(7);
    if(a+b>c && a+c>b && b+c>a && a!==b && b!==c) return [a,b,c];
  }
}

function makeQuestion(lvl){
  let q;

  if(lvl===1){
    const sq=Math.random()<.3,w=3+rnd(9),h=sq?w:2+rnd(7);
    const P=2*(w+h);

    q={
      key:`r${w}x${h}`,
      shape:{type:'rect',w,h,hide:null},
      answer:P,
      ask:'perim',
      P,
      cands:[P+2,P-2,P+4,w+h,P-4,w*h]
    };

  }else if(lvl===2){
    if(Math.random()<.5){
      const [a,b,c]=makeTriangleSides(),P=a+b+c;

      q={
        key:`t${[a,b,c].sort().join('-')}`,
        shape:{type:'tri',a,b,c,hide:null},
        answer:P,
        ask:'perim',
        P,
        cands:[P+1,P-1,P+2,P-2,a+b,P+3]
      };

    }else{
      const s=3+rnd(7),P=5*s;

      q={
        key:`p${s}`,
        shape:{type:'pent',s},
        answer:P,
        ask:'perim',
        P,
        cands:[4*s,6*s,P+5,P-5,P+s,3*s]
      };
    }

  }else{
    if(Math.random()<.5){
      const w=4+rnd(8),h=2+rnd(7),P=2*(w+h);

      q={
        key:`mr${w}x${h}`,
        shape:{type:'rect',w,h,hide:'h'},
        answer:h,
        ask:'side',
        P,
        cands:[h+1,h-1,h+2,w,P-w,h+3]
      };

    }else{
      const [a,b,c]=makeTriangleSides(),P=a+b+c;

      q={
        key:`mt${a}-${b}-${c}`,
        shape:{type:'tri',a,b,c,hide:'c'},
        answer:c,
        ask:'side',
        P,
        cands:[c+1,c-1,c+2,a,b,c+3]
      };
    }
  }

  const opts=[q.answer];

  for(const d of q.cands){
    if(opts.length<4 && d>0 && !opts.includes(d)) opts.push(d);
  }

  for(let n=1;opts.length<4;n++){
    if(!opts.includes(q.answer+4+n)) opts.push(q.answer+4+n);
  }

  for(let i=opts.length-1;i>0;i--){
    const j=rnd(i+1);
    [opts[i],opts[j]]=[opts[j],opts[i]];
  }

  q.opts=opts;
  return q;
}

// Rebuilds the shape's SVG at render time from the raw params in q.shape —
// the bank rejects HTML/SVG markup in a payload (any client-written row is
// untrusted content), so makeQuestion() no longer stores the rendered string.
function svgFor(s){
  if(s.type==='rect') return rectSVG(s.w,s.h,s.hide);
  if(s.type==='tri')  return triSVG(s.a,s.b,s.c,s.hide);
  return pentSVG(s.s);
}

async function start(lvl){
  await ready;

  level=lvl;
  diff=game.difficulty(lvl||1,3);

  timer=game.timer({
    style:'bomb',
    onTimeout:()=>handleTimeout()
  });

  score=0;
  qnum=0;
  correctCount=0;
  mistakes=0;
  timeouts=0;
  locked=false;
  ending=false;

  $('score').textContent='0';
  $('qnum').textContent='1';
  $('qtotal').textContent=TOTAL;

  IAKidsActivity.configure({
    difficulty:lvl||1,
    questionsCount:TOTAL,
    metadata:{
      game_mode:'perimeter',
      selected_level:lvl,
      random_difficulty:lvl===0,
      child_age:CHILD_AGE,
      uses_niqqud:USE_NIQQUD,
      timer_enabled:true
    }
  });

  await game.saveProgress({
    lastLevel:lvl,
    rounds:TOTAL
  });

  show('play-screen');
  await next();
}

async function next(){
  if(ending) return;

  if(qnum>=TOTAL){
    await end();
    return;
  }

  qnum++;
  locked=false;
  $('qnum').textContent=qnum;

  const lvl=level===0?1+rnd(3):diff.level;
  const q=await game.newQuestion(()=>makeQuestion(lvl),x=>x.key);

  current=q.answer;

  IAKidsActivity.questionStarted();

  $('q-text').textContent=
    q.ask==='perim'
      ? IAKidsLang.t(T.ask_perim)
      : IAKidsLang.t(T.ask_side).replace('{p}',q.P);

  $('shape').innerHTML=svgFor(q.shape);

  const grid=$('answers');
  grid.innerHTML='';

  for(const o of q.opts){
    const b=document.createElement('button');
    b.className='game-btn outline';
    b.innerHTML=`<span dir="ltr">${o}</span>`;
    b.onclick=()=>answer(o,b);
    grid.appendChild(b);
  }

  timer.start(
    IAKidsTimer.secondsFor(lvl,15)
  );
}

async function answer(said,btn){
  if(locked || ending) return;

  locked=true;
  timer.stop();

  document.querySelectorAll('#answers .game-btn').forEach(b=>b.disabled=true);

  if(said===current){
    score+=10;
    correctCount++;

    diff.right();
    IAKidsActivity.correct();

    IAKidsFX.correct(btn);
    await IAKidsCoins.right(btn);

  }else{
    mistakes++;

    diff.wrong();
    IAKidsActivity.wrong();

    if(btn) IAKidsFX.wrong(btn);
    await IAKidsCoins.wrong();

    [...$('answers').children].forEach(b=>{
      if(Number(b.textContent.trim())===Number(current)){
        b.classList.add('correct');
      }
    });
  }

  $('score').textContent=score;

  setTimeout(
    async()=>{ await next(); },
    said===current ? 600 : 950
  );
}

async function handleTimeout(){
  if(locked || ending) return;

  locked=true;
  timer.stop();
  timeouts++;

  document.querySelectorAll('#answers .game-btn').forEach(b=>b.disabled=true);

  diff.wrong();
  IAKidsActivity.skipped();

  await IAKidsCoins.wrong();

  [...$('answers').children].forEach(b=>{
    if(Number(b.textContent.trim())===Number(current)){
      b.classList.add('correct');
    }
  });

  setTimeout(async()=>{ await next(); },900);
}

async function end(){
  if(ending) return;

  ending=true;
  locked=true;
  timer?.stop();

  const maxScore=TOTAL*10;
  const accuracy=
    correctCount /
    Math.max(1,correctCount+mistakes+timeouts);

  await game.saveScore(
    score,
    {
      level,
      correct:correctCount,
      total:TOTAL,
      mistakes,
      timeouts
    }
  );

  const top=(await game.getHighScores(1))[0];

  $('final-score').textContent=score;
  $('best').textContent=top?.score??score;

  $('player-line').textContent=
    `${top?.player || IAKidsLang.ui('guest')} · ${
      new Date().toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short'})
    }`;

  $('stars').textContent=
    '⭐'.repeat(
      accuracy>=.9 ? 3 :
      accuracy>=.7 ? 2 : 1
    );

  await game.complete(
    score,
    {
      maxScore,
      performanceScore:Math.round(accuracy*100),
      metadata:{
        game_mode:'perimeter',
        selected_level:level,
        random_difficulty:level===0,
        total_rounds:TOTAL,
        correct_answers:correctCount,
        mistakes,
        timeouts,
        child_age:CHILD_AGE,
        uses_niqqud:USE_NIQQUD,
        timer_enabled:true
      }
    }
  );

  game.shareButton(score,$('share-slot'));
  show('end-screen');
}
</script>
</body>
</html>
