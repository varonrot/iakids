# Per-IP request budgets for the mirror (see PROTECTION.md §3 — this domain is
# not behind Cloudflare, so the rate limit has to live here).
limit_req_zone $binary_remote_addr zone=pages:10m  rate=2r/s;
limit_req_zone $binary_remote_addr zone=assets:10m rate=30r/s;
limit_req_status 429;

# iakids static site (mirror of iakids.app) — container on 127.0.0.1:3020
server {
    server_name smarts-brains.online www.smarts-brains.online;

    # Static assets carry a ?v=<content hash> (games/tools/bump-sdk.py), so a long
    # browser cache is safe and a new build busts it. The container behind this
    # says no-cache for everything, which made every game re-download the SDK.

# --- security headers -------------------------------------------------------
# GitHub Pages cannot set headers, so iakids.app gets these through Cloudflare
# Transform Rules; this mirror is nginx, so they are set here. See SECURITY.md.
#
# The Supabase session (access + refresh token) lives in localStorage on every
# page, so any XSS is a full account takeover. A CSP is what stands between a
# bug and a breach.
#
# The source list is what the site actually loads, counted across the repo:
#   scripts  jsdelivr (supabase-js), esm.sh (supabase-js in the games SDK),
#            gstatic (firebase), cdnjs, googletagmanager (landing pages only)
#   styles   fonts.googleapis.com   fonts  fonts.gstatic.com
#   connect  the Supabase project, both Render backends, Cloudflare's trace
#   frames   player.vimeo.com, lemonsqueezy checkout
# 'unsafe-inline' and 'unsafe-eval' are here because the pages are written as
# single files full of inline <script> and inline styles; removing them is a
# rewrite, not a header change. The CSP still blocks loading an attacker's
# script from an origin that is not on this list, which is the common case.
set $iakids_csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://esm.sh https://cdnjs.cloudflare.com https://www.gstatic.com https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://bxnfzuglfwytiyaguwjj.supabase.co wss://bxnfzuglfwytiyaguwjj.supabase.co https://iakids-backend.onrender.com https://iakids-ai-tutor-he.onrender.com https://esm.sh https://cdn.jsdelivr.net https://www.googletagmanager.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src 'self' https://player.vimeo.com https://iakidsapp.lemonsqueezy.com https://smarts-brains.firebaseapp.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://iakidsapp.lemonsqueezy.com; object-src 'none'";

add_header Content-Security-Policy   $iakids_csp                       always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff"                          always;
add_header X-Frame-Options           "SAMEORIGIN"                       always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
add_header Permissions-Policy        "camera=(self), microphone=(self), geolocation=(), payment=()" always;

    location ~* \.(js|css|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|mp3|wav|json)$ {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        # add_header in a location block replaces the server-level set, not adds to
        # it, so the security headers are repeated here.
        add_header Cache-Control            "public, max-age=14400";
        add_header Content-Security-Policy   $iakids_csp                       always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                          always;
        add_header X-Frame-Options           "SAMEORIGIN"                       always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
        limit_req zone=assets burst=200 nodelay;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        # A child opens a handful of pages a minute; a site copier asks for
        # hundreds. The burst is wide enough that no real browser ever meets it.
        limit_req zone=pages burst=60 nodelay;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    access_log /var/log/nginx/smarts-brains.access.log;
    error_log  /var/log/nginx/smarts-brains.error.log;

    listen [::]:443 ssl;   # no ipv6only here — chenamielarch already sets it for :443
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/smarts-brains.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smarts-brains.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name smarts-brains.online www.smarts-brains.online;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
