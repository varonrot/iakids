<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Funciones – iakids</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:#fffaf5;
    }

    /* ===== TOP BAR ===== */
    .topbar{
      background:#ffffff;
      border-bottom:1px solid rgba(15,23,42,.06);
    }

    .topbar-inner{
      max-width:1200px;
      margin:0 auto;
      padding:14px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    /* LOGO */
    .logo{
      font-weight:700;
      font-size:18px;
      color:#0f172a;
      text-decoration:none;
    }

    /* ACTIONS */
    .topbar-actions{
      display:flex;
      align-items:center;
      gap:18px;
    }

    .nav-link{
      color:#475569;
      text-decoration:none;
      font-size:14px;
      font-weight:500;
    }

    .nav-link:hover{
      color:#0f172a;
    }

    /* BUTTON */
    .btn-primary{
      background:#2563eb;
      color:#ffffff;
      padding:10px 18px;
      border-radius:999px;
      font-size:14px;
      font-weight:600;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      line-height:1;
      white-space:nowrap;
    }

    .btn-primary:hover{
      background:#1d4ed8;
    }

    /* MOBILE */
    @media (max-width:600px){
      .topbar-inner{
        padding:12px 16px;
      }

      .topbar-actions{
        gap:12px;
      }

      .nav-link{
        font-size:13px;
      }

      .btn-primary{
        padding:9px 14px;
        font-size:13px;
      }
    }

  </style>
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">

      <a href="/" class="logo">iakids</a>

      <nav class="topbar-actions">
        <a href="https://iakids.app" class="nav-link">Inicio</a>
        <a href="/onboarding/cuenta" class="nav-link">Entrar</a>
        <a href="/onboarding" class="btn-primary">Empezar gratis</a>
      </nav>

    </div>
  </header>

</body>
</html>
