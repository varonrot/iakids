name: Add homework audio toggle 0.7.49

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_homework_audio_toggle_0749.py'
      - '.github/workflows/add-homework-audio-toggle-0749.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/add_homework_audio_toggle_0749.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/lesson-completion-core.js he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add homework audio toggle; bump to 0.7.49"
            git push origin main
          fi
