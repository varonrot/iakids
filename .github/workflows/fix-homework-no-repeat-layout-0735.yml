name: Fix homework no-repeat and notebook layout 0.7.35

on:
  push:
    paths:
      - '.github/scripts/fix_homework_no_repeat_layout_0735.py'
      - '.github/workflows/fix-homework-no-repeat-layout-0735.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch homework guidance and notebook layout
        run: python .github/scripts/fix_homework_no_repeat_layout_0735.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/lesson-completion-core.js he/workspace/lesson-completion.js he/workspace/index.html backend-ai-tutor-he/main.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Prevent repeated homework questions; widen notebook; bump to 0.7.35"
          git push
