name: Populate My Lessons 0.7.49
on:
  push:
    paths:
      - '.github/workflows/populate-my-lessons-0749.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Populate My Lessons
        run: python .github/scripts/populate-my-lessons-0749.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Populate My Lessons with live Supabase data; bump to 0.7.49'
            git push origin main
          fi
