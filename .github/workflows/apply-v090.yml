name: Stabilize lesson flow v0.9.0
on:
  push:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply stabilization patch
        run: python .github/scripts/patch-v090.py
      - name: Validate stabilized workspace
        run: |
          grep -q 'IAKIDS • build 0.9.0' he/workspace/index.html
          ! grep -q 'awardPartCoins(' he/workspace/index.html
          ! grep -q 'coin-reward-pop' he/workspace/index.html
      - name: Commit patch and clean temporary files
        run: |
          rm -f .github/scripts/patch-v090.py
          rm -f .github/workflows/apply-v090.yml
          rm -f .github/workflows/apply-v090-trigger.txt
          rm -f .github/scripts/patch-explicit-part-v090.py
          rm -f .github/workflows/run-explicit-part-v090.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stabilize lesson flow and remove coin rewards v0.9.0'
          git push
