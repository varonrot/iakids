name: Patch sidebar hard reload v064
on:
  push:
    paths:
      - '.github/workflows/run-sidebar-hard-reload-v064.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_sidebar_hard_reload_v064.py
      - name: Validate build
        run: grep -q 'IAKIDS • build 0.6.4' he/workspace/index.html
      - name: Validate storage handoff
        run: grep -q 'iakids_pending_sidebar_lesson' he/workspace/index.html
      - name: Validate hard reload
        run: grep -q 'window.location.reload();' he/workspace/index.html
      - name: Validate old reset removed
        run: '! grep -q "resetLessonWorkspaceBeforeSidebarSwitch" he/workspace/index.html'
      - name: Commit patch
        run: |
          rm .github/scripts/patch_sidebar_hard_reload_v064.py
          rm .github/workflows/run-sidebar-hard-reload-v064.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html .github
          git commit -m 'Hard reload when switching sidebar lessons; build 0.6.4'
          git push
