name: Structured homework questions 0.7.26

on:
  push:
    paths:
      - '.github/scripts/structured_homework_questions_0726.py'
      - '.github/triggers/structured-homework-0726.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply structured homework question state machine
        run: python .github/scripts/structured_homework_questions_0726.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html he/workspace/lesson-completion.js he/workspace/lesson-completion-core.js backend-ai-tutor-he/main.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add structured homework question state machine; bump to 0.7.26"
          git push
