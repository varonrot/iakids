name: Patch closing before completion

on:
  push:
    paths:
      - '.github/workflows/patch-closing-before-completion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact closing order patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('he/workspace/index.html')
          text = path.read_text(encoding='utf-8')

          old = '''  const videoPlayed =
    isLastPart
      ? await showLessonCompletionScreen()
      : await playLessonTransitionVideo(
          transition || {}
        );'''

          new = '''  let videoPlayed = false;

  if(isLastPart){
    videoPlayed =
      await playLessonTransitionVideo(
        transition || {}
      );

    await showLessonCompletionScreen();
  }
  else{
    videoPlayed =
      await playLessonTransitionVideo(
        transition || {}
      );
  }'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 final completion block, found {count}')

          text = text.replace(old, new, 1)

          if '0.4.2' not in text:
              raise SystemExit('Build 0.4.2 not found')

          text = text.replace('0.4.2', '0.4.3')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-closing-before-completion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html .github/workflows/patch-closing-before-completion.yml
          git commit -m 'Play lesson closing before completion screen; build 0.4.3'
          git push
