name: Enforce homework step-by-step 0.7.77

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/enforce-homework-step-by-step-0777.py'
      - '.github/workflows/enforce-homework-step-by-step-0777.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch strict step-by-step flow
        run: python .github/scripts/enforce-homework-step-by-step-0777.py
      - name: Compile backend
        run: python -m py_compile backend-ai-tutor-he/main.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-ai-tutor-he/main.py he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Enforce homework step-by-step flow; bump to 0.7.77"
          git push origin main
