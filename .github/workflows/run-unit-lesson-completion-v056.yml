name: Patch unit lesson completion v056
on:
  push:
    paths:
      - '.github/workflows/run-unit-lesson-completion-v056.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_unit_lesson_completion_v056.py
      - name: Validate backend
        run: python -m py_compile backend-ai-tutor-he/main.py
      - name: Commit patch
        run: |
          rm .github/scripts/patch_unit_lesson_completion_v056.py
          rm .github/workflows/run-unit-lesson-completion-v056.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend-ai-tutor-he/main.py he/workspace/index.html .github
          git commit -m 'Complete per-unit lesson progress; build 0.5.6'
          git push
