name: Homework V2 chat-like 0.7.99

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/homework-v2-chatlike-0799.py'
      - '.github/workflows/homework-v2-chatlike-0799.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Homework V2 chat-like patch
        run: python .github/scripts/homework-v2-chatlike-0799.py
      - name: Compile backend
        run: python -m py_compile backend-ai-tutor-he/main.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-ai-tutor-he/main.py he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Make Homework V2 mirror clean image chat; bump to 0.7.99"
            git push origin main
          fi
