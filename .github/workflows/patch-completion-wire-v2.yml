name: Completion Wire V2
on:
  push:
    paths:
      - .github/workflows/patch-completion-wire-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("he/workspace/index.html"); t=p.read_text(encoding="utf-8"); css="<link rel=\"stylesheet\" href=\"/he/workspace/lesson-completion.css\">"; js="<script src=\"/he/workspace/lesson-completion.js\"></script>"; t=t if css in t else t.replace("</head>",css+"\n</head>",1); t=t if js in t else t.replace("<div id=\"iakidsBuildStamp\"",js+"\n<div id=\"iakidsBuildStamp\"",1); old="  const videoPlayed =\n    await playLessonTransitionVideo(\n      transition || {}\n    );"; new="  const videoPlayed =\n    isLastPart\n      ? await showLessonCompletionScreen()\n      : await playLessonTransitionVideo(\n          transition || {}\n        );"; c=t.count(old); assert c==2, f"expected 2 transition blocks, got {c}"; t=t.replace(old,new); assert t.count("0.4.1")>=2, "build 0.4.1 missing"; t=t.replace("0.4.1","0.4.2"); p.write_text(t,encoding="utf-8"); print("completion wired build 0.4.2")'
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/patch-completion-wire-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html .github/workflows/patch-completion-wire-v2.yml
          git commit -m "Wire lesson completion screen; build 0.4.2"
          git push
