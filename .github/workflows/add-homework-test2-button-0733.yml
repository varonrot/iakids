name: Add homework test2 button 0.7.33

on:
  push:
    paths:
      - '.github/workflows/add-homework-test2-button-0733.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add diagnostic homework button 2
        run: python .github/scripts/add-homework-test2-button-0733.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html
          git diff --cached --quiet || git commit -m "Add diagnostic homework button 2; bump to 0.7.33"
          git push origin main
