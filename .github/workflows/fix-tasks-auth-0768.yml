name: Fix tasks auth 0.7.68

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-tasks-auth-0768.py'
      - '.github/workflows/fix-tasks-auth-0768.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix tasks Supabase auth and bump cache/version
        run: python .github/scripts/fix-tasks-auth-0768.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/tasks/index.html he/workspace/tasks-internal.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix tasks auth; bump to 0.7.68"
          git push origin main
