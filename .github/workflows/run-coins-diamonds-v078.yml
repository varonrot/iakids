name: Apply currency counters v0.7.8

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-coins-diamonds-v078.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/patch-coins-diamonds-v078.py
      - name: Commit patched workspace and clean temporary files
        run: |
          rm .github/scripts/patch-coins-diamonds-v078.py
          rm .github/workflows/run-coins-diamonds-v078.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html .github/scripts/patch-coins-diamonds-v078.py .github/workflows/run-coins-diamonds-v078.yml
          git commit -m "Connect kid currency counters to profile data (v0.7.8)"
          git push origin main
