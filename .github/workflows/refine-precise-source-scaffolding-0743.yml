name: Refine precise source scaffolding 0.7.43

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refine_precise_source_scaffolding_0743.py'
      - '.github/workflows/refine-precise-source-scaffolding-0743.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/refine_precise_source_scaffolding_0743.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-ai-tutor-he/main.py he/workspace/lesson-completion-core.js he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Make homework source hints precise; bump 0.7.43"
            git push origin main
          fi
