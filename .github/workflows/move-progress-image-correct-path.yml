name: Move progress image to correct path
on:
  push:
    paths:
      - '.github/workflows/move-progress-image-correct-path.yml'
permissions:
  contents: write
jobs:
  move-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy image to public assets path
        run: |
          set -e
          test -f he/assets/lesson/my-progress.webp
          mkdir -p assets/lesson
          cp he/assets/lesson/my-progress.webp assets/lesson/my-progress.webp
          test -s assets/lesson/my-progress.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lesson/my-progress.webp
          git commit -m "Fix progress image asset path"
          git push
