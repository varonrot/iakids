name: Fix homework pedagogy 0.7.30

on:
  push:
    paths:
      - '.github/scripts/fix_homework_pedagogy_0730.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply homework pedagogy improvements
        run: python .github/scripts/fix_homework_pedagogy_0730.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html he/workspace/lesson-completion.js he/workspace/lesson-completion-core.js backend-ai-tutor-he/main.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Improve homework tutoring pedagogy; bump to 0.7.30"
          git push
