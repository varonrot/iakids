name: Patch question dialog timing build 0.4.1

on:
  push:
    paths:
      - '.github/workflows/patch-question-dialog-build-041.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact dialog timing patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('he/workspace/index.html')
          text = path.read_text(encoding='utf-8')

          old = '''  if(
            questionText
            &&
            !questionAlreadyIncluded
          ){
            const questionVisualOrder =
              lessonParts.length + 1;'''

          new = '''  if(
            questionText
            &&
            !questionAlreadyIncluded
          ){
            /*
              The lesson question is the start of the dialogue,
              so switch the progress track before the question
              is displayed or spoken.
            */
            window.CURRENT_LESSON_FLOW_PHASE =
              "dialog";

            renderDynamicLessonFlow(
              "dialog",
              Number(
                window.CURRENT_LESSON_VISUAL_PART ||
                activeVisualPart ||
                1
              ),
              Number(
                window.CURRENT_LESSON_PARTS_COUNT ||
                activeVisualPart ||
                1
              )
            );

            const questionVisualOrder =
              lessonParts.length + 1;'''

          count = text.count(old)
          if count not in (1, 2):
              raise SystemExit(f'Expected 1 or 2 universal question blocks, found {count}')

          text = text.replace(old, new)

          build_count = text.count('0.4.0')
          if build_count < 2:
              raise SystemExit(f'Expected build 0.4.0 stamp + variable, found {build_count}')
          text = text.replace('0.4.0', '0.4.1')

          path.write_text(text, encoding='utf-8')
          print(f'Patched {count} question block(s); bumped build to 0.4.1')
          PY

      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-question-dialog-build-041.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html .github/workflows/patch-question-dialog-build-041.yml
          git commit -m 'Switch flow to dialog when lesson question starts; build 0.4.1'
          git push
