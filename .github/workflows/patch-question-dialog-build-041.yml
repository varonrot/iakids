name: Patch question dialog timing build 0.4.1

on:
  push:
    paths:
      - '.github/workflows/patch-question-dialog-build-041.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact dialog timing patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('he/workspace/index.html')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'(if\(\s*questionText\s*&&\s*!questionAlreadyIncluded\s*\)\{\s*)(const questionVisualOrder\s*=\s*lessonParts\.length\s*\+\s*1;)'
          )

          insert = '''\n    /* The lesson question starts the dialogue. */\n    window.CURRENT_LESSON_FLOW_PHASE =\n      "dialog";\n\n    renderDynamicLessonFlow(\n      "dialog",\n      Number(\n        window.CURRENT_LESSON_VISUAL_PART ||\n        activeVisualPart ||\n        1\n      ),\n      Number(\n        window.CURRENT_LESSON_PARTS_COUNT ||\n        activeVisualPart ||\n        1\n      )\n    );\n\n    '''

          text, count = pattern.subn(lambda m: m.group(1) + insert + m.group(2), text)
          if count not in (1, 2):
              raise SystemExit(f'Expected 1 or 2 universal question blocks, found {count}')

          build_count = text.count('0.4.0')
          if build_count < 2:
              raise SystemExit(f'Expected build 0.4.0 stamp + variable, found {build_count}')
          text = text.replace('0.4.0', '0.4.1')

          path.write_text(text, encoding='utf-8')
          print(f'Patched {count} question block(s); bumped build to 0.4.1')
          PY

      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-question-dialog-build-041.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html .github/workflows/patch-question-dialog-build-041.yml
          git commit -m 'Switch flow to dialog when lesson question starts; build 0.4.1'
          git push
