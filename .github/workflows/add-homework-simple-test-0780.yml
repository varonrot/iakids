name: Add homework simple test 0.7.80

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add-homework-simple-test-0780.py'
      - '.github/workflows/add-homework-simple-test-0780.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add simple homework test mode
        run: python .github/scripts/add-homework-simple-test-0780.py
      - name: Compile backend
        run: python -m py_compile backend-ai-tutor-he/main.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-ai-tutor-he/main.py he/workspace/lesson-completion-core.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add temporary simple homework tutor test; bump to 0.7.80"
          git push origin main
