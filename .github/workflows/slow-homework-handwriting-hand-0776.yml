name: Slow homework handwriting hand 0.7.76

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/slow-homework-handwriting-hand-0776.py'
      - '.github/workflows/slow-homework-handwriting-hand-0776.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch slow notebook handwriting
        run: python .github/scripts/slow-homework-handwriting-hand-0776.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Slow homework handwriting; add writing hand; bump to 0.7.76"
          git push origin main
