name: Auto-start homework coach 0.7.88

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/auto-start-homework-coach-0788.py'
      - '.github/workflows/auto-start-homework-coach-0788.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Auto-start production homework coach
        run: python .github/scripts/auto-start-homework-coach-0788.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/lesson-completion-core.js he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Start homework help automatically; bump to 0.7.88"
          git push origin main
