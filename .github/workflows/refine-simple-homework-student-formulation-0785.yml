name: Refine simple homework student formulation 0.7.85

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refine-simple-homework-student-formulation-0785.py'
      - '.github/workflows/refine-simple-homework-student-formulation-0785.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch simple homework test prompt
        run: python .github/scripts/refine-simple-homework-student-formulation-0785.py
      - name: Validate backend
        run: python -m py_compile backend-ai-tutor-he/main.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-ai-tutor-he/main.py he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Keep homework answer formulation with child; bump to 0.7.85"
          git push origin main
