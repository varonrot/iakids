name: Patch dynamic lesson progress

on:
  push:
    paths:
      - '.github/workflows/patch-dynamic-lesson-progress.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply dynamic lesson progress patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_dynamic_lesson_progress.py
          python /tmp/patch_dynamic_lesson_progress.py

      - name: Commit dynamic lesson progress
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/patch-dynamic-lesson-progress.yml
          git add he/workspace/index.html .github/workflows/patch-dynamic-lesson-progress.yml
          git commit -m "Make lesson progress track dynamic by lesson parts"
          git push
