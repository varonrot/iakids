name: Promote homework Sol production 0.7.87

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/promote-homework-sol-production-0787.py'
      - '.github/workflows/promote-homework-sol-production-0787.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Promote Sol homework coach to production
        run: python .github/scripts/promote-homework-sol-production-0787.py
      - name: Compile backend
        run: python -m py_compile backend-ai-tutor-he/main.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-ai-tutor-he/main.py he/workspace/lesson-completion-core.js he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Promote GPT-5.6 Sol homework coach to production; bump to 0.7.87"
          git push origin main
