name: Bump workspace build 0.4.7

on:
  push:
    paths:
      - '.github/workflows/bump-workspace-build-047.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump visible workspace build
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('he/workspace/index.html')
          s = p.read_text(encoding='utf-8')
          old = '0.4.6'
          new = '0.4.7'
          count = s.count(old)
          if count < 1:
              raise SystemExit('0.4.6 not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          print(f'Updated {count} occurrence(s) from {old} to {new}')
          PY
      - name: Commit build bump
        shell: bash
        run: |
          rm -f .github/workflows/bump-workspace-build-047.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html .github/workflows/bump-workspace-build-047.yml
          git commit -m 'Bump workspace build to 0.4.7'
          git push
