name: Update sitemap

on:
  push:
    branches: [main]
    paths:
      - '**/index.html'
      - '.github/workflows/update-sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate sitemap.xml
        shell: python
        run: |
          from pathlib import Path
          from datetime import date
          from xml.sax.saxutils import escape

          ROOT = Path('.')
          BASE = 'https://iakids.app'
          TODAY = date.today().isoformat()

          # Public language editions currently present in the repository.
          LANGS = {'ar','da','de','es','fi','fr','he','id','it','ja','ko','nl','no','pl','pt','ro','sv','tr'}

          # App/account/internal areas should not be indexed by the SEO sitemap.
          EXCLUDED_TOP = {
              'admin', 'parent-dashboard', 'support-dashboard', 'workspace',
              'onboarding', 'games', 'backend', 'backend-hebrew',
              'backend-hebrew-clean', 'node_modules', '.git', '.github'
          }

          def is_public_index(path: Path) -> bool:
              parts = path.as_posix().split('/')
              if path.name != 'index.html':
                  return False
              if any(part.startswith('.') for part in parts[:-1]):
                  return False
              top = parts[0] if len(parts) > 1 else ''
              if top in EXCLUDED_TOP:
                  return False

              # Root site and legacy/public Spanish SEO pages.
              if path.as_posix() == 'index.html' or top == 'blog':
                  return True

              # Language homepages and language blog/SEO content.
              if top in LANGS:
                  if len(parts) == 2:  # /xx/
                      return True
                  if len(parts) >= 3 and parts[1] == 'blog':
                      return True

              # Other public informational pages at the top level.
              if top in {
                  'Funciones', 'actividades-educativas', 'contact', 'coppa',
                  'guia-para-padres', 'padres', 'planes', 'privacy',
                  'refunds', 'support', 'terms'
              }:
                  return True
              return False

          def url_for(path: Path) -> str:
              if path.as_posix() == 'index.html':
                  return BASE + '/'
              parent = path.parent.as_posix().strip('.')
              return BASE + '/' + parent.strip('/') + '/'

          paths = sorted(
              (p for p in ROOT.rglob('index.html') if is_public_index(p)),
              key=lambda p: (url_for(p).count('/'), url_for(p))
          )

          urls = []
          seen = set()
          for p in paths:
              url = url_for(p)
              if url in seen:
                  continue
              seen.add(url)
              depth = url.replace(BASE, '').strip('/').count('/')
              if url == BASE + '/':
                  priority = '1.0'
              elif depth == 0:
                  priority = '0.9'
              elif url.endswith('/blog/'):
                  priority = '0.9'
              elif depth <= 1:
                  priority = '0.8'
              else:
                  priority = '0.7'
              urls.append((url, priority))

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]
          for url, priority in urls:
              lines.extend([
                  '  <url>',
                  f'    <loc>{escape(url)}</loc>',
                  f'    <lastmod>{TODAY}</lastmod>',
                  f'    <priority>{priority}</priority>',
                  '  </url>'
              ])
          lines.append('</urlset>')
          Path('sitemap.xml').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'Generated sitemap.xml with {len(urls)} public URLs')

      - name: Commit sitemap if changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Update sitemap.xml [skip ci]"
          git push