name: Fix dashboard first section 0.7.45
on:
  push:
    paths:
      - '.github/workflows/fix-dashboard-first-section-0745.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply first-section redesign
        run: python .github/scripts/fix-dashboard-first-section-0745.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Redesign dashboard first section; bump to 0.7.45'
            git push origin main
          fi
