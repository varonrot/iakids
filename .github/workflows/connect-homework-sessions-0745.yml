name: Connect homework sessions 0.7.45

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/connect_homework_sessions_0745.py'
      - '.github/workflows/connect-homework-sessions-0745.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/connect_homework_sessions_0745.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-ai-tutor-he/main.py he/workspace/lesson-completion-core.js he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Connect homework sessions tracking; bump to 0.7.45"
            git push origin main
          fi
