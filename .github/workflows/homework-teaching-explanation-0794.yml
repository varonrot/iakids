name: Homework teaching explanation 0.7.94

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/homework-teaching-explanation-0794.py'
      - '.github/workflows/homework-teaching-explanation-0794.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Make homework coach explain before asking
        run: python .github/scripts/homework-teaching-explanation-0794.py
      - name: Compile backend
        run: python -m py_compile backend-ai-tutor-he/main.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-ai-tutor-he/main.py he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make homework coach explain each step; bump to 0.7.94"
          git push origin main
