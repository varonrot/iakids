name: patch-score
on:
  push:
    paths:
      - .github/workflows/patch-lesson-score-separation.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: python .github/patch_score.py
      - name: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/patch-lesson-score-separation.yml .github/patch_score.py
          git add he/workspace/index.html .github/workflows/patch-lesson-score-separation.yml .github/patch_score.py
          git commit -m 'Separate overall and current part lesson scores'
          git push
