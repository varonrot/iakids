name: Patch HE2 parents transition blend

on:
  push:
    paths:
      - '.github/workflows/patch-he2-parents-transition-blend.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove visual gap and blend sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('he2/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* ===== PARENTS TRANSITION BLEND V2 ===== */'
          css = '''
/* ===== PARENTS TRANSITION BLEND V2 ===== */
.learning-flow{padding-bottom:14px!important;background:linear-gradient(180deg,#041120 0%,#06172b 58%,#071a31 100%)!important}
.flow-bottom{margin-bottom:0!important}
.parents-showcase-v2{margin-top:-2px!important;background-color:#071a31!important;background-position:center center!important;background-size:cover!important}
.parents-showcase-v2::before{background:linear-gradient(180deg,#071a31 0%,rgba(7,26,49,.98) 3%,rgba(7,26,49,.90) 8%,rgba(7,26,49,.68) 14%,rgba(7,26,49,.36) 21%,rgba(7,26,49,.12) 29%,rgba(7,26,49,0) 38%),linear-gradient(90deg,rgba(4,17,32,.99) 0%,rgba(4,17,32,.96) 24%,rgba(4,17,32,.82) 40%,rgba(4,17,32,.40) 57%,rgba(4,17,32,.12) 72%,rgba(4,17,32,.02) 100%)!important}
@media(max-width:760px){.learning-flow{padding-bottom:10px!important}.parents-showcase-v2{margin-top:-2px!important}.parents-showcase-v2::before{background:linear-gradient(180deg,#071a31 0%,rgba(7,26,49,.96) 6%,rgba(7,26,49,.72) 16%,rgba(7,26,49,.34) 28%,rgba(7,26,49,0) 42%),linear-gradient(180deg,rgba(4,17,32,.92),rgba(4,17,32,.28) 72%,rgba(4,17,32,.08))!important}}
'''
          if marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he2/index.html
          git diff --cached --quiet || git commit -m "Tighten HE2 section transition"
          git push
