name: Fix Hebrew onboarding links

on:
  push:
    paths:
      - '.github/workflows/fix-he-onboarding-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Hebrew homepage onboarding links
        shell: python
        run: |
          from pathlib import Path
          p = Path('he/index.html')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'href="/onboarding"': 'href="/he/onboarding/"',
              'href="/onboarding/"': 'href="/he/onboarding/"',
              "href='/onboarding'": "href='/he/onboarding/'",
              "href='/onboarding/'": "href='/he/onboarding/'",
              'href="he/onboarding"': 'href="/he/onboarding/"',
              'href="he/onboarding/"': 'href="/he/onboarding/"',
              'href="he/onboarding/cuenta"': 'href="/he/onboarding/cuenta/"',
              'href="he/onboarding/cuenta/"': 'href="/he/onboarding/cuenta/"',
          }
          changed = 0
          for old, new in replacements.items():
              n = text.count(old)
              if n:
                  text = text.replace(old, new)
                  changed += n
          print(f'Replaced {changed} onboarding links')
          if changed == 0:
              raise SystemExit('No matching links found')
          p.write_text(text, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/index.html
          git commit -m "Fix Hebrew onboarding links" || exit 0
          git push
