name: Add text comprehension teaching style 0.7.51

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/add-text-comprehension-style-0751.yml'
      - '.github/scripts/add_text_comprehension_style_0751.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply text comprehension teaching style patch
        run: python .github/scripts/add_text_comprehension_style_0751.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-ai-tutor-he/main.py he/workspace/lesson-completion.js he/workspace/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add text comprehension teaching style; bump to 0.7.51"
          git push origin main
