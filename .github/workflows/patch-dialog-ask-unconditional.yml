name: Patch dialog ask timing

on:
  push:
    paths:
      - '.github/workflows/patch-dialog-ask-unconditional.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('he/workspace/index.html')
          text = path.read_text(encoding='utf-8')

          old = '''if(
            window.SELECTED_UNIT_LESSON
          ){
            window.CURRENT_LESSON_FLOW_PHASE =
              "dialog";

            renderDynamicLessonFlow(
              "dialog",
              Number(
                window.CURRENT_LESSON_VISUAL_PART ||
                1
              ),
              Number(
                window.CURRENT_LESSON_PARTS_COUNT ||
                1
              )
            );
          }'''

          new = '''window.CURRENT_LESSON_FLOW_PHASE =
            "dialog";

          renderDynamicLessonFlow(
            "dialog",
            Number(
              window.CURRENT_LESSON_VISUAL_PART ||
              1
            ),
            Number(
              window.CURRENT_LESSON_PARTS_COUNT ||
              1
            )
          );'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 ASK block, found {count}')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit exact patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-dialog-ask-unconditional.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html .github/workflows/patch-dialog-ask-unconditional.yml
          git commit -m 'Switch lesson flow to dialog when ask starts'
          git push
