name: Run waiting panel 0.5.4 patch
on:
  push:
    paths:
      - '.github/workflows/run-patch-waiting-054.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_waiting_054.py
      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-ai-waiting-panel-054.yml
          rm -f .github/workflows/patch-ai-waiting-panel-054b.yml
          rm -f .github/workflows/run-patch-waiting-054.yml
          rm -f .github/scripts/patch_waiting_054.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/lesson-completion.js he/workspace/index.html .github/workflows/patch-ai-waiting-panel-054.yml .github/workflows/patch-ai-waiting-panel-054b.yml .github/workflows/run-patch-waiting-054.yml .github/scripts/patch_waiting_054.py
          git commit -m 'Enlarge AI waiting teacher and smooth waves; build 0.5.4'
          git push