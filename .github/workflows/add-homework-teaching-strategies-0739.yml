name: Add homework teaching strategies 0.7.39

on:
  push:
    paths:
      - '.github/scripts/add_homework_teaching_strategies_0739.py'
      - '.github/workflows/add-homework-teaching-strategies-0739.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch homework teaching strategies
        run: python .github/scripts/add_homework_teaching_strategies_0739.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-ai-tutor-he/main.py he/workspace/lesson-completion-core.js he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add homework teaching strategies; bump to 0.7.39"
          git push
