name: Fix homework sidebar direct route 0.7.64

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-homework-sidebar-direct-route-0764.py'
      - '.github/workflows/fix-homework-sidebar-direct-route-0764.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply homework direct sidebar route fix
        run: python .github/scripts/fix-homework-sidebar-direct-route-0764.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html he/workspace/lesson-completion.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix homework sidebar direct route; bump to 0.7.64"
          git push origin main
