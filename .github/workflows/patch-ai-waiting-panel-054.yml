name: Polish AI waiting panel 0.5.4
on:
  push:
    paths:
      - '.github/workflows/patch-ai-waiting-panel-054.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved waiting panel polish
        shell: bash
        run: |
          echo '   nLCAxKQppbmRleC53cml0ZV90ZXh0KGgsIGVuY29kaW5nPSJ1dGYtOCIpCg==' | base64 -d > /tmp/patch_waiting_054.py
          python /tmp/patch_waiting_054.py
      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-ai-waiting-panel-054.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/lesson-completion.js he/workspace/index.html .github/workflows/patch-ai-waiting-panel-054.yml
          git commit -m 'Enlarge AI waiting teacher and smooth waves; build 0.5.4'
          git push