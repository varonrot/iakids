name: Add global homework pedagogy 0.7.38

on:
  push:
    paths:
      - '.github/scripts/add_global_homework_pedagogy_0738.py'
      - '.github/workflows/add-global-homework-pedagogy-0738.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch global homework pedagogy
        run: python .github/scripts/add_global_homework_pedagogy_0738.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/lesson-completion-core.js he/workspace/lesson-completion.js he/workspace/index.html backend-ai-tutor-he/main.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add global homework pedagogy; bump to 0.7.38"
          git push
