name: Route progress to pro dashboard 0.7.62
on:
  push:
    paths:
      - '.github/workflows/route-progress-to-pro-dashboard-0762.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fix progress routing
        run: python .github/scripts/route-progress-to-pro-dashboard-0762.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Route progress button to pro dashboard; bump to 0.7.62'
            git push origin main
          fi
