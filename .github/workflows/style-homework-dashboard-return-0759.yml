name: Style homework dashboard return 0.7.59
on:
  push:
    paths:
      - '.github/workflows/style-homework-dashboard-return-0759.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply style patch
        run: python .github/scripts/style-homework-dashboard-return-0759.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Style homework dashboard return button; bump to 0.7.59'
            git push origin main
          fi
