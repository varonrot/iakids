name: Sidebar specificity fix v075
on:
  push:
    paths:
      - '.github/workflows/run-sidebar-specificity-v075.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch-sidebar-specificity-v075.py
      - name: Validate
        run: |
          grep -q 'LESSON SIDEBAR TOP CONTROLS — beat legacy specificity' he/workspace/index.html
          grep -q 'IAKIDS • build 0.7.5' he/workspace/index.html
      - name: Cleanup and commit
        run: |
          rm -f .github/scripts/patch-sidebar-specificity-v075.py .github/workflows/run-sidebar-specificity-v075.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix lesson sidebar width specificity build 0.7.5'
          git push
