name: Apply coin animation v0.8.0

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-coin-animation-v080.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/patch-coin-animation-v080.py
      - name: Commit patch and clean temporary files
        run: |
          rm .github/scripts/patch-coin-animation-v080.py
          rm .github/workflows/run-coin-animation-v080.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html .github/scripts/patch-coin-animation-v080.py .github/workflows/run-coin-animation-v080.yml
          git commit -m "Show +10 coin animation after lesson part (v0.8.0)"
          git push origin main
