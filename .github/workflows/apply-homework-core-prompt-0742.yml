name: Apply homework core prompt 0.7.42

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_homework_core_prompt_0742.py'
      - '.github/workflows/apply-homework-core-prompt-0742.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/apply_homework_core_prompt_0742.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-ai-tutor-he/main.py he/workspace/lesson-completion-core.js he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use tested general homework coach prompt; bump 0.7.42"
            git push origin main
          fi
