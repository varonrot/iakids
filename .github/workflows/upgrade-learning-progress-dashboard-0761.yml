name: Upgrade learning progress dashboard 0.7.61
on:
  push:
    paths:
      - '.github/workflows/upgrade-learning-progress-dashboard-0761.yml'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply dashboard upgrade
        run: python .github/scripts/upgrade-learning-progress-dashboard-0761.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Upgrade learning progress dashboard 0.7.61"
          git push origin main
