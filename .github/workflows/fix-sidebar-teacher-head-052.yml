name: Fix sidebar teacher head 0.5.2
on:
  push:
    paths:
      - '.github/workflows/fix-sidebar-teacher-head-052.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply teacher position fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('he/workspace/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</head>'
          css = '''\n<style id="iakids-sidebar-teacher-head-fix-052">\n.lesson-sidebar-teacher img{\n  position:relative !important;\n  top:24px !important;\n}\n</style>\n'''
          if 'iakids-sidebar-teacher-head-fix-052' not in s:
              if marker not in s:
                  raise SystemExit('head marker not found')
              s = s.replace(marker, css + marker, 1)
          s = s.replace('IAKIDS • build 0.5.1', 'IAKIDS • build 0.5.2')
          s = s.replace('window.IAKIDS_BUILD_VERSION = "0.5.1"', 'window.IAKIDS_BUILD_VERSION = "0.5.2"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/fix-sidebar-teacher-head-052.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html .github/workflows/fix-sidebar-teacher-head-052.yml
          git commit -m 'Lower sidebar teacher to prevent head clipping; build 0.5.2'
          git push