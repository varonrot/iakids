name: Upgrade personal system remove modal 0.7.60

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/upgrade-personal-system-remove-modal-0760.py'
      - '.github/workflows/upgrade-personal-system-remove-modal-0760.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply custom remove modal patch
        run: python .github/scripts/upgrade-personal-system-remove-modal-0760.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html he/workspace/lesson-completion.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Upgrade personal system remove modal; bump to 0.7.60"
          git push origin main
