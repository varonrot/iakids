name: Restore workspace achievements 0.7.39
on:
  push:
    paths:
      - '.github/workflows/restore-workspace-achievements-0739.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore achievements view safely
        run: python .github/scripts/restore-workspace-achievements-0739.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Restore workspace achievements safely; bump to 0.7.39'
            git push origin main
          fi
