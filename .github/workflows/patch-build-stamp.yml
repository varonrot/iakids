name: Patch build stamp

on:
  push:
    paths:
      - '.github/workflows/patch-build-stamp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply build stamp and clean title
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('he/workspace/index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the temporary deployment digit from the visible title only.
          s = s.replace('עולם הלמידה4', 'עולם הלמידה')

          # Add a small persistent build stamp before </body>.
          marker = '</body>'
          if 'id="iakidsBuildStamp"' not in s:
              if marker not in s:
                  raise SystemExit('Missing </body> marker')
              block = '''\n<div id="iakidsBuildStamp" style="position:fixed;left:8px;bottom:4px;z-index:99999;font:10px/1.2 Arial,sans-serif;color:rgba(255,255,255,.45);background:rgba(0,0,0,.28);padding:2px 5px;border-radius:5px;pointer-events:none;direction:ltr;">IAKIDS • build 0.4.0</div>\n<script>window.IAKIDS_BUILD_VERSION = "0.4.0";</script>\n'''
              s = s.replace(marker, block + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-build-stamp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html .github/workflows/patch-build-stamp.yml
          git commit -m 'Add visible build stamp and clean learning title'
          git push
