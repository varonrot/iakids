name: Patch loading title spacing 0.4.9
on:
  push:
    paths:
      - '.github/workflows/patch-loading-title-049.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix title positioning and bump build
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('he/workspace/index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'iakids-loading-title-spacing-v049'
          if marker in s:
              raise SystemExit('patch already present')
          css = '''\n<style id="iakids-loading-title-spacing-v049">\n.lesson-loading-title{position:absolute!important;top:58px!important;left:24px!important;right:24px!important;}\n.lesson-loading-status{margin-top:34px!important;}\n@media(max-width:1500px){.lesson-loading-title{top:46px!important;}}\n@media(max-width:760px){.lesson-loading-title{top:34px!important;}}\n</style>\n'''
          if '</head>' not in s:
              raise SystemExit('head marker missing')
          s = s.replace('</head>', css + '</head>', 1)
          s = s.replace('IAKIDS • build 0.4.8', 'IAKIDS • build 0.4.9')
          s = s.replace('window.IAKIDS_BUILD_VERSION = "0.4.7"', 'window.IAKIDS_BUILD_VERSION = "0.4.9"')
          s = s.replace('window.IAKIDS_BUILD_VERSION = "0.4.8"', 'window.IAKIDS_BUILD_VERSION = "0.4.9"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-loading-title-049.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html .github/workflows/patch-loading-title-049.yml
          git commit -m 'Fix loading title spacing; build 0.4.9'
          git push
