name: Apply part coin reward v0.7.9

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-part-coins-v079.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/patch-part-coins-v079.py
      - name: Commit patch and remove temporary files
        run: |
          rm .github/scripts/patch-part-coins-v079.py
          rm .github/workflows/run-part-coins-v079.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html .github/scripts/patch-part-coins-v079.py .github/workflows/run-part-coins-v079.yml
          git commit -m "Award 10 coins after each completed lesson part (v0.7.9)"
          git push origin main
