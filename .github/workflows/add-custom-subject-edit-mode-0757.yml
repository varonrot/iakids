name: Add custom subject edit mode 0.7.57
on:
  push:
    paths:
      - '.github/workflows/add-custom-subject-edit-mode-0757.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add edit mode
        run: python .github/scripts/add-custom-subject-edit-mode-0757.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html he/add-subject/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Add edit flow for approved personal curriculums; bump to 0.7.57'
            git push origin main
          fi
