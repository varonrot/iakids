name: Apply idempotent part coins v0.8.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-idempotent-part-coins-v081.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/patch-idempotent-part-coins-v081.py
      - name: Commit patch and clean temporary files
        run: |
          rm .github/scripts/patch-idempotent-part-coins-v081.py
          rm .github/workflows/run-idempotent-part-coins-v081.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html .github/scripts/patch-idempotent-part-coins-v081.py .github/workflows/run-idempotent-part-coins-v081.yml
          git commit -m "Prevent duplicate part coin rewards (v0.8.1)"
          git push origin main
