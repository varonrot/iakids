name: Add optimized progress icon
on:
  push:
    paths:
      - '.github/workflows/add-progress-icon.yml'
jobs:
  add-icon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch prepared binary commit
        run: git fetch origin 38a1e23de113edbe4f89de0d84358d7b6df002b4
      - name: Restore optimized icon
        run: git checkout 38a1e23de113edbe4f89de0d84358d7b6df002b4 -- he/assets/lesson/my-progress.webp
      - name: Validate icon
        run: |
          test -f he/assets/lesson/my-progress.webp
          test $(stat -c%s he/assets/lesson/my-progress.webp) -lt 70000
      - name: Commit icon and cleanup
        run: |
          rm -f .github/scripts/add-progress-icon.py
          rm -f .github/workflows/add-progress-icon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add optimized student progress icon'
          git push
