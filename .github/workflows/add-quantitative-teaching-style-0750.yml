name: Add quantitative teaching style 0.7.50

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-quantitative-teaching-style-0750.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply quantitative teaching style patch
        run: python .github/scripts/add_quantitative_teaching_style_0750.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-ai-tutor-he/main.py he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add quantitative homework teaching style; bump to 0.7.50"
          git push origin main
