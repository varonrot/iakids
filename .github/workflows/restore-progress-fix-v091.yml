name: Restore lesson progress fix v0.9.1
on:
  push:
    paths:
      - '.github/workflows/restore-progress-fix-v091.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply restored progress fix
        run: python .github/scripts/restore-progress-fix-v091.py
      - name: Commit and clean
        run: |
          rm .github/scripts/restore-progress-fix-v091.py
          rm .github/workflows/restore-progress-fix-v091.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore correct current lesson progress tracking"
          git push origin main
