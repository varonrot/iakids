name: Patch progress image button v066
on:
  push:
    paths:
      - '.github/workflows/run-progress-icon-v066.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_progress_icon_v066.py
      - name: Validate
        run: |
          grep -q 'lesson-progress-button-image' he/workspace/index.html
          grep -q '/assets/lesson/my-progress.webp' he/workspace/index.html
          grep -q 'IAKIDS • build 0.6.6' he/workspace/index.html
      - name: Commit patch
        run: |
          rm -f .github/scripts/patch_progress_icon_v066.py .github/workflows/run-progress-icon-v066.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use progress image in sidebar button; build 0.6.6'
          git push