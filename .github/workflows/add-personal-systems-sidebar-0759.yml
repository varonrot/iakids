name: Add personal systems sidebar 0.7.59

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add-personal-systems-sidebar-0759.py'
      - '.github/workflows/add-personal-systems-sidebar-0759.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply personal systems sidebar patch
        run: python .github/scripts/add-personal-systems-sidebar-0759.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html he/workspace/lesson-completion.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add personal systems sidebar; bump to 0.7.59"
          git push origin main
