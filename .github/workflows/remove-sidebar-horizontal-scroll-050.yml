name: Remove sidebar horizontal scrollbar 0.5.0
on:
  push:
    paths:
      - '.github/workflows/remove-sidebar-horizontal-scroll-050.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove horizontal scrollbar and bump build
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('he/workspace/index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'iakids-sidebar-horizontal-scrollfix-v050'
          if marker in s:
              raise SystemExit('patch already present')
          css = '''\
<style id="iakids-sidebar-horizontal-scrollfix-v050">\
body.lesson-theme-science .lesson-sidebar-list{overflow-x:hidden!important;}\
body.lesson-theme-science .lesson-sidebar-list::-webkit-scrollbar:horizontal{height:0!important;display:none!important;}\
</style>\
'''
          if '</head>' not in s:
              raise SystemExit('head marker missing')
          s = s.replace('</head>', css + '</head>', 1)
          s = s.replace('IAKIDS • build 0.4.9', 'IAKIDS • build 0.5.0')
          s = s.replace('window.IAKIDS_BUILD_VERSION = "0.4.9"', 'window.IAKIDS_BUILD_VERSION = "0.5.0"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/remove-sidebar-horizontal-scroll-050.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html .github/workflows/remove-sidebar-horizontal-scroll-050.yml
          git commit -m 'Remove lesson sidebar horizontal scrollbar; build 0.5.0'
          git push