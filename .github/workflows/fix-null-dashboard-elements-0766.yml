name: Fix null dashboard elements 0.7.66

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-null-dashboard-elements-0766.py'
      - '.github/workflows/fix-null-dashboard-elements-0766.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply null dashboard element fix
        run: python .github/scripts/fix-null-dashboard-elements-0766.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html he/workspace/lesson-completion.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix null dashboard elements; bump to 0.7.66"
          git push origin main
