name: Patch progress card v070
on:
  push:
    paths:
      - '.github/workflows/run-progress-card-v070.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch-progress-card-v070.py
      - name: Validate
        run: |
          grep -q 'lesson-progress-card-style' he/workspace/index.html
          grep -q 'assets/science/categories/ecology.webp' he/workspace/index.html
          grep -q 'IAKIDS • build 0.7.0' he/workspace/index.html
      - name: Cleanup and commit
        run: |
          rm -f .github/scripts/patch-progress-card-v070.py .github/workflows/run-progress-card-v070.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html .github/scripts/patch-progress-card-v070.py .github/workflows/run-progress-card-v070.yml
          git commit -m 'Style progress button like lesson card v0.7.0'
          git push
