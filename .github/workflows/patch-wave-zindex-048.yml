name: Patch loading wave z-index 0.4.8
on:
  push:
    paths:
      - '.github/workflows/patch-wave-zindex-048.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix loading wave layering and bump build
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('he/workspace/index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'iakids-loading-waves-layerfix-v048'
          if marker in s:
              raise SystemExit('patch already present')
          css = '''\n<style id="iakids-loading-waves-layerfix-v048">\n.lesson-loading-card{position:relative!important;isolation:isolate!important;}\n.lesson-loading-card::before,.lesson-loading-card::after{z-index:0!important;}\n.lesson-loading-card > *{position:relative;z-index:2;}\n.lesson-loading-title,.lesson-loading-status,.lesson-loading-progress{z-index:3!important;}\n.lesson-loading-robot{z-index:4!important;}\n</style>\n'''
          if '</head>' not in s:
              raise SystemExit('head marker missing')
          s = s.replace('</head>', css + '</head>', 1)
          s = s.replace('IAKIDS • build 0.4.7', 'IAKIDS • build 0.4.8')
          s = s.replace('IAKIDS • build 0.4.6', 'IAKIDS • build 0.4.8')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-wave-zindex-048.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html .github/workflows/patch-wave-zindex-048.yml
          git commit -m 'Fix loading wave layering; build 0.4.8'
          git push