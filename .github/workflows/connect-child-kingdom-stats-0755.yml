name: Connect child kingdom stats 0.7.55
on:
  push:
    paths:
      - '.github/workflows/connect-child-kingdom-stats-0755.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply child kingdom stats
        run: python .github/scripts/connect-child-kingdom-stats-0755.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Connect kingdom status cards to child data; bump to 0.7.55'
            git push origin main
          fi
