name: Fix reset unit lesson progress

on:
  push:
    paths:
      - '.github/scripts/fix_reset_unit_progress_080.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch reset endpoint
        run: python .github/scripts/fix_reset_unit_progress_080.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-ai-tutor-he/main.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Reset unit lesson progress on restart"
          git push
