name: Apply progress panel refresh v0.8.8
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-progress-panel-refresh-v088.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/patch-progress-panel-refresh-v088.py
      - name: Commit and clean
        run: |
          rm .github/scripts/patch-progress-panel-refresh-v088.py
          rm .github/workflows/run-progress-panel-refresh-v088.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh student progress panel from DB (v0.8.8)"
          git push origin main
