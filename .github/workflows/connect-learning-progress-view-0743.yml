name: Connect learning progress view 0.7.43
on:
  push:
    paths:
      - '.github/workflows/connect-learning-progress-view-0743.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply learning progress view patch
        run: python .github/scripts/connect-learning-progress-view-0743.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Connect learning progress view; bump to 0.7.43'
            git push origin main
          fi
