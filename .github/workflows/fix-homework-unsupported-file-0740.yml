name: Fix unsupported homework file UX 0.7.40

on:
  push:
    paths:
      - '.github/scripts/fix-homework-unsupported-file-0740.py'
      - '.github/workflows/fix-homework-unsupported-file-0740.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix-homework-unsupported-file-0740.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Handle unsupported homework files; bump to 0.7.40"
          git push origin main
