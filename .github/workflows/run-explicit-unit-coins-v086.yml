name: Apply explicit unit lesson coins v0.8.6
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-explicit-unit-coins-v086.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/patch-explicit-unit-coins-v086.py
      - name: Commit and clean
        run: |
          rm .github/scripts/patch-explicit-unit-coins-v086.py
          rm .github/workflows/run-explicit-unit-coins-v086.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pass explicit unit lesson to coin reward (v0.8.6)"
          git push origin main
