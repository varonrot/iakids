name: Add conceptual science teaching style 0.7.52

on:
  push:
    paths:
      - '.github/workflows/add-conceptual-science-teaching-style-0752.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply conceptual science teaching style patch
        run: python .github/scripts/add_conceptual_science_teaching_style_0752.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-ai-tutor-he/main.py he/workspace/lesson-completion.js he/workspace/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add conceptual science teaching style; bump to 0.7.52"
          git push origin main
