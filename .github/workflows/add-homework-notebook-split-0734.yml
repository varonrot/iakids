name: Add homework notebook split 0.7.34

on:
  push:
    paths:
      - '.github/scripts/add_homework_notebook_split_0734.py'
      - '.github/workflows/add-homework-notebook-split-0734.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch homework workspace
        run: python .github/scripts/add_homework_notebook_split_0734.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/lesson-completion-core.js he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add split homework notebook workspace; bump to 0.7.34"
          git push

# trigger 0.7.34
