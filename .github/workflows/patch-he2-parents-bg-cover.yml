name: Patch HE2 parents background cover

on:
  push:
    paths:
      - '.github/workflows/patch-he2-parents-bg-cover.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stretch parents background full width
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('he2/index.html')
          s = p.read_text(encoding='utf-8')
          old = "background-image:url('/assets/he2/sections/parents-section-bg.webp?v=3');background-repeat:no-repeat;background-position:center center;background-size:contain;"
          new = "background-image:url('/assets/he2/sections/parents-section-bg.webp?v=4');background-repeat:no-repeat;background-position:center center;background-size:cover;"
          if old in s:
              s = s.replace(old, new, 1)
          else:
              # fallback for earlier versions
              s = s.replace("background:#041120 url('/assets/he2/sections/parents-section-bg.webp?v=2') center right/cover no-repeat;", "background-color:#041120;background-image:url('/assets/he2/sections/parents-section-bg.webp?v=4');background-repeat:no-repeat;background-position:center center;background-size:cover;", 1)
          s = s.replace("background-position:center center;background-size:contain", "background-position:center center;background-size:cover")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he2/index.html
          git diff --cached --quiet || git commit -m "Stretch HE2 parents background full width"
          git push
