name: Apply streak header v0.8.5
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-streak-header-v085.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/patch-streak-header-v085.py
      - name: Commit and clean
        run: |
          rm .github/scripts/patch-streak-header-v085.py
          rm .github/workflows/run-streak-header-v085.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align daily streak count with title (v0.8.5)"
          git push origin main
