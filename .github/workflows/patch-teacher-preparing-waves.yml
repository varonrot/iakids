name: Patch teacher preparing waves

on:
  push:
    paths:
      - '.github/workflows/patch-teacher-preparing-waves.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strengthen visible loading waves
        shell: bash
        run: |
          echo ' aW1wb3J0YW50O2JhY2tncm91bmQtc2l6ZToxOCUgMTAwJSFpbXBvcnRhbnQ7fQoubGVzc29uLWxvYWRpbmctY2FyZDo6YmVmb3Jle2NvbG9yOnJnYmEoMzQsMTk3LDI1NSwuNzgpIWltcG9ydGFudDt9Ci5sZXNzb24tbG9hZGluZy1jYXJkOjphZnRlcntjb2xvcjpyZ2JhKDE1NCw2NywyNTUsLjgyKSFpbXBvcnRhbnQ7fQou ' | base64 -d > /tmp/patch.py
          sed -i 's/! important/!important/g; s/\. lesson/\.lesson/g' /tmp/patch.py
          python /tmp/patch.py

      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-teacher-preparing-waves.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html .github/workflows/patch-teacher-preparing-waves.yml
          git commit -m 'Strengthen visible AI teacher loading waves'
          git push