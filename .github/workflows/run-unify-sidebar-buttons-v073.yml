name: Unify lesson sidebar controls v073
on:
  push:
    paths:
      - '.github/workflows/run-unify-sidebar-buttons-v073.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch-unify-sidebar-buttons-v073.py
      - name: Validate
        run: |
          grep -q 'LESSON SIDEBAR TOP CONTROLS — unified final sizing' he/workspace/index.html
          grep -q 'IAKIDS • build 0.7.3' he/workspace/index.html
      - name: Cleanup and commit
        run: |
          rm -f .github/scripts/patch-unify-sidebar-buttons-v073.py .github/workflows/run-unify-sidebar-buttons-v073.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html .github/scripts/patch-unify-sidebar-buttons-v073.py .github/workflows/run-unify-sidebar-buttons-v073.yml
          git commit -m 'Unify lesson sidebar controls build 0.7.3'
          git push
