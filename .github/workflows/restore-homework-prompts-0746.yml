name: Restore homework prompts 0.7.46
on:
  push:
    paths:
      - '.github/workflows/restore-homework-prompts-0746.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore prompts and routing
        run: python .github/scripts/restore-homework-prompts-0746.py
      - name: Commit restored homework prompts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend-ai-tutor-he/main.py he/workspace/lesson-completion-core.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Restore 4 teaching styles and 5 homework modes; bump to 0.7.46'
            git push origin main
          fi
