name: Apply nonblocking transition music v0.8.9
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-nonblocking-bg-music-v089.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/patch-nonblocking-bg-music-v089.py
      - name: Commit and clean
        run: |
          rm .github/scripts/patch-nonblocking-bg-music-v089.py
          rm .github/workflows/run-nonblocking-bg-music-v089.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Do not block part transition on background music (v0.8.9)"
          git push origin main
