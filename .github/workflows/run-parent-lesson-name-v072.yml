name: Apply parent lesson name v0.7.2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-parent-lesson-name-v072.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/patch-parent-lesson-name-v072.py
      - name: Commit and clean
        run: |
          rm .github/scripts/patch-parent-lesson-name-v072.py
          rm .github/workflows/run-parent-lesson-name-v072.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show real lesson names in parent activity (v0.7.2)"
          git push origin main
