name: Patch HE2 seamless section join

on:
  push:
    paths:
      - '.github/workflows/patch-he2-seamless-section-join.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove seam between learning flow and parents section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('he2/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* ===== SEAMLESS FLOW TO PARENTS ===== */'
          css = r'''
/* ===== SEAMLESS FLOW TO PARENTS ===== */
.learning-flow{
  padding-bottom:24px!important;
  margin-bottom:0!important;
  background:linear-gradient(180deg,#041120 0%,#06172b 58%,#071a31 100%)!important;
}
.flow-bottom{margin-bottom:0!important}
.parents-showcase-v2{
  margin-top:0!important;
  border-top:0!important;
  box-shadow:none!important;
  background-color:#071a31!important;
  background-image:url('/assets/he2/sections/parents-section-bg.webp?v=5')!important;
  background-repeat:no-repeat!important;
  background-position:center center!important;
  background-size:cover!important;
}
.parents-showcase-v2::before{
  background:
    linear-gradient(180deg,
      #071a31 0%,
      rgba(7,26,49,1) 7%,
      rgba(7,26,49,.96) 14%,
      rgba(7,26,49,.78) 22%,
      rgba(7,26,49,.48) 32%,
      rgba(7,26,49,.18) 44%,
      rgba(7,26,49,0) 56%),
    linear-gradient(90deg,
      rgba(4,17,32,.99) 0%,
      rgba(4,17,32,.96) 24%,
      rgba(4,17,32,.82) 40%,
      rgba(4,17,32,.40) 57%,
      rgba(4,17,32,.12) 72%,
      rgba(4,17,32,.02) 100%)!important;
}
.parents-showcase-v2::after{
  background:linear-gradient(180deg,transparent 0%,transparent 78%,rgba(4,17,32,.26) 100%)!important;
}
@media(max-width:760px){
  .learning-flow{padding-bottom:18px!important}
  .parents-showcase-v2{margin-top:0!important}
  .parents-showcase-v2::before{
    background:
      linear-gradient(180deg,#071a31 0%,rgba(7,26,49,.98) 10%,rgba(7,26,49,.82) 22%,rgba(7,26,49,.45) 36%,rgba(7,26,49,.10) 50%,rgba(7,26,49,0) 62%),
      linear-gradient(180deg,rgba(4,17,32,.90),rgba(4,17,32,.24) 76%,rgba(4,17,32,.06))!important;
  }
}
'''
          if marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          else:
              start = s.index(marker)
              end = s.index('</style>', start)
              s = s[:start] + css + '\n' + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he2/index.html
          git diff --cached --quiet || git commit -m "Blend HE2 learning and parents sections seamlessly"
          git push
