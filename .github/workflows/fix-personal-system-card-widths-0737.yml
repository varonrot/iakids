name: Fix personal system card widths 0.7.37
on:
  push:
    paths:
      - '.github/workflows/fix-personal-system-card-widths-0737.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply personal system card width patch
        run: python .github/scripts/fix-personal-system-card-widths-0737.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Fix personal system card widths; bump to 0.7.37'
            git push origin main
          fi
