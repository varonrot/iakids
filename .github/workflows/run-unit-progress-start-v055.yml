name: Unit lesson progress start 0.5.5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-unit-progress-start-v055.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-unit-progress-start-v055.py
      - name: Validate Python
        run: python -m py_compile backend-ai-tutor-he/main.py
      - name: Commit patch
        run: |
          rm -f .github/scripts/patch-unit-progress-start-v055.py
          rm -f .github/workflows/run-unit-progress-start-v055.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend-ai-tutor-he/main.py he/workspace/index.html .github/scripts/patch-unit-progress-start-v055.py .github/workflows/run-unit-progress-start-v055.yml
          git commit -m 'Track unit lesson start and partial state; build 0.5.5'
          git push
