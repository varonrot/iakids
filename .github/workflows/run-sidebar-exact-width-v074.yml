name: Sidebar exact equal width v074
on:
  push:
    paths:
      - '.github/workflows/run-sidebar-exact-width-v074.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch-sidebar-exact-width-v074.py
      - name: Validate
        run: |
          grep -q 'LESSON SIDEBAR TOP CONTROLS — exact equal width' he/workspace/index.html
          grep -q 'IAKIDS • build 0.7.4' he/workspace/index.html
      - name: Cleanup and commit
        run: |
          rm -f .github/scripts/patch-sidebar-exact-width-v074.py .github/workflows/run-sidebar-exact-width-v074.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make lesson sidebar controls exactly equal width build 0.7.4'
          git push
