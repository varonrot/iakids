name: Patch current part gauge

on:
  push:
    paths:
      - '.github/workflows/patch-current-part-gauge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch script
        run: python .github/scripts/patch_current_part_gauge.py

      - name: Commit focused current-part gauge change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/patch-current-part-gauge.yml
          rm .github/scripts/patch_current_part_gauge.py
          git add he/workspace/index.html .github/workflows/patch-current-part-gauge.yml .github/scripts/patch_current_part_gauge.py
          git commit -m "Replace fixed lesson parts card with dynamic current part gauge"
          git push
