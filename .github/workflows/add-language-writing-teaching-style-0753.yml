name: Add language writing teaching style 0.7.53

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-language-writing-teaching-style-0753.yml'
      - '.github/scripts/add-language-writing-teaching-style-0753.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply language writing teaching style patch
        run: python .github/scripts/add-language-writing-teaching-style-0753.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend-ai-tutor-he/main.py he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add language writing teaching style; bump to 0.7.53"
            git push origin main
          fi
