name: Gender-aware homework auto-start 0.7.89

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/homework-auto-start-gender-0789.py'
      - '.github/workflows/homework-auto-start-gender-0789.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Make auto-start intro gender-aware
        run: python .github/scripts/homework-auto-start-gender-0789.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/lesson-completion-core.js he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make homework auto-start gender-aware; bump to 0.7.89"
          git push origin main
