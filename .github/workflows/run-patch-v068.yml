name: Patch lesson back button v068
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-patch-v068.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch
        run: python .github/scripts/patch-v068.py
      - name: Validate
        run: |
          grep -q 'lesson-sidebar-back-to-workspace' he/workspace/index.html
          grep -q 'IAKIDS • build 0.6.8' he/workspace/index.html
      - name: Commit
        run: |
          rm -f .github/scripts/patch-v068.py .github/workflows/run-patch-v068.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add lesson back to workspace button build 0.6.8'
          git push origin main
