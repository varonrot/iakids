name: Apply explicit part coins v0.8.2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-part-coins-v082.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/patch-part-coins-v082.py
      - name: Commit patch and clean temporary files
        run: |
          rm .github/scripts/patch-part-coins-v082.py
          rm .github/workflows/run-part-coins-v082.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html .github/scripts/patch-part-coins-v082.py .github/workflows/run-part-coins-v082.yml
          git commit -m "Pass explicit lesson part to coin reward (v0.8.2)"
          git push origin main
