name: Stretch homework notebook 0.7.73

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/stretch-homework-notebook-0773.py'
      - '.github/workflows/stretch-homework-notebook-0773.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Stretch notebook
        run: python .github/scripts/stretch-homework-notebook-0773.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Stretch homework notebook to full height; bump to 0.7.73"
          git push origin main
