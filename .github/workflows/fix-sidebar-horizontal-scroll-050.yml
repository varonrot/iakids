name: Fix sidebar horizontal scrollbar 0.5.0
on:
  push:
    paths:
      - '.github/workflows/fix-sidebar-horizontal-scroll-050.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/fix-sidebar-horizontal-scroll-050.yml
          rm -f .github/workflows/remove-sidebar-horizontal-scroll-050.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html .github/workflows/fix-sidebar-horizontal-scroll-050.yml .github/workflows/remove-sidebar-horizontal-scroll-050.yml
          git commit -m 'Remove lesson sidebar horizontal scrollbar; build 0.5.0'
          git push