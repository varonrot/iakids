name: Add personal subject delete 0.7.53
on:
  push:
    paths:
      - '.github/workflows/add-personal-subject-delete-0753.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add personal subject delete
        run: python .github/scripts/add-personal-subject-delete-0753.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Add remove action to personal subjects; bump to 0.7.53'
            git push origin main
          fi
