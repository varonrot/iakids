name: Disable visual reuse 0.7.119

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/disable-visual-reuse-07119.py'
      - '.github/workflows/disable-visual-reuse-07119.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/disable-visual-reuse-07119.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend-ai-tutor-he/main.py he/workspace/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Disable visual reuse; bump to 0.7.119'
            git push origin main
          fi
