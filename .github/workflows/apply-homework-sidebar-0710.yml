name: Apply homework sidebar 0.7.10

on:
  push:
    paths:
      - '.github/scripts/add_homework_sidebar_0710.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch workspace sidebar
        run: python .github/scripts/add_homework_sidebar_0710.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add homework help sidebar and bump build to 0.7.10"
          git push
