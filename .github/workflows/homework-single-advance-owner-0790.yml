name: Homework single advance owner 0.7.90

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/homework-single-advance-owner-0790.py'
      - '.github/workflows/homework-single-advance-owner-0790.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Lock homework progression to production coach
        run: python .github/scripts/homework-single-advance-owner-0790.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/lesson-completion-core.js he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Lock homework progression to Sol coach; bump to 0.7.90"
          git push origin main
