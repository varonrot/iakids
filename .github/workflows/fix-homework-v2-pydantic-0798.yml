name: Fix Homework V2 request model 0.7.98

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-homework-v2-pydantic-0798.py'
      - '.github/workflows/fix-homework-v2-pydantic-0798.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix V2 request model
        run: python .github/scripts/fix-homework-v2-pydantic-0798.py
      - name: Compile backend
        run: python -m py_compile backend-ai-tutor-he/main.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend-ai-tutor-he/main.py he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Fix Homework V2 image request; bump to 0.7.98'
            git push origin main
          fi
