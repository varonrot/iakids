name: AI teacher waiting panel 0.5.1 final
on:
  push:
    paths:
      - '.github/workflows/patch-ai-waiting-panel-051-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          cat > /tmp/patch.b64 <<'EOF'
 מורה AI ✦
EOF
          base64 -d /tmp/patch.b64 > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-ai-waiting-panel-051-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html he/workspace/lesson-completion.js .github/workflows/patch-ai-waiting-panel-051-final.yml
          git commit -m 'Show AI teacher waiting panel after lesson; build 0.5.1'
          git push