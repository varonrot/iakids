name: Fix My Lessons overlay 0.7.47

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_my_lessons_overlay_0747.py'
      - '.github/workflows/fix-my-lessons-overlay-0747.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/fix_my_lessons_overlay_0747.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix My Lessons overlay position; bump to 0.7.47"
            git push origin main
          fi
