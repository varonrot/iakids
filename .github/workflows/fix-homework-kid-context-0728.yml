name: Fix homework kid context 0.7.28

on:
  push:
    paths:
      - '.github/scripts/fix_homework_kid_context_0728.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch structured homework kid context
        run: python .github/scripts/fix_homework_kid_context_0728.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html he/workspace/lesson-completion.js he/workspace/lesson-completion-core.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix structured homework kid context; bump to 0.7.28"
          git push
