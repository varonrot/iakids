name: Patch futuristic lesson loading panel 0.4.6

on:
  push:
    paths:
      - '.github/workflows/patch-loading-panel-046.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply futuristic loading panel
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-loading-panel-046.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html .github/workflows/patch-loading-panel-046.yml
          git commit -m 'Style futuristic lesson loading panel; build 0.4.6'
          git push
