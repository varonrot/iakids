name: Reset current part score before animation 0.5.3
on:
  push:
    paths:
      - '.github/workflows/reset-current-part-score-before-animation-053.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply surgical score animation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('he/workspace/index.html')
          s = p.read_text(encoding='utf-8')

          old = '''console.log("CALLING animateLessonScore");
  await animateLessonScore(
    finalScore,
    {
      duration:1450,
      sound:true
    }
  );'''

          new = '''console.log("CALLING animateLessonScore");

  /*
    Each Coach answer is presented as a fresh result in the
    current-part gauge. Reset only the displayed current-part
    score before animating to the new score.
  */
  renderLessonScore(0);
  currentDisplayedLessonScore = 0;

  await animateLessonScore(
    finalScore,
    {
      duration:1450,
      sound:true
    }
  );'''

          if old not in s:
              raise SystemExit('score animation anchor not found')
          s = s.replace(old, new, 1)

          if 'IAKIDS • build 0.5.2' in s:
              s = s.replace('IAKIDS • build 0.5.2', 'IAKIDS • build 0.5.3', 1)
          elif 'build 0.5.2' in s:
              s = s.replace('build 0.5.2', 'build 0.5.3', 1)
          else:
              raise SystemExit('build 0.5.2 marker not found')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/reset-current-part-score-before-animation-053.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html .github/workflows/reset-current-part-score-before-animation-053.yml
          git commit -m 'Reset current-part score before answer animation; build 0.5.3'
          git push