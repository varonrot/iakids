name: Patch lesson completion screen

on:
  push:
    paths:
      - '.github/workflows/patch-lesson-completion-screen.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire completion screen into lesson flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('he/workspace/index.html')
          text = path.read_text(encoding='utf-8')

          css_tag = '<link rel="stylesheet" href="/he/workspace/lesson-completion.css">'
          if css_tag not in text:
              if '</head>' not in text:
                  raise SystemExit('Missing </head>')
              text = text.replace('</head>', css_tag + '\n</head>', 1)

          js_tag = '<script src="/he/workspace/lesson-completion.js"></script>'
          build_marker = '<div id="iakidsBuildStamp"'
          if js_tag not in text:
              if build_marker not in text:
                  raise SystemExit('Missing build stamp marker')
              text = text.replace(build_marker, js_tag + '\n' + build_marker, 1)

          old = '''  const videoPlayed =
    await playLessonTransitionVideo(
      transition || {}
    );'''

          new = '''  const videoPlayed =
    isLastPart
      ? await showLessonCompletionScreen()
      : await playLessonTransitionVideo(
          transition || {}
        );'''

          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 transition playback blocks, found {count}')

          text = text.replace(old, new)

          if text.count('0.4.1') < 2:
              raise SystemExit('Expected build 0.4.1 stamp and variable')

          text = text.replace('0.4.1', '0.4.2')

          path.write_text(text, encoding='utf-8')
          print('Completion screen wired; build 0.4.2')
          PY

      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-lesson-completion-screen.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html .github/workflows/patch-lesson-completion-screen.yml
          git commit -m 'Wire in-stage lesson completion dashboard; build 0.4.2'
          git push
