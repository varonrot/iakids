name: Add explain-topic help mode 0.7.55

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add-explain-topic-help-mode-0755.py'
      - '.github/workflows/add-explain-topic-help-mode-0755.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply explain-topic help mode patch
        run: python .github/scripts/add-explain-topic-help-mode-0755.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend-ai-tutor-he/main.py he/workspace/lesson-completion-core.js he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add explain-topic help mode; bump to 0.7.55'
            git push
          fi
