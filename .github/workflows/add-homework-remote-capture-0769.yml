name: Add homework remote capture 0.7.69

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add-homework-remote-capture-0769.py'
      - '.github/workflows/add-homework-remote-capture-0769.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply remote homework capture patch
        run: python .github/scripts/add-homework-remote-capture-0769.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add desktop QR homework capture; bump to 0.7.69"
          git push origin main
