name: Fix homework approach strategy 0.7.33

on:
  push:
    paths:
      - '.github/scripts/fix_homework_approach_strategy_0733.py'
      - '.github/triggers/fix-homework-approach-strategy-0733.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply homework approach strategy
        run: python .github/scripts/fix_homework_approach_strategy_0733.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html he/workspace/lesson-completion.js he/workspace/lesson-completion-core.js backend-ai-tutor-he/main.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Teach homework approach strategy; bump to 0.7.33"
          git push
