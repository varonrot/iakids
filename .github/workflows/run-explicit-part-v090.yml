name: Apply explicit lesson part v0.9.0
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-explicit-part-v090.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch-explicit-part-v090.py
      - name: Validate
        run: |
          grep -q 'part_number:' he/workspace/index.html
          grep -q 'body.part_number' backend-ai-tutor-he/main.py
          grep -q 'IAKIDS • build 0.9.0' he/workspace/index.html
      - name: Commit patch and self-clean
        run: |
          rm .github/scripts/patch-explicit-part-v090.py
          rm .github/workflows/run-explicit-part-v090.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix lesson coach part synchronization v0.9.0'
          git push
