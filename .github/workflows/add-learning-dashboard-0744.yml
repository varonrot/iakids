name: Add learning dashboard 0.7.44
on:
  push:
    paths:
      - '.github/workflows/add-learning-dashboard-0744.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply dashboard patch
        run: python .github/scripts/add-learning-dashboard-0744.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Add real learning dashboard; bump to 0.7.44'
            git push origin main
          fi
