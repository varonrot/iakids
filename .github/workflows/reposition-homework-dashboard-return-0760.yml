name: Reposition homework dashboard return 0.7.60
on:
  push:
    paths:
      - '.github/workflows/reposition-homework-dashboard-return-0760.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Reposition homework dashboard return
        run: python .github/scripts/reposition-homework-dashboard-return-0760.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/lesson-completion.js he/workspace/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Move homework dashboard return into sidebar; bump to 0.7.60'
            git push origin main
          fi
