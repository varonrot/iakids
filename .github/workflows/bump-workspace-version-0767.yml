name: Bump workspace version 0.7.67

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/bump-workspace-version-0767.py'
      - '.github/workflows/bump-workspace-version-0767.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply workspace version bump
        run: python .github/scripts/bump-workspace-version-0767.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html he/workspace/tasks-internal.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Bump workspace to 0.7.67"
          git push origin main
