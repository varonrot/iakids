name: Run AI waiting panel patch 0.5.1
on:
  push:
    paths:
      - '.github/workflows/run-ai-waiting-panel-051.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch script
        run: python .github/scripts/patch_ai_waiting_051.py
      - name: Commit patch
        run: |
          rm -f .github/workflows/run-ai-waiting-panel-051.yml
          rm -f .github/scripts/patch_ai_waiting_051.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html he/workspace/lesson-completion.js .github/workflows/run-ai-waiting-panel-051.yml .github/scripts/patch_ai_waiting_051.py
          git commit -m 'Show AI teacher waiting panel after lesson; build 0.5.1'
          git push