name: Patch HE2 flow section

on:
  push:
    paths:
      - '.github/workflows/patch-he2-flow-section.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add premium flow section
        env:
          CSS64: " "
          HTML64: ""
        run: |
          python3 -c "import os,base64; from pathlib import Path; p=Path('he2/index.html'); s=p.read_text(encoding='utf-8'); css=base64.b64decode(os.environ['CSS64']).decode(); html=base64.b64decode(os.environ['HTML64']).decode(); s=s if '/* ===== PREMIUM LEARNING FLOW ===== */' in s else s.replace('</style>',css+'\n</style>'); s=s if '<!-- PREMIUM LEARNING FLOW -->' in s else s.replace('</main>',html+'\n</main>'); p.write_text(s,encoding='utf-8')"
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he2/index.html
          git diff --cached --quiet || git commit -m "Add HE2 premium learning flow section"
          git push
