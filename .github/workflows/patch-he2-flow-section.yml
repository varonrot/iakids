name: Patch HE2 flow section

on:
  push:
    paths:
      - '.github/workflows/patch-he2-flow-section.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add premium flow section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('he2/index.html')
          s = p.read_text(encoding='utf-8')
          css_marker = '/* ===== PREMIUM LEARNING FLOW ===== */'
          html_marker = '<!-- PREMIUM LEARNING FLOW -->'
          css = r'''
/* ===== PREMIUM LEARNING FLOW ===== */
.learning-flow{position:relative;padding:104px 24px 112px;overflow:hidden;background:radial-gradient(circle at 50% -8%,rgba(70,103,255,.16),transparent 34%),linear-gradient(180deg,#041120 0%,#06172b 58%,#071a31 100%)}
.learning-flow::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.62),transparent 94%);pointer-events:none}
.learning-flow::after{content:"";position:absolute;inset:auto -8% -180px -8%;height:360px;background:radial-gradient(ellipse at center,rgba(28,111,255,.20),transparent 68%);pointer-events:none}
.flow-inner{position:relative;z-index:2;max-width:1480px;margin:0 auto}.flow-kicker{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid rgba(96,184,255,.28);border-radius:999px;background:rgba(8,28,50,.62);color:#a8dcff;font-size:12px;font-weight:900;margin:0 auto 16px;position:relative;left:50%;transform:translateX(-50%)}
.learning-flow h2{text-align:center;font-size:clamp(38px,3.7vw,62px);line-height:1.04;letter-spacing:-1.9px;margin-bottom:14px}.learning-flow h2 span{color:#63ccff}.flow-lead{max-width:820px;margin:0 auto 44px;text-align:center;color:#9fb6cb;font-size:17px;line-height:1.72}
.flow-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;direction:rtl}.flow-card{position:relative;padding:28px 20px 20px;border:1px solid rgba(67,153,255,.42);border-radius:26px;background:linear-gradient(180deg,rgba(7,26,48,.96),rgba(4,17,32,.98));box-shadow:0 28px 70px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.045),0 0 28px rgba(48,123,255,.08);min-height:470px;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}.flow-card:hover{transform:translateY(-7px);border-color:rgba(76,172,255,.72);box-shadow:0 34px 80px rgba(0,0,0,.34),0 0 38px rgba(51,135,255,.14)}
.flow-number{position:absolute;top:-22px;right:50%;transform:translateX(50%);width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:950;color:#bfe7ff;background:#06162a;border:2px solid #45c5ff;box-shadow:0 0 25px rgba(45,183,255,.34)}.flow-card:last-child .flow-number{border-color:#ffd13d;color:#ffd85a;box-shadow:0 0 25px rgba(255,201,38,.25)}
.flow-card h3{text-align:center;font-size:22px;line-height:1.25;margin:12px 0 8px}.flow-card>p{text-align:center;color:#a6b9cc;font-size:13.5px;line-height:1.65;min-height:67px}.flow-media{position:relative;margin-top:18px;height:265px;border-radius:18px;overflow:hidden;border:1px solid rgba(74,164,255,.34);background:linear-gradient(145deg,rgba(12,44,81,.88),rgba(4,18,35,.96));box-shadow:inset 0 0 0 1px rgba(255,255,255,.02),0 12px 34px rgba(0,0,0,.24)}
.flow-media::before,.flow-media::after{content:"";position:absolute;width:28px;height:28px;border-color:#54a9ff;z-index:2}.flow-media::before{top:12px;left:12px;border-top:2px solid;border-left:2px solid}.flow-media::after{right:12px;bottom:12px;border-right:2px solid;border-bottom:2px solid}.flow-media img{width:100%;height:100%;display:block;object-fit:cover;position:relative;z-index:1}.flow-placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#6f90af;font-size:12px;letter-spacing:.02em;padding:20px}.flow-placeholder b{display:block;color:#9bb7d2;font-size:26px;margin-bottom:7px}.flow-arrow{position:absolute;left:-23px;top:58%;font-size:34px;color:#58c9ff;text-shadow:0 0 18px rgba(64,194,255,.55)}.flow-card:first-child .flow-arrow{display:none}
.flow-bottom{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:24px}.flow-benefit{padding:16px 18px;border:1px solid rgba(93,169,255,.16);border-radius:18px;background:rgba(6,23,42,.66);text-align:center}.flow-benefit strong{display:block;font-size:13px}.flow-benefit span{display:block;margin-top:4px;color:#7793ad;font-size:10.5px}
@media(max-width:1120px){.flow-grid{grid-template-columns:1fr 1fr;gap:34px 18px}.flow-arrow{display:none}.flow-bottom{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.learning-flow{padding:78px 15px 84px}.learning-flow h2{font-size:40px;letter-spacing:-1.2px}.flow-lead{font-size:15px}.flow-grid{grid-template-columns:1fr;gap:38px}.flow-card{min-height:auto}.flow-media{height:235px}.flow-bottom{grid-template-columns:1fr 1fr}}
'''
          html = r'''
<!-- PREMIUM LEARNING FLOW -->
<section class="learning-flow" id="learning-flow">
  <div class="flow-inner">
    <div class="flow-kicker">⚙️ דרך פשוטה לתוצאות אמיתיות</div>
    <h2>איך זה <span>עובד בפועל?</span></h2>
    <p class="flow-lead">מעלים שאלה או שיעורי בית, IAKids מבינה את הנושא, מתאימה את ההסבר והתרגול לילד — ועוקבת אחרי ההתקדמות לאורך הדרך.</p>
    <div class="flow-grid">
      <article class="flow-card">
        <div class="flow-number">1</div>
        <h3>מעלים שאלה או צילום</h3>
        <p>מצלמים שיעורי בית, מעלים קובץ או פשוט כותבים שאלה.</p>
        <div class="flow-media"><div class="flow-placeholder"><span><b>▧</b>תמונה תתווסף כאן</span></div><img src="/assets/he2/flow/step-1-upload.webp" alt="העלאת שאלה או צילום" onerror="this.style.display='none'"></div>
      </article>
      <article class="flow-card">
        <div class="flow-number">2</div><span class="flow-arrow">‹</span>
        <h3>המערכת מזהה ומבינה</h3>
        <p>ה־AI מזהה את המקצוע, הנושא וסוג השאלה ומבין איזו עזרה מתאימה.</p>
        <div class="flow-media"><div class="flow-placeholder"><span><b>▧</b>תמונה תתווסף כאן</span></div><img src="/assets/he2/flow/step-2-detect.webp" alt="זיהוי והבנת השאלה" onerror="this.style.display='none'"></div>
      </article>
      <article class="flow-card">
        <div class="flow-number">3</div><span class="flow-arrow">‹</span>
        <h3>הסבר מותאם ותרגול</h3>
        <p>הילד מקבל הסבר ברור שלב אחר שלב, רמזים ותרגול שמתאימים לרמה שלו.</p>
        <div class="flow-media"><div class="flow-placeholder"><span><b>▧</b>תמונה תתווסף כאן</span></div><img src="/assets/he2/flow/step-3-coach.webp" alt="הסבר מותאם ותרגול" onerror="this.style.display='none'"></div>
      </article>
      <article class="flow-card">
        <div class="flow-number">4</div><span class="flow-arrow">‹</span>
        <h3>התקדמות ומעקב הורים</h3>
        <p>המערכת עוקבת אחרי ההבנה וההתקדמות ומציגה להורים תמונה ברורה ועדכנית.</p>
        <div class="flow-media"><div class="flow-placeholder"><span><b>▧</b>תמונה תתווסף כאן</span></div><img src="/assets/he2/flow/step-4-progress.webp" alt="התקדמות ומעקב הורים" onerror="this.style.display='none'"></div>
      </article>
    </div>
    <div class="flow-bottom">
      <div class="flow-benefit"><strong>⭐ מותאם לרמת הילד</strong><span>הסברים ותרגול בקצב האישי</span></div>
      <div class="flow-benefit"><strong>🧠 רמזים במקום תשובות</strong><span>מפתחים חשיבה עצמאית</span></div>
      <div class="flow-benefit"><strong>🕐 זמין בכל רגע</strong><span>בבית, בדרך ומכל מכשיר</span></div>
      <div class="flow-benefit"><strong>📈 בונה ביטחון בלמידה</strong><span>התקדמות שניתן לראות</span></div>
    </div>
  </div>
</section>
'''
          if css_marker not in s:
              s = s.replace('</style>', css + '\n</style>')
          if html_marker not in s:
              s = s.replace('</main>', html + '\n</main>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he2/index.html
          git diff --cached --quiet || git commit -m "Add HE2 premium learning flow section"
          git push
