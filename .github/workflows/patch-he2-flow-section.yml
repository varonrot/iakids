name: Patch HE2 flow section

on:
  push:
    paths:
      - '.github/workflows/patch-he2-flow-section.yml'
      - '.github/scripts/patch_he2_flow.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add premium flow section
        run: python3 .github/scripts/patch_he2_flow.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he2/index.html
          git diff --cached --quiet || git commit -m "Add HE2 premium learning flow section"
          git push
