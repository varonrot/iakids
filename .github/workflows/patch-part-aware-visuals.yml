name: Patch part-aware lesson visuals

on:
  push:
    paths:
      - '.github/workflows/patch-part-aware-visuals.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch lesson visual selection
        shell: python
        run: |
          from pathlib import Path

          path = Path('he/workspace/index.html')
          s = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              'window.CURRENT_LESSON_VISUALS = [];\n\nasync function loadLessonVisuals(',
              'window.CURRENT_LESSON_VISUALS = [];\nwindow.CURRENT_LESSON_VISUAL_PART = 1;\nwindow.CURRENT_DISPLAYED_VISUAL_PART = 0;\n\nasync function loadLessonVisuals(',
              'visual globals'
          )

          replace_once(
              '''              .find(\n                item =>\n                  Number(\n                    item.order\n                  )\n                  ===\n                  Number(\n                    incoming.order\n                  )\n              );''',
              '''              .find(\n                item =>\n                  Number(\n                    item.order\n                  )\n                  ===\n                  Number(\n                    incoming.order\n                  )\n                  &&\n                  Number(\n                    item.part_number || 1\n                  )\n                  ===\n                  Number(\n                    incoming.part_number || 1\n                  )\n              );''',
              'load merge key'
          )

          replace_once(
              '''        window.CURRENT_LESSON_VISUALS\n          .sort(\n            (a,b) =>\n              Number(\n                a.order || 0\n              )\n              -\n              Number(\n                b.order || 0\n              )\n          );''',
              '''        window.CURRENT_LESSON_VISUALS\n          .sort(\n            (a,b) => {\n              const partDiff =\n                Number(a?.part_number || 1)\n                -\n                Number(b?.part_number || 1);\n\n              if(partDiff !== 0){\n                return partDiff;\n              }\n\n              return (\n                Number(a?.order || 0)\n                -\n                Number(b?.order || 0)\n              );\n            }\n          );''',
              'load sort key'
          )

          replace_once(
              '''const currentVisualOrder =\n  Number(\n    window.CURRENT_LESSON_VISUAL_ORDER\n    || 0\n  );\n\n\nif(\n  currentVisualOrder > 0\n){''',
              '''const currentVisualOrder =\n  Number(\n    window.CURRENT_LESSON_VISUAL_ORDER\n    || 0\n  );\n\nconst currentVisualPart =\n  Number(\n    window.CURRENT_LESSON_VISUAL_PART\n    || 1\n  );\n\n\nif(\n  currentVisualOrder > 0\n){''',
              'polling current part'
          )

          replace_once(
              '''        ===\n        currentVisualOrder\n        &&\n        item?.url''',
              '''        ===\n        currentVisualOrder\n        &&\n        Number(\n          item?.part_number || 1\n        )\n        ===\n        currentVisualPart\n        &&\n        item?.url''',
              'polling visual match'
          )

          replace_once(
              '''    const alreadyDisplayedOrder =\n      Number(\n        window.CURRENT_DISPLAYED_VISUAL_ORDER\n        || 0\n      );\n\n\n    if(\n      alreadyDisplayedOrder\n      !==\n      currentVisualOrder\n    ){''',
              '''    const alreadyDisplayedOrder =\n      Number(\n        window.CURRENT_DISPLAYED_VISUAL_ORDER\n        || 0\n      );\n\n    const alreadyDisplayedPart =\n      Number(\n        window.CURRENT_DISPLAYED_VISUAL_PART\n        || 0\n      );\n\n\n    if(\n      alreadyDisplayedOrder\n      !==\n      currentVisualOrder\n      ||\n      alreadyDisplayedPart\n      !==\n      currentVisualPart\n    ){''',
              'displayed visual identity'
          )

          replace_once(
              '''      window.CURRENT_DISPLAYED_VISUAL_ORDER =\n        currentVisualOrder;\n\n\n      showLessonVisual(''',
              '''      window.CURRENT_DISPLAYED_VISUAL_ORDER =\n        currentVisualOrder;\n\n      window.CURRENT_DISPLAYED_VISUAL_PART =\n        currentVisualPart;\n\n\n      showLessonVisual(''',
              'displayed visual part set'
          )

          replace_once(
              '''async function waitForLessonVisual(\n  unitLessonId,\n  session,\n  visualOrder\n){''',
              '''async function waitForLessonVisual(\n  unitLessonId,\n  session,\n  visualOrder,\n  visualPart = Number(\n    window.CURRENT_LESSON_VISUAL_PART || 1\n  )\n){''',
              'wait function signature'
          )

          replace_once(
              '''          ===\n          Number(\n            visualOrder\n          )\n          &&\n          visual?.url\n      );\n\n    if(existing){''',
              '''          ===\n          Number(\n            visualOrder\n          )\n          &&\n          Number(\n            visual?.part_number || 1\n          )\n          ===\n          Number(\n            visualPart\n          )\n          &&\n          visual?.url\n      );\n\n    if(existing){''',
              'wait local match'
          )

          replace_once(
              '''                  ===\n                  incomingOrder\n              );''',
              '''                  ===\n                  incomingOrder\n                  &&\n                  Number(\n                    visual?.part_number || 1\n                  )\n                  ===\n                  Number(\n                    incoming?.part_number || 1\n                  )\n              );''',
              'wait merge key'
          )

          replace_once(
              '''        window.CURRENT_LESSON_VISUALS.sort(\n          (a,b) =>\n            Number(a?.order || 0)\n            -\n            Number(b?.order || 0)\n        );''',
              '''        window.CURRENT_LESSON_VISUALS.sort(\n          (a,b) => {\n            const partDiff =\n              Number(a?.part_number || 1)\n              -\n              Number(b?.part_number || 1);\n\n            if(partDiff !== 0){\n              return partDiff;\n            }\n\n            return (\n              Number(a?.order || 0)\n              -\n              Number(b?.order || 0)\n            );\n          }\n        );''',
              'wait sort key'
          )

          replace_once(
              '''              ===\n              Number(\n                visualOrder\n              )\n              &&\n              visual?.url\n          );\n\n\n        console.log(\n          "VISUAL POLL RESULT:"''',
              '''              ===\n              Number(\n                visualOrder\n              )\n              &&\n              Number(\n                visual?.part_number || 1\n              )\n              ===\n              Number(\n                visualPart\n              )\n              &&\n              visual?.url\n          );\n\n\n        console.log(\n          "VISUAL POLL RESULT:"''',
              'wait requested match'
          )

          replace_once(
              '''  const structuredLesson =\n    data?.structured_lesson;\n\n  if(''',
              '''  const structuredLesson =\n    data?.structured_lesson;\n\n  const activeVisualPart =\n    Number(\n      data?.visual_part_number\n      ||\n      window.CURRENT_LESSON_VISUAL_PART\n      ||\n      1\n    );\n\n  window.CURRENT_LESSON_VISUAL_PART =\n    activeVisualPart;\n\n  if(''',
              'active visual part'
          )

          # Two local visual lookups in runSimpleUniversalLesson: segment + question.
          old = '''      )\n      ===\n      Number(\n        visualOrder\n      )\n      &&\n      visual?.url'''
          new = '''      )\n      ===\n      Number(\n        visualOrder\n      )\n      &&\n      Number(\n        visual?.part_number || 1\n      )\n      ===\n      activeVisualPart\n      &&\n      visual?.url'''
          count = s.count(old)
          if count < 1:
              raise SystemExit(f'run segment local match: expected >=1, found {count}')
          s = s.replace(old, new, 1)

          oldq = '''          ===\n          Number(\n            questionVisualOrder\n          )\n          &&\n          visual?.url'''
          newq = '''          ===\n          Number(\n            questionVisualOrder\n          )\n          &&\n          Number(\n            visual?.part_number || 1\n          )\n          ===\n          activeVisualPart\n          &&\n          visual?.url'''
          replace_once(oldq, newq, 'question local match')

          replace_once(
              '''  await runSimpleUniversalLesson(\n    part2Data\n  );''',
              '''  await runSimpleUniversalLesson(\n    {\n      ...part2Data,\n      visual_part_number: 2\n    }\n  );''',
              'part2 visual marker'
          )

          replace_once(
              '''    const visual =\n      await waitForLessonVisual(\n        resolvedUnitLessonId,\n        session,\n        visualOrder\n      );''',
              '''    const visual =\n      await waitForLessonVisual(\n        resolvedUnitLessonId,\n        session,\n        visualOrder,\n        1\n      );''',
              'initial buffer part1'
          )

          replace_once(
              '''await runSimpleUniversalLesson({\n  ...lessonData,\n  unit_lesson_id: resolvedUnitLessonId\n});''',
              '''await runSimpleUniversalLesson({\n  ...lessonData,\n  unit_lesson_id: resolvedUnitLessonId,\n  visual_part_number: 1\n});''',
              'part1 visual marker'
          )

          path.write_text(s, encoding='utf-8')

      - name: Remove temporary workflow and commit fix
        run: |
          rm .github/workflows/patch-part-aware-visuals.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he/workspace/index.html .github/workflows/patch-part-aware-visuals.yml
          git commit -m "Fix lesson visuals across Part 1 and Part 2"
          git push origin main
