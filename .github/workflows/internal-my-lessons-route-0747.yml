name: Internal My Lessons route 0.7.47
on:
  push:
    paths:
      - '.github/workflows/internal-my-lessons-route-0747.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply internal My Lessons route
        run: python .github/scripts/internal-my-lessons-route-0747.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Route My Lessons internally; bump to 0.7.47'
            git push origin main
          fi
