name: Fix HE2 parents background fullbleed v10

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-he2-parents-bg-fullbleed-v10.py'
      - '.github/workflows/fix-he2-parents-bg-fullbleed-v10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply HE2 parents fullbleed patch
        run: python .github/scripts/fix-he2-parents-bg-fullbleed-v10.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add he2/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make HE2 parents background span full viewport"
          git push origin main
