name: Patch completion layout 0.4.5

on:
  push:
    paths:
      - '.github/workflows/patch-completion-layout-045.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply completion layout refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('he/workspace/lesson-completion.css')
          index_path = Path('he/workspace/index.html')

          css = css_path.read_text(encoding='utf-8')
          index = index_path.read_text(encoding='utf-8')

          marker = '/* COMPLETION LAYOUT 0.4.5 */'
          if marker not in css:
              css += r'''

/* COMPLETION LAYOUT 0.4.5 */
body.lesson-theme-science .lesson-completion-screen{
  grid-template-columns:190px minmax(0,1fr);
  gap:24px;
  padding:26px 30px 22px;
}

body.lesson-theme-science .lesson-completion-teacher img{
  max-width:185px;
}

body.lesson-theme-science .lesson-completion-top{
  grid-template-columns:minmax(0,1fr) 360px;
  gap:22px;
  min-height:145px;
}

body.lesson-theme-science .lesson-completion-kicker{
  font-size:13px;
  margin-bottom:6px;
}

body.lesson-theme-science .lesson-completion-copy h2{
  font-size:31px;
  line-height:1.18;
}

body.lesson-theme-science .lesson-completion-copy p{
  margin-top:7px;
  font-size:14px;
}

body.lesson-theme-science .lesson-completion-meters{
  min-height:128px;
  gap:12px;
  padding:14px;
  border-radius:18px;
}

body.lesson-theme-science .lesson-completion-ring{
  width:78px;
  height:78px;
}

body.lesson-theme-science .lesson-completion-ring::before{
  width:62px;
  height:62px;
}

body.lesson-theme-science .lesson-completion-ring strong{
  font-size:20px;
}

body.lesson-theme-science .lesson-completion-meter span,
body.lesson-theme-science .lesson-completion-stat span{
  font-size:11px;
}

body.lesson-theme-science .lesson-completion-stat strong{
  font-size:24px;
}

body.lesson-theme-science .lesson-completion-divider{
  margin:14px 0 12px;
}

body.lesson-theme-science .lesson-completion-unit-title{
  margin-bottom:13px;
}

body.lesson-theme-science .lesson-completion-unit-title strong{
  font-size:17px;
}

body.lesson-theme-science .lesson-completion-unit-title small{
  font-size:11px;
}

body.lesson-theme-science .lesson-completion-lessons-shell{
  align-items:flex-start;
  padding-top:10px;
}

body.lesson-theme-science .lesson-completion-lessons{
  grid-auto-columns:160px;
  gap:14px;
  padding:6px 5px 14px;
}

body.lesson-theme-science .lesson-completion-card{
  width:160px;
  height:160px;
  padding:14px 13px 12px;
  border-radius:18px;
}

body.lesson-theme-science .lesson-completion-card-number{
  width:31px;
  height:31px;
  border-radius:9px;
  font-size:12px;
  margin-bottom:10px;
}

body.lesson-theme-science .lesson-completion-card-title{
  font-size:13px;
  line-height:1.38;
  -webkit-line-clamp:4;
}

body.lesson-theme-science .lesson-completion-card-status{
  font-size:10px;
}

body.lesson-theme-science .lesson-completion-next-btn{
  min-height:35px;
  margin-top:8px;
  border-radius:10px;
  font-size:11px;
}

body.lesson-theme-science .lesson-completion-tip{
  margin-top:10px;
  padding:8px 12px;
  font-size:10px;
}

@media(max-width:1500px){
  body.lesson-theme-science .lesson-completion-screen{
    grid-template-columns:155px minmax(0,1fr);
    gap:16px;
    padding:18px 20px 15px;
  }

  body.lesson-theme-science .lesson-completion-teacher img{
    max-width:150px;
  }

  body.lesson-theme-science .lesson-completion-top{
    grid-template-columns:minmax(0,1fr) 320px;
    min-height:120px;
  }

  body.lesson-theme-science .lesson-completion-copy h2{
    font-size:26px;
  }

  body.lesson-theme-science .lesson-completion-copy p{
    font-size:13px;
  }

  body.lesson-theme-science .lesson-completion-meters{
    min-height:108px;
    padding:10px;
  }

  body.lesson-theme-science .lesson-completion-ring{
    width:68px;
    height:68px;
  }

  body.lesson-theme-science .lesson-completion-ring::before{
    width:54px;
    height:54px;
  }

  body.lesson-theme-science .lesson-completion-ring strong{
    font-size:18px;
  }

  body.lesson-theme-science .lesson-completion-lessons{
    grid-auto-columns:145px;
    gap:11px;
  }

  body.lesson-theme-science .lesson-completion-card{
    width:145px;
    height:145px;
    padding:12px 11px 10px;
  }

  body.lesson-theme-science .lesson-completion-card-title{
    font-size:12px;
  }
}
'''

          if '0.4.4' not in index:
              raise SystemExit('Build 0.4.4 not found')

          index = index.replace('0.4.4', '0.4.5')

          css_path.write_text(css, encoding='utf-8')
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-completion-layout-045.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/lesson-completion.css he/workspace/index.html .github/workflows/patch-completion-layout-045.yml
          git commit -m 'Enlarge lesson completion layout; build 0.4.5'
          git push
