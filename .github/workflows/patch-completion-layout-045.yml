name: Patch completion layout 0.4.5

on:
  push:
    paths:
      - '.github/workflows/patch-completion-layout-045.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply completion layout refinements
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-completion-layout-045.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add he/workspace/lesson-completion.css he/workspace/index.html .github/workflows/patch-completion-layout-045.yml
          git commit -m 'Enlarge lesson completion layout; build 0.4.5'
          git push
