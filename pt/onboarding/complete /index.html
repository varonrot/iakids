<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Completing setup…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:#f8fafc;
    }
    .box{text-align:center}
  </style>
</head>

<body>
  <div class="box">
    <h2>Finalizando o perfil da criança…</h2>
  </div>

<script>
const sb = supabase.createClient(
  "https://bxnfzuglfwytiyaguwjj.supabase.co",
  "YOUR_ANON_KEY"
);

(async () => {
  console.log("▶ INICIANDO FINALIZAÇÃO");

  /* 1️⃣ get authenticated user */
  const { data: userRes, error: userErr } = await sb.auth.getUser();
  if (userErr || !userRes?.user) {
    console.error("❌ usuário não autenticado", userErr);
    alert("Usuário não autenticado");
    return;
  }

  const userId = userRes.user.id;

  /* 2️⃣ read child data from SESSION STORAGE */
  const child_name = sessionStorage.getItem("child_name");
  const age = Number(sessionStorage.getItem("child_age"));
  const avatar_key = sessionStorage.getItem("child_avatar");

  const usage_goals = JSON.parse(
    sessionStorage.getItem("kid_usage") || "[]"
  );

  const learning_interests = JSON.parse(
    sessionStorage.getItem("learning_interests") || "[]"
  );

  const payload = {
    user_id: userId,
    child_name,
    age,
    avatar_key,
    usage_goals,
    learning_interests
  };

  /* 3️⃣ validate */
  if (!child_name || !age) {
    alert("Dados da criança ausentes");
    return;
  }

  /* 4️⃣ INSERT */
  const { data, error } = await sb
    .from("kids_profiles")
    .insert(payload)
    .select();

  if (error) {
    console.error("❌ erro ao salvar", error);
    alert("Erro ao salvar perfil");
    return;
  }

  /* 5️⃣ cleanup + redirect */
  sessionStorage.setItem("kid_profile_saved", "1");

  // Portuguese workspace
  window.location.replace("/pt/workspace/");

})();
</script>
</body>

</html>
