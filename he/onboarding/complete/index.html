<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>מסיים הגדרה…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:#f8fafc;
    }
    .box{text-align:center}
  </style>
</head>

<body>
  <div class="box">
    <h2>מגדיר את פרופיל הילד…</h2>
  </div>

<script>
const sb = supabase.createClient(
  "https://bxnfzuglfwytiyaguwjj.supabase.co",
  "YOUR_ANON_KEY"
);

(async () => {

  const { data: userRes } = await sb.auth.getUser();
  if (!userRes?.user) {
    alert("לא נמצא משתמש מחובר");
    return;
  }

  const userId = userRes.user.id;

  const child_name = sessionStorage.getItem("child_name");
  const age = Number(sessionStorage.getItem("child_age"));
  const avatar_key = sessionStorage.getItem("child_avatar");

  const usage_goals = JSON.parse(
    sessionStorage.getItem("kid_usage") || "[]"
  );

  const learning_interests = JSON.parse(
    sessionStorage.getItem("learning_interests") || "[]"
  );

  if (!child_name || !age) {
    alert("חסר מידע על הילד");
    return;
  }

  const { error } = await sb
    .from("kids_profiles")
    .insert({
      user_id: userId,
      child_name,
      age,
      avatar_key,
      usage_goals,
      learning_interests
    });

  if (error) {
    alert(error.message);
    return;
  }

  sessionStorage.setItem("kid_profile_saved", "1");

  /* חשוב: redirect לעברית */
  window.location.replace("/he/workspace/");

})();
</script>

</body>
</html>
