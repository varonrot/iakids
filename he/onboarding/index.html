<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ברוכים הבאים ל-KidSaí</title>

<style>
:root{
  --bg1:#f7f4ef;
  --bg2:#eaf4ff;
  --ink:#0b1220;
  --muted:#5b677a;
  --card:#ffffffcc;
  --card2:#ffffff;
  --line:rgba(16,24,40,.10);
  --shadow:0 18px 50px rgba(16,24,40,.12);
  --shadow2:0 10px 26px rgba(16,24,40,.10);
  --radius:18px;

  --accent1:#ff7a66;
  --accent2:#ffb089;
  --accent3:#ff5d4c;

  --pillbg:rgba(255,255,255,.72);
  --pillline:rgba(16,24,40,.10);
  --focus:rgba(255,93,76,.25);
}

*{box-sizing:border-box}
html,body{height:100%}

body{
  margin:0;
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
  color:var(--ink);
  background:
    radial-gradient(800px 500px at 20% 10%, rgba(255,200,170,.35), transparent 60%),
    radial-gradient(900px 600px at 85% 10%, rgba(120,190,255,.30), transparent 62%),
    linear-gradient(90deg, var(--bg1), var(--bg2));
  overflow-x:hidden;
}

.wrap{
  min-height:100%;
  display:flex;
  justify-content:center;
  padding:42px 18px 56px;
}

.container{
  width:min(980px,100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:22px;
  text-align:center;
}

/* ===== TOP BAR ===== */
.top-bar{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.back-link{
  text-decoration:none;
  color:var(--muted);
  font-size:14px;
  font-weight:600;
}
.back-link:hover{ text-decoration:underline; }

.progress{
  text-align:left;
  font-size:13px;
  color:var(--muted);
}
.progress-bar{
  width:140px;
  height:6px;
  background:#e5e7eb;
  border-radius:999px;
  overflow:hidden;
  margin-top:4px;
}
.progress-fill{
  width:25%;
  height:100%;
  background:linear-gradient(135deg,var(--accent3),var(--accent2));
}

/* Mascot */
.mascot{
  width:84px;height:84px;
  border-radius:22px;
  display:grid;
  place-items:center;
  background:
    radial-gradient(26px 26px at 34% 30%, #fff, transparent 60%),
    linear-gradient(160deg, rgba(38,153,255,.26), rgba(255,125,95,.20));
  border:1px solid var(--line);
  box-shadow:var(--shadow2);
}
.mascot::before{
  content:"😊";
  font-size:40px;
}

h1{margin:6px 0 4px;font-size:34px}
.sub{max-width:700px;color:var(--muted);font-size:15px}

/* TESTIMONIALS */
.testi{width:min(760px,100%)}
.cards{
  display:flex;
  gap:14px;
  justify-content:center;
  flex-wrap:wrap;
}
.card{
  width:min(360px,100%);
  background:var(--card2);
  border-radius:var(--radius);
  padding:18px;
  border:1px solid var(--line);
  box-shadow:var(--shadow2);
  text-align:right;
}
.stars{color:#f7b500;font-size:14px}
.quote{font-size:14px;color:#243047}
.by{font-size:13px;color:var(--muted)}

.pager{display:flex;gap:8px;justify-content:center;margin-top:10px}
.p{width:8px;height:8px;border-radius:999px;background:#ccc}
.p.active{width:22px;background:linear-gradient(135deg,var(--accent3),var(--accent2))}

/* FORM */
.form{width:min(620px,100%);text-align:right;margin-top:10px}
.label{font-weight:700;margin-bottom:8px}

input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:2px solid rgba(255,93,76,.35);
  font-size:15px;
}
input:focus{
  outline:none;
  box-shadow:0 0 0 6px var(--focus);
}

.btn{
  width:100%;
  margin-top:12px;
  padding:16px;
  border-radius:999px;
  border:none;
  background:linear-gradient(135deg,var(--accent2),var(--accent1));
  font-weight:800;
  font-size:17px;
  color:#ffffff;
  cursor:pointer;
}

.note{
  margin-top:8px;
  font-size:12px;
  color:var(--muted);
  text-align:center;
}
</style>
</head>

<body>
<main class="wrap">
<section class="container">

<div class="top-bar">
  <a class="back-link" href="/he/">← חזרה לעמוד הבית</a>

  <div class="progress">
    שלב 1 מתוך 4
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>
</div>

<div class="mascot"></div>

<h1>ברוכים הבאים ל-KidSaí!</h1>
<p class="sub">
  חבר בינה מלאכותית בטוח וחינוכי לילדים סקרנים.
  נוצר כדי ללמוד, לשאול ולחקור בביטחון.
</p>

<section class="testi">
  <div class="cards" id="cards"></div>
  <div class="pager">
    <span class="p active"></span>
    <span class="p"></span>
    <span class="p"></span>
    <span class="p"></span>
  </div>
</section>

<section class="form">
  <p class="label">איך קוראים לילד/ה שלך?</p>
  <input id="childName" placeholder="הקלד/י את השם">
  <button class="btn" id="nextBtn">המשך</button>
  <div class="note">
    אנו משתמשים בשם זה רק כדי להתאים אישית את החוויה.
  </div>
</section>

</section>
</main>

<script>
const testimonials = [
  {text:"מרגיש בטוח וחינוכי. מושלם לשיעורי בית וסקרנות יומיומית.",by:"— דניאל ר."},
  {text:"התשובות ברורות ומעודדות להמשיך ללמוד.",by:"— סופיה פ."},
  {text:"הילד שלי שואל ולומד בלי פחד.",by:"— ליאור מ."},
  {text:"מצוין למדעים והיסטוריה בשפה ברורה.",by:"— מרקוס ג."}
];

let page = 0;
const cards = document.getElementById("cards");

function renderTestimonials(){
  const a = testimonials[page % testimonials.length];
  const b = testimonials[(page + 1) % testimonials.length];

  cards.innerHTML = `
    <div class="card">
      <div class="stars">★★★★★</div>
      <p class="quote">${a.text}</p>
      <p class="by">${a.by}</p>
    </div>
    <div class="card">
      <div class="stars">★★★★★</div>
      <p class="quote">${b.text}</p>
      <p class="by">${b.by}</p>
    </div>
  `;
}

setInterval(()=>{ page++; renderTestimonials(); }, 4200);
renderTestimonials();

const input = document.getElementById("childName");
const btn = document.getElementById("nextBtn");

function goNext(){
  const name = input.value.trim();
  if(!name){
    input.focus();
    return;
  }

  sessionStorage.setItem("child_name", name);
  sessionStorage.setItem("onboarding_step", "1");

  window.location.href = "/he/onboarding/preferencias";
}

btn.addEventListener("click", goNext);
input.addEventListener("keydown", (e)=>{ if(e.key==="Enter") goNext(); });
</script>

</body>
</html>
