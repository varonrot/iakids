  function timedReading(container, words, seconds, isPassage, done){

    box.innerHTML = words.map(function(w, i){ return "<span class='wd' data-i='" + i + "'>" + w + "</span>"; }).join(isPassage ? " " : "");
    var bar = container.querySelector(".parent-bar");
    function finish(lastIndex, early){
      clearTimeout(timer);
      var read = lastIndex + 1, errs = 0;
      for (var k = 0; k < read; k++) if (misses[k]) errs++;

      "<div class='words'></div>" +
      "<div class='parent-bar'><span><b>להורה:</b> לחצו על מילה שנקראה לא נכון (נקודה קטנה מתחתיה). בסוף יישמע צליל.</span>" +
      "<button class='ck-btn' type='button' data-early>קרא הכול לפני הצליל</button></div></section>";
    C.speak("קראו את המילים לפי הסדר, טור אחרי טור.");
    timedReading($app, FORMS[run.grade][run.form].list, LIST_SECONDS, false, function(res){
      run.list = {read: res.read, errors: res.errors, correct: Math.max(0, res.read - res.errors), seconds: Math.round(res.seconds), early: res.early};
      passageTask();
    });
  }

  function passageTask(){
    steps(3);
    var easier = run.list.correct < EASIER_BELOW[run.grade];
    var text = FORMS[run.grade][run.form][easier ? "easier" : "regular"];
    $app.innerHTML = "<section class='ck-card'><p class='ck-say' style='text-align:center'>עכשיו סיפור קצר. קראו בקול, כמו שמספרים סיפור.</p>" +
      "<div class='passage-text'></div>" +
      "<div class='parent-bar'><span><b>להורה:</b> סמנו מילים שנקראו לא נכון. אחרי דקה יישמע צליל.</span>" +
      "<button class='ck-btn' type='button' data-early>סיים את הסיפור</button></div></section>";
    C.speak("עכשיו סיפור קצר. קראו בקול, כמו שמספרים סיפור.");
    timedReading($app, tokens(text), PASSAGE_SECONDS, true, function(res){
      var correct = Math.max(0, res.read - res.errors);
      run.passage = {easier: easier, words: tokens(text).length, read: res.read, errors: res.errors, correct: correct,
                     seconds: Math.round(res.seconds), accuracy: res.read ? Math.round(100 * correct / res.read) : 0,
                     wpm: res.seconds ? Math.round(correct / (res.seconds / 60)) : 0};
      prosody();
    });
  }

  function prosody(){
    $app.innerHTML = "<section class='ck-card ck-parent'><div class='ck-tag'>להורה</div><h1>איך נשמעה הקריאה?</h1>" +
      "<p class='ck-note'>הנגנה: קריאה בהטעמה, עם עצירות בנקודות ובפסיקים, ולא מילה־מילה.</p>" +
      "<div class='ck-choice' id='pros'><button type='button' data-v='high'>גבוהה: כמו דיבור</button>" +
      "<button type='button' data-v='mid'>בינונית: חלקים שוטפים וחלקים מקוטעים</button>" +
      "<button type='button' data-v='low'>נמוכה: מילה־מילה</button></div></section>";
    document.querySelectorAll("#pros button").forEach(function(b){
      b.addEventListener("click", function(){ run.prosody = b.dataset.v; run.partial = false; save(); end(); });
    });
  }

  function save(){ C.store.save(kid.id, CHECK_ID, run); }

  function end(){
    steps(4);
    C.childEnd($app, {
      effortLine: "קראת רשימה שלמה וסיפור בקול!",
      strategyLine: "ככה בדיוק מתאמנים בקריאה: קוראים בקול, ובפעם הבאה זה נהיה קל יותר.",
      practiceHref: "/he/games/",
      onDone: function(){ location.href = "/he/diagnostics/"; },
      onReport: report
    });
  }

  function band(correct){
    if (correct >= 48) return "גבוה מהמצופה בתחילת כיתה ג";
    if (correct >= 30) return "בטווח המצופה בתחילת כיתה ג";
    if (correct >= 26) return "מעט מתחת לטווח המצופה בתחילת כיתה ג";
    return "מתחת לטווח המצופה בתחילת כיתה ג";
  }

  function report(){
    var all = C.store.list(kid.id, CHECK_ID).filter(function(x){ return !x.partial && x.grade === run.grade; });
    var r = run, p = r.passage, strengths = [], strengthen = [];
    if (p.accuracy >= 95) strengths.push("דיוק: רוב המילים בסיפור נקראו נכון.");
    else if (p.accuracy >= 85) strengths.push("דיוק טוב בסיפור.");
    else strengthen.push("דיוק: לקרוא לאט יותר ולהסתכל על הניקוד של כל מילה.");
    if (r.prosody === "high") strengths.push("הנגנה: הקריאה נשמעה כמו דיבור.");
    if (r.prosody === "low") strengthen.push("הנגנה: לקרוא שוב את אותו קטע בקול, עד שהוא נשמע כמו סיפור.");
    if (!p.easier && p.read >= p.words) strengths.push("קצב: הסיפור נקרא עד הסוף בתוך הזמן.");
    if (p.easier) strengthen.push("קצב ברשימת המילים: תרגול קצר ויומי של קריאת מילים מנוקדות.");
    if (!strengths.length) strengths.push("קריאה בקול של רשימה שלמה וסיפור, עד הסוף.");
    if (!strengthen.length) strengthen.push("להמשיך לקרוא יחד כמה דקות ביום, ספר עם ניקוד.");
    // Our main comparison is the child against their own earlier checks.
    var tr = C.trend(all.map(function(x){ return x.list && x.list.correct; }), 4);
    var escalate = "";
    if (r.grade === "ג" && all.length >= 2){
      var a = all[all.length - 1], b = all[all.length - 2];
      var weeks = (new Date(a.when) - new Date(b.when)) / 604800000;
      if (a.list.correct < 26 && b.list.correct < 26 && weeks >= 4)
        escalate = "בשתי הבדיקות האחרונות, בהפרש של 4 שבועות לפחות, הקצב ברשימה היה נמוך. כדאי לשתף את המחנכת: בבית הספר עורכים מיפוי שטף בתחילת השנה.";
    }
    var details = "<table>" +
      "<tr><th>רשימת מילים (45 שניות)</th><td>" + r.list.correct + " מילים נכונות מתוך " + r.list.read + " שנקראו</td></tr>" +
      "<tr><th>סיפור" + (p.easier ? " (הגרסה הקלה)" : "") + "</th><td>" + p.correct + " מתוך " + p.read + " נכונות, דיוק " + p.accuracy + "%, כ־" + p.wpm + " מילים נכונות לדקה</td></tr>" +
      "<tr><th>הנגנה (לפי ההורה)</th><td>" + ({high: "גבוהה", mid: "בינונית", low: "נמוכה"}[r.prosody] || "–") + "</td></tr></table>" +
      (r.grade === "ג" ? "<p class='ck-note'>להשוואה גסה בלבד: בכלי השטף של משרד החינוך לכיתה ג, " + r.list.correct + " מילים ב־45 שניות הן " + band(r.list.correct) +
        ". המשרד עצמו מציין שהנורמות לא נבדקו, והרשימה שלנו אינה הרשימה של המשרד.</p>" : "") +
      "<p class='ck-note'>דיוק בסיפור, להשוואה גסה: בכלי המשרד מעל 85% נחשב גבוה, 65–84% בינוני. אחוז הדיוק לבדו לא מספיק, וחשוב לראות אילו מילים נקראו לא נכון.</p>";
    C.parentReport($app, {
      kidId: kid.id, title: "בדיקת שטף קריאה: כיתה " + r.grade + " (גרסה " + (r.form || "A") + ")",
      when: "נבדק ב־" + C.heDate(r.when) + (kid.name ? " · " + kid.name : ""),
      partial: r.partial, strengths: strengths, toStrengthen: strengthen,
      practice: [{label: "משחקי קריאה", href: "/he/games/"}],
      nextCheck: C.heDate(C.addWeeks(r.when, 5)) + " (בעוד כ־5 שבועות)",
      trend: tr, escalate: escalate, detailsHtml: details,
      onAgain: start, onDeleted: function(){ location.href = "/he/diagnostics/"; }
    });
  }

  start();
})();
</script>
</body>
</html>
