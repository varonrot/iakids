<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<script src="/assets/js/iakids-log-mode.js"></script>
<script>if(window.self!==window.top)document.documentElement.classList.add("embedded");</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>בדיקת חשבון בעל פה</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/he/diagnostics/check-shell.css?v=07151.86d85871">
<!--
  Mental-math check (2026-09-24), on the shared check shell. Strands and levels follow what each grade
  learns (new program for א–ג, 2006 program for ד–ו in תשפ"ז). Adaptive: start one level below the
  grade, move up after two correct at a level, stop a strand after 3 misses in a row or 4 of the last 5.
  One item per screen, spoken, answered on a big keypad or "עוד לא יודע/ת". The child never sees
  right/wrong, a clock or a score; response time is recorded silently for the parent's report.
-->
<style>
.q{text-align:center}
.expr{font-size:52px;font-weight:800;direction:ltr;unicode-bidi:isolate;margin:6px 0}
.qtext{font-size:22px;color:#cfe3ff;margin:4px 0 10px}
.answer{font-size:44px;font-weight:800;min-height:64px;direction:ltr;border:2px solid var(--line);border-radius:16px;max-width:220px;margin:0 auto 12px;background:var(--panel2)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(76px,110px));gap:10px;justify-content:center;direction:ltr}
.pad button{font:inherit;font-size:30px;font-weight:800;min-height:76px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
.pad button:active{background:#15325c}
.pad .ok{background:linear-gradient(90deg,var(--cyan),var(--purple));color:#02101f;border:0}
.dontknow{margin-top:12px}
/* question | keypad side by side, so an item never scrolls (user 2026-09-24) */
main .mq{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:48px;row-gap:8px}
main .mq > .mq-side{grid-column:1;grid-row:1}
main .mq > .pad{grid-column:2;grid-row:1 / span 2}
main .mq > .ck-row{grid-column:1;grid-row:2;margin-top:0}
@media (max-width:700px){main .mq{grid-template-columns:1fr}main .mq > *{grid-column:1 !important;grid-row:auto !important}}
.thanks{font-size:24px;color:var(--green);min-height:34px}
</style>
</head>
<body>
<main>
  <a class="ck-back" href="/he/diagnostics/">→ בדיקות ומעקב</a>
  <div class="ck-path" id="path"></div>
  <div id="app"></div>
</main>
<script src="/he/diagnostics/check-shell.js?v=07151.1d74a3b0"></script>
<script>
(function(){
  var C = window.IAKidsCheck, $app = document.getElementById("app"), kid = C.currentKid();
  var CHECK_ID = "math_v1";

  // MATH-START (pure: the gate generates many items per level under node and checks every answer)
  function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(list){ return list[Math.floor(Math.random() * list.length)]; }
  // Each level: name (for the parent), make() -> {say, show, answer}. `show` is the written exercise.
  var STRANDS = {
    numbers: {title: "מבנה עשרוני ומספרים", levels: [
      {name: "המספר שבא אחרי (עד 20)", make: function(){ var n = rnd(3, 18); return {say: "איזה מספר בא אחרי " + n + "?", show: n + " , ?", answer: n + 1}; }},
      {name: "המספר שבא לפני (עד 100)", make: function(){ var n = rnd(21, 99); return {say: "איזה מספר בא לפני " + n + "?", show: "? , " + n, answer: n - 1}; }},
      {name: "עשרות ויחידות", make: function(){ var t = rnd(2, 9), u = rnd(0, 9), n = 10 * t + u; return {say: "כמה עשרות שלמות יש במספר " + n + "?", show: String(n), answer: t}; }},
      {name: "גדול ב־10 או ב־100 (עד 1,000)", make: function(){ var n = rnd(110, 880), d = pick([10, 100]); return {say: "איזה מספר גדול ב־" + d + " מ־" + n + "?", show: n + " + " + d + " = ?", answer: n + d}; }},
      {name: "עיגול לעשרת הקרובה", make: function(){ var n; do { n = rnd(12, 98); } while (n % 10 === 5 || n % 10 === 0); return {say: "עגלו את " + n + " לעשרת הקרובה.", show: n + " ≈ ?", answer: Math.round(n / 10) * 10}; }},
      {name: "ספרת המאות במספר ארבע־ספרתי", make: function(){ var n = rnd(1000, 9999); return {say: "מה ספרת המאות במספר " + n + "?", show: String(n), answer: Math.floor(n / 100) % 10}; }}
    ]},
    addsub: {title: "עובדות החיבור והחיסור וחישוב בעל פה", levels: [
      {name: "חיבור וחיסור עד 10, כולל מספר חסר", make: function(){ var a = rnd(1, 9), b = rnd(1, 10 - a), c = a + b, k = rnd(0, 3);
        if (k === 0) return {say: "כמה זה " + a + " ועוד " + b + "?", show: a + " + " + b + " = ?", answer: c};
        if (k === 1) return {say: "כמה זה " + c + " פחות " + b + "?", show: c + " − " + b + " = ?", answer: a};
        if (k === 2) return {say: "איזה מספר חסר? " + a + " ועוד כמה שווה " + c + "?", show: a + " + ? = " + c, answer: b};
        return {say: "איזה מספר חסר? " + c + " פחות כמה שווה " + a + "?", show: c + " − ? = " + a, answer: b}; }},
      {name: "חיבור וחיסור עד 20, עם מעבר עשרת", make: function(){ var a = rnd(6, 9), b = rnd(11 - a, 9); return Math.random() < .5 ? {say: "כמה זה " + a + " ועוד " + b + "?", show: a + " + " + b + " = ?", answer: a + b} : {say: "כמה זה " + (a + b) + " פחות " + b + "?", show: (a + b) + " − " + b + " = ?", answer: a}; }},
      {name: "עשרות שלמות", make: function(){ var a = rnd(1, 8) * 10, b = rnd(1, (100 - a) / 10) * 10; return Math.random() < .5 ? {say: "כמה זה " + a + " ועוד " + b + "?", show: a + " + " + b + " = ?", answer: a + b} : {say: "כמה זה " + (a + b) + " פחות " + b + "?", show: (a + b) + " − " + b + " = ?", answer: a}; }},
      {name: "דו־ספרתי ועוד חד־ספרתי, עם מעבר עשרת", make: function(){ var t = rnd(1, 8), u = rnd(5, 9), b = rnd(10 - u, 9), a = 10 * t + u; return Math.random() < .5 ? {say: "כמה זה " + a + " ועוד " + b + "?", show: a + " + " + b + " = ?", answer: a + b} : {say: "כמה זה " + (a + b) + " פחות " + b + "?", show: (a + b) + " − " + b + " = ?", answer: a}; }},
      {name: "דו־ספרתי ועוד דו־ספרתי (עד 100)", make: function(){ var a = rnd(15, 59), b = rnd(12, 99 - a); return Math.random() < .5 ? {say: "כמה זה " + a + " ועוד " + b + "?", show: a + " + " + b + " = ?", answer: a + b} : {say: "כמה זה " + (a + b) + " פחות " + b + "?", show: (a + b) + " − " + b + " = ?", answer: a}; }},
      {name: "מאות ועשרות (עד 1,000)", make: function(){ var a = rnd(11, 59) * 10, b = rnd(11, (990 - a) / 10) * 10; return Math.random() < .5 ? {say: "כמה זה " + a + " ועוד " + b + "?", show: a + " + " + b + " = ?", answer: a + b} : {say: "כמה זה " + (a + b) + " פחות " + b + "?", show: (a + b) + " − " + b + " = ?", answer: a}; }}
    ]},
    muldiv: {title: "עובדות הכפל והחילוק", levels: [
      {name: "לוח הכפל של 2, 5 ו־10", make: function(){ var a = pick([2, 5, 10]), b = rnd(1, 10); return {say: "כמה זה " + b + " כפול " + a + "?", show: b + " × " + a + " = ?", answer: a * b}; }},
      {name: "לוח הכפל של 4, וחילוק ב־2, 5 ו־10", make: function(){ if (Math.random() < .5){ var b = rnd(2, 10); return {say: "כמה זה " + b + " כפול 4?", show: b + " × 4 = ?", answer: 4 * b}; } var d = pick([2, 5, 10]), q = rnd(2, 10); return {say: "כמה זה " + (d * q) + " חלקי " + d + "?", show: (d * q) + " : " + d + " = ?", answer: q}; }},
      {name: "לוח הכפל של 3, 6, 7, 8 ו־9", make: function(){ var a = pick([3, 6, 7, 8, 9]), b = rnd(3, 9); return {say: "כמה זה " + b + " כפול " + a + "?", show: b + " × " + a + " = ?", answer: a * b}; }},
      {name: "חילוק בתחום לוח הכפל", make: function(){ var d = rnd(3, 9), q = rnd(3, 9); return {say: "כמה זה " + (d * q) + " חלקי " + d + "?", show: (d * q) + " : " + d + " = ?", answer: q}; }},
      {name: "כפל בעשרות ובמאות", make: function(){ if (Math.random() < .5){ var t = rnd(2, 9) * 10, b = rnd(2, 9); return {say: "כמה זה " + t + " כפול " + b + "?", show: t + " × " + b + " = ?", answer: t * b}; } var n = rnd(12, 99), m = pick([10, 100]); return {say: "כמה זה " + n + " כפול " + m + "?", show: n + " × " + m + " = ?", answer: n * m}; }}
    ]},
    fractions: {title: "חלק של כמות ואחוזים", levels: [
      {name: "חצי ורבע של מספר", make: function(){ if (Math.random() < .5){ var h = rnd(2, 20); return {say: "כמה זה חצי מ־" + (2 * h) + "?", show: "½ × " + (2 * h) + " = ?", answer: h}; } var q = rnd(2, 10); return {say: "כמה זה רבע מ־" + (4 * q) + "?", show: "¼ × " + (4 * q) + " = ?", answer: q}; }},
      {name: "שליש וחמישית של מספר", make: function(){ if (Math.random() < .5){ var t = rnd(2, 10); return {say: "כמה זה שליש מ־" + (3 * t) + "?", show: "⅓ × " + (3 * t) + " = ?", answer: t}; } var f = rnd(2, 10); return {say: "כמה זה חמישית מ־" + (5 * f) + "?", show: "⅕ × " + (5 * f) + " = ?", answer: f}; }},
      {name: "אחוזים פשוטים: 50%, 25% ו־10% מכמות", make: function(){ var k = pick([50, 25, 10]), base = k === 50 ? 2 * rnd(2, 25) : k === 25 ? 4 * rnd(2, 20) : 10 * rnd(2, 20); return {say: "כמה זה " + k + " אחוזים מ־" + base + "?", show: k + "% × " + base + " = ?", answer: base * k / 100}; }},
      {name: "שלושה רבעים ושני שלישים של מספר", make: function(){ if (Math.random() < .5){ var q = rnd(2, 10); return {say: "כמה זה שלושה רבעים מ־" + (4 * q) + "?", show: "¾ × " + (4 * q) + " = ?", answer: 3 * q}; } var t = rnd(2, 10); return {say: "כמה זה שני שלישים מ־" + (3 * t) + "?", show: "⅔ × " + (3 * t) + " = ?", answer: 2 * t}; }}
    ]}
  };
  // Expected level per grade (1-based, the level a child of this grade is taught this year) and
  // which strands the grade gets. From the Ministry programs as summarised in the math subject module.
  var GRADE_PLAN = {
    "א": {numbers: 3, addsub: 3},
    "ב": {numbers: 4, addsub: 5, muldiv: 2},
    "ג": {numbers: 5, addsub: 6, muldiv: 4},
    "ד": {numbers: 6, addsub: 6, muldiv: 5, fractions: 1},
    "ה": {numbers: 6, addsub: 6, muldiv: 5, fractions: 3},
    "ו": {numbers: 6, addsub: 6, muldiv: 5, fractions: 4}
  };
  function startLevel(expected){ return Math.max(1, expected - 1); }
  // MATH-END
  window.IAKidsMathCheck = {STRANDS: STRANDS, GRADE_PLAN: GRADE_PLAN, startLevel: startLevel};

  var PRACTICE = {numbers: [["number-sequence", "סדרות מספרים"], ["number-line-jumps", "ציר המספרים"], ["rounding", "עיגול מספרים"]],
                  addsub: [["missing-number", "השלם את הנעלם"], ["addition-pyramid", "פירמידת חיבור"]],
                  muldiv: [["times-table-race", "אליפות לוח הכפל"], ["multiplication-bingo", "בינגו לוח הכפל"]],
                  fractions: [["fraction-pizza", "פיצת שברים"]]};

  var run = null;

  function start(){
    var g = String(kid.grade || "").replace(/[^אבגדהו]/g, "") || "ב";
    C.progressPath(document.getElementById("path"), 1, 0);
    C.parentGate($app, {
      title: "בדיקת חשבון בעל פה",
      what: "מספרים, חיבור וחיסור, כפל וחילוק ושבר מכמות, לפי מה שנלמד בכיתה. מתחילים מעט מתחת לרמת הכיתה ועולים בהדרגה.",
      minutes: "כ־5–8 דקות",
      get: "עד איזו רמה הילד שולט בכל תחום, מה כדאי לחזק ואיזה משחק מתאים לתרגול.",
      needsMic: false,
      extraHtml: "<p><b>כיתה:</b></p><div class='ck-choice' id='gradePick'>" +
        ["א","ב","ג","ד","ה","ו"].map(function(x){ return "<button type='button' data-g='" + x + "'" + (x === g ? " class='on'" : "") + ">" + x + "</button>"; }).join("") +
        "</div><p class='ck-note'>הילד עונה במקלדת מספרים גדולה, או בכפתור \"עוד לא למדתי\". לא מוצג לו אם צדק.</p>",
      onStart: function(){
        var on = document.querySelector("#gradePick .on");
        var grade = on ? on.dataset.g : g, plan = GRADE_PLAN[grade];
        run = {grade: grade, when: new Date().toISOString(), partial: true, strands: {}, order: Object.keys(plan)};
        C.childIntro($app, "נפתור יחד כמה תרגילים קצרים בראש. אין ציון, ואם עוד לא למדנו משהו, לוחצים על עוד לא למדתי. חושבים בשקט ועונים.", warmup);
      }
    });
    document.querySelectorAll("#gradePick button").forEach(function(b){
      b.addEventListener("click", function(){ document.querySelectorAll("#gradePick button").forEach(function(x){ x.classList.remove("on"); }); b.classList.add("on"); });
    });
  }

  function itemScreen(item, index, total, onAnswer){
    C.progressPath(document.getElementById("path"), total, index);
    var val = "";
    // question and answer on one side, the keypad on the other: the whole item fits without scrolling
    $app.innerHTML = "<section class='ck-card ck-child q'><div class='mq'><div class='mq-side'>" +
      "<div class='expr'>" + C.esc(item.show) + "</div><div class='qtext'>" + C.esc(item.say) + "</div>" +
      "<div class='answer' id='ans'></div><div class='thanks' id='thanks'></div></div>" +
      "<div class='pad' id='pad'>" + ["7","8","9","4","5","6","1","2","3","⌫","0","✓"].map(function(k){
        return "<button type='button' data-k='" + k + "'" + (k === "✓" ? " class='ok' aria-label='אישור'" : k === "⌫" ? " aria-label='מחיקה'" : "") + ">" + k + "</button>"; }).join("") + "</div>" +
      "<div class='ck-row' style='justify-content:center'><button class='ck-btn' type='button' id='replay'>🔊 שוב</button>" +
      "<button class='ck-btn dontknow' type='button' id='dk'>עוד לא למדתי</button></div></div></section>";
    // ראמ"ה: from grade ג the instructions may be read, numbers and symbols are not
    var spoken = "אב".indexOf((run && run.grade) || "א") >= 0 ? item.say : "קראו את השאלה ופתרו בראש.";
    C.speak(spoken);
    var t0 = performance.now(), done = false, ans = document.getElementById("ans");
    function submit(value){
      if (done) return; done = true;
      document.getElementById("thanks").textContent = "תודה! ממשיכים";
      setTimeout(function(){ onAnswer(value, (performance.now() - t0) / 1000); }, 450);
    }
    document.getElementById("pad").addEventListener("click", function(e){
      var b = e.target.closest("button"); if (!b) return;
      var k = b.dataset.k;
      if (k === "⌫") val = val.slice(0, -1);
      else if (k === "✓"){ if (val !== "") submit(parseInt(val, 10)); return; }
      else if (val.length < 5) val += k;
      ans.textContent = val;
    });
    document.getElementById("dk").addEventListener("click", function(){ submit(null); });
    document.getElementById("replay").addEventListener("click", function(){ C.speak(spoken); });
  }

  function warmup(){
    itemScreen({say: "לתרגול: כמה זה 2 ועוד 1?", show: "2 + 1 = ?", answer: 3}, 0, 1, function(){ nextStrand(0); });
  }

  // One strand, adaptive. Two correct at a level moves up; the stop rule ends it; so does the cap.
  function nextStrand(si){
    if (si >= run.order.length){ finish(); return; }
    var key = run.order[si], strand = STRANDS[key], expected = GRADE_PLAN[run.grade][key];
    var cap = "אב".indexOf(run.grade) >= 0 ? 6 : 8;
    var level = startLevel(expected), atLevel = 0, outcomes = [], mastered = level - 1, times = [], items = 0;
    function ask(){
      if (items >= cap || C.shouldStop(outcomes) || level > strand.levels.length){ done(); return; }
      var item = strand.levels[level - 1].make(); items++;
      itemScreen(item, items - 1, cap, function(value, secs){
        var ok = value === item.answer; outcomes.push(ok);
        if (ok){ times.push(secs); atLevel++; if (atLevel >= 2){ mastered = level; level++; atLevel = 0; } }
        ask();
      });
    }
    function done(){
      var s = times.slice().sort(function(a, b){ return a - b; });
      run.strands[key] = {mastered: mastered, expected: expected, items: items, correct: outcomes.filter(Boolean).length,
                          medianSec: s.length ? Math.round(s[Math.floor(s.length / 2)] * 10) / 10 : null};
      nextStrand(si + 1);
    }
    ask();
  }

  function finish(){
    run.partial = false; C.store.save(kid.id, CHECK_ID, run);
    var total = Object.keys(run.strands).reduce(function(a, k){ return a + run.strands[k].items; }, 0);
    C.childEnd($app, {
      effortLine: "פתרת " + total + " תרגילים!",
      strategyLine: "חשבת בראש על כל תרגיל. ככה מתאמנים בחשבון.",
      practiceHref: "/games/",
      onDone: function(){ location.href = "/he/diagnostics/"; },
      onReport: report
    });
  }

  // What the school expects now, in the program's own words (Ministry curriculum; new program א–ג, 2006 ד–ו).
  var EXPECT = {
    "א": "בכיתה א לומדים חיבור וחיסור עד 20 בכל דרך, כולל ספירת המשך, ופירוקים של 10. עדיין לא נדרשת ידיעה אוטומטית.",
    "ב": "בסוף כיתה ב: שליטה מלאה בעובדות החיבור והחיסור עד 20, ולוח הכפל של 2, 4, 5 ו־10.",
    "ג": "בכיתה ג משלימים את לוח הכפל עד 10×10, ולומדים חילוק עם שארית בתחום הלוח ועיגול.",
    "ד": "בכיתה ד: חישוב בעל פה בעשרות ובמאות, חילוק מספר דו־ספרתי בחד־ספרתי, וחלק של כמות.",
    "ה": "בכיתה ה: אומדן, חישוב בעל פה עם שברים, ואחוז כ\"שם אחר למאית\" (50%, 25%, 10%).",
    "ו": "בכיתה ו: ידיעה בעל פה של 50%, 25%, 10% ו־75%, וחישוב אחוזים \"דרך תחנות\"."
  };
  var SCHOOL_CHECKS = {
    "א": "בבית הספר: מבדק \"יסודות\" במתמטיקה, בשלוש פעימות במהלך השנה.",
    "ג": "בבית הספר: מבדק ממוחשב בסוף המחצית הראשונה, ומיפוי בתחילת השנה.",
    "ד": "בבית הספר: מיפוי בתחילת השנה וכלי הערכה פנימיים בדצמבר ובאפריל.",
    "ה": "בבית הספר: מיפוי בתחילת השנה וכלי הערכה פנימיים בדצמבר ובאפריל.",
    "ו": "בבית הספר: כלי הערכה פנימיים, ומבחן תנופה במתמטיקה בסוף השנה."
  };
  // Levels that are basic facts, where speed matters: fast = "שולט", slow = "נכון, עדיין מחשב".
  // Thresholds from Israeli research (not an official norm); no speed criterion in grade א.
  var FACT_LEVELS = {addsub: [1, 2], muldiv: [1, 2, 3, 4]};
  function factState(key, s, grade){
    if (grade === "א" || !(FACT_LEVELS[key] || []).length || s.medianSec == null) return null;
    var limit = "בג".indexOf(grade) >= 0 ? 4 : 3;
    return s.medianSec <= limit ? "שולט" : "נכון, עדיין מחשב";
  }

  function levelName(key, lvl){ var L = STRANDS[key].levels; return lvl >= 1 ? L[Math.min(lvl, L.length) - 1].name : "עוד לא בתחילת התחום"; }

  function report(){
    var r = run, strengths = [], strengthen = [], practice = [], rows = "";
    run.order.forEach(function(k){
      var s = r.strands[k], title = STRANDS[k].title;
      rows += "<tr><th>" + C.esc(title) + "</th><td>שולט עד: " + C.esc(levelName(k, s.mastered)) + "<br><span class='ck-note'>" +
              s.correct + " נכונות מתוך " + s.items + " תרגילים" + (s.medianSec != null ? ", כ־" + s.medianSec + " שניות לתרגיל נכון" : "") + "</span></td></tr>";
      var fs = factState(k, s, r.grade);
      if (s.mastered >= s.expected && fs === "נכון, עדיין מחשב") strengthen.push(title + ": נכון, עדיין מחשב. התשובות נכונות אבל איטיות: כדאי לתרגל עד שהעובדות יהיו בעל פה.");
      else if (s.mastered >= s.expected) strengths.push(title + ": שולט במה שנלמד השנה (" + levelName(k, s.expected) + ").");
      else {
        strengthen.push(title + ": לחזק " + levelName(k, s.mastered + 1) + ".");
        (PRACTICE[k] || []).slice(0, 1).forEach(function(p){ practice.push({label: p[1], href: "/games/" + p[0] + "/"}); });
      }
    });
    if (!strengths.length) strengths.push("עבודה עד הסוף על כל התרגילים, בחשיבה בראש.");
    if (!strengthen.length){ strengthen.push("להמשיך לתרגל בקצב קבוע, כמה דקות ביום."); practice.push({label: "משחקי חשבון", href: "/games/"}); }
    var all = C.store.list(kid.id, CHECK_ID).filter(function(x){ return !x.partial && x.grade === r.grade; });
    var tr = C.trend(all.map(function(x){ return Object.keys(x.strands || {}).reduce(function(a, k){ return a + (x.strands[k].mastered || 0); }, 0); }), 1);
    var escalate = "";
    if (all.length >= 2){
      var a = all[all.length - 1], b = all[all.length - 2], weeks = (new Date(a.when) - new Date(b.when)) / 604800000;
      var low = function(x){ return Object.keys(x.strands).some(function(k){ return x.strands[k].mastered <= x.strands[k].expected - 2; }); };
      if (weeks >= 4 && low(a) && low(b)) escalate = "בשתי הבדיקות האחרונות, בהפרש של 4 שבועות לפחות, תחום אחד היה רחוק ממה שנלמד השנה. כדאי לשתף את המחנכת.";
    }
    C.parentReport($app, {
      kidId: kid.id, title: "בדיקת חשבון בעל פה: כיתה " + r.grade,
      when: "נבדק ב־" + C.heDate(r.when) + (kid.name ? " · " + kid.name : ""),
      partial: r.partial, strengths: strengths, toStrengthen: strengthen, practice: practice,
      nextCheck: C.heDate(C.addWeeks(r.when, 5)) + " (בעוד כ־5 שבועות)",
      trend: tr, escalate: escalate,
      detailsHtml: "<p><b>מה בית הספר מצפה עכשיו:</b> " + C.esc(EXPECT[r.grade] || "") + "</p>" +
        (SCHOOL_CHECKS[r.grade] ? "<p class='ck-note'>" + C.esc(SCHOOL_CHECKS[r.grade]) + "</p>" : "") +
        "<table>" + rows + "</table><p class='ck-note'>זמן התשובה נמדד בלי שהילד רואה. הרף למהירות (עד 4 שניות לעובדה בכיתות ב–ג, עד 3 מכיתה ד) לקוח ממחקר ישראלי ואינו נורמה רשמית.</p>",
      onAgain: start, onDeleted: function(){ location.href = "/he/diagnostics/"; }
    });
  }

  start();
})();
</script>
