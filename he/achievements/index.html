<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="/assets/js/iakids-log-mode.js"></script>
<script src="/assets/js/iakids-api.js?v=3"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ההישגים שלי — iakids</title>
<link rel="icon" href="/assets/favicon.ico">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0f1530;
    --card:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.10);
    --text:#eef2ff;
    --muted:#a8b4d8;
    --accent:#4aa3ff;
    --ok:#46d6a0;
    --warm:#f2bd55;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:
      radial-gradient(1100px 600px at 80% -10%, rgba(74,163,255,.16), transparent 60%),
      var(--bg);
    color:var(--text);
    font:16px/1.55 "Heebo","Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    min-height:100vh;
  }
  a{color:inherit}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 16px 64px}

  .top{
    display:flex;align-items:center;gap:12px;
    margin-bottom:22px;flex-wrap:wrap;
  }
  .back{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--card);border:1px solid var(--line);
    color:var(--text);border-radius:12px;padding:9px 14px;
    font:inherit;font-weight:600;cursor:pointer;text-decoration:none;
  }
  .back:hover{background:rgba(255,255,255,.1)}
  h1{margin:0;font-size:24px;font-weight:800}
  .sub{color:var(--muted);font-size:14px;margin-top:2px}

  .totals{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px}
  .chip{
    background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px 16px;min-width:120px;
  }
  .chip strong{display:block;font-size:22px;line-height:1.2}
  .chip span{color:var(--muted);font-size:13px}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .filters button{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;
  }
  .filters button.active{background:rgba(74,163,255,.18);border-color:rgba(74,163,255,.5);color:var(--text)}

  .group-title{
    margin:22px 0 10px;font-size:14px;color:var(--muted);
    display:flex;align-items:center;gap:8px;
  }
  .group-title::after{content:"";flex:1;height:1px;background:var(--line)}

  .list{display:grid;gap:10px}
  .item{
    display:grid;
    grid-template-columns:1fr auto;
    gap:14px;align-items:center;
    background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:14px 16px;
  }
  .item h3{margin:0 0 3px;font-size:17px;font-weight:700}
  .meta{color:var(--muted);font-size:13px}
  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.10);margin-top:9px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#4aa3ff,#6ad0ff)}
  .item.done .bar i{background:linear-gradient(90deg,#46d6a0,#7ff0c6)}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .state{font-size:13px;font-weight:700}
  .state.done{color:var(--ok)}
  .state.partial{color:var(--warm)}
  .open{
    background:var(--accent);border:0;color:#04122b;border-radius:12px;
    padding:9px 16px;font:inherit;font-weight:800;cursor:pointer;white-space:nowrap;
  }
  .open:hover{filter:brightness(1.08)}

  .empty,.loading{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:28px 20px;text-align:center;color:var(--muted);
  }
  .empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:6px}

  @media(max-width:560px){
    .item{grid-template-columns:1fr;align-items:stretch}
    .right{align-items:stretch;flex-direction:row;justify-content:space-between}
    .open{width:auto}
  }

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
  .card .big{font-size:30px;font-weight:800;line-height:1.15}
  .card .lbl{color:var(--muted);font-size:13px;margin-top:4px}
  .card .ico{font-size:22px;margin-bottom:4px}
  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .badge{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .badge.locked{opacity:.42}
  .badge .b-ico{font-size:24px;flex:0 0 auto}
  .badge strong{display:block;font-size:15px}
  .badge span{color:var(--muted);font-size:12.5px}
</style>
<body>
<div class="wrap">

  <div class="top">
    <a class="back" href="/he/workspace/">← חזרה</a>
    <div>
      <h1>ההישגים שלי</h1>
      <div class="sub" id="sub">טוען…</div>
    </div>
  </div>

  <div id="body"><div class="loading">רגע, סופרים את ההישגים…</div></div>

</div>

<script>
/* =====================================================
   ההישגים שלי — 17/09/2026

   כפתור רביעי בתפריט הצד שמעולם לא היה מאחוריו דף.
   הכול כאן כבר נרשם — שיעורים שהושלמו, ציוני הבנה,
   משחקים — פשוט אף פעם לא נספר והוצג לילד.

   מספר שאי אפשר לחשב פשוט לא מוצג. אפס שנראה ככישלון
   הוא גרוע מכלום.
===================================================== */
const SUPABASE_URL = "https://bxnfzuglfwytiyaguwjj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_L3yZe3EAiTA5lEpDky1eXA_j6ERXAdc";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
iakidsApi.useClient(sb);
const $ = id => document.getElementById(id);

function apiBase(){
  return String(location.hostname||"").endsWith("smarts-brains.online")
    ? location.origin + "/tutor-api" : "https://iakids-ai-tutor-he.onrender.com";
}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function card(ico,big,lbl){ return `<div class="card"><div class="ico">${ico}</div><div class="big">${big}</div><div class="lbl">${esc(lbl)}</div></div>`; }

function badges(d){
  const L = d.lessons||{}, G = d.games||{};
  const list = [
    ["🎓","השיעור הראשון","סיימת שיעור שלם", (L.completed||0) >= 1],
    ["📚","חמישה שיעורים","חמישה שיעורים שהושלמו", (L.completed||0) >= 5],
    ["🧭","שני מקצועות","למדת ביותר ממקצוע אחד", (d.subjects||[]).length >= 2],
    ["⭐","הבנה גבוהה","ציון הבנה 80 ומעלה בשיעור", (L.best_score||0) >= 80],
    ["🎮","שחקן","סיימת משחק", (G.finished||0) >= 1],
    ["🔥","שלושה ימים","למדת בשלושה ימים שונים", (d.active_days||0) >= 3],
  ];
  return list.map(([i,t,s,got]) =>
    `<div class="badge ${got?"":"locked"}"><div class="b-ico">${got?i:"🔒"}</div><div><strong>${esc(t)}</strong><span>${esc(s)}</span></div></div>`
  ).join("");
}

async function load(){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ location.href="/he/"; return; }

    const kid = await iakidsApi.activeKid();
    if(!kid){
      $("sub").textContent="";
      $("body").innerHTML='<div class="empty"><strong>עוד אין פרופיל ילד בחשבון</strong>אפשר להוסיף אחד בפאנל ההורים.</div>';
      return;
    }

    const res = await fetch(apiBase()+"/api/kid/achievements?kid_id="+encodeURIComponent(kid.id),
      { headers:{ Authorization:"Bearer "+session.access_token } });
    if(!res.ok) throw new Error("HTTP "+res.status);
    const d = await res.json();

    $("sub").textContent = "כל מה ש" + esc(d.child_name || "הילד") + " הספיק עד עכשיו";

    const L=d.lessons||{}, G=d.games||{};
    let html = '<div class="cards">';
    html += card("🎓", L.completed||0, "שיעורים שהושלמו");
    html += card("📖", L.opened||0, "שיעורים שהתחלת");
    if(L.best_score != null) html += card("⭐", L.best_score+"%", "ציון ההבנה הגבוה");
    html += card("🧭", (d.subjects||[]).length, "מקצועות");
    if(G.played) html += card("🎮", G.played, "משחקים ששיחקת");
    html += card("📅", d.active_days||0, "ימי למידה");
    html += '</div>';

    if((d.subjects||[]).length){
      html += '<div class="group-title">מה למדת</div><div class="list"><div class="item"><div><h3>'
           + d.subjects.map(esc).join(" • ") + '</h3><div class="meta">אפשר להמשיך מכל מקצוע במסך השיעורים שלי</div></div>'
           + '<div class="right"><button class="open" onclick="location.href=\'/he/my-lessons/\'">לשיעורים</button></div></div></div>';
    }

    html += '<div class="group-title">תגים</div><div class="badges">'+badges(d)+'</div>';

    if((G.recent||[]).length){
      html += '<div class="group-title">המשחקים האחרונים</div><div class="list">';
      G.recent.forEach(g=>{
        const acc = (g.accuracy_percent==null) ? "" : Math.round(g.accuracy_percent)+"% דיוק";
        html += `<div class="item"><div><h3>${esc(g.game)}</h3><div class="meta">${esc(acc)}</div></div>
                 <div class="right"><div class="state ${g.completed?"done":"partial"}">${g.completed?"הושלם":"בתהליך"}</div></div></div>`;
      });
      html += '</div>';
    }

    $("body").innerHTML = html;

  }catch(e){
    console.error("ACHIEVEMENTS FAILED:", e);
    $("sub").textContent="";
    $("body").innerHTML='<div class="empty"><strong>לא הצלחנו לטעון את ההישגים</strong>אפשר לנסות שוב בעוד רגע.</div>';
  }
}
load();
</script>
</body>
</html>
