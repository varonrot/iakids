<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>שליחת שיעורי בית | IAKIDS</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#102a54,#031022 55%,#020914);color:#eef6ff;font-family:Arial,"Heebo",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(520px,100%);border:1px solid rgba(81,163,255,.38);border-radius:28px;background:linear-gradient(180deg,rgba(8,29,61,.98),rgba(3,15,34,.98));box-shadow:0 24px 60px rgba(0,0,0,.38);padding:28px;text-align:center}.logo{font-weight:900;color:#77ddff;margin-bottom:14px}.icon{width:92px;height:92px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;font-size:42px;background:linear-gradient(135deg,#1b71bd,#5838d8);border:1px solid #69d8ff}h1{font-size:28px;margin:0 0 10px}p{color:#9fb5d6;line-height:1.7;margin:0 0 22px}.choice-label{font-size:14px;color:#cfe2ff;font-weight:800;margin:6px 0 8px}.btn{width:100%;height:56px;border:0;border-radius:16px;font-size:17px;font-weight:900;color:#fff;background:linear-gradient(135deg,#1478c9,#6542ee);margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px}.secondary{background:#0d2442;border:1px solid rgba(87,157,239,.34)}.upload-btn{background:linear-gradient(135deg,#1f5f91,#3f3999)}input{display:none}.preview{display:none;width:100%;max-height:48vh;object-fit:contain;border-radius:16px;margin:15px 0;background:#07182b}.file-preview{display:none;margin:15px 0;padding:20px 16px;border:1px solid rgba(86,162,255,.35);border-radius:16px;background:rgba(8,28,55,.78);text-align:center}.file-preview .pdf-icon{font-size:46px;margin-bottom:8px}.file-preview .file-name{font-size:14px;font-weight:850;color:#dcecff;word-break:break-word}.status{margin-top:16px;color:#69dcff;font-weight:800;min-height:24px}.done{display:none}.done .check{font-size:64px;margin-bottom:10px}.actions-after-select{display:none}</style></head><body><main class="card"><div id="capture"><div class="logo">IAKIDS</div><div class="icon">📱</div><h1>שליחת שיעורי הבית למחשב</h1><p>בחרו איך לשלוח את שיעורי הבית. אפשר לצלם עכשיו או לבחור תמונה / PDF שכבר שמורים בטלפון.</p><div class="choice-label" id="choiceLabel">בחרו איך לשלוח</div><input id="camera" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"><input id="filePicker" type="file" accept="image/jpeg,image/png,image/webp,application/pdf,.pdf"><button class="btn" id="openCamera">📷 <span>צלם תמונה</span></button><button class="btn upload-btn" id="openFile">📎 <span>העלה קובץ</span></button><img class="preview" id="preview" alt="תצוגה מקדימה"><div class="file-preview" id="filePreview"><div class="pdf-icon">📄</div><div class="file-name" id="fileName"></div></div><div class="actions-after-select" id="afterSelect"><button class="btn" id="send">שלח למחשב</button><button class="btn secondary" id="again">בחר קובץ אחר</button></div><div class="status" id="status"></div></div><div class="done" id="done"><div class="check">✅</div><h1>נשלח למחשב</h1><p>שיעורי הבית התקבלו. אפשר לחזור למסך הגדול ולהמשיך עם המורה.</p></div></main><script>const token=new URLSearchParams(location.search).get('token');const camera=document.getElementById('camera'),filePicker=document.getElementById('filePicker'),preview=document.getElementById('preview'),filePreview=document.getElementById('filePreview'),fileName=document.getElementById('fileName'),send=document.getElementById('send'),again=document.getElementById('again'),statusEl=document.getElementById('status'),afterSelect=document.getElementById('afterSelect'),openCamera=document.getElementById('openCamera'),openFile=document.getElementById('openFile'),choiceLabel=document.getElementById('choiceLabel');let file=null,lastSource='camera',previewUrl=null;function resetPreview(){if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null}preview.removeAttribute('src');preview.style.display='none';filePreview.style.display='none';afterSelect.style.display='none';openCamera.style.display='flex';openFile.style.display='flex';choiceLabel.style.display='block';statusEl.textContent='';file=null}function showSelected(selected,source){file=selected||null;if(!file)return;lastSource=source||'file';openCamera.style.display='none';openFile.style.display='none';choiceLabel.style.display='none';afterSelect.style.display='block';const isPdf=(String(file.type||'').toLowerCase()==='application/pdf'||/\.pdf$/i.test(String(file.name||'')));if(isPdf){fileName.textContent=file.name||'homework.pdf';filePreview.style.display='block';preview.style.display='none'}else{if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(file);preview.src=previewUrl;preview.style.display='block';filePreview.style.display='none'}}openCamera.onclick=()=>{camera.value='';camera.click()};openFile.onclick=()=>{filePicker.value='';filePicker.click()};camera.onchange=()=>showSelected(camera.files?.[0]||null,'camera');filePicker.onchange=()=>showSelected(filePicker.files?.[0]||null,'file');again.onclick=()=>{resetPreview();if(lastSource==='camera'){camera.value='';camera.click()}else{filePicker.value='';filePicker.click()}};send.onclick=async()=>{if(!token||!file)return;send.disabled=true;send.textContent='שולח...';statusEl.textContent='מעביר את הקובץ למחשב...';try{const fd=new FormData();fd.append('token',token);fd.append('file',file,file.name||'homework.jpg');const r=await fetch('https://bxnfzuglfwytiyaguwjj.supabase.co/functions/v1/homework-capture-upload',{method:'POST',body:fd});if(!r.ok)throw new Error(await r.text());if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null}document.getElementById('capture').style.display='none';document.getElementById('done').style.display='block'}catch(e){console.error(e);statusEl.textContent='לא הצלחנו לשלוח. נסו שוב.';send.disabled=false;send.textContent='שלח למחשב'}};if(!token){statusEl.textContent='הקישור אינו תקין.';openCamera.disabled=true;openFile.disabled=true}</script></body></html>
