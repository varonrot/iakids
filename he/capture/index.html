<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>צילום שיעורי בית | IAKIDS</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#102a54,#031022 55%,#020914);color:#eef6ff;font-family:Arial,"Heebo",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(520px,100%);border:1px solid rgba(81,163,255,.38);border-radius:28px;background:linear-gradient(180deg,rgba(8,29,61,.98),rgba(3,15,34,.98));box-shadow:0 24px 60px rgba(0,0,0,.38);padding:28px;text-align:center}.logo{font-weight:900;color:#77ddff;margin-bottom:14px}.icon{width:92px;height:92px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;font-size:42px;background:linear-gradient(135deg,#1b71bd,#5838d8);border:1px solid #69d8ff}h1{font-size:30px;margin:0 0 10px}p{color:#9fb5d6;line-height:1.7;margin:0 0 22px}.btn{width:100%;height:56px;border:0;border-radius:16px;font-size:18px;font-weight:900;color:#fff;background:linear-gradient(135deg,#1478c9,#6542ee);margin-top:10px}.secondary{background:#0d2442;border:1px solid rgba(87,157,239,.34)}input{display:none}.preview{display:none;width:100%;max-height:55vh;object-fit:contain;border-radius:16px;margin:15px 0;background:#07182b}.status{margin-top:16px;color:#69dcff;font-weight:800;min-height:24px}.done{display:none}.done .check{font-size:64px;margin-bottom:10px}</style></head><body><main class="card"><div id="capture"><div class="logo">IAKIDS</div><div class="icon">📷</div><h1>צלמו את שיעורי הבית</h1><p>פתחו את המצלמה, צלמו את הדף בצורה ברורה ואז לחצו „שלח למחשב”.</p><input id="camera" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"><button class="btn" id="openCamera">פתח מצלמה</button><img class="preview" id="preview" alt="תצוגה מקדימה"><button class="btn" id="send" style="display:none">שלח למחשב</button><button class="btn secondary" id="again" style="display:none">צלם שוב</button><div class="status" id="status"></div></div><div class="done" id="done"><div class="check">✅</div><h1>נשלח למחשב</h1><p>התמונה התקבלה. אפשר לחזור למסך הגדול ולהמשיך עם המורה.</p></div></main><script>const token=new URLSearchParams(location.search).get('token');const input=document.getElementById('camera'),preview=document.getElementById('preview'),send=document.getElementById('send'),again=document.getElementById('again'),statusEl=document.getElementById('status');let file=null;document.getElementById('openCamera').onclick=()=>input.click();again.onclick=()=>{input.value='';input.click()};input.onchange=()=>{file=input.files?.[0]||null;if(!file)return;preview.src=URL.createObjectURL(file);preview.style.display='block';send.style.display='block';again.style.display='block';document.getElementById('openCamera').style.display='none'};send.onclick=async()=>{if(!token||!file)return;send.disabled=true;send.textContent='שולח...';statusEl.textContent='מעביר את התמונה למחשב...';try{const fd=new FormData();fd.append('token',token);fd.append('file',file,file.name||'homework.jpg');const r=await fetch('https://bxnfzuglfwytiyaguwjj.supabase.co/functions/v1/homework-capture-upload',{method:'POST',body:fd});if(!r.ok)throw new Error(await r.text());document.getElementById('capture').style.display='none';document.getElementById('done').style.display='block'}catch(e){console.error(e);statusEl.textContent='לא הצלחנו לשלוח. נסו שוב.';send.disabled=false;send.textContent='שלח למחשב'}};if(!token){statusEl.textContent='הקישור אינו תקין.';document.getElementById('openCamera').disabled=true}</script></body></html>
